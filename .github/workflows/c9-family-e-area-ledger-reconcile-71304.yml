name: C9 Family E Area Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record verified area-selector evidence without stale text matching
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-e-area-ledger-reconcile-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='E' and row['id']=='targeting-selectors')
          assert row['disposition']=='INCOMPLETE'

          implementation='commonPlayOperationRuntime.ts accepts schema-defined area selectors and routes entry-point targeting through resolveCommonPlaySelector with provider-owned/fail-closed area membership'
          production=[
              '0b20e8cae1b04d34b407dcee0e0d24d69b6b90f0 feat(c9): route production targeting through shared selector; portable targeting accepts schema-defined area declarations without fabricating geometry',
              'C9 Family E Area Selector staged verification run 33310249528: 36/36 focused selector/import/production tests, legacy execution boundary, and tsc --noEmit passed for the area bridge later landed as 0b20e8cae1b04d34b407dcee0e0d24d69b6b90f0',
          ]
          if implementation not in row['implementationEvidence']:
              row['implementationEvidence'].append(implementation)
          for evidence in production:
              if evidence not in row['productionEvidence']:
                  row['productionEvidence'].append(evidence)

          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            if [ -f "$workflow" ]; then git rm "$workflow"; fi
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): record verified area selector evidence"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 2
          done
          exit 1
