name: C9 Family H Finalize Ledger 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-h-finalize-ledger-71304.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile latest branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Verify previously tested Family H blobs are unchanged
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD:rules/profiles/dnd.srd-5.2.1.profile.json)" == "baef4977a40a872f47175e87c108c8af2689e1c7" ]]
          [[ "$(git rev-parse HEAD:src/app/commonPlayInterceptorProductionRuntimeAdapter.ts)" == "761f938a68a5a0bca4ddd91189ca6398fcac0e88" ]]
          [[ "$(git rev-parse HEAD:tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts)" == "e2af1e9128219fcfd91dcd87da0f5a8aed6e96a5" ]]
      - name: Patch Family H final evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item.get('family')=='H')
          incomplete='Family H remains incomplete only for rules-derived special-sense acquisition/derivation into authoritative observer sense profiles.'
          complete='Rules-derived Darkvision, Blindsight, Tremorsense, and Truesight acquisition now projects generic RulesProfile sense.<kind>.range-feet properties and Resolver-owned property modifiers into authoritative observer senses through the shared sensing kernel. Family H is complete.'
          if incomplete in row['currentState']:
              row['currentState']=row['currentState'].replace(incomplete,complete)
          elif complete not in row['currentState'] and row.get('disposition')!='IMPLEMENTED':
              raise SystemExit('Family H currentState changed concurrently; refusing stale rewrite')

          implementation='dnd.srd-5.2.1.profile.json sense.<kind>.range-feet properties and commonPlayInterceptorProductionRuntimeAdapter.ts generic runtime profile-property projection derive Darkvision/Blindsight/Tremorsense/Truesight from Resolver Effect modifiers without content identity dispatch'
          if implementation not in row['implementationEvidence']:
              row['implementationEvidence'].append(implementation)
          production='2b79dfc41013b9a20eed4c2ea779df6b922d6d10 and dabe88ee00dd104cf78640bb545d81aef745d487 add RulesProfile sense ranges and production projection; 434ae0ca6ba268c828da91af3660bfe633f74c25 adds the rename-invariant regression; C9 Family H Sense Profile run 33314316843 passed 29/29 targeted property/sensing/production tests, legacy execution boundary, and tsc --noEmit before publishing the regression proof'
          if production not in row['productionEvidence']:
              row['productionEvidence'].append(production)
          identity='installedCommonPlayInterceptorProductionRuntime.test.ts proves RulesProfile-derived Darkvision remains unchanged after external module/content/mechanic/interceptor/interaction/display and sense-source identity rename'
          if identity not in row['identityInvarianceEvidence']:
              row['identityInvarianceEvidence'].append(identity)
          row['remainingNamedSeams']=[]
          row['disposition']='IMPLEMENTED'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish ledger using file-backed API request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=docs/rules/v1-mechanism-coverage-ledger.json
          base_sha="$(git rev-parse HEAD:"$path")"
          remote_sha="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha)"
          [[ "$remote_sha" == "$base_sha" ]] || { echo "concurrent ledger change: base=$base_sha remote=$remote_sha" >&2; exit 1; }
          python3 - "$remote_sha" "$branch" <<'PY'
          import base64,json,sys
          from pathlib import Path
          remote_sha,branch=sys.argv[1],sys.argv[2]
          content=base64.b64encode(Path('docs/rules/v1-mechanism-coverage-ledger.json').read_bytes()).decode('ascii')
          Path('/tmp/ledger-request.json').write_text(json.dumps({
            'message':'docs(c9): finalize Family H coverage',
            'content':content,
            'sha':remote_sha,
            'branch':branch,
          }),encoding='utf-8')
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input /tmp/ledger-request.json >/dev/null
      - name: Retire verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-family-h-finalize-ledger-71304.yml
          sha="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha)"
          jq -n --arg message "ci(c9): retire Family H ledger finalizer" --arg sha "$sha" --arg branch "$branch" '{message:$message,sha:$sha,branch:$branch}' >/tmp/delete-request.json
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" --input /tmp/delete-request.json >/dev/null
