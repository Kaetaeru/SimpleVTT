name: C9 Family Q Choice R10 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r10-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified choice bridge and narrow type boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow=subprocess.check_output([
              'git','show','ef5683e5907db579f9322556545d446a1ff6316e:.github/workflows/c9-family-q-choice-r9-71304.yml'
          ],text=True)
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(code,'q-choice-r9-patch','exec'),{'__name__':'__main__'})

          path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=path.read_text(encoding='utf-8')
          broad='interactionResponse?:{interactionId:string;accepted?:true;selectedIds?:string[]}'
          strict='interactionResponse?:{interactionId:string;accepted:true}|{interactionId:string;selectedIds:string[]}'
          if broad in text:
              text=text.replace(broad,strict)
          elif strict not in text:
              raise SystemExit('choice interaction response type anchor changed')
          old='choiceCandidates!.length<interaction.input.selector.min'
          new='choiceCandidates!.length<(interaction.input.selector.min??0)'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('choice minimum guard anchor changed')
          old='min:interaction.input.selector.min,max:interaction.input.selector.max,'
          new='min:interaction.input.selector.min??0,max:interaction.input.selector.max??choiceCandidates!.length,'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('choice projection bounds anchor changed')
          path.write_text(text,encoding='utf-8')

          path=Path('src/app/connectedSessionWire.ts')
          text=path.read_text(encoding='utf-8')
          start=text.index('function isInterrupt(value:unknown):value is InterruptView {')
          end=text.index('\nfunction isCommonPlayFactRequest',start)
          replacement='''function isInterrupt(value:unknown):value is InterruptView {\n  if(!isRecord(value)) return false;\n  const choice=value.choice;\n  const validChoice=choice===undefined||(isRecord(choice)\n    &&Number.isInteger(choice.min)&&Number(choice.min)>=0\n    &&Number.isInteger(choice.max)&&Number(choice.max)>=Number(choice.min)\n    &&Array.isArray(choice.options)&&choice.options.every((option)=>isRecord(option)&&isString(option.id)&&isString(option.name)\n      &&Object.keys(option).every((key)=>["id","name"].includes(key)))\n    &&Object.keys(choice).every((key)=>["min","max","options"].includes(key)));\n  return isString(value.id)&&isString(value.responderId)&&isString(value.responderName)\n    &&isString(value.trigger)&&isString(value.optionName)&&isString(value.cost)&&isString(value.effect)&&isString(value.source)\n    &&validChoice\n    &&Object.keys(value).every((key)=>["id","responderId","responderName","trigger","optionName","cost","effect","source","choice"].includes(key));\n}\n'''
          text=text[:start]+replacement+text[end:]
          path.write_text(text,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire Q choice staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts src/app/rogueCoreRuntimeAdapter.ts src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts src/app/phase09RealTurnRuntimeAdapter.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-r5-71304.yml .github/workflows/c9-family-q-choice-r6-diagnostic-71304.yml .github/workflows/c9-family-q-choice-r7-71304.yml .github/workflows/c9-family-q-choice-r8-71304.yml .github/workflows/c9-family-q-choice-r9-71304.yml .github/workflows/c9-family-q-choice-r10-71304.yml .github/workflows/c9-family-q-choice-diagnostic-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
