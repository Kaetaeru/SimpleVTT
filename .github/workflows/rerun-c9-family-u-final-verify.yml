name: Rerun C9 Family U Final Verify

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-family-u-final-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family U lifecycle
        run: npx tsx --test tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify production bundle
        run: npx vite build
