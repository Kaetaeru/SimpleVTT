name: C9 Family L Portable Death Save 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-death-save-portable-71304.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Patch portable death-save bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          runtime_path=Path('src/domain/commonPlayOperationRuntime.ts')
          runtime=runtime_path.read_text()
          old='''type CommonPlayLifeStabilize={\n  kind:"life.stabilize";\n  target?:CommonPlayHpTarget;\n};\n'''
          runtime=replace_once(runtime,old,old+'''\ntype CommonPlayLifeDeathSave={\n  kind:"life.death-save";\n};\n''','death-save type')
          runtime=replace_once(runtime,'  |CommonPlayLifeStabilize\n  |CommonPlayMovementDefinition','  |CommonPlayLifeStabilize\n  |CommonPlayLifeDeathSave\n  |CommonPlayMovementDefinition','death-save union')
          runtime=replace_once(runtime,'const LIFE_STABILIZE_KEYS=new Set(["kind","target"]);','const LIFE_STABILIZE_KEYS=new Set(["kind","target"]);\nconst LIFE_DEATH_SAVE_KEYS=new Set(["kind"]);','death-save keys')
          parse_anchor='''  if(operation.kind==="life.stabilize") {\n    supportedKeys(operation,LIFE_STABILIZE_KEYS,label);\n    return {kind:"life.stabilize",...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)})};\n  }\n'''
          runtime=replace_once(runtime,parse_anchor,'''  if(operation.kind==="life.death-save") {\n    supportedKeys(operation,LIFE_DEATH_SAVE_KEYS,label);\n    return {kind:"life.death-save"};\n  }\n'''+parse_anchor,'death-save parser')
          lower_anchor='''    if(operation.kind==="life.stabilize") {\n      operations.push({id:operationId,kind:"stabilize",targetId:hpOperationTarget(operation.target,input)});\n      continue;\n    }\n'''
          runtime=replace_once(runtime,lower_anchor,'''    if(operation.kind==="life.death-save") {\n      if(!input.d20||input.d20.faces.length!==1) throw new DomainEvaluationError("Common Play life.death-save requires exactly one authoritative d20 face");\n      operations.push({\n        id:operationId,kind:"death-save",actorId:input.actorId,\n        dice:{id:`${operationId}:d20`,purpose:`common-play:${supported.id}:${entryPoint.id}:death-save`,sides:20,faces:[input.d20.faces[0]]},\n      });\n      continue;\n    }\n\n'''+lower_anchor,'death-save lowerer')
          runtime_path.write_text(runtime)

          adapter_path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          adapter=adapter_path.read_text()
          adapter=replace_once(adapter,
              '  const d20Faces=entryPoint.test?[internal.d20(actionId,0),internal.d20(actionId,1)]:undefined;\n',
              '  const needsDeathSaveRoll=entryPoint.operations.some((operation)=>operation.kind==="life.death-save");\n  const d20Faces=entryPoint.test?[internal.d20(actionId,0),internal.d20(actionId,1)]:needsDeathSaveRoll?[internal.d20(actionId,0)]:undefined;\n',
              'authoritative death-save die')
          adapter=replace_once(adapter,
              '    ...(entryPoint.test?{d20:{faces:d20Faces!,targetId:selectedTargetId,...(d20ModifierSelection??{})}}:{}),\n',
              '    ...(d20Faces?{d20:{faces:d20Faces,targetId:selectedTargetId,...(d20ModifierSelection??{})}}:{}),\n',
              'death-save d20 payload')
          adapter_path.write_text(adapter)

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=schema_path.read_text()
          op_ref='''        {\n          "$ref": "#/$defs/lifeStabilize"\n        },\n'''
          schema=replace_once(schema,op_ref,op_ref+'''        {\n          "$ref": "#/$defs/lifeDeathSave"\n        },\n''','death-save schema operation')
          definition='''    "lifeStabilize": {\n'''
          death_def='''    "lifeDeathSave": {\n      "type": "object",\n      "required": [\n        "kind"\n      ],\n      "properties": {\n        "kind": {\n          "const": "life.death-save"\n        }\n      },\n      "additionalProperties": false\n    },\n'''
          schema=replace_once(schema,definition,death_def+definition,'death-save schema definition')
          schema_path.write_text(schema)

          test_path=Path('tests/ui/c9FamilyLDeathSaveProduction71304.test.ts')
          test_path.write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { turnRuntimeSessions } from "../../src/app/turnRuntimeSessionRegistry";

          const ACTOR_ID="char.aelar";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`,contentId=`${prefix}.option`,mechanicId=`${prefix}.life`;
            const config={schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[
              {id:"down",invocation:"manual",operations:[{kind:"damage.apply",amount:{value:36},damageType:"force",target:"self"}]},
              {id:"death-save",invocation:"manual",operations:[{kind:"life.death-save"}]},
            ]};
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Portable death-save probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Death Save",locales:{en:{name:"Portable Death Save"}}},mechanics:[{kind:"common-play",config}]}],
            })};
          }

          async function exercise(prefix:string,face:number) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor(ACTOR_ID);
            const action=(entryPointId:string)=>installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId});

            let snapshot=await adapter.resolveAction(action("down"),[ACTOR_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const down=structuredClone(turnRuntimeSessions.get(adapter)!.state.combatants[ACTOR_ID].life);
            assert.equal(down.hp.current,0);
            assert.equal(down.unconscious,true);
            assert.deepEqual(down.deathSaves,{successes:0,failures:0});

            await adapter.setQueuedD20(face);
            snapshot=await adapter.resolveAction(action("death-save"),[ACTOR_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const resolved=structuredClone(turnRuntimeSessions.get(adapter)!.state.combatants[ACTOR_ID].life);
            const durable=(await adapter.getSnapshot()).activeCharacter.durableLifeFlags;
            if(face===1) {
              assert.equal(resolved.deathSaves.failures,2);
              assert.equal(durable?.deathSaves?.failures,2);
            } else if(face===9) {
              assert.equal(resolved.deathSaves.failures,1);
              assert.equal(durable?.deathSaves?.failures,1);
            } else if(face===10) {
              assert.equal(resolved.deathSaves.successes,1);
              assert.equal(durable?.deathSaves?.successes,1);
            } else if(face===20) {
              assert.equal(resolved.hp.current,1);
              assert.equal(resolved.unconscious,false);
              assert.deepEqual(resolved.deathSaves,{successes:0,failures:0});
              assert.equal((await adapter.getSnapshot()).activeCharacter.hp,1);
            }

            await adapter.undoLastResolution();
            assert.deepEqual(turnRuntimeSessions.get(adapter)!.state.combatants[ACTOR_ID].life,down,`Undo must reverse death-save face ${face}`);
            const restored=await adapter.getSnapshot();
            assert.equal(restored.activeCharacter.hp,0);
            assert.deepEqual(restored.activeCharacter.durableLifeFlags?.deathSaves??{successes:0,failures:0},{successes:0,failures:0});
            return resolved;
          }

          test("unknown installed Common Play death saves cover failure, success, natural 1, natural 20, durable write-back, Undo, and identity rename",async()=>{
            const faces=[1,9,10,20];
            const first=[];
            const renamed=[];
            for(const face of faces) first.push(await exercise("external.family-l-death-save",face));
            for(const face of faces) renamed.push(await exercise("renamed.family-l-death-save",face));
            assert.deepEqual(renamed,first);
          });
          ''')

          ledger_path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(ledger_path.read_text())
          row=next(row for row in ledger['rows'] if row['family']=='L')
          row['currentState']=row['currentState'].replace('Portable damage-at-zero is production-proven for unknown and fully renamed external RuleModules, including durable death-save failure write-back and event-native Undo.','Portable damage-at-zero is production-proven for unknown and fully renamed external RuleModules, including durable death-save failure write-back and event-native Undo. Portable death saving throws now execute through the same generic Common Play/Resolver authority with authoritative d20 input, durable life write-back, event-native Undo, natural 1/natural 20 behavior, and external identity rename invariance.')
          evidence='c9FamilyLDeathSaveProduction71304.test.ts proves unknown and renamed installed Common Play life.death-save covers ordinary failure/success, natural 1 double failure, natural 20 revival, durable write-back, and event-native Undo through the shared Resolver death-save operation'
          if evidence not in row['productionEvidence']: row['productionEvidence'].append(evidence)
          identity='c9FamilyLDeathSaveProduction71304.test.ts repeats the complete portable death-save matrix under unrelated external module/content/mechanic identities with identical life-state results'
          if identity not in row['identityInvarianceEvidence']: row['identityInvarianceEvidence'].append(identity)
          row['remainingNamedSeams']=[entry.replace('0 HP/unconscious and stabilization are production-proven; death-save production acceptance remains incomplete','0 HP/unconscious, stabilization, damage-at-zero, and death-save production acceptance are proven') for entry in row['remainingNamedSeams']]
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Generate content
        run: npm run generate:content
      - name: Verify Family L portable death save
        run: node --import tsx --test tests/ui/c9FamilyLDeathSaveProduction71304.test.ts tests/ui/c9FamilyLDamageAtZeroProduction71304.test.ts tests/ui/c9FamilyLStabilizeProduction.test.ts
      - name: Verify coverage structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit landing and retire verifier
        shell: bash
        run: |
          rm .github/workflows/c9-family-l-death-save-portable-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyLDeathSaveProduction71304.test.ts docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-l-death-save-portable-71304.yml
          git commit -m "feat(c9): bridge portable death saving throws"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
