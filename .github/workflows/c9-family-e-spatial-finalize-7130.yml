name: C9 Family E Spatial Finalize 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-spatial-finalize-7130.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family E spatial selector facts
        run: |
          node --import tsx --test \
            tests/ui/c9FamilyESpatialFactProduction.test.ts \
            tests/ui/c9FamilyEConditionSelectorProduction.test.ts \
            tests/ui/c9FamilyETagSelectorProduction.test.ts \
            tests/ui/commonPlayRichSelectorProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Record verified Family E evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path="docs/rules/v1-mechanism-coverage-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(path,"utf8"));
          const family=ledger.rows.find((row)=>row.family==="E");
          if(!family) throw new Error("Family E ledger row missing");
          family.currentState="Portable Common Play targeting preserves bounded selected target sets, evaluates generic predicates over authoritative production candidates, and routes authored automatic selection plus orderBy through the shared selector kernel with Host authority. Unknown installed selectors consume trusted provider/theater-of-mind pairwise distance, sight, adjacency, and Total Cover facts through the same generic candidate path without content identity dispatch. Providerless spatial facts fail closed; reach provider facts, provider-backed area membership, and object/point selection remain incomplete.";
          const add=(field,value)=>{ if(!family[field].includes(value)) family[field].push(value); };
          add("implementationEvidence","installedCommonPlayRuntimeAdapter.ts commonPlaySelectorCandidate consumes authoritativeCommonPlaySpatialRelation and exposes trusted spatial.distance-feet, spatial.adjacent, sense.can-see, and spatial.total-cover selector properties without content identity dispatch");
          add("productionEvidence","c9FamilyESpatialFactProduction.test.ts unknown installed Common Play accepts and rejects targets from authoritative distance/sight/Total Cover facts and fails closed for untrusted provenance");
          add("identityInvarianceEvidence","c9FamilyESpatialFactProduction.test.ts completely renamed external module/content/mechanic/entry/display identities preserve spatial selector semantics");
          family.remainingNamedSeams=["reach provider facts, provider-backed area membership, and object/point selection remain incomplete"];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+"\n");
          NODE
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish verified ledger and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-e-spatial-finalize-7130.yml
          git diff --cached --check
          git commit -m "docs(c9): record Family E spatial selector proof"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content >/dev/null
              node --import tsx --test tests/ui/c9FamilyESpatialFactProduction.test.ts tests/ui/c9FamilyEConditionSelectorProduction.test.ts tests/ui/c9FamilyETagSelectorProduction.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            echo "publish raced with another C9 writer; retry $attempt/5"
          done
          exit 1
