name: C9 Family E Numeric Ordering 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-numeric-ordering-7130.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Preserve numeric selector ordering semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime=Path('src/domain/commonPlaySelectorRuntime.ts')
          text=runtime.read_text(encoding='utf-8')
          old='''      candidates=[...candidates].sort((left,right)=>String(left.properties[property]??"").localeCompare(String(right.properties[property]??""))||left.id.localeCompare(right.id));'''
          new='''      candidates=[...candidates].sort((left,right)=>{\n        const leftValue=left.properties[property];\n        const rightValue=right.properties[property];\n        if(typeof leftValue==="number"&&typeof rightValue==="number") return leftValue-rightValue||left.id.localeCompare(right.id);\n        return String(leftValue??"").localeCompare(String(rightValue??""))||left.id.localeCompare(right.id);\n      });'''
          if text.count(old)!=1:
              raise SystemExit(f'runtime ordering marker mismatch: {text.count(old)}')
          runtime.write_text(text.replace(old,new,1),encoding='utf-8')

          test=Path('tests/domain/commonPlaySelectorRuntime.test.ts')
          text=test.read_text(encoding='utf-8')
          title='test("automatic selector orders numeric properties numerically rather than lexically",()=>{'
          if title not in text:
              addition='''\n\ntest("automatic selector orders numeric properties numerically rather than lexically",()=>{\n  const selector={from:"targets" as const,min:2,max:2,orderBy:"initiative"};\n  const orderedCandidates:CommonPlaySelectorCandidate[]=[\n    {id:"ten",targeting:{id:"ten",kind:"creature",relation:"enemy",cover:"none"},properties:{initiative:10}},\n    {id:"two",targeting:{id:"two",kind:"creature",relation:"enemy",cover:"none"},properties:{initiative:2}},\n  ];\n  const resolved=resolveCommonPlaySelector({sourceId:"hero",selector,candidates:orderedCandidates,selection:"automatic",authority:"host"});\n  assert.equal(resolved.status,"resolved");\n  if(resolved.status==="resolved") assert.deepEqual(resolved.targetIds,["two","ten"]);\n});\n'''
              test.write_text(text.rstrip()+addition,encoding='utf-8')
          PY
      - name: Verify selector ordering slice
        run: npx tsx --test tests/domain/commonPlaySelectorRuntime.test.ts
      - name: Verify boundaries and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified slice and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlaySelectorRuntime.ts tests/domain/commonPlaySelectorRuntime.test.ts
          git commit -m "fix(c9): preserve numeric selector ordering"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git rm .github/workflows/c9-family-e-numeric-ordering-7130.yml
          git commit -m "chore(c9): remove consumed numeric ordering verifier"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
