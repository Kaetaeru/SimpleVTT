name: C9 Family E Area Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile verified Family E area evidence and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_patch() {
            python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in data['mechanismFamilies'] if item['family']=='E')
          row['currentState']=(
            'Portable Common Play targeting preserves bounded selected target sets, evaluates generic predicates over authoritative production candidates, '
            'and routes authored automatic selection plus orderBy through the shared selector kernel with Host authority. Production candidates consume '
            'authoritative Common Play spatial relations for distance, visibility, adjacency, Total Cover, and provider-authored reach without fabricating '
            'geometry. Provider-backed self-origin area membership now executes through the generic production selector path and providerless area membership '
            'continues to fail closed; object/point selection remains incomplete.'
          )
          implementation='installedCommonPlayRuntimeAdapter.ts bridges provider-authored self-origin area membership into generic CommonPlaySelectorCandidate.areaMember without content identity dispatch or Core geometry fabrication'
          production='commonPlayRichSelectorProduction.test.ts proves unknown and fully renamed installed RuleModules consume provider-backed self-origin cone membership, reject non-members, accept members, and preserve identity invariance through production resolveAction'
          identity='commonPlayRichSelectorProduction.test.ts preserves provider-backed self-origin area membership semantics after complete external module/content/mechanic/entry/display rename'
          for key,value in [('implementationEvidence',implementation),('productionEvidence',production),('identityInvarianceEvidence',identity)]:
            if value not in row[key]: row[key].append(value)
          row['remainingNamedSeams']=['object/point selection remains incomplete']
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          }

          for attempt in $(seq 1 20); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
            apply_patch
            rm -f .github/workflows/c9-family-e-area-ledger-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-e-area-ledger-71304.yml
            node scripts/check-v1-mechanism-coverage.mjs
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): record Family E area membership evidence"
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
