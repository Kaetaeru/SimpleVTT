name: C9 Family C Cutting Words Migration V4

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-cutting-words-migration-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and timing boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/c9-family-c-cutting-words-migration-v3.yml').read_text()
          marker='      - name: Apply corrected migration with feature fallback\n        shell: bash\n        run: |\n'
          body=workflow.split(marker,1)[1].split('\n      - name: Verify full Family C production slice',1)[0]
          Path('/tmp/apply_v3.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n')
          PY
          bash /tmp/apply_v3.sh
          python3 <<'PY'
          from pathlib import Path
          path=Path('src/app/commonPlayInterceptorProductionRuntimeAdapter.ts')
          text=path.read_text()
          old='''  restoreInterruptedStage(resolution);\n  if(await offerPassiveReaction(this))return internal.getSnapshot();\n  if(resolution.rollKind==="check")return previousAdvanceResolution.call(this);'''
          new='''  restoreInterruptedStage(resolution);\n  // A response may finish one timing window, but must not enter a later one in the same interaction.\n  // Attack-result remains observable before a damage.rolled interceptor is offered on the next advance.\n  if(pending.kind==="d20"&&resolution.rollKind==="attack")return internal.getSnapshot();\n  if(await offerPassiveReaction(this))return internal.getSnapshot();\n  if(resolution.rollKind==="check")return previousAdvanceResolution.call(this);'''
          if old not in text: raise SystemExit('portable reaction response tail changed')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Verify complete migration slice
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:content
          npx tsx --test tests/domain/commonPlayReactionResourceDieRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts
          npx tsc --noEmit
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/modules/dnd-srd-5.2.1.subclasses/module.json src/app/characterSessionProjection.ts src/domain/commonPlaySpatialFactRuntime.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/offlineRuntimeAdapters.ts tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts
          git add -u src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts
          git diff --cached --check
          git commit -m "feat(common-play): migrate Cutting Words declaratively"
          git push
