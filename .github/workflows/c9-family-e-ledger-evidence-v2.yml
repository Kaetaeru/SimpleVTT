name: C9 Family E Ledger Evidence V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-ledger-evidence-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile verified Family E evidence without overwriting newer state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          entry=next(item for item in data['rows'] if item.get('family')=='E')

          stale_states={
              'One pre-resolved target is bounded PRODUCTION; rich selectors incomplete',
              'Bounded manual target cardinality and relation filters execute generically for unknown installed Common Play; richer predicates, ordering, area/spatial authority, and automatic selection remain incomplete',
          }
          if entry.get('disposition')=='INCOMPLETE' and entry.get('currentState') in stale_states:
              entry['currentState']='Bounded manual target cardinality and relation filters execute generically for unknown installed Common Play; richer predicates, ordering, area/spatial authority, and automatic selection remain incomplete'

          evidence={
              'implementationEvidence':[
                  'commonPlayOperationRuntime.ts bounded min/max selector parsing and relation-matches validation through the generic Common Play operations path',
                  'commonPlaySelectorRuntime.ts generic selector kernel for predicates, ordering, manual/automatic authority, and provider-owned area membership',
              ],
              'productionEvidence':[
                  'installedCommonPlayProductionRuntime.test.ts unknown installed Common Play preserves bounded multi-target selection through production resolution',
                  'installedCommonPlayProductionRuntime.test.ts unknown installed relation selector rejects an ineligible target before commit and accepts an eligible enemy target',
              ],
              'identityInvarianceEvidence':[
                  'installedCommonPlayProductionRuntime.test.ts targeting remains invariant under external identity and display rename',
                  'commonPlayTargetingRuntime.test.ts relation selector uses authoritative relation facts without content identity dispatch',
              ],
              'connectedEvidenceIfRelevant':[
                  'installedCommonPlayProductionRuntime.test.ts connected Common Play targeting remains Host-authoritative and converges through existing targeting ResolutionEvents',
              ],
          }
          for key,values in evidence.items():
              existing=entry.setdefault(key,[])
              for value in values:
                  if value not in existing:
                      existing.append(value)

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify coverage ledger contract
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Commit reconciled evidence and retire temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/c9-family-e-ledger-evidence.yml \
            .github/workflows/c9-family-e-ledger-evidence-v2.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(c9): reconcile verified targeting evidence"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "could not acquire clean fast-forward window" >&2
          exit 1
