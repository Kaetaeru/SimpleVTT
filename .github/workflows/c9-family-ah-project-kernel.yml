name: C9 Family AH Project Kernel

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - src/domain/commonPlayProjectRuntime.ts
      - tests/domain/c9FamilyAHProjectCollaborationRuntime.test.ts
      - tests/domain/commonPlayC6Runtime.test.ts
      - .github/workflows/c9-family-ah-project-kernel.yml
  pull_request:
    paths:
      - src/domain/commonPlayProjectRuntime.ts
      - tests/domain/c9FamilyAHProjectCollaborationRuntime.test.ts
      - tests/domain/commonPlayC6Runtime.test.ts
      - .github/workflows/c9-family-ah-project-kernel.yml

jobs:
  project-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify project progress, collaboration, cancellation, and identity invariance
        run: node --import tsx --test tests/domain/commonPlayC6Runtime.test.ts tests/domain/c9FamilyAHProjectCollaborationRuntime.test.ts
      - name: Verify Gate N coverage boundary
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npm exec tsc -- --noEmit
