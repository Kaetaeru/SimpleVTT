name: C9 Family J Extra Attack 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-extra-attack-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch, verify, and publish portable Extra Attack
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-extra-attack-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing: {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_once(runtime,
          '''export type CommonPlayEconomyPayment={
            kind:"economy";
            bucket:TurnSlot;
            amount:LiteralNumberExpression;
            consumeAt:"commit";
            refundOnCancel:true;
          };''',
          '''export type CommonPlayEconomyPayment={
            kind:"economy";
            bucket:TurnSlot;
            amount:LiteralNumberExpression;
            consumeAt:"commit";
            refundOnCancel:true;
            attacksPerAction?:number;
          };''')
          replace_once(runtime,
          'const ECONOMY_PAYMENT_KEYS=new Set(["kind","bucket","amount","consumeAt","refundOnCancel"]);',
          'const ECONOMY_PAYMENT_KEYS=new Set(["kind","bucket","amount","consumeAt","refundOnCancel","attacksPerAction"]);')
          replace_once(runtime,
          '''    if(payment.refundOnCancel!==true) throw new DomainEvaluationError(`${label}.refundOnCancel must be true for portable Common Play Reaction payment`);
              return {kind:"economy",bucket:payment.bucket,amount,consumeAt:"commit",refundOnCancel:true};''',
          '''    if(payment.refundOnCancel!==true) throw new DomainEvaluationError(`${label}.refundOnCancel must be true for portable Common Play Reaction payment`);
              const attacksPerAction=payment.attacksPerAction;
              if(attacksPerAction!==undefined&&(payment.bucket!=="action"||typeof attacksPerAction!=="number"||!Number.isInteger(attacksPerAction)||attacksPerAction<1)) {
                throw new DomainEvaluationError(`${label}.attacksPerAction must be a positive integer on an action payment`);
              }
              return {kind:"economy",bucket:payment.bucket,amount,consumeAt:"commit",refundOnCancel:true,...(attacksPerAction===undefined?{}:{attacksPerAction})};''')
          replace_once(runtime,
          '''    if(payment.kind==="economy") {
                operations.push({
                  id:`${input.resolutionId}:payment:${index}`,kind:"use-economy",actorId:input.actorId,slot:payment.bucket,
                  bonusActionGranted:payment.bucket==="bonus-action"||undefined,actionKind:input.actionKind,
                });
                continue;
              }''',
          '''    if(payment.kind==="economy") {
                if(payment.attacksPerAction!==undefined&&input.actionKind!=="attack") throw new DomainEvaluationError("attacksPerAction requires an attack action");
                operations.push({
                  id:`${input.resolutionId}:payment:${index}`,kind:"use-economy",actorId:input.actorId,slot:payment.bucket,
                  bonusActionGranted:payment.bucket==="bonus-action"||undefined,actionKind:input.actionKind,
                  ...(payment.attacksPerAction===undefined?{}:{attacksPerAction:payment.attacksPerAction}),
                });
                continue;
              }''')

          adapter='src/app/installedCommonPlayRuntimeAdapter.ts'
          replace_once(adapter,
          '''  const combatant=state.combatants[actorId];
            const slotAvailable=payment?.kind!=="economy"?true:payment.bucket==="action"?combatant.economy.action:payment.bucket==="bonus-action"?combatant.economy.bonusAction:combatant.economy.reaction;''',
          '''  const combatant=state.combatants[actorId];
            const extraAttackAvailable=("test" in entryPoint&&entryPoint.test?.kind==="attack-roll")&&Boolean(combatant.economy.extraAttacks?.length);
            const slotAvailable=payment?.kind!=="economy"?true:payment.bucket==="action"?(combatant.economy.action||extraAttackAvailable):payment.bucket==="bonus-action"?combatant.economy.bonusAction:combatant.economy.reaction;''')

          schema=Path('schemas/common-play-contract.schema.json')
          data=json.loads(schema.read_text(encoding='utf-8'))
          economy=next(entry for entry in data['$defs']['payment']['oneOf'] if entry.get('properties',{}).get('kind',{}).get('const')=='economy')
          economy['properties'].setdefault('attacksPerAction',{'type':'integer','minimum':1})
          schema.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          test_path=Path('tests/ui/c9FamilyJExtraAttackProduction71304.test.ts')
          if not test_path.exists():
              test_path.write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.fighter`;
            const mechanicId=`${prefix}.extra-attack`;
            return {
              moduleId,contentId,mechanicId,
              json:JSON.stringify({
                schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
                rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
                source:{document:"Unknown portable Extra Attack",version:"1",license:"CC0",srdDerived:false},
                dependencies:[],conflicts:[],capabilities:[],content:[{
                  id:contentId,category:"option",
                  presentation:{defaultLocale:"en",originalName:"Portable Multiattack",locales:{en:{name:"Portable Multiattack"}}},
                  mechanics:[{kind:"common-play",config:{
                    schemaVersion:"0.2-draft",id:mechanicId,
                    payments:[{kind:"economy",bucket:"action",amount:{value:1},consumeAt:"commit",refundOnCancel:true,attacksPerAction:2}],
                    entryPoints:[{
                      id:"strike",invocation:"manual",targeting:{from:"targets",min:1,max:1},
                      test:{kind:"attack-roll",roller:"actor",dc:{value:1}},
                      operations:[{kind:"damage.apply",amount:{value:1},damageType:"slashing",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}}],
                    }],
                  }}],
                }],
              }),
            };
          }

          function hp(snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>) {
            return snapshot.scene.entities.find((entry)=>entry.id==="combatant.goblin-a")?.hp;
          }

          async function run(prefix:string) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            let snapshot=await adapter.getSnapshot();
            const actorId=snapshot.activeCharacter.id;
            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"strike",
            });
            const hpBefore=hp(snapshot);

            await adapter.resolveAction(actionId,["combatant.goblin-a"]);
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete");
            assert.equal(hp(snapshot),hpBefore!-1);
            let state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(state.combatants[actorId].economy.action,false);
            assert.equal(state.combatants[actorId].economy.extraAttacks?.length,1,"first Attack Action must grant one portable extra attack");

            await adapter.resolveAction(actionId,["combatant.goblin-a"]);
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete");
            assert.equal(hp(snapshot),hpBefore!-2,"second attack must execute without a second standard Action");
            state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(state.combatants[actorId].economy.extraAttacks?.length,0);

            const revisionAfterSecond=state.revision;
            await adapter.resolveAction(actionId,["combatant.goblin-a"]);
            snapshot=await adapter.getSnapshot();
            assert.equal(hp(snapshot),hpBefore!-2,"third attack must be blocked once the portable attack count is exhausted");
            assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.revision,revisionAfterSecond);

            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            assert.equal(hp(snapshot),hpBefore!-1,"Undo must reverse the second attack damage");
            state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(state.combatants[actorId].economy.extraAttacks?.length,1,"Undo must restore the consumed extra-attack grant");
          }

          test("unknown installed Common Play uses one Action for two structural attacks and restores the second attack on Undo",async()=>{
            await run("external-family-j-extra-attack");
          });

          test("renaming every external identity preserves portable Extra Attack economy",async()=>{
            await run("renamed-family-j-extra-attack");
          });
          ''',encoding='utf-8')
          PY
            npm run generate:content
            node --import tsx --test tests/ui/c9FamilyJExtraAttackProduction71304.test.ts tests/ui/c9FamilyJAmmunitionProduction.test.ts tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJAttackPersistence.test.ts
            node scripts/check-legacy-execution-boundary.mjs
            node scripts/check-v1-mechanism-coverage.mjs
            npm exec tsc -- --noEmit
            python3 - <<'PY'
          import json
          from pathlib import Path
          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          additions={
            'implementationEvidence':'commonPlayOperationRuntime.ts passes structural economy payment attacksPerAction into the existing Resolver use-economy operation; resolutionActionOps.ts grants and consumes attack-only extraAttacks without content identity dispatch, while installedCommonPlayRuntimeAdapter.ts keeps the projected attack available while a grant remains',
            'productionEvidence':'c9FamilyJExtraAttackProduction71304.test.ts proves an unknown installed attack uses one standard Action for two sequential attack transactions, blocks a third attack, restores the consumed extra-attack grant and damage through Undo, and repeats under fully renamed external identities',
            'identityInvarianceEvidence':'c9FamilyJExtraAttackProduction71304.test.ts repeats the complete two-attacks-per-Action economy and Undo flow after complete external module/content/mechanic identity rename',
          }
          for field,value in additions.items():
              if value not in row[field]: row[field].append(value)
          sentence=' Portable Extra Attack economy now composes through structural attacksPerAction into the existing attack-only extraAttacks Resolver primitive, including projected availability, exhaustion, Undo, and complete external identity rename.'
          if sentence.strip() not in row['currentState']:
              row['currentState']=row['currentState'].rstrip()+sentence
          row['remainingNamedSeams']=[seam.replace('multiattack/Extra Attack/replacement','replacement') for seam in row['remainingNamedSeams']]
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            rm -f "$workflow"
            git add -A
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "feat(c9): make Extra Attack economy portable"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
