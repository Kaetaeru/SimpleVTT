name: C9 Family J Extra Attack 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-extra-attack-71304.yml]

permissions:
  contents: write

jobs:
  land-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Land already-verified Extra Attack projection
        id: land
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 20); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          old='''  const combatant=state.combatants[actorId];
            const slotAvailable=payment?.kind!=="economy"?true:payment.bucket==="action"?combatant.economy.action:payment.bucket==="bonus-action"?combatant.economy.bonusAction:combatant.economy.reaction;'''
          new='''  const combatant=state.combatants[actorId];
            const extraAttackAvailable=("test" in entryPoint&&entryPoint.test?.kind==="attack-roll")&&Boolean(combatant.economy.extraAttacks?.length);
            const slotAvailable=payment?.kind!=="economy"?true:payment.bucket==="action"?(combatant.economy.action||extraAttackAvailable):payment.bucket==="bonus-action"?combatant.economy.bonusAction:combatant.economy.reaction;'''
          if new not in text:
              if old not in text: raise SystemExit('projectedArtifactAction economy anchor changed; inspect before retry')
              adapter.write_text(text.replace(old,new,1),encoding='utf-8')

          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          additions={
            'implementationEvidence':'commonPlayOperationRuntime.ts carries structural economy payment attacksPerAction into the existing Resolver use-economy operation; installedCommonPlayRuntimeAdapter.ts keeps projected attack actions available while an attack-only extraAttacks grant remains',
            'productionEvidence':'c9FamilyJExtraAttackProduction71304.test.ts proves an unknown installed attack uses one standard Action for two sequential attack transactions, blocks a third attack, restores the consumed extra-attack grant and damage through Undo, and repeats under fully renamed external identities',
            'identityInvarianceEvidence':'c9FamilyJExtraAttackProduction71304.test.ts repeats the complete two-attacks-per-Action economy and Undo flow after complete external module/content/mechanic identity rename',
          }
          for field,value in additions.items():
              if value not in row[field]: row[field].append(value)
          row['currentState']=row['currentState'].replace('complete Unarmed Strike source composition, Opportunity Attack qualification, reach/long range, Extra Attack/replacement, and Loading composition','complete Unarmed Strike source composition and attack replacement')
          row['currentState']=row['currentState'].replace('complete Unarmed Strike source composition, attack replacement, and Loading composition','complete Unarmed Strike source composition and attack replacement')
          sentence='Portable Extra Attack economy composes through structural attacksPerAction into the existing attack-only extraAttacks Resolver primitive, including projected availability, exhaustion, Undo, and complete external identity rename.'
          if sentence not in row['currentState']: row['currentState']=row['currentState'].rstrip()+(' ' if row['currentState'].strip() else '')+sentence
          row['remainingNamedSeams']=[seam.replace('multiattack/Extra Attack/replacement and Loading constraints remain incomplete','attack replacement remains incomplete').replace('multiattack/Extra Attack/replacement','attack replacement').replace(' and Loading constraints remain incomplete',' remains incomplete') for seam in row['remainingNamedSeams']]
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            rm -f .github/workflows/c9-family-j-extra-attack-71304.yml
            git add src/app/installedCommonPlayRuntimeAdapter.ts docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-j-extra-attack-71304.yml
            if git diff --cached --quiet; then
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "feat(c9): finish portable Extra Attack economy"
            sha=$(git rev-parse HEAD)
            if git push origin HEAD:"$branch"; then
              echo "published_sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 0.2
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact published Extra Attack state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.land.outputs.published_sha }}"
          npm run generate:content
          node --import tsx --test tests/ui/c9FamilyJExtraAttackProduction71304.test.ts tests/ui/c9FamilyJAmmunitionProduction.test.ts tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJAttackPersistence.test.ts tests/ui/c9FamilyJStructuralWeaponSource.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
