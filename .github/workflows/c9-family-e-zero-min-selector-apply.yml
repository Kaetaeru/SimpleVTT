name: C9 Family E Zero-Min Selector Apply

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-zero-min-selector-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reconcile Common Play zero-min target cardinality
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_once(runtime,
              '  if(!Number.isInteger(selector.min)||Number(selector.min)<1) throw new DomainEvaluationError(`${label}.min must be a positive integer for portable Common Play targeting`);',
              '  if(!Number.isInteger(selector.min)||Number(selector.min)<0) throw new DomainEvaluationError(`${label}.min must be a non-negative integer for portable Common Play targeting`);')

          domain=Path('tests/domain/commonPlayTargetingRuntime.test.ts')
          text=domain.read_text(encoding='utf-8')
          old='    [{from:"targets",min:0,max:1},/min must be a positive integer/],'
          new='    [{from:"targets",min:-1,max:1},/min must be a non-negative integer/],'
          if text.count(old)!=1:
              raise SystemExit('domain zero-min invalid fixture changed')
          text=text.replace(old,new,1)
          marker='test("unsupported Common Play selector shapes reject explicitly",()=>{'
          if text.count(marker)!=1:
              raise SystemExit('domain selector insertion marker changed')
          addition='''test("bounded Common Play selector permits an authored zero minimum through the shared targeting Resolver",()=>{\n  const authored=structuredClone(AUTHORED);\n  authored.entryPoints[0].targeting={from:"targets",min:0,max:1};\n  authored.entryPoints[0].operations=[];\n  const definition=parseManualCommonPlayOperationDefinition(authored);\n  assert.deepEqual(definition.entryPoints[0].targeting,{from:"targets",min:0,max:1});\n  const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition,{\n    resolutionId:"external-zero-min-targeting",\n    actorId:"hero",\n    entryPointId:"mend-other",\n    targetingTargets:[],\n  });\n  assert.equal(committed.status,"committed");\n  if(committed.status!=="committed") return;\n  assert.deepEqual((committed.results["external-zero-min-targeting:targeting"] as {targets:Array<{targetId:string}>}).targets,[]);\n});\n\n'''
          domain.write_text(text.replace(marker,addition+marker,1),encoding='utf-8')

          imports='tests/ui/ruleModulePackageImport.test.ts'
          replace_once(imports,
              '    {from:"targets",min:0,max:1},',
              '    {from:"targets",min:-1,max:1},')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E zero-min selector slice
        run: >-
          npx tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified change and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-zero-min-selector-apply.yml
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/ruleModulePackageImport.test.ts
          git commit -m "fix(c9): align Common Play zero-min targeting"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
