name: Apply Phase14 Player Experience Redesign

on:
  push:
    branches:
      - "agent/108-production-play-session-ux"
    paths:
      - "scripts/apply-phase14-player-experience-redesign.mjs"
      - ".github/workflows/apply-phase14-player-experience-redesign.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/108-production-play-session-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: node scripts/apply-phase14-player-experience-redesign.mjs
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git config user.name "Kaetaeru"
          git config user.email "131461278+Kaetaeru@users.noreply.github.com"
          git add src/App.tsx src/main.tsx package.json package-lock.json .github/workflows/ui.yml
          git commit -m "feat(phase14): integrate playable sheet and intent-first play"
          git push origin HEAD:agent/108-production-play-session-ux
