name: C9 Family E Reach Provider 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-reach-provider-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add provider-owned reach fact to production spatial relations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old!r}')
              p.write_text(text.replace(old,new,1))

          replace_once(
              'src/app/spatialRuntimeContracts.ts',
              '  targetCanSeeAttacker:boolean;\n  light?:RuntimeLight;',
              '  targetCanSeeAttacker:boolean;\n  /** Provider-authored reach eligibility; Core must not infer this from distance. */\n  withinReach?:boolean;\n  light?:RuntimeLight;',
          )
          replace_once(
              'src/app/movementRuntimeContracts.ts',
              '  targetCanSeeAttacker:boolean;\n  light?:RuntimeLight;',
              '  targetCanSeeAttacker:boolean;\n  /** Optional reach fact supplied by the owning spatial module. */\n  withinReach?:boolean;\n  light?:RuntimeLight;',
          )
          replace_once(
              'src/app/realSpatialRuntimeService.ts',
              '  if (before.targetCanSeeAttacker!==after.targetCanSeeAttacker) changes.push(`${pair} target-sight ${before.targetCanSeeAttacker} → ${after.targetCanSeeAttacker}`);\n  return changes;',
              '  if (before.targetCanSeeAttacker!==after.targetCanSeeAttacker) changes.push(`${pair} target-sight ${before.targetCanSeeAttacker} → ${after.targetCanSeeAttacker}`);\n  if (before.withinReach!==after.withinReach) changes.push(`${pair} within-reach ${String(before.withinReach)} → ${String(after.withinReach)}`);\n  return changes;',
          )
          replace_once(
              'src/app/installedCommonPlayRuntimeAdapter.ts',
              '        "spatial.total-cover":spatial.cover==="total",\n        "sense.can-see":spatial.visible,\n      }:{}),',
              '        "spatial.total-cover":spatial.cover==="total",\n        "sense.can-see":spatial.visible,\n      }:{}),\n      ...(spatial?.withinReach===undefined?{}:{"spatial.within-reach":spatial.withinReach}),',
          )
          replace_once(
              'src/app/commonPlayInterceptorProductionRuntimeAdapter.ts',
              '      if(query.fact==="spatial.adjacent")return {status:"answered",value:relation.distanceFeet<=5};\n      if(query.fact==="spatial.total-cover")return {status:"answered",value:relation.cover==="total"};',
              '      if(query.fact==="spatial.adjacent")return {status:"answered",value:relation.distanceFeet<=5};\n      if(query.fact==="spatial.within-reach"&&relation.withinReach!==undefined)return {status:"answered",value:relation.withinReach};\n      if(query.fact==="spatial.total-cover")return {status:"answered",value:relation.cover==="total"};',
          )
          PY
      - name: Add unknown RuleModule reach-selector production proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/commonPlayRichSelectorProduction.test.ts')
          text=path.read_text()
          helper='''\nfunction reachPayload(identity:Identity) {\n  const authored=JSON.parse(payload(identity));\n  authored.content[0].mechanics[0].config.entryPoints[0].targeting={\n    from:"targets",min:1,max:1,\n    where:{op:"eq",left:{ref:"spatial.within-reach"},right:{value:true}},\n  };\n  return JSON.stringify(authored);\n}\n\nasync function installReach(adapter:MockAdapter,identity:Identity) {\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(reachPayload(identity));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  return installedCommonPlayActionId({catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),mechanicId:identity.mechanicId,entryPointId:identity.entryPointId});\n}\n'''
          anchor='''async function installAutomatic(adapter:MockAdapter,identity:Identity) {\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(automaticPayload(identity));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  return installedCommonPlayActionId({catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),mechanicId:identity.mechanicId,entryPointId:identity.entryPointId});\n}\n'''
          if helper.strip() not in text:
              if anchor not in text: raise SystemExit('automatic install helper anchor missing')
              text=text.replace(anchor,anchor+helper,1)
          test_block='''\ntest("unknown installed reach selector consumes provider-owned reach without inferring it from distance and survives identity rename",async()=>{\n  async function run(identity:Identity) {\n    const adapter=new MockAdapter();\n    const actionId=await installReach(adapter,identity);\n    const internal=adapter as unknown as {scene:SceneVm};\n    setSpatialRelation(internal.scene,{sourceId:"char.aelar",targetId:"combatant.goblin-a",distanceFeet:10,visible:true,cover:"none",targetCanSeeAttacker:true,withinReach:true,provenance:"module:test-spatial:reach"});\n    setSpatialRelation(internal.scene,{sourceId:"char.aelar",targetId:"combatant.goblin-b",distanceFeet:5,visible:true,cover:"none",targetCanSeeAttacker:true,withinReach:false,provenance:"module:test-spatial:reach"});\n    await adapter.startInitiative();\n    await adapter.setCurrentActor("char.aelar");\n    await adapter.resolveAction(actionId,["combatant.goblin-b"]);\n    let snapshot=await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.finalOutcome,"적용 거부","5ft must not imply reach when the provider explicitly says false");\n    await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n    snapshot=await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.stage,"complete","10ft must be eligible when the provider explicitly says true");\n    assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);\n    return snapshot.resolution?.targetIds;\n  }\n  assert.deepEqual(await run(RENAMED),await run(ORIGINAL));\n});\n'''
          target='''test("unknown installed rich selector consumes provider-backed authoritative spatial distance",async()=>{'''
          if test_block.strip() not in text:
              if target not in text: raise SystemExit('rich selector distance test anchor missing')
              text=text.replace(target,test_block+'\n'+target,1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify reach authority and Gate N boundaries
        run: |
          node --import tsx --test tests/domain/commonPlaySpatialFactRuntime.test.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/c9FamilyGAdjacencyProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Record evidence and publish
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text())
          family=next(item for item in data['rows'] if item['family']=='E')
          family['currentState']=(
            'Portable Common Play targeting preserves bounded selected target sets, evaluates generic predicates over authoritative production candidates, '
            'and routes authored automatic selection plus orderBy through the shared selector kernel with Host authority. Production candidates consume authoritative '
            'Common Play spatial relations for distance, visibility, adjacency, Total Cover, and provider-authored reach without fabricating geometry; providerless '
            'area membership fails closed. Provider-backed area membership and object/point selection remain incomplete.'
          )
          implementation=(
            'SpatialRelationVm and MovementSpatialUpdate carry optional provider-authored withinReach authority; installedCommonPlayRuntimeAdapter.ts projects it as '
            'spatial.within-reach and commonPlayInterceptorProductionRuntimeAdapter.ts answers the same standard fact only when the provider supplied it, never by distance inference'
          )
          production=(
            f'C9 Family E Reach Provider 71304 run {os.environ["RUN_ID"]}: unknown and fully renamed installed RuleModules selected 10ft/withinReach=true and rejected '
            '5ft/withinReach=false through production Common Play; targeted spatial/selector tests, coverage checker, legacy boundary, and tsc --noEmit passed'
          )
          identity=(
            'commonPlayRichSelectorProduction.test.ts provider-owned spatial.within-reach semantics survive complete external module/content/mechanic/entry/display rename '
            'and deliberately disagree with distance to prove no Core reach inference'
          )
          for key,value in (('implementationEvidence',implementation),('productionEvidence',production),('identityInvarianceEvidence',identity)):
              if value not in family[key]: family[key].append(value)
          family['remainingNamedSeams']=['provider-backed area membership and object/point selection remain incomplete']
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-reach-provider-71304.yml
          git add src/app/spatialRuntimeContracts.ts src/app/movementRuntimeContracts.ts src/app/realSpatialRuntimeService.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts tests/ui/commonPlayRichSelectorProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): route provider-owned reach through selectors"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1
