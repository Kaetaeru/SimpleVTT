name: C9 Runtime Type Narrowing Fix

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/rerun-c9-type-narrowing-fix.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply remaining bounded type-narrowing fixes
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replace(path,from,to){
            let text=fs.readFileSync(path,'utf8');
            if(!text.includes(from)) throw new Error(`expected text missing in ${path}`);
            text=text.replace(from,to);
            fs.writeFileSync(path,text);
          }
          const undoTail='if(change.kind==="death-save")return {...structuredClone(change),before:change.after,after:change.before};\n      return {...structuredClone(change),before:change.after,after:change.before};';
          const narrowedTail='if(change.kind==="death-save")return {...structuredClone(change),before:change.after,after:change.before};\n      if(change.kind==="turn-clock")return {...structuredClone(change),before:structuredClone(change.after),after:structuredClone(change.before)};\n      if(change.kind==="life")return {...structuredClone(change),before:change.after,after:change.before};\n      return change;';
          replace('src/app/connectedActionRoutingAdapter.ts',undoTail,narrowedTail);
          replace('src/domain/commonPlayEffectRuntime.ts','  if(template.lifetime.kind==="until-event") {','  const lifetime=template.lifetime;\n  if(lifetime.kind==="until-event") {');
          replace('src/domain/commonPlayEffectRuntime.ts','    assertOnlyKeys(template.lifetime,["kind","event","onEnd"],`${label} lifetime`);','    assertOnlyKeys(lifetime,["kind","event","onEnd"],`${label} lifetime`);');
          replace('src/domain/commonPlayEffectRuntime.ts','    if ((template.lifetime.event!=="damage.taken"&&template.lifetime.event!=="damage.dealt")||template.lifetime.onEnd!=="destroy") {','    if ((lifetime.event!=="damage.taken"&&lifetime.event!=="damage.dealt")||lifetime.onEnd!=="destroy") {');
          replace('src/domain/commonPlayEffectRuntime.ts','    if(template.rules.some((rule)=>rule.event!==template.lifetime.event||ruleFrequency(rule)!=="once")) {','    if(template.rules.some((rule)=>rule.event!==lifetime.event||ruleFrequency(rule)!=="once")) {');
          replace('src/domain/commonPlayEffectRuntime.ts','    assertOnlyKeys(template.lifetime,["kind","onEnd"],`${label} lifetime`);','    assertOnlyKeys(lifetime,["kind","onEnd"],`${label} lifetime`);');
          replace('src/domain/commonPlayEffectRuntime.ts','    if(template.lifetime.kind!=="until-duration"||template.lifetime.onEnd!=="destroy") {','    if(lifetime.kind!=="until-duration"||lifetime.onEnd!=="destroy") {');
          replace('src/app/realActivityProjectionService.ts','  if (change.kind==="turn-clock") return `${change.targetId} turn-clock ${change.before.turnIndex} → ${change.after.turnIndex}`;','  if (change.kind==="turn-clock") return `${change.targetId} turn-clock ${JSON.stringify(change.before)} → ${JSON.stringify(change.after)}`;');
          replace('src/app/resolutionEventUndo.ts','      return {...structuredClone(change),before:change.after,after:change.before};\n    }),','      return change;\n    }),');
          NODE
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify focused C9 production slices
        run: npx tsx --test tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts tests/ui/connectedTurnResolutionEventTransport.test.ts tests/ui/connectedDamageDealtTriggerProduction.test.ts
      - name: Capture TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > c9-typecheck.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat c9-typecheck.txt
          exit 0
      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: c9-runtime-typecheck
          path: c9-typecheck.txt
      - name: Require TypeScript success
        run: test "${{ steps.typecheck.outputs.status }}" = "0"
      - name: Verify production bundle
        run: npx vite build
      - name: Commit verified source fix
        run: |
          git config user.name "Kaetaeru"
          git config user.email "131461278+Kaetaeru@users.noreply.github.com"
          git add src/app/connectedActionRoutingAdapter.ts src/domain/commonPlayEffectRuntime.ts src/app/realActivityProjectionService.ts src/app/resolutionEventUndo.ts
          git commit -m "fix(c9): close runtime typecheck drift"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
