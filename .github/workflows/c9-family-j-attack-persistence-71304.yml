name: C9 Family J Attack Persistence 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - tests/ui/c9FamilyJAttackPersistence.test.ts
      - .github/workflows/c9-family-j-attack-persistence-71304.yml

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family J durable attack route
        run: >-
          npx tsx --test
          tests/ui/c9FamilyJAttackPersistence.test.ts
          tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - name: Verify execution boundary and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish Family J persistence evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 20); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          from pathlib import Path
          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          text=path.read_text(encoding="utf-8")
          start=text.index('"family": "J"')
          end=text.index('"family": "K"',start)
          segment=text[start:end]
          entry="c9FamilyJAttackPersistence.test.ts unknown installed attack damage persists to the Character library through restart and Undo restores the durable HP state"
          if entry not in segment:
              lines=segment.splitlines()
              key=next(i for i,line in enumerate(lines) if '"persistenceEvidenceIfRelevant": [' in line)
              close=next(i for i in range(key+1,len(lines)) if lines[i].strip()=="],")
              if close>key+1:
                  lines[close-1]=lines[close-1].rstrip()+"," if not lines[close-1].rstrip().endswith(",") else lines[close-1]
              lines.insert(close,f'        "{entry}"')
              segment="\n".join(lines)+("\n" if segment.endswith("\n") else "")
              text=text[:start]+segment+text[end:]
              path.write_text(text,encoding="utf-8")
          PY
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git rm -f .github/workflows/c9-family-j-attack-persistence-71304.yml
            git commit -m "docs(c9): record Family J attack persistence" || exit 0
            node scripts/check-v1-mechanism-coverage.mjs
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
