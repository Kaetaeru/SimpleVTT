name: C9 Family X Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-x-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile with latest branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - name: Record verified Family X vertical slice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='X')
          row['currentState']='Durable inventory authority exists and unknown external Common Play item quantity payment now executes through the canonical Resolver item-as-resource event bridge with durable Character write-back, restart persistence, event-native Undo, and full external identity rename invariance. Generic create/grant/copy, broader item mutation/equipment ownership, item-owned action/effect/spellcasting, transfer, and connected lifecycle remain incomplete.'
          row['disposition']='INCOMPLETE'
          row['implementationEvidence']=[
            'commonPlayOperationRuntime.ts CommonPlayItemPayment selector/quantity commit contract lowers portable item payment through canonical payment operations',
            'installedCommonPlayRuntimeAdapter.ts itemPaymentRuntimeContext resolves exactly one durable ItemInstance by portable definitionId and seeds an ephemeral phase09:item:<id>:quantity Resolver resource without content identity dispatch',
            'realEventApplyService.ts projects canonical phase09:item pseudo-resource state changes back into ItemInstance quantity/charges',
            'resolutionCharacterDurableProjection.ts applies the same item pseudo-resource state changes to durable Character inventory for forward and inverse write-back',
            'characterLibraryPersistence.ts stores ItemInstance quantity/equipment/attunement/charge runtime state separately from source item references'
          ]
          row['productionEvidence']=[
            '8b83ad86bd43fc35a512611bcd2d6b7f54de716a test(c9): prove portable item payment persistence',
            'tests/ui/c9FamilyXPortableItemPaymentProduction.test.ts unknown installed Common Play consumes one matching inventory stack through production resolveAction, durable write-back, fresh restart, and event-native Undo',
            'C9 Family X Portable Item Payment 71304 run 33317994606: Family X production test, V1 coverage checker, and tsc --noEmit all pass; the run later fails only on concurrent legacy-boundary baseline drift outside Family X'
          ]
          row['identityInvarianceEvidence']=[
            'tests/ui/c9FamilyXPortableItemPaymentProduction.test.ts repeats the full consume/persist/restart/Undo proof after complete external module/content/mechanic identity rename'
          ]
          row['connectedEvidenceIfRelevant']=[]
          row['persistenceEvidenceIfRelevant']=[
            'tests/ui/c9FamilyXPortableItemPaymentProduction.test.ts MemoryCharacterLibraryStore preserves consumed quantity into a fresh adapter and preserves restored quantity after event-native Undo',
            'characterLibraryPersistence.ts projects item quantity/equipped/wielded/attuned/charge current into CharacterRuntimeDurableSnapshotV1'
          ]
          row['remainingNamedSeams']=[
            'generic create/grant/copy and destroy/update item lifecycle beyond quantity payment',
            'generic charges/recharge, equip/unequip/wield, containers, and owner transfer',
            'generic item-owned actions/effects/spellcasting activation',
            'connected item lifecycle replay/reconnect/retry acceptance',
            'named item/spell activation compatibility paths'
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish ledger checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-x-ledger-71304.yml
          git commit -m "docs(c9): record portable item payment coverage"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
