name: C9 Family E Targeting Replay Evidence R4

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-e-targeting-replay-evidence-r4.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch replay evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tests/ui/installedCommonPlayProductionRuntime.test.ts')
          text=p.read_text(encoding='utf-8')
          if 'retrying the same authoritative targeting event must be idempotent' not in text:
              start=text.index('connected Common Play targeting remains Host-authoritative and converges through existing events')
              needle='assert.deepEqual(clientSnapshot.resolution?.targetIds,["combatant.goblin-a"]);'
              pos=text.index(needle,start)+len(needle)
              extra='''

  assert.equal((await applyConnectedClientEvents(client,batch.events)).status,"duplicate","retrying the same authoritative targeting event must be idempotent");
  const retrySnapshot=await client.getSnapshot();
  assert.equal(retrySnapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp,hostHp);
  assert.deepEqual(retrySnapshot.resolution?.targetIds,["combatant.goblin-a"]);

  const reconnected=new MockAdapter();
  await installTargeting(reconnected);
  injureSceneEntity(reconnected,"combatant.goblin-a",10);
  await reconnected.startInitiative();
  await reconnected.setCurrentActor("char.aelar");
  const reconnectState=connectedStateFor(reconnected);
  reconnectState.mode="client";
  reconnectState.sessionId=sessionId;
  reconnectState.replica=new ClientSessionReplica(sessionId);
  assert.equal((await applyConnectedClientEvents(reconnected,batch.events)).status,"applied","a fresh reconnect replica must accept authoritative targeting history from cursor zero");
  const reconnectSnapshot=await reconnected.getSnapshot();
  assert.equal(reconnectSnapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp,hostHp);
  assert.equal(reconnectSnapshot.resolution?.actionId,actionId);
  assert.deepEqual(reconnectSnapshot.resolution?.targetIds,["combatant.goblin-a"]);
  assert.equal((await applyConnectedClientEvents(reconnected,batch.events)).status,"duplicate","reconnect catch-up retry must not apply targeting effects twice");
  assert.equal((await reconnected.getSnapshot()).scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp,hostHp);'''
              p.write_text(text[:pos]+extra+text[pos:],encoding='utf-8')

          lp=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(lp.read_text(encoding='utf-8'))
          row=next(entry for entry in ledger['rows'] if entry['family']=='E')
          evidence='tests/ui/installedCommonPlayProductionRuntime.test.ts: connected Common Play targeting remains Host-authoritative and converges through existing events; the same event batch is duplicate-idempotent and a fresh ClientSessionReplica replays it from cursor zero to the same HP and targetIds'
          if evidence not in row['persistenceEvidenceIfRelevant']:
              row['persistenceEvidenceIfRelevant'].append(evidence)
              lp.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Verify targeting replay
        run: npx tsx --test tests/ui/installedCommonPlayProductionRuntime.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: npx tsc --noEmit
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/c9-family-e-targeting-replay-evidence.yml \
            .github/workflows/c9-family-e-targeting-replay-evidence-r3.yml \
            .github/workflows/c9-family-e-targeting-replay-evidence-r4.yml
          git add tests/ui/installedCommonPlayProductionRuntime.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m 'test(c9): prove targeting reconnect retry convergence'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
