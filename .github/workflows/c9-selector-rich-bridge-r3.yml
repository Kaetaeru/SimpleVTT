name: C9 Rich Selector Bridge R3

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-selector-rich-bridge-r3.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply rich-selector bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/c9-selector-rich-bridge-r2.yml').read_text(encoding='utf-8')
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/c9-selector-rich-bridge.js').write_text(source[start:end], encoding='utf-8')
          PY
          node /tmp/c9-selector-rich-bridge.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify rich selector bridge
        run: >-
          npx tsx --test
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit without overwriting concurrent C9 work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/c9-selector-bridge-patch.yml \
            .github/workflows/c9-selector-rich-bridge-r2.yml \
            .github/workflows/c9-selector-rich-bridge-r3.yml
          git add \
            src/domain/commonPlaySelectorRuntime.ts \
            src/domain/commonPlayOperationRuntime.ts \
            tests/domain/commonPlayTargetingRuntime.test.ts \
            tests/ui/installedCommonPlayProductionRuntime.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(c9): route manual target selectors through generic runtime"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "selector bridge could not acquire a clean fast-forward window" >&2
          exit 1
