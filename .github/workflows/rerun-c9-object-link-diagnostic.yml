name: Rerun C9 Object Link Diagnostic

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/rerun-c9-object-link-diagnostic.yml"
      - "tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts"
      - "src/app/installedCommonPlayArtifactLifecycleAdapter.ts"
      - "src/domain/commonPlayArtifactLifecycleRuntime.ts"
      - "src/domain/commonPlayArtifactRuntime.ts"
      - "src/domain/resolutionArtifactOps.ts"
      - "schemas/common-play-contract.schema.json"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - run: npx tsx --test tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > c9-object-link-tsc.txt 2>&1
          status=$?
          echo "$status" > c9-object-link-tsc-status.txt
          cat c9-object-link-tsc.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: c9-object-link-tsc
          path: |
            c9-object-link-tsc.txt
            c9-object-link-tsc-status.txt
      - name: Enforce TypeScript success
        shell: bash
        run: test "$(cat c9-object-link-tsc-status.txt)" = "0"
