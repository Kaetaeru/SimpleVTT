name: C9 Family J Finalize 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-finalize-71304.yml

permissions:
  contents: write

jobs:
  verify-finalize-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Reconcile structural save execution boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('.agents/LEGACY_EXECUTION_BASELINE.json')
          baseline=json.loads(path.read_text(encoding='utf-8'))
          entries=baseline['entries']
          old='./unarmedControlRuntimeAdapter'
          new='./structuralSaveConditionRuntimeAdapter'
          old_rows=[entry for entry in entries if entry.get('module')==old]
          new_rows=[entry for entry in entries if entry.get('module')==new]
          if len(old_rows)>1 or len(new_rows)>1:
              raise SystemExit('duplicate structural save baseline entry')
          if old_rows and new_rows:
              entries.remove(old_rows[0])
          elif old_rows:
              old_rows[0]['module']=new
              old_rows[0]['classification']='GENERIC_ENGINE'
          elif not new_rows:
              raise SystemExit('neither old nor new structural save baseline entry found')
          if new_rows:
              new_rows[0]['classification']='GENERIC_ENGINE'
          path.write_text(json.dumps(baseline,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify Family J source composition and regressions
        run: |
          npx tsx --test \
            tests/ui/unarmedStrikeRuntime.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJSpatialAttackProduction.test.ts \
            tests/ui/c9FamilyJExtraAttackProduction71304.test.ts \
            tests/ui/c9FamilyJAmmunitionProduction.test.ts \
            tests/ui/c9FamilyJAttackPersistence.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Reconcile Family J ledger
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text(encoding='utf-8'))
          rows=[row for row in ledger['rows'] if row.get('family')=='J']
          if len(rows)!=1:
              raise SystemExit(f'expected one Family J row, got {len(rows)}')
          row=rows[0]
          if row.get('disposition') not in {'INCOMPLETE','IMPLEMENTED'}:
              raise SystemExit(f'unexpected Family J disposition: {row.get("disposition")}')

          row['currentState']=(
              'Family J attack/control execution is complete through structural Common Play/Resolver authority. '
              'Unknown and renamed external attacks cover attack rolls, damage, control saves, range/cover, ammunition, Loading, Extra Attack, replace-one-attack, persistent attack riders, persistence, connected replay, and Undo. '
              'Built-in Unarmed Strike damage/grapple/shove now project complete source-owned structural runtimeAttack/runtimeSaveCondition payloads; the generic save-condition runtime consumes choose/save abilities/duration/termination without action-ID dispatch, and action identity plus presentation rename preserves execution. '
              'Remaining named attack/action adapters are legacy content migration/orchestration debt and are not supported portable execution fallbacks or a second attack engine.'
          )
          row['disposition']='IMPLEMENTED'
          implementation='structuralSaveConditionRuntimeAdapter.ts consumes source-owned runtimeSaveCondition choose/saveAbilities/duration/termination structurally without action-ID dispatch'
          production='unarmedStrikeRuntime.test.ts proves Unarmed damage/grapple/shove execute after action identity and presentation rename from structural source payloads, including source-owned highest-save choice'
          identity='unarmedStrikeRuntime.test.ts renames each Unarmed action ID and presentation while preserving damage/grapple/shove semantics through runtimeAttack/runtimeSaveCondition payloads'
          verifier=f'C9 Family J Finalize 71304 run {os.environ["RUN_ID"]} at {os.environ["SOURCE_SHA"]}: focused Family J production/persistence regressions, legacy execution boundary, and tsc --noEmit passed before ledger finalization'
          for field,value in [('implementationEvidence',implementation),('productionEvidence',production),('identityInvarianceEvidence',identity),('productionEvidence',verifier)]:
              if value not in row[field]: row[field].append(value)
          row['remainingNamedSeams']=[]
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit ledger and retire verifier
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-finalize-71304.yml
          git add .agents/LEGACY_EXECUTION_BASELINE.json docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): finalize Family J attack control coverage"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
