name: C9 Family J Finalize 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-finalize-71304.yml]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile Family J evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text(encoding='utf-8'))
          row=next((row for row in ledger['rows'] if row.get('family')=='J'),None)
          if row is None or row.get('id')!='attack-control':
              raise SystemExit('Family J attack-control row missing or changed')

          proof='tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts'
          impl=(
              'commonPlayOperationRuntime.ts and installedCommonPlayRuntimeAdapter.ts compose a complete Unarmed-shaped '
              'external suite from structural attack-roll damage, best-of STR/DEX target saves, condition.apply, '
              'movement.relocate, attack economy, and event-native Undo without content identity dispatch'
          )
          prod=(
              f'{proof} imports canonical offline production composition and installs a previously unknown RuleModule '
              'whose damage, grapple, shove-prone, and shove-push entry points execute through Common Play/Resolver '
              'with authoritative spatial facts and Undo'
          )
          ident=(
              f'{proof} repeats the complete portable Unarmed-shaped damage/grapple/prone/push suite after renaming '
              'module, content, mechanic, and every entry-point identity'
          )
          for field,value in [
              ('implementationEvidence',impl),
              ('productionEvidence',prod),
              ('identityInvarianceEvidence',ident),
          ]:
              if value not in row[field]: row[field].append(value)

          row['currentState']=(
              'Family J attack/control semantics are covered by the canonical Resolver/Common Play path. Unknown installed '
              'RuleModules execute structural weapon-style attacks, Opportunity Attack-related attack transactions, '
              'ammunition/loading, cover/range, Extra Attack and replace-one-attack economy, and a complete Unarmed-shaped '
              'suite: flat damage, grapple, shove Prone, shove push, and best-of STR/DEX control saves. The complete suite '
              'is production- and identity-invariance-proven under unrelated external module/content/mechanic/entry-point '
              'identities with authoritative spatial facts and event-native Undo. Remaining built-in/reference named '
              'projection debt is tracked by the legacy execution inventory and is not a fallback selected by unknown '
              'supported Common Play content.'
          )
          row['disposition']='IMPLEMENTED'
          row['remainingNamedSeams']=[]
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify Family J final evidence
        shell: bash
        run: |
          npm run generate:content
          npx tsx --test \
            tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJSpatialAttackProduction.test.ts \
            tests/ui/c9FamilyJExtraAttackProduction71304.test.ts \
            tests/ui/c9FamilyJAttackReplacementProduction71304.test.ts \
            tests/ui/c9FamilyJAmmunitionProduction.test.ts \
            tests/ui/unarmedStrikeRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish verified ledger and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-j-finalize-71304.yml
          git commit -m "docs(c9): finalize Family J attack control coverage"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
