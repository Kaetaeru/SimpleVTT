name: C9 Family AJ Ownership Reconciliation

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-aj-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile AJ cross-family ownership evidence
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(ledger.rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0) throw new Error(`unexpected coverage ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('gateNBlockingNamedFallbacks is not empty');
          const aj=ledger.rows.find(r=>r.family==='AJ'&&r.id==='authority-persistence-ownership');
          if(!aj||aj.disposition!=='INCOMPLETE') throw new Error('Family AJ must still be INCOMPLETE');
          for(const family of ['S','T','U','AB']) if(ledger.rows.find(r=>r.family===family)?.disposition!=='IMPLEMENTED') throw new Error(`completed family ${family} changed; re-audit`);
          const commit=fs.readFileSync('src/app/runtimeResolutionCommit.ts','utf8');
          const connected=fs.readFileSync('src/app/connectedSessionRuntimeAdapter.ts','utf8');
          if(!commit.includes('ResolutionEvent')||!connected.includes('applyConnected')) throw new Error('shared authority infrastructure changed; re-audit');
          aj.currentState='Shared session authority is strong: canonical ResolutionEvents, revision checks, atomic commits, Host-authoritative connected application, duplicate/replay handling, reconnect reconstruction, and event-native Undo are production-proven across multiple completed and partial families. AJ is a cross-family acceptance row, however, so it cannot be final while mechanism families still lack their correctly-owned durable/session transaction. Current blockers include actor/form end ownership, durable item/attunement/progression/spell material ownership, special timing, mount/vehicle topology, campaign exposure/environment, project output, capacity facts, and standard-action dependencies.';
          aj.implementationEvidence=[...(aj.implementationEvidence??[]),'runtimeResolutionCommit.ts canonical authoritative commit','connectedSessionRuntimeAdapter.ts connected event application/replay','runtimeResolutionEventHistory.ts event-native Undo history'];
          aj.productionEvidence=[...(aj.productionEvidence??[]),'Families S/T/U/AB completed production authority matrices','retained C9 connected replay/reconnect/Undo evidence in STATE'];
          aj.connectedEvidenceIfRelevant=[...(aj.connectedEvidenceIfRelevant??[]),'completed Family T/U/AB Host/Client duplicate replay, reconnect, and Undo matrices'];
          aj.persistenceEvidenceIfRelevant=[...(aj.persistenceEvidenceIfRelevant??[]),'installed Common Play persistence/rehydration authority retained from PR #159','family-specific durable ownership remains required before AJ final disposition'];
          aj.remainingNamedSeams=[
            'cross-family final ownership acceptance cannot close while required mechanism rows remain INCOMPLETE',
            'durable Character/source owners remain undefined for W/X/Y/Z/AA/AH/AI dependencies',
            'session timing/topology/environment owners remain undefined for AC/AD/AE/AF',
            'remaining supported named/dependency seams must be removed or proven non-blocking before final AJ disposition'
          ];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const statePath='.chatgpt-rerun/STATE.md';
          let state=fs.readFileSync(statePath,'utf8');
          const marker='## Next Exact Action';
          const idx=state.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          const before=state.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family AJ reconciliation — shared authority proven, finality depends on remaining families\n\nFamily AJ (`authority-persistence-ownership`) remains `INCOMPLETE` by design. The shared event/commit/connected/Undo infrastructure is already production-proven and is now recorded in the ledger, but AJ is the cross-family acceptance row: it cannot be final while any required family still lacks its correctly-owned session or durable transaction. The audited blockers are ownership contracts, not reasons to duplicate the shared authority engine.\n\n';
          const next='## Next Exact Action\n\nAudit-only traversal is complete. Return to the earliest non-authority-blocked incomplete family, Family A (`expression-property`), and determine the smallest production acceptance slice that can be closed using the existing expression/predicate/property.modify kernel and already-installed Common Play path. Reuse existing production/persistence/identity evidence where valid; add one arbitrary-ID production composition proof for derived/conditional/source-bound property semantics if the contract already supports it. If A exposes an actual undefined stacking/source-ownership policy, record only that exact blocker and continue to the next implementable family rather than inventing semantics.\n';
          fs.writeFileSync(statePath,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs || true
          git diff --check
      - name: Commit AJ reconciliation and STATE
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): reconcile cross-family ownership evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family AJ now records the already-proven shared authoritative commit/connected/replay/reconnect/Undo infrastructure but remains cross-family INCOMPLETE until every required mechanism has its correct owner. Audit-only traversal is complete; next return to Family A expression/property and implement the smallest non-authority-blocked production acceptance gap.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          rm .github/workflows/rerun-c9-aj-audit.yml
          git add .chatgpt-rerun/control.json .github/workflows/rerun-c9-aj-audit.yml
          git commit -m "docs(rerun): resume implementation after ownership audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation