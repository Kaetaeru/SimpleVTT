name: C9 Family AJ Ownership Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-aj-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile AJ cross-family ownership boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(ledger.rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0) throw new Error(`unexpected coverage ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('gateNBlockingNamedFallbacks is not empty');
          const aj=ledger.rows.find(r=>r.family==='AJ'&&r.id==='authority-persistence-ownership');
          if(!aj||aj.disposition!=='INCOMPLETE') throw new Error('Family AJ must still be INCOMPLETE');
          for(const path of [
            'src/app/runtimeResolutionCommit.ts',
            'src/app/realEventApplyService.ts',
            'src/app/realEventUndoService.ts',
            'src/app/connectedSessionProtocol.ts',
            'src/domain/runtimeArtifact.ts',
            'src/domain/commonPlayInventoryRuntime.ts'
          ]) if(!fs.existsSync(path)) throw new Error(`ownership evidence source missing: ${path}`);
          const state=fs.readFileSync('.chatgpt-rerun/STATE.md','utf8');
          for(const token of ['Family T (zones) is now ledger `IMPLEMENTED`','Family U Diagnostic run `33279420876`','Family AB (`recharge-cooldown`) is now `IMPLEMENTED`']) {
            if(!state.includes(token)) throw new Error(`durable ownership evidence changed: ${token}`);
          }
          aj.currentState='Cross-family ownership infrastructure is production-proven on several final C9 families: runtime resolutions use typed revisioned StateChanges and Host-authoritative ResolutionEvents; connected replay/reconnect and event-native Undo are proven for stored invocations, Zones, object/link artifacts, and Recharge, while Character durable projections remain a distinct write-back domain. AJ is an aggregate acceptance row, however, and cannot be final while multiple mechanism families still lack their correct durable/session owner, remote decision ownership, or full persistence/reconnect contract.';
          aj.implementationEvidence=[...new Set([...(aj.implementationEvidence??[]),
            'src/app/runtimeResolutionCommit.ts',
            'src/app/realEventApplyService.ts',
            'src/app/realEventUndoService.ts',
            'src/app/connectedSessionProtocol.ts',
            'src/domain/runtimeArtifact.ts',
            'src/domain/commonPlayInventoryRuntime.ts'
          ])];
          aj.productionEvidence=[...new Set([...(aj.productionEvidence??[]),
            'c87402f9 stored-invocation authoritative replay/reconnect/Undo checkpoint',
            '72a2c7fd Zone authoritative replay/reconnect/Undo checkpoint',
            'C9 Family U Diagnostic run 33279420876 object/link authoritative lifecycle',
            'C9 Recharge availability/consumption run 33280926167'
          ])];
          aj.identityInvarianceEvidence=[...new Set([...(aj.identityInvarianceEvidence??[]),
            'arbitrary installed stored-invocation identity checkpoint c87402f9',
            'Family T arbitrary installed Zone identity/reconnect acceptance',
            'Family U object/link identity rename acceptance in run 33279420876',
            'Family AB arbitrary Recharge identity acceptance in run 33280926167'
          ])];
          aj.connectedEvidenceIfRelevant=[...new Set([...(aj.connectedEvidenceIfRelevant??[]),
            'c87402f9 stored invocation Host/Client replay, reconnect, Undo',
            '72a2c7fd Zone Host/Client replay, reconnect, Undo',
            'run 33279420876 object/link Host/Client replay, reconnect, Undo',
            'run 33280926167 Recharge Host/Client replay, reconnect, Undo'
          ])];
          aj.persistenceEvidenceIfRelevant=[...new Set([...(aj.persistenceEvidenceIfRelevant??[]),
            'PR #159 installed Common Play persistence/rehydration authority',
            'session RuntimeArtifact reconnect reconstruction retained for final S/T/U families',
            'existing Character durable projection remains distinct from session RuntimeArtifact ownership'
          ])];
          aj.remainingNamedSeams=[
            'AJ cannot be final until every mandatory family has its correct transaction owner and final disposition',
            'durable Character/source write-back ownership remains unresolved for Families W/X/Y/Z/AH/AI',
            'session/lifetime/topology ownership remains unresolved for Families V/AC/AD/AE/AF',
            'remote decision/order/stale-response acceptance remains incomplete for interactive families including P/R/AC',
            'Family Z still contains spellMechanicById identity dispatch and Family AG inherits that Magic path'
          ];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const statePath='.chatgpt-rerun/STATE.md';
          let nextState=fs.readFileSync(statePath,'utf8');
          const marker='## Next Exact Action';
          const idx=nextState.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          const before=nextState.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family AJ audit — cross-family ownership remains aggregate acceptance\n\nFamily AJ (`authority-persistence-ownership`) remains `INCOMPLETE`, but its ledger evidence now distinguishes proven shared infrastructure from unresolved mechanism owners. Final C9 families S/T/U/AB already prove revisioned authoritative commits, Host/Client event replay, duplicate handling, reconnect, and event-native Undo on session-owned runtime state; existing Character durability remains a separate owner. AJ cannot become final while V/W/X/Y/Z/AC/AD/AE/AF/AH/AI and other incomplete interactive families still lack their correct projection, durable source, lifetime/topology, campaign-clock, environment, project, capacity, or remote-decision owner.\n\n';
          const next='## Next Exact Action\n\nReturn to the earliest incomplete family that is not blocked on an undefined authority contract: Family A (`expression-property`). Audit the existing persisted expression/predicate/property contract plus RulesProfile evaluator against real installed production composition and identity invariance. Reuse the existing expression engine; do not create a second evaluator. If a bounded production/evidence seam is missing, implement the smallest generic seam and focused proof, then reconcile A only if its complete required semantic matrix is actually satisfied. Do not continue late-family audit-only work while an earlier implementable gap exists.\n';
          fs.writeFileSync(statePath,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs || true
          git diff --check
      - name: Commit AJ audit and STATE
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): reconcile cross-family ownership evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family AJ now records the proven shared Host/replay/reconnect/Undo ownership infrastructure but remains INCOMPLETE because multiple mandatory families still lack their correct durable/session/decision owners. Next return to Family A expression/property as the earliest non-authority-blocked implementation/evidence gap.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          rm .github/workflows/rerun-c9-aj-audit.yml
          git add .chatgpt-rerun/control.json .github/workflows/rerun-c9-aj-audit.yml
          git commit -m "docs(rerun): continue from Family A coverage"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
