name: C9 Family N Suppression Apply Code Only 71304

on:
  push:
    paths:
      - ".github/workflows/c9-family-n-suppression-apply-code-only.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Apply existing suppression patch without workflow mutations
        shell: bash
        run: |
          PATCH_B64=$(sed -n "s/.*echo '\([^']*\)'.*/\1/p" .github/workflows/c9-family-n-suppression-patch-71304.yml | head -n 1)
          test -n "$PATCH_B64"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/c9-n-patch.py
          python3 /tmp/c9-n-patch.py
          git checkout -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(c9): expose portable effect suppression"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
