name: C9 Family N Suppression Apply Code Only 71304

on:
  push:
    paths:
      - ".github/workflows/c9-family-n-suppression-apply-code-only.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Apply verified suppression patch without workflow mutations
        shell: bash
        run: |
          git show 960aafc41127ae1ccf2153e0c1a86c3575ede589:.github/workflows/c9-family-n-suppression-patch-71304.yml > /tmp/source.yml
          python3 - <<'PY'
          import base64, gzip, pathlib, re
          text = pathlib.Path('/tmp/source.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64 -d \| gzip -d", text)
          if not match:
              raise SystemExit('suppression patch payload not found')
          pathlib.Path('/tmp/c9-n-patch.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python3 /tmp/c9-n-patch.py
          git checkout -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(c9): expose portable effect suppression"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
