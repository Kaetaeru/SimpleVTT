name: C9 Family N Suppression 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-n-suppression-apply-code-only.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify portable effect suppression and pause-resume
        run: npx tsx --test tests/ui/c9FamilyNEffectDurationProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
