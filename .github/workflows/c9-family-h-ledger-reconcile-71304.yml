name: C9 Family H Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile verified Family H evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reconcile-h.py <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry.get('family')=='H')
          row['currentState']=(
            'Generic status and creature-type awareness paths are production-proven. Common Play defines standard sensing facts for can-see, can-hear, detected, light, obscurement, and hidden with identity-independent provider provenance and connected owner-authority routing. '
            'Resolver-owned session Hidden effects feed sense.hidden, unknown external Hide-style status actions commit Hidden as authoritative Effect StateChanges, and endsOnAttack reveal removes that Effect through the same event path with event-native Undo. '
            'Provider-authored line-of-sight, lighting, obscurement, Darkvision, Blindsight, Truesight, Tremorsense-related ground contact, hearing, and target invisibility compose through the shared sensing kernel, and Resolver-owned Invisible condition state also participates in production sense.can-see without content identity dispatch. '
            'Family H remains incomplete for rules-derived sense-profile projection plus detection/Search/discovery semantics.'
          )
          evidence={
            'implementationEvidence':[
              'spatialRuntimeContracts.ts carries provider-authored observerSenses, targetInvisible, hearing, and shared-ground-contact facts while commonPlayInterceptorProductionRuntimeAdapter.ts composes them through resolveCommonPlaySenses without content identity dispatch',
              'commonPlayInterceptorProductionRuntimeAdapter.ts merges authoritative Resolver-owned Invisible Effect state into production sensing before answering sense.can-see/sense.detected',
            ],
            'productionEvidence':[
              'installedCommonPlayInterceptorProductionRuntime.test.ts proves Darkvision, Blindsight, and Truesight production sensing under fully renamed external Common Play identities',
              'installedCommonPlayInterceptorProductionRuntime.test.ts proves normal sight fails against a Resolver-owned Invisible condition even when raw provider line-of-sight is visible',
              'C9 Family H Invisible Sight run 33313436110 passed the focused sensing/interceptor tests, legacy execution boundary, and TypeScript before publishing the verified staging commit f7d39af47456666437d461f4159d73cd7da08411; identical source/test blobs are present on the target branch',
            ],
            'identityInvarianceEvidence':[
              'installedCommonPlayInterceptorProductionRuntime.test.ts special-sight matrix preserves Darkvision/Blindsight/Truesight and provider-authored Invisible semantics after module/content/mechanic/interceptor/interaction/display rename',
            ],
          }
          for key,values in evidence.items():
            for value in values:
              if value not in row[key]: row[key].append(value)
          row['remainingNamedSeams']=['rules-derived sense-profile projection plus detection/Search/discovery semantics remain incomplete']
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 /tmp/reconcile-h.py
            git rm -f .github/workflows/c9-family-h-ledger-reconcile-71304.yml || true
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
            node scripts/check-v1-mechanism-coverage.mjs
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): reconcile Family H sensing evidence"
            if git push origin HEAD:"$branch"; then exit 0; fi
          done
          exit 1
