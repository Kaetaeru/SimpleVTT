name: C9 Family O Ready Concentration V4

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-o-ready-concentration-v4.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Reuse staged patch and proof
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          lines=Path('.github/workflows/c9-family-o-ready-concentration-v3.yml').read_text(encoding='utf-8').splitlines()
          def block(start,end):
              i=next(i for i,line in enumerate(lines) if line.strip()==start)+1
              j=next(j for j in range(i,len(lines)) if lines[j].strip()==end)
              return dedent('\n'.join(lines[i:j]))+'\n'
          exec(compile(block("python - <<'PY'","PY"),'ready-patch','exec'),{})
          test_text=block("cat > tests/ui/c9FamilyOReadyConcentrationProduction.test.ts <<'EOF'","EOF")
          Path('tests/ui/c9FamilyOReadyConcentrationProduction.test.ts').write_text(test_text,encoding='utf-8')
          PY
      - run: npm ci
      - name: Generate standard content
        run: npm run generate:content
      - name: Verify focused Family O paths
        run: npx tsx --test tests/ui/c9FamilyOReadyConcentrationProduction.test.ts tests/ui/c9FamilyOConcentrationProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/c9-family-o-ready-concentration-71304.yml .github/workflows/c9-family-o-ready-concentration-v2.yml .github/workflows/c9-family-o-ready-concentration-v3.yml .github/workflows/c9-family-o-ready-concentration-v4.yml
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyOReadyConcentrationProduction.test.ts .github/workflows/c9-family-o-ready-concentration-71304.yml .github/workflows/c9-family-o-ready-concentration-v2.yml .github/workflows/c9-family-o-ready-concentration-v3.yml .github/workflows/c9-family-o-ready-concentration-v4.yml
          git commit -m "feat(c9): hold readied spell concentration"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
