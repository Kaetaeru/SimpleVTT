name: C9 Family Q Choice R3 71304
# rerun-trigger: 71304-q-choice

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r3-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Complete current choice bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          text=path.read_text(encoding='utf-8')
          if 'interactionCandidates?:CommonPlaySelectorCandidate[];' not in text:
              anchor='  targetingCandidates?:CommonPlaySelectorCandidate[];\n'
              if text.count(anchor)!=1:
                  raise SystemExit(f'domain targeting candidate anchor changed: {text.count(anchor)}')
              text=text.replace(anchor,anchor+'  interactionCandidates?:CommonPlaySelectorCandidate[];\n',1)
          old='candidates:input.targetingCandidates??[],\n        selectedIds:[...input.interactionResponse.selectedIds],'
          new='candidates:input.interactionCandidates??input.targetingCandidates??[],\n        selectedIds:[...input.interactionResponse.selectedIds],'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('domain choice candidate anchor changed')
          path.write_text(text,encoding='utf-8')

          r1=Path('.github/workflows/c9-family-q-choice-71304.yml').read_text(encoding='utf-8')
          marker='          # App contract: optional choice payload; boolean callers remain source-compatible.\n'
          start=r1.index(marker)
          end=r1.index("\n          PY",start)
          app_code=textwrap.dedent(r1[start:end])

          def replace_once(file_path,old_text,new_text):
              p=Path(file_path)
              source=p.read_text(encoding='utf-8')
              count=source.count(old_text)
              if count!=1:
                  raise SystemExit(f'{file_path}: expected one anchor, found {count}: {old_text[:80]!r}')
              p.write_text(source.replace(old_text,new_text,1),encoding='utf-8')

          adapter_path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          current_compile='''    const itemContext=itemPaymentRuntimeContext(internal,state,lowered.definition);\n    let pending;\n    try {\n      pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionId,itemContext.itemPaymentResourceIds));\n    } catch(error) {\n      return {status:"rejected" as const,error:error instanceof Error?error.message:String(error),snapshot:await internal.getSnapshot()};\n    }\n'''
          legacy_compile='''    const itemContext=itemPaymentRuntimeContext(internal,state,lowered.definition);\n    const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionId,itemContext.itemPaymentResourceIds));\n'''
          adapter_text=adapter_path.read_text(encoding='utf-8')
          if current_compile in adapter_text:
              adapter_path.write_text(adapter_text.replace(current_compile,legacy_compile,1),encoding='utf-8')
          elif legacy_compile not in adapter_text and 'interactionResponse' not in adapter_text:
              raise SystemExit('current production compile guard anchor changed')

          if 'choice?: { min:number; max:number; options:Array<{id:string;name:string}> };' not in Path('src/app/contracts.ts').read_text(encoding='utf-8'):
              exec(compile(app_code,'q-choice-app-patch','exec'),{'Path':Path,'replace_once':replace_once})
          elif not Path('tests/ui/c9FamilyQChoiceInteractionProduction.test.ts').exists():
              raise SystemExit('choice app bridge already exists without its production proof')

          patched_compile='''    const itemContext=itemPaymentRuntimeContext(internal,state,lowered.definition);\n    const interactionCandidates=entryPoint.interaction?.kind==="choice"\n      ?commonPlayTargetCandidates(adapter,internal.scene,itemContext.state,actorEntity,entryPoint.interaction.input.selector)\n      :undefined;\n    const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionResponse,interactionCandidates,itemContext.itemPaymentResourceIds));\n'''
          guarded_compile='''    const itemContext=itemPaymentRuntimeContext(internal,state,lowered.definition);\n    const interactionCandidates=entryPoint.interaction?.kind==="choice"\n      ?commonPlayTargetCandidates(adapter,internal.scene,itemContext.state,actorEntity,entryPoint.interaction.input.selector)\n      :undefined;\n    let pending;\n    try {\n      pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionResponse,interactionCandidates,itemContext.itemPaymentResourceIds));\n    } catch(error) {\n      return {status:"rejected" as const,error:error instanceof Error?error.message:String(error),snapshot:await internal.getSnapshot()};\n    }\n'''
          adapter_text=adapter_path.read_text(encoding='utf-8')
          if patched_compile in adapter_text:
              adapter_path.write_text(adapter_text.replace(patched_compile,guarded_compile,1),encoding='utf-8')
          elif guarded_compile not in adapter_text:
              raise SystemExit('patched production compile guard anchor changed')

          test_path=Path('tests/ui/c9FamilyQChoiceInteractionProduction.test.ts')
          test_text=test_path.read_text(encoding='utf-8')
          healing='{kind:"healing.apply",amount:{value:1},target:"actor"}'
          damage='{kind:"damage.apply",amount:{value:1},damageType:"force",target:"actor"}'
          if healing in test_text:
              test_text=test_text.replace(healing,damage,1)
          elif damage not in test_text:
              raise SystemExit('choice effect fixture anchor changed')
          expected_heal='assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore+1);'
          expected_damage='assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore-1);'
          if expected_heal in test_text:
              test_text=test_text.replace(expected_heal,expected_damage,1)
          elif expected_damage not in test_text:
              raise SystemExit('choice effect assertion anchor changed')
          decline_old='''test("portable choice decline leaves Reaction and downstream effect untouched",async()=>{\n  const {host,actionId,actorId,internal}=await setup("family-q-choice-decline");\n  const hpBefore=internal.scene.entities.find((entity)=>entity.id===actorId)!.hp;\n  await host.resolveAction(actionId,[actorId]);\n  let snapshot=await host.getSnapshot();assert.equal(snapshot.resolution?.stage,"interrupt");\n  await host.respondToInterrupt(false);\n  snapshot=await host.getSnapshot();\n  assert.equal(snapshot.resolution?.stage,"complete");\n  assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore);\n  assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,true);\n});'''
          decline_new='''test("portable choice decline leaves Reaction and downstream effect untouched",async()=>{\n  const {host,actionId,actorId,internal}=await setup("family-q-choice-decline");\n  const hpBefore=internal.scene.entities.find((entity)=>entity.id===actorId)!.hp;\n  const oldSend=tauriSessionTransport.send,oldSendTo=tauriSessionTransport.sendTo;\n  tauriSessionTransport.send=async()=>1;tauriSessionTransport.sendTo=async()=>1;\n  try{\n    await host.resolveAction(actionId,[actorId]);\n    let snapshot=await host.getSnapshot();assert.equal(snapshot.resolution?.stage,"interrupt");\n    await host.respondToInterrupt(false);\n    snapshot=await host.getSnapshot();\n    assert.equal(snapshot.resolution?.stage,"complete");\n    assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore);\n    assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,true);\n  }finally{tauriSessionTransport.send=oldSend;tauriSessionTransport.sendTo=oldSendTo;}\n});'''
          if decline_old in test_text:
              test_text=test_text.replace(decline_old,decline_new,1)
          elif 'const oldSend=tauriSessionTransport.send,oldSendTo=tauriSessionTransport.sendTo;' not in test_text:
              raise SystemExit('decline fixture anchor changed')
          test_path.write_text(test_text,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
