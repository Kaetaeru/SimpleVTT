name: C9 Family E Object Point 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-object-point-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Bridge authoritative object and point candidates
        run: python3 .github/scripts/c9-family-e-object-point-71304.py
      - run: npm run generate:content
      - name: Verify Family E completion slice
        run: |
          node --import tsx --test tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/c9FamilyESpatialFactProduction.test.ts tests/ui/c9FamilyEConditionSelectorProduction.test.ts tests/ui/c9FamilyETagSelectorProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified Family E completion and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-object-point-71304.yml .github/scripts/c9-family-e-object-point-71304.py
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/commonPlayRichSelectorProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): complete Family E target selectors"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 40); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              git diff --check
              if git push origin HEAD:"$branch"; then
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "Family E publish raced; retry ${attempt}/40"
            sleep 0.2
          done
          exit 1
