name: C9 Family E Point Area 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-object-point-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Prepare Family E point-area patch
        shell: bash
        run: |
          cat > /tmp/c9-family-e-point-area.py <<'PY'
          import json
          from pathlib import Path

          adapter_path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          adapter=adapter_path.read_text(encoding='utf-8')
          old='''  const areaMember=area?.origin==="self"\n    ? commonPlayAreaMembershipProviders.get(adapter)?.areaMember({sourceId:actor.id,targetId:target.id,area:structuredClone(area)})\n    : undefined;'''
          new='''  const areaMember=area\n    ? commonPlayAreaMembershipProviders.get(adapter)?.areaMember({sourceId:actor.id,targetId:target.id,area:structuredClone(area)})\n    : undefined;'''
          if new not in adapter:
              if adapter.count(old)!=1:
                  raise SystemExit(f'point-area provider anchor changed: {adapter.count(old)}')
              adapter=adapter.replace(old,new,1)
              adapter_path.write_text(adapter,encoding='utf-8')

          test_path=Path('tests/ui/commonPlayRichSelectorProduction.test.ts')
          test_text=test_path.read_text(encoding='utf-8')
          marker='unknown installed point-origin area selector consumes provider-backed membership and remains identity invariant'
          if marker not in test_text:
              test_text += '''\n\nfunction pointAreaPayload(identity:Identity) {\n  const authored=JSON.parse(payload(identity));\n  authored.content[0].mechanics[0].config.entryPoints[0].targeting={\n    from:"targets",min:1,max:2,area:{kind:"instant",shape:"sphere",origin:"point",radiusFeet:10,rangeFeet:60},\n  };\n  return JSON.stringify(authored);\n}\n\nasync function executePointArea(identity:Identity) {\n  const adapter=new MockAdapter();\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(pointAreaPayload(identity));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  registerAuthoritativeCommonPlayAreaMembershipProvider(adapter,{\n    areaMember:({sourceId,targetId,area})=>{\n      assert.equal(sourceId,"char.aelar");\n      assert.equal(area.origin,"point");\n      assert.equal(area.shape,"sphere");\n      assert.equal(area.rangeFeet,60);\n      return targetId==="combatant.goblin-a";\n    },\n  });\n  await adapter.startInitiative();\n  await adapter.setCurrentActor("char.aelar");\n  const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),mechanicId:identity.mechanicId,entryPointId:identity.entryPointId});\n  await adapter.resolveAction(actionId,["combatant.goblin-b"]);\n  let snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.actionId,actionId);\n  assert.equal(snapshot.resolution?.finalOutcome,"적용 거부");\n  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.stage,"complete");\n  assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);\n  return snapshot.resolution?.targetIds;\n}\n\ntest("unknown installed point-origin area selector consumes provider-backed membership and remains identity invariant",async()=>{\n  assert.deepEqual(await executePointArea(RENAMED),await executePointArea(ORIGINAL));\n});\n'''
              test_path.write_text(test_text,encoding='utf-8')

          ledger_path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(ledger_path.read_text(encoding='utf-8'))
          row=next(entry for entry in ledger['rows'] if entry.get('family')=='E')
          row['currentState']=(
              'Portable Common Play targeting preserves bounded selected target sets, evaluates generic predicates over authoritative production candidates, '
              'and routes authored automatic selection plus orderBy through the shared selector kernel with Host authority. Production candidates consume authoritative '
              'Common Play spatial relations for distance, visibility, adjacency, Total Cover, provider-authored reach, and provider-backed self- or point-origin area '
              'membership without fabricating geometry. Provider-authored object and point candidates join the same generic selector path and remain independent of '
              'module, content, mechanic, entry-point, and display identities.'
          )
          row['disposition']='IMPLEMENTED'
          evidence={
            'implementationEvidence':[
              'installedCommonPlayRuntimeAdapter.ts invokes AuthoritativeCommonPlayAreaMembershipProvider for both self- and point-origin portable areas without Core geometry inference',
              'installedCommonPlayRuntimeAdapter.ts merges provider-authored object and point TargetingFactInput candidates with production creature candidates while preserving reserved creature identities',
            ],
            'productionEvidence':[
              'commonPlayRichSelectorProduction.test.ts proves unknown installed provider-authored object and point targets execute through production Common Play without identity dispatch',
              'commonPlayRichSelectorProduction.test.ts proves unknown installed point-origin areas reject non-members and accept authoritative provider members through production resolveAction',
              'C9 Family E Object Point run 33312739553: object/point provider targeting passed 10/10 focused tests, coverage checker, legacy execution boundary, and tsc --noEmit before a concurrent publish race',
            ],
            'identityInvarianceEvidence':[
              'commonPlayRichSelectorProduction.test.ts preserves provider-authored object/point selection and point-origin area membership after complete external module/content/mechanic/entry/display rename',
            ],
          }
          for key,values in evidence.items():
              for value in values:
                  if value not in row[key]:
                      row[key].append(value)
          row['remainingNamedSeams']=[]
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Apply Family E point-area patch
        run: python3 /tmp/c9-family-e-point-area.py
      - run: npm run generate:content
      - name: Verify Family E completion slice
        run: |
          node --import tsx --test tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/c9FamilyESpatialFactProduction.test.ts tests/ui/c9FamilyEConditionSelectorProduction.test.ts tests/ui/c9FamilyETagSelectorProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified Family E completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          verify() {
            npm run generate:content >/dev/null
            node --import tsx --test tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/c9FamilyESpatialFactProduction.test.ts tests/ui/c9FamilyEConditionSelectorProduction.test.ts tests/ui/c9FamilyETagSelectorProduction.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
          }
          stage() {
            python3 /tmp/c9-family-e-point-area.py
            git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/commonPlayRichSelectorProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
          }
          stage
          if ! git diff --cached --quiet; then
            git commit -m "feat(c9): complete Family E target selectors"
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              stage
              verify
              if git diff --cached --quiet && git push origin HEAD:"$branch"; then
                exit 0
              fi
              if ! git diff --cached --quiet; then
                git commit -m "docs(c9): reconcile Family E target evidence"
              fi
              if git push origin HEAD:"$branch"; then
                exit 0
              fi
            fi
            git rebase --abort || true
            git reset --hard "origin/$branch"
            stage
            if git diff --cached --quiet; then
              verify
              exit 0
            fi
            git commit -m "feat(c9): complete Family E target selectors"
          done
          exit 1
