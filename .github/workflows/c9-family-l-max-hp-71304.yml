name: C9 Family L Max HP 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-max-hp-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile with latest branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Implement max HP source/runtime overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          replace('src/app/persistenceContracts.ts','    creationSelections:Record<string,string[]>;\n    notes?:string;\n','    creationSelections:Record<string,string[]>;\n    maxHp?:number;\n    notes?:string;\n')
          replace('src/app/persistenceContracts.ts','export interface CharacterRuntimeDurableSnapshotV1 {\n  hp:number;\n  tempHp:number;\n','export interface CharacterRuntimeDurableSnapshotV1 {\n  hp:number;\n  maxHp?:number;\n  tempHp:number;\n')
          replace('src/app/persistenceContracts.ts','    runtimeRevision?:number;\n    durableLifeFlags?:CharacterDurableLifeFlagsV1;\n','    runtimeRevision?:number;\n    sourceMaxHp?:number;\n    durableLifeFlags?:CharacterDurableLifeFlagsV1;\n')
          replace('src/app/characterLibraryPersistence.ts','      background:sheet.background,\n      abilities:cp(sheet.abilities),\n','      background:sheet.background,\n      maxHp:sheet.sourceMaxHp ?? sheet.maxHp,\n      abilities:cp(sheet.abilities),\n')
          replace('src/app/characterLibraryPersistence.ts','export function projectCharacterRuntimeDurableV1(sheet:CharacterSheet):CharacterRuntimeDurableSnapshotV1 {\n  return {\n    hp:sheet.hp,\n    tempHp:sheet.tempHp,\n','export function projectCharacterRuntimeDurableV1(sheet:CharacterSheet):CharacterRuntimeDurableSnapshotV1 {\n  const sourceMaxHp=sheet.sourceMaxHp ?? sheet.maxHp;\n  return {\n    hp:sheet.hp,\n    maxHp:sheet.maxHp===sourceMaxHp ? undefined : sheet.maxHp,\n    tempHp:sheet.tempHp,\n')
          replace('src/app/characterLibraryPersistence.ts','  return {\n    hp:runtime.hp,\n    tempHp:runtime.tempHp,\n','  return {\n    hp:runtime.hp,\n    maxHp:runtime.maxHp,\n    tempHp:runtime.tempHp,\n')
          replace('src/app/characterLibraryPersistence.ts','  sheet.background=source.build.background;\n  sheet.abilities=cp(source.build.abilities);\n','  sheet.background=source.build.background;\n  const sourceMaxHp=source.build.maxHp ?? sheet.sourceMaxHp ?? sheet.maxHp;\n  sheet.sourceMaxHp=sourceMaxHp;\n  sheet.maxHp=sourceMaxHp;\n  sheet.abilities=cp(source.build.abilities);\n')
          replace('src/app/characterLibraryPersistence.ts','  applySourceSnapshot(sheet,record.source);\n  sheet.hp = record.runtime.hp;\n  sheet.tempHp = record.runtime.tempHp;\n','  applySourceSnapshot(sheet,record.source);\n  const sourceMaxHp=record.source.build.maxHp ?? sheet.sourceMaxHp ?? sheet.maxHp;\n  sheet.sourceMaxHp=sourceMaxHp;\n  sheet.maxHp=record.runtime.maxHp ?? sourceMaxHp;\n  sheet.hp = Math.min(record.runtime.hp,sheet.maxHp);\n  sheet.tempHp = record.runtime.tempHp;\n')
          replace('src/app/resolutionCharacterDurableProjection.ts','  if (change.kind==="hp") {\n    if (change.field==="maximum") return "Character write-back for maximum HP requires an explicit source-model contract";\n    const before=direction==="forward" ? change.before : change.after;\n    const after=direction==="forward" ? change.after : change.before;\n    const current=change.field==="current" ? sheet.hp : sheet.tempHp;\n    if (current!==before) return `Character write-back drift for ${change.targetId}/${label(change)}: expected ${before}, current ${current}`;\n    if (change.field==="current") sheet.hp=after;\n    else sheet.tempHp=after;\n    return;\n  }\n','  if (change.kind==="hp") {\n    const before=direction==="forward" ? change.before : change.after;\n    const after=direction==="forward" ? change.after : change.before;\n    if (change.field==="maximum") {\n      if (sheet.maxHp!==before) return `Character write-back drift for ${change.targetId}/${label(change)}: expected ${before}, current ${sheet.maxHp}`;\n      if (!Number.isInteger(after)||after<1) return `Character write-back invalid maximum HP for ${change.targetId}: ${after}`;\n      if (sheet.hp>after) return `Character write-back maximum HP ${after} is below current HP ${sheet.hp} for ${change.targetId}`;\n      if (sheet.sourceMaxHp===undefined) sheet.sourceMaxHp=before;\n      sheet.maxHp=after;\n      return;\n    }\n    const current=change.field==="current" ? sheet.hp : sheet.tempHp;\n    if (current!==before) return `Character write-back drift for ${change.targetId}/${label(change)}: expected ${before}, current ${current}`;\n    if (change.field==="current") sheet.hp=after;\n    else sheet.tempHp=after;\n    return;\n  }\n')
          PY
      - name: Add Family L max HP acceptance test
        run: |
          cat > tests/ui/c9FamilyLMaxHpPersistence.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { buildCharacterLibraryRecordV1, materializeCharacterRecordV1 } from "../../src/app/characterLibraryPersistence";
          import { projectResolutionCharacterWriteBack } from "../../src/app/resolutionCharacterDurableProjection";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import type { ResolutionEvent } from "../../src/domain/resolutionTypes";
          function hpEvent(characterId:string,changes:ResolutionEvent["stateChanges"]):ResolutionEvent { return { id:"family-l-max-hp:event",resolutionId:"family-l-max-hp",operationId:"family-l-max-hp:operation",kind:"max-hp-source-model-probe",actorId:characterId,targetId:characterId,summary:"maximum HP source/runtime overlay probe",provenance:[],stateChanges:changes,result:{} }; }
          test("maximum HP runtime overlay preserves source maximum across restart and inverse write-back",async()=>{
            const adapter=new MockAdapter(); const snapshot=await adapter.getSnapshot(); const sheet=structuredClone(snapshot.activeCharacter); const baseMaximum=sheet.maxHp; assert.ok(baseMaximum>1);
            const baseline=buildCharacterLibraryRecordV1(sheet); assert.equal(baseline.source.build.maxHp,baseMaximum); assert.equal(baseline.runtime.maxHp,undefined);
            const increased=baseMaximum+5; const increaseEvent=hpEvent(sheet.id,[{kind:"hp",targetId:sheet.id,field:"maximum",before:baseMaximum,after:increased,provenance:[],lifetime:"character-durable",writeBack:"character"}]);
            const forward=projectResolutionCharacterWriteBack(sheet,[increaseEvent],"forward"); assert.equal(forward.status,"committed",forward.status==="rejected"?forward.error:undefined); if(forward.status!=="committed") return; assert.equal(forward.sheet.maxHp,increased); assert.equal(forward.sheet.sourceMaxHp,baseMaximum);
            const persisted=buildCharacterLibraryRecordV1(forward.sheet,baseline); assert.equal(persisted.sourceRevision,baseline.sourceRevision); assert.equal(persisted.source.build.maxHp,baseMaximum); assert.equal(persisted.runtime.maxHp,increased);
            const restarted=materializeCharacterRecordV1(persisted); assert.equal(restarted.maxHp,increased); assert.equal(restarted.sourceMaxHp,baseMaximum);
            const inverse=projectResolutionCharacterWriteBack(restarted,[increaseEvent],"inverse"); assert.equal(inverse.status,"committed",inverse.status==="rejected"?inverse.error:undefined); if(inverse.status!=="committed") return; assert.equal(inverse.sheet.maxHp,baseMaximum); assert.equal(inverse.sheet.sourceMaxHp,baseMaximum);
            const undone=buildCharacterLibraryRecordV1(inverse.sheet,persisted); assert.equal(undone.sourceRevision,persisted.sourceRevision); assert.equal(undone.source.build.maxHp,baseMaximum); assert.equal(undone.runtime.maxHp,undefined); assert.equal(materializeCharacterRecordV1(undone).maxHp,baseMaximum);
          });
          test("maximum HP reduction requires and persists the matching current HP clamp",async()=>{
            const adapter=new MockAdapter(); const snapshot=await adapter.getSnapshot(); const sheet=structuredClone(snapshot.activeCharacter); const baseMaximum=sheet.maxHp; assert.ok(baseMaximum>1); sheet.hp=baseMaximum; const reduced=baseMaximum-1;
            const event=hpEvent(sheet.id,[{kind:"hp",targetId:sheet.id,field:"current",before:baseMaximum,after:reduced,provenance:[],lifetime:"character-durable",writeBack:"character"},{kind:"hp",targetId:sheet.id,field:"maximum",before:baseMaximum,after:reduced,provenance:[],lifetime:"character-durable",writeBack:"character"}]);
            const forward=projectResolutionCharacterWriteBack(sheet,[event],"forward"); assert.equal(forward.status,"committed",forward.status==="rejected"?forward.error:undefined); if(forward.status!=="committed") return; assert.equal(forward.sheet.hp,reduced); assert.equal(forward.sheet.maxHp,reduced); assert.equal(forward.sheet.sourceMaxHp,baseMaximum);
            const record=buildCharacterLibraryRecordV1(forward.sheet); assert.equal(record.source.build.maxHp,baseMaximum); assert.equal(record.runtime.hp,reduced); assert.equal(record.runtime.maxHp,reduced); const restarted=materializeCharacterRecordV1(record); assert.equal(restarted.hp,reduced); assert.equal(restarted.maxHp,reduced);
            const inverse=projectResolutionCharacterWriteBack(restarted,[event],"inverse"); assert.equal(inverse.status,"committed",inverse.status==="rejected"?inverse.error:undefined); if(inverse.status!=="committed") return; assert.equal(inverse.sheet.hp,baseMaximum); assert.equal(inverse.sheet.maxHp,baseMaximum);
          });
          EOF
      - name: Verify Family L max HP slice
        run: |
          npm run generate:content
          npx tsx --test tests/ui/c9FamilyLMaxHpPersistence.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Publish verified code and retire workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/persistenceContracts.ts src/app/characterLibraryPersistence.ts src/app/resolutionCharacterDurableProjection.ts tests/ui/c9FamilyLMaxHpPersistence.test.ts
          git rm .github/workflows/c9-family-l-max-hp-71304.yml
          git commit -m "feat(c9): persist maximum hp runtime overlays"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation; then sleep 2; else git rebase --abort; exit 1; fi
          done
          exit 1
