name: C9 Family P Semantic Outcomes

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-semantic-outcomes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Common Play semantic d20 outcome events
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > src/domain/commonPlaySemanticEventRuntime.ts
          echo '' | base64 -d > tests/domain/commonPlaySemanticEventRuntime.test.ts
          echo '' | base64 -d > tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts
          echo '' | base64 -d > /tmp/c9-patch.py
          python3 /tmp/c9-patch.py
      - name: Verify Family P semantic outcome slice
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:content
          npx tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts
          npx tsc --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified Family P slice and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-p-semantic-outcomes.yml
          git add src/domain/commonPlaySemanticEventRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlaySemanticEventRuntime.test.ts tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): emit portable d20 outcome events"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push
