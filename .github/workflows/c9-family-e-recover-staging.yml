name: C9 Family E Recover Staging

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-e-recover-staging.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Align Family E staging with current bounded-target parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-e-rich-selector-step.yml')
          text=path.read_text(encoding='utf-8')
          old='Number(selector.min)<1'
          new='Number(selector.min)<0'
          if text.count(old)!=1:
              raise SystemExit(f'expected one stale Family E min guard, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit recovery and retire helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-e-rich-selector-step.yml
          git rm .github/workflows/c9-family-e-recover-staging.yml
          git commit -m "ci(c9): align Family E selector staging"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
