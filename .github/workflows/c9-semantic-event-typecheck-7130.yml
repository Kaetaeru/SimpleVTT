name: C9 Semantic Event Typecheck Repair

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-semantic-event-typecheck-7130.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - name: Patch explicit effect state-change narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/domain/commonPlaySemanticEventRuntime.ts")
          text = source.read_text()
          marker = 'const EFFECT_METADATA_TEMPLATE="commonPlayTemplateId";\n'
          helper = '''const EFFECT_METADATA_TEMPLATE="commonPlayTemplateId";\n\nfunction effectStateChanges(event:ResolutionEvent,operation:EffectStateChange["operation"]):EffectStateChange[] {\n  const changes:EffectStateChange[]=[];\n  for(const change of event.stateChanges) {\n    if(change.kind==="effect"&&change.operation===operation) changes.push(change);\n  }\n  return changes;\n}\n'''
          if marker not in text:
              raise SystemExit("semantic event helper insertion seam changed")
          text = text.replace(marker, helper, 1)
          replacements = {
              'const applied=authoritativeEvent.stateChanges.filter((change):change is EffectStateChange=>change.kind==="effect"&&change.operation==="added");': 'const applied=effectStateChanges(authoritativeEvent,"added");',
              'const expired=authoritativeEvent.stateChanges.filter((change):change is EffectStateChange=>change.kind==="effect"&&change.operation==="removed");': 'const expired=effectStateChanges(authoritativeEvent,"removed");',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f"semantic event narrowing seam changed: {old}")
              text = text.replace(old,new,1)
          source.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Verify coverage ledger contract
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlaySemanticEventRuntime.ts
          git rm .github/workflows/c9-semantic-event-typecheck-7130.yml
          git commit -m "fix(c9): narrow effect semantic state changes"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
