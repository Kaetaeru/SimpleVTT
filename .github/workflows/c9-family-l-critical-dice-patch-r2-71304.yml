name: C9 Family L Critical Dice Patch R2 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-critical-dice-patch-r2-71304.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=agent/c9-gate-n-coverage-reconciliation
          WF=.github/workflows/c9-family-l-critical-dice-patch-r2-71304.yml
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin "$BRANCH" || true
              git reset --hard "origin/$BRANCH" || true
              rm -f "$WF"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "chore(c9): remove failed critical dice patch workflow" || true
                git fetch origin "$BRANCH" || true
                git rebase "origin/$BRANCH" || true
                git push origin HEAD:"$BRANCH" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          npm ci
          npm run generate:content

          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          domain = Path('src/domain/commonPlayOperationRuntime.ts')
          text = domain.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'const propertyDamageFlat=index===firstAttackHitDamageIndex?attackDamageFlat:0;\n      let amount:number|{operationId:string;field:"total";multiplier?:number;rounding?:"floor"|"ceil"|"round"};',
              'const propertyDamageFlat=index===firstAttackHitDamageIndex?attackDamageFlat:0;\n      const criticalFrom=entryPoint.test?.kind==="attack-roll"&&(operation.when===undefined||operation.when.right.value==="success")\n        ?`${input.resolutionId}:test`\n        :undefined;\n      let amount:number|{operationId:string;field:"total";multiplier?:number;rounding?:"floor"|"ceil"|"round"};',
              'criticalFrom',
          )
          text = replace_once(
              text,
              'kind:"damage-roll",\n          ...(when?{when}:{}),\n          request:{',
              'kind:"damage-roll",\n          ...(when?{when}:{}),\n          ...(criticalFrom?{criticalFrom}:{}),\n          request:{',
              'damage-roll',
          )
          text = replace_once(
              text,
              'kind:"damage",\n        ...(when?{when}:{}),\n        targetId,',
              'kind:"damage",\n        ...(when?{when}:{}),\n        ...(criticalFrom?{criticalFrom}:{}),\n        targetId,',
              'damage',
          )
          domain.write_text(text, encoding='utf-8')

          adapter = Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text = adapter.read_text(encoding='utf-8')
          old = '''function damageDiceFaces(
  internal:AdapterState,
  actionId:string,
  entryPoint:CommonPlayOperationDefinition["entryPoints"][number],
  startingDrawIndex:number,
) {
  const faces:Record<number,number[]>={};
  let drawIndex=startingDrawIndex;
  for(const [operationIndex,operation] of entryPoint.operations.entries()) {
    if(operation.kind!=="damage.apply"||typeof operation.amount!=="string") continue;
    const formula=parseCommonPlayDamageDiceFormula(operation.amount);
    faces[operationIndex]=Array.from({length:formula.count},()=>{
      const limit=20-(20%formula.sides);
      let face:number;
      do face=internal.d20(actionId,drawIndex++); while(face>limit);
      return ((face-1)%formula.sides)+1;
    });
  }
  return faces;
}'''
          new = '''function damageDiceFaces(
  internal:AdapterState,
  actionId:string,
  entryPoint:CommonPlayOperationDefinition["entryPoints"][number],
  startingDrawIndex:number,
) {
  const faces:Record<number,number[]>={};
  let drawIndex=startingDrawIndex;
  const draw=(sides:number)=>{
    const limit=20-(20%sides);
    let face:number;
    do face=internal.d20(actionId,drawIndex++); while(face>limit);
    return ((face-1)%sides)+1;
  };
  const criticalEligible:number[]=[];
  for(const [operationIndex,operation] of entryPoint.operations.entries()) {
    if(operation.kind!=="damage.apply"||typeof operation.amount!=="string") continue;
    const formula=parseCommonPlayDamageDiceFormula(operation.amount);
    faces[operationIndex]=Array.from({length:formula.count},()=>draw(formula.sides));
    if(entryPoint.test?.kind==="attack-roll"&&(operation.when===undefined||operation.when.right.value==="success")) {
      criticalEligible.push(operationIndex);
    }
  }
  for(const operationIndex of criticalEligible) {
    const operation=entryPoint.operations[operationIndex];
    if(operation.kind!=="damage.apply"||typeof operation.amount!=="string") continue;
    const formula=parseCommonPlayDamageDiceFormula(operation.amount);
    faces[operationIndex].push(...Array.from({length:formula.count},()=>draw(formula.sides)));
  }
  return faces;
}'''
          adapter.write_text(replace_once(text, old, new, 'damageDiceFaces'), encoding='utf-8')

          test_file = Path('tests/ui/c9FamilyLDamageDefenseProduction.test.ts')
          text = test_file.read_text(encoding='utf-8')
          helper = '''function criticalPackagePayload(prefix:string) {
  const moduleId=`${prefix}.module`,contentId=`${prefix}.option`,mechanicId=`${prefix}.damage`;
  return {moduleId,contentId,mechanicId,json:JSON.stringify({
    schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
    rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
    source:{document:"Portable Critical Damage Probe",version:"1",license:"CC0",srdDerived:false},
    dependencies:[],conflicts:[],capabilities:[],content:[{
      id:contentId,category:"option",
      presentation:{defaultLocale:"en",originalName:"Portable Critical Damage Probe",locales:{en:{name:"Portable Critical Damage Probe"}}},
      mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{
        id:"attack",invocation:"manual",targeting:{from:"targets",min:1,max:1},
        test:{kind:"attack-roll",roller:"actor",dc:{value:10}},
        operations:[{kind:"damage.apply",amount:"1d6+2",damageType:"fire",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}}],
      }]}}],
    }],
  })};
}

'''
          text = replace_once(text, 'function hp(snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>,actorId:string) {', helper + 'function hp(snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>,actorId:string) {', 'critical package test helper')

          execute_helper = '''async function executeCritical(prefix:string) {
  const adapter=new MockAdapter();
  const pack=criticalPackagePayload(prefix);
  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
  const preview=await adapter.previewContentImport(pack.json);
  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
  await adapter.activateContentImport();
  await adapter.startInitiative();
  await adapter.setCurrentActor("char.aelar");

  const action=installedCommonPlayActionId({
    catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),
    mechanicId:pack.mechanicId,
    entryPointId:"attack",
  });
  const before=hp(await adapter.getSnapshot(),TARGET_ID);
  (adapter as unknown as {queuedD20:number|null}).queuedD20=20;
  const snapshot=await adapter.resolveAction(action,[TARGET_ID]);
  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
  const component=snapshot.resolution?.damageComponents[0];
  assert.equal(component?.raw,14,"critical must roll 2d6 but add the +2 flat contribution only once");
  assert.equal(component?.adjusted,14);
  await adapter.undoLastResolution();
  assert.equal(hp(await adapter.getSnapshot(),TARGET_ID),before,"Undo must restore HP after portable critical damage");
  return component?.raw;
}

'''
          text = replace_once(text, 'async function executeInstantDeath(prefix:string) {', execute_helper + 'async function executeInstantDeath(prefix:string) {', 'executeCritical')

          test_block = '''test("unknown installed attack-roll doubles damage dice but not flat damage on critical with rename invariance and Undo",async()=>{
  assert.equal(await executeCritical("external.family-l-critical-dice"),14);
  assert.equal(await executeCritical("completely.renamed-family-l-critical-dice"),14);
});

'''
          text = replace_once(text, 'test("unknown installed damage.apply enforces character instant-death overkill with rename invariance and Undo",async()=>{', test_block + 'test("unknown installed damage.apply enforces character instant-death overkill with rename invariance and Undo",async()=>{', 'critical test')
          test_file.write_text(text, encoding='utf-8')
          PY

          npx tsx --test tests/ui/c9FamilyLDamageDefenseProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc -p tsconfig.json --noEmit

          rm -f "$WF"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(c9): route portable critical damage dice"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
