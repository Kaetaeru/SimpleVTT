name: C9 Family L Reduction Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-reduction-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Record verified Family L reduction evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text())
          family=next(entry for entry in data["mechanismFamilies"] if entry["family"]=="L")

          family["currentState"]=(
            "Bounded typed damage/healing plus portable Temporary HP are production-proven; portable structural damage reduction is production-proven through the shared damage authority with event-native Undo and external identity rename; portable character instant-death overkill, stabilization at 0 HP, damage-at-zero, and death saving throws are production-proven with event-native Undo and external identity rename. Damage-at-zero includes durable death-save failure write-back; remaining threshold/critical-dice/max-HP and object/vehicle semantics are incomplete."
          )

          def append_unique(key,value):
            values=family.setdefault(key,[])
            if value not in values:
              values.append(value)

          append_unique("implementationEvidence","commonPlayOperationRuntime.ts lowers portable damage.apply.reduction structurally to DamageAdjustment subtract, while resolutionTypes.ts and resolutionHealthOps.ts carry adjustments into the shared resolveDamage/resolveCompoundDamage authority without content identity dispatch")
          append_unique("productionEvidence","3efd2018fed14761f8c663cd4c7c39574eae0156 feat(c9): expose portable damage reduction; C9 Family L Damage Reduction 71304 run 33317630191 passed unknown/renamed portable reduction, adjacent Family L damage regressions, V1 coverage structure, legacy execution boundary, and tsc --noEmit")
          append_unique("identityInvarianceEvidence","c9FamilyLDamageDefenseProduction.test.ts repeats structural damage reduction under unrelated external module/content/mechanic identities with identical final damage and event-native Undo")

          old="complete generic threshold/reduction/critical-dice and max-HP acceptance remains incomplete"
          new="complete generic threshold/critical-dice and max-HP acceptance remains incomplete; structural reduction is proven"
          family["remainingNamedSeams"]=[new if value==old else value for value in family.get("remainingNamedSeams",[])]

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Verify V1 coverage structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish verified ledger reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-l-reduction-ledger-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): record portable damage reduction evidence"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 2
          done
          exit 1
