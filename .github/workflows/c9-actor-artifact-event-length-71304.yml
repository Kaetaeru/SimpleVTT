name: C9 Actor Artifact Event Length 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-actor-artifact-event-length-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-actor-artifact-event-length-71304
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generate:content
      - name: Instrument committed event registry in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/resolutionEventCommitRegistry.ts')
          s=p.read_text()
          s=s.replace(
            'export function recordCommittedResolutionEvents(resolutionId:string,events:ResolutionEvent[]) {\n',
            'export function recordCommittedResolutionEvents(resolutionId:string,events:ResolutionEvent[]) {\n  console.error(`[C9 registry record] ${resolutionId} events=${events.length}`);\n',
            1,
          )
          s=s.replace(
            'export function takeCommittedResolutionEvents(resolutionId:string) {\n  const events=committedByResolutionId.get(resolutionId);\n',
            'export function takeCommittedResolutionEvents(resolutionId:string) {\n  const events=committedByResolutionId.get(resolutionId);\n  console.error(`[C9 registry take] ${resolutionId} events=${events?.length ?? 0}`);\n',
            1,
          )
          p.write_text(s)
          PY
      - name: Run focused proof
        id: focused
        shell: bash
        run: |
          set +e
          node --import tsx --test tests/ui/connectedActorArtifactReconnectProduction.test.ts
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retire diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-actor-artifact-event-length-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            rm -f "$path"
            git add -A "$path"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ci(c9): retire actor artifact event-length diagnostic"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Preserve focused failure
        if: steps.focused.outputs.exit_code != '0'
        run: exit 1
