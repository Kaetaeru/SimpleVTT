name: C9 Family E Spatial Guard Fix 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-spatial-guard-fix-7130.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile latest branch
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git fetch origin "$branch"
          git rebase "origin/$branch"
      - name: Align rich selector guard with authoritative spatial candidate facts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one current form, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once(
              'src/app/installedCommonPlaySelectorGuardAdapter.ts',
              'import { snapshotAdapterTurnRuntimeState } from "./turnRuntimeSessionRegistry";\n',
              'import { snapshotAdapterTurnRuntimeState } from "./turnRuntimeSessionRegistry";\nimport { authoritativeCommonPlaySpatialRelation } from "./realSpatialRuntimeService";\n',
              'spatial authority import',
          )

          old_candidate='''function candidate(actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {\n  const relation=target.id===actor.id?"self":target.side===actor.side?"ally":"enemy";\n  return {\n    id:target.id,\n    targeting:{id:target.id,kind:"creature",relation},\n    properties:{\n      relation,\n      name:target.name,\n      side:target.side,\n      kind:target.kind,\n      hp:target.hp,\n      maxHp:target.maxHp,\n      tempHp:target.tempHp,\n      ac:target.ac,\n      initiative:target.initiative,\n      status:[...target.status],\n      resistances:[...target.resistances],\n      immunities:[...target.immunities],\n      vulnerabilities:[...target.vulnerabilities],\n    },\n  };\n}\n'''
          new_candidate='''function candidate(scene:SceneVm,actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {\n  const relation=target.id===actor.id?"self":target.side===actor.side?"ally":"enemy";\n  const spatial=authoritativeCommonPlaySpatialRelation(scene,actor.id,target.id);\n  return {\n    id:target.id,\n    targeting:spatial\n      ?{id:target.id,kind:"creature",relation,distanceFeet:spatial.distanceFeet,visible:spatial.visible,cover:spatial.cover}\n      :{id:target.id,kind:"creature",relation},\n    properties:{\n      relation,\n      name:target.name,\n      side:target.side,\n      kind:target.kind,\n      hp:target.hp,\n      maxHp:target.maxHp,\n      tempHp:target.tempHp,\n      ac:target.ac,\n      initiative:target.initiative,\n      status:[...target.status],\n      resistances:[...target.resistances],\n      immunities:[...target.immunities],\n      vulnerabilities:[...target.vulnerabilities],\n      ...(spatial?{\n        "spatial.distance-feet":spatial.distanceFeet,\n        "spatial.adjacent":spatial.distanceFeet<=5,\n        "spatial.total-cover":spatial.cover==="total",\n        "sense.can-see":spatial.visible,\n      }:{}),\n    },\n  };\n}\n'''
          replace_once('src/app/installedCommonPlaySelectorGuardAdapter.ts',old_candidate,new_candidate,'guard candidate')
          replace_once(
              'src/app/installedCommonPlaySelectorGuardAdapter.ts',
              'candidates:internal.scene.entities.filter((entity)=>state.combatants[entity.id]).map((entity)=>candidate(actor,entity)),',
              'candidates:internal.scene.entities.filter((entity)=>state.combatants[entity.id]).map((entity)=>candidate(internal.scene,actor,entity)),',
              'guard candidate call',
          )

          test_path=Path('tests/ui/commonPlayRichSelectorProduction.test.ts')
          text=test_path.read_text(encoding='utf-8')
          old='''            ?{from:"targets",min:1,max:2,where:{op:"lte",left:{ref:"spatial.distance-feet"},right:{value:distanceLimitFeet}}}\n'''
          new='''            ?{from:"targets",min:1,max:2,where:{op:"all",args:[\n              {op:"lte",left:{ref:"spatial.distance-feet"},right:{value:distanceLimitFeet}},\n              {op:"eq",left:{ref:"sense.can-see"},right:{value:true}},\n              {op:"eq",left:{ref:"spatial.total-cover"},right:{value:false}},\n            ]}}\n'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit(f'spatial predicate marker mismatch: {text.count(old)}')
              text=text.replace(old,new,1)
          old_test='''test("unknown installed rich selector consumes provider-backed authoritative spatial distance",async()=>{\n  const adapter=new MockAdapter();\n  const actionId=await install(adapter,ORIGINAL,false,30);\n  const internal=adapter as unknown as {scene:SceneVm};\n  setSpatialRelation(internal.scene,{sourceId:"char.aelar",targetId:"combatant.goblin-a",distanceFeet:20,visible:true,cover:"none",targetCanSeeAttacker:true,provenance:"module:test-spatial:selector"});\n  setSpatialRelation(internal.scene,{sourceId:"char.aelar",targetId:"combatant.goblin-b",distanceFeet:40,visible:true,cover:"none",targetCanSeeAttacker:true,provenance:"module:test-spatial:selector"});\n  await adapter.startInitiative();\n  await adapter.setCurrentActor("char.aelar");\n  await adapter.resolveAction(actionId,["combatant.goblin-b"]);\n  let snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.actionId,actionId);\n  assert.equal(snapshot.resolution?.finalOutcome,"적용 거부");\n  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.stage,"complete");\n  assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);\n});\n'''
          new_test='''test("unknown installed rich selector consumes provider-backed distance, sight, and cover facts across identity rename",async()=>{\n  async function run(identity:Identity) {\n    const adapter=new MockAdapter();\n    const actionId=await install(adapter,identity,false,30);\n    const internal=adapter as unknown as {scene:SceneVm};\n    setSpatialRelation(internal.scene,{sourceId:"char.aelar",targetId:"combatant.goblin-a",distanceFeet:20,visible:true,cover:"none",targetCanSeeAttacker:true,provenance:"module:test-spatial:selector"});\n    setSpatialRelation(internal.scene,{sourceId:"char.aelar",targetId:"combatant.goblin-b",distanceFeet:20,visible:false,cover:"total",targetCanSeeAttacker:true,provenance:"module:test-spatial:selector"});\n    await adapter.startInitiative();\n    await adapter.setCurrentActor("char.aelar");\n    await adapter.resolveAction(actionId,["combatant.goblin-b"]);\n    let snapshot=await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.actionId,actionId);\n    assert.equal(snapshot.resolution?.finalOutcome,"적용 거부");\n    await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n    snapshot=await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.stage,"complete");\n    assert.notEqual(snapshot.resolution?.finalOutcome,"적용 거부");\n    assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);\n    return snapshot.resolution?.targetIds;\n  }\n  assert.deepEqual(await run(RENAMED),await run(ORIGINAL));\n});\n'''
          if new_test not in text:
              if text.count(old_test)!=1: raise SystemExit(f'spatial test marker mismatch: {text.count(old_test)}')
              text=text.replace(old_test,new_test,1)
          test_path.write_text(text,encoding='utf-8')

          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          family=next(row for row in data['rows'] if row.get('family')=='E')
          family['currentState']='Portable Common Play targeting preserves bounded selected target sets, evaluates generic predicates over authoritative production candidates, routes authored automatic selection plus orderBy through the shared selector kernel with Host authority, and consumes provider-backed distance/range/reach, sight, and cover facts without content identity dispatch; providerless area membership fails closed, while provider-backed area membership and object/point selection remain incomplete.'
          evidence='installedCommonPlayRuntimeAdapter.ts and installedCommonPlaySelectorGuardAdapter.ts map authoritativeCommonPlaySpatialRelation into the same generic selector facts for distance/range/reach thresholds, visibility, adjacency, and total-cover checks'
          if evidence not in family['implementationEvidence']: family['implementationEvidence'].append(evidence)
          prod='commonPlayRichSelectorProduction.test.ts rejects hidden/total-cover spatial targets, accepts visible in-range unoccluded targets through production execution, and proves the same provider-backed selector behavior after complete external identity rename'
          if prod not in family['productionEvidence']: family['productionEvidence'].append(prod)
          ident='commonPlayRichSelectorProduction.test.ts preserves provider-backed distance/sight/cover selector semantics across arbitrary module/content/mechanic/entry/display identity rename'
          if ident not in family['identityInvarianceEvidence']: family['identityInvarianceEvidence'].append(ident)
          family['remainingNamedSeams']=['provider-backed area membership and object/point selection remain incomplete']
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family E spatial selector slice
        run: >-
          node --import tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
          tests/ui/c9FamilyEConditionSelectorProduction.test.ts
          tests/ui/c9FamilyETagSelectorProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify boundaries and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/installedCommonPlaySelectorGuardAdapter.ts tests/ui/commonPlayRichSelectorProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "fix(c9): share spatial facts with selector guard"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            npm run generate:content
            node --import tsx --test tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/c9FamilyEConditionSelectorProduction.test.ts tests/ui/c9FamilyETagSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            if git push origin HEAD:"$branch"; then exit 0; fi
          done
          exit 1
