name: C9 Family AG Production Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ag-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile AG production boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(ledger.rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0) throw new Error(`unexpected coverage ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('gateNBlockingNamedFallbacks is not empty');
          const ag=ledger.rows.find(r=>r.family==='AG'&&r.id==='standard-actions');
          if(!ag||ag.disposition!=='INCOMPLETE') throw new Error('Family AG must still be INCOMPLETE');
          const projection=fs.readFileSync('src/app/productionPlayRuntimeAdapter.ts','utf8');
          const ready=fs.readFileSync('src/app/standardActionReactionAdapter.ts','utf8');
          for(const token of ['action.dash','standardEffect("disengage"','standardEffect("dodge"','standardEffect("help"','standardCheck("hide"','standardCheck("influence"','standardEffect("ready"','standardCheck("search"','standardCheck("study"','standardEffect("utilize"']) if(!projection.includes(token)) throw new Error(`standard action projection changed: ${token}`);
          if(!projection.includes('spellMechanicById')) throw new Error('Magic action spell dispatch changed; re-audit');
          if(!ready.includes('action.standard.ready')||!ready.includes('READY_TRIGGER_ID')||!ready.includes('previousResolveAction.call')) throw new Error('Ready adapter changed; re-audit');
          ag.currentState='Attack, Dash, Disengage, Dodge, Help, Hide, Influence, Search, Study, and Utilize have structural production projections that execute through existing attack/movement/status/d20 completion paths. Family-wide portable no-edit acceptance is still blocked because built-in Ready uses the action.standard.ready/trigger adapter to select off-turn behavior, while Magic actions enter the Family Z spell path that still selects mechanics through spellMechanicById. Unknown installed Ready has separate generic stored-invocation evidence, but the standard-action family cannot be marked final while these production identity/dependency seams remain.';
          ag.implementationEvidence=[...(ag.implementationEvidence??[]),'productionPlayRuntimeAdapter.ts structural standard action projections','standardActionReactionAdapter.ts current Ready compatibility path','5308c15e installed Ready stored-invocation evidence'];
          ag.productionEvidence=[...(ag.productionEvidence??[]),'C8 structural standard no-roll/check/movement production evidence retained in STATE','5308c15e installed Ready production capture/cancel/expiry/Undo'];
          ag.remainingNamedSeams=[
            'built-in action.standard.ready/trigger adapter still selects Ready off-turn execution',
            'Magic action inherits Family Z productionSpellRuntimeAdapter spellMechanicById identity dispatch',
            'full arbitrary-ID connected/persistence matrix for the complete standard-action composition set'
          ];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const statePath='.chatgpt-rerun/STATE.md';
          let state=fs.readFileSync(statePath,'utf8');
          const marker='## Next Exact Action';
          const idx=state.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          const before=state.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family AG audit — standard action dependencies remain\n\nFamily AG (`standard-actions`) remains `INCOMPLETE`. Most standard actions are already structural production projections: Attack uses authored attack facts; Dash uses movement budget; Disengage/Dodge/Help use status/effect facts; Hide/Influence/Search/Study use generic d20 checks; Utilize uses generic no-roll completion. However built-in Ready still routes through `action.standard.ready`/`READY_TRIGGER_ID` compatibility logic in `standardActionReactionAdapter.ts`, and Magic enters the Family Z spell path that still uses `spellMechanicById`. Installed arbitrary Ready has generic stored-invocation evidence, but those remaining production identity/dependency seams prevent family-wide final disposition.\n\n';
          const next='## Next Exact Action\n\nDo not reopen Families S/T/U/AB or audited authority/dependency-blocked P/V/W/X/Y/Z/AA/AC/AD/AE/AF/AG seams. Move to Family AH (`tools-crafting-projects`): audit whether `commonPlayProjectRuntime` plus durable item/payment owners already define a portable production project lifecycle with cooperative work, interruption, elapsed progress, payment, completion output, persistence/reconnect, and identity invariance. If durable project ownership or output write-back is undefined, keep AH `INCOMPLETE` and record the exact boundary instead of forcing project state into combat Resolution.\n';
          fs.writeFileSync(statePath,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs || true
          git diff --check
      - name: Commit AG audit and STATE
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): audit standard action production gaps"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family AG has broad structural production coverage but remains INCOMPLETE because built-in Ready still selects off-turn behavior through action.standard.ready compatibility logic and Magic inherits Family Z spellMechanicById dispatch. Next audit Family AH tools/crafting/projects against durable project and output ownership.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          rm .github/workflows/rerun-c9-ag-audit.yml
          git add .chatgpt-rerun/control.json .github/workflows/rerun-c9-ag-audit.yml
          git commit -m "docs(rerun): continue after standard action audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation