name: C9 Family I Movement Production 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - tests/ui/c9FamilyIMovementProduction.test.ts
      - .github/workflows/c9-family-i-movement-production-7130.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Family I movement production matrix
        run: node --import tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/ui/c9FamilyIMovementProduction.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Verify V1 mechanism ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Record verified Family I production evidence and retire verifier
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          row=next(row for row in data["rows"] if row["family"]=="I")
          evidence="c9FamilyIMovementProduction.test.ts unknown installed Common Play executes walk/climb/swim/fly/crawl/jump, movement cost multiplier, push/pull/teleport, Undo, and full external identity rename through the production Resolver; C9 Family I Movement Production 7130 run " + os.environ["RUN_ID"]
          if evidence not in row["productionEvidence"]:
              row["productionEvidence"].append(evidence)
          identity="c9FamilyIMovementProduction.test.ts full external module/content/mechanic rename preserves the production movement matrix"
          if identity not in row["identityInvarianceEvidence"]:
              row["identityInvarianceEvidence"].append(identity)
          row["currentState"]="Canonical movement.relocate parses through the generic operations lowerer. Unknown installed Common Play now executes walk, climb, swim, fly, crawl, jump, cost multipliers, push, pull, and teleport through the production Resolver with Undo and external identity rename invariance; stored movement also has Host replay, duplicate handling, Undo, and reconnect. Family I remains incomplete for rules-derived movement constraints and named movement-grant convergence."
          row["remainingNamedSeams"]=[
              "named movement grants",
              "rules-derived Difficult Terrain, Prone stand cost, drag/carry, zero-speed, alternate-speed, and related movement constraint authority remain incomplete",
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): record Family I production movement matrix"
          git rm .github/workflows/c9-family-i-movement-production-7130.yml
          git commit -m "chore(c9): retire Family I movement verifier"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
