name: C9 Family E Automatic Selector Proof

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-auto-selector-proof.yml

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add automatic selector production proof
        shell: bash
        run: |
          TEST_B64=''
          python -c 'import base64; from pathlib import Path; p=Path("tests/ui/installedCommonPlayProductionRuntime.test.ts"); t=p.read_text(); marker="test(\"unknown installed Common Play rich predicate filters authoritative scene properties without identity dispatch\""; addition=base64.b64decode("'"$TEST_B64"'").decode(); p.write_text(t if "automatic selector uses Host authority ordering" in t else t.replace(marker,addition+marker,1))'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify selector production proof
        run: npx tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify typecheck
        run: npx tsc --noEmit
      - name: Commit verified proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/installedCommonPlayProductionRuntime.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(c9): prove automatic selector host authority"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
