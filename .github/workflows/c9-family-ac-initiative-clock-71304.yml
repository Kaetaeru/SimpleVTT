name: C9 Family AC Initiative Clock 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-ac-initiative-clock-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply initiative-count slice
        run: python3 .github/c9-ac-initiative-clock-patch.py
      - name: Verify targeted Common Play runtime
        run: npx tsx --test tests/domain/commonPlayC6Runtime.test.ts
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Commit verified slice
        run: |
          rm .github/c9-ac-initiative-clock-patch.py
          rm .github/workflows/c9-family-ac-initiative-clock-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/effects.ts src/domain/resolutionTypes.ts src/domain/resolutionTurnOps.ts src/domain/resolution.ts src/domain/commonPlaySpecialTimingRuntime.ts tests/domain/commonPlayC6Runtime.test.ts .github/c9-ac-initiative-clock-patch.py .github/workflows/c9-family-ac-initiative-clock-71304.yml
          git commit -m "feat(c9): make initiative-count timing authoritative"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
