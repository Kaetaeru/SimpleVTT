name: C9 Family J Spatial Revalidation 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-spatial-revalidation-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - run: npm run generate:content
      - name: Make execution-time selector revalidation authoritative
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=path.read_text(encoding='utf-8')
          old='''    if(projectedAction&&(!projectedAction.available||selectionMode==="manual"&&targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;'''
          new='''    if(projectedAction&&!projectedAction.available) return undefined;'''
          if old in text:
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected Common Play targeting revalidation guard not found')
          test=Path('tests/ui/c9FamilyJSpatialAttackProduction.test.ts')
          source=test.read_text(encoding='utf-8')
          needle='''  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));'''
          diagnostic='''  assert.notEqual(snapshot.resolution?.finalOutcome,"적용 거부",JSON.stringify(snapshot.resolution));\n'''+needle
          if diagnostic not in source:
              source=source.replace(needle,diagnostic,1)
              test.write_text(source,encoding='utf-8')
          PY
      - name: Diagnose Family J spatial slice
        run: node --import tsx --test tests/ui/c9FamilyJSpatialAttackProduction.test.ts
      - name: Verify Family J spatial slice
        run: |
          git checkout -- tests/ui/c9FamilyJSpatialAttackProduction.test.ts
          node --import tsx --test \
            tests/ui/c9FamilyJSpatialAttackProduction.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJAttackPersistence.test.ts \
            tests/ui/c9FamilyESpatialSelectorProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish fix and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-spatial-revalidation-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add src/app/installedCommonPlayRuntimeAdapter.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(c9): revalidate spatial targets at execution"
          for attempt in $(seq 1 8); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
