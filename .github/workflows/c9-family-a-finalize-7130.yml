name: C9 Family A Finalize 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-a-finalize-7130.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Reconcile Family A ledger evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger=json.loads(path.read_text())
          row=next(entry for entry in ledger["rows"] if entry["family"]=="A")
          row["currentState"]=(
              "Family A is ACCEPTED through the shared RulesProfile/Effect property owner. Production Common Play builds authoritative stored property inputs from Character and turn-runtime state, resolves every available RulesProfile property and derived formula through resolveRuntimeProfileProperty, and composes active Effect-owned property modifiers without content-name or content-ID dispatch. The same resolver projects scene-owned movement.walk, defense.ac, and initiative fields, while arbitrary profile refs such as ability.str.modifier are consumable by generic Common Play operations. Stack, replace, and unique-by-source instance policies are reversible; source-bound modifiers converge through connected replay/reconnect/Undo and survive an independent local adapter restart through durable turn-runtime persistence."
          )
          row["disposition"]="IMPLEMENTED"
          for value in [
              "effectProfilePropertyResolver.ts generic resolveEffectModifiedProfileProperty composition across RulesProfile formulas and Effect-owned modifiers",
              "installedCommonPlayRuntimeAdapter.ts commonPlayActorProfileProperties projects authoritative Character/turn-runtime inputs and all resolvable RulesProfile properties into generic operation expression refs",
              "turnRuntimeSessionRegistry.ts durable local RulesRuntimeState store plus shared movement/AC/initiative profile-property projection",
          ]:
              if value not in row["implementationEvidence"]:
                  row["implementationEvidence"].append(value)
          for value in [
              "7929e2db6c33246dcfd0a0824fd65b15bebcbb0c composes profile properties with runtime effects",
              "3a96ffb807be9b78ecabc82bba87e830e74d753e projects non-movement profile modifiers",
              "0154c374a054a56984991df759508c21a4e95149 projects derived profile properties to Common Play",
              "ca24b21f06ca045be4e56c544449d6fa8d84c3da persists offline turn runtime state",
              "C9 Family A Profile Property 7130 run 33311275824: installed Common Play profile-property production coverage and tsc --noEmit passed at 031252b5fd68d9e7773cb438387c68677654a50e",
          ]:
              if value not in row["productionEvidence"]:
                  row["productionEvidence"].append(value)
          for value in [
              "installedCommonPlayPropertyModifierProduction.test.ts renamed external module preserves generic property-modified execution including derived profile refs",
          ]:
              if value not in row["identityInvarianceEvidence"]:
                  row["identityInvarianceEvidence"].append(value)
          for value in [
              "installedCommonPlayPropertyModifierProduction.test.ts source-bound modifier connected replay, reconnect, event-native Undo, and reconnect-after-Undo",
          ]:
              if value not in row["connectedEvidenceIfRelevant"]:
                  row["connectedEvidenceIfRelevant"].append(value)
          for value in [
              "installedCommonPlayPropertyModifierProduction.test.ts fresh local adapter restart restores the source-bound Effect and reuses it through generic Common Play execution",
              "ca24b21f06ca045be4e56c544449d6fa8d84c3da Memory/platform TurnRuntimeStateStore persists structured runtime Effects independently of connected ledger replay",
          ]:
              if value not in row["persistenceEvidenceIfRelevant"]:
                  row["persistenceEvidenceIfRelevant"].append(value)
          row["remainingNamedSeams"]=[]
          row["connectedRelevant"]=True
          row["persistenceRelevant"]=True
          path.write_text(json.dumps(ledger,indent=2,ensure_ascii=False)+"\n")
          PY
      - name: Verify Family A production coverage
        run: npx tsx --test tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
      - name: Verify ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Commit reconciled ledger and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c9-family-a-finalize-7130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-a-finalize-7130.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(c9): accept Family A property coverage"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation

# retrigger: 7130 family A acceptance
