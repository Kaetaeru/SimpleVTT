name: C9 Family AE Clock Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ae-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile AE clock and persistence boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const rows=ledger.rows;
          const counts=rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0) throw new Error(`unexpected coverage ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('gateNBlockingNamedFallbacks is not empty');
          const ae=rows.find(r=>r.family==='AE'&&r.id==='hazards-exposure-environment');
          if(!ae||ae.disposition!=='INCOMPLETE') throw new Error('Family AE must still be INCOMPLETE');
          const exposure=fs.readFileSync('src/domain/commonPlayExposureRuntime.ts','utf8');
          const environment=fs.readFileSync('src/domain/commonPlayEnvironmentRuntime.ts','utf8');
          const effects=fs.readFileSync('src/domain/effects.ts','utf8');
          const schema=fs.readFileSync('schemas/common-play-contract.schema.json','utf8');
          if(!exposure.includes('advanceCommonPlayExposure')||!exposure.includes('recoverCommonPlayExposure')) throw new Error('exposure kernel shape changed; re-audit');
          if(!environment.includes('fallDamageDice')) throw new Error('environment kernel shape changed; re-audit');
          if(!/interface RuntimeClock\s*\{[\s\S]*round:\s*number;[\s\S]*elapsedSeconds:\s*number;/.test(effects)) throw new Error('RuntimeClock shape changed; re-audit');
          if(/"exposure"\s*:/.test(schema)||/"environmentProfile"\s*:/.test(schema)) throw new Error('portable exposure/environment contract now exists; re-audit');
          ae.currentState='Exposure and environment kernels exist: a revision-bound exposure counter can advance/recover and report newly crossed intervals, while pure environment helpers calculate falling, movement, attack, and damage-defense semantics. The authoritative RuntimeClock is combat/session round+elapsed time, not a durable campaign exposure owner, and the persisted Common Play contract has no exposure/environment state. Production therefore has no authoritative campaign-clock join, periodic save/damage/Exhaustion dispatch, durable recovery transaction, or reconnect persistence for dehydration/suffocation/extreme exposure/traps.';
          ae.remainingNamedSeams=[
            'persisted portable exposure/environment authoring and durable subject state',
            'authoritative campaign/session elapsed-clock ownership and restart/reconnect persistence',
            'periodic threshold scheduling into generic save/damage/effect Resolution transactions',
            'recovery/reset transaction and representative hazard composition proof'
          ];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const statePath='.chatgpt-rerun/STATE.md';
          let state=fs.readFileSync(statePath,'utf8');
          const marker='## Next Exact Action';
          const idx=state.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          const before=state.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family AE audit — durable exposure clock owner missing\n\nFamily AE (`hazards-exposure-environment`) remains `INCOMPLETE`. The exposure/environment code is kernel-only: exposure owns a revision-bound local elapsed counter and environment helpers calculate fall/movement/attack/defense results, while authoritative `RuntimeClock` is combat/session round+elapsed time. The persisted Common Play contract and production session do not define durable exposure state, campaign-time ownership, periodic threshold dispatch into saves/damage/Effects, recovery persistence, or reconnect reconstruction. Reusing combat elapsed time as campaign exposure time would invent lifetime policy forbidden by the charter.\n\n';
          const next='## Next Exact Action\n\nDo not reopen Families S/T/U/AB or the audited authority-blocked P/V/W/X/Y/Z/AA/AC/AD/AE seams. Move to Family AF (`underwater-special-environment`): audit whether the existing environment profile helpers plus movement/attack/damage/sense production facts can be activated as a portable authoritative session environment without named content. If environment-profile activation/persistence or breathing/suffocation ownership is undefined, keep AF `INCOMPLETE` and record the exact contract gap rather than inventing environment state; otherwise add only the smallest production composition proof.\n';
          fs.writeFileSync(statePath,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs || true
          git diff --check
      - name: Commit AE audit and STATE
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): audit exposure clock authority gap"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family AE remains INCOMPLETE because exposure/environment kernels have no persisted portable exposure state, durable campaign/session clock owner, periodic save/damage/effect dispatch, recovery transaction, or reconnect persistence; combat elapsed time must not be silently reinterpreted as campaign exposure time. Next audit Family AF underwater environment activation/persistence and breathing ownership.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          rm .github/workflows/rerun-c9-ae-audit.yml
          git add .chatgpt-rerun/control.json .github/workflows/rerun-c9-ae-audit.yml
          git commit -m "docs(rerun): continue after exposure audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation