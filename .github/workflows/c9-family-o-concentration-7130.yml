name: C9 Family O Concentration 7130

on:
  push:
    paths:
      - '.github/workflows/c9-family-o-concentration-7130.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Capture baseline type diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc-before.log 2>&1
          code=$?
          set -e
          cat /tmp/tsc-before.log
          echo "$code" > /tmp/tsc-before.code
      - name: Bridge maintained concentration to the shared Resolver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/domain/commonPlayEffectRuntime.ts')
          text=path.read_text()
          replacements=[
            ('type CommonPlayEffectDuration=\n  | {kind:"durable"}\n  | {\n      kind:"elapsed";', 'type CommonPlayEffectDuration=\n  | {kind:"durable"}\n  | {kind:"maintained";policy:"concentration"}\n  | {\n      kind:"elapsed";'),
            ('  if (duration.kind==="durable") {\n    assertOnlyKeys(duration,["kind"],label);\n    return {kind:"permanent"};\n  }\n  assertOnlyKeys(duration,["kind","amount","unit","decrementAt"],label);', '  if (duration.kind==="durable") {\n    assertOnlyKeys(duration,["kind"],label);\n    return {kind:"permanent"};\n  }\n  if (duration.kind==="maintained") {\n    assertOnlyKeys(duration,["kind","policy"],label);\n    if (duration.policy!=="concentration") throw new Error(`${label} maintained policy must be concentration`);\n    return {kind:"concentration"};\n  }\n  assertOnlyKeys(duration,["kind","amount","unit","decrementAt"],label);'),
            ('  input:{operationId:string;effectId:string;sourceActorId:string;targetId:string},\n):Extract<ResolutionOperation,{kind:"apply-effect"}> {', '  input:{operationId:string;effectId:string;sourceActorId:string;targetId:string;concentrationGroupId?:string},\n):Extract<ResolutionOperation,{kind:"apply-effect"}> {'),
            ('      kind:"marker",\n      duration:runtimeDuration(template.duration,`artifact ${template.id} duration`),', '      kind:"marker",\n      ...(input.concentrationGroupId?{concentrationGroupId:input.concentrationGroupId}:{}),\n      duration:runtimeDuration(template.duration,`artifact ${template.id} duration`),'),
            ('  operationIndex:number,\n):Extract<ResolutionOperation,{kind:"apply-effect"}> {', '  operationIndex:number,\n  concentrationGroupId?:string,\n):Extract<ResolutionOperation,{kind:"apply-effect"}> {'),
            ('    targetId:input.actorId,\n  });', '    targetId:input.actorId,\n    concentrationGroupId,\n  });')
          ]
          for old,new in replacements:
            if old not in text:
              raise SystemExit('source anchor changed: '+old[:80])
            text=text.replace(old,new,1)
          old='  const operations:ResolutionOperation[]=[...compileCommonPlayPayments(parseCommonPlayPayments(definition.payments),input),...entryPoint.operations.map((operation,index)=>{\n    const label=`entry point ${entryPoint.id} operation ${index+1}`;\n    assertOnlyKeys(operation,["kind","template","target"],label);\n    if (operation.kind!=="effect.apply") throw new Error(`${label} supports only effect.apply`);\n    if (operation.target!==undefined&&operation.target!=="actor") {\n      throw new Error(`${label} target must be actor in this runtime slice`);\n    }\n    return effectForTemplate(definition,templateById(definition,operation.template),input,index);\n  })];'
          new='  const activationOperations:ResolutionOperation[]=[];\n  entryPoint.operations.forEach((operation,index)=>{\n    const label=`entry point ${entryPoint.id} operation ${index+1}`;\n    assertOnlyKeys(operation,["kind","template","target"],label);\n    if (operation.kind!=="effect.apply") throw new Error(`${label} supports only effect.apply`);\n    if (operation.target!==undefined&&operation.target!=="actor") {\n      throw new Error(`${label} target must be actor in this runtime slice`);\n    }\n    const template=templateById(definition,operation.template);\n    const concentrationGroupId=template.duration.kind==="maintained"\n      ? `${input.resolutionId}:concentration:${index+1}:${template.id}`\n      : undefined;\n    if(concentrationGroupId) activationOperations.push({\n      id:`common-play-concentration-start-${index+1}`,\n      kind:"start-concentration",\n      actorId:input.actorId,\n      groupId:concentrationGroupId,\n      sourceId:definition.id,\n    });\n    activationOperations.push(effectForTemplate(definition,template,input,index,concentrationGroupId));\n  });\n  const operations:ResolutionOperation[]=[...compileCommonPlayPayments(parseCommonPlayPayments(definition.payments),input),...activationOperations];'
          if old not in text:
            raise SystemExit('activation anchor changed')
          text=text.replace(old,new,1)
          path.write_text(text)

          test_path=Path('tests/domain/commonPlayEffectRuntime.test.ts')
          tests=test_path.read_text()
          anchor='test("Common Play effect runtime rejects unsupported semantic target shapes before activation",()=>{'
          addition='''test("Common Play maintained concentration reuses Resolver replacement and damage-break semantics",()=>{\n  const definition=structuredClone(DEFINITION);\n  definition.id="external.unknown.concentration-a";\n  definition.artifactTemplates[0].duration={kind:"maintained",policy:"concentration"};\n\n  const first=committed(resolveCommonPlayEffectActivation(TEST_PROFILE,runtimeState(),definition,{\n    resolutionId:"external-concentration-a",actorId:"hero",entryPointId:"activate",\n  }),"portable concentration activation should commit");\n  const firstGroup=first.state.concentration.hero?.groupId;\n  assert.ok(firstGroup);\n  assert.equal(first.state.concentration.hero?.sourceId,definition.id);\n  assert.equal(first.state.effects.length,1);\n  assert.equal(first.state.effects[0].concentrationGroupId,firstGroup);\n\n  const renamed=structuredClone(definition);\n  renamed.id="external.previously-unseen.concentration-b";\n  const second=committed(resolveCommonPlayEffectActivation(TEST_PROFILE,first.state,renamed,{\n    resolutionId:"external-concentration-b",actorId:"hero",entryPointId:"activate",\n  }),"replacement concentration should commit");\n  assert.equal(second.state.effects.some((effect)=>effect.concentrationGroupId===firstGroup),false);\n  assert.equal(second.state.effects.length,1);\n  assert.equal(second.state.concentration.hero?.sourceId,renamed.id);\n  assert.equal(second.state.effects[0].concentrationGroupId,second.state.concentration.hero?.groupId);\n\n  const broken=committed(resolvePendingResolution(TEST_PROFILE,second.state,{\n    id:"external-concentration-damage",\n    actorId:"goblin",\n    sourceId:"external.unknown.damage",\n    expectedRevision:second.state.revision,\n    operations:[{\n      id:"damage",kind:"damage",targetId:"hero",damageType:"force",amount:8,creatureKind:"character",\n      concentrationCheck:{dice:{id:"portable-concentration-d20",purpose:"concentration",sides:20,faces:[1]}},\n    }],\n  }),"failed concentration save should commit the damage and cleanup");\n  assert.equal(broken.state.concentration.hero,undefined);\n  assert.equal(broken.state.effects.length,0);\n  const damage=broken.events.find((event)=>event.operationId==="damage");\n  assert.ok(damage?.stateChanges.some((change)=>change.kind==="concentration"));\n  assert.ok(damage?.stateChanges.some((change)=>change.kind==="effect"));\n});\n\n'''
          if anchor not in tests:
            raise SystemExit('test anchor changed')
          tests=tests.replace(anchor,addition+anchor,1)
          test_path.write_text(tests)
          PY
      - name: Verify Family O bridge
        shell: bash
        run: |
          npx tsx --test tests/domain/commonPlayEffectRuntime.test.ts tests/domain/concentrationDamageResult.test.ts
          set +e
          npx tsc --noEmit > /tmp/tsc-after.log 2>&1
          code=$?
          set -e
          cat /tmp/tsc-after.log
          test "$code" = "$(cat /tmp/tsc-before.code)"
          cmp /tmp/tsc-before.log /tmp/tsc-after.log
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Commit verified bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/c9-family-o-concentration-7130.yml
          git add src/domain/commonPlayEffectRuntime.ts tests/domain/commonPlayEffectRuntime.test.ts .github/workflows/c9-family-o-concentration-7130.yml
          git commit -m "feat(c9): lower portable maintained concentration"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
