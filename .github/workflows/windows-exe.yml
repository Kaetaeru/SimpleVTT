name: Windows EXE (V2 preview)

# Builds the distributable Windows executable of the V2 table runtime and publishes it as a GitHub pre-release,
# so a tester can download SimpleVTT-<sha>.exe without a GitHub Actions login. The full test gate of `npm run build`
# runs on Linux CI; this job only needs the frontend bundle (`build:frontend`) and the Rust library tests.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/practical-newton-rye61w
    paths:
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Rust persistence and transport library tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build the Windows executable (frontend bundle + Tauri, no installer)
        shell: pwsh
        run: npm run tauri:build -- --no-bundle --config src-tauri/tauri.release.conf.json
      - name: Stage the executable
        id: stage
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/simplevtt.exe"
          if (-not (Test-Path $source)) { throw "SimpleVTT executable was not produced at $source" }
          $short = "${{ github.sha }}".Substring(0, 8)
          New-Item -ItemType Directory -Force -Path exe-artifact | Out-Null
          $name = "SimpleVTT-$short.exe"
          Copy-Item $source "exe-artifact/$name"
          $hash = (Get-FileHash -Algorithm SHA256 "exe-artifact/$name").Hash.ToLower()
          @(
            "SimpleVTT V2 preview build (DM workspace + table runtime)",
            "commit=${{ github.sha }}",
            "ref=${{ github.ref }}",
            "run_id=${{ github.run_id }}",
            "exe=$name",
            "sha256=$hash",
            "requires=Windows 10/11 with the WebView2 runtime (preinstalled on current Windows)"
          ) | Set-Content -Encoding utf8 "exe-artifact/BUILD.txt"
          "name=$name" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVTT-V2-preview-${{ github.sha }}
          path: exe-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Publish as a GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview-${{ github.run_number }}-${{ steps.stage.outputs.short }}
          name: SimpleVTT V2 preview ${{ steps.stage.outputs.short }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            V2 테이블 런타임 + DM 워크스페이스 미리보기 빌드 (commit ${{ github.sha }}).

            - `${{ steps.stage.outputs.name }}`: 설치 없이 실행하는 단일 실행 파일. Windows 10/11의 WebView2 런타임이 필요합니다(최신 Windows에는 기본 포함).
            - SHA-256: `${{ steps.stage.outputs.sha256 }}`
            - 세션: 캠페인 → 세션 시작 → 준비 화면으로 → 세션 열기(Host, 포트 3210). 다른 PC는 세션 참가에 Host IP:3210을 넣습니다.
            - 옛 화면이 필요하면 `localStorage.simplevtt.table = "legacy"`.
          files: |
            exe-artifact/${{ steps.stage.outputs.name }}
            exe-artifact/BUILD.txt
