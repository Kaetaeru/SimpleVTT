name: C9 Family J Identity Evidence Converge 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-id-evidence-converge-71304.yml

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Align Family J ledger with verified projected identity bridge
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          assert row['disposition']=='INCOMPLETE'

          old='Projected Unarmed grapple/shove dispatches from a typed runtimeSaveCondition action payload rather than named action IDs; built-in source projection is presentation-rename proven, while unknown portable Common Play control identity invariance is proven separately.'
          new='Projected Unarmed damage/grapple/shove execute from structural runtimeAttack/runtimeSaveCondition ActionVm payloads that survive action-ID and presentation rename; unknown portable Common Play control identity invariance is proven separately.'
          if old not in row['currentState']:
              raise SystemExit('Family J currentState identity anchor changed')
          row['currentState']=row['currentState'].replace(old,new,1)

          old_prod='unarmedStrikeRuntime.test.ts proves projected Unarmed damage/grapple/shove execution after presentation rename; source action IDs remain canonical'
          new_prod='unarmedStrikeRuntime.test.ts proves projected Unarmed damage/grapple/shove execute after action-ID and presentation rename through structural runtimeAttack/runtimeSaveCondition payload lookup'
          if old_prod not in row['productionEvidence']:
              raise SystemExit('Family J production identity evidence anchor changed')
          row['productionEvidence'][row['productionEvidence'].index(old_prod)]=new_prod

          old_identity='c9FamilyJPortableControlProduction.test.ts proves target-save/conditional-control semantics under fully renamed external module/content/mechanic identities; built-in unarmedStrikeRuntime evidence is presentation-only and is not used as identity-invariance proof'
          new_identity='unarmedStrikeRuntime.test.ts proves projected Unarmed damage/grapple/shove production execution is invariant to action-ID and presentation rename at the structural runtime bridge'
          if old_identity not in row['identityInvarianceEvidence']:
              raise SystemExit('Family J identity evidence anchor changed')
          row['identityInvarianceEvidence'][row['identityInvarianceEvidence'].index(old_identity)]=new_identity

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify ledger and legacy boundary
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Publish evidence convergence and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-j-id-evidence-converge-71304.yml
          git commit -m "docs(c9): converge Family J identity evidence"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
