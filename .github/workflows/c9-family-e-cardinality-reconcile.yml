name: C9 Family E Cardinality Reconcile

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-cardinality-reconcile.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified Family E cardinality patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if text.count(old)!=1:
                  raise SystemExit(f"{path}: expected one match, got {text.count(old)}")
              p.write_text(text.replace(old,new,1))

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_once(runtime, '''export interface CommonPlayTargetingSelector {\n  from:"targets";\n  min:1;\n  max:1;\n}''', '''export interface CommonPlayTargetingSelector {\n  from:"targets";\n  min:number;\n  max:number;\n}''')
          replace_once(runtime, '''function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {\n  const selector=object(value,label);\n  supportedKeys(selector,TARGETING_KEYS,label);\n  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  if(selector.min!==1||selector.max!==1) throw new DomainEvaluationError(`${label}.min and .max must both be 1 for portable Common Play targeting`);\n  return {from:"targets",min:1,max:1};\n}''', '''function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {\n  const selector=object(value,label);\n  supportedKeys(selector,TARGETING_KEYS,label);\n  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  if(!Number.isInteger(selector.min)||Number(selector.min)<0) throw new DomainEvaluationError(`${label}.min must be a non-negative integer for portable Common Play targeting`);\n  if(!Number.isInteger(selector.max)||Number(selector.max)<Number(selector.min)) throw new DomainEvaluationError(`${label}.max must be an integer >= .min for portable Common Play targeting`);\n  return {from:"targets",min:Number(selector.min),max:Number(selector.max)};\n}''')
          replace_once(runtime, '''    if(input.targetingTargets.length===1&&input.targetId!==undefined&&input.targetId!==input.targetingTargets[0].id) {\n      throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");\n    }\n    operations.push({\n      id:`${input.resolutionId}:targeting`,\n      kind:"targeting",\n      sourceId:input.actorId,\n      rule:{kind:"creature",minTargets:1,maxTargets:1,directTarget:false},\n      targets:input.targetingTargets.map((target)=>({...target})),\n    });''', '''    if(input.targetId!==undefined&&(input.targetingTargets.length!==1||input.targetId!==input.targetingTargets[0].id)) {\n      throw new DomainEvaluationError("Common Play downstream target requires exactly one matching validated targeting selection");\n    }\n    operations.push({\n      id:`${input.resolutionId}:targeting`,\n      kind:"targeting",\n      sourceId:input.actorId,\n      rule:{kind:"creature",minTargets:entryPoint.targeting.min,maxTargets:entryPoint.targeting.max,directTarget:false},\n      targets:input.targetingTargets.map((target)=>({...target})),\n    });''')

          test='tests/domain/commonPlayTargetingRuntime.test.ts'
          marker='''test("unsupported Common Play selector shapes reject explicitly",()=>{'''
          addition='''test("bounded Common Play selector preserves explicit multi-target cardinality through the existing targeting Resolver",()=>{\n  const definition=structuredClone(AUTHORED);\n  definition.entryPoints[0].targeting={from:"targets",min:1,max:2};\n  definition.entryPoints[0].operations=[];\n  const parsed=parseManualCommonPlayOperationDefinition(definition);\n  assert.deepEqual(parsed.entryPoints[0].targeting,{from:"targets",min:1,max:2});\n  const selected=[target("hero","self"),target("goblin","enemy")];\n  const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),parsed,{\n    resolutionId:"multi-targeting",actorId:"hero",entryPointId:"mend-other",targetingTargets:selected,\n  });\n  const targeting=pending.operations[0];\n  assert.equal(targeting.kind,"targeting");\n  if(targeting.kind!=="targeting") return;\n  assert.equal(targeting.rule.minTargets,1);\n  assert.equal(targeting.rule.maxTargets,2);\n  assert.deepEqual(targeting.targets,selected);\n  const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),parsed,{\n    resolutionId:"multi-targeting",actorId:"hero",entryPointId:"mend-other",targetingTargets:selected,\n  });\n  assert.equal(committed.status,"committed");\n  if(committed.status!=="committed") return;\n  assert.deepEqual((committed.results["multi-targeting:targeting"] as {targets:Array<{targetId:string}>}).targets.map((entry)=>entry.targetId),["hero","goblin"]);\n});\n\n'''
          p=Path(test); text=p.read_text()
          if 'bounded Common Play selector preserves explicit multi-target cardinality' not in text:
              if text.count(marker)!=1: raise SystemExit('targeting test marker mismatch')
              text=text.replace(marker,addition+marker,1)
          old='''    [{from:"targets",min:0,max:1},/min and .max must both be 1/],\n    [{from:"targets",min:1,max:2},/min and .max must both be 1/],'''
          new='''    [{from:"targets",min:-1,max:1},/min must be a non-negative integer/],\n    [{from:"targets",min:2,max:1},/max must be an integer >= .min/],'''
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('targeting invalid-selector expectations mismatch')
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify bounded targeting and Common Play regressions
        run: >-
          npx tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/domain/commonPlayHpRuntime.test.ts
          tests/domain/commonPlayD20Runtime.test.ts
          tests/domain/commonPlayResourceEconomyRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
          tests/ui/fighterActionSurgeRuntimeAdapter.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit on current branch safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/c9-family-e-cardinality-helper.yml
          rm -f .github/workflows/c9-family-e-cardinality-reconcile.yml
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayTargetingRuntime.test.ts .github/workflows
          git commit -m "feat(c9): support bounded Common Play target cardinality"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
