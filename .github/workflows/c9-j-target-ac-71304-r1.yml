name: C9 Family J Target AC 71304 R1

on:
  push:
    branches: [agent/c9-j-target-ac-71304-r1]
    paths: [.github/workflows/c9-j-target-ac-71304-r1.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staging patch
        run: python3 scripts/c9-j-target-ac-stage-71304.py
      - name: Verify Family J target AC slice
        run: |
          node --import tsx --test tests/domain/c9FamilyJTargetDcExpression71304.test.ts
          node --import tsx --test tests/ui/c9FamilyJTargetAcExpressionProduction71304.test.ts tests/ui/c9FamilyJRangeCoverProduction.test.ts tests/ui/c9FamilyJExtraAttackProduction71304.test.ts tests/ui/unarmedStrikeRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Commit verified slice and retire staging helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-j-target-ac-71304-r1.yml scripts/c9-j-target-ac-stage-71304.py
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts docs/rules/v1-mechanism-coverage-ledger.json tests/domain/c9FamilyJTargetDcExpression71304.test.ts tests/ui/c9FamilyJTargetAcExpressionProduction71304.test.ts
          git commit -m "feat(c9): resolve portable attack target AC"
          git push origin HEAD:agent/c9-j-target-ac-71304-r1
