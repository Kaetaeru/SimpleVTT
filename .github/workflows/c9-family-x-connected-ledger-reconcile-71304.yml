name: C9 Family X Connected Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-x-connected-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Family X connected evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const doc=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=doc.rows.find((entry)=>entry.family==='X');
          if (!row) throw new Error('Family X ledger row missing');
          const production='7ce2aff851dc4e0a81eecd706a8cf50dd8f6b11b ci(c9): verify connected portable item payment; C9 Family X Portable Item Payment 71304 run 33318235057 passed production + connected item payment, coverage checker, typecheck, and legacy-boundary verification';
          const connected='tests/ui/c9FamilyXConnectedPortableItemPaymentProduction.test.ts proves Host/Client authoritative item quantity replay, duplicate retry suppression, fresh reconnect, event-native Undo, and reconnect-after-Undo';
          if (!row.productionEvidence.includes(production)) row.productionEvidence.push(production);
          if (!row.connectedEvidenceIfRelevant.includes(connected)) row.connectedEvidenceIfRelevant.push(connected);
          row.remainingNamedSeams=row.remainingNamedSeams.filter((entry)=>entry!=='connected item lifecycle replay/reconnect/retry acceptance');
          row.currentState=row.currentState.replace('transfer, and connected lifecycle remain incomplete.','and transfer remain incomplete; connected quantity-payment replay/retry/reconnect/Undo is proven.');
          fs.writeFileSync(path,JSON.stringify(doc,null,2)+'\n');
          NODE
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit reconciled ledger and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-x-connected-ledger-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile connected item payment evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
