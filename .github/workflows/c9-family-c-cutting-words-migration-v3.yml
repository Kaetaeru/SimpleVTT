name: C9 Family C Cutting Words Migration V3

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-cutting-words-migration-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrected migration with feature fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/c9-family-c-cutting-words-migration-v2.yml').read_text()
          marker='      - name: Apply corrected declarative migration\n        shell: bash\n        run: |\n'
          body=workflow.split(marker,1)[1].split('\n      - name: Verify corrected production path',1)[0]
          Path('/tmp/apply_v2.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n')
          PY
          bash /tmp/apply_v2.sh
          python3 <<'PY'
          from pathlib import Path
          path=Path('src/app/commonPlayInterceptorProductionRuntimeAdapter.ts')
          text=path.read_text()
          item_helper='''function catalogEntryMatchesItem(entry:CatalogEntry,item:CharacterSheet["items"][number]) {\n  const token=item.definitionId.trim();\n  return entry.category==="item"&&Boolean(token)&&(\n    entry.id===token||entry.contentId===token||entry.nameKo===token||entry.nameEn===token\n  );\n}\n'''
          feature_helper='''function catalogEntryMatchesFeature(entry:CatalogEntry,featureId:string) {\n  const token=featureId.trim();\n  return (entry.category==="option"||entry.category==="feat")&&Boolean(token)&&(\n    entry.id===token||entry.contentId===token||entry.nameKo===token||entry.nameEn===token\n  );\n}\n'''
          if item_helper not in text: raise SystemExit('item identity helper changed')
          text=text.replace(item_helper,item_helper+'\n'+feature_helper,1)
          item_loop='''  for(const item of internal.activeCharacter.items) {\n    const matches=internal.catalog.filter((entry)=>catalogEntryMatchesItem(entry,item));\n    if(matches.length===1)identities.add(matches[0].id);\n  }\n  return identities;'''
          feature_loop='''  for(const item of internal.activeCharacter.items) {\n    const matches=internal.catalog.filter((entry)=>catalogEntryMatchesItem(entry,item));\n    if(matches.length===1)identities.add(matches[0].id);\n  }\n  for(const featureId of internal.activeCharacter.subclassFeatureIds ?? []) {\n    const matches=internal.catalog.filter((entry)=>catalogEntryMatchesFeature(entry,featureId));\n    if(matches.length===1)identities.add(matches[0].id);\n  }\n  return identities;'''
          if item_loop not in text: raise SystemExit('local identity fallback block changed')
          path.write_text(text.replace(item_loop,feature_loop,1))
          PY
      - name: Verify full Family C production slice
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:content
          npx tsx --test tests/domain/commonPlayReactionResourceDieRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts
          npx tsc --noEmit
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/modules/dnd-srd-5.2.1.subclasses/module.json src/app/characterSessionProjection.ts src/domain/commonPlaySpatialFactRuntime.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/offlineRuntimeAdapters.ts tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts
          git add -u src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts
          git diff --cached --check
          git commit -m "feat(common-play): migrate Cutting Words declaratively"
          git push
