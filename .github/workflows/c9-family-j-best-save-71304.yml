name: C9 Family J Best Save 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-best-save-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Patch portable best-of d20 property choice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text=path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              path.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          replace_once(runtime,'export interface CommonPlayD20TestDefinition {\n  kind:D20TestFamily;\n  roller:"actor"|"target";\n  property?:string;\n','type CommonPlayD20ModifierProperty=string|{choose:"highest";from:string[]};\ntype CommonPlayD20Ability="str"|"dex"|"con"|"int"|"wis"|"cha";\n\nexport interface CommonPlayD20TestDefinition {\n  kind:D20TestFamily;\n  roller:"actor"|"target";\n  property?:CommonPlayD20ModifierProperty;\n','d20 property type')
          replace_once(runtime,'    targetId?:string;\n    modifierContributions?:ModifierContribution[];\n','    targetId?:string;\n    ability?:CommonPlayD20Ability;\n    modifierContributions?:ModifierContribution[];\n','d20 execution ability')
          replace_once(runtime,'''function parseD20Test(value:unknown,label:string):CommonPlayD20TestDefinition {\n  const definition=object(value,label);\n  supportedKeys(definition,D20_TEST_KEYS,label);\n  if(definition.kind!=="ability-check"&&definition.kind!=="saving-throw"&&definition.kind!=="attack-roll") throw new DomainEvaluationError(`${label}.kind is unsupported`);\n  if(definition.roller!=="actor"&&definition.roller!=="target") throw new DomainEvaluationError(`${label}.roller must be actor or target for portable Common Play d20`);\n  const property=definition.property===undefined?undefined:nonEmptyString(definition.property,`${label}.property`);\n''','''function parseD20ModifierProperty(value:unknown,label:string):CommonPlayD20ModifierProperty|undefined {\n  if(value===undefined) return undefined;\n  if(typeof value==="string") return nonEmptyString(value,label);\n  const choice=object(value,label);\n  supportedKeys(choice,new Set(["choose","from"]),label);\n  if(choice.choose!=="highest") throw new DomainEvaluationError(`${label}.choose must be highest`);\n  if(!Array.isArray(choice.from)||choice.from.length<2) throw new DomainEvaluationError(`${label}.from requires at least two property candidates`);\n  const from=choice.from.map((candidate,index)=>nonEmptyString(candidate,`${label}.from[${index}]`));\n  if(new Set(from).size!==from.length) throw new DomainEvaluationError(`${label}.from must not contain duplicate property candidates`);\n  return {choose:"highest",from};\n}\n\nfunction parseD20Test(value:unknown,label:string):CommonPlayD20TestDefinition {\n  const definition=object(value,label);\n  supportedKeys(definition,D20_TEST_KEYS,label);\n  if(definition.kind!=="ability-check"&&definition.kind!=="saving-throw"&&definition.kind!=="attack-roll") throw new DomainEvaluationError(`${label}.kind is unsupported`);\n  if(definition.roller!=="actor"&&definition.roller!=="target") throw new DomainEvaluationError(`${label}.roller must be actor or target for portable Common Play d20`);\n  const property=parseD20ModifierProperty(definition.property,`${label}.property`);\n''','d20 property parser')
          replace_once(runtime,'''function commonPlayD20Ability(property:string|undefined):"str"|"dex"|"con"|"int"|"wis"|"cha"|undefined {\n  const match=property?.match(/^(?:save|ability)\\.(str|dex|con|int|wis|cha)\\.(?:modifier|score)$/);\n  return match?.[1] as "str"|"dex"|"con"|"int"|"wis"|"cha"|undefined;\n}\n''','''function commonPlayD20Ability(property:CommonPlayD20ModifierProperty|undefined):CommonPlayD20Ability|undefined {\n  if(typeof property!=="string") return undefined;\n  const match=property.match(/^(?:save|ability)\\.(str|dex|con|int|wis|cha)\\.(?:modifier|score)$/);\n  return match?.[1] as CommonPlayD20Ability|undefined;\n}\n''','d20 ability declaration')
          replace_once(runtime,'    const conditionAbility=commonPlayD20Ability(entryPoint.test.property);\n','    const conditionAbility=input.d20.ability??commonPlayD20Ability(entryPoint.test.property);\n','selected d20 condition ability')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          replace_once(adapter,'''function commonPlayTestModifierContributions(internal:AdapterState,state:RulesRuntimeState,rollerId:string,property:string|undefined) {\n  if(!property) return undefined;\n  const roller=internal.scene.entities.find((entity)=>entity.id===rollerId);\n  if(!roller) throw new Error(`Common Play d20 roller not found: ${rollerId}`);\n  const save=property.match(/^save\\.(str|dex|con|int|wis|cha)\\.modifier$/);\n  if(save) {\n    const fact=resolveRuntimeSaveModifier(roller,internal.activeCharacter,save[1],internal.combatantDefinitions);\n    return [{source:fact.source,value:fact.modifier}];\n  }\n  const value=commonPlayActorProfileProperties(internal,state,rollerId)?.[property];\n  if(!Number.isFinite(value)) throw new Error(`Common Play d20 property is unavailable: ${property}`);\n  return [{source:`profile:${rollerId}:${property}`,value:Number(value)}];\n}\n''','''type CommonPlayTestAbility="str"|"dex"|"con"|"int"|"wis"|"cha";\n\nfunction commonPlayTestModifierSelection(\n  internal:AdapterState,\n  state:RulesRuntimeState,\n  rollerId:string,\n  property:string|{choose:"highest";from:string[]}|undefined,\n) {\n  if(!property) return undefined;\n  const roller=internal.scene.entities.find((entity)=>entity.id===rollerId);\n  if(!roller) throw new Error(`Common Play d20 roller not found: ${rollerId}`);\n  const resolveProperty=(candidate:string)=>{\n    const abilityMatch=candidate.match(/^(?:save|ability)\\.(str|dex|con|int|wis|cha)\\.(?:modifier|score)$/);\n    const ability=abilityMatch?.[1] as CommonPlayTestAbility|undefined;\n    const save=candidate.match(/^save\\.(str|dex|con|int|wis|cha)\\.modifier$/);\n    if(save) {\n      const fact=resolveRuntimeSaveModifier(roller,internal.activeCharacter,save[1],internal.combatantDefinitions);\n      return {contribution:{source:fact.source,value:fact.modifier},ability};\n    }\n    const value=commonPlayActorProfileProperties(internal,state,rollerId)?.[candidate];\n    if(!Number.isFinite(value)) throw new Error(`Common Play d20 property is unavailable: ${candidate}`);\n    return {contribution:{source:`profile:${rollerId}:${candidate}`,value:Number(value)},ability};\n  };\n  const selected=typeof property==="string"?resolveProperty(property):property.from.map(resolveProperty).reduce((highest,candidate)=>candidate.contribution.value>highest.contribution.value?candidate:highest);\n  return {modifierContributions:[selected.contribution],...(selected.ability?{ability:selected.ability}:{})};\n}\n''','production d20 property choice')
          replace_once(adapter,'  const d20ModifierContributions=entryPoint.test?commonPlayTestModifierContributions(internal,state,d20RollerId,entryPoint.test.property):undefined;\n','  const d20ModifierSelection=entryPoint.test?commonPlayTestModifierSelection(internal,state,d20RollerId,entryPoint.test.property):undefined;\n','d20 modifier selection call')
          replace_once(adapter,'    ...(entryPoint.test?{d20:{faces:d20Faces!,targetId:selectedTargetId,...(d20ModifierContributions?{modifierContributions:d20ModifierContributions}:{})}}:{}),\n','    ...(entryPoint.test?{d20:{faces:d20Faces!,targetId:selectedTargetId,...(d20ModifierSelection??{})}}:{}),\n','d20 modifier selection input')

          schema=Path('schemas/common-play-contract.schema.json')
          replace_once(schema,'''        "property": {\n          "type": "string",\n          "minLength": 1\n        },''','''        "property": {\n          "oneOf": [\n            {\n              "type": "string",\n              "minLength": 1\n            },\n            {\n              "type": "object",\n              "required": [\n                "choose",\n                "from"\n              ],\n              "properties": {\n                "choose": {\n                  "const": "highest"\n                },\n                "from": {\n                  "type": "array",\n                  "minItems": 2,\n                  "uniqueItems": true,\n                  "items": {\n                    "type": "string",\n                    "minLength": 1\n                  }\n                }\n              },\n              "additionalProperties": false\n            }\n          ]\n        },''','schema d20 property choice')

          test=Path('tests/ui/c9FamilyJPortableControlProduction.test.ts')
          text=test.read_text(encoding='utf-8')
          if 'property:{choose:"highest",from:["save.str.modifier","save.dex.modifier"]}' not in text:
              old='property:"save.dex.modifier"'
              if old not in text: raise SystemExit('Family J property test anchor not found')
              text=text.replace(old,'property:{choose:"highest",from:["save.str.modifier","save.dex.modifier"]}',1)
          text=text.replace('grapple-dex-probe','grapple-best-save-probe')
          test.write_text(text,encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family J best-save choice
        run: |
          node --import tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified patch and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-best-save-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyJPortableControlProduction.test.ts
          git commit -m "feat(c9): choose best portable control save"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
