name: C9 Family L Instant Death Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-instant-death-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Fast-forward to current branch state
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Generate content
        run: npm run generate:content
      - name: Verify portable instant-death acceptance
        run: npx tsx --test tests/ui/c9FamilyLDamageDefenseProduction.test.ts
      - name: Verify structural boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Reconcile Family L ledger evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const row = ledger.rows.find((candidate) => candidate.family === 'L' && candidate.id === 'damage-life');
          if (!row) throw new Error('Family L damage-life ledger row not found');
          if (row.disposition !== 'INCOMPLETE') throw new Error(`Unexpected Family L disposition: ${row.disposition}`);
          const evidence = 'c59c47cad521bdd6dcfa6cffac09b353621cce17 test(c9): target active character for instant death; C9 Family L Damage Defense 71304 run 33315292373 passed unknown/renamed portable character instant-death overkill plus event-native Undo, V1 coverage checker, legacy execution boundary, and tsc --noEmit';
          const identity = 'c9FamilyLDamageDefenseProduction.test.ts repeats the portable character instant-death threshold and Undo behavior under unrelated external module/content/mechanic identities';
          if (!row.productionEvidence.includes(evidence)) row.productionEvidence.push(evidence);
          if (!row.identityInvarianceEvidence.includes(identity)) row.identityInvarianceEvidence.push(identity);
          row.currentState = row.currentState.replace('complete life/object semantics remain incomplete', 'portable character instant-death overkill is production-proven with identity rename and Undo; remaining life/object semantics are incomplete');
          const oldSeam = 'complete 0 HP, unconscious/death, death-save, stabilization, instant-death production acceptance remains incomplete';
          const newSeam = 'complete 0 HP/unconscious, damage-at-zero/death-save/stabilization production acceptance remains incomplete';
          const index = row.remainingNamedSeams.indexOf(oldSeam);
          if (index < 0) throw new Error('Expected Family L life acceptance seam not found');
          row.remainingNamedSeams[index] = newSeam;
          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE
      - name: Verify reconciled ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified reconciliation and retire temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-l-instant-death-reconcile-71304.yml
          git commit -m "docs(c9): record instant death production evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          node scripts/check-v1-mechanism-coverage.mjs
          git push origin HEAD:"$GITHUB_REF_NAME"
