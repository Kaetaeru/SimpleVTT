name: C9 Family P Semantic Dispatch 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-semantic-dispatch-71304.yml

permissions:
  contents: write

jobs:
  semantic-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm ci
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family P lifecycle semantic dispatch
        run: node --import tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts
      - name: Verify V1 coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npm exec tsc -- --noEmit
      - name: Retire landed Family P verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-p-semantic-dispatch-71304.yml .github/scripts/c9-family-p-semantic-dispatch.py
          git commit -m "ci(c9): retire lifecycle semantic dispatcher verifier"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content >/dev/null
              node --import tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            echo "publish raced with another C9 writer; retry $attempt/5"
          done
          exit 1
