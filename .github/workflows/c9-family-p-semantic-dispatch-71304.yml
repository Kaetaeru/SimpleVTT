name: C9 Family P Semantic Dispatch 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-semantic-dispatch-71304.yml

permissions:
  contents: write

jobs:
  semantic-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Patch lifecycle semantic trigger dispatch
        run: python .github/scripts/c9-family-p-semantic-dispatch.py
      - name: Align recharge test with authoritative turn start
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("tests/domain/commonPlaySemanticEventRuntime.test.ts")
          text=path.read_text(encoding="utf-8")
          old='assert.equal(activated.status,"committed"); if(activated.status!=="committed") return; state=activated.state;\n  const request:PendingResolution={'
          new='assert.equal(activated.status,"committed"); if(activated.status!=="committed") return; state=activated.state;\n  state={...state,clock:{...state.clock,phase:"start",activeActorId:"hero"}};\n  const request:PendingResolution={'
          if text.count(old)!=1:
              raise SystemExit("recharge test clock anchor changed")
          path.write_text(text.replace(old,new,1),encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family P semantic dispatch
        run: npx tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts
      - name: Verify V1 coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified Family P slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-p-semantic-dispatch-71304.yml .github/scripts/c9-family-p-semantic-dispatch.py
          git add src/domain/commonPlayEffectRuntime.ts src/domain/commonPlaySemanticEventRuntime.ts tests/domain/commonPlaySemanticEventRuntime.test.ts
          git commit -m "feat(c9): dispatch lifecycle semantic triggers"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
