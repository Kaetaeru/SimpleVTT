name: C9 Family A Ledger Sync 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-a-ledger-sync-7130.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record verified arbitrary profile-property coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const family = ledger.families.find((entry) => entry.family === 'A');
          if (!family) throw new Error('Family A not found');
          const stale = 'Reusable valuePolicy/property-modifier evaluation is not yet proven for arbitrary profile properties beyond the canonical AC fixture.';
          family.missing = family.missing.filter((entry) => entry !== stale);
          if (!family.implementationEvidence.includes('.github/workflows/c9-family-a-profile-property-7130.yml')) family.implementationEvidence.push('.github/workflows/c9-family-a-profile-property-7130.yml');
          family.notes = `${family.notes} Generic profile-property production coverage now includes movement.walk, defense.ac, and ability.str.score -> ability.str.modifier through unknown installed Common Play, verified by tests/ui/installedCommonPlayPropertyModifierProduction.test.ts and C9 Family A Profile Property 7130.`;
          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE
      - name: Commit ledger evidence
        run: |
          if git diff --quiet -- docs/rules/v1-mechanism-coverage-ledger.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): record generic Family A property evidence"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
