name: C9 Family H Sense Profile 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-h-sense-profile-71304.yml]

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - run: npm run generate:content
      - name: Add regression proof on latest branch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"sense.darkvision.range-feet"' rules/profiles/dnd.srd-5.2.1.profile.json
          grep -q 'RULES_PROFILE_SENSE_PROPERTIES' src/app/commonPlayInterceptorProductionRuntimeAdapter.ts
          python3 - <<'PY'
          from pathlib import Path

          path=Path('tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts')
          text=path.read_text(encoding='utf-8')
          import_anchor='import { resolvePendingResolution } from "../../src/domain/resolution";\n'
          import_line='import { compileCommonPlayEntryPointOperations, parseCommonPlayOperationDefinition } from "../../src/domain/commonPlayOperationRuntime";\n'
          if import_line not in text:
              if import_anchor not in text: raise SystemExit('test import anchor not found')
              text=text.replace(import_anchor,import_anchor+import_line,1)

          name='portable production derives Darkvision from a generic RulesProfile modifier'
          if name not in text:
              text += '''\n\nfunction seedRulesProfileSense(adapter:MockAdapter,sourceId:string,rangeFeet:number){\n  const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n  const state=snapshotAdapterTurnRuntimeState(adapter,internal.scene);\n  assert.ok(state,"TurnRuntime state must exist before sense profile seeding");\n  const definition=parseCommonPlayOperationDefinition({\n    schemaVersion:"0.2-draft",id:sourceId,entryPoints:[{id:"activate",invocation:"manual",operations:[{\n      kind:"property.modify",property:"sense.darkvision.range-feet",operation:"set",value:{value:rangeFeet},target:"actor",owner:"effect",source:"definition",\n      duration:{kind:"elapsed",amount:{value:1},unit:"hours"},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:"unique-by-source",\n    }]}],\n  });\n  const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state!,definition,{\n    resolutionId:`sense-profile.${sourceId}`,actorId:internal.activeCharacter.id,entryPointId:"activate",\n  });\n  const committed=resolvePendingResolution(SIMPLEVTT_APP_RULES_PROFILE,state!,pending);\n  assert.notEqual(committed.status,"rejected");\n  if(committed.status==="rejected")return;\n  assert.equal(commitAdapterTurnRuntimeState(adapter,internal.scene,state!.revision,committed.state),true);\n}\n\ntest("portable production derives Darkvision from a generic RulesProfile modifier",async()=>{\n  const renamed:Identity={...ORIGINAL,moduleId:"external.profile-sense-renamed",contentId:"item.profile-sense-renamed",mechanicId:"mechanic.profile-sense-renamed",interceptorId:"interceptor.profile-sense-renamed",interactionId:"interaction.profile-sense-renamed",displayName:"Renamed Profile Sense"};\n  for(const identity of [ORIGINAL,renamed]){\n    const adapter=await prepare(identity,true,"d20",[{kind:"roll.modify",mode:"subtract-die",dice:"1d8"}],undefined,{light:"darkness",obscurement:"none"});\n    const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n    setSpatialRelation(internal.scene,{\n      sourceId:internal.activeCharacter.id,targetId:OTHER_CHARACTER_ID,distanceFeet:30,visible:true,cover:"none",targetCanSeeAttacker:true,\n      light:"darkness",obscurement:"none",provenance:"module:test-rules-profile-sense",\n    });\n    seedRulesProfileSense(adapter,`${identity.moduleId}.darkvision`,60);\n    seedHiddenRuntimeEffect(adapter,OTHER_CHARACTER_ID);\n    let snapshot=await openAbilityCheckInterrupt(adapter);\n    assert.equal(snapshot.resolution?.stage,"interrupt",JSON.stringify(snapshot.resolution));\n    snapshot=await adapter.respondToInterrupt(false);\n    assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));\n  }\n});\n'''
          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify Family H sense-profile regression
        run: |
          node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/domain/commonPlayPropertyContractRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish regression proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          base_sha="$(git rev-parse HEAD:"$path")"
          remote_sha="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha)"
          [[ "$remote_sha" == "$base_sha" ]] || { echo "concurrent change: $path" >&2; exit 1; }
          content="$(base64 -w0 < "$path")"
          jq -n --arg message "test(c9): prove rules-derived sense profile production" --arg content "$content" --arg sha "$remote_sha" --arg branch "$branch" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input - >/dev/null
      - name: Retire verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-family-h-sense-profile-71304.yml
          sha="$(gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha)"
          jq -n --arg message "ci(c9): retire Family H sense-profile verifier" --arg sha "$sha" --arg branch "$branch" \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" --input - >/dev/null
