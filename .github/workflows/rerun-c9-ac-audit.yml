name: C9 Family AC Authority Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ac-audit.yml

permissions:
  contents: write

jobs:
  audit-and-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0

      - name: Audit AC contracts and checkpoint ledger/state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ledger_path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          state_path=Path('.chatgpt-rerun/STATE.md')
          schema_path=Path('schemas/common-play-contract.schema.json')
          special_path=Path('src/domain/commonPlaySpecialTimingRuntime.ts')
          turn_path=Path('src/app/realTurnRuntimeService.ts')

          ledger=json.loads(ledger_path.read_text())
          schema=json.loads(schema_path.read_text())
          special=special_path.read_text()
          turn=turn_path.read_text()

          assert len(ledger['rows']) == 36, len(ledger['rows'])
          assert ledger.get('gateNBlockingNamedFallbacks', []) == []
          row=next(item for item in ledger['rows'] if item['family']=='AC')
          assert row['disposition']=='INCOMPLETE', row['disposition']

          # Existing kernel defines these tokens, but the persisted Common Play schema and
          # live TurnRuntime do not yet own an executable special-action timing contract.
          for token in ['after-turn','initiative-count','ownerActorId','poolResourceId']:
            assert token in special, token
          schema_text=json.dumps(schema, sort_keys=True)
          assert 'initiative-count' not in schema_text
          assert 'after-turn' not in schema_text
          assert 'initiativeCount' not in turn
          assert 'after-turn' not in turn

          row['currentState']=(
            'Generic kernel compiles owner-authorized turn-start/end, after-turn, and initiative-count '
            'special-action requests with option selection and atomic pool cost, but the persisted Common Play '
            'contract does not carry that special-action definition and the live TurnRuntime emits only ordinary '
            'begin/end-turn lifecycle. Pool refresh, initiative-count/after-turn dispatch, simultaneous ordering, '
            'connected owner interaction, replay/reconnect, and persistence authority remain undefined.'
          )
          row['implementationEvidence']=[
            'commonPlaySpecialTimingRuntime.ts owner/timing/option/cost compiler',
            'commonPlayC6Runtime.test.ts owner-authorized after-turn cost/payload kernel proof',
          ]
          row['productionEvidence']=[]
          row['identityInvarianceEvidence']=[]
          row['connectedEvidenceIfRelevant']=[]
          row['persistenceEvidenceIfRelevant']=[]
          row['remainingNamedSeams']=[
            'portable persisted special-action/timing definition is not present in the Common Play contract',
            'live session after-turn/initiative-count dispatcher and connected owner interaction are undefined',
            'pool refresh and simultaneous special-action ordering authority are undefined',
          ]

          counts={}
          for item in ledger['rows']:
            counts[item['disposition']]=counts.get(item['disposition'],0)+1
          assert counts == {'INCOMPLETE':32,'IMPLEMENTED':4}, counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')

          state=state_path.read_text()
          marker='## Next Exact Action\n'
          assert marker in state
          state=state.split(marker,1)[0].rstrip()+'''\n\n## Family AC audit — authority contract gap\n\nFamily AC (`legendary-lair-special-timing`) remains `INCOMPLETE` after repository-authority audit. This is a missing portable/production authority contract, not a safe adapter-wiring task.\n\n- `commonPlaySpecialTimingRuntime.ts` already compiles owner-authorized `turn-start|turn-end|after-turn|initiative-count` requests, option selection, and atomic pool-resource cost into `PendingResolution`.\n- `commonPlayC6Runtime.test.ts` proves the kernel after-turn owner/cost path only.\n- `schemas/common-play-contract.schema.json` does not persist an AC special-action/timing definition, so an unknown external RuleModule cannot currently carry the kernel contract through import/rehydration.\n- `realTurnRuntimeService.ts` retains ordered actor IDs and emits ordinary end-turn/begin-turn transitions; it does not define authoritative `after-turn`/`initiative-count` special-action events.\n- No repository contract currently owns legendary/lair pool refresh, simultaneous special-action ordering, connected owner decision/reconnect, or persistence semantics. Adding those policies inside an adapter would violate the architecture charter.\n- No production source was changed for AC. Coverage remains `IMPLEMENTED=4`, `INCOMPLETE=32`, `PROVEN_UNNEEDED=0`; `gateNBlockingNamedFallbacks` remains empty.\n\n## Next Exact Action\n\nDo not reopen Families S/T/U/AB, audited authority-blocked V/W/X/Y/Z/AA, Family P, or Family AC without a repository-defined authority contract. Audit the next non-blocked row, Family AD (`mount-vehicle-controller`): reconcile `commonPlayMountRuntime` plus existing object/controller/session topology against the ledger-required mount/dismount cost, controlled versus independent initiative/actions, fall-off/Prone, capacity, drawn vehicle, crew/speed, vehicle HP/AC/threshold, repair, connected replay/reconnect, and identity evidence. Implement only semantics whose authority/ownership already exists; otherwise preserve AD as `INCOMPLETE` with the exact missing contract and continue to the next non-blocked family.\n'''
          state_path.write_text(state)
          PY

      - name: Validate audit invariants
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'));
          const row=ledger.rows.find(r=>r.family==='AC');
          if(!row||row.disposition!=='INCOMPLETE') throw new Error('Family AC must remain INCOMPLETE');
          const counts=ledger.rows.reduce((m,r)=>(m[r.disposition]=(m[r.disposition]??0)+1,m),{});
          if(counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32) throw new Error(JSON.stringify(counts));
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('Gate N named fallback blockers must remain empty');
          if(row.productionEvidence.length||row.connectedEvidenceIfRelevant.length||row.persistenceEvidenceIfRelevant.length) throw new Error('AC audit must not fabricate production evidence');
          console.log(JSON.stringify({family:row.family,disposition:row.disposition,counts,gateNBlockingNamedFallbacks:ledger.gateNBlockingNamedFallbacks}));
          NODE

      - name: Commit ledger and STATE first
        run: |
          rm .github/workflows/rerun-c9-ac-audit.yml
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md .github/workflows/rerun-c9-ac-audit.yml
          git commit -m "docs(c9): record Family AC authority gap"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation

      - name: Publish control last
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.chatgpt-rerun/control.json')
          data=json.loads(p.read_text())
          assert data['run_id']=='b7f27a61-29d8-4ba2-9f93-8e66722d5f41'
          assert data['sequence']==7
          assert data['task_id']=='v1-common-play-c8-rerun'
          data['status']='continue'
          data['reason']=(
            'C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0. Family AC special timing was audited and remains INCOMPLETE because the kernel owner/timing/option/cost compiler has no persisted Common Play special-action definition and live TurnRuntime does not define after-turn/initiative-count dispatch, pool refresh, simultaneous ordering, or connected owner interaction/reconnect authority. No AC production policy was invented. Next audit Family AD mount/vehicle/controller and implement only already-owned semantics.'
          )
          data['updated_at']='2026-08-30'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git add .chatgpt-rerun/control.json
          git commit -m "docs(rerun): continue after Family AC audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
