name: C9 Family AC Authority Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ac-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile AC authority and persistence boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const rows=ledger.rows;
          const counts=rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0) throw new Error(`unexpected coverage ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('gateNBlockingNamedFallbacks is not empty');
          const ab=rows.find(r=>r.family==='AB');
          if(ab?.disposition!=='IMPLEMENTED') throw new Error('Family AB must be IMPLEMENTED before AC audit');
          const ac=rows.find(r=>r.family==='AC'&&r.id==='legendary-lair-special-timing');
          if(!ac) throw new Error('Family AC row missing');
          if(ac.disposition!=='INCOMPLETE') throw new Error(`unexpected AC disposition ${ac.disposition}`);
          const schema=fs.readFileSync('schemas/common-play-contract.schema.json','utf8');
          if(schema.includes('initiative-count')) throw new Error('Common Play schema now defines initiative-count; re-audit AC instead of applying this checkpoint');
          const effects=fs.readFileSync('src/domain/effects.ts','utf8');
          if(/interface RuntimeClock[\s\S]*initiativeCount/.test(effects)) throw new Error('RuntimeClock now has initiativeCount; re-audit AC instead of applying this checkpoint');
          const special=fs.readFileSync('src/domain/commonPlaySpecialTimingRuntime.ts','utf8');
          if(!special.includes('kind:"initiative-count"')||!special.includes('only the special action owner can invoke it')) throw new Error('special timing kernel shape changed');
          ac.currentState='Kernel compilation validates owner-authorized turn/after-turn/initiative-count timing, option selection, cost, and generic Resolver payloads, but the persisted Common Play contract has no special-timing/initiative-count authoring vocabulary and authoritative RuntimeClock has no initiative-count datum. No production session dispatcher can therefore schedule portable legendary/lair timing without inventing authority/order policy.';
          ac.remainingNamedSeams=[
            'persisted portable special-action timing/option contract',
            'authoritative initiative-count event source and refresh/order semantics',
            'session timing dispatcher plus connected off-turn interaction/replay/reconnect'
          ];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const statePath='.chatgpt-rerun/STATE.md';
          let state=fs.readFileSync(statePath,'utf8');
          state=state.replace(
            '- Family AB Recharge production recovery is implemented and connected, but its new acceptance probe exposed a real remaining gap: the actor action does not yet consume its recovered resource (expected 1 -> 0, observed 1). Do not promote AB until availability/consumption is fixed and re-proven.',
            '- Family AB final availability/consumption acceptance is now closed by `0537062111c91c4af898802b27ab4a5d1e3cac17`: the recharged actor Action spends both its Action and recovered charge atomically, gates availability at zero, converges on Client, is duplicate-idempotent, reconstructs on reconnect, and restores through event-native Undo. UI run `33280926167`, job `99175842905`, step 17 SUCCESS; the later broad Phase09 step remains inherited red.'
          );
          const marker='## Next Exact Action';
          const idx=state.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          const before=state.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family AC audit — authority contract missing\n\nFamily AC (`legendary-lair-special-timing`) remains `INCOMPLETE`. `commonPlaySpecialTimingRuntime.ts` already compiles owner-authorized turn/after-turn/initiative-count events, option cost, and payload into the generic Resolver, but this is kernel-only. The persisted Common Play schema does not define special-action timing/initiative-count authoring, and authoritative `RuntimeClock` contains round/elapsed/active-actor/phase but no initiative-count datum. Production therefore has no repository-defined event source, refresh/order policy, or connected off-turn interaction owner for portable legendary/lair timing. Adding a dispatcher now would invent semantics forbidden by the charter.\n\n';
          const next='## Next Exact Action\n\nDo not reopen Families S/T/U/AB or the audited authority-blocked P/V/W/X/Y/Z/AA/AC seams. Move to Family AD (`mount-vehicle-controller`): audit whether the existing mount validator plus actor/object/link artifacts, controller transfer, movement, initiative, damage threshold, and repair production paths already define a bounded authoritative session composition. If controlled/independent initiative, mount/dismount cost, fall-off, capacity, crew, or persistence ownership is not defined by existing contracts, keep AD `INCOMPLETE` and record the exact authority gap rather than inventing mount/vehicle policy; otherwise add only the smallest production composition proof.\n';
          fs.writeFileSync(statePath,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs || true
          git diff --check
      - name: Commit AC audit and STATE
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): audit special timing authority gap"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family AB final availability/consumption is proven by 05370621 and UI run 33280926167 step 17. Family AC remains INCOMPLETE because the kernel special-timing compiler has no persisted Common Play special-timing/initiative-count vocabulary and RuntimeClock has no authoritative initiative-count event datum; inventing dispatcher/order/refresh policy is forbidden. Next audit Family AD mount/vehicle composition against existing actor/object/link/controller/movement authority.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          rm .github/workflows/rerun-c9-ac-audit.yml
          git add .chatgpt-rerun/control.json .github/workflows/rerun-c9-ac-audit.yml
          git commit -m "docs(rerun): continue after special timing audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
