name: C9 Family X Portable Item Payment 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - tests/ui/c9FamilyXPortableItemPaymentProduction.test.ts
      - .github/workflows/c9-family-x-item-payment-71304.yml
      - src/app/installedCommonPlayRuntimeAdapter.ts
      - src/app/realEventApplyService.ts
      - src/app/resolutionCharacterDurableProjection.ts
      - src/domain/commonPlayOperationRuntime.ts

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - run: node --import tsx --test tests/ui/c9FamilyXPortableItemPaymentProduction.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npm exec tsc -- --noEmit
      - run: node scripts/check-legacy-execution-boundary.mjs
