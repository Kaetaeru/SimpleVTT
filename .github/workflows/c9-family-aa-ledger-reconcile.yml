name: C9 Family AA Ledger Reconcile

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-aa-ledger-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile Family AA evidence
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger = json.loads(path.read_text())
          entry = next(item for item in ledger["families"] if item.get("family") == "AA")
          entry["currentState"] = "Unknown installed RuleModule progression contributions now flow through production level-up by stable track/threshold/grant IDs, project renamed grant presentation without name dispatch, and persist canonical grant identities across Character-library restart; typed external progression grant effects beyond opaque feature identity remain incomplete."
          entry["implementationEvidence"] = [
            "commonPlayProgressionContribution.ts",
            "ruleModulePackageImport.ts",
            "contentCatalogIdentity.ts preserves installed progressionContributions",
            "progressionRuntimeAdapter.ts invokes resolveCommonPlayProgressionContributions",
            "commonPlayC6Runtime.test.ts",
          ]
          entry["productionEvidence"] = [
            "progressionRuntimeAdapter.ts production commitLevelUp contribution projection",
            "installedProgressionContributionRuntime.test.ts",
            "C9 Family AA Progression Apply V3 run 33309178100 job 99251003222: 18/18 targeted tests plus tsc",
          ]
          entry["identityInvarianceEvidence"] = [
            "installedProgressionContributionRuntime.test.ts uses stable external source/grant IDs with renamed presentation labels",
            "commonPlayRepresentativeGaps.test.ts progression contribution stable-ID kernel coverage",
          ]
          entry["persistenceEvidenceIfRelevant"] = [
            "InstalledCatalogEntryV1.progressionContributions",
            "persistenceContracts.ts CharacterProgressionSelectionsV1.installedProgressionGrantIds",
            "characterLibraryPersistence.ts progression source projection/materialization",
            "installedProgressionContributionRuntime.test.ts restart hydration assertion",
            "C9 Family AA Progression Persistence Apply run 33309441822 job 99251703617",
            "4832ec46f1e3a1aefa5fe6c37fb8827cad50007d",
          ]
          entry["remainingNamedSeams"] = [
            "progressionContributions grants remain opaque feature identities rather than typed generic progression effects for choices/counts/replacement/upgrade/resources/spells/mastery/persistent options",
            "named Phase08 built-in progression branches remain migration debt where equivalent portable typed effects are not yet expressible",
            "characterCreationV10Adapter grants remain separate from the installed progression contribution effect model",
          ]
          entry["disposition"] = "INCOMPLETE"
          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Verify coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-aa-ledger-reconcile.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile progression coverage evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
