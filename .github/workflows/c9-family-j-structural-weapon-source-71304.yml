name: C9 Family J Structural Weapon Source 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-structural-weapon-source-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-j-structural-weapon-source-71304
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile latest branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - name: Remove presentation-name weapon dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/productionPlayRuntimeAdapter.ts")
          text = path.read_text(encoding="utf-8")
          old = '''function attackRange(name:string) {
            return /bow|crossbow|활|석궁|sling|슬링/i.test(name)?80:5;
          }

          type WeaponDefinition={mode?:"melee"|"ranged";properties?:string[]};
          type ArmorDefinition={training?:"light"|"medium"|"heavy"};

          function weaponRuntimeFact(character:CharacterSheet,attack:CharacterSheet["attacks"][number]) {
            const item=character.items.find((candidate)=>candidate.name===attack.name||candidate.nameEn===attack.name);
            const entry=item&&itemEntryById(item.definitionId);
            const definition=entry?.category==="weapon"?itemMechanic(entry,"weapon-definition") as WeaponDefinition|undefined:undefined;
            if(!definition)return {rangeFeet:attackRange(attack.name)};
            const rangeFeet=(definition.properties??[]).map((property)=>property.match(/^(?:ammunition|thrown):(\\d+)(?:\\/\\d+)?$/i)?.[1]).find(Boolean);
            const strength=mod(character.abilities.str);const dexterity=mod(character.abilities.dex);
            const ability:AbilityKey|undefined=definition.mode==="ranged"?"dex":!definition.properties?.includes("finesse")?"str":strength===dexterity?undefined:strength>dexterity?"str":"dex";
            return {rangeFeet:rangeFeet?Number(rangeFeet):5,...(ability?{ability}:{})};
          }
          '''
          new = '''type WeaponDefinition={mode?:"melee"|"ranged";properties?:string[]};
          type ArmorDefinition={training?:"light"|"medium"|"heavy"};

          function weaponRuntimeFact(character:CharacterSheet,attack:CharacterSheet["attacks"][number]) {
            const item=character.items.find((candidate)=>candidate.grantedActionIds.includes(attack.id));
            const entry=item&&itemEntryById(item.definitionId);
            const definition=entry?.category==="weapon"?itemMechanic(entry,"weapon-definition") as WeaponDefinition|undefined:undefined;
            if(!definition)return {rangeFeet:5};
            const rangeFeet=(definition.properties??[]).map((property)=>property.match(/^(?:ammunition|thrown):(\\d+)(?:\\/\\d+)?$/i)?.[1]).find(Boolean);
            const strength=mod(character.abilities.str);const dexterity=mod(character.abilities.dex);
            const ability:AbilityKey|undefined=definition.mode==="ranged"?"dex":!definition.properties?.includes("finesse")?"str":strength===dexterity?undefined:strength>dexterity?"str":"dex";
            return {rangeFeet:rangeFeet?Number(rangeFeet):5,...(ability?{ability}:{})};
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one weapon projection block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("src/app/mockAdapter.ts")
          text = path.read_text(encoding="utf-8")
          longsword = '  { id:"item.longsword.aelar", definitionId:"dnd.srd521.item.weapon.longsword", name:"롱소드", nameEn:"Longsword", kind:"equipment", quantity:1, equipped:true, wielded:true, wieldSlot:"main-hand", passiveEffects:["1d8 참격"], grantedActionIds:["action.longsword"], provenance:["SRD 5.2.1 · 장비","명시적 Main Hand"] },\n'
          shortbow = '  { id:"item.shortbow.aelar", definitionId:"dnd.srd521.item.weapon.shortbow", name:"숏보우", nameEn:"Shortbow", kind:"equipment", quantity:1, equipped:true, passiveEffects:["1d6 관통"], grantedActionIds:["action.shortbow"], provenance:["SRD 5.2.1 · 장비","공격 action과 구조적으로 연결"] },\n'
          if text.count(longsword) != 1:
              raise SystemExit(f"expected one Aelar longsword item, found {text.count(longsword)}")
          if shortbow in text:
              raise SystemExit("Aelar shortbow item already exists; inspect current source before retrying")
          path.write_text(text.replace(longsword, longsword + shortbow), encoding="utf-8")
          PY
      - name: Add structural source regression
        shell: bash
        run: |
          cat > tests/ui/c9FamilyJStructuralWeaponSource.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/productionPlayRuntimeAdapter";
          import type { CharacterSheet } from "../../src/app/contracts";
          import { MockAdapter } from "../../src/app/mockAdapter";

          type Internal={activeCharacter:CharacterSheet};
          const source=(adapter:MockAdapter)=>(adapter as unknown as Internal).activeCharacter;

          test("production weapon projection follows grantedActionIds instead of presentation names",async()=>{
            const adapter=new MockAdapter();
            const character=source(adapter);
            const attack=character.attacks.find((candidate)=>candidate.id==="action.shortbow");
            const item=character.items.find((candidate)=>candidate.id==="item.shortbow.aelar");
            assert.ok(attack);
            assert.ok(item);
            attack.name="Completely Renamed Attack";
            item.name="Unrelated Source Item";
            item.nameEn="Different Presentation";

            const snapshot=await adapter.startProductionLocalPlay();
            const projected=snapshot.scene.actionsByActor[character.id]?.find((candidate)=>candidate.id===attack.id);
            assert.ok(projected);
            assert.equal(projected.runtimeAttack?.rangeFeet,80);
            assert.equal(projected.runtimeAttack?.ability,"dex");
          });

          test("production weapon projection does not infer range from presentation text without a structural source link",async()=>{
            const adapter=new MockAdapter();
            const character=source(adapter);
            const attack=character.attacks.find((candidate)=>candidate.id==="action.shortbow");
            const item=character.items.find((candidate)=>candidate.id==="item.shortbow.aelar");
            assert.ok(attack);
            assert.ok(item);
            attack.name="Longbow";
            item.grantedActionIds=[];

            const snapshot=await adapter.startProductionLocalPlay();
            const projected=snapshot.scene.actionsByActor[character.id]?.find((candidate)=>candidate.id===attack.id);
            assert.ok(projected);
            assert.equal(projected.runtimeAttack?.rangeFeet,5);
            assert.equal(projected.runtimeAttack?.ability,undefined);
          });
          EOF
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family J structural weapon source
        run: npx tsx --test tests/ui/c9FamilyJStructuralWeaponSource.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Publish verified change
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-structural-weapon-source-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add src/app/productionPlayRuntimeAdapter.ts src/app/mockAdapter.ts tests/ui/c9FamilyJStructuralWeaponSource.test.ts
          git commit -m "refactor(c9): use structural weapon action sources"
          git push origin HEAD:"$branch"
