name: C9 Family J Attack Rider 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-attack-rider-71304.yml]

permissions:
  contents: write

concurrency:
  group: c9-family-j-attack-rider-71304
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Connect portable attack damage property rider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/domain/commonPlayOperationRuntime.ts')
          text=path.read_text(encoding='utf-8')
          old_import='import { effectIsActive } from "./effects";'
          new_import='import { effectIsActive, resolveEffectModifiedProperty } from "./effects";'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('effects import anchor missing')
              text=text.replace(old_import,new_import,1)

          loop_anchor='  for(const [index,operation] of entryPoint.operations.entries()) {'
          prefix='''  const firstAttackHitDamageIndex=entryPoint.test?.kind==="attack-roll"\n    ? entryPoint.operations.findIndex((candidate)=>candidate.kind==="damage.apply"&&(candidate.when===undefined||candidate.when.right.value==="success"))\n    : -1;\n  const attackDamageFlat=firstAttackHitDamageIndex>=0\n    ? resolveEffectModifiedProperty(state.effects,input.actorId,"attack.damage.flat",{"attack.damage.flat":0}).value\n    : 0;\n'''
          if prefix not in text:
              if loop_anchor not in text:
                  raise SystemExit('operation loop anchor missing')
              text=text.replace(loop_anchor,prefix+loop_anchor,1)

          old='''      const multiplier=operation.multiplier;\n      const rounding=multiplier===undefined?undefined:profile.roundingPolicy?.default;\n      if(multiplier!==undefined&&!rounding) throw new DomainEvaluationError("damage.apply multiplier requires a RulesProfile rounding policy");\n      let amount:number|{operationId:string;field:"total";multiplier?:number;rounding?:"floor"|"ceil"|"round"};'''
          new='''      const multiplier=operation.multiplier;\n      const rounding=multiplier===undefined?undefined:profile.roundingPolicy?.default;\n      if(multiplier!==undefined&&!rounding) throw new DomainEvaluationError("damage.apply multiplier requires a RulesProfile rounding policy");\n      const propertyDamageFlat=index===firstAttackHitDamageIndex?attackDamageFlat:0;\n      let amount:number|{operationId:string;field:"total";multiplier?:number;rounding?:"floor"|"ceil"|"round"};'''
          if new not in text:
              if old not in text:
                  raise SystemExit('damage lowering anchor missing')
              text=text.replace(old,new,1)

          old_flat='''            ...(formula.flat===0?{}:{flat:[{\n              source:`common-play:${supported.id}:${entryPoint.id}:operation:${index}:flat`,\n              value:formula.flat,\n            }]}),'''
          new_flat='''            ...(formula.flat===0&&propertyDamageFlat===0?{}:{flat:[\n              ...(formula.flat===0?[]:[{source:`common-play:${supported.id}:${entryPoint.id}:operation:${index}:flat`,value:formula.flat}]),\n              ...(propertyDamageFlat===0?[]:[{source:"property:attack.damage.flat",value:propertyDamageFlat}]),\n            ]}),'''
          if new_flat not in text:
              if old_flat not in text:
                  raise SystemExit('damage-roll flat anchor missing')
              text=text.replace(old_flat,new_flat,1)

          old_literal='const literal=literalInteger(operation.amount,"damage.apply amount");'
          new_literal='const literal=literalInteger(operation.amount,"damage.apply amount")+propertyDamageFlat;'
          if new_literal not in text:
              if old_literal not in text:
                  raise SystemExit('literal damage anchor missing')
              text=text.replace(old_literal,new_literal,1)
          path.write_text(text,encoding='utf-8')
          PY

          cat > tests/ui/c9FamilyJAttackDamageRiderProduction71304.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";

          const ACTOR_ID="char.aelar";
          const TARGET_ID="combatant.goblin-a";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.option`;
            const mechanicId=`${prefix}.mechanic`;
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Portable attack damage rider probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],content:[{
                id:contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:"Portable attack rider",locales:{en:{name:"Portable attack rider"}}},
                mechanics:[{kind:"common-play",config:{
                  schemaVersion:"0.2-draft",id:mechanicId,
                  entryPoints:[
                    {id:"empower",invocation:"manual",operations:[{
                      kind:"property.modify",property:"attack.damage.flat",operation:"add",value:{value:2},target:"actor",owner:"effect",source:"definition",
                      duration:{kind:"elapsed",amount:{value:1},unit:"minutes"},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:"unique-by-source",
                    }]},
                    {id:"strike",invocation:"manual",targeting:{from:"targets",min:1,max:1},
                      test:{kind:"attack-roll",roller:"actor",dc:{value:1}},
                      operations:[
                        {kind:"damage.apply",amount:{value:1},damageType:"bludgeoning",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}},
                        {kind:"damage.apply",amount:{value:1},damageType:"force",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}},
                      ]},
                  ],
                }}],
              }],
            })};
          }

          function hp(snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>) {
            return snapshot.scene.entities.find((entry)=>entry.id===TARGET_ID)?.hp;
          }

          async function exercise(prefix:string) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor(ACTOR_ID);
            const action=(entryPointId:string)=>installedCommonPlayActionId({
              catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId,
            });
            const before=hp(await adapter.getSnapshot())!;

            let snapshot=await adapter.resolveAction(action("empower"),[ACTOR_ID]);
            assert.equal(snapshot.resolution?.stage,"complete");

            await adapter.setQueuedD20(15);
            snapshot=await adapter.resolveAction(action("strike"),[TARGET_ID]);
            assert.equal(snapshot.resolution?.stage,"complete");
            assert.equal(hp(snapshot),before-4,"+2 attack.damage.flat rider must apply once to the first successful attack damage component, not once per component");

            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            assert.equal(hp(snapshot),before,"event-native Undo must restore the complete rider-adjusted attack transaction");
          }

          test("unknown installed Common Play applies a persistent generic attack damage rider exactly once per attack",async()=>{
            await exercise("external-family-j-attack-rider");
          });

          test("complete external identity rename preserves the generic attack damage rider",async()=>{
            await exercise("renamed-family-j-attack-rider");
          });
          EOF
      - run: npm run generate:content
      - name: Verify portable attack rider and adjacent Family J attack flows
        run: |
          node --import tsx --test \
            tests/ui/c9FamilyJAttackDamageRiderProduction71304.test.ts \
            tests/ui/c9FamilyJExtraAttackProduction71304.test.ts \
            tests/ui/c9FamilyJAmmunitionProduction.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified change and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-attack-rider-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add src/domain/commonPlayOperationRuntime.ts tests/ui/c9FamilyJAttackDamageRiderProduction71304.test.ts
          git commit -m "feat(c9): support portable attack damage riders"
          for attempt in $(seq 1 8); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then continue; fi
            git rebase --abort || true
            exit 1
          done
          exit 1
