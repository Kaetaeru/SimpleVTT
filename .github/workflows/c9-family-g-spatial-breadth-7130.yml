name: C9 Family G Spatial Breadth 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-g-spatial-breadth-7130.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family G spatial facts
        run: >-
          npx tsx --test
          tests/domain/commonPlaySpatialFactRuntime.test.ts
          tests/domain/c9FamilyGStandardSpatialFacts.test.ts
          tests/ui/c9FamilyGConnectedSpatialFactRuntime.test.ts
          tests/ui/connectedCommonPlayAuthorityFactRouting.test.ts
          tests/ui/connectedCommonPlayAuthorityFactDispatch.test.ts
      - name: Verify architecture boundaries
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
