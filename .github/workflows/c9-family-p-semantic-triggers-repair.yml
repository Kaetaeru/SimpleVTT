name: C9 Family P Semantic Trigger Repair

"on":
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-semantic-triggers-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Implement semantic d20 effect triggers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          effect = Path('src/domain/commonPlayEffectRuntime.ts')
          text = effect.read_text()
          text = text.replace(
              'type AutomaticDamageEvent="damage.taken"|"damage.dealt";\n',
              'type AutomaticDamageEvent="damage.taken"|"damage.dealt";\nexport type CommonPlayAutomaticEffectEvent=AutomaticDamageEvent|"attack.hit"|"attack.miss"|"save.success"|"save.failure";\n'
          )
          text = text.replace(
              '  event:AutomaticDamageEvent;\n  frequency?:AutomaticDamageFrequency;',
              '  event:CommonPlayAutomaticEffectEvent;\n  frequency?:AutomaticDamageFrequency;'
          )
          text = text.replace(
              '  if (rule.event!=="damage.taken"&&rule.event!=="damage.dealt") throw new Error(`${label} supports only damage.taken or damage.dealt`);',
              '  if (!["damage.taken","damage.dealt","attack.hit","attack.miss","save.success","save.failure"].includes(rule.event)) throw new Error(`${label} event is unsupported in this runtime slice`);'
          )
          if 'export type CommonPlayAutomaticEffectEvent=' not in text:
              raise SystemExit('effect event vocabulary patch did not apply')
          effect.write_text(text)

          semantic = Path('src/domain/commonPlaySemanticEventRuntime.ts')
          text = semantic.read_text()
          text = text.replace(
              'import type { D20TestResult } from "./d20";\nimport type { PendingResolution, ResolutionCommit, ResolutionEvent } from "./resolutionTypes";\n',
              'import type { RulesRuntimeState } from "./combatState";\nimport type { D20TestResult } from "./d20";\nimport type { CommonPlayAutomaticEffectEvent, CommonPlayPersistentEffectDefinition } from "./commonPlayEffectRuntime";\nimport { resolveCommonPlayFrequency } from "./commonPlayFrequencyRuntime";\nimport type { PendingResolution, ResolutionCommit, ResolutionEvent, ResolutionOperation } from "./resolutionTypes";\n'
          )
          text = text.replace(
              'function semanticKind(result:D20TestResult) {',
              'const EFFECT_METADATA_DEFINITION="commonPlayDefinitionId";\nconst EFFECT_METADATA_TEMPLATE="commonPlayTemplateId";\n\nfunction semanticKind(result:D20TestResult):CommonPlayAutomaticEffectEvent|undefined {'
          )
          marker = 'export function appendCommonPlaySemanticOutcomeEvents('
          if marker not in text:
              raise SystemExit('semantic event append anchor not found')
          trigger = '''function semanticContexts(operation:Extract<PendingResolution["operations"][number],{kind:"d20"}>) {\n  if(operation.request.family==="attack-roll") return [\n    {event:"attack.hit" as const,outcome:"success" as const},\n    {event:"attack.miss" as const,outcome:"failure" as const},\n  ];\n  if(operation.request.family==="saving-throw") return [\n    {event:"save.success" as const,outcome:"success" as const},\n    {event:"save.failure" as const,outcome:"failure" as const},\n  ];\n  return [];\n}\n\nexport function appendCommonPlaySemanticOutcomeTriggers(\n  state:RulesRuntimeState,\n  definitions:CommonPlayPersistentEffectDefinition[],\n  pending:PendingResolution,\n  creatureKinds:Record<string,"character"|"monster">,\n):PendingResolution {\n  const operations:ResolutionOperation[]=[...pending.operations];\n  for(const [d20Index,d20] of pending.operations.entries()) {\n    if(d20.kind!=="d20") continue;\n    const subjectId=d20.actorId??pending.actorId;\n    const creatureKind=creatureKinds[subjectId];\n    if(!creatureKind) continue;\n    for(const context of semanticContexts(d20)) {\n      const when={operationId:d20.id,field:"outcome",equals:context.outcome} as const;\n      for(const [definitionIndex,definition] of definitions.entries()) {\n        for(const [effectIndex,effect] of state.effects.filter((candidate)=>\n          candidate.targetId===subjectId\n          && candidate.sourceId===definition.id\n          && candidate.metadata?.[EFFECT_METADATA_DEFINITION]===definition.id\n        ).entries()) {\n          const templateId=effect.metadata?.[EFFECT_METADATA_TEMPLATE];\n          if(typeof templateId!=="string") continue;\n          const template=definition.artifactTemplates.find((candidate)=>candidate.id===templateId);\n          if(!template) continue;\n          for(const [ruleIndex,rule] of template.rules.filter((candidate)=>candidate.event===context.event).entries()) {\n            const frequency=resolveCommonPlayFrequency({\n              ruleId:rule.id,subjectId,frequency:rule.frequency??"once",resolutionId:pending.id,\n              clock:state.clock,markers:effect.metadata??{},\n            });\n            if(!frequency.eligible) continue;\n            for(const [operationIndex,operation] of rule.operations.entries()) operations.push({\n              id:`${pending.id}:automatic:${context.event}:${definitionIndex}:${effectIndex}:${d20Index}:${ruleIndex}:${operationIndex}`,\n              kind:"damage",targetId:subjectId,damageType:operation.damageType,amount:operation.amount.value,creatureKind,when,\n            });\n            if(template.lifetime.kind==="until-duration"&&Object.keys(frequency.metadataPatch).length) operations.push({\n              id:`${pending.id}:automatic:${context.event}:${definitionIndex}:${effectIndex}:${d20Index}:${ruleIndex}:frequency`,\n              kind:"update-effect",effectId:effect.id,metadataPatch:frequency.metadataPatch,when,\n            });\n          }\n        }\n      }\n    }\n  }\n  return operations.length===pending.operations.length?pending:{...pending,operations};\n}\n\n'''
          if 'appendCommonPlaySemanticOutcomeTriggers' not in text:
              text = text.replace(marker, trigger + marker)
          semantic.write_text(text)

          adapter = Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text = adapter.read_text()
          text = text.replace(
              'import { appendCommonPlaySemanticOutcomeEvents } from "../domain/commonPlaySemanticEventRuntime";',
              'import { appendCommonPlaySemanticOutcomeEvents, appendCommonPlaySemanticOutcomeTriggers } from "../domain/commonPlaySemanticEventRuntime";'
          )
          old = '''    const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionId));\n    const automaticPending=appendCommonPlayDamageTakenTriggers(\n      state,await installedPersistentEffectDefinitions(adapter),pending,actorEntity.kind==="character"?"character":"monster",\n    );\n    committed=appendCommonPlaySemanticOutcomeEvents(\n      automaticPending,\n      resolvePendingResolution(SIMPLEVTT_APP_RULES_PROFILE,state,automaticPending),\n    );'''
          new = '''    const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionId));\n    const effectDefinitions=await installedPersistentEffectDefinitions(adapter);\n    const damagePending=appendCommonPlayDamageTakenTriggers(\n      state,effectDefinitions,pending,actorEntity.kind==="character"?"character":"monster",\n    );\n    const automaticPending=appendCommonPlaySemanticOutcomeTriggers(\n      state,effectDefinitions,damagePending,Object.fromEntries(internal.scene.entities.map((entity)=>[entity.id,entity.kind==="character"?"character":"monster"])),\n    );\n    committed=appendCommonPlaySemanticOutcomeEvents(\n      automaticPending,\n      resolvePendingResolution(SIMPLEVTT_APP_RULES_PROFILE,state,automaticPending),\n    );'''
          if old not in text:
              raise SystemExit('installed adapter operation anchor not found')
          adapter.write_text(text.replace(old,new))

          test = Path('tests/domain/commonPlaySemanticTriggerRuntime.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { resolveCommonPlayEffectActivation, type CommonPlayPersistentEffectDefinition } from "../../src/domain/commonPlayEffectRuntime";\nimport { appendCommonPlaySemanticOutcomeEvents, appendCommonPlaySemanticOutcomeTriggers } from "../../src/domain/commonPlaySemanticEventRuntime";\nimport { resolvePendingResolution } from "../../src/domain/resolution";\nimport type { PendingResolution, ResolutionCommit } from "../../src/domain/resolutionTypes";\nimport { runtimeState, TEST_PROFILE } from "./rulesTestState";\n\nconst DEFINITION:CommonPlayPersistentEffectDefinition={\n  schemaVersion:"0.2-draft",id:"external.unknown.semantic-ward",\n  entryPoints:[{id:"activate",invocation:"manual",operations:[{kind:"effect.apply",template:"semantic-ward",target:"actor"}]}],\n  artifactTemplates:[{\n    id:"semantic-ward",artifactKind:"effect",\n    duration:{kind:"elapsed",amount:{value:1},unit:"hours"},\n    rules:[\n      {id:"on-hit",event:"attack.hit",frequency:"once-per-resolution",operations:[{kind:"damage.apply",amount:{value:2},damageType:"force",target:"event.actor"}]},\n      {id:"on-save-failure",event:"save.failure",frequency:"once-per-resolution",operations:[{kind:"damage.apply",amount:{value:3},damageType:"psychic",target:"event.actor"}]},\n    ],\n    lifetime:{kind:"until-duration",onEnd:"destroy"},\n  }],\n};\n\nfunction committed(value:ResolutionCommit,label:string) {\n  assert.equal(value.status,"committed",label);\n  if(value.status!=="committed") throw new Error(`${label}: ${value.error}`);\n  return value;\n}\n\ntest("semantic attack/save outcomes dispatch persistent-effect rules through the same pending resolution",()=>{\n  let state=runtimeState();\n  state=committed(resolveCommonPlayEffectActivation(TEST_PROFILE,state,DEFINITION,{resolutionId:"ward-hero",actorId:"hero",entryPointId:"activate"}),"hero ward").state;\n  state=committed(resolveCommonPlayEffectActivation(TEST_PROFILE,state,DEFINITION,{resolutionId:"ward-goblin",actorId:"goblin",entryPointId:"activate"}),"goblin ward").state;\n  const pending:PendingResolution={\n    id:"semantic-trigger-probe",actorId:"hero",sourceId:"external.renamable.source",expectedRevision:state.revision,\n    operations:[\n      {id:"attack",kind:"d20",targetId:"goblin",request:{family:"attack-roll",target:10,modifierContributions:[],targetSource:"external-ac",dice:{id:"attack-d20",purpose:"attack",sides:20,faces:[15]}}},\n      {id:"save",kind:"d20",actorId:"goblin",request:{family:"saving-throw",target:14,modifierContributions:[],targetSource:"external-dc",dice:{id:"save-d20",purpose:"save",sides:20,faces:[4]}}},\n    ],\n  };\n  const expanded=appendCommonPlaySemanticOutcomeTriggers(state,[DEFINITION],pending,{hero:"character",goblin:"monster"});\n  const resolved=appendCommonPlaySemanticOutcomeEvents(expanded,resolvePendingResolution(TEST_PROFILE,state,expanded));\n  assert.equal(resolved.status,"committed");\n  if(resolved.status!=="committed") return;\n  assert.equal(resolved.state.combatants.hero.life.hp.current,18);\n  assert.equal(resolved.state.combatants.goblin.life.hp.current,12);\n  assert.equal(resolved.events.some((event)=>event.kind==="attack.hit"),true);\n  assert.equal(resolved.events.some((event)=>event.kind==="save.failure"),true);\n  assert.equal(Object.keys(resolved.results).some((id)=>id.includes("automatic:attack.hit")),true);\n  assert.equal(Object.keys(resolved.results).some((id)=>id.includes("automatic:save.failure")),true);\n});\n''')
          PY

          npm ci
          npm run generate:content
          npx tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts tests/domain/commonPlaySemanticTriggerRuntime.test.ts tests/domain/commonPlayEffectRuntime.test.ts
          npx tsc --noEmit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayEffectRuntime.ts src/domain/commonPlaySemanticEventRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlaySemanticTriggerRuntime.test.ts
          git commit -m "feat(c9): dispatch semantic d20 effect triggers"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Clean staging workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
          git rm -f .github/workflows/c9-family-p-semantic-triggers.yml .github/workflows/c9-family-p-semantic-triggers-repair.yml
          git commit -m "ci(c9): retire semantic trigger staging"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
