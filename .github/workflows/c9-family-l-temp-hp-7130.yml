name: C9 Family L Portable Temporary HP 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-temp-hp-7130.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Add portable Temporary HP lowering and production proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:140]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          source='src/domain/commonPlayOperationRuntime.ts'
          text=Path(source).read_text(encoding='utf-8')
          if 'type CommonPlayTemporaryHpGrant=' in text:
              raise SystemExit('Portable Temporary HP lowering already exists; reconcile instead of duplicating')

          replace_once(source,
          '''type CommonPlayHealingApply={
            kind:"healing.apply";
            amount:LiteralNumberExpression;
            target?:CommonPlayHpTarget;
          };

          type CommonPlayRollModify={''',
          '''type CommonPlayHealingApply={
            kind:"healing.apply";
            amount:LiteralNumberExpression;
            target?:CommonPlayHpTarget;
          };

          type CommonPlayTemporaryHpGrant={
            kind:"temp-hp.grant";
            amount:LiteralNumberExpression;
            target?:CommonPlayHpTarget;
          };

          type CommonPlayRollModify={''')

          replace_once(source,
          '''  |CommonPlayDamageApply
            |CommonPlayHealingApply
            |CommonPlayMovementDefinition''',
          '''  |CommonPlayDamageApply
            |CommonPlayHealingApply
            |CommonPlayTemporaryHpGrant
            |CommonPlayMovementDefinition''')

          replace_once(source,
          '''const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","target"]);
          const HEALING_APPLY_KEYS=new Set(["kind","amount","target"]);
          const ROLL_MODIFY_KEYS=''',
          '''const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","target"]);
          const HEALING_APPLY_KEYS=new Set(["kind","amount","target"]);
          const TEMP_HP_GRANT_KEYS=new Set(["kind","amount","target"]);
          const ROLL_MODIFY_KEYS=''')

          replace_once(source,
          '''  if(operation.kind==="healing.apply") {
            supportedKeys(operation,HEALING_APPLY_KEYS,label);
            if(typeof operation.amount==="string") {
              throw new DomainEvaluationError(`${label}.amount healing dice are not supported by this Common Play HP slice`);
            }
            return {
              kind:"healing.apply",
              amount:nonNegativeLiteralExpression(operation.amount,`${label}.amount`),
              ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),
            };
          }
          throw new DomainEvaluationError(`unsupported Common Play operation: ${String(operation.kind)}`);''',
          '''  if(operation.kind==="healing.apply") {
            supportedKeys(operation,HEALING_APPLY_KEYS,label);
            if(typeof operation.amount==="string") {
              throw new DomainEvaluationError(`${label}.amount healing dice are not supported by this Common Play HP slice`);
            }
            return {
              kind:"healing.apply",
              amount:nonNegativeLiteralExpression(operation.amount,`${label}.amount`),
              ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),
            };
          }
          if(operation.kind==="temp-hp.grant") {
            supportedKeys(operation,TEMP_HP_GRANT_KEYS,label);
            return {
              kind:"temp-hp.grant",
              amount:nonNegativeLiteralExpression(operation.amount,`${label}.amount`),
              ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),
            };
          }
          throw new DomainEvaluationError(`unsupported Common Play operation: ${String(operation.kind)}`);''')

          replace_once(source,
          '''  if((entryPoint.targeting?.max??1)>1&&entryPoint.operations.some((operation)=>(operation.kind==="damage.apply"||operation.kind==="healing.apply")&&operation.target==="target")) {''',
          '''  if((entryPoint.targeting?.max??1)>1&&entryPoint.operations.some((operation)=>(operation.kind==="damage.apply"||operation.kind==="healing.apply"||operation.kind==="temp-hp.grant")&&operation.target==="target")) {''')

          replace_once(source,
          '''    if(operation.kind==="healing.apply") {
              operations.push({
                id:operationId,
                kind:"healing",
                targetId:hpOperationTarget(operation.target,input),
                amount:literalInteger(operation.amount,"healing.apply amount"),
              });
              continue;
            }

            if(operation.kind==="movement.relocate") {''',
          '''    if(operation.kind==="healing.apply") {
              operations.push({
                id:operationId,
                kind:"healing",
                targetId:hpOperationTarget(operation.target,input),
                amount:literalInteger(operation.amount,"healing.apply amount"),
              });
              continue;
            }

            if(operation.kind==="temp-hp.grant") {
              operations.push({
                id:operationId,
                kind:"temporary-hp",
                targetId:hpOperationTarget(operation.target,input),
                amount:literalInteger(operation.amount,"temp-hp.grant amount"),
                source:`common-play:${supported.id}:${entryPoint.id}:operation:${index}`,
              });
              continue;
            }

            if(operation.kind==="movement.relocate") {''')

          test_path=Path('tests/ui/c9FamilyLTemporaryHpProduction.test.ts')
          if test_path.exists():
              raise SystemExit('Family L Temporary HP production test already exists; reconcile instead of overwriting')
          test_path.write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/connectedSessionRuntimeAdapter";
          import "../../src/app/connectedActionRoutingAdapter";
          import { applyConnectedClientEvents, connectedManifest } from "../../src/app/connectedSessionRuntimeAdapter";
          import { connectedStateFor } from "../../src/app/connectedSessionState";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { ClientSessionReplica, HostSessionLedger, type ConnectedSessionEvent } from "../../src/app/connectedSessionProtocol";
          import { tauriSessionTransport } from "../../src/app/tauriSessionTransport";

          function packagePayload(prefix:string){
            const moduleId=`${prefix}.module`,contentId=`${prefix}.option`,mechanicId=`${prefix}.temp-hp`;
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Portable Temporary HP Probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],content:[{
                id:contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:"Portable Temporary HP",locales:{en:{name:"Portable Temporary HP"}}},
                mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{
                  id:"grant",invocation:"manual",operations:[{kind:"temp-hp.grant",amount:{value:7},target:"self"}],
                }]}}],
              }],
            })};
          }

          async function install(adapter:MockAdapter,prefix:string){
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            return installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"grant"});
          }

          function temporaryHp(snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>){
            return snapshot.scene.entities.find((entity)=>entity.id===snapshot.activeCharacter.id)?.tempHp;
          }

          async function execute(prefix:string){
            const adapter=new MockAdapter(),action=await install(adapter,prefix);
            let snapshot=await adapter.getSnapshot();
            const before=temporaryHp(snapshot)??0;
            assert.equal(before,0);
            snapshot=await adapter.resolveAction(action,[]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(temporaryHp(snapshot),7);
            assert.ok(snapshot.resolution?.provenance.some((entry)=>entry.includes("common-play:")),JSON.stringify(snapshot.resolution));
            snapshot=await adapter.undoLastResolution();
            assert.equal(temporaryHp(snapshot),before);
            return 7;
          }

          test("unknown installed temp-hp.grant lowers through Resolver Temporary HP with rename invariance and Undo",async()=>{
            assert.equal(await execute("external.temp-hp-original"),await execute("completely.renamed-temp-hp"));
          });

          test("portable Temporary HP converges through Host replay, Undo, and reconnect",async()=>{
            const prefix="external.connected-temp-hp",sessionId="session.c9-family-l-temp-hp";
            const host=new MockAdapter(),action=await install(host,prefix);
            const hostState=connectedStateFor(host);
            hostState.mode="host";hostState.sessionId=sessionId;hostState.ledger=new HostSessionLedger(sessionId,connectedManifest(host));
            const originalSend=tauriSessionTransport.send;
            const runHost=async(operation:()=>Promise<unknown>)=>{
              const wires:string[]=[];tauriSessionTransport.send=async(message)=>{wires.push(message);return 1;};
              try { await operation(); } finally { tauriSessionTransport.send=originalSend; }
              const batch=wires.map((wire)=>JSON.parse(wire)).find((wire)=>wire.type==="event-batch") as {events:ConnectedSessionEvent[]}|undefined;
              assert.ok(batch,JSON.stringify(wires));return batch!;
            };

            const client=new MockAdapter();await install(client,prefix);
            const clientState=connectedStateFor(client);clientState.mode="client";clientState.sessionId=sessionId;clientState.replica=new ClientSessionReplica(sessionId);

            const grantBatch=await runHost(()=>host.resolveAction(action,[]));
            assert.equal((await applyConnectedClientEvents(client,grantBatch.events)).status,"applied");
            let hostSnapshot=await host.getSnapshot(),clientSnapshot=await client.getSnapshot();
            assert.equal(temporaryHp(hostSnapshot),7);
            assert.equal(temporaryHp(clientSnapshot),7);

            const undoBatch=await runHost(()=>host.undoLastResolution());
            assert.equal((await applyConnectedClientEvents(client,undoBatch.events)).status,"applied");
            hostSnapshot=await host.getSnapshot();clientSnapshot=await client.getSnapshot();
            assert.equal(temporaryHp(hostSnapshot),0);
            assert.equal(temporaryHp(clientSnapshot),0);

            const reconnect=new MockAdapter();await install(reconnect,prefix);
            const reconnectState=connectedStateFor(reconnect);reconnectState.mode="client";reconnectState.sessionId=sessionId;reconnectState.replica=new ClientSessionReplica(sessionId);
            assert.equal((await applyConnectedClientEvents(reconnect,hostState.ledger!.eventsAfter(0))).status,"applied");
            assert.equal(temporaryHp(await reconnect.getSnapshot()),0);
          });
          ''',encoding='utf-8')

          ledger_path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(ledger_path.read_text(encoding='utf-8'))
          row=next((row for row in ledger['rows'] if row.get('family')=='L' and row.get('id')=='damage-life'),None)
          if not row or row.get('disposition')!='INCOMPLETE':
              raise SystemExit('Family L row missing or no longer INCOMPLETE; reconcile manually')
          evidence={
            'implementationEvidence':'commonPlayOperationRuntime.ts parses temp-hp.grant from the existing Common Play schema and lowers it directly to the shared Resolver temporary-hp operation',
            'productionEvidence':'c9FamilyLTemporaryHpProduction.test.ts executes an unknown installed temp-hp.grant through production Common Play, Resolver HP state changes, and one-step Undo',
            'identityInvarianceEvidence':'c9FamilyLTemporaryHpProduction.test.ts preserves Temporary HP semantics across unrelated external module/content/mechanic identities',
            'connectedEvidenceIfRelevant':'c9FamilyLTemporaryHpProduction.test.ts replays portable Temporary HP grant and Undo through Host-authoritative connected events',
            'persistenceEvidenceIfRelevant':'c9FamilyLTemporaryHpProduction.test.ts reconstructs the post-Undo Temporary HP state on a fresh connected replica from the Host event ledger',
          }
          for key,value in evidence.items():
              if value not in row[key]: row[key].append(value)
          row['currentState']='Bounded typed damage/healing plus portable Temporary HP are production-proven; complete life/object semantics remain incomplete'
          ledger_path.write_text(json.dumps(ledger,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Verify Family L Temporary HP production slice
        run: npx tsx --test tests/ui/c9FamilyLTemporaryHpProduction.test.ts
      - name: Verify coverage, legacy boundary, and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified Family L slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-l-temp-hp-7130.yml
          git add src/domain/commonPlayOperationRuntime.ts tests/ui/c9FamilyLTemporaryHpProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): lower portable Temporary HP"
          for attempt in $(seq 1 12); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
