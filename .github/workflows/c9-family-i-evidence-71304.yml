name: C9 Family I Evidence 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-evidence-71304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Reconcile Family I evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item.get('family')=='I')

          old='Family I remains incomplete for rules-derived movement constraints and named movement-grant convergence.'
          new='Generic RulesProfile property modifiers now derive movement cost multipliers and alternate fly speed into authoritative production movement input. Family I remains incomplete for drag/carry authority, remaining movement constraints, and named movement-grant convergence.'
          state=row.get('currentState','')
          if old in state:
              state=state.replace(old,new)
          elif 'Generic RulesProfile property modifiers now derive movement cost multipliers' not in state:
              state=(state+' '+new).strip()
          row['currentState']=state

          implementation='dnd.srd-5.2.1.profile.json registers movement.fly and movement.cost.multiplier; installedCommonPlayRuntimeAdapter.ts commonPlayActorProfileProperties resolves generic Resolver property modifiers and supplies them to commonPlayMovementRuntime.ts without content identity dispatch'
          if implementation not in row['implementationEvidence']:
              row['implementationEvidence'].append(implementation)

          production='c9FamilyIRulesDerivedMovementProduction.test.ts unknown external Common Play property.modify derives a Difficult-Terrain-style movement.cost.multiplier and alternate movement.fly speed into production movement; C9 Family I Baseline 71304 run 33315100853 passed this proof, the retained movement matrix, legacy boundary, coverage checker, and tsc --noEmit'
          if production not in row['productionEvidence']:
              row['productionEvidence'].append(production)

          identity='c9FamilyIRulesDerivedMovementProduction.test.ts preserves rules-derived movement cost and alternate-speed semantics after unrelated external module/content/mechanic identity rename'
          if identity not in row['identityInvarianceEvidence']:
              row['identityInvarianceEvidence'].append(identity)

          old_seam='rules-derived Difficult Terrain, drag/carry, alternate-speed, and related movement constraint authority remain incomplete'
          new_seam='rules-derived drag/carry and remaining movement constraint authority remain incomplete'
          seams=row.get('remainingNamedSeams',[])
          seams=[new_seam if seam==old_seam else seam for seam in seams]
          if old_seam not in row.get('remainingNamedSeams',[]) and new_seam not in seams:
              seams.append(new_seam)
          row['remainingNamedSeams']=seams

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish evidence and retire staging workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-i-baseline-71304.yml .github/workflows/c9-family-i-evidence-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json tests/ui/c9FamilyIRulesDerivedMovementProduction.test.ts
          git diff --cached --check
          git commit -m "docs(c9): record rules-derived movement evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
