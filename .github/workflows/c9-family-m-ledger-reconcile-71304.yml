name: C9 Family M Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-m-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Fast-forward to current branch state
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Generate content
        run: npm run generate:content
      - name: Verify Family M generic and production evidence
        run: >-
          npx tsx --test
          tests/domain/c9FamilyMConditions.test.ts
          tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts
          tests/ui/c9FamilyMConditionImmunityProduction.test.ts
          tests/ui/c9FamilyMConditionConnectedAcceptance.test.ts
          tests/ui/c9FamilyMExhaustionProduction.test.ts
      - name: Reconcile Family M ledger row
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const row = ledger.rows.find((candidate) => candidate.family === 'M' && candidate.id === 'conditions');
          if (!row) throw new Error('Family M conditions ledger row not found');
          if (!['INCOMPLETE', 'IMPLEMENTED'].includes(row.disposition)) throw new Error(`Unexpected Family M disposition: ${row.disposition}`);
          const appendUnique = (field, value) => {
            if (!row[field].includes(value)) row[field].push(value);
          };
          row.currentState = 'Family M is complete on the generic condition authority. The shared Resolver condition Effect path enforces explicit, active-effect, and rules-derived immunities; portable condition.apply/remove executes for unknown installed RuleModules without content identity dispatch; all 15 SRD 5.2.1 conditions are exhaustively covered for structural implications, senses, action economy, speed, d20/save/critical behavior, defenses/immunities, initiative, source-bound restrictions, stacking/Exhaustion levels, and renamed effect identities. Unknown installed condition production additionally proves immunity handling, Exhaustion level 1-6/fatal state, Host-authoritative replay, duplicate suppression, event-native Undo, fresh reconnect, persistence, and external module/content/mechanic rename invariance. Named built-in condition producers remain legacy content migration debt cataloged by legacy-execution-inventory.md, not a supported portable execution fallback or second condition engine.';
          row.disposition = 'IMPLEMENTED';
          appendUnique('implementationEvidence', 'tests/domain/c9FamilyMConditions.test.ts exhaustively covers all 15 SRD 5.2.1 conditions through the generic condition profile, including implications, senses, action economy, speed, d20/save/critical behavior, defenses/immunities, initiative, source-bound restrictions, and Exhaustion levels');
          appendUnique('productionEvidence', 'ddcbca059be25df8c4ad323bff12ec404b24fe4f test(c9): cover generic condition semantics; Rules Domain run 33310722687 passed the exhaustive Family M condition semantics test');
          appendUnique('identityInvarianceEvidence', 'tests/domain/c9FamilyMConditions.test.ts proves structural condition semantics are invariant under arbitrary renamed external Effect instance identities across all SRD condition IDs');
          row.remainingNamedSeams = [];
          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE
      - name: Verify ledger shape and application typecheck
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Commit verified reconciliation and retire temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-m-ledger-reconcile-71304.yml
          git commit -m "docs(c9): mark Family M condition coverage implemented"
          git pull --rebase origin "$GITHUB_REF_NAME"
          node scripts/check-v1-mechanism-coverage.mjs
          git push origin HEAD:"$GITHUB_REF_NAME"
