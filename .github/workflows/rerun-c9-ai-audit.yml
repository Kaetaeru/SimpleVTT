name: C9 Family AI Source Constraint Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ai-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile AI source and constraint boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(ledger.rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0) throw new Error(`unexpected coverage ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('gateNBlockingNamedFallbacks is not empty');
          const ai=ledger.rows.find(r=>r.family==='AI'&&r.id==='carrying-capacity-cargo');
          const ad=ledger.rows.find(r=>r.family==='AD');
          const x=ledger.rows.find(r=>r.family==='X');
          const y=ledger.rows.find(r=>r.family==='Y');
          if(!ai||ai.disposition!=='INCOMPLETE'||ad?.disposition!=='INCOMPLETE'||x?.disposition!=='INCOMPLETE'||y?.disposition!=='INCOMPLETE') throw new Error('AI dependency disposition changed; re-audit');
          function sourceText(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?sourceText(path.join(dir,e.name)):/\.(ts|tsx|json)$/.test(e.name)?[fs.readFileSync(path.join(dir,e.name),'utf8')]:[]).join('\n');}
          const schema=fs.readFileSync('schemas/common-play-contract.schema.json','utf8');
          const src=sourceText('src');
          const portableTokens=['carryingCapacity','cargoCapacity','containerCapacity','weightPounds','weightLb'];
          if(portableTokens.some(token=>schema.includes(token))) throw new Error('portable capacity/weight schema now exists; re-audit');
          if(portableTokens.some(token=>src.includes(token))) throw new Error('production capacity source/enforcement now exists; re-audit');
          ai.currentState='RulesProfile expression/property infrastructure could calculate a capacity once authoritative facts exist, but the portable Common Play/source contracts do not define item weight, container capacity, carrying-capacity/cargo facts, or an enforcement transaction. Family AD still lacks authoritative mount/vehicle cargo topology and Families X/Y still lack the portable durable item/container source model. A derived scalar alone cannot safely reject inventory/vehicle mutations without those owned source facts.';
          ai.remainingNamedSeams=[
            'portable item weight/container-capacity source data in the durable item model',
            'RulesProfile-owned carrying-capacity/size-scaling derived property with authoritative inputs',
            'inventory transaction enforcement for carried/container weight constraints',
            'mount/vehicle cargo capacity enforcement dependent on Family AD topology ownership',
            'connected/persistence projection of the same durable capacity facts'
          ];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const statePath='.chatgpt-rerun/STATE.md';
          let state=fs.readFileSync(statePath,'utf8');
          const marker='## Next Exact Action';
          const idx=state.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          const before=state.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family AI audit — durable capacity source facts missing\n\nFamily AI (`carrying-capacity-cargo`) remains `INCOMPLETE`. Generic expressions can derive a number only after authoritative inputs exist, but current portable/source contracts do not own item weight, container capacity, carrying/cargo capacity, or mutation-time enforcement. Vehicle cargo depends on unresolved Family AD topology and item/container constraints depend on unresolved Families X/Y durable source ownership. Adding a standalone capacity formula would not satisfy production authority and would fabricate missing source facts.\n\n';
          const next='## Next Exact Action\n\nAudit Family AJ (`authority-persistence-ownership`) only as a cross-family acceptance row: reconcile which ownership/retry/reconnect/Undo patterns are already proven and list the still-blocking families whose durable/session owners remain undefined. Do not mark AJ final while any required family still lacks its correct transaction owner. After AJ reconciliation, return to the earliest non-authority-blocked incomplete family from the ledger and implement the smallest actual semantic/evidence gap rather than continuing audit-only work.\n';
          fs.writeFileSync(statePath,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs || true
          git diff --check
      - name: Commit AI audit and STATE
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): audit carrying capacity source gap"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family AI remains INCOMPLETE because portable durable item/container/vehicle source facts and mutation-time capacity enforcement are not owned; AD and X/Y are prerequisite authority gaps. Next reconcile Family AJ cross-family ownership evidence, then return to the earliest non-authority-blocked implementation gap.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          rm .github/workflows/rerun-c9-ai-audit.yml
          git add .chatgpt-rerun/control.json .github/workflows/rerun-c9-ai-audit.yml
          git commit -m "docs(rerun): continue after carrying capacity audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation