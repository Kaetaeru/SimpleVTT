name: C9 Family J Unarmed Source Composition 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-unarmed-source-composition-71304.yml]

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify source-owned Unarmed save choice is present
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          contracts=Path('src/app/contracts.ts').read_text(encoding='utf-8')
          if 'runtimeSaveCondition?:{' not in contracts or 'choose:"highest";' not in contracts:
              raise SystemExit('runtimeSaveCondition highest-choice contract missing')

          projection=Path('src/app/productionPlayRuntimeAdapter.ts').read_text(encoding='utf-8')
          if projection.count('runtimeSaveCondition:{choose:"highest",conditionId:') < 2:
              raise SystemExit('Unarmed grapple/shove source-owned choice payload missing')

          runtime=Path('src/app/unarmedControlRuntimeAdapter.ts').read_text(encoding='utf-8')
          required=[
              'const control=action?.runtimeSaveCondition;',
              'if (control.choose!=="highest") return snapshot;',
              'saveFact(this,internal,target,control.saveAbilities)',
              'duration:control.duration',
              'termination:control.termination',
          ]
          missing=[entry for entry in required if entry not in runtime]
          if missing:
              raise SystemExit(f'Unarmed control runtime still lacks structural payload ownership: {missing}')

          test=Path('tests/ui/unarmedStrikeRuntime.test.ts').read_text(encoding='utf-8')
          required_test=[
              'after action identity and presentation rename',
              'source.runtimeSaveCondition?.choose,"highest"',
              'action.id=probe.renamedId',
              'adapter.resolveAction(probe.renamedId',
          ]
          missing_test=[entry for entry in required_test if entry not in test]
          if missing_test:
              raise SystemExit(f'Unarmed identity/source regression missing: {missing_test}')
          PY
      - name: Verify Family J source composition
        shell: bash
        run: |
          npm run generate:content
          npx tsx --test tests/ui/unarmedStrikeRuntime.test.ts tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJSpatialAttackProduction.test.ts tests/ui/c9FamilyJExtraAttackProduction71304.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Retire verifier after exact-SHA verification
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" "$GITHUB_SHA"
          git rm .github/workflows/c9-family-j-unarmed-source-composition-71304.yml
          git commit -m "ci(c9): verify unarmed source-owned save choice"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
