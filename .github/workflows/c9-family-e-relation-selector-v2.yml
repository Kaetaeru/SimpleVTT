name: C9 Family E Relation Selector V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-e-relation-selector-v2.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply bounded relation selector production slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_once(
              runtime,
              '''export interface CommonPlayTargetingSelector {\n  from:"targets";\n  min:number;\n  max:number;\n}''',
              '''export interface CommonPlayTargetingSelector {\n  from:"targets";\n  min:number;\n  max:number;\n  where?:{op:"relation-matches";ref:"relation";value:TargetingFactInput["relation"]};\n}''',
          )
          replace_once(
              runtime,
              'const TARGETING_KEYS=new Set(["from","min","max"]);',
              'const TARGETING_KEYS=new Set(["from","where","min","max"]);\nconst TARGETING_WHERE_KEYS=new Set(["op","ref","value"]);',
          )
          replace_once(
              runtime,
              '''  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  if(!Number.isInteger(selector.min)||Number(selector.min)<0) throw new DomainEvaluationError(`${label}.min must be a non-negative integer for portable Common Play targeting`);\n  if(!Number.isInteger(selector.max)||Number(selector.max)<Number(selector.min)) throw new DomainEvaluationError(`${label}.max must be an integer >= min for portable Common Play targeting`);\n  return {from:"targets",min:Number(selector.min),max:Number(selector.max)};''',
              '''  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  let where:CommonPlayTargetingSelector["where"];\n  if(selector.where!==undefined) {\n    const predicate=object(selector.where,`${label}.where`);\n    supportedKeys(predicate,TARGETING_WHERE_KEYS,`${label}.where`);\n    if(predicate.op!=="relation-matches"||predicate.ref!=="relation") throw new DomainEvaluationError(`${label}.where currently supports relation-matches on relation only`);\n    if(predicate.value!=="self"&&predicate.value!=="ally"&&predicate.value!=="enemy"&&predicate.value!=="neutral") throw new DomainEvaluationError(`${label}.where.value must be self, ally, enemy, or neutral`);\n    where={op:"relation-matches",ref:"relation",value:predicate.value};\n  }\n  if(!Number.isInteger(selector.min)||Number(selector.min)<0) throw new DomainEvaluationError(`${label}.min must be a non-negative integer for portable Common Play targeting`);\n  if(!Number.isInteger(selector.max)||Number(selector.max)<Number(selector.min)) throw new DomainEvaluationError(`${label}.max must be an integer >= min for portable Common Play targeting`);\n  return {from:"targets",min:Number(selector.min),max:Number(selector.max),...(where?{where}:{})};''',
          )
          replace_once(
              runtime,
              '''    if(input.targetId!==undefined&&!input.targetingTargets.some((target)=>target.id===input.targetId)) {\n      throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");\n    }\n    operations.push({''',
              '''    if(input.targetId!==undefined&&!input.targetingTargets.some((target)=>target.id===input.targetId)) {\n      throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");\n    }\n    if(entryPoint.targeting.where) {\n      const rejected=input.targetingTargets.filter((target)=>target.relation!==entryPoint.targeting!.where!.value);\n      if(rejected.length) throw new DomainEvaluationError(`Common Play targeting relation filter rejected: ${rejected.map((target)=>target.id).join(", ")}`);\n    }\n    operations.push({''',
          )

          adapter='src/app/installedCommonPlayRuntimeAdapter.ts'
          replace_once(
              adapter,
              '''  const portableEntry=entryPoint as {targeting?:{min?:number;max?:number};operations:Array<{kind:string;target?:string}>};''',
              '''  const portableEntry=entryPoint as {targeting?:{min?:number;max?:number;where?:{op:string;ref:string;value:string}};operations:Array<{kind:string;target?:string}>};''',
          )
          replace_once(
              adapter,
              '''    if(targetIds.length<(targeting.min??1)||targetIds.length>(targeting.max??targetIds.length)) return undefined;\n    if(projectedAction&&(!projectedAction.available||targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;''',
              '''    if(targetIds.length<(targeting.min??1)||targetIds.length>(targeting.max??targetIds.length)) return undefined;\n    if(targeting.where?.op==="relation-matches"&&targeting.where.ref==="relation"&&selectedTargets.some((target)=>commonPlayTargetFact(actorEntity,target!).relation!==targeting.where!.value)) return undefined;\n    if(projectedAction&&(!projectedAction.available||targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;''',
          )

          domain=Path('tests/domain/commonPlayTargetingRuntime.test.ts')
          text=domain.read_text(encoding='utf-8')
          text=text.replace(
              '[{from:"targets",where:{value:true},min:1,max:1},/unsupported fields: where/],',
              '[{from:"targets",where:{value:true},min:1,max:1},/currently supports relation-matches/],',
          )
          marker='test("bounded Common Play selector preserves authored multi-target limits without fabricating spatial facts",()=>{'
          title='test("portable Common Play relation selector validates authoritative relation facts without identity dispatch",()=>{'
          if title not in text:
              if text.count(marker)!=1: raise SystemExit('domain relation test insertion marker mismatch')
              addition='''test("portable Common Play relation selector validates authoritative relation facts without identity dispatch",()=>{\n  const authored=structuredClone(AUTHORED);\n  authored.entryPoints[0].targeting={from:"targets",where:{op:"relation-matches",ref:"relation",value:"enemy"},min:1,max:1};\n  const definition=parseManualCommonPlayOperationDefinition(authored);\n  assert.deepEqual(definition.entryPoints[0].targeting,authored.entryPoints[0].targeting);\n\n  const enemyState=runtimeState();\n  enemyState.combatants.goblin.life.hp.current=5;\n  const enemy=resolveCommonPlayEntryPointOperations(TEST_PROFILE,enemyState,definition,{\n    resolutionId:"relation-enemy",actorId:"hero",entryPointId:"mend-other",targetId:"goblin",targetingTargets:[target("goblin","enemy")],\n  });\n  assert.equal(enemy.status,"committed");\n  if(enemy.status==="committed") assert.equal(enemy.state.combatants.goblin.life.hp.current,10);\n\n  const selfState=runtimeState();\n  selfState.combatants.hero.life.hp.current=10;\n  const self=resolveCommonPlayEntryPointOperations(TEST_PROFILE,selfState,definition,{\n    resolutionId:"relation-self",actorId:"hero",entryPointId:"mend-other",targetId:"hero",targetingTargets:[target("hero","self")],\n  });\n  assert.equal(self.status,"rejected");\n  if(self.status==="rejected") assert.match(self.error,/relation filter rejected: hero/);\n  assert.equal(selfState.combatants.hero.life.hp.current,10);\n});\n\n'''
              text=text.replace(marker,addition+marker,1)
          domain.write_text(text,encoding='utf-8')

          production=Path('tests/ui/installedCommonPlayProductionRuntime.test.ts')
          text=production.read_text(encoding='utf-8')
          marker='test("installed Common Play targeting validates one existing target before healing and supports Undo",async()=>{'
          title='test("unknown installed Common Play relation selector rejects an ineligible target before production commit",async()=>{'
          if title not in text:
              if text.count(marker)!=1: raise SystemExit('production relation test insertion marker mismatch')
              addition='''test("unknown installed Common Play relation selector rejects an ineligible target before production commit",async()=>{\n  const adapter=new MockAdapter();\n  const payload=JSON.parse(targetingPackagePayload()) as any;\n  payload.content[0].mechanics[0].config.entryPoints[0].targeting={from:"targets",where:{op:"relation-matches",ref:"relation",value:"enemy"},min:1,max:1};\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(JSON.stringify(payload));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  const actionId=installedCommonPlayActionId({\n    catalogId:catalogQualifiedId(TARGETING_IDENTITY.contentId,TARGETING_IDENTITY.moduleId,"1"),mechanicId:TARGETING_IDENTITY.mechanicId,entryPointId:TARGETING_IDENTITY.entryPointId,\n  });\n  injureActiveCharacter(adapter,10);\n  injureSceneEntity(adapter,"combatant.goblin-a",10);\n  await adapter.startInitiative();\n  await adapter.setCurrentActor("char.aelar");\n  const selfBefore=(await adapter.getSnapshot()).activeCharacter.hp;\n  await adapter.resolveAction(actionId,["char.aelar"]);\n  assert.equal((await adapter.getSnapshot()).activeCharacter.hp,selfBefore,"self must be filtered before production commit");\n\n  const enemyBefore=(await adapter.getSnapshot()).scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp;\n  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  const snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp,enemyBefore+5);\n  assert.equal(snapshot.resolution?.stage,"complete");\n  assert.equal(snapshot.resolution?.actionId,actionId);\n  assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);\n});\n\n'''
              text=text.replace(marker,addition+marker,1)
          production.write_text(text,encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E relation selector slice
        run: >-
          npx tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified relation selector slice and retire stale helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-relation-selector-v2.yml
          for path in \
            .github/workflows/c9-family-e-relation-selector.yml \
            .github/workflows/c9-family-e-rich-selector-step.yml \
            .github/scripts/c9-family-e-relation-selector.mjs; do
            if [ -e "$path" ]; then git rm "$path"; fi
          done
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
          git commit -m "feat(c9): validate portable relation selectors"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation