name: C9 Family AG Diagnostic

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ag-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Inspect Family AG structural coverage
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'));
          const rows=ledger.rows;
          const ag=rows.find(r=>r.family==='AG');
          if(!ag||ag.disposition!=='INCOMPLETE') throw new Error(`unexpected AG disposition: ${ag?.disposition}`);
          const source=fs.readFileSync('src/app/productionPlayRuntimeAdapter.ts','utf8');
          const required=[
            ['Attack','function attackActions('],
            ['Dash','movementBudgetGainFeet:character.speed'],
            ['Disengage','standardEffect("disengage"'],
            ['Dodge','standardEffect("dodge"'],
            ['Help','standardEffect("help"'],
            ['Hide','standardCheck("hide"'],
            ['Influence','standardCheck("influence"'],
            ['Ready','standardEffect("ready"'],
            ['Search','standardCheck("search"'],
            ['Study','standardCheck("study"'],
            ['Utilize','standardEffect("utilize"'],
            ['Magic delegate','...itemActions(character),...spellActions(character as ExtendedCharacter)']
          ];
          for(const [name,needle] of required){
            const present=source.includes(needle);
            console.log(`${name}: ${present?'PRESENT':'MISSING'} :: ${needle}`);
            if(!present) process.exitCode=1;
          }
          console.log('spellMechanicById named spell dispatch remains:',source.includes('spellMechanicById(spellId)'));
          console.log('AG row:',JSON.stringify(ag,null,2));
          NODE
      - name: Locate existing standard-action acceptance
        run: |
          echo '--- structural standard-action tests ---'
          grep -RIn --include='*.test.ts' -E 'movementBudgetGainFeet|action\.standard\.(disengage|dodge|help|hide|ready|search|study|influence|utilize)|action\.dash|Ready' tests/ui tests/domain | head -n 500 || true
          echo '--- generic structural execution seams ---'
          grep -RIn --include='*.ts' -E 'movementBudgetGainFeet|sessionStatusEffect|completionOutcome|completionStateChange|readyActionConfigurationFor' src/app | head -n 500 || true
          echo '--- magic delegation / identity seams ---'
          grep -RIn --include='*.ts' -E 'spellMechanicById\(|itemMechanic\(|spellActions\(|itemActions\(' src/app | head -n 300 || true
      - name: TypeScript
        run: npx tsc --noEmit
