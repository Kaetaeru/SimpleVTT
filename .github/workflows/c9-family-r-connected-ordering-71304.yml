name: C9 Family R Connected Ordering 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-r-connected-ordering-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-r-connected-ordering-71304
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply, verify, commit, and self-retire
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 5); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            npm run generate:content >/dev/null
            python3 .github/scripts/c9-family-r-connected-ordering-71304.py
            node --import tsx --test tests/domain/commonPlaySimultaneousOrderingRuntime.test.ts tests/ui/connectedActorTurnRuleProduction.test.ts
            npm exec tsc -- --noEmit
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            rm -f .github/scripts/c9-family-r-connected-ordering-71304.py .github/workflows/c9-family-r-connected-ordering-71304.yml
            git add src/app/phase09EffectAwareTurnAdapter.ts src/app/connectedTurnSimultaneousOrderingResponsePort.ts src/app/connectedSessionWire.ts src/app/connectedSessionRuntimeAdapter.ts src/app/connectedTurnRoutingAdapter.ts tests/ui/connectedActorTurnRuleProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json .github/scripts/c9-family-r-connected-ordering-71304.py .github/workflows/c9-family-r-connected-ordering-71304.yml
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "feat(c9): connect simultaneous turn ordering"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 1
          done
          exit 1
