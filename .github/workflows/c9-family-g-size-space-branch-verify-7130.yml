name: C9 Family G Size Space Branch Verify 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-g-size-space-branch-verify-7130.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family G size and space authority
        run: node --import tsx --test tests/domain/commonPlaySpatialFactRuntime.test.ts tests/domain/c9FamilyGStandardSpatialFacts.test.ts tests/domain/c9FamilyGSizeSpaceFacts.test.ts
      - name: Verify coverage ledger integrity
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Typecheck
        run: npm exec tsc -- --noEmit
