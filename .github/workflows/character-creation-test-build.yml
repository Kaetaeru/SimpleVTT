name: Character Creation Test Build

on:
  push:
    branches:
      - "agent/character-creation-test-build"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify character creation checkpoint
        run: npm run build
      - name: Build Windows test app
        run: npm run tauri:build
      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVTT-character-creation-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/simplevtt.exe
            src-tauri/target/release/bundle/nsis/*.exe
