name: C9 Actor Artifact Normalized Spawn 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-actor-artifact-normalized-spawn-71304.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Normalize spawned actor combatant base properties
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/domain/resolutionArtifactOps.ts')
          s=p.read_text()
          old='''  const baseProperties:Record<string,number>={};\n  for(const [property,value] of Object.entries(actor.properties)) {\n    if(typeof value==="number"&&Number.isFinite(value)) baseProperties[property]=value;\n  }\n  return {\n    id:actor.combatantId,\n    baseSpeed:speed,\n    baseProperties,\n    life:{\n      hp:{current:Number(actor.properties["hp.current"]??maximum),maximum,temporary:Number(actor.properties["hp.temporary"]??0)},'''
          new='''  const current=Number(actor.properties["hp.current"]??maximum);\n  const temporary=Number(actor.properties["hp.temporary"]??0);\n  const baseProperties:Record<string,number>={};\n  for(const [property,value] of Object.entries(actor.properties)) {\n    if(typeof value==="number"&&Number.isFinite(value)) baseProperties[property]=value;\n  }\n  baseProperties["movement.walk"]=speed;\n  baseProperties["hp.current"]=current;\n  baseProperties["hp.maximum"]=maximum;\n  baseProperties["hp.temporary"]=temporary;\n  return {\n    id:actor.combatantId,\n    baseSpeed:speed,\n    baseProperties,\n    life:{\n      hp:{current,maximum,temporary},'''
          if old not in s:
            raise SystemExit('actorCombatant shape changed; refusing broad patch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify actor artifact runtime and connected Undo
        run: |
          node --import tsx --test \
            tests/ui/connectedActorArtifactReconnectProduction.test.ts \
            tests/ui/connectedActorArtifactLifetimeProduction.test.ts \
            tests/ui/commonPlayActorArtifactActionProjectionProduction.test.ts \
            tests/ui/installedCommonPlayArtifactLifecycleProduction.test.ts
      - name: Verify C9 invariants
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Commit verified fix and retire workflow
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-actor-artifact-normalized-spawn-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$workflow"
          git add src/domain/resolutionArtifactOps.ts "$workflow"
          git commit -m "fix(c9): normalize spawned actor combatant state"
          for attempt in $(seq 1 12); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              exit 1
            fi
            sleep 1
          done
          exit 1
