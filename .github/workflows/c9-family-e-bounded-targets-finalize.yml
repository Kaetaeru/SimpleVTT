name: C9 Family E Bounded Targets Finalize

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-bounded-targets-finalize.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reuse verified bounded-target patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/c9-family-e-bounded-targets-step.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY\n",start)
          block=source[start:end]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
          Path('/tmp/c9-family-e-bounded-targets.py').write_text(script,encoding='utf-8')
          PY
          python /tmp/c9-family-e-bounded-targets.py
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E bounded target slice
        run: >-
          npx tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified change and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-e-bounded-targets-finalize.yml .github/workflows/c9-family-e-bounded-targets-retry.yml .github/workflows/c9-family-e-bounded-targets-step.yml .github/workflows/c9-family-e-up-to-n-targeting.yml || true
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts .github/workflows
          git commit -m "feat(c9): support bounded multi-target selectors"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
