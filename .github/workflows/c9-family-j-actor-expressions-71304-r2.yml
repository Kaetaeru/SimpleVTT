name: C9 Family J Actor Expressions 71304 R2

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-actor-expressions-71304-r2.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add actor-profile expression runtime parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          text=runtime.read_text(encoding='utf-8')
          replacements=[
            ('  amount:LiteralNumberExpression|string;\n','  amount:CommonPlayExpression|string;\n'),
            ('  dc:LiteralNumberExpression;\n','  dc:CommonPlayExpression;\n'),
            ('  movementProperties?:Record<string,number>;\n','  actorProperties?:Record<string,number>;\n  movementProperties?:Record<string,number>;\n'),
            ('    } else amount=nonNegativeLiteralExpression(operation.amount,`${label}.amount`);\n','    } else amount=numericExpression(operation.amount,`${label}.amount`);\n'),
            ('dc:literalExpression(definition.dc,`${label}.dc`)','dc:numericExpression(definition.dc,`${label}.dc`)'),
            ('literalInteger(entryPoint.test.dc,"d20 target")','actorExpressionInteger(entryPoint.test.dc,input,"d20 target",0)'),
            ('literalInteger(operation.amount,"damage.apply amount")','actorExpressionInteger(operation.amount,input,"damage.apply amount",0)'),
          ]
          for old,new in replacements:
            count=text.count(old)
            if count!=1: raise SystemExit(f'expected one replacement, got {count}: {old!r}')
            text=text.replace(old,new)
          marker='''function commonPlayD20Ability(property:CommonPlayD20ModifierProperty|undefined):CommonPlayD20Ability|undefined {\n  if(typeof property!=="string") return undefined;\n  const match=property.match(/^(?:save|ability)\\.(str|dex|con|int|wis|cha)\\.(?:modifier|score)$/);\n  return match?.[1] as CommonPlayD20Ability|undefined;\n}\n\n'''
          helper=marker+'''function actorExpressionInteger(\n  expression:CommonPlayExpression,\n  input:CommonPlayOperationExecutionInput,\n  label:string,\n  minimum?:number,\n) {\n  const properties=input.actorProperties??{};\n  const value=evaluateExpression(expression as ExpressionNode,(property)=>{\n    const resolved=properties[property];\n    if(!Number.isFinite(resolved)) throw new DomainEvaluationError(`${label} actor property is unavailable: ${property}`);\n    return Number(resolved);\n  });\n  if(!Number.isFinite(value)||!Number.isInteger(value)) throw new DomainEvaluationError(`${label} must resolve to a finite integer`);\n  if(minimum!==undefined&&value<minimum) throw new DomainEvaluationError(`${label} must resolve to an integer >= ${minimum}`);\n  return value;\n}\n\n'''
          if text.count(marker)!=1: raise SystemExit('actor expression helper marker changed')
          runtime.write_text(text.replace(marker,helper),encoding='utf-8')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          old='    ...(movementProperties?{movementProperties}:{}),\n'
          if text.count(old)!=1: raise SystemExit('actor property projection marker changed')
          text=text.replace(old,'    ...(movementProperties?{actorProperties:movementProperties,movementProperties}:{}),\n')
          old='        roll:typeof operation.amount==="string"?operation.amount:String(operation.amount.value),\n'
          if text.count(old)!=1: raise SystemExit('damage presentation marker changed')
          text=text.replace(old,'        roll:typeof operation.amount==="string"?operation.amount:String(result.raw),\n')
          adapter.write_text(text,encoding='utf-8')
          PY
          cat > tests/domain/c9CommonPlayActorExpressionRuntime.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { parseManualCommonPlayOperationDefinition, resolveCommonPlayEntryPointOperations } from "../../src/domain/commonPlayOperationRuntime";
          import { TEST_PROFILE, runtimeState } from "./rulesTestState";
          const AUTHORED={schemaVersion:"0.2-draft",id:"external.unknown.actor-expression-probe",entryPoints:[{id:"control",invocation:"manual",targeting:{from:"targets",min:1,max:1},test:{kind:"saving-throw",roller:"target",property:"save.dex.modifier",dc:{op:"add",args:[{value:8},{ref:"proficiency.bonus"},{ref:"ability.str.modifier"}]},perTarget:false},operations:[{kind:"damage.apply",amount:{op:"max",args:[{value:0},{op:"add",args:[{value:1},{ref:"ability.str.modifier"}]}]},damageType:"bludgeoning",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"failure"}}}]}]} as const;
          function execute(id:string,actorProperties:Record<string,number>){const state=runtimeState();const authored=structuredClone(AUTHORED) as any;authored.id=id;const definition=parseManualCommonPlayOperationDefinition(authored);return resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition,{resolutionId:"actor-expression-resolution",actorId:"hero",entryPointId:"control",targetId:"goblin",targetingTargets:[{id:"goblin",kind:"creature",relation:"enemy"}],creatureKinds:{goblin:"monster"},d20:{faces:[1],targetId:"goblin",modifierContributions:[{source:"target:dex-save",value:2}]},actorProperties});}
          test("actor profile expressions drive dynamic DC and flat damage under identity rename",()=>{const properties={"proficiency.bonus":3,"ability.str.modifier":4};for(const committed of [execute("external.unknown.actor-expression-probe",properties),execute("external.renamed.actor-expression-probe",properties)]){assert.equal(committed.status,"committed");if(committed.status!=="committed")continue;const roll=committed.results["actor-expression-resolution:test"] as {target:number;total:number;outcome:string};assert.deepEqual({target:roll.target,total:roll.total,outcome:roll.outcome},{target:15,total:3,outcome:"failure"});assert.equal(committed.state.combatants.goblin.life.hp.current,10);}});
          test("actor expression missing property rejects atomically",()=>{const rejected=execute("external.actor-expression-missing-authority",{"ability.str.modifier":4});assert.equal(rejected.status,"rejected");assert.match(rejected.status==="rejected"?rejected.error:"",/actor property is unavailable: proficiency\.bonus/);assert.equal(rejected.state.revision,0);assert.equal(rejected.state.combatants.goblin.life.hp.current,15);});
          EOF
      - name: Verify actor-owned expression slice
        run: |
          npm run generate:content
          node --import tsx --test tests/domain/c9CommonPlayActorExpressionRuntime.test.ts tests/domain/commonPlayD20Runtime.test.ts tests/ui/c9FamilyJPortableControlProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified slice and retire workflows
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-j-actor-expressions-71304.yml .github/workflows/c9-family-j-actor-expressions-71304-r2.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/c9CommonPlayActorExpressionRuntime.test.ts
          git commit -m "feat(c9): evaluate actor-owned Common Play expressions"
          for attempt in $(seq 1 10); do
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 1
          done
          exit 1
