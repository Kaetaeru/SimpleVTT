name: C9 Family E Rich Predicate Fixture Fix 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-rich-predicate-fixture-fix-7130.yml

permissions:
  contents: write

jobs:
  align-and-retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Align unsupported targeting fixture with rich predicate support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_path=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=test_path.read_text(encoding='utf-8')
          old='{from:"targets",where:{value:true},min:1,max:1},'
          new='{from:"targets",where:{op:"unsupported-predicate",ref:"relation"},min:1,max:1},'
          if text.count(old)!=1:
              raise SystemExit(f'expected one stale targeting fixture, found {text.count(old)}')
          test_path.write_text(text.replace(old,new,1),encoding='utf-8')

          verifier=Path('.github/workflows/c9-family-e-rich-predicate-bridge-7130.yml')
          verifier_text=verifier.read_text(encoding='utf-8')
          marker='# Retry after aligning legacy targeting assertions with the shared selector contract.\n'
          if marker not in verifier_text:
              raise SystemExit('rich predicate verifier marker missing')
          verifier.write_text(verifier_text.replace(marker,marker+'# Unsupported-package fixture aligned to an explicitly unknown predicate op.\n',1),encoding='utf-8')
          PY
      - name: Commit fixture alignment and retrigger verified bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/ruleModulePackageImport.test.ts .github/workflows/c9-family-e-rich-predicate-bridge-7130.yml
          git commit -m "test(c9): align rich predicate invalid fixture"
          git rm .github/workflows/c9-family-e-rich-predicate-fixture-fix-7130.yml
          git commit -m "chore(c9): remove consumed predicate fixture fixer"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
