name: UI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/ui/**"
      - "content/**"
      - "scripts/**"
      - ".agents/UI_NAMED_RULE_BASELINE.json"
      - "docs/design/movement-modules.md"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/ui.yml"
  push:
    branches:
      - "agent/**"
      - "work/v1-composite"
    paths:
      - "src/**"
      - "tests/ui/**"
      - "content/**"
      - "scripts/**"
      - ".agents/UI_NAMED_RULE_BASELINE.json"
      - "docs/design/movement-modules.md"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/ui.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify UI named-rule boundary
        run: npm run test:ui-rule-boundary
      - name: Verify Campaign lifecycle and declarative providers
        run: npx tsx --test tests/ui/campaignPersistence.test.ts tests/ui/campaignRuntimeAdapter.test.ts tests/ui/campaignProductUiStructure.test.ts tests/ui/campaignStartupRecoveryStructure.test.ts tests/ui/campaignLifecycleRuntime.test.ts tests/ui/campaignLifecycleUiStructure.test.ts tests/ui/campaignDeclarativeProviderProfile.test.ts tests/ui/campaignDeclarativeProviderImport.test.ts tests/ui/campaignDeclarativeProviderRuntime.test.ts tests/ui/campaignDeclarativeProviderUiStructure.test.ts
      - name: Verify v1 shell, connected topology, continuity, and Session layer contracts
        run: npx tsx --test tests/ui/firstRunTutorialPreferences.test.ts tests/ui/firstRunTutorialStructure.test.ts tests/ui/v1ProductShellStructure.test.ts tests/ui/connectedProductShellContinuity.test.ts tests/ui/connectedPlayAcceptedTopology.test.ts tests/ui/sessionFullSheetWorkspaceStructure.test.ts tests/ui/sessionUtilityPanesStructure.test.ts tests/ui/sessionFreeformMainFocusStructure.test.ts tests/ui/sessionActionDockStructure.test.ts tests/ui/sessionDmToolsStructure.test.ts tests/ui/sessionPlayerReconnectStructure.test.ts tests/ui/sessionInitiativeExpansionStructure.test.ts tests/ui/sessionHandoutIntegrationStructure.test.ts tests/ui/sessionResponsiveKeyboardFocusStructure.test.ts
      - name: Verify Phase 14 PlaySessionDock hydration and tab context
        run: npx tsx --test tests/ui/playSessionDockStructure.test.ts
      - name: Verify V0.9 production play workspace accessibility and structure
        run: npx tsx --test tests/ui/productionPlayWorkspaceAccessibility.test.ts tests/ui/v09ProductionPlayStructure.test.ts
      - name: Verify V0.9 combat VFX projection and presentation boundaries
        run: npx tsx --test tests/ui/combatVfxProjection.test.ts tests/ui/combatVfxStructure.test.ts
      - name: Verify Phase 14 unified production session UX
        run: npx tsx --test tests/ui/productionSessionWorkspaceRedesign.test.ts
      - name: Verify Phase 14 tabletop sheet, physics dice, historical scene UI, and human-acceptance regressions
        run: npx tsx --test tests/ui/physicsDice3DStructure.test.ts tests/ui/characterSheetPlayableUx.test.ts tests/ui/productionPlayIntentUx.test.ts tests/ui/portraitAndHandoutPresentation.test.ts tests/ui/productionAcceptanceWindowsRegression.test.ts
      - name: Verify Phase 14 non-Character production UX redesign
        run: npx tsx --test tests/ui/productionNonCharacterUxRedesign.test.ts
      - name: Verify Phase 14 Host live metadata and active content
        run: npx tsx --test tests/ui/productionSessionPreparationMetadata.test.ts
      - name: Verify Phase 14 live DM mechanics continuity
        run: npx tsx --test tests/ui/productionDmLiveMechanicsContinuity.test.ts
      - name: Verify Phase 14 live lifecycle, late join, connection safety, DM flows, local projection ownership, fresh Character skills/actions, inventory durability, spellcasting, and turn-event transport
        run: npx tsx --test tests/ui/connectedSessionRuntimeAdapter.test.ts tests/ui/connectedTurnResolutionEventTransport.test.ts tests/ui/connectedSpatialZoneMembershipProduction.test.ts tests/ui/connectedDamageDealtTriggerProduction.test.ts tests/ui/connectedOnceFrequencyProduction.test.ts tests/ui/connectedActorTurnRuleProduction.test.ts tests/ui/connectedActorArtifactReconnectProduction.test.ts tests/ui/productionSessionLifecycleAdapter.test.ts tests/ui/productionParticipantLifecycle.test.ts tests/ui/productionReadyStartSafety.test.ts tests/ui/productionDmPreparedCombatantFlow.test.ts tests/ui/productionDmLiveAdjudicationFlow.test.ts tests/ui/productionDmLiveCombatantAction.test.ts tests/ui/productionLocalCharacterSwitch.test.ts tests/ui/characterLibraryProductionPlayIntegration.test.ts tests/ui/productionFreshCharacterSkills.test.ts tests/ui/productionFreshCharacterInventory.test.ts tests/ui/productionFreshCharacterSpells.test.ts
      - name: Verify creation ChoiceDefinition convergence
        run: npx tsx --test tests/ui/characterCreationChoiceDefinition.test.ts tests/ui/characterCreationChoiceDefinitionStructure.test.ts
      - name: Verify progression choice schedule regression
        run: npx tsx --test tests/ui/progressionChoiceScheduleRegression.test.ts
      - name: Verify Bardic Inspiration runtime
        run: npx tsx --test tests/ui/bardicInspirationRuntimeAdapter.test.ts
      - name: Verify College of Lore progression runtime
        run: npx tsx --test tests/ui/progressionPhase08BardLoreRuntime.test.ts
      - name: Verify Draconic level 3 preview
        run: npx tsx --test --test-name-pattern="runtime preview includes" tests/ui/progressionPhase08SorcererDraconicRuntime.test.ts
      - name: Verify Draconic level 3 identity and HP
        run: npx tsx --test --test-name-pattern="runtime commits Draconic identity" tests/ui/progressionPhase08SorcererDraconicRuntime.test.ts
      - name: Verify Draconic level 3 spells
        run: npx tsx --test --test-name-pattern="runtime commits four" tests/ui/progressionPhase08SorcererDraconicRuntime.test.ts
      - name: Verify Draconic Sorcery level 6 runtime
        run: npx tsx --test --test-name-pattern="Sorcerer 5 to 6" tests/ui/progressionPhase08SorcererDraconicRuntime.test.ts
      - name: Verify School of Evocation progression runtime
        run: npx tsx --test tests/ui/progressionPhase08WizardEvocationRuntime.test.ts
      - name: Verify authoritative spellcasting runtime
        shell: bash
        run: |
          set +e
          npx tsx --test tests/ui/phase09AuthoritativeSpellcastingAdapter.test.ts > authoritative-spell.log 2>&1
          status=$?
          cat authoritative-spell.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 50 authoritative-spell.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Authoritative spellcasting regression::$message"
            exit "$status"
          fi
      - name: Verify Phase 09 real mechanics services
        run: >-
          npx tsx --test
          tests/ui/phase09RealResolutionService.test.ts
          tests/ui/phase09RealActionCostService.test.ts
          tests/ui/phase09RealActionCostAdapter.test.ts
          tests/ui/phase09RealHealingAdapter.test.ts
          tests/ui/phase09RealSavingThrowAdapter.test.ts
          tests/ui/phase09RealAttackTransactionService.test.ts
          tests/ui/phase09RealAtomicAttackAdapter.test.ts
          tests/ui/phase09AuthoritativeRuntimeAttackAdapter.test.ts
          tests/ui/phase09ConcentrationSaveWorkflow.test.ts
          tests/ui/phase09CombatantRuntimeActions.test.ts
          tests/ui/phase09RealLifeRuntime.test.ts
          tests/ui/phase09ManualMovementReactionAdapter.test.ts
          tests/ui/phase09RealHealingRollService.test.ts
          tests/ui/phase09RealItemCostService.test.ts
          tests/ui/phase09RealItemCostAdapter.test.ts
          tests/ui/phase09RealNoRollDamageAdapter.test.ts
          tests/ui/phase09RealTurnRuntimeService.test.ts
          tests/ui/phase09RealTurnRuntimeAdapter.test.ts
          tests/ui/phase09EffectConcentrationUndo.test.ts
          tests/ui/phase09RuntimeEffectApplication.test.ts
          tests/ui/concentrationSaveStructure.test.ts
          tests/ui/visualDiceProjection.test.ts
          tests/ui/visualDiceStructure.test.ts
          tests/ui/movementReactionStructure.test.ts
      - name: Typecheck and build
        shell: bash
        run: |
          set +e
          npm run build > frontend-build.log 2>&1
          status=$?
          cat frontend-build.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 80 frontend-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=TypeScript and production build::$message"
            exit "$status"
          fi
