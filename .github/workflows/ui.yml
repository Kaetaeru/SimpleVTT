name: UI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/ui/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/ui.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "src/**"
      - "tests/ui/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/ui.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Bardic Inspiration runtime
        run: npx tsx --test tests/ui/bardicInspirationRuntimeAdapter.test.ts
      - name: Verify College of Lore progression runtime
        run: npx tsx --test tests/ui/progressionPhase08BardLoreRuntime.test.ts
      - name: Verify Draconic Sorcery level 3 runtime
        run: npx tsx --test --test-name-pattern="Sorcerer 2 to 3" tests/ui/progressionPhase08SorcererDraconicRuntime.test.ts
      - name: Verify Draconic Sorcery level 6 runtime
        run: npx tsx --test --test-name-pattern="Sorcerer 5 to 6" tests/ui/progressionPhase08SorcererDraconicRuntime.test.ts
      - name: Verify School of Evocation progression runtime
        run: npx tsx --test tests/ui/progressionPhase08WizardEvocationRuntime.test.ts
      - name: Typecheck and build
        run: npm run build
