name: C9 Family J Attack Rider Ledger 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-attack-rider-ledger-71304.yml]

permissions:
  contents: write

concurrency:
  group: c9-family-j-attack-rider-ledger-71304
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record verified evidence on latest branch
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-attack-rider-ledger-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          additions={
            'implementationEvidence':'commonPlayOperationRuntime.ts resolves the generic attack.damage.flat Effect property on the actor and applies it exactly once to the first successful damage.apply component of an attack-roll entry point, so portable attack riders do not require Rage/content identity dispatch',
            'productionEvidence':'7219d0b3ad1bc21ed042d17a24f1b5ccce2a81da feat(c9): support portable attack damage riders; C9 Family J Attack Rider 71304 run 33317164478 passed unknown/renamed external attack rider production, adjacent Extra Attack/ammunition/control regressions, legacy execution boundary, V1 coverage checker, and tsc --noEmit',
            'identityInvarianceEvidence':'c9FamilyJAttackDamageRiderProduction71304.test.ts repeats persistent attack.damage.flat rider application and event-native Undo after complete external module/content/mechanic identity rename',
          }
          for field,value in additions.items():
              if value not in row[field]: row[field].append(value)
          sentence=' Portable persistent attack-damage riders now compose through the generic attack.damage.flat property modifier and Common Play attack lowering, applying once per successful attack transaction with Undo and complete external identity rename.'
          if sentence.strip() not in row['currentState']:
              row['currentState']=row['currentState'].rstrip()+sentence
          row['remainingNamedSeams']=[
              'other named attack/action projection remains migration debt; portable persistent attack-damage riders no longer require Rage-specific attack execution'
              if seam=='Rage attack rider and other named attack/action projection remain migration debt' else seam
              for seam in row['remainingNamedSeams']
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            git rm "$workflow"
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git commit -m "docs(c9): record portable attack rider evidence"
            if git push origin HEAD:"$branch"; then exit 0; fi
          done
          exit 1
