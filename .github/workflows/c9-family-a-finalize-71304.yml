name: C9 Family A Finalize 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-finalize-71304.yml

permissions:
  contents: write

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Family A runtime evidence
        run: |
          npx tsx --test \
            tests/ui/c9FamilyANonActiveProfileProperties.test.ts \
            tests/ui/installedCommonPlayPropertyModifierProduction.test.ts \
            tests/ui/installedCommonPlayPropertyModifierReconnect.test.ts
          npx tsc --noEmit
      - name: Reconcile Family A transaction ownership
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger = json.loads(path.read_text())
          rows = {row["family"]: row for row in ledger["rows"]}
          row = rows["A"]
          aa = rows["AA"]

          if row["disposition"] != "INCOMPLETE":
              raise SystemExit(f"Family A expected INCOMPLETE, got {row['disposition']}")
          if row["remainingNamedSeams"] != ["named progression/runtime stat materialization remains outside a generic property owner"]:
              raise SystemExit(f"Family A seam changed concurrently: {row['remainingNamedSeams']}")
          if aa["transactionDomain"] != "ProgressionDraft to Character revision":
              raise SystemExit(f"Family AA transaction owner changed concurrently: {aa['transactionDomain']}")
          if "progressionRuntimeAdapter identity branches" not in aa["remainingNamedSeams"]:
              raise SystemExit("Family AA no longer owns the progression identity seam")

          row["currentState"] = (
              "Generic property.modify lowers external modifiers to typed Effect state and the shared RulesProfile/effect resolver serves active Characters and non-active runtime actors from authoritative property inputs without content identity dispatch. Derived profile refs, source-bound modifiers, stack/replace/unique-by-source, RulesProfile-owned profile-policy, connected replay/reconnect/Undo, and offline restart persistence are proven. Progression-derived Character inputs remain authoritative source values owned by the separate ProgressionDraft -> Character revision transaction; named progression materialization debt is therefore tracked by Family AA rather than duplicated as a Family A execution seam."
          )
          row["disposition"] = "IMPLEMENTED"
          row["remainingNamedSeams"] = []
          row["implementationEvidence"].append(
              "common-play-resolver-architecture-charter.md section 4 keeps progression in its ProgressionDraft -> Character revision authority while RulesProfile evaluation consumes authoritative property inputs; Family AA owns remaining named progression materialization"
          )

          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n")
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-a-finalize-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): finalize Family A property coverage"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
