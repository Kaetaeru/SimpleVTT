name: C9 Family R Kernel Ledger Reconcile 71304 V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-r-kernel-ledger-reconcile-71304-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile verified Family R kernel evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger=json.loads(path.read_text(encoding="utf-8"))
          row=next(entry for entry in ledger["rows"] if entry["family"]=="R")
          evidence="commonPlaySimultaneousOrderingRuntime.ts generic pending/resolved ordering state with actor-controller|dm authority, revision/responder validation, exact candidate permutation, deterministic projection, and idempotent exact replay"
          test_evidence="commonPlaySimultaneousOrderingRuntime.test.ts covers automatic zero/one-candidate resolution, authority/stale rejection, invalid permutations, deterministic ordering, replay, and conflicting replay rejection"
          identity="commonPlaySimultaneousOrderingRuntime.test.ts repeats the same relative mechanical ordering under unrelated renamed external candidate identities"
          row["currentState"]="A generic typed simultaneous-ordering decision kernel validates eligible candidate sets, actor-controller/DM authority, stale revisions, exact permutations, deterministic ordered projection, and idempotent exact replay. Production timing-window collection, Host-connected decision transport/reconnect, and unknown RuleModule execution remain incomplete."
          row["disposition"]="INCOMPLETE"
          for value in (evidence,test_evidence):
              if value not in row["implementationEvidence"]:
                  row["implementationEvidence"].append(value)
          if identity not in row["identityInvarianceEvidence"]:
              row["identityInvarianceEvidence"].append(identity)
          row["remainingNamedSeams"]=["production Common Play timing-window collection and Host-connected decision transport/reconnect/replay are not yet wired to the ordering kernel"]
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            git add docs/rules/v1-mechanism-coverage-ledger.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): record Family R ordering kernel evidence"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
