name: C9 Family G Charter Reconciliation 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-g-charter-reconciliation-7130.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile Family G with normative spatial authority
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 5); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text())
          row=next(row for row in data["rows"] if row["family"]=="G" and row["id"]=="spatial-geometry")
          assert row["disposition"]=="INCOMPLETE"
          row["currentState"]=(
              "Family G uses authoritative provider/manual spatial facts rather than Core geometry fabrication, as required by the architecture charter. "
              "The standard fact registry covers distance, adjacency, reach, line-of-effect, Total Cover, area membership, legal destination, and placement; "
              "the typed selector contract carries line/cone/cube/sphere/cylinder/emanation shape, origin, dimensions, and range. "
              "Connected owner-authority spatial requests resume on reconnect, reject stale peers, and deduplicate retries. "
              "Family G remains incomplete only until standard size/space authority and durable adapter/process-restart persistence for in-flight spatial decisions are proven."
          )
          row["implementationEvidence"]=[
              "commonPlaySpatialFactRuntime.ts COMMON_PLAY_STANDARD_FACTS defines provider/manual authority for spatial.distance-feet, spatial.adjacent, spatial.within-reach, spatial.line-of-effect, spatial.total-cover, spatial.area-members, spatial.legal-destination, and spatial.placement with normalized answers",
              "commonPlaySelectorRuntime.ts typed CommonPlayInstantArea supports line/cone/cube/sphere/cylinder/emanation with self/point origin and provider-owned authoritative area membership",
              "connectedCommonPlayAuthorityFactRuntime.ts routes authoritative Common Play fact requests and answers through the connected session authority path",
              "common-play-resolver-architecture-charter.md section 6 requires spatial facts, target sets, and movement legality through provider or manual authority without Core geometry fabrication",
          ]
          row["remainingNamedSeams"]=[
              "standard provider/manual size/space fact authority remains absent",
              "durable adapter/process-restart persistence for in-flight spatial decisions remains absent; connected reconnect/retry routing is already covered",
          ]
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            git rm .github/workflows/c9-family-g-charter-reconciliation-7130.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): align spatial coverage with provider authority"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
          done
          exit 1
