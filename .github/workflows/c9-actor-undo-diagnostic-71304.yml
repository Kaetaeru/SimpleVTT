name: C9 Actor Undo Diagnostic 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-actor-undo-diagnostic-71304.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generate:content
      - name: Instrument connected Undo guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/connectedActionRoutingAdapter.ts')
          s=p.read_text()
          old='''  const originalEvents=resolutionId?state.publishedResolutionEvents.get(resolutionId):undefined;\n  const mounted=completed?projectedCharacterById(this,completed.actorId):undefined;'''
          new='''  const originalEvents=resolutionId?state.publishedResolutionEvents.get(resolutionId):undefined;\n  console.log("C9UNDO pre",JSON.stringify({mode:state.mode,resolutionId,stage:app.resolution?.stage,publishedIds:[...state.publishedResolutionIds],publishedEventKeys:[...state.publishedResolutionEvents.keys()],originalEvents:originalEvents?.length??0,ledgerCursor:state.ledger?.cursor??null}));\n  const mounted=completed?projectedCharacterById(this,completed.actorId):undefined;'''
          if old not in s: raise SystemExit('undo pre shape changed')
          s=s.replace(old,new,1)
          old2='''  const committedUndo=next.activity.find((entry)=>entry.undoOf===resolutionId);\n  if(!committedUndo)return next;'''
          new2='''  const committedUndo=next.activity.find((entry)=>entry.undoOf===resolutionId);\n  console.log("C9UNDO post",JSON.stringify({resolutionId,undoOf:next.activity.filter((entry)=>entry.undoOf).map((entry)=>entry.undoOf),committedUndo:Boolean(committedUndo),ledgerCursor:state.ledger?.cursor??null}));\n  if(!committedUndo)return next;'''
          if old2 not in s: raise SystemExit('undo post shape changed')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Run one failing Undo case
        run: node --import tsx --test --test-name-pattern="actor artifact reconstructs" tests/ui/connectedActorArtifactReconnectProduction.test.ts
      - name: Retire diagnostic
        if: always()
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-actor-undo-diagnostic-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            rm -f "$path"
            git add -A "$path"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ci(c9): retire actor undo diagnostic"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
