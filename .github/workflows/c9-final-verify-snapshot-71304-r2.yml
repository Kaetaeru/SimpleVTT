name: C9 Gate N Snapshot Verify 71304 R2

on:
  push:
    branches: [agent/c9-final-verify-71304-r2]
    paths: [.github/workflows/c9-final-verify-snapshot-71304-r2.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Gate N ledger and execution boundary
        run: |
          node scripts/check-v1-mechanism-coverage.mjs --gate-n
          node scripts/check-legacy-execution-boundary.mjs
      - name: Verify unknown external Common Play production paths
        run: >-
          npx tsx --test
          tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
          tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          tests/ui/installedCommonPlayPropertyModifierReconnect.test.ts
          tests/ui/phase09CommonPlayResourcePersistence.test.ts
          tests/ui/connectedActorTurnRuleProduction.test.ts
          tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts
          tests/ui/c9FamilyJPortableControlProduction.test.ts
          tests/ui/c9FamilyJExtraAttackProduction71304.test.ts
          tests/ui/c9FamilyJRangeCoverProduction.test.ts
      - run: npm run build
