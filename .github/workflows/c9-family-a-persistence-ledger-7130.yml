name: C9 Family A Persistence Ledger 7130
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-persistence-ledger-7130.yml]
permissions:
  contents: write
jobs:
  reconcile-family-a-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:builtin-catalog
      - name: Verify source-bound property replay reconnect and Undo
        run: npx tsx --test tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
      - name: Reconcile verified Family A persistence evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text())
          rows=[row for row in ledger['rows'] if row.get('family')=='A' and row.get('id')=='expression-property']
          if len(rows)!=1:
            raise SystemExit(f'expected one Family A expression-property row, got {len(rows)}')
          row=rows[0]
          row['currentState']=(
            'The persisted property.modify contract carries explicit target, Effect ownership, definition source, elapsed duration, destroy-on-end lifetime, and instance policy. '
            'commonPlayOperationRuntime generically lowers arbitrary external property.modify definitions to the existing apply-effect ResolutionOperation with a typed propertyModifier payload, Resolver commits that payload into EffectState, and installed Common Play projects active movement.walk property effects into the existing movement expression consumer without content-name or content-ID dispatch. '
            'Generic Effect application enforces stack, replace, and unique-by-source instance policies with reversible Effect StateChanges; profile-policy rejects explicitly until RulesProfile supplies a stacking policy. '
            'Connected replay, reconnect, and one-step Undo preserve/remove source-bound property modifiers through the production session event path. '
            'Family A remains incomplete because production property projection is not yet generic across the full property vocabulary.'
          )
          connected='installedCommonPlayPropertyModifierProduction.test.ts Host/Client event replay, reconnect from HostSessionLedger, and one-step Undo convergence for source-bound property modifiers'
          if connected not in row['connectedEvidenceIfRelevant']:
            row['connectedEvidenceIfRelevant'].append(connected)
          persistence='installedCommonPlayPropertyModifierProduction.test.ts reconnect replays the authoritative source-bound EffectInstance and Undo removes it without content identity dispatch'
          if persistence not in row['persistenceEvidenceIfRelevant']:
            row['persistenceEvidenceIfRelevant'].append(persistence)
          row['remainingNamedSeams']=[entry for entry in row['remainingNamedSeams'] if 'persistence/reconnect evidence is absent' not in entry]
          path.write_text(json.dumps(ledger,indent=2,ensure_ascii=False)+'\n')
      - name: Verify ledger reconciliation
        run: |
          node - <<'NODE'
          const l=require('./docs/rules/v1-mechanism-coverage-ledger.json');
          const r=l.rows.find(x=>x.family==='A'&&x.id==='expression-property');
          if(!r||r.disposition!=='INCOMPLETE') process.exit(1);
          if(!r.persistenceEvidenceIfRelevant.length) process.exit(1);
          if(r.remainingNamedSeams.some(x=>x.includes('persistence/reconnect evidence is absent'))) process.exit(1);
          NODE
      - name: Commit reconciled evidence and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-a-persistence-ledger-7130.yml
          git commit -m "docs(c9): record Family A reconnect evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
