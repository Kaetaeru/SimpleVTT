name: C9 Current Runtime Verification

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/rerun-c9-final-type-narrowing.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate canonical content
        run: npm run generate:content
      - name: Verify focused C9 production slices
        run: npx tsx --test tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts tests/ui/connectedTurnResolutionEventTransport.test.ts tests/ui/connectedDamageDealtTriggerProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify production bundle
        run: npx vite build
