name: C9 Family Q Choice R9 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r9-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified choice bridge and align acceptance fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow=subprocess.check_output([
              'git','show','ebba931a76a8f11ebfb13c09d5ba6febad3326ee:.github/workflows/c9-family-q-choice-r7-71304.yml'
          ],text=True)
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(code,'q-choice-r7-patch','exec'),{'__name__':'__main__'})

          path=Path('tests/ui/c9FamilyQChoiceInteractionProduction.test.ts')
          text=path.read_text(encoding='utf-8')
          old='''assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore);\n    assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false);'''
          new='''assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore+1);\n    assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false);'''
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'accepted healing assertion anchor changed: {text.count(old)}')
              text=text.replace(old,new,1)
          neutral='{delta:0,selectedCount:2}'
          healed='{delta:1,selectedCount:2}'
          neutral_count=text.count(neutral)
          if neutral_count:
              text=text.replace(neutral,healed)
          elif text.count(healed)<2:
              raise SystemExit(f'rename-invariance healing result anchor changed: neutral={neutral_count}, healed={text.count(healed)}')
          path.write_text(text,encoding='utf-8')

          # Keep the wire validator narrowed before reading choice fields.
          path=Path('src/app/connectedSessionWire.ts')
          text=path.read_text(encoding='utf-8')
          old='''  const choice=value.choice;\n  const validChoice=choice===undefined||(isRecord(choice)&&isCursor(choice.min)&&isCursor(choice.max)&&Number(choice.max)>=Number(choice.min)\n    &&Array.isArray(choice.options)&&choice.options.every((option)=>isRecord(option)&&isString(option.id)&&isString(option.name)));\n  return isRecord(value)&&isString(value.id)&&isString(value.responderId)&&isString(value.responderName)\n'''
          new='''  if(!isRecord(value)) return false;\n  const choice=value.choice;\n  const validChoice=choice===undefined||(isRecord(choice)&&isCursor(choice.min)&&isCursor(choice.max)&&Number(choice.max)>=Number(choice.min)\n    &&Array.isArray(choice.options)&&choice.options.every((option)=>isRecord(option)&&isString(option.id)&&isString(option.name)));\n  return isString(value.id)&&isString(value.responderId)&&isString(value.responderName)\n'''
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'connected choice validator anchor changed: {text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          # Match the domain interaction-response union instead of an ambiguous optional payload.
          path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=path.read_text(encoding='utf-8')
          loose='{interactionId:string;accepted?:true;selectedIds?:string[]}'
          strict='{interactionId:string;accepted:true}|{interactionId:string;selectedIds:string[]}'
          if loose in text:
              text=text.replace(loose,strict)
          elif strict not in text:
              raise SystemExit('interaction response type anchor changed')
          old='''  const choiceCandidates=interaction.kind==="choice"\n    ?commonPlayTargetCandidates(this,prepared.internal.scene,prepared.state,prepared.actorEntity,interaction.input.selector)\n    :undefined;\n  if(interaction.kind==="choice"&&choiceCandidates!.length<interaction.input.selector.min) {\n'''
          new='''  const choiceCandidates=interaction.kind==="choice"\n    ?commonPlayTargetCandidates(this,prepared.internal.scene,prepared.state,prepared.actorEntity,interaction.input.selector)\n    :undefined;\n  const choiceMin=interaction.kind==="choice"?(interaction.input.selector.min??0):0;\n  const choiceMax=interaction.kind==="choice"?(interaction.input.selector.max??choiceCandidates?.length??0):0;\n  if(interaction.kind==="choice"&&choiceCandidates!.length<choiceMin) {\n'''
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'choice bound anchor changed: {text.count(old)}')
              text=text.replace(old,new,1)
          old='min:interaction.input.selector.min,max:interaction.input.selector.max,'
          new='min:choiceMin,max:choiceMax,'
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'choice view bound anchor changed: {text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire Q choice staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts src/app/rogueCoreRuntimeAdapter.ts src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts src/app/phase09RealTurnRuntimeAdapter.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-r5-71304.yml .github/workflows/c9-family-q-choice-r6-diagnostic-71304.yml .github/workflows/c9-family-q-choice-r7-71304.yml .github/workflows/c9-family-q-choice-r8-71304.yml .github/workflows/c9-family-q-choice-r9-71304.yml .github/workflows/c9-family-q-choice-diagnostic-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
