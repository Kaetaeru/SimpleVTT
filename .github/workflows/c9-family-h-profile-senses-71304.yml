name: C9 Family H Profile Senses 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-profile-senses-71304.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add profile-derived sense probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts')
          text=path.read_text(encoding='utf-8')
          old='import { commitAdapterTurnRuntimeState, snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";\n'
          new=old+'import { commonPlayActorProfileProperties } from "../../src/app/installedCommonPlayRuntimeAdapter";\n'
          if 'commonPlayActorProfileProperties' not in text:
              if old not in text: raise SystemExit('profile probe import anchor not found')
              text=text.replace(old,new,1)
          test_name='portable production derives special sight from rules-profile properties'
          if test_name not in text:
              text += '''\n\ntest("portable production derives special sight from rules-profile properties",async()=>{\n  const renamed:Identity={...ORIGINAL,moduleId:"external.profile-sight-renamed",contentId:"item.profile-sight-renamed",mechanicId:"mechanic.profile-sight-renamed",interceptorId:"interceptor.profile-sight-renamed",interactionId:"interaction.profile-sight-renamed",displayName:"Renamed Profile Sight"};\n  const scenarios=[\n    {label:"darkvision",property:"sense.darkvision.range-feet",rangeFeet:60,light:"darkness" as const,obscurement:"none" as const,targetInvisible:false},\n    {label:"blindsight",property:"sense.blindsight.range-feet",rangeFeet:60,light:"dim" as const,obscurement:"heavy" as const,targetInvisible:true},\n    {label:"tremorsense",property:"sense.tremorsense.range-feet",rangeFeet:60,light:"dim" as const,obscurement:"heavy" as const,targetInvisible:true,sharedGroundContact:true},\n    {label:"truesight",property:"sense.truesight.range-feet",rangeFeet:120,light:"darkness" as const,obscurement:"none" as const,targetInvisible:true},\n  ];\n  for(const identity of [ORIGINAL,renamed]){\n    for(const scenario of scenarios){\n      const adapter=await prepare(identity,true,"d20",[{kind:"roll.modify",mode:"subtract-die",dice:"1d8"}],undefined,{light:scenario.light,obscurement:scenario.obscurement});\n      const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n      const runtime=snapshotAdapterTurnRuntimeState(adapter,internal.scene);\n      assert.ok(runtime,`${scenario.label}: missing TurnRuntime state`);\n      const expectedRevision=runtime!.revision;\n      const combatant=runtime!.combatants[internal.activeCharacter.id];\n      assert.ok(combatant,`${scenario.label}: missing source combatant`);\n      combatant!.baseProperties={...(combatant!.baseProperties??{}),[scenario.property]:scenario.rangeFeet};\n      runtime!.revision=expectedRevision+1;\n      assert.equal(commitAdapterTurnRuntimeState(adapter,internal.scene,expectedRevision,runtime!),true,`${scenario.label}: profile property commit failed`);\n      const projectedRuntime=snapshotAdapterTurnRuntimeState(adapter,internal.scene);\n      assert.equal(commonPlayActorProfileProperties(internal,projectedRuntime!,internal.activeCharacter.id)?.[scenario.property],scenario.rangeFeet,`${scenario.label}: Common Play profile projection lost range`);\n      setSpatialRelation(internal.scene,{\n        sourceId:internal.activeCharacter.id,targetId:OTHER_CHARACTER_ID,distanceFeet:30,visible:true,cover:"none",targetCanSeeAttacker:true,\n        light:scenario.light,obscurement:scenario.obscurement,detected:true,targetInvisible:scenario.targetInvisible,\n        sharedGroundContact:scenario.sharedGroundContact,provenance:`profile:test-special-sight:${scenario.label}`,\n      });\n      seedHiddenRuntimeEffect(adapter,OTHER_CHARACTER_ID);\n      let snapshot=await openAbilityCheckInterrupt(adapter);\n      assert.equal(snapshot.resolution?.stage,"interrupt",`${scenario.label}: ${JSON.stringify(snapshot.resolution)}`);\n      snapshot=await adapter.respondToInterrupt(false);\n      assert.equal(snapshot.resolution?.stage,"complete",`${scenario.label}: ${JSON.stringify(snapshot.resolution)}`);\n    }\n  }\n});\n'''
          path.write_text(text,encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family H sensing and discovery
        run: |
          node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts tests/ui/c9FamilyHSearchDiscovery.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
