name: C9 Family H Profile Senses 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-profile-senses-71304.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add profile-derived sense probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts')
          text=path.read_text(encoding='utf-8')
          old='eligibilityExpectations:{light?:"bright"|"dim"|"darkness";obscurement?:"none"|"light"|"heavy"}={},'
          new='eligibilityExpectations:{light?:"bright"|"dim"|"darkness";obscurement?:"none"|"light"|"heavy";canSee?:boolean}={},'
          if old in text:
              text=text.replace(old,new)
          elif text.count(new)!=2:
              raise SystemExit('eligibility expectation signature anchor not found')
          old_condition='{op:"eq",left:{ref:"source-sees-trigger"},right:{value:true}},'
          new_condition='{op:"eq",left:{ref:"source-sees-trigger"},right:{value:eligibilityExpectations.canSee??true}},'
          if old_condition in text:
              text=text.replace(old_condition,new_condition,1)
          elif new_condition not in text:
              raise SystemExit('sense.can-see predicate anchor not found')
          test_name='portable production derives special senses from rules-profile properties under external identity rename'
          if test_name not in text:
              text += '''\n\ntest("portable production derives special senses from rules-profile properties under external identity rename",async()=>{\n  const renamed:Identity={...ORIGINAL,moduleId:"external.profile-sight-renamed",contentId:"item.profile-sight-renamed",mechanicId:"mechanic.profile-sight-renamed",interceptorId:"interceptor.profile-sight-renamed",interactionId:"interaction.profile-sight-renamed",displayName:"Renamed Profile Sight"};\n  const scenarios=[\n    {label:"darkvision",property:"sense.darkvision.range-feet",rangeFeet:60,light:"darkness" as const,obscurement:"none" as const,targetInvisible:false,canSee:true,detected:true,visible:true},\n    {label:"blindsight",property:"sense.blindsight.range-feet",rangeFeet:60,light:"dim" as const,obscurement:"heavy" as const,targetInvisible:true,canSee:true,detected:true,visible:true},\n    {label:"tremorsense",property:"sense.tremorsense.range-feet",rangeFeet:60,light:"dim" as const,obscurement:"none" as const,targetInvisible:true,canSee:false,visible:false,sharedGroundContact:true},\n    {label:"truesight",property:"sense.truesight.range-feet",rangeFeet:120,light:"darkness" as const,obscurement:"none" as const,targetInvisible:true,canSee:true,detected:true,visible:true},\n  ];\n  for(const identity of [ORIGINAL,renamed]){\n    for(const scenario of scenarios){\n      const adapter=await prepare(identity,true,"d20",[{kind:"roll.modify",mode:"subtract-die",dice:"1d8"}],undefined,{light:scenario.light,obscurement:scenario.obscurement,canSee:scenario.canSee});\n      const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n      const runtime=snapshotAdapterTurnRuntimeState(adapter,internal.scene);\n      assert.ok(runtime,`${scenario.label}: missing TurnRuntime state`);\n      const expectedRevision=runtime!.revision;\n      const combatant=runtime!.combatants[internal.activeCharacter.id];\n      assert.ok(combatant,`${scenario.label}: missing source combatant`);\n      combatant!.baseProperties={...(combatant!.baseProperties??{}),[scenario.property]:scenario.rangeFeet};\n      runtime!.revision=expectedRevision+1;\n      assert.equal(commitAdapterTurnRuntimeState(adapter,internal.scene,expectedRevision,runtime!),true,`${scenario.label}: profile property commit failed`);\n      setSpatialRelation(internal.scene,{\n        sourceId:internal.activeCharacter.id,targetId:OTHER_CHARACTER_ID,distanceFeet:30,visible:scenario.visible,cover:"none",targetCanSeeAttacker:true,\n        light:scenario.light,obscurement:scenario.obscurement,targetInvisible:scenario.targetInvisible,\n        ...(scenario.detected===undefined?{}:{detected:scenario.detected}),sharedGroundContact:scenario.sharedGroundContact??false,\n        provenance:`profile:test-special-sight:${scenario.label}`,\n      });\n      seedHiddenRuntimeEffect(adapter,OTHER_CHARACTER_ID);\n      let snapshot=await openAbilityCheckInterrupt(adapter);\n      assert.equal(snapshot.resolution?.stage,"interrupt",`${scenario.label}: ${JSON.stringify(snapshot.resolution)}`);\n      snapshot=await adapter.respondToInterrupt(false);\n      assert.equal(snapshot.resolution?.stage,"complete",`${scenario.label}: ${JSON.stringify(snapshot.resolution)}`);\n    }\n  }\n});\n'''
          path.write_text(text,encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family H sensing and discovery
        run: |
          node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts tests/ui/c9FamilyHSearchDiscovery.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
