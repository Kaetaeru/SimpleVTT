name: Dispatch C9 Family P Semantic Outcomes

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-dispatch-family-p.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Family P workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run c9-family-p-semantic-outcomes.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
