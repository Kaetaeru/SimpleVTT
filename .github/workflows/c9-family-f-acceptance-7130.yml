name: C9 Family F Allocation Acceptance 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-f-acceptance-7130.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile latest branch
        shell: bash
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Record Family F acceptance evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in ledger['rows'] if row['family']=='F')
          row['currentState']='Generic fixed-pool allocation is parsed from portable Common Play, validates authored repeated-target integer distribution against candidate targets, bounds, total, and revision before downstream execution, and executes through production Resolver authority with atomic rejection, connected replay/reconnect, persistence, and Undo without content-name or content-ID dispatch.'
          row['disposition']='IMPLEMENTED'
          row['implementationEvidence']=[
            'commonPlayAllocationRuntime.ts generic fixed-pool integer allocation kernel with revision, duplicate-target, candidate, per-target bound, and total validation',
            'commonPlayOperationRuntime.ts portable allocation parsing on Common Play entry points',
            'installedCommonPlayRuntimeAdapter.ts pre-execution resolveCommonPlayAllocation bridge before downstream Resolver commit',
          ]
          row['productionEvidence']=[
            'installedCommonPlayAllocationProductionRuntime.test.ts unknown installed allocation rejects invalid partial distribution atomically and commits valid repeated-target distribution with Undo',
            'c9FamilyFAllocationAcceptance.test.ts restart/rename/connected acceptance',
            'C9 Family F Allocation Acceptance 7130 run 33309986843: allocation slice, legacy execution boundary, coverage ledger structure, and tsc --noEmit passed',
          ]
          row['identityInvarianceEvidence']=[
            'commonPlayAllocationRuntime.test.ts allocation behavior remains invariant under allocation identity changes',
            'c9FamilyFAllocationAcceptance.test.ts completely renamed external module/content/mechanic/entry/display identity preserves allocation mechanics',
          ]
          row['connectedEvidenceIfRelevant']=[
            'c9FamilyFAllocationAcceptance.test.ts Host event batch converges downstream state exactly once, duplicate replay is idempotent, fresh Client reconnect reconstructs state, and connected Undo reverses it',
          ]
          row['persistenceEvidenceIfRelevant']=[
            'c9FamilyFAllocationAcceptance.test.ts installed allocation content rehydrates from persisted installed-content storage on a fresh adapter before execution and reconnect',
          ]
          row['remainingNamedSeams']=[]
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify Family F allocation slice
        run: >-
          npx tsx --test
          tests/domain/commonPlayAllocationRuntime.test.ts
          tests/ui/installedCommonPlayAllocationProductionRuntime.test.ts
          tests/ui/c9FamilyFAllocationAcceptance.test.ts
      - name: Verify boundaries and ledger
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Commit Family F evidence and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-f-acceptance-7130.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): accept portable allocation family"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          npx tsx --test tests/domain/commonPlayAllocationRuntime.test.ts tests/ui/installedCommonPlayAllocationProductionRuntime.test.ts tests/ui/c9FamilyFAllocationAcceptance.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
