name: C9 Family J Spatial Attack 71304
# verify current Family J spatial/range/cover plus opportunity identity proof at branch head

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-spatial-attack-71304.yml
      - tests/ui/c9FamilyJSpatialAttackProduction.test.ts
      - tests/ui/c9FamilyJRangeCoverProduction.test.ts
      - tests/ui/c9FamilyJOpportunityAttackProduction.test.ts
      - src/app/installedCommonPlayRuntimeAdapter.ts
      - src/domain/commonPlaySelectorRuntime.ts
      - src/app/spatialRuntimeContracts.ts

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family J spatial attack slice
        run: |
          node --import tsx --test \
            tests/ui/c9FamilyJSpatialAttackProduction.test.ts \
            tests/ui/c9FamilyJRangeCoverProduction.test.ts \
            tests/ui/c9FamilyJOpportunityAttackProduction.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJAttackPersistence.test.ts \
            tests/ui/c9FamilyESpatialSelectorProduction.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: npx tsc --noEmit
