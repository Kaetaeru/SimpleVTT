name: C9 Recharge Production Slice

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-recharge-production.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch portable Recharge through existing turn lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          schema = "schemas/common-play-contract.schema.json"
          replace_once(schema,
              '        { "$ref": "#/$defs/resourceChange" },\n        { "$ref": "#/$defs/effectApply" },',
              '        { "$ref": "#/$defs/resourceChange" },\n        { "$ref": "#/$defs/resourceRecharge" },\n        { "$ref": "#/$defs/effectApply" },')
          replace_once(schema,
              '''    "effectApply": {''',
              '''    "resourceRecharge": {\n      "type": "object",\n      "required": ["kind", "resource", "die", "succeedsOn"],\n      "properties": {\n        "kind": { "const": "resource.recharge" },\n        "resource": { "type": "string", "minLength": 1 },\n        "die": {\n          "type": "object",\n          "required": ["sides"],\n          "properties": { "sides": { "type": "integer", "minimum": 2, "maximum": 20 } },\n          "additionalProperties": false\n        },\n        "succeedsOn": {\n          "type": "object",\n          "required": ["minimum"],\n          "properties": {\n            "minimum": { "type": "integer", "minimum": 1 },\n            "maximum": { "type": "integer", "minimum": 1 }\n          },\n          "additionalProperties": false\n        }\n      },\n      "additionalProperties": false\n    },\n    "effectApply": {''')

          runtime = "src/domain/commonPlayOperationRuntime.ts"
          replace_once(runtime,
              '''type CommonPlayEconomyModify={''',
              '''type CommonPlayRechargeResource={\n  kind:"resource.recharge";\n  resource:string;\n  die:{sides:number};\n  succeedsOn:{minimum:number;maximum?:number};\n};\n\ntype CommonPlayEconomyModify={''')
          replace_once(runtime,
              '''  |CommonPlayResourceChange\n  |CommonPlayEconomyModify''',
              '''  |CommonPlayResourceChange\n  |CommonPlayRechargeResource\n  |CommonPlayEconomyModify''')
          replace_once(runtime,
              '''  damageDiceFaces?:Record<number,number[]>;\n  movementFactAnswers?:Record<number,CommonPlayFactAnswer>;''',
              '''  damageDiceFaces?:Record<number,number[]>;\n  rechargeDiceFaces?:Record<number,number[]>;\n  movementFactAnswers?:Record<number,CommonPlayFactAnswer>;''')
          replace_once(runtime,
              '''const RESOURCE_CHANGE_KEYS=new Set(["kind","resource","amount","target"]);\nconst ECONOMY_MODIFY_KEYS''',
              '''const RESOURCE_CHANGE_KEYS=new Set(["kind","resource","amount","target"]);\nconst RESOURCE_RECHARGE_KEYS=new Set(["kind","resource","die","succeedsOn"]);\nconst RECHARGE_DIE_KEYS=new Set(["sides"]);\nconst RECHARGE_RANGE_KEYS=new Set(["minimum","maximum"]);\nconst ECONOMY_MODIFY_KEYS''')
          replace_once(runtime,
              '''  if(operation.kind==="damage.apply") {''',
              '''  if(operation.kind==="resource.recharge") {\n    supportedKeys(operation,RESOURCE_RECHARGE_KEYS,label);\n    const resource=nonEmptyString(operation.resource,`${label}.resource`);\n    const die=object(operation.die,`${label}.die`);\n    supportedKeys(die,RECHARGE_DIE_KEYS,`${label}.die`);\n    if(!Number.isInteger(die.sides)||Number(die.sides)<2||Number(die.sides)>20) throw new DomainEvaluationError(`${label}.die.sides must be an integer between 2 and 20`);\n    const succeedsOn=object(operation.succeedsOn,`${label}.succeedsOn`);\n    supportedKeys(succeedsOn,RECHARGE_RANGE_KEYS,`${label}.succeedsOn`);\n    if(!Number.isInteger(succeedsOn.minimum)) throw new DomainEvaluationError(`${label}.succeedsOn.minimum must be an integer`);\n    if(succeedsOn.maximum!==undefined&&!Number.isInteger(succeedsOn.maximum)) throw new DomainEvaluationError(`${label}.succeedsOn.maximum must be an integer`);\n    const minimum=Number(succeedsOn.minimum);\n    const maximum=succeedsOn.maximum===undefined?undefined:Number(succeedsOn.maximum);\n    const upper=maximum??Number(die.sides);\n    if(minimum<1||upper>Number(die.sides)||minimum>upper) throw new DomainEvaluationError(`${label}.succeedsOn must fit within the recharge die`);\n    return {kind:"resource.recharge",resource,die:{sides:Number(die.sides)},succeedsOn:{minimum,...(maximum===undefined?{}:{maximum})}};\n  }\n  if(operation.kind==="damage.apply") {''')
          replace_once(runtime,
              '''    if(operation.kind==="resource.change") {''',
              '''    if(operation.kind==="resource.recharge") {\n      const faces=input.rechargeDiceFaces?.[index];\n      if(!faces||faces.length!==1) throw new DomainEvaluationError(`Common Play recharge operation ${index} requires exactly one authoritative die face`);\n      operations.push({\n        id:operationId,kind:"recharge-resource",actorId:input.actorId,resourceId:operation.resource,timing:"turn-start",\n        die:{sides:operation.die.sides,faces:[faces[0]]},succeedsOn:{...operation.succeedsOn},\n      });\n      continue;\n    }\n    if(operation.kind==="resource.change") {''')

          composition = "src/app/commonPlayActorTurnRuleComposition.ts"
          replace_once(composition,
              '''    if(record.kind!=="resource.change") {\n      throw new DomainEvaluationError(`Common Play actor turn rule ${value.id} currently supports resource.change only`);\n    }''',
              '''    if(record.kind!=="resource.change"&&record.kind!=="resource.recharge") {\n      throw new DomainEvaluationError(`Common Play actor turn rule ${value.id} currently supports resource.change or resource.recharge only`);\n    }''')
          replace_once(composition,
              '''  input:{id:string;kind:TurnBoundaryKind;actorId:string},\n):ResolutionOperation[] {''',
              '''  input:{\n    id:string;kind:TurnBoundaryKind;actorId:string;\n    rechargeDieFace?:(ruleId:string,operationIndex:number,sides:number)=>number;\n  },\n):ResolutionOperation[] {''')
          replace_once(composition,
              '''      const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,definition,{\n        resolutionId,actorId:input.actorId,entryPointId,\n      });''',
              '''      const rechargeDiceFaces=Object.fromEntries(rule.operations.flatMap((operation,index)=>{\n        if(operation.kind!=="resource.recharge") return [];\n        const die=operation.die as {sides?:unknown}|undefined;\n        if(!die||!Number.isInteger(die.sides)||Number(die.sides)<2||Number(die.sides)>20) {\n          throw new DomainEvaluationError(`Common Play actor turn rule ${rule.id} has an invalid recharge die`);\n        }\n        if(!input.rechargeDieFace) throw new DomainEvaluationError(`Common Play actor turn rule ${rule.id} requires authoritative recharge die input`);\n        return [[index,[input.rechargeDieFace(rule.id,index,Number(die.sides))]]];\n      }));\n      const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,definition,{\n        resolutionId,actorId:input.actorId,entryPointId,\n        ...(Object.keys(rechargeDiceFaces).length?{rechargeDiceFaces}:{}),\n      });''')

          turn_adapter = "src/app/phase09EffectAwareTurnAdapter.ts"
          replace_once(turn_adapter,
              '''  getSnapshot():Promise<AppSnapshot>;\n}''',
              '''  getSnapshot():Promise<AppSnapshot>;\n  d20(actionId:string,index?:number):number;\n}''')
          replace_once(turn_adapter,
              '''function eventId() {\n  return `phase09.turn-lifecycle.${Date.now()}.${Math.floor(Math.random()*1000)}`;\n}''',
              '''function eventId() {\n  return `phase09.turn-lifecycle.${Date.now()}.${Math.floor(Math.random()*1000)}`;\n}\n\nfunction authoritativeRechargeFace(adapter:MockAdapter,actionId:string,sides:number,drawIndex:{value:number}) {\n  const internal=adapter as unknown as EffectAwareTurnAdapterState;\n  const limit=20-(20%sides);\n  let face:number;\n  do face=internal.d20(actionId,drawIndex.value++); while(face>limit);\n  return ((face-1)%sides)+1;\n}''')
          replace_once(turn_adapter,
              '''  const actorTurnRules=await installedCommonPlayActorTurnRuleBindings(this,session.state);\n  const advanced=advanceTurnRuntimeLifecycle(session,(boundary)=>[''',
              '''  const actorTurnRules=await installedCommonPlayActorTurnRuleBindings(this,session.state);\n  const rechargeDrawIndex={value:0};\n  const advanced=advanceTurnRuntimeLifecycle(session,(boundary)=>[''')
          replace_once(turn_adapter,
              '''    ...compileInstalledCommonPlayActorTurnRuleOperations(boundary.state,actorTurnRules,{\n      id:boundary.resolutionId,kind:boundary.kind,actorId:boundary.actorId,\n    }),''',
              '''    ...compileInstalledCommonPlayActorTurnRuleOperations(boundary.state,actorTurnRules,{\n      id:boundary.resolutionId,kind:boundary.kind,actorId:boundary.actorId,\n      rechargeDieFace:(_ruleId,_operationIndex,sides)=>authoritativeRechargeFace(this,`${boundary.resolutionId}:recharge`,sides,rechargeDrawIndex),\n    }),''')

          test_file = "tests/ui/connectedActorTurnRuleProduction.test.ts"
          replace_once(test_file,
              '''        {kind:"resource.change",resource:resourceId,amount:{value:1},target:"actor"},''',
              '''        {kind:"resource.recharge",resource:resourceId,die:{sides:6},succeedsOn:{minimum:1,maximum:6}},''')
          replace_once(test_file,
              '''test("actor-owned turn-start Common Play rule is invariant under every external identity rename"''',
              '''test("actor-owned turn-start Recharge Common Play rule is invariant under every external identity rename"''')
          replace_once(test_file,
              '''test("actor-owned turn-start rule converges, reconnects, deduplicates, and rolls back through turn event-native Undo"''',
              '''test("actor-owned turn-start Recharge rule converges, reconnects, deduplicates, and rolls back through turn event-native Undo"''')
          PY
      - run: npm run generate:content
      - name: Verify Recharge connected production
        run: npx tsx --test tests/ui/connectedActorTurnRuleProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Commit verified Recharge slice
        run: |
          rm .github/workflows/rerun-c9-recharge-production.yml
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add -A
          git commit -m "feat(c9): route portable recharge through turn lifecycle"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
