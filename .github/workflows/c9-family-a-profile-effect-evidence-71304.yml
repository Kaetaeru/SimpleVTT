name: C9 Family A Profile Effect Evidence 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-profile-effect-evidence-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-a-profile-effect-evidence-71304
  cancel-in-progress: false

jobs:
  verify-and-reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify latest Family A and reconcile evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
            npm run generate:content
            npx tsx --test tests/ui/runtimeProfilePropertyEffects.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
            npx tsc --noEmit
            node scripts/check-v1-mechanism-coverage.mjs
            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text())
          row=next(row for row in data['rows'] if row['family']=='A')
          if row['disposition']!='INCOMPLETE':
              raise SystemExit('Family A disposition changed; refusing stale reconciliation')

          implementation='effectProfilePropertyResolver.ts recursively composes RulesProfile formulas and active Effect property modifiers across generic property references with cycle detection and provenance'
          if implementation not in row['implementationEvidence']:
              row['implementationEvidence'].append(implementation)

          production='a398a343a3a1a2322b5ab66f9a28cafaf7219d7b feat(c9): compose runtime profile property effects; runtimeProfilePropertyEffects.test.ts proves a production Effect expression can reference another derived profile property without content identity dispatch'
          if production not in row['productionEvidence']:
              row['productionEvidence'].append(production)

          stale='resolveProfileProperty still has no production caller that composes active Effect-owned modifiers across generic property refs'
          row['remainingNamedSeams']=[entry for entry in row['remainingNamedSeams'] if entry!=stale]

          sentence='resolveRuntimeProfileProperty now delegates arbitrary requested profile properties to effectProfilePropertyResolver, which recursively composes active Effect modifiers and derived profile references with provenance.'
          if sentence not in row['currentState']:
              marker='Family A remains incomplete'
              if marker in row['currentState']:
                  row['currentState']=row['currentState'].replace(marker,sentence+' '+marker,1)
              else:
                  row['currentState']+=' '+sentence

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
            rm -f .github/workflows/c9-family-a-profile-effect-evidence-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-a-profile-effect-evidence-71304.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): record generic profile effect projection"
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
          done
          exit 1
