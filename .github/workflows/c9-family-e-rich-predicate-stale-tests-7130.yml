name: C9 Family E Rich Predicate Stale Tests 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-rich-predicate-stale-tests-7130.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile current selector assertion and retrigger bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test=Path('tests/domain/commonPlayTargetingRuntime.test.ts')
          text=test.read_text(encoding='utf-8')
          old='    [{from:"targets",area:{kind:"instant"},min:1,max:1},/shape is unsupported/],\n'
          new='    [{from:"targets",area:{kind:"instant"},min:1,max:1},/unsupported fields: area/],\n'
          if text.count(old)!=1:
              raise SystemExit(f'expected one stale area assertion, found {text.count(old)}')
          test.write_text(text.replace(old,new,1),encoding='utf-8')

          helper=Path('.github/workflows/c9-family-e-rich-predicate-bridge-7130.yml')
          helper_text=helper.read_text(encoding='utf-8')
          marker='# Re-run on the current branch after targeting import regression expectations were reconciled.\n'
          replacement=marker+'# Area rejection expectation reconciled with the current operation boundary.\n'
          if replacement not in helper_text:
              if helper_text.count(marker)!=1:
                  raise SystemExit('rich predicate helper retrigger marker changed unexpectedly')
              helper.write_text(helper_text.replace(marker,replacement,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-rich-predicate-stale-tests-7130.yml
          git add tests/domain/commonPlayTargetingRuntime.test.ts .github/workflows/c9-family-e-rich-predicate-bridge-7130.yml
          git diff --cached --check
          git commit -m "test(c9): align current rich selector rejection"
          for attempt in $(seq 1 10); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
