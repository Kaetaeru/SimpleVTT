name: C9 Legacy Boundary Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-legacy-baseline-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile exact composition drift
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('.agents/LEGACY_EXECUTION_BASELINE.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          entries=data['entries']
          entries[:]=[entry for entry in entries if entry.get('module')!='./unarmedControlRuntimeAdapter']
          module='./structuralSaveConditionRuntimeAdapter'
          if not any(entry.get('module')==module for entry in entries):
              anchor=next(i for i,entry in enumerate(entries) if entry.get('module')=='./stabilizeRuntimeAdapter')
              entries.insert(anchor+1,{'module':module,'classification':'GENERIC_ENGINE'})
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          git diff --check
      - name: Publish reconciled baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/LEGACY_EXECUTION_BASELINE.json
          git rm -f .github/workflows/c9-legacy-baseline-reconcile-71304.yml
          git commit -m "chore(c9): reconcile execution boundary baseline"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
