name: C9 Family Q Choice R4 71304
# rerun-trigger: 71304-q-choice-r4-effect-expectation

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r4-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified Q bridge and preserve choice payload
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow=Path('.github/workflows/c9-family-q-choice-r3-71304.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(code,'q-choice-r3-patch','exec'),{'__name__':'__main__'})

          domain_path=Path('src/domain/commonPlayOperationRuntime.ts')
          domain_text=domain_path.read_text(encoding='utf-8')
          choice_authority='''        selectedIds:[...input.interactionResponse.selectedIds],\n        selection:"manual",\n        authority,\n      });'''
          choice_authority_mapless='''        selectedIds:[...input.interactionResponse.selectedIds],\n        selection:"manual",\n        authority,\n        directTarget:false,\n      });'''
          if domain_text.count(choice_authority)!=1:
              raise SystemExit(f'choice direct-target anchor changed: {domain_text.count(choice_authority)}')
          domain_path.write_text(domain_text.replace(choice_authority,choice_authority_mapless,1),encoding='utf-8')

          adapter_path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          adapter_text=adapter_path.read_text(encoding='utf-8')
          old_reject='return finishInteraction(internal,resolution,"Common Play choice 응답 검증 실패");'
          traced_reject='return finishInteraction(internal,resolution,`Common Play choice 응답 검증 실패 · selected=${selection.join("|")} · options=${[...optionIds].join("|")}`);'
          if adapter_text.count(old_reject)!=1:
              raise SystemExit(f'Q response rejection anchor changed: {adapter_text.count(old_reject)}')
          adapter_path.write_text(adapter_text.replace(old_reject,traced_reject,1),encoding='utf-8')

          test_path=Path('tests/ui/c9FamilyQChoiceInteractionProduction.test.ts')
          text=test_path.read_text(encoding='utf-8')
          damage='{kind:"damage.apply",amount:{value:1},damageType:"force",target:"actor"}'
          healing='{kind:"healing.apply",amount:{value:1},target:"actor"}'
          if damage in text:
              text=text.replace(damage,healing,1)
          elif healing not in text:
              raise SystemExit('Q fixture operation anchor changed')
          expected_damage='assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore-1);'
          expected_healing='assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore+1);'
          if expected_damage in text:
              text=text.replace(expected_damage,expected_healing,1)
          elif expected_healing not in text:
              raise SystemExit('Q fixture HP assertion anchor changed')
          reaction='assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false);'
          reaction_diag='assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false,JSON.stringify(snapshot.resolution));'
          if reaction in text:
              text=text.replace(reaction,reaction_diag,1)
          elif reaction_diag not in text:
              raise SystemExit('Q reaction assertion anchor changed')
          test_path.write_text(text,encoding='utf-8')

          forwarding=[
              (
                  'src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToQuiveringPalmSeed(accept:boolean){',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToQuiveringPalmSeed(accept:boolean,selectedIds?:string[]){',
                  'return previousRespondToInterrupt.call(this,accept);',
                  'return previousRespondToInterrupt.call(this,accept,selectedIds);',
              ),
              (
                  'src/app/rogueCoreRuntimeAdapter.ts',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToRogueUncannyDodge(accept:boolean){',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToRogueUncannyDodge(accept:boolean,selectedIds?:string[]){',
                  'const snapshot=await previousRespondToInterrupt.call(this,accept);',
                  'const snapshot=await previousRespondToInterrupt.call(this,accept,selectedIds);',
              ),
              (
                  'src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToConsumableD20BonusEffect(accept:boolean){',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToConsumableD20BonusEffect(accept:boolean,selectedIds?:string[]){',
                  'return previousRespondToInterrupt.call(this,accept);',
                  'return previousRespondToInterrupt.call(this,accept,selectedIds);',
              ),
              (
                  'src/app/commonPlayInterceptorProductionRuntimeAdapter.ts',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToPortableCommonPlayInterceptor(accept:boolean) {',
                  'MockAdapter.prototype.respondToInterrupt=async function respondToPortableCommonPlayInterceptor(accept:boolean,selectedIds?:string[]) {',
                  'return previousRespondToInterrupt.call(this,accept);',
                  'return previousRespondToInterrupt.call(this,accept,selectedIds);',
              ),
          ]
          for file_path,old_sig,new_sig,old_call,new_call in forwarding:
              path=Path(file_path)
              source=path.read_text(encoding='utf-8')
              if source.count(old_sig)!=1:
                  raise SystemExit(f'{file_path}: interrupt signature anchor changed: {source.count(old_sig)}')
              if source.count(old_call)!=1:
                  raise SystemExit(f'{file_path}: interrupt forwarding anchor changed: {source.count(old_call)}')
              path.write_text(source.replace(old_sig,new_sig,1).replace(old_call,new_call,1),encoding='utf-8')
          PY
      - name: Trace interrupt wrapper chain
        run: grep -R -n -E 'respondToInterrupt=async|previousRespondToInterrupt\.call' src/app
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts src/app/rogueCoreRuntimeAdapter.ts src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
