name: C9 Family J Extra Attack Bridge

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-extra-attack-bridge-71304.yml

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch portable attack payment into existing Resolver economy
        shell: python
        run: |
          from pathlib import Path
          import json

          runtime = Path('src/domain/commonPlayOperationRuntime.ts')
          text = runtime.read_text()

          old = '''export type CommonPlayEconomyPayment={
            kind:"economy";
            bucket:TurnSlot;
            amount:LiteralNumberExpression;
            consumeAt:"commit";
            refundOnCancel:true;
          };'''
          new = '''export type CommonPlayEconomyPayment={
            kind:"economy";
            bucket:TurnSlot;
            amount:LiteralNumberExpression;
            actionKind?:ActionUseKind;
            attacksPerAction?:number;
            consumeAt:"commit";
            refundOnCancel:true;
          };'''
          assert text.count(old) == 1, 'economy payment type drifted'
          text = text.replace(old, new)

          old = 'const ECONOMY_PAYMENT_KEYS=new Set(["kind","bucket","amount","consumeAt","refundOnCancel"]);'
          new = 'const ECONOMY_PAYMENT_KEYS=new Set(["kind","bucket","amount","actionKind","attacksPerAction","consumeAt","refundOnCancel"]);'
          assert text.count(old) == 1, 'economy payment key set drifted'
          text = text.replace(old, new)

          old = '''    if(payment.consumeAt!=="commit") throw new DomainEvaluationError(`${label}.consumeAt must be commit for portable Common Play economy payment`);
              if(payment.refundOnCancel!==true) throw new DomainEvaluationError(`${label}.refundOnCancel must be true for portable Common Play Reaction payment`);
              return {kind:"economy",bucket:payment.bucket,amount,consumeAt:"commit",refundOnCancel:true};'''
          new = '''    if(payment.consumeAt!=="commit") throw new DomainEvaluationError(`${label}.consumeAt must be commit for portable Common Play economy payment`);
              if(payment.refundOnCancel!==true) throw new DomainEvaluationError(`${label}.refundOnCancel must be true for portable Common Play Reaction payment`);
              const actionKind=payment.actionKind;
              if(actionKind!==undefined&&actionKind!=="attack"&&actionKind!=="magic"&&actionKind!=="other") throw new DomainEvaluationError(`${label}.actionKind must be attack, magic, or other`);
              const attacksPerAction=payment.attacksPerAction;
              if(attacksPerAction!==undefined&&(!Number.isInteger(attacksPerAction)||Number(attacksPerAction)<1)) throw new DomainEvaluationError(`${label}.attacksPerAction must be a positive integer`);
              if((actionKind!==undefined||attacksPerAction!==undefined)&&payment.bucket!=="action") throw new DomainEvaluationError(`${label} attack semantics require the action bucket`);
              if(attacksPerAction!==undefined&&actionKind!=="attack") throw new DomainEvaluationError(`${label}.attacksPerAction requires actionKind=attack`);
              return {
                kind:"economy",bucket:payment.bucket,amount,
                ...(actionKind===undefined?{}:{actionKind}),
                ...(attacksPerAction===undefined?{}:{attacksPerAction:Number(attacksPerAction)}),
                consumeAt:"commit",refundOnCancel:true,
              };'''
          assert text.count(old) == 1, 'economy payment parser drifted'
          text = text.replace(old, new)

          old = '        bonusActionGranted:payment.bucket==="bonus-action"||undefined,actionKind:input.actionKind,'
          new = '        bonusActionGranted:payment.bucket==="bonus-action"||undefined,actionKind:payment.actionKind??input.actionKind,\n        ...(payment.attacksPerAction===undefined?{}:{attacksPerAction:payment.attacksPerAction}),' 
          assert text.count(old) == 1, 'economy payment compiler drifted'
          text = text.replace(old, new)
          runtime.write_text(text)

          schema_path = Path('schemas/common-play-contract.schema.json')
          schema = json.loads(schema_path.read_text())
          matches = []
          def visit(node):
            if isinstance(node, dict):
              props = node.get('properties')
              if isinstance(props, dict) and props.get('kind') == {'const': 'economy'} and 'bucket' in props and 'refundOnCancel' in props:
                matches.append(node)
              for value in node.values(): visit(value)
            elif isinstance(node, list):
              for value in node: visit(value)
          visit(schema)
          assert len(matches) == 1, f'economy payment schema match drifted: {len(matches)}'
          economy = matches[0]
          economy['properties']['actionKind'] = {'enum': ['attack', 'magic', 'other']}
          economy['properties']['attacksPerAction'] = {'type': 'integer', 'minimum': 1}
          economy['allOf'] = [
            {
              'if': {'anyOf': [{'required': ['actionKind']}, {'required': ['attacksPerAction']}]},
              'then': {'properties': {'bucket': {'const': 'action'}}},
            },
            {
              'if': {'required': ['attacksPerAction']},
              'then': {'required': ['actionKind'], 'properties': {'actionKind': {'const': 'attack'}}},
            },
          ]
          schema_path.write_text(json.dumps(schema, indent=2) + '\n')

          test_path = Path('tests/domain/commonPlayActionEconomyRuntime.test.ts')
          tests = test_path.read_text()
          marker = 'portable Common Play attack replacement spends Extra Attack grants without named identity'
          assert marker not in tests, 'focused test already exists'
          tests += r'''

          test("portable Common Play attack replacement spends Extra Attack grants without named identity", () => {
            const definition:CommonPlayOperationDefinition={
              schemaVersion:"0.2-draft",
              id:"external.control.attack-replacement",
              payments:[{
                kind:"economy",
                bucket:"action",
                amount:{value:1},
                actionKind:"attack",
                attacksPerAction:2,
                consumeAt:"commit",
                refundOnCancel:true,
              }],
              entryPoints:[{id:"attempt",invocation:"manual",operations:[]}],
            };
            const state=runtimeState();
            state.clock.activeActorId="hero";
            state.clock.phase="action";

            const first=resolveCommonPlayEntryPointOperations(PROFILE,state,definition,{
              resolutionId:"external.control.attack-replacement.first",
              actorId:"hero",
              entryPointId:"attempt",
            });
            assert.equal(first.status,"committed");
            if(first.status!=="committed") return;
            assert.equal(first.state.combatants.hero.economy.action,false);
            assert.equal(first.state.combatants.hero.economy.extraAttacks?.length,1);

            const second=resolveCommonPlayEntryPointOperations(PROFILE,first.state,definition,{
              resolutionId:"external.control.attack-replacement.second",
              actorId:"hero",
              entryPointId:"attempt",
            });
            assert.equal(second.status,"committed");
            if(second.status!=="committed") return;
            assert.equal(second.state.combatants.hero.economy.action,false);
            assert.equal(second.state.combatants.hero.economy.extraAttacks?.length,0);

            const third=resolveCommonPlayEntryPointOperations(PROFILE,second.state,definition,{
              resolutionId:"external.control.attack-replacement.third",
              actorId:"hero",
              entryPointId:"attempt",
            });
            assert.equal(third.status,"rejected");
          });

          test("portable Extra Attack payment metadata is bounded to the action attack bucket", () => {
            const invalid:CommonPlayOperationDefinition={
              schemaVersion:"0.2-draft",
              id:"external.control.invalid-attack-payment",
              payments:[{
                kind:"economy",
                bucket:"reaction",
                amount:{value:1},
                actionKind:"attack",
                attacksPerAction:2,
                consumeAt:"commit",
                refundOnCancel:true,
              }],
              entryPoints:[{id:"attempt",invocation:"manual",operations:[]}],
            };
            assert.throws(() => resolveCommonPlayEntryPointOperations(PROFILE,runtimeState(),invalid,{
              resolutionId:"external.control.invalid-attack-payment",
              actorId:"hero",
              entryPointId:"attempt",
            }),/attack semantics require the action bucket/);
          });
          '''
          test_path.write_text(tests)
      - name: Verify focused portable Extra Attack economy
        run: npx tsx --test tests/domain/commonPlayActionEconomyRuntime.test.ts
      - name: Verify types
        run: npx tsc --noEmit
      - name: Commit bridge and retire staging workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-extra-attack-bridge-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/domain/commonPlayActionEconomyRuntime.test.ts
          git commit -m "feat(c9): make Extra Attack payment portable"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
