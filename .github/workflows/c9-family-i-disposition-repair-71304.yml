name: C9 Family I Disposition Repair 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-disposition-repair-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-i-disposition-repair-71304
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair inconsistent final disposition and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-i-disposition-repair-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python - <<'PY'
          import json
          from pathlib import Path
          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item['family']=='I')
          adapter=Path('src/app/monkOpenHandFleetStepRuntimeAdapter.ts')
          composition=Path('src/app/offlineRuntimeAdapters.ts').read_text(encoding='utf-8')
          named_seam='named movement grants'
          if named_seam in row.get('remainingNamedSeams',[]) and adapter.exists() and 'import "./monkOpenHandFleetStepRuntimeAdapter";' in composition:
              row['disposition']='INCOMPLETE'
          elif row.get('remainingNamedSeams'):
              raise SystemExit('Family I has unresolved seams that are not reconciled by this repair')
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            rm -f "$workflow"
            git add docs/rules/v1-mechanism-coverage-ledger.json "$workflow"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): keep Family I open for named movement grant"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
