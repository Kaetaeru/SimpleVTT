name: C9 Family L Critical Dice 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-critical-dice-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bridge portable attack critical dice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          text=runtime.read_text(encoding='utf-8')
          old='''    if(operation.kind==="damage.apply") {\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome" as const,equals:operation.when.right.value}:undefined;\n      const targetId=hpOperationTarget(operation.target,input);'''
          new='''    if(operation.kind==="damage.apply") {\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome" as const,equals:operation.when.right.value}:undefined;\n      const criticalFrom=entryPoint.test?.kind==="attack-roll"?`${input.resolutionId}:test`:undefined;\n      const targetId=hpOperationTarget(operation.target,input);'''
          if old not in text and 'const criticalFrom=entryPoint.test?.kind==="attack-roll"' not in text:
              raise SystemExit('damage.apply lowering anchor changed')
          if old in text:
              text=text.replace(old,new,1)
          old_roll='''        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          ...(when?{when}:{}),\n          request:{'''
          new_roll='''        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          ...(when?{when}:{}),\n          ...(criticalFrom?{criticalFrom}:{}),\n          request:{'''
          if old_roll in text:
              text=text.replace(old_roll,new_roll,1)
          elif '...(criticalFrom?{criticalFrom}:{}),\n          request:{' not in text:
              raise SystemExit('damage-roll anchor changed')
          old_damage='''      operations.push({\n        id:operationId,\n        kind:"damage",\n        ...(when?{when}:{}),\n        targetId,'''
          new_damage='''      operations.push({\n        id:operationId,\n        kind:"damage",\n        ...(when?{when}:{}),\n        ...(criticalFrom?{criticalFrom}:{}),\n        targetId,'''
          if old_damage in text:
              text=text.replace(old_damage,new_damage,1)
          elif 'kind:"damage",\n        ...(when?{when}:{}),\n        ...(criticalFrom?{criticalFrom}:{}),' not in text:
              raise SystemExit('damage operation anchor changed')
          runtime.write_text(text,encoding='utf-8')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          old='''function damageDiceFaces(\n  internal:AdapterState,\n  actionId:string,\n  entryPoint:CommonPlayOperationDefinition["entryPoints"][number],\n  startingDrawIndex:number,\n) {\n  const faces:Record<number,number[]>={};\n  let drawIndex=startingDrawIndex;\n  for(const [operationIndex,operation] of entryPoint.operations.entries()) {\n    if(operation.kind!=="damage.apply"||typeof operation.amount!=="string") continue;\n    const formula=parseCommonPlayDamageDiceFormula(operation.amount);\n    faces[operationIndex]=Array.from({length:formula.count},()=>{\n      const limit=20-(20%formula.sides);\n      let face:number;\n      do face=internal.d20(actionId,drawIndex++); while(face>limit);\n      return ((face-1)%formula.sides)+1;\n    });\n  }\n  return faces;\n}\n'''
          new='''function damageDiceFaces(\n  internal:AdapterState,\n  actionId:string,\n  entryPoint:CommonPlayOperationDefinition["entryPoints"][number],\n  startingDrawIndex:number,\n) {\n  const faces:Record<number,number[]>={};\n  const attackDice:Array<{operationIndex:number;count:number;sides:number}>=[];\n  let drawIndex=startingDrawIndex;\n  const draw=(sides:number)=>{\n    const limit=20-(20%sides);\n    let face:number;\n    do face=internal.d20(actionId,drawIndex++); while(face>limit);\n    return ((face-1)%sides)+1;\n  };\n  for(const [operationIndex,operation] of entryPoint.operations.entries()) {\n    if(operation.kind!=="damage.apply"||typeof operation.amount!=="string") continue;\n    const formula=parseCommonPlayDamageDiceFormula(operation.amount);\n    faces[operationIndex]=Array.from({length:formula.count},()=>draw(formula.sides));\n    if(entryPoint.test?.kind==="attack-roll") attackDice.push({operationIndex,count:formula.count,sides:formula.sides});\n  }\n  for(const dice of attackDice) {\n    faces[dice.operationIndex].push(...Array.from({length:dice.count},()=>draw(dice.sides)));\n  }\n  return faces;\n}\n'''
          if old not in text and 'const attackDice:Array<{operationIndex:number;count:number;sides:number}>=' not in text:
              raise SystemExit('damageDiceFaces anchor changed')
          if old in text:
              text=text.replace(old,new,1)
          adapter.write_text(text,encoding='utf-8')

          Path('tests/ui/c9FamilyLCriticalDiceProduction71304.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport "../../src/app/offlineRuntimeAdapters";\nimport { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";\nimport { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";\nimport { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";\nimport { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";\nimport { MockAdapter } from "../../src/app/mockAdapter";\n\nconst ACTOR_ID="char.aelar";\nconst TARGET_ID="combatant.training-guardian";\n\nfunction packagePayload(prefix:string) {\n  const moduleId=`${prefix}.module`,contentId=`${prefix}.option`,mechanicId=`${prefix}.mechanic`;\n  return {moduleId,contentId,mechanicId,json:JSON.stringify({\n    schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",\n    rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",\n    source:{document:"Portable Critical Dice Probe",version:"1",license:"CC0",srdDerived:false},\n    dependencies:[],conflicts:[],capabilities:[],content:[{\n      id:contentId,category:"option",\n      presentation:{defaultLocale:"en",originalName:"Portable Critical Strike",locales:{en:{name:"Portable Critical Strike"}}},\n      mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{\n        id:"strike",invocation:"manual",targeting:{from:"targets",min:1,max:1},\n        test:{kind:"attack-roll",roller:"actor",dc:{value:1}},\n        operations:[{kind:"damage.apply",amount:"1d6+1",damageType:"force",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}}],\n      }]}}],\n    }],\n  })};\n}\n\nfunction hp(snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>) {\n  const value=snapshot.scene.entities.find((entry)=>entry.id===TARGET_ID)?.hp;\n  assert.equal(typeof value,"number");\n  return value as number;\n}\n\nasync function execute(prefix:string,natural:number) {\n  const adapter=new MockAdapter();\n  const pack=packagePayload(prefix);\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(pack.json);\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  await adapter.startInitiative();\n  await adapter.setCurrentActor(ACTOR_ID);\n  const action=installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"strike"});\n  const before=hp(await adapter.getSnapshot());\n  await adapter.setQueuedD20(natural);\n  const snapshot=await adapter.resolveAction(action,[TARGET_ID]);\n  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));\n  const dealt=before-hp(snapshot);\n  await adapter.undoLastResolution();\n  assert.equal(hp(await adapter.getSnapshot()),before,"event-native Undo must restore critical attack damage");\n  return dealt;\n}\n\ntest("unknown installed Common Play attack critical doubles damage dice but not flat damage",async()=>{\n  assert.equal(await execute("external.family-l-critical",19),7,"normal hit must roll one d6 plus one flat damage");\n  assert.equal(await execute("external.family-l-critical",20),13,"critical hit must roll two d6 plus one flat damage");\n});\n\ntest("complete external identity rename preserves portable critical-dice semantics",async()=>{\n  assert.equal(await execute("completely.renamed-family-l-critical",19),7);\n  assert.equal(await execute("completely.renamed-family-l-critical",20),13);\n});\n''',encoding='utf-8')

          workflow=Path('.github/workflows/c9-family-l-damage-defense-71304.yml')
          text=workflow.read_text(encoding='utf-8')
          if 'tests/ui/c9FamilyLCriticalDiceProduction71304.test.ts' not in text:
              text=text.replace('''      - tests/ui/c9FamilyLDamageDefenseProduction.test.ts\n      - .github/workflows/c9-family-l-damage-defense-71304.yml\n''','''      - src/domain/commonPlayOperationRuntime.ts\n      - src/app/installedCommonPlayRuntimeAdapter.ts\n      - tests/ui/c9FamilyLDamageDefenseProduction.test.ts\n      - tests/ui/c9FamilyLCriticalDiceProduction71304.test.ts\n      - .github/workflows/c9-family-l-damage-defense-71304.yml\n''')
              text=text.replace('''        run: npx tsx --test tests/ui/c9FamilyLDamageDefenseProduction.test.ts\n''','''        run: node --import tsx --test --test-concurrency=1 tests/ui/c9FamilyLDamageDefenseProduction.test.ts tests/ui/c9FamilyLCriticalDiceProduction71304.test.ts\n''')
          workflow.write_text(text,encoding='utf-8')
          PY
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify portable critical damage
        run: |
          node --import tsx --test --test-concurrency=1 tests/ui/c9FamilyLCriticalDiceProduction71304.test.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts tests/ui/c9FamilyJAttackDamageRiderProduction71304.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified implementation and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyLCriticalDiceProduction71304.test.ts .github/workflows/c9-family-l-damage-defense-71304.yml
          git rm .github/workflows/c9-family-l-critical-dice-71304.yml
          git commit -m "feat(c9): bridge portable critical damage dice"
          for attempt in $(seq 1 10); do
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 1
          done
          exit 1
