name: C9 Family O Ready Concentration

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-o-ready-concentration-71304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Patch portable Ready concentration and proof
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text = source.read_text(encoding='utf-8')
          old_import = 'import type { RulesRuntimeState } from "../domain/combatState";\n'
          new_import = old_import + 'import type { ResolutionOperation } from "../domain/resolutionTypes";\n'
          if 'import type { ResolutionOperation } from "../domain/resolutionTypes";' not in text:
              if old_import not in text:
                  raise SystemExit('RulesRuntimeState import anchor missing')
              text = text.replace(old_import, new_import, 1)

          old = '''  const resolutionId=`common-play-ready.${Date.now()}.${Math.floor(Math.random()*1000)}`;
  const committed=resolveCommonPlayStoredInvocationCapture(SIMPLEVTT_APP_RULES_PROFILE,state,{
    resolutionId,actorId:command.actorId,definitionId:action.lowered.definition.id,entryPointId:action.entryPointId,
    definitionRevision:reference.catalogId,binding:"live",
    trigger:{op:"eq",left:{ref:"trigger.declared"},right:{value:true}},
    metadata:{triggerLabel:command.trigger.trim()||"DM이 선언한 트리거"},
    captureOperations:[{id:`${resolutionId}:action`,kind:"use-economy",actorId:command.actorId,slot:"action",actionKind:"other"}],
  });'''
          new = '''  const resolutionId=`common-play-ready.${Date.now()}.${Math.floor(Math.random()*1000)}`;
  const heldSpellConcentrationGroupId=action.category==="spell"?`${resolutionId}:held-spell`:undefined;
  const captureOperations:ResolutionOperation[]=[
    {id:`${resolutionId}:action`,kind:"use-economy",actorId:command.actorId,slot:"action",actionKind:action.category==="spell"?"magic":"other"},
  ];
  if(heldSpellConcentrationGroupId) captureOperations.push({
    id:`${resolutionId}:hold-concentration`,kind:"start-concentration",actorId:command.actorId,
    groupId:heldSpellConcentrationGroupId,sourceId:action.lowered.definition.id,
  });
  const committed=resolveCommonPlayStoredInvocationCapture(SIMPLEVTT_APP_RULES_PROFILE,state,{
    resolutionId,actorId:command.actorId,definitionId:action.lowered.definition.id,entryPointId:action.entryPointId,
    definitionRevision:reference.catalogId,binding:"live",
    trigger:{op:"eq",left:{ref:"trigger.declared"},right:{value:true}},
    metadata:{triggerLabel:command.trigger.trim()||"DM이 선언한 트리거"},
    ...(heldSpellConcentrationGroupId?{concentrationGroupId:heldSpellConcentrationGroupId,onTriggerConcentration:"end" as const}:{}),
    captureOperations,
  });'''
          if old not in text:
              raise SystemExit('Ready capture anchor missing')
          text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')

          test = Path('tests/ui/c9FamilyOReadyConcentrationProduction.test.ts')
          test.write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import "../../src/app/offlineRuntimeAdapters";
import "../../src/app/installedContentRuntimeAdapter";
import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
import { MockAdapter } from "../../src/app/mockAdapter";
import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

function readyConfig(prefix:string) {
  return {
    schemaVersion:"0.2-draft",
    id:`${prefix}.ready-spell`,
    entryPoints:[{
      id:"release",
      invocation:"manual",
      operations:[{kind:"healing.apply",amount:{value:1},target:"actor"}],
    }],
  };
}

async function install(adapter:MockAdapter,prefix:string,category:"spell"|"feat"="spell") {
  const moduleId=`${prefix}.module`;
  const contentId=`${prefix}.content`;
  const config=readyConfig(prefix);
  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
  const preview=await adapter.previewContentImport(JSON.stringify({
    schemaVersion:"0.1-draft",
    moduleId,moduleVersion:"1",
    rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},
    defaultLocale:"en",
    source:{document:"Unknown Ready module",version:"1",license:"CC0",srdDerived:false},
    dependencies:[],conflicts:[],capabilities:[],
    content:[{
      id:contentId,category,
      presentation:{defaultLocale:"en",originalName:"Unknown Ready Option",locales:{en:{name:"Unknown Ready Option"}}},
      mechanics:[{kind:"common-play",config}],
    }],
  }));
  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
  await adapter.activateContentImport();
  await adapter.startInitiative();
  await adapter.setCurrentActor("char.aelar");
  return {
    actionId:installedCommonPlayActionId({
      catalogId:catalogQualifiedId(contentId,moduleId,"1"),
      mechanicId:config.id,
      entryPointId:"release",
    }),
    mechanicId:config.id,
  };
}

function heldShape(adapter:MockAdapter) {
  const state=snapshotAdapterTurnRuntimeState(adapter,(adapter as unknown as {scene:Parameters<typeof snapshotAdapterTurnRuntimeState>[1]}).scene)!;
  const concentration=state.concentration["char.aelar"];
  const stored=state.artifacts.find((artifact)=>artifact.artifactKind==="stored-invocation")?.storedInvocation;
  return {
    active:Boolean(concentration),
    sourceMatches:Boolean(concentration&&stored&&concentration.groupId===stored.concentrationGroupId),
    triggerEndsHeld:stored?.onTriggerConcentration==="end",
    actionAvailable:state.combatants["char.aelar"].economy.action,
    artifactCount:state.artifacts.filter((artifact)=>artifact.artifactKind==="stored-invocation").length,
    sourceId:concentration?.sourceId,
  };
}

test("unknown installed spell Ready starts held concentration in the capture transaction and Undo reverses it",async()=>{
  const adapter=new MockAdapter();
  const {actionId,mechanicId}=await install(adapter,"unknown-family-o-ready");
  await adapter.configureReadyAction({actorId:"char.aelar",actionId,trigger:"when the bell rings"});
  let shape=heldShape(adapter);
  assert.deepEqual(shape,{
    active:true,sourceMatches:true,triggerEndsHeld:true,actionAvailable:false,artifactCount:1,sourceId:mechanicId,
  });

  await adapter.undoLastResolution();
  shape=heldShape(adapter);
  assert.deepEqual(shape,{
    active:false,sourceMatches:false,triggerEndsHeld:false,actionAvailable:true,artifactCount:0,sourceId:undefined,
  });
});

test("Ready concentration selection is structural and rename invariant",async()=>{
  const run=async(prefix:string,category:"spell"|"feat")=>{
    const adapter=new MockAdapter();
    const {actionId}=await install(adapter,prefix,category);
    await adapter.configureReadyAction({actorId:"char.aelar",actionId,trigger:"declared trigger"});
    const {sourceId:_,...shape}=heldShape(adapter);
    return shape;
  };
  assert.deepEqual(await run("external-ready-alpha","spell"),await run("renamed-ready-omega","spell"));
  assert.deepEqual(await run("external-ready-feature","feat"),{
    active:false,sourceMatches:false,triggerEndsHeld:false,actionAvailable:false,artifactCount:1,
  });
});
''', encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify Family O Ready concentration
        run: npx tsx --test tests/ui/c9FamilyOReadyConcentrationProduction.test.ts tests/ui/c9FamilyOConcentrationProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified slice and remove staging workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-o-ready-concentration-71304.yml
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyOReadyConcentrationProduction.test.ts .github/workflows/c9-family-o-ready-concentration-71304.yml
          git commit -m "feat(c9): route readied spell concentration through resolver"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
