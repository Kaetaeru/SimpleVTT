name: C9 Family O Ready Concentration

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-o-ready-concentration-71304.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Patch portable Ready concentration
        run: python .github/scripts/c9-family-o-ready-concentration-71304.py
      - name: Install dependencies
        run: npm ci
      - name: Verify Family O Ready concentration
        run: npx tsx --test tests/ui/c9FamilyOReadyConcentrationProduction.test.ts tests/ui/c9FamilyOConcentrationProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified slice and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-o-ready-concentration-71304.yml
          rm .github/scripts/c9-family-o-ready-concentration-71304.py
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyOReadyConcentrationProduction.test.ts .github/workflows/c9-family-o-ready-concentration-71304.yml .github/scripts/c9-family-o-ready-concentration-71304.py
          git commit -m "feat(c9): route readied spell concentration through resolver"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
