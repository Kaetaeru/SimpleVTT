name: C9 Family E Selector Guard Final

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-selector-guard-final.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Project selector rejection through production resolution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          guard='src/app/installedCommonPlaySelectorGuardAdapter.ts'
          replace_once(
              guard,
              'import type { AppSnapshot, SceneVm } from "./contracts";\n',
              'import type { AppSnapshot, ResolutionView, SceneVm } from "./contracts";\n',
          )
          replace_once(
              guard,
              '''interface AdapterState {\n  scene:SceneVm;\n  activeCharacter:{id:string};\n  getSnapshot():Promise<AppSnapshot>;\n}\n''',
              '''interface AdapterState {\n  scene:SceneVm;\n  activeCharacter:{id:string};\n  resolution:ResolutionView|null;\n  getSnapshot():Promise<AppSnapshot>;\n}\n''',
          )
          replace_once(
              guard,
              '''  if(selection.status!=="resolved") return internal.getSnapshot();\n  return previousResolveAction.call(this,actionId,targetIds);\n''',
              '''  if(selection.status!=="resolved") {\n    const resolutionId=`common-play-selector-rejected.${Date.now()}.${Math.floor(Math.random()*1000)}`;\n    const actionName=internal.scene.actionsByActor[actorId]?.find((candidate)=>candidate.id===actionId)?.name??"Common Play";\n    internal.resolution={\n      id:resolutionId,actorId,targetIds:[...targetIds],actionId,actionName,rollKind:"effect",stage:"complete",\n      authoritativeDice:[],saveResults:[],damageComponents:[],compact:`Common Play selector rejected: ${selection.reason}`,\n      detail:[selection.reason],provenance:["Common Play selector"],calculatedOutcome:"적용 거부",finalOutcome:"적용 거부",\n      stateChanges:[],adjudicated:false,canAdvance:false,\n    };\n    return internal.getSnapshot();\n  }\n  return previousResolveAction.call(this,actionId,targetIds);\n''',
          )

          test_path='tests/ui/installedCommonPlayProductionRuntime.test.ts'
          replace_once(
              test_path,
              '''  await adapter.resolveAction(actionId,["char.aelar"]);\n  assert.equal((await adapter.getSnapshot()).activeCharacter.hp,selfBefore,"self must be filtered before production commit");\n\n  const enemyBefore=(await adapter.getSnapshot()).scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp;\n  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  const snapshot=await adapter.getSnapshot();''',
              '''  await adapter.resolveAction(actionId,["char.aelar"]);\n  let snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.activeCharacter.hp,selfBefore,"self must be rejected before production commit");\n  assert.equal(snapshot.resolution?.finalOutcome,"적용 거부");\n  assert.match(snapshot.resolution?.compact??"",/ineligible target/);\n\n  const enemyBefore=snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp;\n  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  snapshot=await adapter.getSnapshot();''',
          )
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify selector production slice
        run: >-
          npx tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified fix and remove local relation helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/c9-family-e-relation-selector.yml \
            .github/workflows/c9-family-e-relation-selector-retry.yml \
            .github/workflows/c9-family-e-relation-selector-final.yml \
            .github/workflows/c9-family-e-relation-rejection-final.yml \
            .github/workflows/c9-family-e-selector-guard-final.yml || true
          git add src/app/installedCommonPlaySelectorGuardAdapter.ts tests/ui/installedCommonPlayProductionRuntime.test.ts .github/workflows
          git commit -m "fix(c9): surface selector rejection in production"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
