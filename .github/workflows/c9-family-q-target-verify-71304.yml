name: C9 Family Q Target Responder Verify

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-target-verify-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile latest branch
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate repository content
        run: npm run generate:content
      - name: Verify Family Q target responder
        run: npx tsx --test tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
      - name: Verify typecheck
        run: npx tsc --noEmit
      - name: Verify coverage contract
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Self-remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore src/generated || true
          git rm .github/workflows/c9-family-q-target-verify-71304.yml
          git commit -m "ci(c9): complete Family Q target responder verification"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
