name: C9 Family P Recharge Semantic 7130

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - "src/domain/commonPlaySemanticEventRuntime.ts"
      - "tests/domain/commonPlayRechargeSemanticEventRuntime.test.ts"
      - ".github/workflows/c9-family-p-recharge-semantic-7130.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify recharge semantic vocabulary
        run: npx tsx --test tests/domain/commonPlayRechargeSemanticEventRuntime.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify V1 mechanism ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
