name: C9 Family K Outcome Damage Fix V2 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-k-outcome-damage-fix-v2-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch state
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - run: npm run generate:content
      - name: Add portable outcome-conditioned damage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          source=path.read_text(encoding='utf-8')

          def scoped(text,start_marker,end_marker,start_at=0):
              start=text.index(start_marker,start_at)
              end=text.index(end_marker,start)
              return start,end,text[start:end]

          start,end,block=scoped(source,'type CommonPlayDamageApply={','\n};')
          if 'when?:CommonPlayTestOutcomePredicate;' not in block:
              anchor='  target?:CommonPlayHpTarget;'
              if anchor not in block: raise SystemExit('damage type target anchor missing')
              block=block.replace(anchor,anchor+'\n  when?:CommonPlayTestOutcomePredicate;',1)
              source=source[:start]+block+source[end:]

          old='const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target"]);'
          new='const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target","when"]);'
          if old in source: source=source.replace(old,new,1)
          elif new not in source: raise SystemExit('damage key set is incompatible')

          start,end,block=scoped(source,'  if(operation.kind==="damage.apply") {','\n  if(operation.kind==="healing.apply")')
          if 'testOutcomePredicate(operation.when' not in block:
              anchor='    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);'
              if anchor not in block: raise SystemExit('damage parser multiplier anchor missing')
              block=block.replace(anchor,anchor+'\n    const when=testOutcomePredicate(operation.when,`${label}.when`);',1)
              anchor='      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),'
              if anchor not in block: raise SystemExit('damage parser target anchor missing')
              block=block.replace(anchor,anchor+'\n      ...(when?{when}:{}),',1)
              source=source[:start]+block+source[end:]

          old='(operation.kind==="condition.apply"||operation.kind==="condition.remove"||operation.kind==="effect.remove")&&operation.when'
          new='(operation.kind==="condition.apply"||operation.kind==="condition.remove"||operation.kind==="effect.remove"||operation.kind==="damage.apply")&&operation.when'
          if old in source: source=source.replace(old,new,1)
          elif new not in source: raise SystemExit('conditional validation shape is incompatible')

          compile_at=source.index('export function compileCommonPlayEntryPointOperations')
          start,end,block=scoped(source,'    if(operation.kind==="damage.apply") {','\n    if(operation.kind==="healing.apply")',compile_at)
          if 'const when=operation.when?' not in block:
              opening='    if(operation.kind==="damage.apply") {'
              block=block.replace(opening,opening+'\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome" as const,equals:operation.when.right.value}:undefined;',1)
          roll_anchor='          kind:"damage-roll",\n          request:{'
          if 'kind:"damage-roll",\n          ...(when?{when}:{}),' not in block:
              if roll_anchor not in block: raise SystemExit('damage roll anchor missing')
              block=block.replace(roll_anchor,'          kind:"damage-roll",\n          ...(when?{when}:{}),\n          request:{',1)
          damage_anchor='        kind:"damage",\n        targetId,'
          if 'kind:"damage",\n        ...(when?{when}:{}),' not in block:
              if damage_anchor not in block: raise SystemExit('damage operation anchor missing')
              block=block.replace(damage_anchor,'        kind:"damage",\n        ...(when?{when}:{}),\n        targetId,',1)
          source=source[:start]+block+source[end:]
          path.write_text(source,encoding='utf-8')

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text(encoding='utf-8'))
          damage=schema['$defs']['damageApply']
          expected={'$ref':'#/$defs/predicate'}
          existing=damage['properties'].get('when')
          if existing not in (None,expected): raise SystemExit(f'incompatible damageApply.when schema: {existing!r}')
          damage['properties']['when']=expected
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Add production regression proof
        shell: bash
        run: |
          cat > tests/ui/c9FamilyKOutcomeDamageProduction.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { runtimeResolutionEventHistory } from "../../src/app/runtimeResolutionEventHistory";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          const TARGET_ID="combatant.goblin-a";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.mastery-probe`;
            const mechanicId=`${prefix}.mechanic`;
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family K outcome-conditioned damage probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Mastery Probe",locales:{en:{name:"Portable Mastery Probe"}}},mechanics:[{kind:"common-play",config:{
                schemaVersion:"0.2-draft",id:mechanicId,
                entryPoints:[{id:"graze-like-miss-rider",invocation:"manual",targeting:{from:"targets",min:1,max:1},test:{kind:"attack-roll",roller:"actor",dc:{value:10}},operations:[{
                  kind:"damage.apply",amount:{value:3},damageType:"force",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"failure"}},
                }]}],
              }}]}],
            })};
          }

          async function prepare(prefix:string) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            return {adapter,actionId:installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"graze-like-miss-rider"})};
          }

          function targetHp(adapter:MockAdapter,snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>) {
            const target=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.combatants[TARGET_ID];
            assert.ok(target,"target combatant must exist");
            return target.life.hp.current;
          }

          async function exercise(prefix:string,face:number) {
            const {adapter,actionId}=await prepare(prefix);
            let snapshot=await adapter.getSnapshot();
            const before=targetHp(adapter,snapshot);
            await adapter.setQueuedD20(face);
            snapshot=await adapter.resolveAction(actionId,[TARGET_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const after=targetHp(adapter,snapshot);
            const damageEvents=runtimeResolutionEventHistory(adapter)?.events.filter((event)=>event.stateChanges.some((change)=>change.kind==="hp"&&change.targetId===TARGET_ID))??[];
            return {adapter,before,after,damageEvents};
          }

          test("unknown installed Common Play applies a failure-only damage rider and Undo restores HP",async()=>{
            const miss=await exercise("unknown-family-k-graze",1);
            assert.equal(miss.after,miss.before-3);
            assert.equal(miss.damageEvents.length,1);
            await miss.adapter.undoLastResolution();
            assert.equal(targetHp(miss.adapter,await miss.adapter.getSnapshot()),miss.before);
            const hit=await exercise("unknown-family-k-hit-control",15);
            assert.equal(hit.after,hit.before);
            assert.equal(hit.damageEvents.length,0);
          });

          test("outcome-conditioned damage is invariant to external identities",async()=>{
            const first=await exercise("unknown-family-k-identity-a",1);
            const renamed=await exercise("renamed-family-k-identity-b",1);
            assert.equal(first.before-first.after,3);
            assert.equal(renamed.before-renamed.after,3);
          });
          TS
      - name: Verify Family K and shared contracts
        run: |
          npx tsx --test tests/ui/c9FamilyKOutcomeDamageProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm run test:v1-coverage
          npm exec tsc -- --noEmit
      - name: Publish verified Family K slice and retire verifiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-k-outcome-damage-fix-71304.yml .github/workflows/c9-family-k-outcome-damage-fix-v2-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyKOutcomeDamageProduction.test.ts
          git diff --cached --check
          git commit -m "feat(c9): execute outcome-conditioned damage"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
