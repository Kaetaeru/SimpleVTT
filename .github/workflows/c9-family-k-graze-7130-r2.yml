name: C9 Family K Graze Retry 7130
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-k-graze-7130-r2.yml]
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Preserve existing negative-contract message
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='.github/workflows/c9-family-k-graze-7130.yml';
          let text=fs.readFileSync(path,'utf8');
          const before='event.target requires an attack/save semantic event in this runtime slice';
          const after='target must be event.actor for damage.taken/damage.dealt in this runtime slice';
          if(!text.includes(before)) throw new Error('retry marker missing');
          fs.writeFileSync(path,text.replace(before,after));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-k-graze-7130.yml
          git commit -m "ci(c9): preserve semantic-target rejection contract"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation