name: C9 Family E Area Membership 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-membership-7130.yml

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bridge authoritative area membership into generic selector candidates
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text = adapter.read_text(encoding='utf-8')

          old_import = 'import { resolveCommonPlaySelector, type CommonPlaySelector, type CommonPlaySelectorCandidate } from "../domain/commonPlaySelectorRuntime";'
          new_import = 'import { resolveCommonPlaySelector, type CommonPlayInstantArea, type CommonPlaySelector, type CommonPlaySelectorCandidate } from "../domain/commonPlaySelectorRuntime";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('selector import anchor changed')

          provider_marker = 'export function registerAuthoritativeCommonPlayAreaMembershipProvider'
          cp_anchor = 'const cp=<T,>(value:T):T=>structuredClone(value);\n'
          provider_block = '''const cp=<T,>(value:T):T=>structuredClone(value);

export interface AuthoritativeCommonPlayAreaMembershipProvider {
  areaMember(input:{sourceId:string;targetId:string;area:CommonPlayInstantArea}):boolean|undefined;
}

const commonPlayAreaMembershipProviders=new WeakMap<MockAdapter,AuthoritativeCommonPlayAreaMembershipProvider>();

export function registerAuthoritativeCommonPlayAreaMembershipProvider(
  adapter:MockAdapter,
  provider:AuthoritativeCommonPlayAreaMembershipProvider,
) {
  commonPlayAreaMembershipProviders.set(adapter,provider);
}

export function unregisterAuthoritativeCommonPlayAreaMembershipProvider(adapter:MockAdapter) {
  commonPlayAreaMembershipProviders.delete(adapter);
}
'''
          if provider_marker not in text:
              if cp_anchor not in text:
                  raise SystemExit('provider insertion anchor changed')
              text = text.replace(cp_anchor, provider_block, 1)

          old_signature = 'function commonPlaySelectorCandidate(scene:SceneVm,actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {'
          new_signature = '''function commonPlaySelectorCandidate(
  adapter:MockAdapter,
  scene:SceneVm,
  actor:SceneVm["entities"][number],
  target:SceneVm["entities"][number],
  area?:CommonPlayInstantArea,
):CommonPlaySelectorCandidate {'''
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
              raise SystemExit('candidate signature anchor changed')

          old_return = '''  }:baseTargeting;
  return {
    id:target.id,
    targeting,
    properties:{'''
          new_return = '''  }:baseTargeting;
  const areaMember=area?.origin==="self"
    ? commonPlayAreaMembershipProviders.get(adapter)?.areaMember({sourceId:actor.id,targetId:target.id,area:structuredClone(area)})
    : undefined;
  return {
    id:target.id,
    targeting,
    ...(area?{areaMember}:{}),
    properties:{'''
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif new_return not in text:
              raise SystemExit('candidate return anchor changed')

          old_call = '.map((target)=>commonPlaySelectorCandidate(internal.scene,actorEntity,target));'
          new_call = '.map((target)=>commonPlaySelectorCandidate(adapter,internal.scene,actorEntity,target,targeting.area));'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('candidate call anchor changed')

          adapter.write_text(text, encoding='utf-8')

          test_file = Path('tests/ui/commonPlayRichSelectorProduction.test.ts')
          test_text = test_file.read_text(encoding='utf-8')
          import_anchor = 'import { MockAdapter } from "../../src/app/mockAdapter";\n'
          provider_import = 'import { registerAuthoritativeCommonPlayAreaMembershipProvider } from "../../src/app/installedCommonPlayRuntimeAdapter";\n'
          if provider_import not in test_text:
              if import_anchor not in test_text:
                  raise SystemExit('test import anchor changed')
              test_text = test_text.replace(import_anchor, import_anchor + provider_import, 1)

          test_name = 'unknown installed self-origin area selector consumes provider-backed membership and remains identity invariant'
          if test_name not in test_text:
              if 'unknown installed area selector imports but refuses execution without provider-backed membership' not in test_text:
                  raise SystemExit('area fail-closed regression anchor missing')
              test_text = test_text.rstrip() + '''


test("unknown installed self-origin area selector consumes provider-backed membership and remains identity invariant",async()=>{
  async function run(identity:Identity) {
    const adapter=new MockAdapter();
    const actionId=await install(adapter,identity,true);
    registerAuthoritativeCommonPlayAreaMembershipProvider(adapter,{
      areaMember:({sourceId,targetId,area})=>{
        assert.equal(sourceId,"char.aelar");
        assert.equal(area.origin,"self");
        assert.equal(area.shape,"cone");
        return targetId==="combatant.goblin-a";
      },
    });
    await adapter.startInitiative();
    await adapter.setCurrentActor("char.aelar");
    await adapter.resolveAction(actionId,["combatant.goblin-b"]);
    let snapshot=await adapter.getSnapshot();
    assert.equal(snapshot.resolution?.actionId,actionId);
    assert.equal(snapshot.resolution?.finalOutcome,"적용 거부");
    await adapter.resolveAction(actionId,["combatant.goblin-a"]);
    snapshot=await adapter.getSnapshot();
    assert.equal(snapshot.resolution?.stage,"complete");
    assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);
    return snapshot.resolution?.targetIds;
  }
  assert.deepEqual(await run(RENAMED),await run(ORIGINAL));
});
'''
          test_file.write_text(test_text, encoding='utf-8')
          PY
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family E selector bridge
        run: npx tsx --test tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/c9FamilyESpatialFactProduction.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Publish verified bridge and retire workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-e-area-membership-7130.yml
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/commonPlayRichSelectorProduction.test.ts .github/workflows/c9-family-e-area-membership-7130.yml
          git commit -m "feat(c9): bridge provider-backed area membership"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          npx tsx --test tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/c9FamilyESpatialFactProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit -p tsconfig.app.json
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
