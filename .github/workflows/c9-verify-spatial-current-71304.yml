name: C9 Verify Spatial Current 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-verify-spatial-current-71304.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git rev-parse HEAD
      - run: npm ci
      - run: npm run generate:content
      - name: Verify current spatial selector and attack slice
        run: |
          node --import tsx --test \
            tests/ui/c9FamilyESpatialSelectorProduction.test.ts \
            tests/ui/c9FamilyJSpatialAttackProduction.test.ts \
            tests/ui/c9FamilyJRangeCoverProduction.test.ts \
            tests/ui/c9FamilyJOpportunityAttackProduction.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJAttackPersistence.test.ts
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npx tsc --noEmit
