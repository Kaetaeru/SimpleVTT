name: C9 Family O Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-o-ledger-reconcile-71304.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile Family O readied concentration evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          family = next(entry for entry in data["families"] if entry.get("family") == "O" and entry.get("id") == "concentration")

          family["currentState"] = (
              "Generic concentration kernel plus portable maintained-effect lowering now compose through the shared Resolver. "
              "Unknown installed RuleModule activation, Host/client replay, duplicate handling, Undo, fresh reconnect, and rename invariance are proven. "
              "Readied concentrated spells now start concentration on source invocation through the shared Resolver, hold it through Ready, and clear it on trigger/cancel; long-cast concentration setup remains incomplete."
          )

          implementation = "productionSpellRuntimeAdapter.ts readied concentrated spell setup through shared start-concentration + ReadyEnds lifecycle"
          production = "c9FamilyOReadyConcentrationProduction.test.ts unknown installed concentrated spell Ready preparation/trigger, source-invocation slot timing, and Undo"
          identity = "c9FamilyOReadyConcentrationProduction.test.ts renamed unknown installed concentrated spell preserves Ready concentration semantics"

          for key, value in (
              ("implementationEvidence", implementation),
              ("productionEvidence", production),
              ("identityInvarianceEvidence", identity),
          ):
              if value not in family[key]:
                  family[key].append(value)

          family["remainingNamedSeams"] = [
              "long-cast concentration setup remains outside portable delayed-cast/interruption ownership"
          ]
          family["disposition"] = "INCOMPLETE"

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify reconciled ledger entry
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json', 'utf8'));
          const family = data.families.find((entry) => entry.family === 'O' && entry.id === 'concentration');
          if (!family) throw new Error('Family O concentration entry missing');
          if (family.disposition !== 'INCOMPLETE') throw new Error('Family O must remain INCOMPLETE until long-cast is proven');
          if (family.remainingNamedSeams.length !== 1 || !family.remainingNamedSeams[0].includes('long-cast')) {
            throw new Error('Family O remaining seam must be long-cast only');
          }
          if (!family.productionEvidence.some((entry) => entry.includes('c9FamilyOReadyConcentrationProduction.test.ts'))) {
            throw new Error('Ready concentration production evidence missing');
          }
          NODE
      - name: Verify readied concentration production coverage
        run: npx tsx --test tests/ui/c9FamilyOReadyConcentrationProduction.test.ts
      - name: Commit reconciliation and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-o-ledger-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile Ready concentration evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Remove one-shot workflow after verification failure
        if: failure()
        run: |
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-o-ledger-reconcile-71304.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(c9): remove failed Family O reconciler"
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation || true
            git push origin HEAD:agent/c9-gate-n-coverage-reconciliation || true
          fi
