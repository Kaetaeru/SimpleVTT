name: Phase 12 Connected Session

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - "agent/103-connected-session-runtime"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/ui/**"
      - "docs/design/session-runtime.md"
      - ".agents/PHASE12_CHECKLIST.md"
      - ".github/workflows/phase12-connected.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  connected-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate canonical content
        run: npm run generate:content
      - name: Verify connected-session authority protocol
        run: npx tsx --test tests/ui/connectedSessionProtocol.test.ts tests/ui/connectedSessionWire.test.ts tests/ui/connectedActionReservation.test.ts tests/ui/connectedDurableFailure.test.ts tests/ui/realEventApplyService.test.ts tests/ui/connectedCorrectionApply.test.ts tests/ui/connectedSessionRuntimeAdapter.test.ts tests/ui/connectedTwoPeerResolution.test.ts tests/ui/connectedTurnProjection.test.ts tests/ui/connectedAttackEventCapture.test.ts tests/ui/connectedProjectedCharacterInventoryResolution.test.ts tests/ui/connectedProjectedCharacterSpellResolution.test.ts tests/ui/connectedProjectedCharacterSkillResolution.test.ts tests/ui/productionSessionLifecycleAdapter.test.ts tests/ui/productionReadyStartSafety.test.ts tests/ui/productionParticipantLifecycle.test.ts tests/ui/productionClientReconnect.test.ts tests/ui/productionHelloReplayIdempotency.test.ts tests/ui/productionSessionEnd.test.ts tests/ui/sessionImageHandoutRuntimeAdapter.test.ts
      - name: Verify Phase 11 offline walkthrough remains green
        run: npx tsx --test tests/ui/phase11OfflineWalkthrough.test.ts
      - name: Verify production frontend gate
        run: npm run build

  windows-connected-playable:
    runs-on: windows-latest
    needs: connected-protocol
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Tauri session transport and persistence library
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows connected-session executable
        run: npm run tauri:build -- --no-bundle
      - name: Stage connected-session artifact
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/simplevtt.exe"
          if (-not (Test-Path $source)) { throw "SimpleVTT executable was not produced at $source" }
          New-Item -ItemType Directory -Force -Path phase12-artifact | Out-Null
          Copy-Item $source "phase12-artifact/SimpleVTT.exe"
          @(
            "SimpleVTT Phase 12 connected-session build",
            "commit=${{ env.SOURCE_SHA }}",
            "ref=${{ github.ref }}",
            "run_id=${{ github.run_id }}",
            "",
            "Two-instance LAN/Hamachi walkthrough:",
            "1. On the DM/host machine open Session and choose Host. SimpleVTT binds TCP port 3210.",
            "2. Find the host LAN or Hamachi IPv4 address.",
            "3. Choose Open Session. Host becomes DM and enters live Freeform immediately; zero Players is valid and there is no separate Ready/Start gate.",
            "4. On the player machine open Session, choose a saved Character, and Join <HOST_IPV4>:3210 after the Host is already live.",
            "5. Confirm compatibility/content parity completes and the Player enters the Host's current authoritative mode directly.",
            "6. If the Host switches to Initiative before or after Join, confirm authoritative mode/current actor/economy synchronize to the Player.",
            "7. Player submits an event-native action such as Second Wind or a canonical weapon attack. The host resolves the staged UI; only the committed host ResolutionEvent is broadcast.",
            "8. Disconnect the client, reconnect, and confirm catch-up resumes from the previous event cursor without duplicate HP/resource/economy changes or a Ready loop.",
            "9. Explicitly end the Session and verify the client becomes offline without silently reconnecting.",
            "10. Verify offline play still works with no network connection.",
            "",
            "Windows Firewall may ask for permission to allow SimpleVTT on private networks when hosting."
          ) | Set-Content -Encoding utf8 "phase12-artifact/REMOTE-WALKTHROUGH.txt"
          @(
            "SimpleVTT Phase 12 connected-session build",
            "commit=${{ env.SOURCE_SHA }}",
            "ref=${{ github.ref }}",
            "run_id=${{ github.run_id }}"
          ) | Set-Content -Encoding utf8 "phase12-artifact/BUILD.txt"
      - name: Upload Windows connected-session artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVTT-Phase12-Windows-${{ env.SOURCE_SHA }}
          path: phase12-artifact/
          if-no-files-found: error
          retention-days: 14
