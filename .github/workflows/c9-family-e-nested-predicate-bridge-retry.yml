name: C9 Family E Nested Predicate Bridge Retry

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-e-nested-predicate-bridge-retry.yml"

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply existing bridge payload against current branch
        shell: bash
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/c9-family-e-nested-predicate-bridge.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          exec(compile(textwrap.dedent(workflow[start:end]),'nested-predicate-bridge','exec'))

          path=Path('tests/domain/commonPlayTargetingRuntime.test.ts')
          text=path.read_text()
          text=text.replace('/shape is unsupported/','/unsupported fields: area/')
          path.write_text(text)
          PYRUN
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E targeting slice
        run: npx tsx --test tests/domain/commonPlayTargetingRuntime.test.ts tests/domain/commonPlaySelectorRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified bridge
        shell: bash
        run: |
          rm .github/workflows/c9-family-e-nested-predicate-bridge.yml .github/workflows/c9-family-e-nested-predicate-bridge-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayTargetingRuntime.test.ts .github/workflows/c9-family-e-nested-predicate-bridge.yml .github/workflows/c9-family-e-nested-predicate-bridge-retry.yml
          git commit -m "feat(c9): bridge nested targeting predicates"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
