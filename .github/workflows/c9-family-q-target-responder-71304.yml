name: C9 Family Q Target Responder

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-target-responder-71304.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile latest branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch target responder support
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/domain/commonPlayOperationRuntime.ts')
          text = runtime.read_text()
          old = 'responder:"actor"|"actor-owner"|"target-owner";'
          new = 'responder:"actor"|"target"|"actor-owner"|"target-owner";'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = 'if(interaction.responder!=="actor"&&interaction.responder!=="actor-owner"&&interaction.responder!=="target-owner") throw new DomainEvaluationError(`${label}.responder must be actor, actor-owner, or target-owner for portable Common Play interaction`);'
          new = 'if(interaction.responder!=="actor"&&interaction.responder!=="target"&&interaction.responder!=="actor-owner"&&interaction.responder!=="target-owner") throw new DomainEvaluationError(`${label}.responder must be actor, target, actor-owner, or target-owner for portable Common Play interaction`);'
          assert text.count(old) == 1, text.count(old)
          runtime.write_text(text.replace(old, new))

          adapter = Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text = adapter.read_text()
          old = 'const interactionResponder=interaction.responder==="target-owner"'
          new = 'const selectedTargetResponder=interaction.responder==="target"||interaction.responder==="target-owner";\n  const interactionResponder=selectedTargetResponder'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = '"target-owner interaction requires exactly one selected target"'
          new = '`${interaction.responder} interaction requires exactly one selected target`'
          assert text.count(old) == 1, text.count(old)
          adapter.write_text(text.replace(old, new))

          test = Path('tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts')
          text = test.read_text()
          old = 'function payload(){return JSON.stringify({'
          new = 'function payload(responder:"target-owner"|"target"="target-owner"){return JSON.stringify({'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = 'interaction:{id:"target-owner-consent",kind:"consent",responder:"target-owner",mode:"blocking"'
          new = 'interaction:{id:"target-owner-consent",kind:"consent",responder,mode:"blocking"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = 'async function install(adapter:MockAdapter){\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(payload());'
          new = 'async function install(adapter:MockAdapter,responder:"target-owner"|"target"="target-owner"){\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(payload(responder));'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = 'test("target-owner consent routes to the selected target owner and rejects the actor peer",async()=>{\n  const sessionId="session.target-owner-consent",host=new MockAdapter();\n  const actionId=await install(host);'
          new = 'for (const responder of ["target-owner","target"] as const) test(`${responder} consent routes to the selected target responder and rejects the actor peer`,async()=>{\n  const sessionId=`session.${responder}-consent`,host=new MockAdapter();\n  const actionId=await install(host,responder);'
          assert text.count(old) == 1, text.count(old)
          test.write_text(text.replace(old, new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify Family Q target responder
        run: npx tsx --test tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
      - name: Verify typecheck
        run: npx tsc --noEmit
      - name: Verify coverage contract
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified patch and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-q-target-responder-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
          git commit -m "feat(c9): route portable target consent responder"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
