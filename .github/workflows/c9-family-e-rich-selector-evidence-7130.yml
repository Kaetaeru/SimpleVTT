name: C9 Family E Rich Selector Evidence 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-rich-selector-evidence-7130.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record verified Family E evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          family=next(item for item in data['families'] if item['family']=='E')
          family['currentState']='Portable Common Play targeting preserves bounded selected target sets and evaluates generic predicates over authoritative production candidates through the shared selector kernel; providerless area membership fails closed, while full spatial provider integration, ordering/object/point selection, and automatic-vs-manual production authority remain incomplete.'
          implementation='commonPlayOperationRuntime.ts routes portable target predicates through commonPlaySelectorRuntime using authoritative CommonPlaySelectorCandidate facts supplied by installedCommonPlayRuntimeAdapter.ts without content identity dispatch'
          production='C9 Family E Rich Selector Candidate Bridge 7130 run 33310268977: rich selector production/import regression, legacy execution boundary, and tsc --noEmit all passed; verifier retired after success'
          identity='commonPlayRichSelectorProduction.test.ts exercises previously-unknown and completely renamed external module/content/mechanic/entry identities through the same rich-selector production path'
          for key,value in [('implementationEvidence',implementation),('productionEvidence',production),('identityInvarianceEvidence',identity)]:
              if value not in family[key]: family[key].append(value)
          family['remainingNamedSeams']=['range/reach/sight/cover/tag spatial facts, provider-backed area membership, ordering/object/point selection, and automatic-vs-manual production selector authority remain incomplete']
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify ledger contracts
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Publish ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(c9): record rich selector production evidence"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
