name: C9 Runtime Undo Diagnostic 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-runtime-undo-diagnostic-71304.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generate:content
      - name: Instrument runtime Undo boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/runtimeResolutionUndoAdapter.ts')
          s=p.read_text()
          s=s.replace('''  const history=runtimeResolutionEventHistory(this);\n  if (!history) return oldUndoLastResolution.call(this);''','''  const history=runtimeResolutionEventHistory(this);\n  console.log("C9RUNTIME history",JSON.stringify({present:Boolean(history),resolutionId:history?.resolutionId,eventCount:history?.events.length??0}));\n  if (!history) return oldUndoLastResolution.call(this);''',1)
          s=s.replace('''  if (projected.status==="rejected") return internal.getSnapshot();''','''  console.log("C9RUNTIME projected",projected.status,projected.status==="rejected"?projected.error:"ok");\n  if (projected.status==="rejected") return internal.getSnapshot();''',1)
          s=s.replace('''  if (writeBack.status==="rejected") return internal.getSnapshot();''','''  console.log("C9RUNTIME writeback",writeBack.status,writeBack.status==="rejected"?writeBack.error:"ok");\n  if (writeBack.status==="rejected") return internal.getSnapshot();''',1)
          p.write_text(s)
          PY
      - name: Run failing actor Undo case
        run: node --import tsx --test --test-name-pattern="actor artifact reconstructs" tests/ui/connectedActorArtifactReconnectProduction.test.ts
      - name: Retire diagnostic
        if: always()
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-runtime-undo-diagnostic-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            rm -f "$path"
            git add -A "$path"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ci(c9): retire runtime undo diagnostic"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
