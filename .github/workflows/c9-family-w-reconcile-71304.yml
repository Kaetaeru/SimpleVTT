name: C9 Family W Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-w-reconcile-71304.yml

permissions:
  contents: write

jobs:
  verify-and-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile to current branch head
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify unknown external form production
        run: npx tsx --test tests/ui/commonPlayFormProjectionProduction.test.ts tests/ui/connectedFormArtifactProjectionProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Reconcile Family W ledger evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((candidate)=>candidate.family==='W');
          if(!row) throw new Error('Family W ledger row missing');
          row.currentState='Generic source-owned form artifacts execute through installed Common Play and the canonical Resolver: structural property overlay/replacement/retention, HP/temp-HP policy, controller ownership, source-owned action grant/replace, restoration, connected replay/reconnect, and event-native Undo are proven without content-name or content-ID dispatch. The named Druid Wild Shape adapter is a compatibility/orchestration entry point that delegates form creation/removal to the same generic artifact/Resolver path rather than a second execution engine.';
          row.disposition='IMPLEMENTED';
          row.implementationEvidence=[
            'schemas/common-play-contract.schema.json artifactTemplates form vocabulary and structural form initialState',
            'src/domain/commonPlayArtifactRuntime.ts generic form artifact spawn/dismiss lowering',
            'src/domain/runtimeArtifact.ts typed form RuntimeArtifact state',
            'src/domain/resolutionArtifactOps.ts canonical form linked-artifact projection through ResolutionEvents',
            'src/app/installedCommonPlayRuntimeAdapter.ts installed external form action projection/dispatch without content identity branching',
            'src/app/druidWildShapeRuntimeAdapter.ts Wild Shape compatibility path delegates form creation/removal to generic Common Play/Resolver commit'
          ];
          row.productionEvidence=[
            'tests/ui/commonPlayFormProjectionProduction.test.ts unknown external form property projection, HP/temp-HP, source-owned action grant/replace, restoration, and Undo',
            'tests/ui/connectedFormArtifactProjectionProduction.test.ts unknown external form Host/Client projection, reconnect, and Undo',
            '584257b01a3158d6cc77c0bb519cd80e24437914 test(c9): prove connected form projection lifecycle'
          ];
          row.identityInvarianceEvidence=[
            'tests/ui/commonPlayFormProjectionProduction.test.ts renaming every external form identity preserves projection semantics'
          ];
          row.connectedEvidenceIfRelevant=[
            'tests/ui/connectedFormArtifactProjectionProduction.test.ts Host/Client authoritative event replay, transformed projection convergence, event-native Undo, and post-Undo convergence'
          ];
          row.persistenceEvidenceIfRelevant=[
            'tests/ui/connectedFormArtifactProjectionProduction.test.ts fresh reconnect reconstructs transformed form state from ordered session events and reconnect after Undo reconstructs the restored base state'
          ];
          row.remainingNamedSeams=[];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
          node scripts/check-v1-mechanism-coverage.mjs
          node <<'NODE'
          const ledger=require('./docs/rules/v1-mechanism-coverage-ledger.json');
          const row=ledger.rows.find((candidate)=>candidate.family==='W');
          for(const field of ['implementationEvidence','productionEvidence','identityInvarianceEvidence','connectedEvidenceIfRelevant','persistenceEvidenceIfRelevant']) {
            if(!Array.isArray(row[field])||row[field].length===0) throw new Error(`Family W ${field} missing`);
          }
          if(row.disposition!=='IMPLEMENTED'||row.remainingNamedSeams.length!==0) throw new Error('Family W is not Gate-N-final');
          NODE
      - name: Commit reconciled evidence and remove diagnostic workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-w-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile generic form coverage"
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
