name: C9 Family AH Durable Ownership Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ah-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile AH durable ownership boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(ledger.rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0) throw new Error(`unexpected coverage ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('gateNBlockingNamedFallbacks is not empty');
          const ah=ledger.rows.find(r=>r.family==='AH'&&r.id==='tools-crafting-projects');
          if(!ah||ah.disposition!=='INCOMPLETE') throw new Error('Family AH must still be INCOMPLETE');
          const project=fs.readFileSync('src/domain/commonPlayProjectRuntime.ts','utf8');
          const schema=fs.readFileSync('schemas/common-play-contract.schema.json','utf8');
          if(!project.includes('advanceCommonPlayProject')||!project.includes('requiredWork')||!project.includes('completedWork')||!project.includes('payments')) throw new Error('project kernel changed; re-audit');
          if(schema.includes('projectInstance')||schema.includes('craftProject')) throw new Error('portable project contract now exists; re-audit');
          function sourceText(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?sourceText(path.join(dir,e.name)):/\.(ts|tsx)$/.test(e.name)?[fs.readFileSync(path.join(dir,e.name),'utf8')]:[]).join('\n');}
          const app=sourceText('src/app');
          if(app.includes('advanceCommonPlayProject(')) throw new Error('production project caller now exists; re-audit rather than checkpointing');
          ah.currentState='The generic project kernel owns one revision-bound owner, cumulative work, cumulative scalar payments, and completion at a required-work threshold. It does not define contributors, tool/proficiency/prepared-spell prerequisites, daily validation, cancellation semantics, completion outputs, durable project persistence, or inventory write-back. The persisted Common Play contract has no project/crafting instance vocabulary and production has no durable project owner, so forcing this state through combat Resolution or mutating Character items on completion would violate the transaction-domain boundary.';
          ah.implementationEvidence=[...(ah.implementationEvidence??[]),'commonPlayProjectRuntime.ts revision-bound owner/work/payment kernel','commonPlayC6Runtime.test.ts threshold composition proof'];
          ah.remainingNamedSeams=[
            'persisted portable durable project/activity contract with contributors and prerequisites',
            'campaign/durable project repository and revision owner with non-consecutive progress/cancellation',
            'daily validation and material/currency payment transaction ownership',
            'completion output joined atomically to the durable inventory/item write-back boundary from Families X/Y'
          ];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const statePath='.chatgpt-rerun/STATE.md';
          let state=fs.readFileSync(statePath,'utf8');
          const marker='## Next Exact Action';
          const idx=state.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          const before=state.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family AH audit — durable project/output owner missing\n\nFamily AH (`tools-crafting-projects`) remains `INCOMPLETE`. `commonPlayProjectRuntime.ts` is a revision-safe work/payment threshold kernel only. It does not own contributors, prerequisites, daily validation, cancellation, completion outputs, persistence, or item creation/write-back, and the Common Play schema has no portable project definition. Production has no durable project repository/transaction; completion outputs also depend on the unresolved X/Y durable item source boundary. Do not model a multi-day project as a combat RuntimeArtifact merely to satisfy coverage.\n\n';
          const next='## Next Exact Action\n\nDo not reopen Families S/T/U/AB or audited authority/dependency-blocked P/V/W/X/Y/Z/AA/AC/AD/AE/AF/AG/AH seams. Move to Family AI (`carrying-capacity-cargo`): audit whether existing RulesProfile expressions plus Character/item weight metadata and object/container/mount contracts already define an authoritative derived carrying-capacity constraint in production. If weight/container/vehicle cargo source data or enforcement ownership is absent, keep AI `INCOMPLETE` and record the exact durable-derived-property boundary rather than inventing inventory metadata.\n';
          fs.writeFileSync(statePath,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs || true
          git diff --check
      - name: Commit AH audit and STATE
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): audit durable project ownership gap"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family AH remains INCOMPLETE: its project kernel has revision-safe work/payment math but no portable/durable project owner, contributors/prerequisites/daily validation/cancellation, persistence, or completion output joined to durable inventory. Next audit Family AI carrying-capacity/cargo derived constraints.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          rm .github/workflows/rerun-c9-ah-audit.yml
          git add .chatgpt-rerun/control.json .github/workflows/rerun-c9-ah-audit.yml
          git commit -m "docs(rerun): continue after durable project audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation