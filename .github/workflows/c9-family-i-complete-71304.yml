name: C9 Family I Complete 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-complete-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Reconcile Family I ledger evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text())
          row=next(entry for entry in data['rows'] if entry['family']=='I')
          row['currentState']='Portable movement is complete through the generic Common Play/Resolver path: unknown installed RuleModules execute walk/climb/swim/fly/crawl/jump, Difficult Terrain and drag/carry cost multipliers, Prone standing, forced movement, teleport, no-provoke movement, alternate-speed limits and grants, zero-speed rejection, connected replay/reconnect, Undo, and full external identity rename without relying on named movement grants.'
          row['disposition']='IMPLEMENTED'
          for value in [
            'commonPlayMovementRuntime.ts structurally applies movement.<type> speed caps plus rules-derived movement.cost.multiplier and movement.drag-carry.multiplier before the shared Resolver move operation',
            'rules/profiles/dnd.srd-5.2.1.profile.json registers movement.fly, movement.cost.multiplier, and movement.drag-carry.multiplier for generic profile/effect projection',
            'installedCommonPlayRuntimeAdapter.ts commonPlayActorProfileProperties composes RulesProfile property modifiers into movementProperties for arbitrary installed Common Play definitions',
          ]:
            if value not in row['implementationEvidence']: row['implementationEvidence'].append(value)
          run_id=os.environ.get('GITHUB_RUN_ID','unknown')
          for value in [
            'c9FamilyIMovementProduction.test.ts proves unknown and fully renamed external RuleModules execute rules-derived Difficult Terrain, drag/carry cost, alternate-speed grant/revoke and bounds, Prone stand, movement modes, zero-speed rejection, and event-native Undo through production Common Play',
            f'C9 Family I Complete 71304 run {run_id}: Family I production movement, V1 coverage checker, legacy execution boundary, and tsc --noEmit passed before publish',
          ]:
            if value not in row['productionEvidence']: row['productionEvidence'].append(value)
          row['remainingNamedSeams']=[]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify completed Family I
        run: |
          node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified Family I reconciliation
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-i-complete-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-i-complete-71304.yml
          git commit -m "docs(c9): complete Family I movement coverage"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1

# rerun-trigger: dedicated drag/carry proof integrated
