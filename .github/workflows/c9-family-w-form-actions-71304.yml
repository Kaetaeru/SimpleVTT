name: C9 Family W Form Actions 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-w-form-actions-71304.yml
      - .github/scripts/c9-family-w-form-actions-71304.py
      - .github/scripts/c9-family-w-form-action-execution-71304.py

permissions:
  contents: write

jobs:
  wire-form-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Patch generic form action projection
        run: |
          python .github/scripts/c9-family-w-form-actions-71304.py
          python .github/scripts/c9-family-w-form-action-execution-71304.py
      - name: Verify Family W form action slice
        run: |
          node --import tsx --test tests/ui/commonPlayFormProjectionProduction.test.ts tests/ui/commonPlayFormActionProjectionProduction.test.ts
          npx tsc --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Commit verified slice and retire staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/installedCommonPlayRuntimeAdapter.ts src/app/commonPlayFormProjectionAdapter.ts tests/ui/commonPlayFormActionProjectionProduction.test.ts
          git rm .github/workflows/c9-family-w-form-actions-71304.yml .github/scripts/c9-family-w-form-actions-71304.py .github/scripts/c9-family-w-form-action-execution-71304.py
          git commit -m "feat(c9): project portable form action policies"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
