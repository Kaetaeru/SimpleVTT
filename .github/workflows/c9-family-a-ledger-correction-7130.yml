name: C9 Family A Ledger Correction 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-ledger-correction-7130.yml

permissions:
  contents: write

jobs:
  correct-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Correct Family A source-of-truth evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const row = ledger.rows.find((candidate) => candidate.family === 'A');
          if (!row) throw new Error('Family A ledger row not found');

          row.currentState = 'The persisted property.modify contract carries explicit target, Effect ownership, definition source, elapsed duration, destroy-on-end lifetime, and instance policy. commonPlayOperationRuntime generically lowers arbitrary external property.modify definitions to the existing apply-effect ResolutionOperation with a typed propertyModifier payload, Resolver commits that payload into EffectState, and installed Common Play projects active movement.walk property effects into the existing movement expression consumer without content-name or content-ID dispatch. Generic Effect application enforces stack, replace, and unique-by-source instance policies with reversible Effect StateChanges; profile-policy rejects explicitly until RulesProfile supplies a stacking policy. Source-bound property modifiers converge through connected event replay, fresh connected replicas, retry suppression, and event-native Undo. Family A remains incomplete because production property projection is not yet generic across the full property vocabulary and structured property-modifier effects are adapter-runtime state rather than durable local restart state: connected ledger replay is not durable persistence.';
          row.implementationEvidence = row.implementationEvidence.map((entry) =>
            entry.replace('commonPlayPropertyInstancePolicyRuntime.test.ts', 'propertyModifierInstancePolicyRuntime.test.ts')
          );
          row.productionEvidence = row.productionEvidence.map((entry) =>
            entry.replace('connected property persistence/reconnect/Undo', 'connected property replay/reconnect/Undo')
          );
          row.connectedEvidenceIfRelevant = [
            'installedCommonPlayPropertyModifierReconnect.test.ts authoritative connected EffectState replay, fresh reconnect, duplicate/retry suppression, event-native Undo, and reconnect-after-Undo',
            'installedCommonPlayPropertyModifierProduction.test.ts unknown external property.modify executes through production movement.walk projection without content identity dispatch'
          ];
          row.persistenceEvidenceIfRelevant = [];
          row.remainingNamedSeams = [
            'EffectInstance.propertyModifier production projection currently covers movement.walk rather than the full generic property vocabulary',
            'resolveProfileProperty still has no production caller that composes active Effect-owned modifiers across generic property refs',
            'named progression/runtime stat materialization remains outside a generic property owner',
            'property modifier profile-policy remains explicitly unsupported until RulesProfile defines the stacking policy',
            'connected event replay is not durable local persistence: turnRuntimeSessionRegistry keeps structured turn runtime in an adapter-scoped WeakMap and realTurnRuntimeService rebuilds scene runtime with effects: [], so source-bound property modifiers do not survive an independent local runtime restart without authoritative ledger replay'
          ];
          row.disposition = 'INCOMPLETE';
          row.persistenceRelevant = true;

          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE

      - name: Verify Gate N ledger contract
        run: node scripts/check-v1-mechanism-coverage.mjs

      - name: Commit correction and remove helper
        shell: bash
        run: |
          rm .github/workflows/c9-family-a-ledger-correction-7130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-a-ledger-correction-7130.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(c9): correct Family A persistence evidence"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
