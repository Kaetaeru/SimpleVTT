name: Rules Domain

on:
  pull_request:
    paths:
      - "src/domain/**"
      - "src/app/spellcastingRuntime*.ts"
      - "src/CombatSpellHud.tsx"
      - "tests/domain/**"
      - "tests/ui/combatSpellHudStructure.test.ts"
      - "tests/ui/spellcastingRuntimeAdapter.test.ts"
      - "package.json"
      - ".github/workflows/rules-domain.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "src/domain/**"
      - "src/app/spellcastingRuntime*.ts"
      - "src/CombatSpellHud.tsx"
      - "tests/domain/**"
      - "tests/ui/combatSpellHudStructure.test.ts"
      - "tests/ui/spellcastingRuntimeAdapter.test.ts"
      - "package.json"

jobs:
  rules-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Phase 04/05/06 rules gate
        run: npm run test:rules-domain
      - name: Run Phase 06 spellcasting integration gate
        run: npm run test:spellcasting
      - name: Generate presentation dependency
        run: npm run generate:presentation
      - name: Typecheck application
        run: npx tsc --noEmit
