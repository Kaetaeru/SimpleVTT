name: C9 Family A Generic Profile Owner 7130
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-generic-profile-owner-7130.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Wire generic production profile property owner
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              source=p.read_text()
              count=source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, got {count}")
              p.write_text(source.replace(old,new,1))

          service='src/app/realResolutionService.ts'
          replace_once(
              service,
              'import type { RollStateContribution, RulesProfileLike } from "../domain/profileEngine";',
              'import { resolveProfileProperty, type RollStateContribution, type RulesProfileLike } from "../domain/profileEngine";\nimport { resolveEffectModifiedProperty, type EffectInstance } from "../domain/effects";',
              'profile/effect imports',
          )
          replace_once(
              service,
              '  properties:{},',
              '  properties:dndSrdRulesProfile.properties as RulesProfileLike["properties"],',
              'production profile properties',
          )
          replace_once(
              service,
              '''};

export interface OpenAbilityCheckResolutionRequest {''',
              '''};

export function resolveRuntimeProfileProperty(
  effects:EffectInstance[],
  targetId:string,
  property:string,
  inputProperties:Record<string,number>,
) {
  const base=resolveProfileProperty(SIMPLEVTT_APP_RULES_PROFILE,property,inputProperties);
  const modified=resolveEffectModifiedProperty(
    effects,targetId,property,{...inputProperties,[property]:base.value},
  );
  return {
    property,
    value:modified.value,
    provenance:[...base.provenance,...modified.provenance],
  };
}

export interface OpenAbilityCheckResolutionRequest {''',
              'runtime profile property resolver',
          )

          adapter='src/app/installedCommonPlayRuntimeAdapter.ts'
          replace_once(
              adapter,
              'import { SIMPLEVTT_APP_RULES_PROFILE } from "./realResolutionService";',
              'import { resolveRuntimeProfileProperty, SIMPLEVTT_APP_RULES_PROFILE } from "./realResolutionService";',
              'production resolver import',
          )
          replace_once(
              adapter,
              'import { resolveEffectModifiedProperty } from "../domain/effects";\n',
              '',
              'old effect resolver import',
          )
          replace_once(
              adapter,
              '''    "movement.walk":resolveEffectModifiedProperty(
      state.effects,actor.id,"movement.walk",{"movement.walk":actorState.baseSpeed},
    ).value,''',
              '''    "movement.walk":resolveRuntimeProfileProperty(
      state.effects,actor.id,"movement.walk",{"movement.walk":actorState.baseSpeed},
    ).value,''',
              'movement production property caller',
          )

          test_path='tests/ui/installedCommonPlayPropertyModifierProduction.test.ts'
          replace_once(
              test_path,
              'import { MockAdapter } from "../../src/app/mockAdapter";',
              'import { MockAdapter } from "../../src/app/mockAdapter";\nimport { resolveRuntimeProfileProperty } from "../../src/app/realResolutionService";\nimport type { EffectInstance } from "../../src/domain/effects";',
              'property resolver test imports',
          )
          replace_once(
              test_path,
              '''test("unknown Common Play property modifier projects through Effect state into production movement",async()=>{''',
              '''test("production property owner composes profile-derived values with active Effect modifiers",()=>{
  const effect:EffectInstance={
    id:"effect.external.str-modifier",sourceId:"external.unseen.property-owner",targetId:"char.aelar",kind:"modifier",tags:[],expiry:{kind:"permanent"},
    propertyModifier:{property:"ability.str.modifier",operation:"add",value:{value:1},source:"definition",instancePolicy:"stack"},
  };
  const resolved=resolveRuntimeProfileProperty([effect],"char.aelar","ability.str.modifier",{"ability.str.score":14});
  assert.equal(resolved.value,3);
  assert.ok(resolved.provenance.some((entry)=>entry.source.includes("property:ability.str.modifier")));
  assert.ok(resolved.provenance.some((entry)=>entry.source==="effect:effect.external.str-modifier"));
});

test("unknown Common Play property modifier projects through Effect state into production movement",async()=>{''',
              'generic profile property regression',
          )
      - run: npx tsx --test tests/domain/commonPlayPropertyContractRuntime.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
      - run: npx tsc --noEmit
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified Family A production property owner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/realResolutionService.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          git rm .github/workflows/c9-family-a-generic-profile-owner-7130.yml
          git commit -m "feat(c9): compose profile properties with runtime effects"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
