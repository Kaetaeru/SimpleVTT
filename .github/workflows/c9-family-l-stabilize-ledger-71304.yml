name: C9 Family L Stabilize Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-stabilize-ledger-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-l-stabilize-ledger-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify retained stabilization proof
        run: |
          node --import tsx --test tests/ui/c9FamilyLStabilizeProduction.test.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts tests/ui/c9FamilyLTemporaryHpProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Reconcile Family L evidence
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const path="docs/rules/v1-mechanism-coverage-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(path,"utf8"));
          const row=ledger.rows.find((entry)=>entry.family==="L");
          if (!row || row.id!=="damage-life" || row.disposition!=="INCOMPLETE") throw new Error("unexpected Family L ledger state");
          const production="325ddee91c87855c35816f5f16fc8134bb709209 test(c9): prove portable stabilization; C9 Family L Stabilize 71304 run 33315607390 passed unknown/renamed RuleModule 0-HP stabilization, event-native Undo, existing Family L regressions, V1 coverage checker, legacy execution boundary, and tsc --noEmit";
          const identity="c9FamilyLStabilizeProduction.test.ts repeats 0-HP stabilization and Undo under completely unrelated external module/content/mechanic identities";
          if (!row.productionEvidence.includes(production)) row.productionEvidence.push(production);
          if (!row.identityInvarianceEvidence.includes(identity)) row.identityInvarianceEvidence.push(identity);
          if (!row.currentState.includes("portable stabilization")) row.currentState += " Portable stabilization at 0 HP is production-proven with event-native Undo and external identity rename.";
          row.remainingNamedSeams=row.remainingNamedSeams.map((entry)=>entry==="complete 0 HP/unconscious, damage-at-zero/death-save/stabilization production acceptance remains incomplete"
            ? "0 HP/unconscious and stabilization are production-proven; damage-at-zero and death-save production acceptance remain incomplete"
            : entry);
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+"\n");
          EOF
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish reconciliation and remove staging workflow
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-l-stabilize-ledger-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-l-stabilize-ledger-71304.yml
          git commit -m "docs(c9): record portable stabilization evidence"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
