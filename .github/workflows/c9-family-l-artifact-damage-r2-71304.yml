name: C9 Family L Artifact Damage R2 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-l-artifact-damage-r2-71304.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify portable Object and Vehicle damage
        run: |
          node --import tsx --test --test-concurrency=1 tests/domain/commonPlayArtifactActivationRuntime.test.ts tests/domain/commonPlayArtifactFamiliesRuntime.test.ts tests/ui/c9FamilyLArtifactDamageProduction71304.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
