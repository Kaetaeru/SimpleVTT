name: C9 Family E Rich Predicate Boundary 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-rich-predicate-bridge-7130.yml

permissions:
  contents: write

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align unsupported import probes with the current portable contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=path.read_text(encoding='utf-8')
          replacements=[
            ('    (mechanic)=>{mechanic.config.entryPoints[0].interaction.revalidate="if-revision-changed";},\n',
             '    (mechanic)=>{mechanic.config.entryPoints[0].interaction.revalidate="never";},\n'),
            ('    (mechanic)=>{mechanic.config.payments[0].bucket="action";},\n',
             '    (mechanic)=>{mechanic.config.payments[0].bucket="free-action";},\n'),
          ]
          for old,new in replacements:
            if new in text:
              continue
            if text.count(old)!=1:
              raise SystemExit(f'expected exactly one stale import probe: {old.strip()}')
            text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E rich selector and import boundaries
        run: >-
          node --import tsx --test
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify C9 boundaries and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Commit verified reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/ruleModulePackageImport.test.ts
          if ! git diff --cached --quiet; then git commit -m "test(c9): align portable import rejection probes"; fi
          git rm .github/workflows/c9-family-e-rich-predicate-bridge-7130.yml
          git commit -m "chore(c9): remove consumed rich selector verifier"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 6); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content
              node --import tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts tests/ui/ruleModulePackageImport.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
