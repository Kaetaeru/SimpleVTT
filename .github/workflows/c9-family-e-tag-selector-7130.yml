name: C9 Family E Tag Selector 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-tag-selector-7130.yml
      - tests/ui/c9FamilyETagSelectorProduction.test.ts
      - src/domain/commonPlaySelectorRuntime.ts
      - src/app/installedCommonPlayRuntimeAdapter.ts

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Family E tag selector production
        run: >-
          node --import tsx --test
          tests/ui/c9FamilyETagSelectorProduction.test.ts
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
      - name: Verify repository boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Retire verifier after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-tag-selector-7130.yml
          git commit -m "chore(c9): retire Family E tag selector verifier"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin HEAD:"$branch"; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
