name: C9 Family D Capacity Overlay Apply

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-d-capacity-overlay-apply.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified capacity projection patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("src/app/characterLibraryRuntimeAdapter.ts")
          text = runtime.read_text()
          anchor = '''MockAdapter.prototype.getSnapshot = async function getSnapshotWithCharacterLibrary() {
            await ensureHydrated(this);
            const snapshot = await oldGetSnapshot.call(this);
            const context = contextFor(this);
            snapshot.persistence = cp(context.vm);
            projectDraftSaveError(snapshot,context);
            return snapshot;
          };
          '''
          replacement = '''function projectPersistedTemporaryResourceCapacity(adapter:MockAdapter,snapshot:AppSnapshot,context:PersistenceContext) {
            const record=context.repository.snapshot()?.characters.find((entry)=>entry.characterId===snapshot.activeCharacter.id);
            if (!record) return;
            const runtimeById=new Map(record.runtime.resources.map((resource)=>[resource.id,resource]));
            const sourceById=new Map((record.source.resourceDefinitions??[]).map((resource)=>[resource.id,resource]));
            const apply=(sheet:CharacterSheet) => {
              for (const resource of sheet.resources) {
                const persisted=runtimeById.get(resource.id);
                if (persisted?.maximum===undefined || persisted.maximumAfterLongRest===undefined) continue;
                const source=sourceById.get(resource.id);
                resource.max=persisted.maximum;
                resource.sourceMaximum=source?.max ?? resource.sourceMaximum ?? resource.max;
                resource.maximumAfterLongRest=persisted.maximumAfterLongRest;
              }
            };
            apply(stateOf(adapter).activeCharacter);
            apply(snapshot.activeCharacter);
          }

          MockAdapter.prototype.getSnapshot = async function getSnapshotWithCharacterLibrary() {
            await ensureHydrated(this);
            const snapshot = await oldGetSnapshot.call(this);
            const context = contextFor(this);
            projectPersistedTemporaryResourceCapacity(this,snapshot,context);
            snapshot.persistence = cp(context.vm);
            projectDraftSaveError(snapshot,context);
            return snapshot;
          };
          '''
          if anchor not in text:
            raise SystemExit("characterLibraryRuntimeAdapter getSnapshot anchor not found")
          runtime.write_text(text.replace(anchor,replacement,1))
          PY
      - name: Verify focused capacity production proof
        run: |
          npm install --no-audit --no-fund
          npm run generate:content
          npx tsx --test tests/ui/c9FamilyDTemporaryCapacityProduction71304.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts tests/ui/realEventResourceCapacityProjection.test.ts
          npx tsc --noEmit
      - name: Commit verified code patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/characterLibraryRuntimeAdapter.ts
          git commit -m "fix(c9): preserve durable temporary resource capacity projection"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
