name: C9 Family L Life State 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - tests/ui/c9FamilyLLifeStateProduction.test.ts
      - tests/ui/c9FamilyLTemporaryHpProduction.test.ts
      - .github/workflows/c9-family-l-life-state-7130.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family L portable life state
        run: npx tsx --test tests/ui/c9FamilyLTemporaryHpProduction.test.ts tests/ui/c9FamilyLLifeStateProduction.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Retire verifier after green evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-l-life-state-7130.yml
          git add .github/workflows/c9-family-l-life-state-7130.yml
          git commit -m "ci(c9): retire Family L life-state verifier"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          npx tsx --test tests/ui/c9FamilyLTemporaryHpProduction.test.ts tests/ui/c9FamilyLLifeStateProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit -p tsconfig.app.json
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
