name: C9 Fix Family X Harness 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-fix-family-x-harness-71304.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile and repair harness
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-x-item-charge-payment-71304.yml')
          text=path.read_text(encoding='utf-8')
          old='      - run: npm run generate:builtin-catalog\n'
          new='      - run: npm run generate:content\n'
          assert old in text, 'Family X harness generation step changed'
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-x-item-charge-payment-71304.yml
          git rm .github/workflows/c9-fix-family-x-harness-71304.yml
          git commit -m "ci(c9): use full generated content for Family X"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
