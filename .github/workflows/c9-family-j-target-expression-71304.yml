name: C9 Family J Target Expressions 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-target-expression-71304.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add target-owned expression authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          text=runtime.read_text(encoding='utf-8')
          old='  actorProperties?:Record<string,number>;\n  movementProperties?:Record<string,number>;\n'
          new='  actorProperties?:Record<string,number>;\n  targetProperties?:Record<string,number>;\n  movementProperties?:Record<string,number>;\n'
          if new not in text:
            if text.count(old)!=1:
              raise SystemExit(f'expected execution-input property anchor once, got {text.count(old)}')
            text=text.replace(old,new,1)

          old='''function actorExpressionInteger(\n  expression:CommonPlayExpression,\n  input:CommonPlayOperationExecutionInput,\n  label:string,\n  minimum?:number,\n) {\n  const properties=input.actorProperties??{};\n  const value=evaluateExpression(expression as ExpressionNode,(property)=>{\n    const resolved=properties[property];\n    if(!Number.isFinite(resolved)) throw new DomainEvaluationError(`${label} actor property is unavailable: ${property}`);\n    return Number(resolved);\n  });\n  if(!Number.isFinite(value)||!Number.isInteger(value)) throw new DomainEvaluationError(`${label} must resolve to a finite integer`);\n  if(minimum!==undefined&&value<minimum) throw new DomainEvaluationError(`${label} must resolve to an integer >= ${minimum}`);\n  return value;\n}\n'''
          new='''function actorExpressionInteger(\n  expression:CommonPlayExpression,\n  input:CommonPlayOperationExecutionInput,\n  label:string,\n  minimum?:number,\n) {\n  const value=evaluateExpression(expression as ExpressionNode,(property)=>{\n    const targetPrefix="target.";\n    const targetProperty=property.startsWith(targetPrefix)?property.slice(targetPrefix.length):undefined;\n    const properties=targetProperty===undefined?input.actorProperties:input.targetProperties;\n    const key=targetProperty??property;\n    const resolved=properties?.[key];\n    if(!Number.isFinite(resolved)) throw new DomainEvaluationError(`${label} ${targetProperty===undefined?"actor":"target"} property is unavailable: ${key}`);\n    return Number(resolved);\n  });\n  if(!Number.isFinite(value)||!Number.isInteger(value)) throw new DomainEvaluationError(`${label} must resolve to a finite integer`);\n  if(minimum!==undefined&&value<minimum) throw new DomainEvaluationError(`${label} must resolve to an integer >= ${minimum}`);\n  return value;\n}\n'''
          if new not in text:
            if text.count(old)!=1:
              raise SystemExit(f'expected actor expression helper once, got {text.count(old)}')
            text=text.replace(old,new,1)
          runtime.write_text(text,encoding='utf-8')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          old='  const movementProperties=commonPlayActorProfileProperties(internal,state,actor.id);\n'
          new='  const movementProperties=commonPlayActorProfileProperties(internal,state,actor.id);\n  const targetProperties=selectedTargetId?commonPlayActorProfileProperties(internal,state,selectedTargetId):undefined;\n'
          if new not in text:
            if text.count(old)!=1:
              raise SystemExit(f'expected target property projection anchor once, got {text.count(old)}')
            text=text.replace(old,new,1)
          old='    ...(movementProperties?{actorProperties:movementProperties,movementProperties}:{}),\n'
          new='    ...(movementProperties?{actorProperties:movementProperties,movementProperties}:{}),\n    ...(targetProperties?{targetProperties}:{}),\n'
          if new not in text:
            if text.count(old)!=1:
              raise SystemExit(f'expected execution input projection anchor once, got {text.count(old)}')
            text=text.replace(old,new,1)
          adapter.write_text(text,encoding='utf-8')
          PY

          cat > tests/ui/c9FamilyJTargetPropertyAttackProduction71304.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/installedContentRuntimeAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MockAdapter } from "../../src/app/mockAdapter";

          const TARGET_ID="combatant.goblin-a";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.strike`;
            const mechanicId=`${prefix}.mechanic`;
            const json=JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family J target-property attack probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],content:[{
                id:contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:"Portable Target AC Strike",locales:{en:{name:"Portable Target AC Strike"}}},
                mechanics:[{kind:"common-play",config:{
                  schemaVersion:"0.2-draft",id:mechanicId,
                  payments:[{kind:"economy",bucket:"action",amount:{value:1},consumeAt:"commit",refundOnCancel:true,actionKind:"attack",attacksPerAction:1}],
                  entryPoints:[{
                    id:"strike",invocation:"manual",targeting:{from:"targets",min:1,max:1},
                    test:{kind:"attack-roll",roller:"actor",property:"ability.str.modifier",dc:{ref:"target.defense.ac"},perTarget:false},
                    operations:[{kind:"damage.apply",amount:{op:"add",args:[{value:1},{ref:"ability.str.modifier"}]},damageType:"bludgeoning",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}}],
                  }],
                }}],
              }],
            });
            return {moduleId,contentId,mechanicId,json};
          }

          async function exercise(prefix:string) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            let snapshot=await adapter.previewContentImport(pack.json);
            assert.ok(!snapshot.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(snapshot.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"strike",
            });
            snapshot=await adapter.getSnapshot();
            const before=snapshot.scene.entities.find((entity)=>entity.id===TARGET_ID)?.hp;
            assert.equal(typeof before,"number");
            await adapter.setQueuedD20(11);
            snapshot=await adapter.resolveAction(actionId,[TARGET_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(snapshot.resolution?.rollKind,"attack");
            assert.equal(snapshot.resolution?.rollTotal,15);
            assert.match(snapshot.resolution?.compact??"",/vs 15 .* success/);
            assert.equal(snapshot.scene.entities.find((entity)=>entity.id===TARGET_ID)?.hp,(before as number)-5);
            snapshot=await adapter.undoLastResolution();
            assert.equal(snapshot.scene.entities.find((entity)=>entity.id===TARGET_ID)?.hp,before);
          }

          test("unknown installed attack resolves target AC and actor damage from structural profile expressions under complete identity rename",async()=>{
            await exercise("external.unknown.family-j-target-ac");
            await exercise("external.renamed.family-j-target-ac");
          });
          EOF
      - name: Verify target-owned expression slice
        run: |
          npm run generate:content
          node --import tsx --test tests/ui/c9FamilyJTargetPropertyAttackProduction71304.test.ts tests/domain/c9CommonPlayActorExpressionRuntime.test.ts tests/ui/c9FamilyJRangeCoverProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified slice and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-target-expression-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyJTargetPropertyAttackProduction71304.test.ts
          git commit -m "feat(c9): resolve target-owned Common Play expressions"
          for attempt in $(seq 1 10); do
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 1
          done
          exit 1
