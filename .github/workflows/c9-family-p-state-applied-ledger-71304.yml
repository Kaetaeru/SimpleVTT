name: C9 Family P State Applied Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-state-applied-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Family P state-applied evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          text=path.read_text(encoding='utf-8')
          replacements=[
            (
              'Rest completion and recharge outcome semantic events are authoritative; state/expiry and automatic semantic-event trigger dispatcher composition remain incomplete; multi-target save-damage semantic outcomes now have production and rename-invariance evidence',
              'Rest completion, recharge outcomes, and state.applied semantic events are authoritative; unknown installed state.applied rules dispatch atomically through the shared semantic-event trigger composer with rename-invariant Undo. Effect expiry automatic trigger composition remains incomplete; multi-target save-damage semantic outcomes have production and rename-invariance evidence'
            ),
            (
              '        "commonPlaySemanticEventRuntime.ts derives authoritative rest.short.complete/rest.long.complete events from canonical short-rest/long-rest Resolver results"\n',
              '        "commonPlaySemanticEventRuntime.ts derives authoritative rest.short.complete/rest.long.complete events from canonical short-rest/long-rest Resolver results",\n        "commonPlaySemanticEventRuntime.ts plus installedCommonPlayRuntimeAdapter.ts compose state.applied rules from portable effect.apply operations through the same PendingResolution before authoritative commit"\n'
            ),
            (
              '        "5866e340e38e01a4a6606a8c5e4488473079b985 test(c9): cover rest completion semantic vocabulary; exact verifier run 33310807820 passed semantic test, tsc --noEmit, and coverage checker"\n',
              '        "5866e340e38e01a4a6606a8c5e4488473079b985 test(c9): cover rest completion semantic vocabulary; exact verifier run 33310807820 passed semantic test, tsc --noEmit, and coverage checker",\n        "8636b6ead7e4679a40168e67305bb54cf8d67ff9 feat(c9): dispatch state-applied rules from effect activation; exact verifier run 33312760234 passed state-applied production/domain regressions, V1 coverage checker, and tsc --noEmit"\n'
            ),
            (
              '        "commonPlaySemanticEventRuntime.test.ts rest completion vocabulary remains invariant under external source identity and semantic enrichment is idempotent"\n',
              '        "commonPlaySemanticEventRuntime.test.ts rest completion vocabulary remains invariant under external source identity and semantic enrichment is idempotent",\n        "c9FamilyPStateAppliedTriggerProduction.test.ts runs arbitrary unknown external state.applied modules under first/renamed identities with identical damage and Undo semantics"\n'
            ),
            (
              '        "remaining event-family dispatcher composition",\n',
              '        "effect.expired automatic trigger composition remains incomplete",\n'
            ),
          ]
          for old,new in replacements:
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'ledger anchor count {count}: {old[:80]}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit reconciled evidence and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-p-state-applied-ledger-71304.yml
          if [ -f .github/workflows/c9-family-p-state-applied-dispatch-71304.yml ]; then
            git rm .github/workflows/c9-family-p-state-applied-dispatch-71304.yml
          fi
          git commit -m "docs(c9): reconcile state-applied trigger evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
