name: C9 Family P Lifecycle Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-state-applied-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Family P reconciliation patch
        shell: bash
        run: |
          cat > /tmp/reconcile-family-p.py <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          family=next((entry for entry in data['rows'] if entry.get('family')=='P'),None)
          if family is None:
              raise SystemExit('Family P missing')
          if family.get('disposition')!='INCOMPLETE':
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              raise SystemExit(0)

          old=('Rest completion and recharge outcome semantic events are authoritative; state/expiry and automatic semantic-event trigger dispatcher composition remain incomplete; multi-target save-damage semantic outcomes now have production and rename-invariance evidence')
          new=('Rest completion, recharge outcome, state.applied, and effect.expired semantic events and automatic trigger composition are authoritative; multi-target save-damage semantic outcomes have production and rename-invariance evidence. Remaining Family P debt is confined to legacy named feature-trigger adapters that still select trigger execution by content identity.')
          current=family.get('currentState','')
          if old in current:
              family['currentState']=current.replace(old,new,1)

          additions={
              'implementationEvidence':[
                  'commonPlaySemanticEventRuntime.ts derives state.applied and effect.expired lifecycle semantics and composes their portable automatic rules into the same PendingResolution before authoritative commit',
              ],
              'productionEvidence':[
                  '8636b6ead7e4679a40168e67305bb54cf8d67ff9 feat(c9): dispatch state-applied rules from effect activation; c9FamilyPStateAppliedTriggerProduction.test.ts proves unknown installed production dispatch, rename invariance, atomic commit, and Undo',
                  '9795c095f06dfaa94492eea8d2a17e387c960f2b feat(c9): dispatch effect expiry semantic rules; C9 Family P Effect Expired Dispatch 7130 run 33312731941 passed the focused semantic dispatch verification and published the identity-invariant expiry regression',
              ],
              'identityInvarianceEvidence':[
                  'c9FamilyPStateAppliedTriggerProduction.test.ts runs arbitrary first/renamed unknown module, content, mechanic, and effect identities through the same state.applied production path',
                  'c9FamilyPEffectExpiredDispatch.test.ts proves effect.expired automatic dispatch is invariant under complete external definition identity rename',
              ],
          }
          for key,values in additions.items():
              target=family.setdefault(key,[])
              for value in values:
                  if value not in target:
                      target.append(value)

          obsolete={
              'remaining event-family dispatcher composition',
              'named post-roll and feature trigger adapters',
              'effect.expired automatic trigger composition remains incomplete',
          }
          seams=[seam for seam in family.get('remainingNamedSeams',[]) if seam not in obsolete]
          remaining='legacy named feature-trigger adapters still select trigger execution by content identity'
          if remaining not in seams:
              seams.append(remaining)
          family['remainingNamedSeams']=seams

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 /tmp/reconcile-family-p.py
      - name: Verify Family P reconciled slice
        run: |
          node --import tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts tests/domain/c9FamilyPEffectExpiredDispatch.test.ts tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish reconciliation and retire superseded verifiers
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 20); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 /tmp/reconcile-family-p.py
            git rm -f --ignore-unmatch \
              .github/workflows/c9-family-p-state-applied-ledger-71304.yml \
              .github/workflows/c9-family-p-expiry-dispatch-71304.yml \
              .github/workflows/c9-family-p-effect-expired-dispatch-7130.yml \
              .github/workflows/c9-family-p-state-applied-dispatch-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): reconcile lifecycle trigger evidence"
            node scripts/check-v1-mechanism-coverage.mjs
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 0.2
          done
          exit 1
