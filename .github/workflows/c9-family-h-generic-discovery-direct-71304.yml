name: C9 Family H Generic Discovery Direct 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-generic-discovery-direct-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Apply generic Family H discovery patch
        shell: bash
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import textwrap

          source=Path('.github/workflows/c9-family-h-generic-discovery-71304-r2.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          script=textwrap.dedent(source[start:end])
          compile(script,'c9-family-h-generic-discovery-71304-r2.yml','exec')
          exec(script,{'__name__':'__main__'})
          PYRUN
      - name: Verify generic Family H discovery
        run: |
          node --import tsx --test tests/ui/c9FamilyHSearchDiscovery.test.ts tests/ui/sessionStatusEffectEventRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified patch and retire verifiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-h-generic-discovery-direct-71304.yml
          git rm -f .github/workflows/c9-family-h-generic-discovery-71304-r2.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/sessionStatusEffectEventRuntimeAdapter.ts tests/ui/c9FamilyHSearchDiscovery.test.ts
          git diff --cached --check
          git commit -m "fix(c9): make hidden discovery identity independent"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
