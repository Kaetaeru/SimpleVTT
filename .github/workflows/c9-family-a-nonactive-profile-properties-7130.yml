name: C9 Family A Non-Active Profile Properties 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-a-nonactive-profile-properties-7130.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Preserve actor artifact properties and repair semantic narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          semantic=Path("src/domain/commonPlaySemanticEventRuntime.ts")
          text=semantic.read_text()
          text=text.replace('    const applied=authoritativeEvent.stateChanges.filter((change):change is EffectStateChange=>change.kind==="effect"&&change.operation==="added");','    const applied:EffectStateChange[]=[];\n    for(const change of authoritativeEvent.stateChanges) if(change.kind==="effect"&&change.operation==="added") applied.push(change);')
          text=text.replace('  const expired=authoritativeEvent.stateChanges.filter((change):change is EffectStateChange=>change.kind==="effect"&&change.operation==="removed");','  const expired:EffectStateChange[]=[];\n  for(const change of authoritativeEvent.stateChanges) if(change.kind==="effect"&&change.operation==="removed") expired.push(change);')
          semantic.write_text(text)

          artifact=Path("src/domain/resolutionArtifactOps.ts")
          text=artifact.read_text()
          section=text[text.index('function actorCombatant('):text.index('export function executeSpawnArtifact')]
          if 'baseProperties,' not in section:
            old='''  const maximum=Number(actor.properties["hp.maximum"]);\n  const speed=Number(actor.properties["movement.walk"]);\n  return {\n    id:actor.combatantId,\n    baseSpeed:speed,\n'''
            new='''  const maximum=Number(actor.properties["hp.maximum"]);\n  const speed=Number(actor.properties["movement.walk"]);\n  const baseProperties:Record<string,number>={};\n  for(const [property,value] of Object.entries(actor.properties)) {\n    if(typeof value==="number"&&Number.isFinite(value)) baseProperties[property]=value;\n  }\n  return {\n    id:actor.combatantId,\n    baseSpeed:speed,\n    baseProperties,\n'''
            if old not in text:
              raise SystemExit("resolutionArtifactOps actorCombatant anchor changed")
            artifact.write_text(text.replace(old,new,1))
          PY
      - name: Add actor artifact property regression
        shell: bash
        run: |
          cat > tests/ui/c9FamilyAActorArtifactBaseProperties.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { resolveCommonPlayArtifactActivation } from "../../src/domain/commonPlayArtifactRuntime";
          import { runtimeState, TEST_PROFILE } from "../domain/rulesTestState";

          test("unknown actor artifact preserves portable numeric profile properties on its runtime combatant",()=>{
            const committed=resolveCommonPlayArtifactActivation(TEST_PROFILE,runtimeState(),{
              schemaVersion:"0.2-draft",id:"external.unknown.actor-profile",
              entryPoints:[{id:"spawn",invocation:"manual",operations:[{kind:"artifact.spawn",template:"companion"}]}],
              artifactTemplates:[{id:"companion",artifactKind:"actor",duration:{kind:"durable"},lifetime:{kind:"durable"},initialState:{
                combatantId:"external.companion",statDefinitionId:"external.unknown.stat",ownerId:"hero",controllerId:"hero",side:"ally",initiative:"shared",
                properties:{"hp.maximum":12,"hp.current":9,"hp.temporary":0,"movement.walk":25,"defense.ac":13,"ability.str.score":14,"proficiency.bonus":2},
                actionDefinitionIds:[],resources:[],
              }}],
            },{resolutionId:"external-actor-profile-spawn",actorId:"hero",entryPointId:"spawn"});
            assert.equal(committed.status,"committed",committed.status==="rejected"?committed.error:undefined);
            if(committed.status!=="committed") throw new Error("expected committed actor artifact spawn");
            const actor=committed.state.combatants["external.companion"]!;
            assert.equal(actor.baseSpeed,25);
            assert.equal(actor.life.hp.current,9);
            assert.equal(actor.baseProperties?.["defense.ac"],13);
            assert.equal(actor.baseProperties?.["ability.str.score"],14);
            assert.equal(actor.baseProperties?.["proficiency.bonus"],2);
          });
          TS
      - name: Verify Family A chain and branch type health
        run: |
          npx tsx --test tests/ui/c9FamilyAActorArtifactBaseProperties.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Commit verified slice and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c9-family-a-nonactive-profile-properties-7130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlaySemanticEventRuntime.ts src/domain/resolutionArtifactOps.ts tests/ui/c9FamilyAActorArtifactBaseProperties.test.ts .github/workflows/c9-family-a-nonactive-profile-properties-7130.yml
          git commit -m "feat(c9): preserve actor artifact profile properties"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
