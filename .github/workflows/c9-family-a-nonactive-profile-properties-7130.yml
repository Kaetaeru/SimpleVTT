name: C9 Family A Non-Active Profile Properties 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-a-nonactive-profile-properties-7130.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Preserve and project generic non-active profile properties
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          artifact=Path("src/domain/resolutionArtifactOps.ts")
          text=artifact.read_text()
          segment=text[text.index('function actorCombatant('):text.index('export function executeSpawnArtifact')]
          if 'baseProperties,' not in segment:
            old='''  const maximum=Number(actor.properties["hp.maximum"]);\n  const speed=Number(actor.properties["movement.walk"]);\n  return {\n    id:actor.combatantId,\n    baseSpeed:speed,\n'''
            new='''  const maximum=Number(actor.properties["hp.maximum"]);\n  const speed=Number(actor.properties["movement.walk"]);\n  const baseProperties:Record<string,number>={};\n  for(const [property,value] of Object.entries(actor.properties)) {\n    if(typeof value==="number"&&Number.isFinite(value)) baseProperties[property]=value;\n  }\n  return {\n    id:actor.combatantId,\n    baseSpeed:speed,\n    baseProperties,\n'''
            if old not in text:
              raise SystemExit("resolutionArtifactOps actorCombatant anchor changed")
            artifact.write_text(text.replace(old,new,1))

          adapter=Path("src/app/installedCommonPlayRuntimeAdapter.ts")
          text=adapter.read_text()
          old='''  if(internal.activeCharacter.id!==actorId) {\n    const inputs:Record<string,number>={...(actorState.baseProperties??{})};\n    inputs["movement.walk"]??=actorState.baseSpeed;\n    const projected={...inputs};\n    for(const property of Object.keys(inputs).sort((left,right)=>left.localeCompare(right))) {\n      projected[property]=resolveRuntimeProfileProperty(state.effects,actorId,property,inputs).value;\n    }\n    return projected;\n  }\n'''
          new='''  if(internal.activeCharacter.id!==actorId) {\n    const inputs:Record<string,number>={\n      ...(actorState.baseProperties??{}),\n      "movement.walk":actorState.baseSpeed,\n      "hp.current":actorState.life.hp.current,\n      "hp.maximum":actorState.life.hp.maximum,\n      "hp.temporary":actorState.life.hp.temporary,\n    };\n    const projected={...inputs};\n    for(const [property,definition] of Object.entries(SIMPLEVTT_APP_RULES_PROFILE.properties)) {\n      if(!Number.isFinite(inputs[property])&&!definition.formula) continue;\n      try {\n        projected[property]=resolveRuntimeProfileProperty(state.effects,actorId,property,inputs).value;\n      } catch {\n        continue;\n      }\n    }\n    return projected;\n  }\n'''
          if old in text:
            adapter.write_text(text.replace(old,new,1))
          elif '"hp.current":actorState.life.hp.current' not in text[text.index('function commonPlayActorProfileProperties('):text.index('\nfunction operationExecutionInput(',text.index('function commonPlayActorProfileProperties('))]:
            raise SystemExit("non-active profile projection seam changed")
          PY
      - name: Add focused artifact regression
        shell: bash
        run: |
          cat > tests/ui/c9FamilyANonActiveProfileProperties.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { resolveCommonPlayArtifactActivation } from "../../src/domain/commonPlayArtifactRuntime";
          import { runtimeState, TEST_PROFILE } from "../domain/rulesTestState";

          test("unknown actor artifact preserves portable numeric properties on its runtime combatant",()=>{
            const committed=resolveCommonPlayArtifactActivation(TEST_PROFILE,runtimeState(),{
              schemaVersion:"0.2-draft",id:"external.unknown.actor-profile",
              entryPoints:[{id:"spawn",invocation:"manual",operations:[{kind:"artifact.spawn",template:"companion"}]}],
              artifactTemplates:[{id:"companion",artifactKind:"actor",duration:{kind:"durable"},lifetime:{kind:"durable"},initialState:{
                combatantId:"external.companion",statDefinitionId:"external.unknown.stat",ownerId:"hero",controllerId:"hero",side:"ally",initiative:"shared",
                properties:{"hp.maximum":12,"hp.current":9,"hp.temporary":0,"movement.walk":25,"defense.ac":13,"ability.str.score":14,"proficiency.bonus":2},
                actionDefinitionIds:[],resources:[],
              }}],
            },{resolutionId:"external-actor-profile-spawn",actorId:"hero",entryPointId:"spawn"});
            assert.equal(committed.status,"committed",committed.status==="rejected"?committed.error:undefined);
            if(committed.status!=="committed") throw new Error("expected committed actor artifact spawn");
            const companion=committed.state.combatants["external.companion"];
            assert.equal(companion?.baseProperties?.["ability.str.score"],14);
            assert.equal(companion?.baseProperties?.["defense.ac"],13);
            assert.equal(companion?.baseProperties?.["proficiency.bonus"],2);
          });
          TS
      - name: Verify Family A slice and branch type health
        run: |
          npx tsx --test tests/ui/c9FamilyANonActiveProfileProperties.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          npx tsc --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified slice and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c9-family-a-nonactive-profile-properties-7130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/resolutionArtifactOps.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyANonActiveProfileProperties.test.ts .github/workflows/c9-family-a-nonactive-profile-properties-7130.yml
          git commit -m "feat(c9): preserve non-active actor profile properties"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
