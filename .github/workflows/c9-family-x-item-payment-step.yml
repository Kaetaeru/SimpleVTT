          const ECONOMY_PAYMENT_KEYS=new Set(["kind","bucket","amount","consumeAt","refundOnCancel"]);
          ''',
          '''const RESOURCE_PAYMENT_KEYS=new Set(["kind","resource","amount","consumeAt"]);
          const ECONOMY_PAYMENT_KEYS=new Set(["kind","bucket","amount","consumeAt","refundOnCancel"]);
          const ITEM_PAYMENT_KEYS=new Set(["kind","selector","quantity","consumed","consumeAt","refundOnCancel"]);
          const ITEM_PAYMENT_SELECTOR_KEYS=new Set(["from","where","min","max"]);
          const ITEM_PAYMENT_PREDICATE_KEYS=new Set(["op","left","right"]);
          ''')
          replace_once(domain,
          '''function parsePayment(value:unknown,label:string):CommonPlayPayment {
          ''',
          '''function parseItemPaymentSelector(value:unknown,label:string):CommonPlayItemPayment["selector"] {
            const selector=object(value,label);
            supportedKeys(selector,ITEM_PAYMENT_SELECTOR_KEYS,label);
            if(selector.from!=="items") throw new DomainEvaluationError(`${label}.from must be items for portable Common Play item payment`);
            if(selector.min!==1||selector.max!==1) throw new DomainEvaluationError(`${label} must select exactly one item stack with min=1 and max=1`);
            const where=object(selector.where,`${label}.where`);
            supportedKeys(where,ITEM_PAYMENT_PREDICATE_KEYS,`${label}.where`);
            if(where.op!=="eq") throw new DomainEvaluationError(`${label}.where must use eq for portable Common Play item payment`);
            const left=object(where.left,`${label}.where.left`);
            const right=object(where.right,`${label}.where.right`);
            const leftIsDefinition=Object.keys(left).length===1&&left.ref==="item.definitionId";
            const rightIsDefinition=Object.keys(right).length===1&&right.ref==="item.definitionId";
            const leftValue=Object.keys(left).length===1&&typeof left.value==="string"?left.value:undefined;
            const rightValue=Object.keys(right).length===1&&typeof right.value==="string"?right.value:undefined;
            const definitionId=leftIsDefinition?rightValue:rightIsDefinition?leftValue:undefined;
            if(!definitionId) throw new DomainEvaluationError(`${label}.where must compare item.definitionId to one literal string`);
            return {from:"items",definitionId:nonEmptyString(definitionId,`${label}.where.definitionId`)};
          }

          function parsePayment(value:unknown,label:string):CommonPlayPayment {
          ''')
          replace_once(domain,
          '''    return {kind:"resource",resource,amount,consumeAt:"commit"};
            }
            if(payment.kind==="economy") {
          ''',
          '''    return {kind:"resource",resource,amount,consumeAt:"commit"};
            }
            if(payment.kind==="item") {
              supportedKeys(payment,ITEM_PAYMENT_KEYS,label);
              const selector=parseItemPaymentSelector(payment.selector,`${label}.selector`);
              const quantity=literalExpression(payment.quantity,`${label}.quantity`);
              if(quantity.value<=0) throw new DomainEvaluationError(`${label}.quantity must be a positive integer`);
              if(payment.consumed!==true) throw new DomainEvaluationError(`${label}.consumed must be true for portable Common Play item payment`);
              if(payment.consumeAt!=="commit") throw new DomainEvaluationError(`${label}.consumeAt must be commit for portable Common Play item payment`);
              if(payment.refundOnCancel!==undefined&&payment.refundOnCancel!==true) throw new DomainEvaluationError(`${label}.refundOnCancel must be true when present`);
              return {kind:"item",selector,quantity,consumed:true,consumeAt:"commit",refundOnCancel:true};
            }
            if(payment.kind==="economy") {
          ''')
          replace_once(domain,
          '''export function compileCommonPlayPayments(
            payments:CommonPlayPayment[]|undefined,
            input:CommonPlayOperationExecutionInput,
          ):ResolutionOperation[] {
            return (payments??[])
              .map((payment,index)=>({payment,index}))
              .sort((left,right)=>Number(right.payment.kind==="economy")-Number(left.payment.kind==="economy"))
              .map(({payment,index})=>payment.kind==="economy"?{
                id:`${input.resolutionId}:payment:${index}`,
                kind:"use-economy" as const,
                actorId:input.actorId,
                slot:payment.bucket,
                bonusActionGranted:payment.bucket==="bonus-action"||undefined,
                actionKind:input.actionKind,
              }:{
                id:`${input.resolutionId}:payment:${index}`,
                kind:"spend-resource" as const,
                actorId:input.actorId,
                resourceId:payment.resource,
                amount:literalInteger(payment.amount,"resource payment amount"),
              });
          }
          ''',
          '''export function compileCommonPlayPayments(
            payments:CommonPlayPayment[]|undefined,
            input:CommonPlayOperationExecutionInput,
          ):ResolutionOperation[] {
            const operations:ResolutionOperation[]=[];
            for(const {payment,index} of (payments??[])
              .map((payment,index)=>({payment,index}))
              .sort((left,right)=>Number(right.payment.kind==="economy")-Number(left.payment.kind==="economy"))) {
              if(payment.kind==="economy") {
                operations.push({
                  id:`${input.resolutionId}:payment:${index}`,kind:"use-economy",actorId:input.actorId,slot:payment.bucket,
                  bonusActionGranted:payment.bucket==="bonus-action"||undefined,actionKind:input.actionKind,
                });
                continue;
              }
              const resourceId=payment.kind==="resource"?payment.resource:input.itemPaymentResourceIds?.[index];
              if(!resourceId) throw new DomainEvaluationError(`Common Play item payment ${index} requires one pre-resolved item stack`);
              operations.push({
                id:`${input.resolutionId}:payment:${index}`,kind:"spend-resource",actorId:input.actorId,resourceId,
                amount:literalInteger(payment.kind==="resource"?payment.amount:payment.quantity,payment.kind==="resource"?"resource payment amount":"item payment quantity"),
              });
            }
            return operations;
          }
          ''')

          adapter="src/app/installedCommonPlayRuntimeAdapter.ts"
          replace_once(adapter,
          '''function operationDefinition(action:CommonPlayProductionAction) {
            return action.lowered.kind==="operations"?action.lowered.definition:undefined;
          }

          function seedReferencedResources(
          ''',
          '''function operationDefinition(action:CommonPlayProductionAction) {
            return action.lowered.kind==="operations"?action.lowered.definition:undefined;
          }

          const itemQuantityResourceId=(itemId:string)=>`phase09:item:${itemId}:quantity`;

          function itemPaymentRuntimeContext(internal:AdapterState,state:RulesRuntimeState,definition:CommonPlayOperationDefinition) {
            const payments=definition.payments??[];
            if(!payments.some((payment)=>payment.kind==="item")) return {state,itemPaymentResourceIds:undefined as Record<number,string>|undefined,ephemeralResourceIds:[] as string[]};
            const next=structuredClone(state);
            const combatant=next.combatants[internal.activeCharacter.id];
            if(!combatant) throw new Error(`Common Play item payment actor is missing: ${internal.activeCharacter.id}`);
            const itemPaymentResourceIds:Record<number,string>={};
            const ephemeralResourceIds:string[]=[];
            for(const [index,payment] of payments.entries()) {
              if(payment.kind!=="item") continue;
              const matches=internal.activeCharacter.items.filter((item)=>item.definitionId===payment.selector.definitionId);
              if(matches.length!==1) throw new Error(`Common Play item payment selector must resolve exactly one stack: ${payment.selector.definitionId}`);
              const item=matches[0];
              const resourceId=itemQuantityResourceId(item.id);
              combatant.resources=combatant.resources.filter((resource)=>resource.id!==resourceId);
              combatant.resources.push({id:resourceId,label:`${item.name} quantity`,current:item.quantity,maximum:item.quantity});
              itemPaymentResourceIds[index]=resourceId;
              ephemeralResourceIds.push(resourceId);
            }
            return {state:next,itemPaymentResourceIds,ephemeralResourceIds};
          }

          function stripItemPaymentRuntimeResources(state:RulesRuntimeState,actorId:string,resourceIds:string[]) {
            if(!resourceIds.length) return;
            const combatant=state.combatants[actorId];
            if(combatant) combatant.resources=combatant.resources.filter((resource)=>!resourceIds.includes(resource.id));
          }

          function seedReferencedResources(
          ''')
          replace_once(adapter,
          '''  resolutionId:string,
            interactionId?:string,
          ):import("../domain/commonPlayOperationRuntime").CommonPlayOperationExecutionInput {
          ''',
          '''  resolutionId:string,
            interactionId?:string,
            itemPaymentResourceIds?:Record<number,string>,
          ):import("../domain/commonPlayOperationRuntime").CommonPlayOperationExecutionInput {
          ''')
          replace_once(adapter,
          '''    actionKind:entryPoint.test?.kind==="attack-roll"?"attack" as const:action.category==="spell"?"magic" as const:"other" as const,
              ...(interactionId?{interactionResponse:{interactionId,accepted:true as const}}:{}),
            };
          }
          ''',
          '''    actionKind:entryPoint.test?.kind==="attack-roll"?"attack" as const:action.category==="spell"?"magic" as const:"other" as const,
              ...(interactionId?{interactionResponse:{interactionId,accepted:true as const}}:{}),
              ...(itemPaymentResourceIds?{itemPaymentResourceIds}:{}),
            };
          }
          ''')
          replace_once(adapter,
          '''  let invocation;
            try {
              invocation=compileCommonPlayEntryPointOperations(
                SIMPLEVTT_APP_RULES_PROFILE,state,action.lowered.definition,
                operationExecutionInput(internal,definitionActionId,action,prepared,resolutionId),
              );
            } catch(error) {
              return failAction(internal,stored.ownerActorId,actionId,action.nameKo||action.nameEn,targetIds,resolutionId,error instanceof Error?error.message:String(error));
            }
            const committed=resolveCommonPlayStoredInvocationTrigger(SIMPLEVTT_APP_RULES_PROFILE,state,{
          ''',
          '''  let invocation;
            let itemContext:ReturnType<typeof itemPaymentRuntimeContext>;
            try {
              itemContext=itemPaymentRuntimeContext(internal,state,action.lowered.definition);
              invocation=compileCommonPlayEntryPointOperations(
                SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,action.lowered.definition,
                operationExecutionInput(internal,definitionActionId,action,prepared,resolutionId,undefined,itemContext.itemPaymentResourceIds),
              );
            } catch(error) {
              return failAction(internal,stored.ownerActorId,actionId,action.nameKo||action.nameEn,targetIds,resolutionId,error instanceof Error?error.message:String(error));
            }
            const committed=resolveCommonPlayStoredInvocationTrigger(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,{
          ''')
          replace_once(adapter,
          '''  if(committed.status==="no-match") return failAction(internal,stored.ownerActorId,actionId,action.nameKo||action.nameEn,targetIds,resolutionId,committed.reason);
            if(committed.status==="rejected") return failAction(internal,stored.ownerActorId,actionId,action.nameKo||action.nameEn,targetIds,resolutionId,committed.error);
            const targets=targetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id)).filter((target):target is SceneVm["entities"][number]=>Boolean(target));
          ''',
          '''  if(committed.status==="no-match") return failAction(internal,stored.ownerActorId,actionId,action.nameKo||action.nameEn,targetIds,resolutionId,committed.reason);
            if(committed.status==="rejected") return failAction(internal,stored.ownerActorId,actionId,action.nameKo||action.nameEn,targetIds,resolutionId,committed.error);
            stripItemPaymentRuntimeResources(committed.state,stored.ownerActorId,itemContext.ephemeralResourceIds);
            const targets=targetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id)).filter((target):target is SceneVm["entities"][number]=>Boolean(target));
          ''')
          replace_once(adapter,
          '''    const entryPoint=lowered.definition.entryPoints.find((candidate)=>candidate.id===action.entryPointId)!;
              operationEntryPoint=entryPoint;
              const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionId));
              const automaticPending=appendCommonPlayDamageTakenTriggers(
                state,await installedPersistentEffectDefinitions(adapter),pending,actorEntity.kind==="character"?"character":"monster",
              );
              committed=appendCommonPlaySemanticOutcomeEvents(
                automaticPending,
                resolvePendingResolution(SIMPLEVTT_APP_RULES_PROFILE,state,automaticPending),
              );
          ''',
          '''    const entryPoint=lowered.definition.entryPoints.find((candidate)=>candidate.id===action.entryPointId)!;
              operationEntryPoint=entryPoint;
              const itemContext=itemPaymentRuntimeContext(internal,state,lowered.definition);
              const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionId,itemContext.itemPaymentResourceIds));
              const automaticPending=appendCommonPlayDamageTakenTriggers(
                itemContext.state,await installedPersistentEffectDefinitions(adapter),pending,actorEntity.kind==="character"?"character":"monster",
              );
              committed=appendCommonPlaySemanticOutcomeEvents(automaticPending,resolvePendingResolution(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,automaticPending));
              if(committed.status==="committed") stripItemPaymentRuntimeResources(committed.state,actor.id,itemContext.ephemeralResourceIds);
          ''')

          m1=Path(".github/workflows/m1-common-play-resource-economy.yml")
          text=m1.read_text()
          path_line='      - "tests/ui/installedCommonPlayItemPaymentProduction.test.ts"\n'
          anchor='      - "tests/ui/phase09CommonPlayResourcePersistence.test.ts"\n'
          if path_line not in text:
              text=text.replace(anchor,anchor+path_line,2)
          old='tests/ui/installedCommonPlayProductionRuntime.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts tests/ui/fighterActionSurgeRuntimeAdapter.test.ts'
          new='tests/ui/installedCommonPlayProductionRuntime.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts tests/ui/installedCommonPlayItemPaymentProduction.test.ts tests/ui/fighterActionSurgeRuntimeAdapter.test.ts'
          if new not in text:
              if old not in text: raise SystemExit("missing M1 command anchor")
              text=text.replace(old,new,1)
          m1.write_text(text)
          PY

          cat > tests/ui/installedCommonPlayItemPaymentProduction.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { getCharacterLibraryPersistenceStateForTests, setCharacterLibraryStoreForTests } from "../../src/app/characterLibraryRuntimeAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryCharacterLibraryStore } from "../../src/app/memoryCharacterLibraryStore";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";

          interface Identity { moduleId:string;contentId:string;mechanicId:string;entryPointId:string;displayName:string; }
          const ITEM_ID="item.potion.aelar";
          const ITEM_DEFINITION_ID="item.potion-of-healing";
          const IDENTITY:Identity={moduleId:"homebrew.family-x-item-payment",contentId:"option.family-x-item-payment",mechanicId:"external.unknown.family-x-item-payment",entryPointId:"consume",displayName:"Portable Item Payment"};
          const RENAMED:Identity={moduleId:"homebrew.renamed-family-x",contentId:"option.renamed-family-x",mechanicId:"external.renamed.family-x",entryPointId:"pay",displayName:"Renamed Portable Item Payment"};

          function packagePayload(identity:Identity) {
            return JSON.stringify({schemaVersion:"0.1-draft",moduleId:identity.moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",source:{document:"Family X Item Payment Probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],content:[{id:identity.contentId,category:"option",presentation:{defaultLocale:"en",originalName:identity.displayName,locales:{en:{name:identity.displayName,description:"Portable item quantity payment probe"}}},mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:identity.mechanicId,payments:[{kind:"item",selector:{from:"items",where:{op:"eq",left:{ref:"item.definitionId"},right:{value:ITEM_DEFINITION_ID}},min:1,max:1},quantity:{value:1},consumed:true,consumeAt:"commit",refundOnCancel:true}],entryPoints:[{id:identity.entryPointId,invocation:"manual",operations:[]}]}}]}]});
          }
          function activeItemQuantity(adapter:MockAdapter) { return (adapter as unknown as {activeCharacter:{items:Array<{id:string;quantity:number}>}}).activeCharacter.items.find((item)=>item.id===ITEM_ID)?.quantity; }
          function persistedItemQuantity(adapter:MockAdapter,characterId:string) { return getCharacterLibraryPersistenceStateForTests(adapter)?.document?.characters.find((entry)=>entry.characterId===characterId)?.runtime.items.find((item)=>item.id===ITEM_ID)?.quantity; }
          async function restartedItemQuantity(store:MemoryCharacterLibraryStore) { const restarted=new MockAdapter();setCharacterLibraryStoreForTests(restarted,store);return (await restarted.getSnapshot()).activeCharacter.items.find((item)=>item.id===ITEM_ID)?.quantity; }
          async function install(adapter:MockAdapter,identity:Identity) { setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());const preview=await adapter.previewContentImport(packagePayload(identity));assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));await adapter.activateContentImport();return installedCommonPlayActionId({catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),mechanicId:identity.mechanicId,entryPointId:identity.entryPointId}); }

          test("unknown installed Common Play item payment persists through restart and event-native Undo",async()=>{
            const characterStore=new MemoryCharacterLibraryStore();const adapter=new MockAdapter();setCharacterLibraryStoreForTests(adapter,characterStore);const actionId=await install(adapter,IDENTITY);await adapter.startInitiative();await adapter.setCurrentActor("char.aelar");let snapshot=await adapter.getSnapshot();const characterId=snapshot.activeCharacter.id;assert.equal(activeItemQuantity(adapter),2);await adapter.resolveAction(actionId,[characterId]);snapshot=await adapter.getSnapshot();assert.equal(snapshot.resolution?.stage,"complete");assert.equal(activeItemQuantity(adapter),1);assert.equal(persistedItemQuantity(adapter,characterId),1);assert.equal(await restartedItemQuantity(characterStore),1);await adapter.undoLastResolution();assert.equal(activeItemQuantity(adapter),2);assert.equal(persistedItemQuantity(adapter,characterId),2);assert.equal(await restartedItemQuantity(characterStore),2);
          });
          test("portable item payment execution is invariant to external module/content/mechanic/display identity",async()=>{
            const adapter=new MockAdapter();const actionId=await install(adapter,RENAMED);await adapter.startInitiative();await adapter.setCurrentActor("char.aelar");const characterId=(await adapter.getSnapshot()).activeCharacter.id;assert.equal(activeItemQuantity(adapter),2);await adapter.resolveAction(actionId,[characterId]);assert.equal(activeItemQuantity(adapter),1);
          });
          TS
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family X portable item payment
        run: npx tsx --test tests/ui/installedCommonPlayItemPaymentProduction.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified bridge and remove helper
        if: success()
        run: |
          rm .github/workflows/c9-family-x-item-payment-step.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayItemPaymentProduction.test.ts .github/workflows/m1-common-play-resource-economy.yml .github/workflows/c9-family-x-item-payment-step.yml
          git commit -m "feat(c9): route portable item payments through resolver"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
