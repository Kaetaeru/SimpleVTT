name: C9 Family X Item Payment Step

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-x-item-payment-step.yml"

permissions:
  contents: write

jobs:
  item-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch portable item payment bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/c9-family-x-item-payment-step.py')
          text=p.read_text()
          start=text.index('\nm1 = Path(".github/workflows/m1-common-play-resource-economy.yml")')
          end=text.index('\n\nPath("tests/ui/installedCommonPlayItemPaymentProduction.test.ts")',start)
          p.write_text(text[:start]+text[end:])
          PY
          python .github/scripts/c9-family-x-item-payment-step.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family X portable item payment
        run: npx tsx --test tests/ui/installedCommonPlayItemPaymentProduction.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified bridge and remove helpers
        if: success()
        run: |
          rm .github/workflows/c9-family-x-item-payment-step.yml .github/scripts/c9-family-x-item-payment-step.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayItemPaymentProduction.test.ts .github/workflows/c9-family-x-item-payment-step.yml .github/scripts/c9-family-x-item-payment-step.py
          git commit -m "feat(c9): route portable item payments through resolver"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
