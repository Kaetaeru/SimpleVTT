name: C9 Family X Item Payment Step

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-x-item-payment-step.yml"

permissions:
  contents: write

jobs:
  item-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch portable item payment bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1))

          domain="src/domain/commonPlayOperationRuntime.ts"
          replace_once(domain,
          '''export type CommonPlayEconomyPayment={
            kind:"economy";
            bucket:TurnSlot;
            amount:LiteralNumberExpression;
            consumeAt:"commit";
            refundOnCancel:true;
          };

          export type CommonPlayPayment=CommonPlayResourcePayment|CommonPlayEconomyPayment;
          ''',
          '''export type CommonPlayEconomyPayment={
