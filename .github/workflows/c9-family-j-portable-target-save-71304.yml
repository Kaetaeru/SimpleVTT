name: C9 Family J Portable Target Save 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-j-portable-target-save-71304.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast-forward to current branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - name: Patch portable target saving control
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count!=1: raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old,new,1))
          domain="src/domain/commonPlayOperationRuntime.ts"
          replace_once(domain,'type CommonPlayConditionChange={\n  kind:"condition.apply"|"condition.remove";\n  condition:ConditionId;\n  target?:CommonPlayConditionTarget;\n};','type CommonPlayTestOutcomePredicate={op:"eq";left:{ref:"test.outcome"};right:{value:"success"|"failure"}};\ntype CommonPlayConditionChange={\n  kind:"condition.apply"|"condition.remove";\n  condition:ConditionId;\n  target?:CommonPlayConditionTarget;\n  when?:CommonPlayTestOutcomePredicate;\n};')
          replace_once(domain,'export interface CommonPlayD20TestDefinition {\n  kind:D20TestFamily;\n  roller:"actor";\n  dc:LiteralNumberExpression;\n  perTarget?:false;\n}','export interface CommonPlayD20TestDefinition {\n  kind:D20TestFamily;\n  roller:"actor"|"target";\n  property?:string;\n  dc:LiteralNumberExpression;\n  perTarget?:false;\n}')
          replace_once(domain,'const CONDITION_CHANGE_KEYS=new Set(["kind","condition","target"]);','const CONDITION_CHANGE_KEYS=new Set(["kind","condition","target","when"]);')
          marker='function numericExpression(value:unknown,label:string):CommonPlayExpression {'
          helper='''function testOutcomePredicate(value:unknown,label:string):CommonPlayTestOutcomePredicate|undefined {\n  if(value===undefined) return undefined;\n  const predicate=object(value,label);\n  supportedKeys(predicate,new Set(["op","left","right"]),label);\n  const left=object(predicate.left,`${label}.left`);\n  const right=object(predicate.right,`${label}.right`);\n  supportedKeys(left,new Set(["ref"]),`${label}.left`);\n  supportedKeys(right,new Set(["value"]),`${label}.right`);\n  if(predicate.op!=="eq"||left.ref!=="test.outcome"||(right.value!=="success"&&right.value!=="failure")) throw new DomainEvaluationError(`${label} currently supports only test.outcome == success|failure`);\n  return {op:"eq",left:{ref:"test.outcome"},right:{value:right.value}};\n}\n\n'''+marker
          replace_once(domain,marker,helper)
          replace_once(domain,'const CONDITION_CHANGE_KEYS=new Set(["kind","condition","target","when"]);\nconst TEMP_HP_GRANT_KEYS', 'const CONDITION_CHANGE_KEYS=new Set(["kind","condition","target","when"]);\nconst TEMP_HP_GRANT_KEYS')
          replace_once(domain,'const target=conditionTarget(operation.target,`${label}.target`);\n    return {kind:operation.kind,condition,...(target===undefined?{}:{target})};','const target=conditionTarget(operation.target,`${label}.target`);\n    const when=testOutcomePredicate(operation.when,`${label}.when`);\n    return {kind:operation.kind,condition,...(target===undefined?{}:{target}),...(when?{when}:{})};')
          old='''function parseD20Test(value:unknown,label:string):CommonPlayD20TestDefinition {\n  const definition=object(value,label);\n  supportedKeys(definition,D20_TEST_KEYS,label);\n  if(definition.kind!=="ability-check"&&definition.kind!=="saving-throw"&&definition.kind!=="attack-roll") {\n    throw new DomainEvaluationError(`${label}.kind is unsupported`);\n  }\n  if(definition.roller!=="actor") throw new DomainEvaluationError(`${label}.roller must be actor for portable Common Play d20`);\n  if(definition.property!==undefined) throw new DomainEvaluationError(`${label}.property-backed modifiers are not supported by this Common Play d20 slice`);\n  if(definition.perTarget!==undefined&&definition.perTarget!==false) throw new DomainEvaluationError(`${label}.perTarget must be false for an actor d20 test`);\n  return {\n    kind:definition.kind,\n    roller:"actor",\n    dc:literalExpression(definition.dc,`${label}.dc`),\n    ...(definition.perTarget===false?{perTarget:false}:{}),\n  };\n}'''
          new='''function parseD20Test(value:unknown,label:string):CommonPlayD20TestDefinition {\n  const definition=object(value,label);\n  supportedKeys(definition,D20_TEST_KEYS,label);\n  if(definition.kind!=="ability-check"&&definition.kind!=="saving-throw"&&definition.kind!=="attack-roll") throw new DomainEvaluationError(`${label}.kind is unsupported`);\n  if(definition.roller!=="actor"&&definition.roller!=="target") throw new DomainEvaluationError(`${label}.roller must be actor or target for portable Common Play d20`);\n  const property=definition.property===undefined?undefined:nonEmptyString(definition.property,`${label}.property`);\n  if(definition.roller==="target"&&!property) throw new DomainEvaluationError(`${label}.property is required for a target-rolled portable Common Play d20 test`);\n  if(definition.perTarget!==undefined&&definition.perTarget!==false) throw new DomainEvaluationError(`${label}.perTarget must be false for a single portable Common Play d20 test`);\n  return {kind:definition.kind,roller:definition.roller,...(property?{property}:{}),dc:literalExpression(definition.dc,`${label}.dc`),...(definition.perTarget===false?{perTarget:false}:{})};\n}'''
          replace_once(domain,old,new)
          replace_once(domain,'const reactionPaymentCount=payments?.filter((payment)=>payment.kind==="economy"&&payment.bucket==="reaction").length??0;','''for(const [index,entryPoint] of entryPoints.entries()) {\n  if(entryPoint.test?.roller==="target"&&(!entryPoint.targeting||entryPoint.targeting.min!==1||entryPoint.targeting.max!==1)) throw new DomainEvaluationError(`${label}.entryPoints[${index}] target-rolled d20 requires targeting exactly one target`);\n  if(entryPoint.operations.some((operation)=>(operation.kind==="condition.apply"||operation.kind==="condition.remove")&&operation.when)&&!entryPoint.test) throw new DomainEvaluationError(`${label}.entryPoints[${index}] test.outcome condition requires a d20 test`);\n}\nconst reactionPaymentCount=payments?.filter((payment)=>payment.kind==="economy"&&payment.bucket==="reaction").length??0;''')
          replace_once(domain,'if(!input.d20) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires authoritative d20 input`);\n    const rollModifications:', 'if(!input.d20) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires authoritative d20 input`);\n    const rollerId=entryPoint.test.roller==="target"?input.targetId:input.actorId;\n    if(!rollerId) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} target roller requires one pre-resolved target`);\n    const rollModifications:')
          replace_once(domain,'actorId:input.actorId,\n      targetId:input.d20.targetId,','actorId:rollerId,\n      targetId:entryPoint.test.roller==="target"?input.actorId:input.d20.targetId,')
          replace_once(domain,'const targetId=conditionOperationTarget(operation.target,input);\n      if(operation.kind==="condition.apply") {','const targetId=conditionOperationTarget(operation.target,input);\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome",equals:operation.when.right.value}:undefined;\n      if(operation.kind==="condition.apply") {')
          replace_once(domain,'id:operationId,kind:"apply-effect",\n          effect:', 'id:operationId,kind:"apply-effect",...(when?{when}:{}),\n          effect:')
          replace_once(domain,'operations.push({id:operationId,kind:"remove-effect",effectId:effect.id});','operations.push({id:operationId,kind:"remove-effect",effectId:effect.id,...(when?{when}:{})});')
          app="src/app/installedCommonPlayRuntimeAdapter.ts"
          replace_once(app,'import type { ActionVm, AppSnapshot, CatalogEntry, CharacterSheet, DamageComponentView, ResolutionView, SceneVm, SessionMode } from "./contracts";','import type { ActionVm, AppSnapshot, CatalogEntry, CharacterSheet, CombatantDefinitionVm, DamageComponentView, ResolutionView, SceneVm, SessionMode } from "./contracts";')
          replace_once(app,'import { resolveRuntimeProfileProperty, SIMPLEVTT_APP_RULES_PROFILE } from "./realResolutionService";','import { resolveRuntimeProfileProperty, SIMPLEVTT_APP_RULES_PROFILE } from "./realResolutionService";\nimport { resolveRuntimeSaveModifier } from "./realRuntimeStatProvider";')
          replace_once(app,'activeCharacter:CharacterSheet;\n  resolution:ResolutionView|null;','activeCharacter:CharacterSheet;\n  combatantDefinitions:CombatantDefinitionVm[];\n  resolution:ResolutionView|null;')
          marker='function operationExecutionInput(\n  internal:AdapterState,'
          helper='''function commonPlayTestModifierContributions(internal:AdapterState,state:RulesRuntimeState,rollerId:string,property:string|undefined) {\n  if(!property) return undefined;\n  const roller=internal.scene.entities.find((entity)=>entity.id===rollerId);\n  if(!roller) throw new Error(`Common Play d20 roller not found: ${rollerId}`);\n  const save=property.match(/^save\\.(str|dex|con|int|wis|cha)\\.modifier$/);\n  if(save) {\n    const fact=resolveRuntimeSaveModifier(roller,internal.activeCharacter,save[1],internal.combatantDefinitions);\n    return [{source:fact.source,value:fact.modifier}];\n  }\n  const value=commonPlayActorProfileProperties(internal,state,rollerId)?.[property];\n  if(!Number.isFinite(value)) throw new Error(`Common Play d20 property is unavailable: ${property}`);\n  return [{source:`profile:${rollerId}:${property}`,value:Number(value)}];\n}\n\n'''+marker
          replace_once(app,marker,helper)
          replace_once(app,'const d20Faces=entryPoint.test?[internal.d20(actionId,0),internal.d20(actionId,1)]:undefined;','const d20Faces=entryPoint.test?[internal.d20(actionId,0),internal.d20(actionId,1)]:undefined;\n  const d20RollerId=entryPoint.test?.roller==="target"?selectedTargetId:actor.id;\n  const d20ModifierContributions=entryPoint.test?commonPlayTestModifierContributions(internal,state,d20RollerId,entryPoint.test.property):undefined;')
          replace_once(app,'...(entryPoint.test?{d20:{faces:d20Faces!,targetId:selectedTargetId}}:{}),','...(entryPoint.test?{d20:{faces:d20Faces!,targetId:selectedTargetId,...(d20ModifierContributions?{modifierContributions:d20ModifierContributions}:{})}}:{}),')
          Path("tests/ui/c9FamilyJPortableControlProduction.test.ts").write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport "../../src/app/offlineRuntimeAdapters";\nimport "../../src/app/installedContentRuntimeAdapter";\nimport { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";\nimport { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";\nimport { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";\nimport { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";\nimport { MockAdapter } from "../../src/app/mockAdapter";\nimport { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";\nconst TARGET_ID="combatant.goblin-a";\nfunction packagePayload(prefix:string){const moduleId=`${prefix}.module`,contentId=`${prefix}.control`,mechanicId=`${prefix}.mechanic`;const config={schemaVersion:"0.2-draft",id:mechanicId,payments:[{kind:"economy",bucket:"action",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],entryPoints:[{id:"grapple-dex-probe",invocation:"manual",targeting:{from:"targets",min:1,max:1},test:{kind:"saving-throw",roller:"target",property:"save.dex.modifier",dc:{value:12},perTarget:false},operations:[{kind:"condition.apply",condition:"grappled",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"failure"}}}]}]};return{moduleId,contentId,mechanicId,json:JSON.stringify({schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",source:{document:"Family J portable control probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Control Probe",locales:{en:{name:"Portable Control Probe"}}},mechanics:[{kind:"common-play",config}]}]})};}\nasync function exercise(prefix:string){const adapter=new MockAdapter();const pack=packagePayload(prefix);setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());let snapshot=await adapter.previewContentImport(pack.json);assert.ok(!snapshot.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(snapshot.contentImport?.validation));await adapter.activateContentImport();await adapter.startInitiative();await adapter.setCurrentActor("char.aelar");const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"grapple-dex-probe"});await adapter.setQueuedD20(1);snapshot=await adapter.resolveAction(actionId,[TARGET_ID]);assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));assert.equal(snapshot.resolution?.rollKind,"save");assert.equal(snapshot.resolution?.rollTotal,3);assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===TARGET_ID&&effect.conditionId==="grappled"),true);assert.equal(snapshot.scene.economyByActor["char.aelar"]?.action,false);await adapter.undoLastResolution();snapshot=await adapter.getSnapshot();assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===TARGET_ID&&effect.conditionId==="grappled"),false);assert.equal(snapshot.scene.economyByActor["char.aelar"]?.action,true);await adapter.setQueuedD20(20);snapshot=await adapter.resolveAction(actionId,[TARGET_ID]);assert.equal(snapshot.resolution?.rollTotal,22);assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===TARGET_ID&&effect.conditionId==="grappled"),false);}\ntest("unknown installed Common Play can target-roll a save and conditionally apply control under identity rename",async()=>{await exercise("unknown-family-j-control");await exercise("renamed-family-j-control");});\n''')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify portable target save control
        run: npx tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/unarmedStrikeRuntime.test.ts tests/ui/c9FamilyMConditionImmunityProduction.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Publish verified slice and retire verifier
        run: |
          git rm .github/workflows/c9-family-j-portable-target-save-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyJPortableControlProduction.test.ts
          git commit -m "feat(c9): lower portable target saving control"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
