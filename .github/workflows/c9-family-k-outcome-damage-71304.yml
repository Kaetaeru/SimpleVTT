name: C9 Family K Outcome Damage 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [".github/workflows/c9-family-k-outcome-damage-71304.yml"]

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Apply generic outcome-conditioned damage slice
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("src/domain/commonPlayOperationRuntime.ts")
          s=p.read_text(encoding="utf-8")
          def r(old,new):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f"expected one anchor, found {n}: {old[:100]!r}")
              s=s.replace(old,new,1)
          r('  multiplier?:number;\n  target?:CommonPlayHpTarget;\n};','  multiplier?:number;\n  target?:CommonPlayHpTarget;\n  when?:CommonPlayTestOutcomePredicate;\n};')
          r('const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target"]);','const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target","when"]);')
          r('    const multiplier=operation.multiplier;\n    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);\n    return {\n      kind:"damage.apply",\n      amount,\n      damageType:nonEmptyString(operation.damageType,`${label}.damageType`),\n      ...(multiplier===undefined?{}:{multiplier}),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n    };','    const multiplier=operation.multiplier;\n    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);\n    const when=testOutcomePredicate(operation.when,`${label}.when`);\n    return {\n      kind:"damage.apply",\n      amount,\n      damageType:nonEmptyString(operation.damageType,`${label}.damageType`),\n      ...(multiplier===undefined?{}:{multiplier}),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n      ...(when?{when}:{}),\n    };')
          r('  if(entryPoint.operations.some((operation)=>(operation.kind==="condition.apply"||operation.kind==="condition.remove"||operation.kind==="effect.remove")&&operation.when)&&!entryPoint.test) throw new DomainEvaluationError(`${label}.entryPoints[${index}] test.outcome conditional operation requires a d20 test`);','  if(entryPoint.operations.some((operation)=>(operation.kind==="condition.apply"||operation.kind==="condition.remove"||operation.kind==="effect.remove"||operation.kind==="damage.apply")&&operation.when)&&!entryPoint.test) throw new DomainEvaluationError(`${label}.entryPoints[${index}] test.outcome conditional operation requires a d20 test`);')
          r('    if(operation.kind==="damage.apply") {\n      const targetId=hpOperationTarget(operation.target,input);','    if(operation.kind==="damage.apply") {\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome" as const,equals:operation.when.right.value}:undefined;\n      const targetId=hpOperationTarget(operation.target,input);')
          r('        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          request:{','        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          ...(when?{when}:{}),\n          request:{')
          r('      operations.push({\n        id:operationId,\n        kind:"damage",\n        targetId,','      operations.push({\n        id:operationId,\n        kind:"damage",\n        ...(when?{when}:{}),\n        targetId,')
          p.write_text(s,encoding="utf-8")
          sp=Path("schemas/common-play-contract.schema.json")
          schema=json.loads(sp.read_text(encoding="utf-8"))
          props=schema["$defs"]["damageApply"]["properties"]
          expected={"$ref":"#/$defs/predicate"}
          if props.get("when") not in (None,expected): raise SystemExit("incompatible damageApply.when schema")
          props["when"]=expected
          sp.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          cat > tests/ui/c9FamilyKOutcomeDamageProduction.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { runtimeResolutionEventHistory } from "../../src/app/runtimeResolutionEventHistory";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";
          const TARGET_ID="combatant.goblin-a";
          function payload(prefix:string){const moduleId=`${prefix}.module`,contentId=`${prefix}.mastery-probe`,mechanicId=`${prefix}.mechanic`;return{moduleId,contentId,mechanicId,json:JSON.stringify({schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",source:{document:"Family K outcome-conditioned damage probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Mastery Probe",locales:{en:{name:"Portable Mastery Probe"}}},mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{id:"graze-like-miss-rider",invocation:"manual",targeting:{from:"targets",min:1,max:1},test:{kind:"attack-roll",roller:"actor",dc:{value:10}},operations:[{kind:"damage.apply",amount:{value:3},damageType:"force",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"failure"}}}]}]}}]}]})};}
          async function prepare(prefix:string){const adapter=new MockAdapter(),pack=payload(prefix);setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());const preview=await adapter.previewContentImport(pack.json);assert.ok(!preview.contentImport?.validation.some((e)=>e.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));await adapter.activateContentImport();await adapter.startInitiative();await adapter.setCurrentActor("char.aelar");return{adapter,actionId:installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"graze-like-miss-rider"})};}
          function hp(adapter:MockAdapter,snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>){const target=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.combatants[TARGET_ID];assert.ok(target);return target.life.hp.current;}
          async function exercise(prefix:string,face:number){const{adapter,actionId}=await prepare(prefix);let snapshot=await adapter.getSnapshot();const before=hp(adapter,snapshot);await adapter.setQueuedD20(face);snapshot=await adapter.resolveAction(actionId,[TARGET_ID]);assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));const after=hp(adapter,snapshot);const changes=runtimeResolutionEventHistory(adapter)?.events.filter((e)=>e.stateChanges.some((c)=>c.kind==="hp"&&c.field==="current"&&c.targetId===TARGET_ID))??[];return{adapter,before,after,changes};}
          test("unknown installed Common Play applies Graze-like damage only on attack failure",async()=>{const miss=await exercise("unknown-family-k-graze",1);assert.equal(miss.after,miss.before-3);assert.equal(miss.changes.length,1);await miss.adapter.undoLastResolution();assert.equal(hp(miss.adapter,await miss.adapter.getSnapshot()),miss.before);const hit=await exercise("unknown-family-k-hit",15);assert.equal(hit.after,hit.before);assert.equal(hit.changes.length,0);});
          test("outcome-conditioned damage is invariant to external identity",async()=>{const a=await exercise("unknown-family-k-identity-a",1),b=await exercise("renamed-family-k-identity-b",1);assert.equal(a.before-a.after,3);assert.equal(b.before-b.after,3);});
          TS
      - run: npx tsx --test tests/ui/c9FamilyKOutcomeDamageProduction.test.ts tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts tests/ui/c9FamilyJAttackPersistence.test.ts
      - run: npx tsc --noEmit
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit and push with concurrent-writer retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-k-outcome-damage-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyKOutcomeDamageProduction.test.ts
          git commit -m "feat(c9): support outcome-conditioned damage"
          for attempt in $(seq 1 20); do
            if git pull --rebase origin agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1
      - name: Cleanup verifier after failure
        if: failure()
        run: |
          git rebase --abort || true
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
          if [ -f .github/workflows/c9-family-k-outcome-damage-71304.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/c9-family-k-outcome-damage-71304.yml
            git commit -m "chore(c9): remove failed Family K verifier"
            for attempt in $(seq 1 20); do
              if git pull --rebase origin agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
              git rebase --abort || true
              sleep 1
            done
          fi
