name: W7-04 Recovery Prerequisite Verification

on:
  pull_request:
    branches:
      - work/v1-composite
    paths:
      - '.github/workflows/w7-04-auto.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'content/**'

permissions:
  contents: read

jobs:
  auto-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate:content
      - name: Focused W7-04 recovery owners
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test \
            tests/ui/campaignFailureRecovery.test.ts \
            tests/ui/connectedDurableFailure.test.ts \
            tests/ui/connectedOwnerInventoryRestart.test.ts \
            tests/ui/connectedPartyStashHostRecovery.test.ts \
            tests/ui/connectedLongRestHostRestartRecovery.test.ts \
            tests/ui/productionClientReconnect.test.ts \
            tests/ui/productionHelloReplayIdempotency.test.ts \
            tests/ui/connectedThreePeerRemoteConcurrentIntent.test.ts \
            tests/ui/connectedThreePeerDuplicateEventBatch.test.ts \
            tests/ui/connectedThreePeerRemoteRejectionExactlyOnce.test.ts \
            | tee /tmp/w7-04-auto.tap
      - name: Production build
        run: npm run build
      - name: Record AUTO prerequisite evidence
        shell: bash
        run: |
          {
            echo 'W7-04 recovery prerequisite verification'
            echo "checkout_sha=${GITHUB_SHA}"
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "base_sha=${{ github.event.pull_request.base.sha }}"
            echo 'scenario_scope=MP-B08,MP-H09,MP-H10,MP-H11 prerequisite owners; MP-H12 production transport AUTO is verified by the Windows Rust job'
            echo 'win_obs=claimed only by the separate Windows multi-instance job when it passes'
          } > /tmp/w7-04-auto-evidence.txt
      - name: Upload AUTO prerequisite evidence
        uses: actions/upload-artifact@v4
        with:
          name: W7-04-AUTO-PREREQ-${{ github.sha }}
          path: |
            /tmp/w7-04-auto.tap
            /tmp/w7-04-auto-evidence.txt
          if-no-files-found: error

  windows-storage-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - name: Verify Tauri persistence and transport library tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build release Windows application
        shell: pwsh
        run: npm run tauri:build
      - name: Record exact-SHA Windows executable prerequisite evidence
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src-tauri/target/release/simplevtt.exe' -ErrorAction Stop
          $hash = Get-FileHash -Algorithm SHA256 $exe
          $lines = @(
            'W7-04 Windows storage/release-executable prerequisite verification',
            "checkout_sha=$env:GITHUB_SHA",
            "head_sha=${{ github.event.pull_request.head.sha }}",
            "base_sha=${{ github.event.pull_request.base.sha }}",
            'tauri_bundle_active=false',
            'scenario_scope=storage/release-executable prerequisites plus MP-H12 AUTO production transport queue coverage',
            'mp_h12_auto=session_transport::tests::slow_peer_queue_does_not_block_fast_peer_broadcast + session_transport::tests::peer_outbound_queue_preserves_order_when_drained',
            "release_exe=$($exe.Path)",
            "release_exe_sha256=$($hash.Hash.ToLower())",
            'win_obs=claimed only by the separate Windows multi-instance job when it passes'
          )
          $lines | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\w7-04-windows-evidence.txt"
      - name: Upload Windows prerequisite evidence
        uses: actions/upload-artifact@v4
        with:
          name: W7-04-WINDOWS-PREREQ-${{ github.sha }}
          path: |
            ${{ runner.temp }}/w7-04-windows-evidence.txt
            src-tauri/target/release/simplevtt.exe
          if-no-files-found: error
          retention-days: 14

  windows-multi-instance-recovery:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - name: Run W7-04 H+P1+P2 Windows recovery acceptance
        shell: pwsh
        env:
          V1_VERIFICATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/run-tauri-e2e.ps1 -Root . -W704
      - name: Upload W7-04 Windows multi-instance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W7-04-WIN-${{ github.sha }}
          path: .live-dev/tauri-e2e/**/artifacts/**
          if-no-files-found: error
          retention-days: 14
