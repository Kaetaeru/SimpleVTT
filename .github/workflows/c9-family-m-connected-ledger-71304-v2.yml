name: C9 Family M Connected Ledger 71304 V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-m-connected-ledger-71304-v2.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify existing connected acceptance
        run: npx tsx --test tests/ui/c9FamilyMConditionConnectedAcceptance.test.ts
      - name: Reconcile Family M connected evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          apply_patch() {
            node <<'NODE'
          const fs=require('fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((candidate)=>candidate.family==='M'&&candidate.id==='conditions');
          if(!row) throw new Error('Family M conditions row missing');
          const connected='tests/ui/c9FamilyMConditionConnectedAcceptance.test.ts — unknown portable Poisoned condition application and immunity suppression replay through Host-authoritative event batches to Client replicas; duplicate replay is suppressed and Host Undo plus fresh reconnect converge without content-name or ID dispatch';
          const persistence='tests/ui/c9FamilyMConditionConnectedAcceptance.test.ts — a fresh connected replica reconstructs post-apply and post-Undo condition state from the Host event ledger, proving reconnect persistence for the portable condition path';
          row.connectedEvidenceIfRelevant=[...new Set([...(row.connectedEvidenceIfRelevant??[]),connected])];
          row.persistenceEvidenceIfRelevant=[...new Set([...(row.persistenceEvidenceIfRelevant??[]),persistence])];
          row.currentState='The shared Resolver condition Effect path enforces explicit combatant condition immunities, active tagged condition-immunity Effects, and rules-derived condition immunities before adding a condition Effect. Unknown installed Common Play condition.apply/remove has production and external identity-rename proof for explicit Poisoned immunity, Petrified-derived Poisoned immunity, successful application after immunity removal, and Undo. Host-authoritative connected replay, duplicate suppression, Undo, immunity suppression, and fresh reconnect are now proven for an unknown portable condition path. Exhaustive SRD condition semantics, Exhaustion levels/stacking, explicit connected condition.remove invocation coverage, and remaining named condition-specific adapters remain incomplete.';
          row.remainingNamedSeams=(row.remainingNamedSeams??[]).filter((entry)=>!entry.includes('connected replay/reconnect persistence evidence'));
          const explicitRemove='explicit connected condition.remove invocation coverage remains incomplete beyond event-native Undo removal';
          if(!row.remainingNamedSeams.includes(explicitRemove)) row.remainingNamedSeams.splice(1,0,explicitRemove);
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
          }
          for attempt in $(seq 1 30); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            apply_patch
            node scripts/check-v1-mechanism-coverage.mjs
            git rm -f .github/workflows/c9-family-m-connected-ledger-71304-v2.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'Family M connected evidence already reconciled.'
              exit 0
            fi
            git commit -m "docs(c9): reconcile Family M connected evidence"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
