name: C9 Family L Portable Death Save 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-death-save-71304.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch portable death-save bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"{label}: expected source text missing")
              return text.replace(old, new, 1)

          schema=Path('schemas/common-play-contract.schema.json')
          text=schema.read_text(encoding='utf-8')
          text=replace_once(
              text,
              '        {\n          "$ref": "#/$defs/lifeStabilize"\n        },\n        {\n          "$ref": "#/$defs/resourceChange"\n        },',
              '        {\n          "$ref": "#/$defs/lifeStabilize"\n        },\n        {\n          "$ref": "#/$defs/lifeDeathSave"\n        },\n        {\n          "$ref": "#/$defs/resourceChange"\n        },',
              'schema operation union',
          )
          text=replace_once(
              text,
              '    "lifeStabilize": {\n      "type": "object",\n      "required": [\n        "kind"\n      ],\n      "properties": {\n        "kind": {\n          "const": "life.stabilize"\n        },\n        "target": {\n          "enum": [\n            "actor",\n            "self",\n            "target"\n          ]\n        }\n      },\n      "additionalProperties": false\n    },\n    "resourceChange": {',
              '    "lifeStabilize": {\n      "type": "object",\n      "required": [\n        "kind"\n      ],\n      "properties": {\n        "kind": {\n          "const": "life.stabilize"\n        },\n        "target": {\n          "enum": [\n            "actor",\n            "self",\n            "target"\n          ]\n        }\n      },\n      "additionalProperties": false\n    },\n    "lifeDeathSave": {\n      "type": "object",\n      "required": [\n        "kind"\n      ],\n      "properties": {\n        "kind": {\n          "const": "life.death-save"\n        }\n      },\n      "additionalProperties": false\n    },\n    "resourceChange": {',
              'schema death save definition',
          )
          schema.write_text(text,encoding='utf-8')

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          text=runtime.read_text(encoding='utf-8')
          text=replace_once(
              text,
              'type CommonPlayLifeStabilize={\n  kind:"life.stabilize";\n  target?:CommonPlayHpTarget;\n};',
              'type CommonPlayLifeStabilize={\n  kind:"life.stabilize";\n  target?:CommonPlayHpTarget;\n};\ntype CommonPlayLifeDeathSave={kind:"life.death-save"};',
              'death save type',
          )
          text=replace_once(
              text,
              '  |CommonPlayLifeStabilize\n  |CommonPlayMovementDefinition',
              '  |CommonPlayLifeStabilize\n  |CommonPlayLifeDeathSave\n  |CommonPlayMovementDefinition',
              'operation type union',
          )
          text=replace_once(
              text,
              '  damageDiceFaces?:Record<number,number[]>;\n  rechargeDiceFaces?:Record<number,number[]>;',
              '  damageDiceFaces?:Record<number,number[]>;\n  deathSaveDiceFaces?:Record<number,number[]>;\n  rechargeDiceFaces?:Record<number,number[]>;',
              'execution input dice',
          )
          text=replace_once(
              text,
              'const LIFE_STABILIZE_KEYS=new Set(["kind","target"]);\nconst ROLL_MODIFY_KEYS=',
              'const LIFE_STABILIZE_KEYS=new Set(["kind","target"]);\nconst LIFE_DEATH_SAVE_KEYS=new Set(["kind"]);\nconst ROLL_MODIFY_KEYS=',
              'parser keys',
          )
          text=replace_once(
              text,
              '  if(operation.kind==="life.stabilize") {\n    supportedKeys(operation,LIFE_STABILIZE_KEYS,label);\n    return {kind:"life.stabilize",...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)})};\n  }\n  throw new DomainEvaluationError(`unsupported Common Play operation: ${String(operation.kind)}`);',
              '  if(operation.kind==="life.stabilize") {\n    supportedKeys(operation,LIFE_STABILIZE_KEYS,label);\n    return {kind:"life.stabilize",...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)})};\n  }\n  if(operation.kind==="life.death-save") {\n    supportedKeys(operation,LIFE_DEATH_SAVE_KEYS,label);\n    return {kind:"life.death-save"};\n  }\n  throw new DomainEvaluationError(`unsupported Common Play operation: ${String(operation.kind)}`);',
              'parser branch',
          )
          text=replace_once(
              text,
              '    if(operation.kind==="life.stabilize") {\n      operations.push({id:operationId,kind:"stabilize",targetId:hpOperationTarget(operation.target,input)});\n      continue;\n    }\n\n    if(operation.kind==="movement.grant") {',
              '    if(operation.kind==="life.stabilize") {\n      operations.push({id:operationId,kind:"stabilize",targetId:hpOperationTarget(operation.target,input)});\n      continue;\n    }\n    if(operation.kind==="life.death-save") {\n      const faces=input.deathSaveDiceFaces?.[index];\n      if(!faces||faces.length!==1) throw new DomainEvaluationError(`Common Play death-save operation ${index} requires exactly one authoritative d20 face`);\n      operations.push({\n        id:operationId,kind:"death-save",actorId:input.actorId,\n        dice:{id:`${operationId}:d20`,purpose:"death saving throw",sides:20,faces:[faces[0]]},\n      });\n      continue;\n    }\n\n    if(operation.kind==="movement.grant") {',
              'compiler branch',
          )
          runtime.write_text(text,encoding='utf-8')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          text=replace_once(
              text,
              '  const d20ModifierSelection=entryPoint.test?commonPlayTestModifierSelection(internal,state,d20RollerId,entryPoint.test.property):undefined;\n  const movementFactAnswers=',
              '  const d20ModifierSelection=entryPoint.test?commonPlayTestModifierSelection(internal,state,d20RollerId,entryPoint.test.property):undefined;\n  let operationDieDrawIndex=d20Faces?.length??0;\n  const deathSaveDiceFaces:Record<number,number[]>={};\n  for(const [index,operation] of entryPoint.operations.entries()) {\n    if(operation.kind!=="life.death-save") continue;\n    deathSaveDiceFaces[index]=[internal.d20(actionId,operationDieDrawIndex++)];\n  }\n  const movementFactAnswers=',
              'production death save dice',
          )
          text=replace_once(
              text,
              '    damageDiceFaces:damageDiceFaces(internal,actionId,entryPoint,d20Faces?.length??0),\n    ...(movementProperties?{movementProperties}:{}),',
              '    damageDiceFaces:damageDiceFaces(internal,actionId,entryPoint,operationDieDrawIndex),\n    ...(Object.keys(deathSaveDiceFaces).length?{deathSaveDiceFaces}:{}),\n    ...(movementProperties?{movementProperties}:{}),',
              'production input',
          )
          adapter.write_text(text,encoding='utf-8')

          test_file=Path('tests/ui/c9FamilyLDeathSaveProduction.test.ts')
          test_file.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport "../../src/app/offlineRuntimeAdapters";\nimport { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";\nimport { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";\nimport { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";\nimport { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";\nimport { MockAdapter } from "../../src/app/mockAdapter";\nimport { turnRuntimeSessions } from "../../src/app/turnRuntimeSessionRegistry";\n\nconst ACTOR_ID="char.aelar";\n\nfunction packagePayload(prefix:string) {\n  const moduleId=`${prefix}.module`,contentId=`${prefix}.option`,mechanicId=`${prefix}.life`;\n  const config={schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[\n    {id:"down",invocation:"manual",operations:[{kind:"damage.apply",amount:{value:36},damageType:"force",target:"self"}]},\n    {id:"death-save",invocation:"manual",operations:[{kind:"life.death-save"}]},\n  ]};\n  return {moduleId,contentId,mechanicId,json:JSON.stringify({\n    schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",\n    source:{document:"Portable death-save probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],\n    content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Death Save",locales:{en:{name:"Portable Death Save"}}},mechanics:[{kind:"common-play",config}]}],\n  })};\n}\n\nasync function exercise(prefix:string) {\n  const adapter=new MockAdapter();\n  const pack=packagePayload(prefix);\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(pack.json);\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  await adapter.startInitiative();\n  await adapter.setCurrentActor(ACTOR_ID);\n  const action=(entryPointId:string)=>installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId});\n\n  let snapshot=await adapter.resolveAction(action("down"),[ACTOR_ID]);\n  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));\n  const down=structuredClone(turnRuntimeSessions.get(adapter)!.state.combatants[ACTOR_ID].life);\n  assert.equal(down.hp.current,0);\n  assert.equal(down.dead,false);\n  assert.equal(down.unconscious,true);\n  assert.equal(down.stable,false);\n  assert.deepEqual(down.deathSaves,{successes:0,failures:0});\n\n  await adapter.setQueuedD20(12);\n  snapshot=await adapter.resolveAction(action("death-save"),[ACTOR_ID]);\n  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));\n  const saved=structuredClone(turnRuntimeSessions.get(adapter)!.state.combatants[ACTOR_ID].life);\n  assert.equal(saved.hp.current,0);\n  assert.equal(saved.dead,false);\n  assert.equal(saved.unconscious,true);\n  assert.equal(saved.stable,false);\n  assert.deepEqual(saved.deathSaves,{successes:1,failures:0});\n\n  await adapter.undoLastResolution();\n  assert.deepEqual(turnRuntimeSessions.get(adapter)!.state.combatants[ACTOR_ID].life,down,"Undo must restore the pre-death-save life state");\n  return saved;\n}\n\ntest("unknown installed Common Play executes an authoritative death save and Undo restores life state under identity rename",async()=>{\n  const first=await exercise("external.family-l-death-save");\n  const renamed=await exercise("renamed.family-l-death-save");\n  assert.deepEqual(renamed,first);\n});\n''',encoding='utf-8')
          PY
      - name: Generate content
        run: npm run generate:content
      - name: Verify portable death-save slice
        shell: bash
        run: |
          npx tsx --test tests/ui/c9FamilyLDeathSaveProduction.test.ts tests/ui/c9FamilyLStabilizeProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified slice
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-l-death-save-71304.yml
          git add schemas/common-play-contract.schema.json src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyLDeathSaveProduction.test.ts
          git commit -m "feat(c9): bridge portable death saves"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
