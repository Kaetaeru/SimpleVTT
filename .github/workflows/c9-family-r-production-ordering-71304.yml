name: C9 Family R Production Ordering 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-r-production-ordering-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-r-production-ordering-71304
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply, verify, commit, and self-retire
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            npm run generate:content >/dev/null
            python3 .github/scripts/c9-family-r-production-ordering-71304.py
            python3 - <<'PY'
          from pathlib import Path
          path=Path('src/app/phase09EffectAwareTurnAdapter.ts')
          text=path.read_text()
          old='const candidates=collectInstalledCommonPlayActorTurnRuleCandidates(boundary.state,bindings,boundary);'
          new='const candidates=collectInstalledCommonPlayActorTurnRuleCandidates(boundary.state,bindings,{id:boundary.resolutionId,kind:boundary.kind,actorId:boundary.actorId});'
          if old not in text:
              raise SystemExit('Family R preview collector call anchor missing')
          path.write_text(text.replace(old,new,1))

          path=Path('tests/ui/connectedActorTurnRuleProduction.test.ts')
          text=path.read_text()
          old='  const payload=JSON.parse(pack.json) as {\n'
          new='  const seededJson=pack.json.replace(`"id":"${pack.resourceId}","current":0,"maximum":1`,`"id":"${pack.resourceId}","current":1,"maximum":1`);\n  if(seededJson===pack.json) throw new Error("simultaneous ordering seed resource was not found");\n  const payload=JSON.parse(seededJson) as {\n'
          if old not in text:
              raise SystemExit('Family R simultaneous test payload anchor missing')
          text=text.replace(old,new,1)
          text=text.replace('spend-at-zero then gain must end at one; natural gain-then-spend would end at zero','spend-at-one then gain must end at one; natural gain-at-maximum then spend would end at zero',1)
          path.write_text(text)
          PY
            node --import tsx --test tests/domain/commonPlaySimultaneousOrderingRuntime.test.ts tests/ui/connectedActorTurnRuleProduction.test.ts
            npm exec tsc -- --noEmit
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            rm -f .github/scripts/c9-family-r-production-ordering-71304.py .github/workflows/c9-family-r-production-ordering-71304.yml
            git add src/app/commonPlayActorTurnRuleComposition.ts src/app/realTurnLifecycleService.ts src/app/phase09EffectAwareTurnAdapter.ts tests/ui/connectedActorTurnRuleProduction.test.ts .github/scripts/c9-family-r-production-ordering-71304.py .github/workflows/c9-family-r-production-ordering-71304.yml
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "feat(c9): collect production simultaneous turn ordering"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
