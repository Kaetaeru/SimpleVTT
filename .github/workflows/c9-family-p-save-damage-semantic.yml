name: C9 Family P Save Damage Semantic Outcomes

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-save-damage-semantic.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Route save-damage through semantic outcome composition
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=path.read_text()
          old_import='import { resolveCommonPlaySaveDamageEntryPoint } from "../domain/commonPlayEntryPointRuntime";'
          new_import='import { compileCommonPlaySaveDamageEntryPoint } from "../domain/commonPlayEntryPointRuntime";'
          if old_import in text:
              text=text.replace(old_import,new_import,1)
          elif new_import not in text:
              raise SystemExit('save-damage import anchor missing')
          old='''    committed=resolveCommonPlaySaveDamageEntryPoint(SIMPLEVTT_APP_RULES_PROFILE,state,lowered.definition,{\n      resolutionId,actorId:actor.id,entryPointId:action.entryPointId,targets:saves,\n      damageFaces:rollFaces(internal,actionId,damage.count,damage.sides,selectedTargets.length),\n      actionKind,\n    });'''
          new='''    const pending=compileCommonPlaySaveDamageEntryPoint(SIMPLEVTT_APP_RULES_PROFILE,state,lowered.definition,{\n      resolutionId,actorId:actor.id,entryPointId:action.entryPointId,targets:saves,\n      damageFaces:rollFaces(internal,actionId,damage.count,damage.sides,selectedTargets.length),\n      actionKind,\n    });\n    const effectDefinitions=await installedPersistentEffectDefinitions(adapter);\n    const automaticPending=appendCommonPlaySemanticOutcomeTriggers(\n      state,effectDefinitions,pending,Object.fromEntries(internal.scene.entities.map((entity)=>[entity.id,entity.kind==="character"?"character":"monster"])),\n    );\n    committed=appendCommonPlaySemanticOutcomeEvents(\n      automaticPending,\n      resolvePendingResolution(SIMPLEVTT_APP_RULES_PROFILE,state,automaticPending),\n    );'''
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('save-damage execution anchor missing')
          path.write_text(text)
          PY

          cat > tests/ui/installedCommonPlaySaveDamageSemanticProduction.test.ts <<'TS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { runtimeResolutionEventHistory } from "../../src/app/runtimeResolutionEventHistory";

          const FIXTURE=JSON.parse(readFileSync(new URL("../fixtures/play-contract/multi-target-save-damage.json",import.meta.url),"utf8"));

          function payload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.spell`;
            const mechanicId=`${prefix}.mechanic`;
            const config=structuredClone(FIXTURE);
            config.id=mechanicId;
            config.entryPoints[0].test.dc={value:10};
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Save Damage Semantic Probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"spell",presentation:{defaultLocale:"en",originalName:"Save Damage Probe",locales:{en:{name:"Save Damage Probe"}}},mechanics:[{kind:"common-play",config}]}],
            })};
          }

          async function run(prefix:string) {
            const adapter=new MockAdapter();
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const pack=payload(prefix);
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"release"});
            await adapter.setQueuedD20(4);
            const snapshot=await adapter.resolveAction(actionId,["combatant.goblin-a","combatant.goblin-b"]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const history=runtimeResolutionEventHistory(adapter);
            const outcomes=(history?.events??[]).filter((event)=>event.kind==="save.success"||event.kind==="save.failure").map((event)=>({actorId:event.actorId,kind:event.kind}));
            assert.deepEqual(outcomes,[{actorId:"combatant.goblin-a",kind:"save.failure"},{actorId:"combatant.goblin-b",kind:"save.success"}],JSON.stringify(history));
            return outcomes;
          }

          test("unknown multi-target save-damage emits authoritative semantic outcomes for every target",async()=>{await run("unknown-save-damage-semantic");});
          test("multi-target save-damage semantic outcomes are invariant to external identities",async()=>{
            assert.deepEqual(await run("renamed-save-damage-semantic"),await run("unknown-save-damage-semantic"));
          });
          TS
      - name: Verify focused production slice
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:content
          npx tsx --test tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts tests/ui/installedCommonPlaySaveDamageSemanticProduction.test.ts
          npx tsc --noEmit
      - name: Commit verified slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-p-save-damage-semantic.yml
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlaySaveDamageSemanticProduction.test.ts
          git diff --cached --check
          git commit -m "feat(c9): compose multi-target save semantic outcomes"
          for attempt in $(seq 1 12); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
