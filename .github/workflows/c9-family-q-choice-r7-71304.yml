name: C9 Family Q Choice R7 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r7-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified choice bridge and fix authorization targeting semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow=subprocess.check_output([
              'git','show','cf008c5826ce2d2c2fcc907d9d51aed45f35dc66:.github/workflows/c9-family-q-choice-r5-71304.yml'
          ],text=True)
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(code,'q-choice-r5-patch','exec'),{'__name__':'__main__'})

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          text=path.read_text(encoding='utf-8')
          old='''        authority,\n      });\n      if(choiceResolution.status!=="resolved") throw new DomainEvaluationError(`Common Play choice selector rejected: ${choiceResolution.reason}`);'''
          new='''        authority,\n        directTarget:false,\n      });\n      if(choiceResolution.status!=="resolved") throw new DomainEvaluationError(`Common Play choice selector rejected: ${choiceResolution.reason}`);'''
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'choice authorization selector anchor changed: {text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          test_path=Path('tests/ui/c9FamilyQChoiceInteractionProduction.test.ts')
          test_text=test_path.read_text(encoding='utf-8')
          old_assert='''    assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore);\n    assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false);'''
          new_assert='''    assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore+1);\n    assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false);'''
          if new_assert not in test_text:
              if test_text.count(old_assert)!=1:
                  raise SystemExit(f'accepted healing assertion anchor changed: {test_text.count(old_assert)}')
              test_text=test_text.replace(old_assert,new_assert,1)
          old_summary='{delta:0,selectedCount:2}'
          new_summary='{delta:1,selectedCount:2}'
          if old_summary in test_text:
              if test_text.count(old_summary)!=2:
                  raise SystemExit(f'choice summary expectation count changed: {test_text.count(old_summary)}')
              test_text=test_text.replace(old_summary,new_summary)
          elif test_text.count(new_summary)<2:
              raise SystemExit('choice summary expectation anchors changed')
          test_path.write_text(test_text,encoding='utf-8')

          adapter_path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          adapter_text=adapter_path.read_text(encoding='utf-8')
          broad='interactionResponse?:{interactionId:string;accepted?:true;selectedIds?:string[]},'
          narrow='interactionResponse?:({interactionId:string;accepted:true}|{interactionId:string;selectedIds:string[]}),'
          if broad in adapter_text:
              if adapter_text.count(broad)!=2:
                  raise SystemExit(f'interaction response signature count changed: {adapter_text.count(broad)}')
              adapter_text=adapter_text.replace(broad,narrow)
          elif adapter_text.count(narrow)!=2:
              raise SystemExit('interaction response signature anchors changed')
          broad_local='let interactionResponse:{interactionId:string;accepted?:true;selectedIds?:string[]};'
          narrow_local='let interactionResponse:{interactionId:string;accepted:true}|{interactionId:string;selectedIds:string[]};'
          if broad_local in adapter_text:
              adapter_text=adapter_text.replace(broad_local,narrow_local,1)
          elif narrow_local not in adapter_text:
              raise SystemExit('interaction response local anchor changed')
          old_min='choiceCandidates!.length<interaction.input.selector.min'
          new_min='choiceCandidates!.length<(interaction.input.selector.min??0)'
          if old_min in adapter_text:
              adapter_text=adapter_text.replace(old_min,new_min,1)
          elif new_min not in adapter_text:
              raise SystemExit('choice minimum anchor changed')
          old_view='min:interaction.input.selector.min,max:interaction.input.selector.max,'
          new_view='min:interaction.input.selector.min??0,max:interaction.input.selector.max??choiceCandidates!.length,'
          if old_view in adapter_text:
              adapter_text=adapter_text.replace(old_view,new_view,1)
          elif new_view not in adapter_text:
              raise SystemExit('choice view bounds anchor changed')
          adapter_path.write_text(adapter_text,encoding='utf-8')

          wire_path=Path('src/app/connectedSessionWire.ts')
          wire_text=wire_path.read_text(encoding='utf-8')
          old_wire='''  const choice=value.choice;\n  const validChoice=choice===undefined||'''
          new_wire='''  if(!isRecord(value)) return false;\n  const choice=value.choice;\n  const validChoice=choice===undefined||'''
          if new_wire not in wire_text:
              if wire_text.count(old_wire)!=1:
                  raise SystemExit(f'wire choice guard anchor changed: {wire_text.count(old_wire)}')
              wire_text=wire_text.replace(old_wire,new_wire,1)
          wire_path.write_text(wire_text,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire Q choice staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts src/app/rogueCoreRuntimeAdapter.ts src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-r5-71304.yml .github/workflows/c9-family-q-choice-r6-diagnostic-71304.yml .github/workflows/c9-family-q-choice-diagnostic-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml .github/workflows/c9-family-q-choice-r7-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
