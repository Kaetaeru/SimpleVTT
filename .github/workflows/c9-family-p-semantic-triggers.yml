name: C9 Family P Semantic Triggers

"on":
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-semantic-triggers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply semantic trigger patch
        env:
          PATCH_B64: >-
            
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/c9-family-p-semantic-triggers.py
          python /tmp/c9-family-p-semantic-triggers.py
          npm ci
          npm run generate:content
          npx tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts tests/domain/commonPlayEffectRuntime.test.ts
          npx tsc --noEmit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayEffectRuntime.ts src/domain/commonPlaySemanticEventRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlaySemanticEventRuntime.test.ts
          git rm .github/workflows/c9-family-p-semantic-triggers.yml
          git commit -m "feat(c9): dispatch semantic d20 effect triggers"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
