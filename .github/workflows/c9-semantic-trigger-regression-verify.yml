name: C9 Semantic Trigger Regression Verify

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-semantic-trigger-regression-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Classify generic selector guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.agents/LEGACY_EXECUTION_BASELINE.json')
          data = json.loads(path.read_text())
          module = './installedCommonPlaySelectorGuardAdapter'
          entries = data['entries']
          existing = next((entry for entry in entries if entry.get('module') == module), None)
          if existing is None:
              anchor = next(i for i, entry in enumerate(entries) if entry.get('module') == './installedCommonPlayRuntimeAdapter')
              entries.insert(anchor + 1, {'module': module, 'classification': 'GENERIC_ENGINE'})
          elif existing.get('classification') != 'GENERIC_ENGINE':
              raise SystemExit(f'{module} already has incompatible classification: {existing.get("classification")}')
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Verify semantic outcome trigger regression
        run: npx tsx --test tests/domain/commonPlaySemanticTriggerRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Persist classification and remove consumed verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/LEGACY_EXECUTION_BASELINE.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(c9): classify Common Play selector guard"
          fi
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git rm .github/workflows/c9-semantic-trigger-regression-verify.yml
          git commit -m "ci(c9): retire semantic trigger verifier"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
