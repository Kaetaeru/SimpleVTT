name: C9 Family R Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-r-ledger-reconcile-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-r-ledger-reconcile-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile verified Family R evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          row=next((row for row in data["rows"] if row.get("family")=="R"),None)
          if row is None:
              raise SystemExit("Family R ledger row missing")
          row["currentState"]=(
              "A generic typed simultaneous-ordering decision kernel validates eligible candidate sets, actor-controller/DM authority, stale revisions, exact permutations, deterministic ordered projection, and idempotent exact replay. Production installed Common Play turn-start/turn-end timing windows now collect eligible unknown external RuleModule candidates before mutation, pause for actor-controller ordering when multiple candidates are eligible, and retry the same lifecycle boundary through the existing Resolver in the authorized order without consuming frequency or authoritative dice while pending. Host-connected ordering-decision transport/reconnect/replay remains incomplete."
          )
          production=(
              "3487314c2d12105b689c94a087ea59e2395d26a9 feat(c9): collect production simultaneous turn ordering; connectedActorTurnRuleProduction.test.ts proves an unknown installed module with two same-boundary turn rules pauses before mutation and executes the actor-authorized order through the existing Resolver"
          )
          identity=(
              "connectedActorTurnRuleProduction.test.ts repeats the production simultaneous turn-rule ordering proof after complete external module/content/mechanic identity rename"
          )
          if production not in row["productionEvidence"]:
              row["productionEvidence"].append(production)
          if identity not in row["identityInvarianceEvidence"]:
              row["identityInvarianceEvidence"].append(identity)
          row["remainingNamedSeams"]=[
              "Host-connected simultaneous-ordering decision transport, reconnect, stale response handling, and replay are not yet wired to the production ordering kernel"
          ]
          row["disposition"]="INCOMPLETE"
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            rm -f .github/workflows/c9-family-r-ledger-reconcile-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-r-ledger-reconcile-71304.yml
            git diff --cached --check
            git commit -m "docs(c9): reconcile family R production evidence"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
