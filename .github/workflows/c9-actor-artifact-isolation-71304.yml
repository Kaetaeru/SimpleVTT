name: C9 Actor Artifact Isolation 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-actor-artifact-isolation-71304.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generate:content
      - name: Run reconnect case alone
        id: first
        shell: bash
        run: |
          set +e
          node --import tsx --test --test-name-pattern="actor artifact reconstructs" tests/ui/connectedActorArtifactReconnectProduction.test.ts
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run recast case alone
        id: second
        shell: bash
        run: |
          set +e
          node --import tsx --test --test-name-pattern="until-source-recast actor replacement converges" tests/ui/connectedActorArtifactReconnectProduction.test.ts
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retire isolation workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-actor-artifact-isolation-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            rm -f "$path"
            git add -A "$path"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ci(c9): retire actor artifact isolation verifier"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Preserve isolated failure
        if: steps.first.outputs.exit_code != '0' || steps.second.outputs.exit_code != '0'
        run: exit 1
