name: C9 Family J Spatial Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-spatial-ledger-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify proven Family J slices
        run: |
          node --import tsx --test \
            tests/ui/c9FamilyJSpatialAttackProduction.test.ts \
            tests/ui/c9FamilyJRangeCoverProduction.test.ts \
            tests/ui/c9FamilyJOpportunityAttackProduction.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJAttackPersistence.test.ts \
            tests/ui/c9FamilyESpatialSelectorProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Reconcile Family J ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git pull --ff-only origin "$branch"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')

          implementation=[
            'phase09ManualMovementReactionAdapter.ts resolves Opportunity Attack from the reactor projected ActionVm runtimeAttack facts and input attackActionId, consuming reaction economy without named action/content dispatch',
            'commonPlayOperationRuntime.ts generic roll.modify disadvantage and structural attack target adjustment compose long-range disadvantage plus authoritative cover in the shared Resolver attack-roll path',
          ]
          production=[
            'c9FamilyJOpportunityAttackProduction.test.ts executes projected Opportunity Attacks under unrelated action IDs/names, consumes reaction but not action, commits damage, and restores HP/Temporary HP plus reaction through event-native Undo',
            'c9FamilyJRangeCoverProduction.test.ts unknown installed Common Play composes baseline attack, long-range disadvantage, and cover target adjustment through production attack resolution; C9 Family J Spatial Attack 71304 run 33316344182 passed the spatial/OA suite, coverage checker, legacy boundary, and tsc --noEmit',
            'c9FamilyJSpatialAttackProduction.test.ts and c9FamilyESpatialSelectorProduction.test.ts consume authoritative reach/range/Total Cover facts without content identity dispatch',
          ]
          identity=[
            'c9FamilyJOpportunityAttackProduction.test.ts repeats reaction attack semantics after replacing the projected attack with unrelated action IDs and names',
            'c9FamilyJRangeCoverProduction.test.ts repeats long-range disadvantage and cover adjustment after complete external module/content/mechanic identity rename',
            'c9FamilyJSpatialAttackProduction.test.ts and c9FamilyESpatialSelectorProduction.test.ts preserve authoritative reach/range/cover behavior for unknown and renamed portable content',
          ]
          for target, values in [
            (row['implementationEvidence'], implementation),
            (row['productionEvidence'], production),
            (row['identityInvarianceEvidence'], identity),
          ]:
            for value in values:
              if value not in target:
                target.append(value)

          row['remainingNamedSeams']=[
            'multiattack/Extra Attack/replacement and Loading constraints remain incomplete; reach/long range and structural cover are now generic and verified'
            if seam=='reach, long range, multiattack/Extra Attack/replacement, and Loading constraints remain incomplete; structural cover is now generic and verified'
            else seam
            for seam in row['remainingNamedSeams']
            if seam!='Opportunity Attack portable acceptance remains incomplete beyond existing projection-driven integration'
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-spatial-ledger-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): reconcile portable attack spatial evidence"
          git push origin HEAD:"$branch"
