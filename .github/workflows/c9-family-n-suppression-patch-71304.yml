name: C9 Family N Suppression Patch 71304

on:
  push:
    paths:
      - ".github/workflows/c9-family-n-suppression-patch-71304.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/c9-n-patch.py
          python3 /tmp/c9-n-patch.py
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(c9): expose portable effect suppression"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
