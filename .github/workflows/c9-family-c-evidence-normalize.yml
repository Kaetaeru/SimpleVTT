name: C9 Family C Normalize Evidence Keys

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-evidence-normalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize ledger evidence fields
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in ledger['rows'] if item['family']=='C')
          assert row['disposition']=='INCOMPLETE'
          for source, target in [
              ('connectedEvidence','connectedEvidenceIfRelevant'),
              ('persistenceEvidence','persistenceEvidenceIfRelevant'),
          ]:
              values=row.pop(source, [])
              bucket=row.setdefault(target, [])
              for value in values:
                  if value not in bucket:
                      bucket.append(value)
          assert 'connectedEvidence' not in row
          assert 'persistenceEvidence' not in row
          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): normalize Family C evidence fields"
          git push

      - name: Republish sequence 10 control last and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('.chatgpt-rerun/control.json')
          control=json.loads(path.read_text(encoding='utf-8'))
          assert control['sequence']==10
          assert control['status']=='continue'
          suffix=' Family C connected and persistence evidence is stored in the canonical ledger evidence fields.'
          if suffix.strip() not in control['reason']:
              control['reason']=control['reason'].rstrip()+suffix
          path.write_text(json.dumps(control, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git rm .github/workflows/c9-family-c-evidence-normalize.yml
          git add .chatgpt-rerun/control.json
          git diff --cached --check
          git commit -m "docs(rerun): normalize sequence 10 Family C evidence"
          git push
