name: C9 Family E Rich Predicate Candidates 7130
# Retry after rulesTestState import reconciliation.

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-rich-predicate-candidates-7130.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bridge authoritative scene properties into generic selector candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          text=runtime.read_text(encoding='utf-8')
          old='import { parseCommonPlaySelector, resolveCommonPlaySelector, type CommonPlaySelector } from "./commonPlaySelectorRuntime";'
          new='import { parseCommonPlaySelector, resolveCommonPlaySelector, type CommonPlaySelector, type CommonPlaySelectorCandidate } from "./commonPlaySelectorRuntime";'
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('selector import marker mismatch')
          marker='  targetingTargets?:TargetingFactInput[];\n'
          addition='  targetingCandidates?:CommonPlaySelectorCandidate[];\n'
          if addition not in text:
              if text.count(marker)!=1: raise SystemExit('targetingCandidates marker mismatch')
              text=text.replace(marker,marker+addition,1)
          old='      candidates:input.targetingTargets.map(targetingSelectorCandidate),'
          new='      candidates:input.targetingCandidates??input.targetingTargets.map(targetingSelectorCandidate),'
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('selector candidate resolution marker mismatch')
          runtime.write_text(text,encoding='utf-8')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          marker='import type { TargetingFactInput } from "../domain/targeting";\n'
          addition='import type { CommonPlaySelectorCandidate } from "../domain/commonPlaySelectorRuntime";\n'
          if addition not in text:
              if text.count(marker)!=1: raise SystemExit('adapter selector import marker mismatch')
              text=text.replace(marker,marker+addition,1)
          helper='''function commonPlaySelectorCandidate(actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {\n  const targeting=commonPlayTargetFact(actor,target);\n  return {\n    id:target.id,\n    targeting,\n    properties:{\n      relation:targeting.relation,\n      name:target.name,\n      side:target.side,\n      kind:target.kind,\n      hp:target.hp,\n      maxHp:target.maxHp,\n      tempHp:target.tempHp,\n      ac:target.ac,\n      initiative:target.initiative,\n      status:[...target.status],\n      resistances:[...target.resistances],\n      immunities:[...target.immunities],\n      vulnerabilities:[...target.vulnerabilities],\n    },\n  };\n}\n\n'''
          if helper not in text:
              marker='function damageDiceFaces(\n'
              if text.count(marker)!=1: raise SystemExit('adapter helper insertion marker mismatch')
              text=text.replace(marker,helper+marker,1)
          marker='    targetingTargets:entryPoint.targeting?selectedTargets.map((target)=>commonPlayTargetFact(actorEntity,target)):undefined,\n'
          addition='    targetingCandidates:entryPoint.targeting?internal.scene.entities.filter((target)=>state.combatants[target.id]).map((target)=>commonPlaySelectorCandidate(actorEntity,target)):undefined,\n'
          if addition not in text:
              if text.count(marker)!=1: raise SystemExit('adapter targetingCandidates marker mismatch')
              text=text.replace(marker,marker+addition,1)
          adapter.write_text(text,encoding='utf-8')

          production=Path('tests/ui/installedCommonPlayProductionRuntime.test.ts')
          text=production.read_text(encoding='utf-8')
          title='test("unknown installed Common Play rich predicate filters authoritative scene properties without identity dispatch",async()=>{'
          if title not in text:
              marker='test("unknown installed Common Play relation selector rejects an ineligible target before production commit",async()=>{'
              if text.count(marker)!=1: raise SystemExit('production test marker mismatch')
              addition='''test("unknown installed Common Play rich predicate filters authoritative scene properties without identity dispatch",async()=>{\n  const adapter=new MockAdapter();\n  const payload=JSON.parse(targetingPackagePayload()) as any;\n  payload.content[0].mechanics[0].config.entryPoints[0].targeting={\n    from:"targets",where:{op:"contains",left:{ref:"status"},right:{value:"중독됨"}},min:1,max:1,\n  };\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(JSON.stringify(payload));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  const actionId=installedCommonPlayActionId({\n    catalogId:catalogQualifiedId(TARGETING_IDENTITY.contentId,TARGETING_IDENTITY.moduleId,"1"),\n    mechanicId:TARGETING_IDENTITY.mechanicId,entryPointId:TARGETING_IDENTITY.entryPointId,\n  });\n  injureSceneEntity(adapter,"combatant.goblin-a",10);\n  injureSceneEntity(adapter,"combatant.goblin-b",10);\n  await adapter.startInitiative();\n  await adapter.setCurrentActor("char.aelar");\n  let snapshot=await adapter.getSnapshot();\n  const ineligibleBefore=snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-b")!.hp;\n  await adapter.resolveAction(actionId,["combatant.goblin-b"]);\n  snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-b")!.hp,ineligibleBefore);\n  const eligibleBefore=snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp;\n  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.stage,"complete");\n  assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);\n  assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp,eligibleBefore+5);\n});\n\n'''
              text=text.replace(marker,addition+marker,1)
          production.write_text(text,encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify rich selector candidate production slice
        run: >-
          npx tsx --test
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify boundaries and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified slice and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
          if ! git diff --cached --quiet; then git commit -m "feat(c9): project rich selector candidate facts"; fi
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git rm .github/workflows/c9-family-e-rich-predicate-candidates-7130.yml
          git commit -m "chore(c9): remove consumed rich selector candidate verifier"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
