name: Legacy Execution Boundary

on:
  push:
    branches:
      - agent/resolver-foundation-convergence
      - work/v1-composite
  pull_request:
    branches:
      - agent/resolver-foundation-convergence
      - work/v1-composite

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check grandfathered named execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Run boundary regression tests
        run: node --test tests/ui/legacyExecutionBoundary.test.mjs
