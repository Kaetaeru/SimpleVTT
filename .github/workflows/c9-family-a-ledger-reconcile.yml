name: C9 Family A Ledger Reconcile
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-ledger-reconcile.yml]
permissions:
  contents: write
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Family A evidence
        shell: python
        run: |
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text())
          row=next((row for row in data['rows'] if row.get('family')=='A'),None)
          if row is None: raise SystemExit('Family A missing')
          row['currentState']='The persisted property.modify contract carries explicit target, Effect ownership, definition source, elapsed duration, destroy-on-end lifetime, and instance policy. commonPlayOperationRuntime generically lowers arbitrary external property.modify definitions to the existing apply-effect ResolutionOperation with a typed propertyModifier payload, Resolver commits that payload into EffectState, and installed Common Play now projects active movement.walk property effects into the existing movement expression consumer without content-name or content-ID dispatch. Family A remains incomplete because production property projection is not yet generic across the full property vocabulary, instancePolicy is stored but not enforced during property evaluation, and persistence/reconnect evidence for source-bound property modifiers is still absent.'
          production=row.setdefault('productionEvidence',[])
          for evidence in [
            'ad417a464f930db72e4d707c7e3ec79e549218bc feat(c9): project property effects into movement',
            'installedCommonPlayPropertyModifierProduction.test.ts unknown external property.modify -> Effect -> movement.walk production projection',
          ]:
            if evidence not in production: production.append(evidence)
          identity=row.setdefault('identityInvarianceEvidence',[])
          evidence='installedCommonPlayPropertyModifierProduction.test.ts renamed external module/content/mechanic preserves property-modified movement semantics'
          if evidence not in identity: identity.append(evidence)
          row['remainingNamedSeams']=[
            'EffectInstance.propertyModifier production projection currently covers movement.walk rather than the full generic property vocabulary',
            'resolveProfileProperty still has no production caller that composes active Effect-owned modifiers across generic property refs',
            'property modifier instancePolicy is stored but stacking/replacement semantics are not enforced during evaluation',
            'source-bound property modifier persistence/reconnect evidence is absent',
            'named progression/runtime stat materialization remains outside a generic property owner',
          ]
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit reconciled evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-a-ledger-reconcile.yml
          git commit -m "docs(c9): reconcile Family A property projection evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
