name: C9 Family C Portable Dice Reconciliation

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile authoritative Family C ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text())
          rows=ledger['rows']
          assert len(rows)==36
          row=next(item for item in rows if item['family']=='C')
          assert row['disposition']=='INCOMPLETE'
          row['currentState']=(
            'The generic d20 Resolver supports checks/saves/attacks and the full roll-modification kernel. Production Common Play now proves '
            'declarative Cutting Words, deterministic replace/minimum/target-add, and arbitrary installed authoritative add-die/reroll through '
            'the same d20 PendingResolution with identity rename invariance, atomic accepted payment, and Undo. Family C remains INCOMPLETE '
            'because the built-in Tactical Mind, Indomitable, Dark One\'s Own Luck, and Peerless Skill projections are still injected by named '
            'productionPlayRuntimeAdapter.ts checks; generic Common Play production timing does not yet structurally select failed/save/after-roll '
            'families for those representatives, Tactical Mind and Peerless Skill still require conditional pay-on-success semantics, and portable '
            'add-die/reroll still need connected duplicate/reconnect evidence.'
          )
          def add(field,*values):
            target=row[field]
            for value in values:
              if value not in target: target.append(value)
          add('implementationEvidence',
              '1342c99 Common Play post-roll add-die/reroll lowering reuses the generic d20 Resolver and authoritative dice',
              'commonPlayReactionDefinitionRuntime.ts portable literal/resource dice lowering for add-die/reroll')
          add('productionEvidence',
              '1342c99 unknown installed add-die/reroll production with authoritative dice and Undo',
              'C9 Family C Portable Dice Modifiers run 33289183121: 37/37 focused tests, tsc --noEmit, vite build')
          add('identityInvarianceEvidence',
              '1342c99 unknown installed add-die/reroll module/content/mechanic/interceptor/interaction/display rename invariance')
          row['remainingNamedSeams']=[
            'productionPlayRuntimeAdapter.ts injects Tactical Mind, Indomitable, Dark One\'s Own Luck, and Peerless Skill runtimeD20FollowUps behind class/subclass/feature identity checks',
            'generic Common Play production d20 timing still lacks structural family/outcome/save selection for failed, saving-throw, and after-roll representative triggers',
            'Tactical Mind and Peerless Skill require a generic conditional pay-on-success contract before their named projection can be removed',
            'portable add-die/reroll still need connected duplicate/reconnect evidence before Family C can be final'
          ]
          assert ledger['gateNBlockingNamedFallbacks']==[]
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): reconcile Family C portable dice evidence"
          git push
      - name: Advance Rerun STATE checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only
          python3 <<'PY'
          from pathlib import Path
          path=Path('.chatgpt-rerun/STATE.md')
          text=path.read_text()
          old='- sequence: `8`'
          if text.count(old)!=1: raise SystemExit('STATE sequence changed')
          text=text.replace(old,'- sequence: `9`',1)
          marker='## Family C reconciliation — deterministic post-roll advanced, portable dice follow-ups remain'
          if text.count(marker)!=1: raise SystemExit('STATE Family C marker changed')
          prefix=text.split(marker,1)[0]
          section='''## Family C reconciliation — portable dice execution proven, representative authoring remains\n\nFamily C (`d20-test-lifecycle`) remains `INCOMPLETE`, but the generic post-roll dice mechanism advanced materially without a named executor:\n\n- `1342c9928b32f8fd986fd61a2981cee957a3685b`: Common Play `roll.modify` now lowers authoritative `add-die` and `reroll` into the existing generic d20 Resolver. Reroll updates the authoritative natural d20 presentation rather than leaving the original face visible.\n- C9 Family C Portable Dice Modifiers run `33289183121`: focused 37/37, `tsc --noEmit`, and `vite build` passed. Unknown installed add-die/reroll content executed with arbitrary renamed module/content/mechanic/interceptor/interaction/display identities, atomic accepted payment, and Undo.\n- The earlier declarative Cutting Words and deterministic replace/minimum/target-add evidence remains retained and was not repeated.\n- Family C is not final: `productionPlayRuntimeAdapter.ts` still authors Tactical Mind, Indomitable, Dark One's Own Luck, and Peerless Skill `runtimeD20FollowUps` with named identity checks. The generic production timing layer still needs structural failed/save/after-roll selection; Tactical Mind and Peerless Skill need conditional pay-on-success; portable add-die/reroll still need connected duplicate/reconnect proof.\n- Coverage totals remain `IMPLEMENTED=4`, `INCOMPLETE=32`, `PROVEN_UNNEEDED=0`; `gateNBlockingNamedFallbacks` remains empty and overall verdict remains `V1 INCOMPLETE`.\n\n## Next Exact Action\n\nContinue Family C at the generic production timing boundary: add structural d20 family/outcome selection sufficient for failed checks/saves and after-roll decisions, then prove unknown portable add-die/reroll through Host/Client duplicate/reconnect/Undo. Reuse the existing Common Play interaction, d20 Resolver, payment, and connected event authority; do not migrate Tactical Mind or Peerless Skill until a generic conditional pay-on-success contract exists.\n'''
          path.write_text(prefix+section)
          PY
          git add .chatgpt-rerun/STATE.md
          git diff --cached --check
          git commit -m "docs(rerun): checkpoint Family C portable dice execution"
          git push
      - name: Publish control last
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('.chatgpt-rerun/control.json')
          control=json.loads(path.read_text())
          assert control['sequence']==8
          assert control['status']=='continue'
          control['sequence']=9
          control['status']='continue'
          control['reason']=(
            'C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. '
            'Family C now has unknown portable add-die/reroll production evidence at 1342c99 with 37/37 focused tests, typecheck, build, '
            'rename invariance, atomic accepted payment, and Undo. Family C remains INCOMPLETE because representative built-ins still use named '
            'runtimeD20FollowUps pending structural failed/save/after-roll timing, connected duplicate/reconnect evidence, and conditional pay-on-success.'
          )
          control['updated_at']='2026-08-30'
          path.write_text(json.dumps(control,ensure_ascii=False,indent=2)+'\n')
          PY
          git add .chatgpt-rerun/control.json
          git diff --cached --check
          git commit -m "docs(rerun): continue Family C timing and connected proof"
          git push
