name: C9 Family C d20 Diagnostic

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace Cutting Words declarative content
        shell: bash
        run: |
          set -euo pipefail
          echo '=== all Cutting Words / College of Lore references ==='
          grep -R -n -i -E 'cutting.words|college.of.lore|날카로운 말' . --exclude-dir=.git --exclude='package-lock.json' | head -n 320 || true
          echo '=== installed content reaction projection ==='
          sed -n '1,380p' src/app/commonPlayInterceptorProductionRuntimeAdapter.ts
          echo '=== progression/catalog source candidates ==='
          grep -R -n -E 'subclassFeatureIds|grantedEntryPoints|commonPlay|ruleModule|entryPoints' src/app src/domain scripts data content tests/fixtures 2>/dev/null | grep -E -i 'bard|lore|subclass|builtin|catalog' | head -n 320 || true
