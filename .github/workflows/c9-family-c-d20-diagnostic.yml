name: C9 Family C Publish Verified D20 Selectors

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply already-verified migration
        run: |
          python3 .github/c9-family-c-d20-migrate.py
          python3 .github/c9-family-c-save-guard.py

      - name: Commit verified product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            schemas/common-play-contract.schema.json \
            src/domain/commonPlayRuntime.ts \
            src/domain/commonPlayReactionDefinitionRuntime.ts \
            src/app/commonPlayInterceptorProductionRuntimeAdapter.ts \
            content/modules/dnd-srd-5.2.1.subclasses/module.json \
            tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          git diff --cached --check
          git commit -m "feat(common-play): add structural d20 outcome selectors"
          git push

      - name: Remove temporary migration helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/c9-family-c-d20-migrate.py .github/c9-family-c-save-guard.py
          git commit -m "ci(c9): remove structural d20 migration helpers"
          git push

# Exact product diff was verified in run 33290013900: 26/26 focused tests, tsc --noEmit, and vite build.