name: C9 Family C Cutting Words Migration

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate Cutting Words to declarative Common Play
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old,new,1))

          module_path=Path("content/modules/dnd-srd-5.2.1.class-feature-common-play/module.json")
          module=json.loads(module_path.read_text())
          feature_id="dnd.srd521.subclass.bard.college-of-lore.cutting-words"
          if any(entry.get("id")==feature_id for entry in module.get("content",[])):
              raise SystemExit("Cutting Words Common Play content already exists")
          fact_queries=[
              {"id":"trigger-distance","fact":"spatial.distance-feet","subject":"intercepted.actor","authority":"dm","visibility":"dm","unknownPolicy":"block"},
              {"id":"source-sees-trigger","fact":"sense.can-see","subject":"intercepted.actor","authority":"dm","visibility":"dm","unknownPolicy":"treat-false"},
          ]
          when={"op":"all","args":[
              {"op":"lte","left":{"ref":"trigger-distance"},"right":{"value":60}},
              {"op":"eq","left":{"ref":"source-sees-trigger"},"right":{"value":True}},
          ]}
          def interceptor(interceptor_id,timing,slot,interaction_id):
              return {
                  "id":interceptor_id,
                  "timing":timing,
                  "factQueries":fact_queries,
                  "when":when,
                  "interaction":{
                      "id":interaction_id,
                      "kind":"choice",
                      "responder":"actor-owner",
                      "mode":"blocking",
                      "input":{"type":"boolean"},
                      "revalidate":"if-revision-changed",
                      "stalePolicy":"reject",
                  },
                  "operation":"recalculate",
                  "slot":slot,
                  "operations":[{
                      "kind":"roll.modify",
                      "mode":"subtract-die",
                      "diceResource":"resource:bard.bardic-inspiration",
                  }],
              }
          module["content"].append({
              "id":feature_id,
              "category":"option",
              "presentation":{
                  "originalName":"Cutting Words",
                  "defaultLocale":"ko-KR",
                  "locales":{"ko-KR":{"name":"날카로운 말"}},
              },
              "tags":["class-feature","bard","college-of-lore","reaction"],
              "mechanics":[{
                  "kind":"common-play",
                  "config":{
                      "schemaVersion":"0.2-draft",
                      "id":"dnd.srd521.common-play.bard-lore-cutting-words",
                      "payments":[
                          {"kind":"economy","bucket":"reaction","amount":{"value":1},"consumeAt":"commit"},
                          {"kind":"resource","resource":"resource:bard.bardic-inspiration","amount":{"value":1},"consumeAt":"commit"},
                      ],
                      "interceptors":[
                          interceptor("cutting-words-d20","d20.outcome-determined","d20.roll","choose-cutting-words-d20"),
                          interceptor("cutting-words-damage","damage.rolled","primary.damage","choose-cutting-words-damage"),
                      ],
                  },
              }],
          })
          module_path.write_text(json.dumps(module,ensure_ascii=False,separators=(",",":"))+"\n")

          replace(
              "src/app/commonPlayInterceptorProductionRuntimeAdapter.ts",
              '''async function passiveReactionCandidates(adapter:MockAdapter):Promise<PassiveReactionCandidate[]> {\n  const internal=adapter as unknown as AdapterState;\n  const installed=await requiredSessionInstalledContent(adapter,[]);\n  if(!installed.length)return [];\n  const entries=new Map(installed.map((entry)=>[catalogQualifiedId(entry.contentId,entry.sourceId,entry.version),entry]));\n  const owners:Array<{sheet:CharacterSheet;identities:Set<string>}>=[{\n    sheet:internal.activeCharacter,\n    identities:contentIdentitySetForLocal(internal),\n  }];\n  for(const characterId of projectedCharacterIds(adapter)){\n    if(characterId===internal.activeCharacter.id)continue;\n    const mounted=projectedCharacterById(adapter,characterId);\n    if(mounted)owners.push({sheet:mounted.sheet,identities:new Set(mounted.projection.contentIdentities.map((entry)=>entry.qualifiedId))});\n  }\n\n  const candidates:PassiveReactionCandidate[]=[];\n  for(const owner of owners){\n    for(const qualifiedId of [...owner.identities].sort()){\n      const entry=entries.get(qualifiedId);''',
              '''async function passiveReactionCandidates(adapter:MockAdapter):Promise<PassiveReactionCandidate[]> {\n  const internal=adapter as unknown as AdapterState;\n  const installed=await requiredSessionInstalledContent(adapter,[]);\n  const installedEntries=new Map(installed.map((entry)=>[catalogQualifiedId(entry.contentId,entry.sourceId,entry.version),entry]));\n  const builtinEntries=new Map(internal.catalog\n    .filter((entry)=>entry.scope==="builtin"&&entry.mechanics?.some((mechanic)=>mechanic.kind==="common-play"))\n    .map((entry)=>[entry.id,entry]));\n  const owners:Array<{sheet:CharacterSheet;identities:Set<string>}>=[{\n    sheet:internal.activeCharacter,\n    identities:contentIdentitySetForLocal(internal),\n  }];\n  for(const characterId of projectedCharacterIds(adapter)){\n    if(characterId===internal.activeCharacter.id)continue;\n    const mounted=projectedCharacterById(adapter,characterId);\n    if(mounted)owners.push({sheet:mounted.sheet,identities:new Set(mounted.projection.contentIdentities.map((entry)=>entry.qualifiedId))});\n  }\n  for(const owner of owners){\n    const featureIds=new Set(owner.sheet.subclassFeatureIds??[]);\n    for(const entry of builtinEntries.values()) if(entry.contentId&&featureIds.has(entry.contentId)) owner.identities.add(entry.id);\n  }\n\n  const candidates:PassiveReactionCandidate[]=[];\n  for(const owner of owners){\n    for(const qualifiedId of [...owner.identities].sort()){\n      const entry=installedEntries.get(qualifiedId)??builtinEntries.get(qualifiedId);''')

          replace(
              "src/app/offlineRuntimeAdapters.ts",
              'import "./bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter";\n',
              '')

          test_path="tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts"
          replace(
              test_path,
              '  assert.equal(snapshot.resolution?.checkOutcome,"실패");\n  assert.equal(snapshot.resolution?.rollTotal,14);',
              '  assert.equal(snapshot.resolution?.checkOutcome,"실패");\n  assert.equal(snapshot.resolution?.rollTotal,14);\n  assert.ok(snapshot.resolution?.provenance.some((entry)=>entry.includes("common-play:")),JSON.stringify(snapshot.resolution?.provenance));')

          legacy=Path("src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts")
          if not legacy.exists():
              raise SystemExit("legacy Cutting Words adapter is already absent")
          legacy.unlink()
          PY

          if grep -R -n 'bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter' src tests --exclude-dir=generated; then
            echo 'legacy Cutting Words adapter reference remains' >&2
            exit 1
          fi
      - name: Verify focused Family C migration
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:content
          npx tsx --test tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts tests/domain/commonPlayReactionDefinitionRuntime.test.ts tests/domain/commonPlayReactionResourceDieRuntime.test.ts
          npx tsc --noEmit
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/modules/dnd-srd-5.2.1.class-feature-common-play/module.json src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/offlineRuntimeAdapters.ts tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts
          git add -u src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts
          git diff --cached --check
          git commit -m "feat(common-play): migrate Cutting Words interceptor"
          git push
