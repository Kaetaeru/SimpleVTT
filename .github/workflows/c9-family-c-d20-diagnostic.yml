name: C9 Family C Reconciliation

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile authoritative Family C ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text())
          rows=ledger['rows']
          assert len(rows)==36
          row=next(item for item in rows if item['family']=='C')
          assert row['disposition']=='INCOMPLETE'
          row['currentState']=(
            'The generic d20 Resolver supports checks/saves/attacks, proficiency-derived modifiers, advantage/disadvantage, '
            'flat/additional dice, DC/target modification, reroll, replace, minimum, outcome recalculation, and criticals. '
            'Production Common Play now proves declarative Cutting Words subtract-die plus arbitrary installed post-roll '
            'replace/minimum/target-add through the existing reaction transaction with atomic payment and Undo. Family C '
            'remains INCOMPLETE because post-roll add-die/reroll for Tactical Mind, Indomitable, Dark One\'s Own Luck, and '
            'Peerless Skill are still injected into runtimeD20FollowUps by named class/subclass/feature checks in '
            'productionPlayRuntimeAdapter.ts rather than authored by unknown portable content.'
          )
          def add(field,*values):
            target=row[field]
            for value in values:
              if value not in target: target.append(value)
          add('implementationEvidence',
              'commonPlayRuntime.ts generic post-roll reaction roll.modify lowering',
              'commonPlayReactionDefinitionRuntime.ts structural deterministic post-roll lowering',
              'commonPlayD20Runtime.test.ts generic reroll/replace/minimum/target-add/add-die semantics')
          add('productionEvidence',
              '6d03412 declarative Cutting Words production migration',
              '6f6ed2e arbitrary installed deterministic post-roll replace/minimum/target-add production',
              'installedCommonPlayInterceptorProductionRuntime.test.ts')
          add('identityInvarianceEvidence',
              '6f6ed2e unknown installed deterministic interceptor module/content/mechanic/interceptor/interaction/display rename invariance',
              'installedCommonPlayInterceptorProductionRuntime.test.ts portable interceptor rename invariance')
          row['remainingNamedSeams']=[
            'productionPlayRuntimeAdapter.ts injects Tactical Mind, Indomitable, Dark One\'s Own Luck, and Peerless Skill runtimeD20FollowUps behind class/subclass/feature identity checks',
            'unknown portable Common Play does not yet author post-roll add-die/reroll through the production reaction path'
          ]
          assert 'Cutting Words' not in row['remainingNamedSeams']
          assert ledger['gateNBlockingNamedFallbacks']==[]
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): reconcile Family C post-roll coverage"
          git push
      - name: Advance Rerun STATE checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('.chatgpt-rerun/STATE.md')
          text=path.read_text()
          old='- sequence: `7`'
          if text.count(old)!=1: raise SystemExit('STATE sequence changed')
          text=text.replace(old,'- sequence: `8`',1)
          marker='## Next Exact Action\n\n'
          if text.count(marker)!=1: raise SystemExit('STATE Next Exact Action marker changed')
          prefix=text.split(marker,1)[0]
          section='''## Family C reconciliation — deterministic post-roll advanced, portable dice follow-ups remain\n\nFamily C (`d20-test-lifecycle`) remains `INCOMPLETE`, but two named/structural gaps were closed without a second roll engine:\n\n- `6d03412dcecc7186a2b0ee41da438f498c5333a0`: Cutting Words moved from its named side engine into declarative Common Play; the named adapter was deleted. Focused production evidence was 14/14 plus `tsc --noEmit`.\n- `6f6ed2e071b50a1b95d90a265aac541485bdf4b4`: the existing Common Play post-roll reaction path now lowers deterministic `replace`, `minimum`, `target-add`, and `add-flat` into the existing d20 Resolver. Unknown installed identity/rename, atomic Reaction/resource payment, and Undo are proven. Focused verification was 42/42, `tsc --noEmit`, and `vite build`.\n- The remaining Family C production seam is now precise: `d20FollowUpRuntimeAdapter.ts` is a generic executor, but `productionPlayRuntimeAdapter.ts` still injects Tactical Mind, Indomitable, Dark One's Own Luck, and Peerless Skill `runtimeD20FollowUps` behind named class/subclass/feature checks. Those add-die/reroll follow-ups therefore do not yet prove unknown portable content authoring.\n- Coverage totals remain `IMPLEMENTED=4`, `INCOMPLETE=32`, `PROVEN_UNNEEDED=0`; `gateNBlockingNamedFallbacks` remains empty and overall verdict remains `V1 INCOMPLETE`.\n\n'''
          next_action='''## Next Exact Action\n\nContinue Family C by moving post-roll `add-die` and `reroll` authoring for the remaining representative follow-ups out of named `productionPlayRuntimeAdapter.ts` identity checks and into the existing portable Common Play reaction/Resolver path. Reuse the current d20 Resolver, interaction authority, resource payment, persistence, and connected event transport; do not add a feature-specific executor or second roll engine. Prove an arbitrary/renamed installed definition in production, then add connected duplicate/reconnect/Undo evidence before considering Family C final.\n'''
          path.write_text(prefix+section+next_action)
          PY
          git add .chatgpt-rerun/STATE.md
          git diff --cached --check
          git commit -m "docs(rerun): checkpoint Family C deterministic post-roll migration"
          git push
      - name: Publish control last
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('.chatgpt-rerun/control.json')
          control=json.loads(path.read_text())
          assert control['run_id']=='b7f27a61-29d8-4ba2-9f93-8e66722d5f41'
          assert control['task_id']=='v1-common-play-c8-rerun'
          assert control['sequence']==7
          control['sequence']=8
          control['status']='continue'
          control['reason']=(
            'C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. '
            'Family C now has declarative Cutting Words and arbitrary installed deterministic post-roll replace/minimum/target-add '
            'production evidence; the remaining C seam is named productionPlayRuntimeAdapter runtimeD20FollowUps authoring for '
            'add-die/reroll representatives. Next migrate those follow-ups to portable Common Play and prove arbitrary identity plus connected/reconnect/Undo.'
          )
          control['updated_at']='2026-08-30'
          path.write_text(json.dumps(control,ensure_ascii=False,indent=2)+'\n')
          PY
          git add .chatgpt-rerun/control.json
          git diff --cached --check
          git commit -m "docs(rerun): continue Family C portable dice follow-ups"
          git push
