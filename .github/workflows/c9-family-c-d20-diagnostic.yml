name: C9 Family C d20 Diagnostic

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Cutting Words production seams
        shell: bash
        run: |
          set -euo pipefail
          echo '=== named adapter references ==='
          grep -R -n -E 'bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter|LORE_CUTTING_WORDS_SOURCE|CUTTING_WORDS_INTERRUPT_ID' src tests 2>/dev/null || true
          echo '=== generic interceptor and reaction definitions ==='
          grep -R -n -E 'CommonPlayReactionDefinition|attack\.outcome-determined|d20\.outcome-determined|damage\.rolled|subtract-die' src tests 2>/dev/null | head -n 240 || true
          echo '=== likely bootstrap imports ==='
          grep -R -n -E '^import .*RuntimeAdapter|^import "\./.*RuntimeAdapter"' src/app src 2>/dev/null | grep -E 'Cutting|commonPlayInterceptor|d20FollowUp|RuntimeAdapter' | head -n 240 || true
      - name: Current typecheck
        shell: bash
        run: |
          npm ci
          npm run generate:content
          npx tsc --noEmit
