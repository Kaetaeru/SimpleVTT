name: C9 Family C Portable Dice Modifiers

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect portable add-die and reroll to Common Play
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1))

          replace_once(
              'src/domain/commonPlayRuntime.ts',
              '''export type CommonPlayRollModifyOperation =\n  | { kind:"roll.modify"; mode:"subtract-die"; dice:string }\n  | { kind:"roll.modify"; mode:"add-flat"|"target-add"|"replace"|"minimum"; value:LiteralExpression };''',
              '''export type CommonPlayRollModifyOperation =\n  | { kind:"roll.modify"; mode:"add-die"; dice:string }\n  | { kind:"roll.modify"; mode:"subtract-die"; dice:string }\n  | { kind:"roll.modify"; mode:"reroll"; dice:string }\n  | { kind:"roll.modify"; mode:"add-flat"|"target-add"|"replace"|"minimum"; value:LiteralExpression };''',
          )

          replace_once(
              'src/domain/commonPlayRuntime.ts',
              '''    if(operation.mode==="subtract-die") {\n      const formula=parseDiceFormula(operation.dice,"d20.roll subtract-die");\n      const faces=authority?.modifierDiceFaces?.[index];\n      if(!faces||faces.length!==formula.count||faces.some((face)=>!Number.isInteger(face)||face<1||face>formula.sides)) {\n        throw new Error(`d20.roll interceptor ${index} requires authoritative die face(s)`);\n      }\n      const modifications:D20RollModification[]=[{source,mode:"subtract-die",dice:{id:`${source}:dice`,purpose:source,sides:formula.sides,faces:[...faces]}}];\n      if(formula.flat!==0) modifications.push({source:`${source}:flat`,mode:"add-flat",value:-formula.flat});\n      return modifications;\n    }''',
              '''    if(operation.mode==="add-die"||operation.mode==="subtract-die"||operation.mode==="reroll") {\n      const formula=parseDiceFormula(operation.dice,`d20.roll ${operation.mode}`);\n      if(operation.mode==="reroll"&&(formula.sides!==20||formula.flat!==0)) throw new Error("d20.roll reroll requires Xd20 with no flat modifier");\n      const faces=authority?.modifierDiceFaces?.[index];\n      if(!faces||faces.length!==formula.count||faces.some((face)=>!Number.isInteger(face)||face<1||face>formula.sides)) {\n        throw new Error(`d20.roll interceptor ${index} requires authoritative die face(s)`);\n      }\n      const dice={id:`${source}:dice`,purpose:source,sides:formula.sides,faces:[...faces]};\n      if(operation.mode==="reroll") return [{source,mode:"reroll",dice}];\n      const modifications:D20RollModification[]=[{source,mode:operation.mode,dice}];\n      if(formula.flat!==0) modifications.push({source:`${source}:flat`,mode:"add-flat",value:operation.mode==="subtract-die"?-formula.flat:formula.flat});\n      return modifications;\n    }''',
          )

          replace_once(
              'src/domain/commonPlayReactionDefinitionRuntime.ts',
              '''      if(raw.mode==="subtract-die") {\n        const hasLiteral=typeof raw.dice==="string";\n        const hasResource=typeof raw.diceResource==="string"&&raw.diceResource.length>0;\n        if(hasLiteral===hasResource) throw new DomainEvaluationError(`${label}.operations[${operationIndex}] must declare exactly one of dice or diceResource`);\n        if(raw.value!==undefined) throw new DomainEvaluationError(`${label}.operations[${operationIndex}].value is not allowed for subtract-die`);\n        if(hasLiteral) {\n          if(!/^([0-9]+)d([0-9]+)([+-][0-9]+)?$/.test(raw.dice as string)) throw new DomainEvaluationError(`${label}.operations[${operationIndex}].dice must be a dice formula`);\n          return {kind:"roll.modify" as const,mode:"subtract-die" as const,dice:raw.dice as string};\n        }\n        const resourceId=raw.diceResource as string;\n        const sides=options.resolveResourceDie?.(resourceId);\n        if(typeof sides!=="number"||!Number.isInteger(sides)||sides<2) throw new DomainEvaluationError(`${label}.operations[${operationIndex}].diceResource has no authoritative die size: ${resourceId}`);\n        return {kind:"roll.modify" as const,mode:"subtract-die" as const,dice:`1d${sides}`};\n      }''',
              '''      if(raw.mode==="add-die"||raw.mode==="subtract-die"||raw.mode==="reroll") {\n        const hasLiteral=typeof raw.dice==="string";\n        const hasResource=typeof raw.diceResource==="string"&&raw.diceResource.length>0;\n        if(hasLiteral===hasResource) throw new DomainEvaluationError(`${label}.operations[${operationIndex}] must declare exactly one of dice or diceResource`);\n        if(raw.value!==undefined) throw new DomainEvaluationError(`${label}.operations[${operationIndex}].value is not allowed for ${raw.mode}`);\n        if(hasLiteral) {\n          const match=/^([0-9]+)d([0-9]+)([+-][0-9]+)?$/.exec(raw.dice as string);\n          if(!match) throw new DomainEvaluationError(`${label}.operations[${operationIndex}].dice must be a dice formula`);\n          if(raw.mode==="reroll"&&(Number(match[2])!==20||Number(match[3]??0)!==0)) throw new DomainEvaluationError(`${label}.operations[${operationIndex}] reroll requires Xd20 with no flat modifier`);\n          return {kind:"roll.modify" as const,mode:raw.mode,dice:raw.dice as string};\n        }\n        const resourceId=raw.diceResource as string;\n        const sides=options.resolveResourceDie?.(resourceId);\n        if(typeof sides!=="number"||!Number.isInteger(sides)||sides<2) throw new DomainEvaluationError(`${label}.operations[${operationIndex}].diceResource has no authoritative die size: ${resourceId}`);\n        if(raw.mode==="reroll"&&sides!==20) throw new DomainEvaluationError(`${label}.operations[${operationIndex}] reroll diceResource must resolve to d20`);\n        return {kind:"roll.modify" as const,mode:raw.mode,dice:`1d${sides}`};\n      }''',
          )

          replace_once(
              'src/app/commonPlayInterceptorProductionRuntimeAdapter.ts',
              '''    if(operation.mode!=="subtract-die")return;''',
              '''    if(operation.mode!=="add-die"&&operation.mode!=="subtract-die"&&operation.mode!=="reroll")return;''',
          )
          replace_once(
              'src/app/commonPlayInterceptorProductionRuntimeAdapter.ts',
              '''  resolution.rollTotal=result.total;\n  const rolled=authority?.modifierDiceFaces?Object.values(authority.modifierDiceFaces).flat():[];''',
              '''  resolution.rollTotal=result.total;\n  resolution.naturalD20=result.natural;\n  if(resolution.authoritativeDice.length)resolution.authoritativeDice[0]=result.natural;\n  else resolution.authoritativeDice=[result.natural];\n  const rolled=authority?.modifierDiceFaces?Object.values(authority.modifierDiceFaces).flat():[];''',
          )

          path=Path('tests/domain/commonPlayReactionDefinitionRuntime.test.ts')
          text=path.read_text()
          marker='''test("portable d20 interceptor lowers deterministic post-roll roll.modify modes structurally",()=>{'''
          addition='''test("portable d20 interceptor lowers authoritative add-die and reroll modes structurally",()=>{\n  const definition=portableReaction();\n  definition.interceptors![0].operations=[\n    {kind:"roll.modify",mode:"add-die",dice:"1d8+1"},\n    {kind:"roll.modify",mode:"reroll",dice:"1d20"},\n  ];\n  const lowered=lowerCommonPlayReactionDefinition(definition)!;\n  assert.deepEqual(lowered.interceptors[0].operations,definition.interceptors![0].operations);\n\n  const invalid=portableReaction();\n  invalid.interceptors![0].operations=[{kind:"roll.modify",mode:"reroll",dice:"1d8"}];\n  assert.throws(()=>lowerCommonPlayReactionDefinition(invalid),/reroll requires Xd20/);\n\n  const damage=portableReaction();\n  Object.assign(damage.interceptors![0],{timing:"damage.rolled",slot:"primary.damage",operations:[{kind:"roll.modify",mode:"add-die",dice:"1d6"}]});\n  assert.throws(()=>lowerCommonPlayReactionDefinition(damage),/primary.damage supports subtract-die only/);\n});\n\n'''
          if text.count(marker)!=1: raise SystemExit('reaction definition test marker changed')
          path.write_text(text.replace(marker,addition+marker,1))

          path=Path('tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts')
          text=path.read_text()
          marker='''test("portable installed d20 interceptor can turn a successful production attack into a miss",async()=>{'''
          addition='''test("unknown installed add-die executes in production with rename invariance and Undo",async()=>{\n  const operations=[{kind:"roll.modify",mode:"add-die",dice:"1d8"}];\n  const renamed:Identity={...ORIGINAL,moduleId:"external.add-die-renamed",contentId:"item.add-die-renamed",mechanicId:"mechanic.add-die-renamed",interceptorId:"interceptor.add-die-renamed",interactionId:"interaction.add-die-renamed",displayName:"Renamed Add Die"};\n  const execute=async(identity:Identity)=>{\n    const adapter=await prepare(identity,false,"d20",operations);\n    let snapshot=await adapter.getSnapshot();\n    const responderId=snapshot.activeCharacter.id;\n    const resourceBefore=secondWind(snapshot)!;\n    snapshot=await openAbilityCheckInterrupt(adapter);\n    await adapter.setQueuedD20(6);\n    snapshot=await adapter.respondToInterrupt(true);\n    const mechanical={outcome:snapshot.resolution?.checkOutcome,total:snapshot.resolution?.rollTotal,natural:snapshot.resolution?.naturalD20};\n    assert.deepEqual(mechanical,{outcome:"성공",total:21,natural:15});\n    assert.equal(secondWind(snapshot),resourceBefore-1);\n    assert.equal(snapshot.scene.economyByActor[responderId]?.reaction,false);\n    snapshot=await adapter.undoLastResolution();\n    assert.equal(secondWind(snapshot),resourceBefore);\n    assert.equal(snapshot.scene.economyByActor[responderId]?.reaction,true);\n    return mechanical;\n  };\n  assert.deepEqual(await execute(renamed),await execute(ORIGINAL));\n});\n\ntest("unknown installed reroll executes in production with rename invariance and Undo",async()=>{\n  const operations=[{kind:"roll.modify",mode:"reroll",dice:"1d20"}];\n  const renamed:Identity={...ORIGINAL,moduleId:"external.reroll-renamed",contentId:"item.reroll-renamed",mechanicId:"mechanic.reroll-renamed",interceptorId:"interceptor.reroll-renamed",interactionId:"interaction.reroll-renamed",displayName:"Renamed Reroll"};\n  const execute=async(identity:Identity)=>{\n    const adapter=await prepare(identity,false,"d20",operations);\n    let snapshot=await adapter.getSnapshot();\n    const responderId=snapshot.activeCharacter.id;\n    const resourceBefore=secondWind(snapshot)!;\n    snapshot=await openAbilityCheckInterrupt(adapter);\n    await adapter.setQueuedD20(4);\n    snapshot=await adapter.respondToInterrupt(true);\n    const mechanical={outcome:snapshot.resolution?.checkOutcome,total:snapshot.resolution?.rollTotal,natural:snapshot.resolution?.naturalD20,die:snapshot.resolution?.authoritativeDice[0]};\n    assert.deepEqual(mechanical,{outcome:"실패",total:4,natural:4,die:4});\n    assert.equal(secondWind(snapshot),resourceBefore-1);\n    assert.equal(snapshot.scene.economyByActor[responderId]?.reaction,false);\n    snapshot=await adapter.undoLastResolution();\n    assert.equal(secondWind(snapshot),resourceBefore);\n    assert.equal(snapshot.scene.economyByActor[responderId]?.reaction,true);\n    return mechanical;\n  };\n  assert.deepEqual(await execute(renamed),await execute(ORIGINAL));\n});\n\n'''
          if text.count(marker)!=1: raise SystemExit('production interceptor test marker changed')
          path.write_text(text.replace(marker,addition+marker,1))
          PY
      - name: Verify focused Family C portable dice slice
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate:content
          npx tsx --test tests/domain/commonPlayReactionDefinitionRuntime.test.ts tests/domain/commonPlayReactionRuntime.test.ts tests/domain/commonPlayReactionResourceDieRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts
          npx tsc --noEmit
          npx vite build
      - name: Commit verified product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayRuntime.ts src/domain/commonPlayReactionDefinitionRuntime.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts tests/domain/commonPlayReactionDefinitionRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          git diff --cached --check
          git commit -m "feat(common-play): support portable post-roll dice modifiers"
          git push
