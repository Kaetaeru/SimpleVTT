name: C9 Family C d20 Diagnostic

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-c-d20-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace scaling-die ownership
        shell: bash
        run: |
          set -euo pipefail
          echo '=== bardic resource definition uses ==='
          grep -R -n -E 'bardicInspirationResourceDefinition|BARDIC_INSPIRATION_RESOURCE_ID' src tests --exclude='package-lock.json' | head -n 320 || true
          echo '=== CharacterResourceVm creation / projection ==='
          grep -R -n -E 'CharacterResourceVm|resources\.push|resources:.*map|label:.*current:.*max:' src/app tests --exclude='package-lock.json' | head -n 320 || true
          echo '=== reaction dice contract ==='
          sed -n '105,180p' src/domain/commonPlayReactionDefinitionRuntime.ts
          sed -n '350,390p' schemas/common-play-contract.schema.json
