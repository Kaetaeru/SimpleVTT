name: M1 Portable RuleModule Mechanics

on:
  pull_request:
    paths:
      - "schemas/installed-content.schema.json"
      - "src/app/ruleModulePackageImport.ts"
      - "src/app/installedContentContracts.ts"
      - "src/app/installedContentPersistence.ts"
      - "src/app/installedContentRuntimeAdapter.ts"
      - "src/domain/commonPlayOperationRuntime.ts"
      - "tests/ui/ruleModulePackageImport.test.ts"
      - "tests/ui/ruleModulePortableMechanicsPersistence.test.ts"
      - ".github/workflows/m1-portable-rulemodule-mechanics.yml"
  workflow_dispatch:

jobs:
  portable-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify supported and unsupported RuleModule mechanics
        run: >-
          npx tsx --test
          tests/ui/ruleModulePortableMechanicsPersistence.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
