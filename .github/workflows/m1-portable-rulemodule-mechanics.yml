name: M1 Portable RuleModule Mechanics

on:
  pull_request:
    paths:
      - "src/app/ruleModulePackageImport.ts"
      - "src/app/installedContentContracts.ts"
      - "src/app/installedContentRuntimeAdapter.ts"
      - "src/domain/commonPlayOperationRuntime.ts"
      - "tests/ui/ruleModulePortableMechanicsPersistence.test.ts"
      - ".github/workflows/m1-portable-rulemodule-mechanics.yml"
  workflow_dispatch:

jobs:
  portable-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify portable RuleModule mechanics persistence
        run: npx tsx --test tests/ui/ruleModulePortableMechanicsPersistence.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
