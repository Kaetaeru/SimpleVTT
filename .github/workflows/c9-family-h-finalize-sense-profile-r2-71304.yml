name: C9 Family H Finalize Sense Profile R2 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-h-finalize-sense-profile-r2-71304.yml]

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family H evidence
        run: |
          grep -q '"sense.darkvision.range-feet"' rules/profiles/dnd.srd-5.2.1.profile.json
          grep -q 'RULES_PROFILE_SENSE_PROPERTIES' src/app/commonPlayInterceptorProductionRuntimeAdapter.ts
          grep -q 'portable production derives Darkvision from a generic RulesProfile modifier' tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/domain/commonPlayPropertyContractRuntime.test.ts tests/ui/c9FamilyHSearchDiscoveryProduction.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish Family H against latest ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          repo="$GITHUB_REPOSITORY"
          path=docs/rules/v1-mechanism-coverage-ledger.json
          for attempt in 1 2 3 4; do
            meta="$(gh api -X GET "repos/$repo/contents/$path?ref=$branch")"
            sha="$(jq -r .sha <<<"$meta")"
            jq -r .content <<<"$meta" | base64 -d > /tmp/ledger.json
            python3 - "$sha" "$branch" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path
          path=Path('/tmp/ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item.get('family')=='H')
          complete='Rules-derived Darkvision, Blindsight, Tremorsense, and Truesight acquisition projects generic RulesProfile sense.<kind>.range-feet properties and Resolver-owned property modifiers into authoritative observer senses through the shared sensing kernel. Family H is complete.'
          marker='Family H remains incomplete only for rules-derived special-sense acquisition/derivation into authoritative observer sense profiles.'
          if marker in row['currentState']:
              row['currentState']=row['currentState'].replace(marker,complete)
          elif complete not in row['currentState'] and row.get('disposition')!='IMPLEMENTED':
              raise SystemExit('Family H state changed incompatibly; refusing rewrite')
          implementation='dnd.srd-5.2.1.profile.json sense.<kind>.range-feet properties and commonPlayInterceptorProductionRuntimeAdapter.ts generic runtime profile-property projection derive Darkvision/Blindsight/Tremorsense/Truesight from Resolver Effect modifiers without content identity dispatch'
          production='2b79dfc41013b9a20eed4c2ea779df6b922d6d10 and dabe88ee00dd104cf78640bb545d81aef745d487 add RulesProfile sense ranges and production projection; 434ae0ca6ba268c828da91af3660bfe633f74c25 adds the rename-invariant regression; C9 Family H Sense Profile run 33314316843 passed 29/29 targeted property/sensing/production tests, legacy execution boundary, and tsc --noEmit before publishing the regression proof'
          identity='installedCommonPlayInterceptorProductionRuntime.test.ts proves RulesProfile-derived Darkvision remains unchanged after external module/content/mechanic/interceptor/interaction/display and sense-source identity rename'
          for key,value in [('implementationEvidence',implementation),('productionEvidence',production),('identityInvarianceEvidence',identity)]:
              if value not in row[key]: row[key].append(value)
          row['remainingNamedSeams']=[]
          row['disposition']='IMPLEMENTED'
          rendered=(json.dumps(data,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
          payload={
              'message':'docs(c9): finalize Family H coverage',
              'content':base64.b64encode(rendered).decode('ascii'),
              'sha':sys.argv[1],
              'branch':sys.argv[2],
          }
          Path('/tmp/payload.json').write_text(json.dumps(payload),encoding='utf-8')
          PY
            if gh api --method PUT "repos/$repo/contents/$path" --input /tmp/payload.json >/dev/null 2>/tmp/publish.err; then
              exit 0
            fi
            cat /tmp/publish.err >&2
            sleep 1
          done
          exit 1
      - name: Retire Family H finalizers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          repo="$GITHUB_REPOSITORY"
          for path in \
            .github/workflows/c9-family-h-finalize-sense-profile-r2-71304.yml \
            .github/workflows/c9-family-h-finalize-sense-profile-71304.yml \
            .github/workflows/c9-family-h-profile-senses-71304.yml; do
            meta="$(gh api -X GET "repos/$repo/contents/$path?ref=$branch" 2>/dev/null || true)"
            [[ -n "$meta" ]] || continue
            sha="$(jq -r .sha <<<"$meta")"
            jq -n --arg message "ci(c9): retire Family H finalizer" --arg sha "$sha" --arg branch "$branch" '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$repo/contents/$path" --input - >/dev/null
          done
