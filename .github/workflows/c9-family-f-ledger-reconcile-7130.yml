name: C9 Family F Ledger Reconcile

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-f-ledger-reconcile-7130.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile latest branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - name: Update Family F evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          family=next(entry for entry in data['families'] if entry.get('family')=='F')
          family['currentState']='Generic fixed-pool allocation is PRODUCTION for unknown installed Common Play with integer/per-target bounds, atomic pre-execution validation, Undo, rename invariance, and Host/Client convergence; durable pending-decision reconnect resume and automatic allocation policy remain incomplete.'
          family['disposition']='INCOMPLETE'
          family['implementationEvidence']=[
            'commonPlayAllocationRuntime.ts resolves typed allocation requests with revision/idempotency identity, fixed-pool totals, per-target bounds, duplicate rejection, and candidate validation',
            'commonPlayOperationRuntime.ts parses portable entryPoint allocation definitions structurally without content-name or content-ID dispatch',
            'installedCommonPlayRuntimeAdapter.ts validates allocation before downstream Resolver compile and preserves repeated selected-target sequence as authored integer allocation',
          ]
          family['productionEvidence']=[
            'installedCommonPlayAllocationProductionRuntime.test.ts rejects under-allocation before downstream commit, commits a 2+1 fixed-pool allocation, projects deduplicated targets, and restores the downstream economy event on Undo',
            'C9 Family F Allocation Convergence run 33309807201 passed allocation domain/production/convergence tests, legacy execution boundary, and tsc --noEmit',
          ]
          family['identityInvarianceEvidence']=[
            'commonPlayAllocationRuntime.test.ts proves allocation behavior is content-identity invariant',
            'installedCommonPlayAllocationProductionRuntime.test.ts preserves production allocation semantics under complete external module/content/mechanic rename',
          ]
          family['connectedEvidenceIfRelevant']=[
            'installedCommonPlayAllocationProductionRuntime.test.ts proves the allocation-gated downstream commit converges once through Host/Client event transport and duplicate replay is rejected as duplicate',
          ]
          family['persistenceEvidenceIfRelevant']=[]
          family['remainingNamedSeams']=[
            'durable pending allocation decision and reconnect/retry resume are not yet production-backed',
            'legacy named Magic Missile automatic projectile allocation and Paladin healing allocation have not yet converged on the portable allocation path',
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate ledger JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'))"
      - name: Commit evidence and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/c9-family-f-ledger-reconcile-7130.yml \
            .github/workflows/c9-family-f-allocation-repair.yml \
            .github/workflows/c9-family-f-allocation-convergence-7130.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile Family F allocation evidence"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
