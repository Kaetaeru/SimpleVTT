name: C9 Fix Max HP Harness 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-fix-max-hp-harness-71304.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add generated content prerequisite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/c9-family-l-max-hp-source-71304.yml')
          text=p.read_text()
          old='''      - name: Verify Family L max HP slice\n        shell: bash\n        run: |\n          npx tsx --test'''
          new='''      - name: Verify Family L max HP slice\n        shell: bash\n        run: |\n          npm run generate:content\n          npx tsx --test'''
          if old not in text:
              raise SystemExit('max HP verify anchor missing or already fixed')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Commit and publish harness fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-l-max-hp-source-71304.yml
          git rm .github/workflows/c9-fix-max-hp-harness-71304.yml
          git commit -m "ci(c9): generate content before max HP verification"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
