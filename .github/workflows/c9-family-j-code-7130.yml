name: C9 Family J Code 7130

on:
  push:
    branches:
      - agent/c9-j-unarmed-code-7130
    paths:
      - .github/workflows/c9-family-j-code-7130.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-j-unarmed-code-7130
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply code-only Family J migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('src/app/contracts.ts','import type { DurationSpec, EffectTermination } from "../domain/effects";\n','import type { DurationSpec, EffectTermination } from "../domain/effects";\nimport type { ConditionId } from "../domain/conditions";\n')
          replace_once('src/app/contracts.ts','  movementBudgetGainFeet?:number;\n  sessionStatusEffect?:{\n','  movementBudgetGainFeet?:number;\n  runtimeSaveCondition?:{\n    conditionId:ConditionId;\n    label:string;\n    displayName:string;\n    saveAbilities:AbilityKey[];\n    duration:DurationSpec;\n    termination?:EffectTermination;\n  };\n  sessionStatusEffect?:{\n')
          replace_once('src/app/productionPlayRuntimeAdapter.ts','    summary:`근력/민첩 내성 DC ${unarmedSaveDc} · 실패 시 붙잡힘`,available:true,eligibleTargetIds:[],saveDc:unarmedSaveDc,saveAbility:"근력 또는 민첩",attacksPerAction:unarmedAttacks,\n    details:[detail("대상 내성","근력 또는 민첩 중 높은 값"),detail("DC",String(unarmedSaveDc)),detail("실패","붙잡힘"),detail("출처","SRD 5.2.1 · Unarmed Strike")],\n','    summary:`근력/민첩 내성 DC ${unarmedSaveDc} · 실패 시 붙잡힘`,available:true,eligibleTargetIds:[],saveDc:unarmedSaveDc,saveAbility:"근력 또는 민첩",attacksPerAction:unarmedAttacks,\n    runtimeSaveCondition:{conditionId:"grappled",label:"붙잡힘",displayName:"맨손 타격 · 붙잡기",saveAbilities:["str","dex"],duration:{kind:"special",key:`escape:${character.id}`},termination:{sourceBecomesIncapacitated:true,sourceDies:true}},\n    details:[detail("대상 내성","근력 또는 민첩 중 높은 값"),detail("DC",String(unarmedSaveDc)),detail("실패","붙잡힘"),detail("출처","SRD 5.2.1 · Unarmed Strike")],\n')
          replace_once('src/app/productionPlayRuntimeAdapter.ts','    summary:`근력/민첩 내성 DC ${unarmedSaveDc} · 실패 시 넘어짐`,available:true,eligibleTargetIds:[],saveDc:unarmedSaveDc,saveAbility:"근력 또는 민첩",attacksPerAction:unarmedAttacks,\n    details:[detail("대상 내성","근력 또는 민첩 중 높은 값"),detail("DC",String(unarmedSaveDc)),detail("실패","넘어짐"),detail("공간 모듈","미연결 시 밀어내기 대신 넘어뜨리기만 자동 적용"),detail("출처","SRD 5.2.1 · Unarmed Strike")],\n','    summary:`근력/민첩 내성 DC ${unarmedSaveDc} · 실패 시 넘어짐`,available:true,eligibleTargetIds:[],saveDc:unarmedSaveDc,saveAbility:"근력 또는 민첩",attacksPerAction:unarmedAttacks,\n    runtimeSaveCondition:{conditionId:"prone",label:"넘어짐",displayName:"맨손 타격 · 넘어뜨리기",saveAbilities:["str","dex"],duration:{kind:"special",key:"stand-up"}},\n    details:[detail("대상 내성","근력 또는 민첩 중 높은 값"),detail("DC",String(unarmedSaveDc)),detail("실패","넘어짐"),detail("공간 모듈","미연결 시 밀어내기 대신 넘어뜨리기만 자동 적용"),detail("출처","SRD 5.2.1 · Unarmed Strike")],\n')

          p=Path('src/app/unarmedControlRuntimeAdapter.ts'); text=p.read_text(encoding='utf-8')
          old_import='import type { ActionVm, ActivityEntry, AppRole, AppSnapshot, CharacterSheet, CombatantDefinitionVm, ResolutionView, SceneEntity, SceneVm, SessionMode } from "./contracts";'
          if text.count(old_import)!=1: raise SystemExit('unarmed import changed')
          text=text.replace(old_import,'import type { AbilityKey, ActionVm, ActivityEntry, AppRole, AppSnapshot, CharacterSheet, CombatantDefinitionVm, ResolutionView, SceneEntity, SceneVm, SessionMode } from "./contracts";',1)
          old='''const CONTROL={\n  "action.unarmed-strike.grapple":{conditionId:"grappled" as const,label:"붙잡힘",displayName:"맨손 타격 · 붙잡기"},\n  "action.unarmed-strike.shove-prone":{conditionId:"prone" as const,label:"넘어짐",displayName:"맨손 타격 · 넘어뜨리기"},\n};\ntype ControlActionId=keyof typeof CONTROL;\n'''
          if text.count(old)!=1: raise SystemExit('unarmed control ID table changed')
          text=text.replace(old,'',1)
          old='''function saveFact(adapter:MockAdapter,internal:AdapterState,target:SceneEntity) {\n  const sheet=target.id===internal.activeCharacter.id?internal.activeCharacter:projectedCharacterById(adapter,target.id)?.sheet;\n  const active=sheet??internal.activeCharacter;\n  const strength=resolveRuntimeSaveModifier(target,active,"str",internal.combatantDefinitions);\n  const dexterity=resolveRuntimeSaveModifier(target,active,"dex",internal.combatantDefinitions);\n  return strength.modifier>=dexterity.modifier?strength:dexterity;\n}\n\nMockAdapter.prototype.resolveAction=async function resolveUnarmedControl(actionId:string,targetIds:string[]) {\n  const control=CONTROL[actionId as ControlActionId];\n  if (!control) return previousResolveAction.call(this,actionId,targetIds);\n  const internal=this as unknown as AdapterState;\n  const snapshot=await internal.getSnapshot();\n  const action=actorAction(snapshot.scene,actionId);\n'''
          new='''function saveFact(adapter:MockAdapter,internal:AdapterState,target:SceneEntity,abilities:AbilityKey[]) {\n  const sheet=target.id===internal.activeCharacter.id?internal.activeCharacter:projectedCharacterById(adapter,target.id)?.sheet;\n  const active=sheet??internal.activeCharacter;\n  const candidates=abilities.map((ability)=>resolveRuntimeSaveModifier(target,active,ability,internal.combatantDefinitions));\n  if (!candidates.length) throw new Error("runtimeSaveCondition requires at least one save ability");\n  return candidates.reduce((best,candidate)=>candidate.modifier>best.modifier?candidate:best);\n}\n\nMockAdapter.prototype.resolveAction=async function resolveUnarmedControl(actionId:string,targetIds:string[]) {\n  const internal=this as unknown as AdapterState;\n  const snapshot=await internal.getSnapshot();\n  const action=actorAction(snapshot.scene,actionId);\n  const control=action?.runtimeSaveCondition;\n  if (!control) return previousResolveAction.call(this,actionId,targetIds);\n'''
          if text.count(old)!=1: raise SystemExit('unarmed resolve prelude changed')
          text=text.replace(old,new,1)
          if text.count('try { save=saveFact(this,internal,target); }')!=1: raise SystemExit('unarmed save call changed')
          text=text.replace('try { save=saveFact(this,internal,target); }','try { save=saveFact(this,internal,target,control.saveAbilities); }',1)
          old='''        id:`effect.${resolutionId}`,sourceId:actionId,sourceActorId:action.actorId,targetId,kind:"condition",conditionId:control.conditionId,\n        duration:{kind:"special",key:control.conditionId==="grappled"?`escape:${action.actorId}`:"stand-up"},\n        termination:control.conditionId==="grappled"?{sourceBecomesIncapacitated:true,sourceDies:true}:undefined,\n        metadata:{displayName:control.displayName},\n'''
          new='''        id:`effect.${resolutionId}`,sourceId:actionId,sourceActorId:action.actorId,targetId,kind:"condition",conditionId:control.conditionId,\n        duration:control.duration,\n        termination:control.termination,\n        metadata:{displayName:control.displayName},\n'''
          if text.count(old)!=1: raise SystemExit('unarmed effect projection changed')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('tests/ui/unarmedStrikeRuntime.test.ts'); text=p.read_text(encoding='utf-8')
          marker='test("connected unarmed condition converges once on every client", async () => {\n'
          test='''test("Unarmed control runtime follows payload semantics after action ID rename", async () => {\n  const adapter=new MockAdapter();\n  await ready(adapter);\n  const originalGetSnapshot=adapter.getSnapshot.bind(adapter);\n  adapter.getSnapshot=async()=>{\n    const snapshot=await originalGetSnapshot();\n    const action=snapshot.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id==="action.unarmed-strike.grapple");\n    if(action) action.id="action.external.renamed-control-probe";\n    return snapshot;\n  };\n  await adapter.setQueuedD20(1);\n  await adapter.resolveAction("action.external.renamed-control-probe",["combatant.goblin-a"]);\n  const snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.actionId,"action.external.renamed-control-probe");\n  assert.ok(snapshot.scene.entities.find((entry)=>entry.id==="combatant.goblin-a")?.status.some((status)=>status.includes("붙잡힘")));\n});\n\n'''
          if text.count(marker)!=1: raise SystemExit('unarmed test insertion marker changed')
          p.write_text(text.replace(marker,test+marker,1),encoding='utf-8')
          PY
      - name: Verify code-only Family J migration
        run: |
          npm run generate:content
          npx tsx --test tests/ui/unarmedStrikeRuntime.test.ts
          npm run test:ui-rule-boundary
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "ChatGPT C9 Family J"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/c9-family-j-code-7130.yml
          git add src/app/contracts.ts src/app/productionPlayRuntimeAdapter.ts src/app/unarmedControlRuntimeAdapter.ts tests/ui/unarmedStrikeRuntime.test.ts .github/workflows/c9-family-j-code-7130.yml
          git commit -m "refactor(c9): remove unarmed control id dispatch"
          git push origin HEAD:agent/c9-j-unarmed-code-7130
