name: C9 Family D Ledger Reconcile

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-d-ledger-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Family D ledger row
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(readFileSync(path,'utf8'));
          const row=ledger.rows.find((entry)=>entry.family==='D');
          if(!row) throw new Error('Family D row not found');
          row.currentState='Generic resource/economy payments, source-owned resource pool materialization, rest and turn-start recovery, recovery lockouts, temporary capacity, and durable Character write-back/Undo all execute through shared Resolver state changes without content-name or content-ID dispatch.';
          row.disposition='IMPLEMENTED';
          row.implementationEvidence=[
            'commonPlayOperationRuntime.ts shared PaymentContract and resource.change lowering, including source-owned createIfMissing pools',
            'resources.ts generic spend/gain/recovery/recovery-lockout and temporary maximum semantics',
            'resolutionResourceOps.ts generic gain-resource creation/capacity/recharge/lockout ResolutionEvent emission',
            'resolutionRestOps.ts durable resource current/lockout/capacity diffs for Short/Long Rest normalization',
            'resolutionTurnOps.ts authoritative turn-start resource recovery state-change emission',
            'runtimeStateChange.ts typed ResourceStateChange creation, recoveryLockouts, and capacity payloads',
            'resolutionCharacterDurableProjection.ts and characterLibraryPersistence.ts generic forward/inverse write-back plus source/runtime maximum separation'
          ];
          row.productionEvidence=[
            'installedCommonPlayProductionRuntime.test.ts unknown installed resource/economy executes through production resolveAction with atomic rejection and Undo',
            'phase09CommonPlayResourcePersistence.test.ts unknown installed resource payment, source-owned pool materialization/spend/removal, restart persistence, and Undo',
            'resourceRecoveryLockout.test.ts lockout lifecycle, turn-start recovery event, temporary maximum event, and Long Rest normalization',
            'e4dceb71231cbfa870c61210b9a702b968b6abff persists temporary resource capacity without mutating the source maximum',
            'M1 Common Play Resource Economy run 33308082562: 31/31 tests, legacy execution boundary check, and tsc --noEmit passed at a18039511029d3e73638f1fe9af6a8de32ef95f6'
          ];
          row.identityInvarianceEvidence=[
            'commonPlayResourceEconomyRuntime.test.ts external definition ID rename preserves resource/economy semantics',
            'phase09CommonPlayResourcePersistence.test.ts arbitrary previously-unknown module/content/mechanic/resource identities materialize and persist without named registration',
            'installedCommonPlayProductionRuntime.test.ts portable resource/economy production path resolves installed content structurally rather than by Action Surge/content identity'
          ];
          row.connectedEvidenceIfRelevant=[
            'fighterActionSurgeRuntimeAdapter.test.ts connected Common Play converges the resource spend and exact extra Action grant',
            'installedCommonPlayLoweredFamiliesProduction.test.ts Host/Client resource/economy convergence and Undo through shared ResolutionEvents',
            'turn-start recovery uses the same durable ResourceStateChange consumed by connected projection and event-native Undo'
          ];
          row.persistenceEvidenceIfRelevant=[
            'phase09CommonPlayResourcePersistence.test.ts unknown installed payment survives Character persistence, restart, and Undo',
            'phase09CommonPlayResourcePersistence.test.ts source-owned pool creation/spend survives restart and materialization Undo removes the durable pool',
            'phase09CommonPlayResourcePersistence.test.ts temporary capacity persists as runtime overlay, preserves source maximum, reconstructs on restart, and reverses through inverse projection',
            'characterLibraryPersistence.ts persists resource current/capacity/Long-Rest marker/recovery lockouts and item charge current state'
          ];
          row.remainingNamedSeams=[];
          writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
      - name: Verify ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit reconciliation
        run: |
          if git diff --quiet -- docs/rules/v1-mechanism-coverage-ledger.json; then
            echo "Ledger already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): accept Family D resource coverage"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
