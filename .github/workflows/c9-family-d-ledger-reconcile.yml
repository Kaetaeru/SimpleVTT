name: C9 Family D Ledger Reconcile

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-d-ledger-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - name: Reconcile verified Family D coverage
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((candidate)=>candidate.family==='D');
          if(!row) throw new Error('Family D row missing');
          row.currentState='Generic resource/economy payments, durable source-owned pools, rest and turn-start recovery, recovery lockouts, item charges, temporary capacity, and authoritative Character write-back/Undo now execute through shared Resolver state changes without content-name dispatch. Resource maxima remain source-owned while temporary capacity is represented as an explicit durable runtime overlay and normalized on Long Rest.';
          row.disposition='IMPLEMENTED';
          row.implementationEvidence=[
            'commonPlayOperationRuntime.ts shared generic resource/economy payment lowering plus resource.change createIfMissing',
            'resources.ts generic spend/gain/recovery, temporary maximum, and recovery-lockout semantics',
            'resolutionResourceOps.ts resource creation and capacity ResourceStateChange emission',
            'resolutionRestOps.ts and resolutionTurnOps.ts authoritative rest/turn-start resource state changes',
            'runtimeStateChange.ts durable ResourceStateChange creation, lockout, and capacity payloads',
            'resolutionCharacterDurableProjection.ts generic Character resource/item-charge forward and inverse write-back'
          ];
          row.productionEvidence=[
            'installedCommonPlayProductionRuntime.test.ts unknown installed resource/economy production execution and Undo',
            'phase09CommonPlayResourcePersistence.test.ts unknown installed source-owned pool materialization/spend and materialization Undo',
            'resourceRecoveryLockout.test.ts rest, turn-start recovery, lockout, and temporary-capacity normalization events',
            'fighterActionSurgeRuntimeAdapter.test.ts built-in Common Play multi-resource payment, exact grant, connected convergence, and Undo',
            'M1 Common Play Resource Economy run 33308082562 at a18039511029d3e73638f1fe9af6a8de32ef95f6 passed focused resource/economy tests, legacy boundary check, and tsc --noEmit'
          ];
          row.identityInvarianceEvidence=[
            'commonPlayResourceEconomyRuntime.test.ts external definition ID rename invariance',
            'installedCommonPlayProductionRuntime.test.ts unknown external module/content/mechanic execution without Action Surge identities',
            'phase09CommonPlayResourcePersistence.test.ts arbitrary source-owned module/content/mechanic/resource identifiers',
            'fighterActionSurgeRuntimeAdapter.test.ts action/content/definition/display-name rename invariance'
          ];
          row.connectedEvidenceIfRelevant=[
            'installedCommonPlayProductionRuntime.test.ts Host/Client resource/economy convergence through installed Common Play',
            'fighterActionSurgeRuntimeAdapter.test.ts connected resource and extra-Action convergence through Common Play'
          ];
          row.persistenceEvidenceIfRelevant=[
            'phase09CommonPlayResourcePersistence.test.ts existing resource spend persists across restart and inverse Undo',
            'phase09CommonPlayResourcePersistence.test.ts source-owned pool creation/spend persists across restart and creation Undo removes the pool',
            'phase09CommonPlayResourcePersistence.test.ts temporary capacity overlay persists separately from source maximum and reverses through inverse projection',
            'resolutionCharacterDurableProjection.ts item-charge and generic resource state changes share Character durable write-back'
          ];
          row.remainingNamedSeams=[];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
      - name: Verify ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit reconciled ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-d-ledger-reconcile.yml
          git commit -m "docs(c9): close Family D resource coverage"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
