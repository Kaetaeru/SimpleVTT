name: C9 Family I Flight Fixture 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-flight-fixture-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Seed explicit flight capability in movement matrix fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/c9FamilyIMovementProduction.test.ts')
          text=path.read_text()
          old='''async function runMovementMatrix(prefix:string) {\n  const {adapter,action}=await install(prefix);\n\n  for(const movementType of MOVEMENT_TYPES) {'''
          new='''async function runMovementMatrix(prefix:string) {\n  const {adapter,action}=await install(prefix);\n  seedMovementProperty(adapter,"movement.fly",30);\n\n  for(const movementType of MOVEMENT_TYPES) {'''
          if new not in text:
              if old not in text:
                  raise SystemExit('movement matrix anchor not found')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Verify Family I production movement
        run: |
          node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified fixture correction
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-i-flight-fixture-71304.yml
          git add tests/ui/c9FamilyIMovementProduction.test.ts .github/workflows/c9-family-i-flight-fixture-71304.yml
          git commit -m "test(c9): seed flight capability in movement matrix"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
