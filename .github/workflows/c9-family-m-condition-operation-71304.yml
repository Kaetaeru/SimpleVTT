name: C9 Family M Condition Operation 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-m-condition-operation-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-m-condition-operation-71304
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync latest branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation

      - name: Apply portable condition operation bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/domain/commonPlayOperationRuntime.ts')
          text = runtime.read_text()

          import_anchor = 'import type { RulesRuntimeState } from "./combatState";\n'
          condition_import = 'import { SRD_521_CONDITIONS, type ConditionId } from "./conditions";\n'
          if condition_import not in text:
              if import_anchor not in text:
                  raise SystemExit('condition import anchor missing')
              text = text.replace(import_anchor, import_anchor + condition_import, 1)

          hp_anchor = 'type CommonPlayHpTarget="actor"|"self"|"target";\n'
          type_block = '''type CommonPlayConditionTarget="actor"|"self"|"target";\ntype CommonPlayConditionChange={\n  kind:"condition.apply"|"condition.remove";\n  condition:ConditionId;\n  target?:CommonPlayConditionTarget;\n};\n'''
          if type_block not in text:
              if hp_anchor not in text:
                  raise SystemExit('condition type anchor missing')
              text = text.replace(hp_anchor, hp_anchor + type_block, 1)

          union_anchor = '  |CommonPlayHealingApply\n  |CommonPlayMovementDefinition\n'
          union_replacement = '  |CommonPlayHealingApply\n  |CommonPlayConditionChange\n  |CommonPlayMovementDefinition\n'
          if '|CommonPlayConditionChange' not in text:
              if union_anchor not in text:
                  raise SystemExit('condition union anchor missing')
              text = text.replace(union_anchor, union_replacement, 1)

          keys_anchor = 'const HEALING_APPLY_KEYS=new Set(["kind","amount","target"]);\n'
          keys_line = 'const CONDITION_CHANGE_KEYS=new Set(["kind","condition","target"]);\n'
          if keys_line not in text:
              if keys_anchor not in text:
                  raise SystemExit('condition keys anchor missing')
              text = text.replace(keys_anchor, keys_anchor + keys_line, 1)

          helper_anchor = '''function numericExpression(value:unknown,label:string):CommonPlayExpression {'''
          helper = '''function conditionTarget(value:unknown,label:string):CommonPlayConditionTarget|undefined {\n  if(value===undefined) return undefined;\n  if(value!=="actor"&&value!=="self"&&value!=="target") {\n    throw new DomainEvaluationError(`${label} must be actor, self, or target for portable Common Play condition operations`);\n  }\n  return value;\n}\n\n'''
          if helper not in text:
              if helper_anchor not in text:
                  raise SystemExit('condition target helper anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          parse_anchor = '''  if(operation.kind==="economy.modify") {'''
          parse_block = '''  if(operation.kind==="condition.apply"||operation.kind==="condition.remove") {\n    supportedKeys(operation,CONDITION_CHANGE_KEYS,label);\n    const condition=nonEmptyString(operation.condition,`${label}.condition`) as ConditionId;\n    if(!(condition in SRD_521_CONDITIONS)) throw new DomainEvaluationError(`${label}.condition is not a registered SRD condition: ${condition}`);\n    const target=conditionTarget(operation.target,`${label}.target`);\n    return {kind:operation.kind,condition,...(target===undefined?{}:{target})};\n  }\n'''
          if 'condition is not a registered SRD condition' not in text:
              if parse_anchor not in text:
                  raise SystemExit('condition parser anchor missing')
              text = text.replace(parse_anchor, parse_block + parse_anchor, 1)

          target_anchor = '''function targetingSelectorCandidate(target:TargetingFactInput) {'''
          target_helper = '''function conditionOperationTarget(target:CommonPlayConditionTarget|undefined,input:CommonPlayOperationExecutionInput) {\n  if(target===undefined||target==="actor"||target==="self") return input.actorId;\n  if(!input.targetId) throw new DomainEvaluationError("Common Play target condition operation requires one pre-resolved target");\n  return input.targetId;\n}\n\n'''
          if target_helper not in text:
              if target_anchor not in text:
                  raise SystemExit('condition operation target anchor missing')
              text = text.replace(target_anchor, target_helper + target_anchor, 1)

          compile_anchor = '''    if(operation.kind==="damage.apply") {'''
          compile_block = '''    if(operation.kind==="condition.apply"||operation.kind==="condition.remove") {\n      const targetId=conditionOperationTarget(operation.target,input);\n      if(operation.kind==="condition.apply") {\n        operations.push({\n          id:operationId,\n          kind:"apply-effect",\n          effect:{\n            id:`${operationId}:condition:${operation.condition}`,\n            sourceId:`common-play:${supported.id}:${entryPoint.id}:operation:${index}`,\n            sourceActorId:input.actorId,\n            targetId,\n            kind:"condition",\n            conditionId:operation.condition,\n            tags:["common-play:condition",`condition:${operation.condition}`],\n            duration:{kind:"permanent"},\n          },\n        });\n      } else {\n        const effect=[...state.effects].reverse().find((entry)=>entry.targetId===targetId&&entry.conditionId===operation.condition);\n        if(!effect) throw new DomainEvaluationError(`Common Play condition.remove found no ${operation.condition} Effect on ${targetId}`);\n        operations.push({id:operationId,kind:"remove-effect",effectId:effect.id});\n      }\n      continue;\n    }\n\n'''
          if 'Common Play condition.remove found no' not in text:
              if compile_anchor not in text:
                  raise SystemExit('condition compile anchor missing')
              text = text.replace(compile_anchor, compile_block + compile_anchor, 1)

          runtime.write_text(text)

          test = Path('tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\n\nimport {\n  compileCommonPlayEntryPointOperations,\n  parseManualCommonPlayOperationDefinition,\n  resolveCommonPlayEntryPointOperations,\n} from "../../src/domain/commonPlayOperationRuntime";\nimport { runtimeState, TEST_PROFILE } from "./rulesTestState";\n\nfunction definition(id:string,kind:"condition.apply"|"condition.remove",condition:string) {\n  return parseManualCommonPlayOperationDefinition({\n    schemaVersion:"0.2-draft",\n    id,\n    entryPoints:[{id:"activate",invocation:"manual",operations:[{kind,condition,target:"target"}]}],\n  });\n}\n\ntest("portable condition.apply lowers to the canonical Effect operation and commits through Resolver",()=>{\n  const state=runtimeState();\n  const portable=definition("external.unknown.condition-source","condition.apply","poisoned");\n  const input={resolutionId:"condition-apply",actorId:"hero",entryPointId:"activate",targetId:"goblin"};\n  const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,state,portable,input);\n  assert.equal(pending.operations.length,1);\n  const operation=pending.operations[0];\n  assert.equal(operation?.kind,"apply-effect");\n  if(operation?.kind!=="apply-effect") return;\n  assert.equal(operation.effect.conditionId,"poisoned");\n  assert.equal(operation.effect.targetId,"goblin");\n  assert.equal(operation.effect.kind,"condition");\n\n  const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,portable,input);\n  assert.equal(committed.status,"committed",committed.status==="rejected"?committed.error:undefined);\n  if(committed.status!=="committed") return;\n  const effect=committed.state.effects.find((entry)=>entry.targetId==="goblin"&&entry.conditionId==="poisoned");\n  assert.ok(effect);\n  const change=committed.events.flatMap((event)=>event.stateChanges).find((entry)=>entry.kind==="effect"&&entry.effectId===effect.id);\n  assert.ok(change&&change.kind==="effect"&&change.change==="added");\n});\n\ntest("portable condition.remove removes one matching condition instance without source identity dispatch",()=>{\n  const state=runtimeState();\n  const apply=resolveCommonPlayEntryPointOperations(\n    TEST_PROFILE,state,definition("external.first.source","condition.apply","exhaustion"),\n    {resolutionId:"condition-source-a",actorId:"hero",entryPointId:"activate",targetId:"goblin"},\n  );\n  assert.equal(apply.status,"committed",apply.status==="rejected"?apply.error:undefined);\n  if(apply.status!=="committed") return;\n  const second=resolveCommonPlayEntryPointOperations(\n    TEST_PROFILE,apply.state,definition("external.renamed.source","condition.apply","exhaustion"),\n    {resolutionId:"condition-source-b",actorId:"hero",entryPointId:"activate",targetId:"goblin"},\n  );\n  assert.equal(second.status,"committed",second.status==="rejected"?second.error:undefined);\n  if(second.status!=="committed") return;\n  assert.equal(second.state.effects.filter((entry)=>entry.targetId==="goblin"&&entry.conditionId==="exhaustion").length,2);\n\n  const removed=resolveCommonPlayEntryPointOperations(\n    TEST_PROFILE,second.state,definition("external.unrelated.cure","condition.remove","exhaustion"),\n    {resolutionId:"condition-remove",actorId:"hero",entryPointId:"activate",targetId:"goblin"},\n  );\n  assert.equal(removed.status,"committed",removed.status==="rejected"?removed.error:undefined);\n  if(removed.status!=="committed") return;\n  assert.equal(removed.state.effects.filter((entry)=>entry.targetId==="goblin"&&entry.conditionId==="exhaustion").length,1);\n  assert.ok(removed.events.flatMap((event)=>event.stateChanges).some((entry)=>entry.kind==="effect"&&entry.change==="removed"));\n});\n\ntest("portable condition operations fail closed for unregistered condition vocabulary and missing removal state",()=>{\n  assert.throws(\n    ()=>definition("external.bad.condition","condition.apply","not-a-condition"),\n    /not a registered SRD condition/,\n  );\n  const state=runtimeState();\n  const missing=resolveCommonPlayEntryPointOperations(\n    TEST_PROFILE,state,definition("external.missing.cure","condition.remove","poisoned"),\n    {resolutionId:"condition-remove-missing",actorId:"hero",entryPointId:"activate",targetId:"goblin"},\n  );\n  assert.equal(missing.status,"rejected");\n  assert.match(missing.status==="rejected"?missing.error:"",/found no poisoned Effect/);\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify Family M portable conditions
        run: npx tsx --test tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts tests/domain/c9FamilyMConditions.test.ts

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Verify Gate N coverage checker
        run: npm run test:v1-coverage

      - name: Rebase and reverify against current branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          npx tsx --test tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts tests/domain/c9FamilyMConditions.test.ts
          npx tsc --noEmit
          npm run test:v1-coverage

      - name: Commit verified bridge and retire staging workflow
        run: |
          rm .github/workflows/c9-family-m-condition-operation-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts .github/workflows/c9-family-m-condition-operation-71304.yml
          git commit -m "feat(c9): execute portable condition operations"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
