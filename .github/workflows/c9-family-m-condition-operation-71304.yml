name: C9 Family M Condition Operation 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-m-condition-operation-71304.yml]

permissions:
  contents: write

concurrency:
  group: c9-family-m-condition-operation-71304
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync latest branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
      - name: Apply portable condition operation bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          s=runtime.read_text()

          if 'SRD_521_CONDITIONS' not in s:
              lines=s.splitlines(keepends=True)
              import_indexes=[i for i,line in enumerate(lines) if line.startswith('import ')]
              if not import_indexes:
                  raise SystemExit('no import block found')
              lines.insert(max(import_indexes)+1,'import { SRD_521_CONDITIONS, type ConditionId } from "./conditions";\n')
              s=''.join(lines)

          if 'type CommonPlayConditionChange=' not in s:
              anchor='type CommonPlayHpTarget="actor"|"self"|"target";\n'
              addition='''type CommonPlayConditionTarget="actor"|"self"|"target";\ntype CommonPlayConditionChange={\n  kind:"condition.apply"|"condition.remove";\n  condition:ConditionId;\n  target?:CommonPlayConditionTarget;\n};\n'''
              if anchor not in s: raise SystemExit('condition type anchor missing')
              s=s.replace(anchor,anchor+addition,1)

          if '|CommonPlayConditionChange' not in s:
              anchor='  |CommonPlayRollModify;'
              if anchor not in s: raise SystemExit('operation union terminator missing')
              s=s.replace(anchor,'  |CommonPlayConditionChange\n'+anchor,1)

          if 'const CONDITION_CHANGE_KEYS=' not in s:
              anchor='const HEALING_APPLY_KEYS=new Set(["kind","amount","target"]);\n'
              if anchor not in s: raise SystemExit('condition key anchor missing')
              s=s.replace(anchor,anchor+'const CONDITION_CHANGE_KEYS=new Set(["kind","condition","target"]);\n',1)

          if 'function conditionTarget(' not in s:
              anchor='function numericExpression(value:unknown,label:string):CommonPlayExpression {'
              addition='''function conditionTarget(value:unknown,label:string):CommonPlayConditionTarget|undefined {\n  if(value===undefined) return undefined;\n  if(value!=="actor"&&value!=="self"&&value!=="target") throw new DomainEvaluationError(`${label} must be actor, self, or target for portable Common Play condition operations`);\n  return value;\n}\n\n'''
              if anchor not in s: raise SystemExit('condition target parser anchor missing')
              s=s.replace(anchor,addition+anchor,1)

          if 'condition is not a registered SRD condition' not in s:
              anchor='  if(operation.kind==="economy.modify") {'
              addition='''  if(operation.kind==="condition.apply"||operation.kind==="condition.remove") {\n    supportedKeys(operation,CONDITION_CHANGE_KEYS,label);\n    const condition=nonEmptyString(operation.condition,`${label}.condition`) as ConditionId;\n    if(!(condition in SRD_521_CONDITIONS)) throw new DomainEvaluationError(`${label}.condition is not a registered SRD condition: ${condition}`);\n    const target=conditionTarget(operation.target,`${label}.target`);\n    return {kind:operation.kind,condition,...(target===undefined?{}:{target})};\n  }\n'''
              if anchor not in s: raise SystemExit('condition parser anchor missing')
              s=s.replace(anchor,addition+anchor,1)

          if 'function conditionOperationTarget(' not in s:
              anchor='function targetingSelectorCandidate(target:TargetingFactInput) {'
              addition='''function conditionOperationTarget(target:CommonPlayConditionTarget|undefined,input:CommonPlayOperationExecutionInput) {\n  if(target===undefined||target==="actor"||target==="self") return input.actorId;\n  if(!input.targetId) throw new DomainEvaluationError("Common Play target condition operation requires one pre-resolved target");\n  return input.targetId;\n}\n\n'''
              if anchor not in s: raise SystemExit('condition target compile anchor missing')
              s=s.replace(anchor,addition+anchor,1)

          if 'Common Play condition.remove found no' not in s:
              anchor='    if(operation.kind==="damage.apply") {'
              addition='''    if(operation.kind==="condition.apply"||operation.kind==="condition.remove") {\n      const targetId=conditionOperationTarget(operation.target,input);\n      if(operation.kind==="condition.apply") {\n        operations.push({\n          id:operationId,\n          kind:"apply-effect",\n          effect:{\n            id:`${operationId}:condition:${operation.condition}`,\n            sourceId:`common-play:${supported.id}:${entryPoint.id}:operation:${index}`,\n            sourceActorId:input.actorId,\n            targetId,\n            kind:"condition",\n            conditionId:operation.condition,\n            tags:["common-play:condition",`condition:${operation.condition}`],\n            duration:{kind:"permanent"},\n          },\n        });\n      } else {\n        const effect=[...state.effects].reverse().find((entry)=>entry.targetId===targetId&&entry.conditionId===operation.condition);\n        if(!effect) throw new DomainEvaluationError(`Common Play condition.remove found no ${operation.condition} Effect on ${targetId}`);\n        operations.push({id:operationId,kind:"remove-effect",effectId:effect.id});\n      }\n      continue;\n    }\n\n'''
              if anchor not in s: raise SystemExit('condition compile anchor missing')
              s=s.replace(anchor,addition+anchor,1)

          if 'unexpected Common Play operation before economy.modify' not in s:
              anchor='    const amount=literalInteger(operation.amount,"economy.modify amount");'
              addition='''    if(operation.kind!=="economy.modify") throw new DomainEvaluationError(`unexpected Common Play operation before economy.modify`);\n'''
              if anchor not in s: raise SystemExit('economy narrowing anchor missing')
              s=s.replace(anchor,addition+anchor,1)

          runtime.write_text(s)

          Path('tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport {compileCommonPlayEntryPointOperations,parseManualCommonPlayOperationDefinition,resolveCommonPlayEntryPointOperations} from "../../src/domain/commonPlayOperationRuntime";\nimport {runtimeState,TEST_PROFILE} from "./rulesTestState";\nfunction definition(id:string,kind:"condition.apply"|"condition.remove",condition:string){return parseManualCommonPlayOperationDefinition({schemaVersion:"0.2-draft",id,entryPoints:[{id:"activate",invocation:"manual",operations:[{kind,condition,target:"target"}]}]});}\ntest("portable condition.apply lowers to canonical Effect and commits",()=>{const state=runtimeState();const d=definition("external.unknown.condition-source","condition.apply","poisoned");const input={resolutionId:"condition-apply",actorId:"hero",entryPointId:"activate",targetId:"goblin"};const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,state,d,input);const op=pending.operations[0];assert.equal(op?.kind,"apply-effect");if(op?.kind!=="apply-effect")return;assert.equal(op.effect.conditionId,"poisoned");assert.equal(op.effect.targetId,"goblin");const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,d,input);assert.equal(committed.status,"committed",committed.status==="rejected"?committed.error:undefined);if(committed.status!=="committed")return;const effect=committed.state.effects.find(e=>e.targetId==="goblin"&&e.conditionId==="poisoned");assert.ok(effect);assert.ok(committed.events.flatMap(e=>e.stateChanges).some(c=>c.kind==="effect"&&c.effectId===effect.id&&c.operation==="added"));});\ntest("portable condition.remove removes one matching instance independent of source identity",()=>{const first=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition("external.first.source","condition.apply","exhaustion"),{resolutionId:"condition-a",actorId:"hero",entryPointId:"activate",targetId:"goblin"});assert.equal(first.status,"committed",first.status==="rejected"?first.error:undefined);if(first.status!=="committed")return;const second=resolveCommonPlayEntryPointOperations(TEST_PROFILE,first.state,definition("external.renamed.source","condition.apply","exhaustion"),{resolutionId:"condition-b",actorId:"hero",entryPointId:"activate",targetId:"goblin"});assert.equal(second.status,"committed",second.status==="rejected"?second.error:undefined);if(second.status!=="committed")return;assert.equal(second.state.effects.filter(e=>e.targetId==="goblin"&&e.conditionId==="exhaustion").length,2);const removed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,second.state,definition("external.unrelated.cure","condition.remove","exhaustion"),{resolutionId:"condition-remove",actorId:"hero",entryPointId:"activate",targetId:"goblin"});assert.equal(removed.status,"committed",removed.status==="rejected"?removed.error:undefined);if(removed.status!=="committed")return;assert.equal(removed.state.effects.filter(e=>e.targetId==="goblin"&&e.conditionId==="exhaustion").length,1);assert.ok(removed.events.flatMap(e=>e.stateChanges).some(c=>c.kind==="effect"&&c.operation==="removed"));});\ntest("portable condition operations fail closed",()=>{assert.throws(()=>definition("external.bad","condition.apply","not-a-condition"),/not a registered SRD condition/);const missing=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition("external.cure","condition.remove","poisoned"),{resolutionId:"condition-missing",actorId:"hero",entryPointId:"activate",targetId:"goblin"});assert.equal(missing.status,"rejected");assert.match(missing.status==="rejected"?missing.error:"",/found no poisoned Effect/);});\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Generate repository content
        run: npm run generate:content
      - name: Verify Family M portable conditions
        run: npx tsx --test tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts tests/domain/c9FamilyMConditions.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify Gate N coverage checker
        run: npm run test:v1-coverage
      - name: Rebase and reverify
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          npm run generate:content
          npx tsx --test tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts tests/domain/c9FamilyMConditions.test.ts
          npx tsc --noEmit
          npm run test:v1-coverage
      - name: Commit verified bridge and retire staging workflow
        run: |
          rm .github/workflows/c9-family-m-condition-operation-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts .github/workflows/c9-family-m-condition-operation-71304.yml
          git commit -m "feat(c9): execute portable condition operations"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
