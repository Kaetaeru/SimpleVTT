name: C9 Family E Spatial Fact Verifier Repair 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-spatial-fact-repair-7130.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile latest branch
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git fetch origin "$branch"
          git rebase "origin/$branch"
      - name: Repair second selector candidate call site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-e-spatial-fact-7130.yml')
          text=path.read_text(encoding='utf-8')
          anchor="""          path.write_text(text,encoding='utf-8')
          PY

          cat > tests/ui/c9FamilyESpatialFactProduction.test.ts <<'EOF'
"""
          insertion="""          old_runtime='targetingCandidates:entryPoint.targeting?internal.scene.entities.filter((target)=>state.combatants[target.id]).map((target)=>commonPlaySelectorCandidate(actorEntity,target)):undefined,'
          new_runtime='targetingCandidates:entryPoint.targeting?internal.scene.entities.filter((target)=>state.combatants[target.id]).map((target)=>commonPlaySelectorCandidate(internal.scene,actorEntity,target)):undefined,'
          if new_runtime not in text:
              if old_runtime not in text:
                  raise SystemExit('Family E operation selector call-site anchor not found or changed')
              text=text.replace(old_runtime,new_runtime,1)
          path.write_text(text,encoding='utf-8')
          PY

          cat > tests/ui/c9FamilyESpatialFactProduction.test.ts <<'EOF'
"""
          if insertion in text:
              raise SystemExit('Family E verifier repair already present')
          if anchor not in text:
              raise SystemExit('Family E verifier insertion anchor not found')
          text=text.replace(anchor,insertion,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Publish repair and retire repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-e-spatial-fact-7130.yml
          git rm -f .github/workflows/c9-family-e-spatial-fact-repair-7130.yml
          git diff --cached --check
          git commit -m "ci(c9): fix Family E spatial verifier call sites"
          branch=agent/c9-gate-n-coverage-reconciliation
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin HEAD:"$branch"
