name: Apply v1 Product Shell

on:
  push:
    branches:
      - "agent/108-production-play-session-ux"
    paths:
      - "scripts/apply-v1-product-shell.mjs"
      - ".github/workflows/apply-v1-product-shell.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/108-production-play-session-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v1 product shell patch
        run: |
          node scripts/apply-v1-product-shell.mjs
          sed -i 's/fightingStyleSources:{}/fightingStyleFeatSources:{}/' tests/ui/progressionChoiceScheduleRegression.test.ts
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git config user.name "Kaetaeru"
          git config user.email "131461278+Kaetaeru@users.noreply.github.com"
          git add src/App.tsx src/app/contracts.ts src/main.tsx tests/ui/progressionChoiceScheduleRegression.test.ts
          git commit -m "feat(v1): integrate explicit product routes"
          git fetch origin agent/108-production-play-session-ux
          git rebase origin/agent/108-production-play-session-ux
          git push origin HEAD:agent/108-production-play-session-ux
