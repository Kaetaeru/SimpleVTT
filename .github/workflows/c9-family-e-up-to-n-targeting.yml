name: C9 Family E Up To N Targeting

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-up-to-n-targeting.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch bounded multi-target selector
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          runtime = "src/domain/commonPlayOperationRuntime.ts"
          replace_once(runtime, '''export interface CommonPlayTargetingSelector {
            from:"targets";
            min:1;
            max:1;
          }''', '''export interface CommonPlayTargetingSelector {
            from:"targets";
            min:1;
            max:number;
          }''')
          replace_once(runtime, '''  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);
            if(selector.min!==1||selector.max!==1) throw new DomainEvaluationError(`${label}.min and .max must both be 1 for portable Common Play targeting`);
            return {from:"targets",min:1,max:1};''', '''  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);
            if(selector.min!==1) throw new DomainEvaluationError(`${label}.min must be 1 for portable Common Play targeting`);
            if(typeof selector.max!=="number"||!Number.isInteger(selector.max)||selector.max<1) {
              throw new DomainEvaluationError(`${label}.max must be a positive integer for portable Common Play targeting`);
            }
            return {from:"targets",min:1,max:selector.max};''')
          replace_once(runtime, '''    if(input.targetingTargets.length===1&&input.targetId!==undefined&&input.targetId!==input.targetingTargets[0].id) {
              throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");
            }''', '''    if(input.targetingTargets.length>0&&input.targetId!==undefined&&input.targetId!==input.targetingTargets[0].id) {
              throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");
            }''')
          replace_once(runtime, '''      rule:{kind:"creature",minTargets:1,maxTargets:1,directTarget:false},''', '''      rule:{kind:"creature",minTargets:entryPoint.targeting.min,maxTargets:entryPoint.targeting.max,directTarget:false},''')

          adapter = "src/app/installedCommonPlayRuntimeAdapter.ts"
          replace_once(adapter, '''  const multi=action.lowered.kind==="save-damage";''', '''  const multi=action.lowered.kind==="save-damage"||(targeting?.max??1)>1;''')

          test = "tests/domain/commonPlayTargetingRuntime.test.ts"
          replace_once(test, '''    [{from:"targets",min:0,max:1},/min and .max must both be 1/],
            [{from:"targets",min:1,max:2},/min and .max must both be 1/],''', '''    [{from:"targets",min:0,max:1},/min must be 1/],
            [{from:"targets",min:2,max:2},/min must be 1/],
            [{from:"targets",min:1,max:0},/max must be a positive integer/],
            [{from:"targets",min:1,max:1.5},/max must be a positive integer/],''')
          marker = '''test("invalid targeting is atomic and cannot reach downstream HP mutation",()=>{'''
          addition = '''test("bounded Common Play selector supports one-or-more targets up to an authored maximum",()=>{
            const authored=structuredClone(AUTHORED);
            authored.entryPoints[0].targeting={from:"targets",min:1,max:2};
            authored.entryPoints[0].operations=[];
            const definition=parseManualCommonPlayOperationDefinition(authored);
            assert.deepEqual(definition.entryPoints[0].targeting,{from:"targets",min:1,max:2});
            const input={
              resolutionId:"external-multi-targeting",
              actorId:"hero",
              entryPointId:"mend-other",
              targetId:"goblin",
              targetingTargets:[target("goblin","enemy"),target("hero","self")],
            };
            const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition,input);
            const targeting=pending.operations[0];
            assert.equal(targeting.kind,"targeting");
            if(targeting.kind!=="targeting") return;
            assert.equal(targeting.rule.minTargets,1);
            assert.equal(targeting.rule.maxTargets,2);
            const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition,input);
            assert.equal(committed.status,"committed");
            if(committed.status!=="committed") return;
            assert.deepEqual((committed.results["external-multi-targeting:targeting"] as {targets:Array<{targetId:string}>}).targets.map((entry)=>entry.targetId),["goblin","hero"]);
          });

          '''
          replace_once(test, marker, addition + marker)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify targeting slice and established Common Play regressions
        run: >-
          npx tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/domain/commonPlayHpRuntime.test.ts
          tests/domain/commonPlayD20Runtime.test.ts
          tests/domain/commonPlayResourceEconomyRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
          tests/ui/fighterActionSurgeRuntimeAdapter.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified change and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-up-to-n-targeting.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlayTargetingRuntime.test.ts
          git commit -m "feat(c9): support up-to-n common play targeting"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
