name: C9 Family J Primary Roll Presentation 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-primary-roll-presentation-71304.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch verify and publish
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
          python3 - <<'PY'
          from pathlib import Path

          source=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=source.read_text(encoding='utf-8')
          old='''    rollKind:hp?.rollKind??(roll?(roll.family==="attack-roll"?"attack":roll.family==="saving-throw"?"save":"check"):undefined),
    authoritativeDice:hp?.authoritativeDice??(roll?.rollState==="normal"?[roll.natural]:roll?.dice.faces),
    rollTotal:hp?.rollTotal??roll?.total,'''
          new='''    rollKind:roll?(roll.family==="attack-roll"?"attack":roll.family==="saving-throw"?"save":"check"):hp?.rollKind,
    authoritativeDice:roll?(roll.rollState==="normal"?[roll.natural]:roll.dice.faces):hp?.authoritativeDice,
    rollTotal:roll?.total??hp?.rollTotal,'''
          if old in text:
              text=text.replace(old,new,1)
              source.write_text(text,encoding='utf-8')
          elif new not in text:
              raise SystemExit('Common Play presentation block changed unexpectedly')

          test=Path('tests/ui/c9FamilyJSpatialAttackProduction.test.ts')
          text=test.read_text(encoding='utf-8')
          assertion='  assert.equal(snapshot.resolution?.rollKind,"attack");\n'
          anchor='  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));\n'
          if assertion not in text:
              if text.count(anchor)!=1:
                  raise SystemExit('Family J spatial assertion anchor changed unexpectedly')
              text=text.replace(anchor,anchor+assertion,1)
              test.write_text(text,encoding='utf-8')
          PY
          npm ci
          npm run generate:content
          npx tsx --test tests/ui/c9FamilyJRangeCoverProduction.test.ts tests/ui/c9FamilyJSpatialAttackProduction.test.ts tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJAttackPersistence.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
          rm .github/workflows/c9-family-j-primary-roll-presentation-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyJSpatialAttackProduction.test.ts .github/workflows/c9-family-j-primary-roll-presentation-71304.yml
          git commit -m "fix(c9): preserve primary d20 presentation"
          for attempt in $(seq 1 8); do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation
            sleep 1
          done
          exit 1
