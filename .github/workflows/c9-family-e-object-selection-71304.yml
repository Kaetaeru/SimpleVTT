          import { MockAdapter } from "../../src/app/mockAdapter";
          import { commitAdapterTurnRuntimeState, snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";
          import type { CharacterSheet, SceneVm } from "../../src/app/contracts";
          import { createRuntimeArtifact } from "../../src/domain/runtimeArtifact";

          type Identity={moduleId:string;contentId:string;mechanicId:string;entryPointId:string;displayName:string};
          const ORIGINAL:Identity={moduleId:"homebrew.family-e-object",contentId:"option.family-e-object",mechanicId:"external.unknown.family-e-object",entryPointId:"select-object",displayName:"Select Object"};
          const RENAMED:Identity={moduleId:"homebrew.renamed-family-e-object",contentId:"option.renamed-family-e-object",mechanicId:"external.renamed.family-e-object",entryPointId:"renamed-select-object",displayName:"Renamed Select Object"};
          const OBJECT_ID="artifact.external.family-e-object";

          function payload(identity:Identity) {
            return JSON.stringify({
              schemaVersion:"0.1-draft",moduleId:identity.moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family E object selector probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{
                id:identity.contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:identity.displayName,locales:{en:{name:identity.displayName}}},
                mechanics:[{kind:"common-play",config:{
                  schemaVersion:"0.2-draft",id:identity.mechanicId,
                  entryPoints:[{
                    id:identity.entryPointId,invocation:"manual",
                    targeting:{
                      from:"artifacts",min:1,max:1,
                      where:{op:"eq",left:{ref:"artifact.kind"},right:{value:"object"}},
                    },
                    operations:[],
                  }],
                }}],
              }],
            });
          }

          async function exercise(identity:Identity) {
            const adapter=new MockAdapter();
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(payload(identity));
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};
            const state=snapshotAdapterTurnRuntimeState(adapter,internal.scene);
            assert.ok(state);
            const expected=state.revision;
            state.artifacts=[...(state.artifacts??[]),createRuntimeArtifact({
              id:OBJECT_ID,sourceId:"external.provider.object",sourceActorId:internal.activeCharacter.id,
              templateId:"portable-crate",artifactKind:"object",placementRef:"authority:object-slot-a",
              expiry:{kind:"permanent"},
              object:{size:"medium",armorClass:12,hp:{current:8,maximum:8},repairable:true,destroyOnZero:true},
            })];
            state.revision+=1;
            assert.equal(commitAdapterTurnRuntimeState(adapter,internal.scene,expected,state),true);
            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),
              mechanicId:identity.mechanicId,entryPointId:identity.entryPointId,
            });

            const rejected=await adapter.resolveAction(actionId,["char.aelar"]);
            assert.notEqual(rejected.resolution?.targetIds?.[0],"char.aelar");

            const resolved=await adapter.resolveAction(actionId,[OBJECT_ID]);
            assert.equal(resolved.resolution?.stage,"complete",JSON.stringify(resolved.resolution));
            assert.deepEqual(resolved.resolution?.targetIds,[OBJECT_ID]);
            assert.equal(resolved.resolution?.targetNames?.[0],"portable-crate");
            return {targetIds:resolved.resolution?.targetIds,targetNames:resolved.resolution?.targetNames};
          }

          test("unknown installed Common Play selects an authoritative object artifact and preserves semantics after identity rename",async()=>{
            const original=await exercise(ORIGINAL);
            const renamed=await exercise(RENAMED);
            assert.deepEqual(renamed,original);
          });
          EOF
