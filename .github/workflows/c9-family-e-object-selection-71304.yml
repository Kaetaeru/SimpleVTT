            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content >/dev/null
              node --import tsx --test tests/ui/c9FamilyEObjectSelectorProduction.test.ts tests/domain/commonPlayTargetingRuntime.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then break; fi
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Record evidence and retire verifier
        shell: bash
