          import fs from "node:fs";
          const path="docs/rules/v1-mechanism-coverage-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(path,"utf8"));
          const family=ledger.rows.find((row)=>row.family==="E");
          if(!family) throw new Error("Family E ledger row missing");
          const add=(field,value)=>{ if(!family[field].includes(value)) family[field].push(value); };
          family.currentState=family.currentState.replace(/ and object\/point selection remain incomplete\.?/g," and point selection remains incomplete.").replace(/object\/point selection remain incomplete\.?/g,"point selection remains incomplete.");
          if(!family.currentState.includes("Runtime object artifacts are selectable")) family.currentState += " Runtime object artifacts are selectable through from:artifacts using the same structural selector kernel; creature-only target operations remain guarded from non-creature selections.";
          add("implementationEvidence","commonPlayOperationRuntime.ts accepts structural from:artifacts selection without emitting creature targeting operations and rejects feeding non-creature selectors into creature-only target operations");
          add("implementationEvidence","installedCommonPlayRuntimeAdapter.ts projects authoritative RulesRuntimeState object artifacts into generic selector candidates without content-name or content-ID dispatch");
          add("productionEvidence",`c9FamilyEObjectSelectorProduction.test.ts proves an unknown installed RuleModule selects a runtime object artifact through production Common Play and preserves target presentation after complete identity rename; verifier run ${process.env.GITHUB_RUN_ID}`);
          add("identityInvarianceEvidence","c9FamilyEObjectSelectorProduction.test.ts preserves object-artifact selection after complete external module/content/mechanic/entry/display rename");
          family.remainingNamedSeams=(family.remainingNamedSeams??[]).map((seam)=>seam.replace(/ and object\/point selection remain incomplete/g," and point selection remains incomplete").replace(/object\/point selection remain incomplete/g,"point selection remains incomplete")).filter(Boolean);
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+"\n");
          NODE
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git rm .github/workflows/c9-family-e-object-selection-71304.yml
