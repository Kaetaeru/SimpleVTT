          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyEObjectSelectorProduction.test.ts
          git diff --cached --check
          git commit -m "feat(c9): route object artifacts through selector authority"
          branch=agent/c9-gate-n-coverage-reconciliation
