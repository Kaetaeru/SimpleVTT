name: C9 Family E Automatic Selector Source V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-automatic-selector-source-v2.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply corrected source patch from repository bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow=Path('.github/workflows/c9-family-e-automatic-selector-bridge.yml').read_text()
          start="          python - <<'PY'\n"
          end="\n          PY\n"
          if start not in workflow:
              raise SystemExit('automatic selector bridge patch marker missing')
          script=dedent(workflow.split(start,1)[1].split(end,1)[0])
          script=script.replace('ledger["families"]','ledger["rows"]')
          exec(compile(script,'c9-family-e-automatic-selector-bridge','exec'),{'__name__':'__main__'})

          test_path=Path('tests/ui/commonPlayRichSelectorProduction.test.ts')
          text=test_path.read_text()
          stale='''    const projected=await adapter.getSnapshot();
    const action=projected.scene.actionsByActor["char.aelar"].find((candidate)=>candidate.id===actionId);
    assert.equal(action?.target,"self");
    assert.deepEqual(action?.eligibleTargetIds,["char.aelar"]);
'''
          if stale in text:
              test_path.write_text(text.replace(stale,'',1))
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family E automatic selector production
        run: >-
          node --import tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify Gate N boundaries and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/common-play-contract.schema.json src/domain/commonPlaySelectorRuntime.ts src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/commonPlayRichSelectorProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(c9): bridge automatic selector authority"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1