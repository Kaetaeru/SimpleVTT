name: C9 Family E Automatic Selector Source V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-automatic-selector-source-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family E automatic selector production
        run: >-
          node --import tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
          tests/ui/c9FamilyEConditionSelectorProduction.test.ts
          tests/ui/c9FamilyETagSelectorProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify Gate N boundaries and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Retire verifier after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-automatic-selector-source-v2.yml
          git commit -m "chore(c9): retire Family E automatic selector verifier"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1
