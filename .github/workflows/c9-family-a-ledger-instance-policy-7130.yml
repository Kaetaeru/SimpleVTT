name: C9 Family A Ledger Instance Policy 7130
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-ledger-instance-policy-7130.yml]
permissions:
  contents: write
jobs:
  reconcile-family-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile verified Family A evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text())
          rows=[row for row in ledger['rows'] if row.get('family')=='A' and row.get('id')=='expression-property']
          if len(rows)!=1:
            raise SystemExit(f'expected one Family A expression-property row, got {len(rows)}')
          row=rows[0]
          row['currentState']=(
            'The persisted property.modify contract carries explicit target, Effect ownership, definition source, elapsed duration, destroy-on-end lifetime, and instance policy. '
            'commonPlayOperationRuntime generically lowers arbitrary external property.modify definitions to the existing apply-effect ResolutionOperation with a typed propertyModifier payload, Resolver commits that payload into EffectState, and installed Common Play projects active movement.walk property effects into the existing movement expression consumer without content-name or content-ID dispatch. '
            'Generic Effect application now enforces stack, replace, and unique-by-source instance policies with reversible Effect StateChanges; profile-policy rejects explicitly until RulesProfile supplies a stacking policy. '
            'Family A remains incomplete because production property projection is not yet generic across the full property vocabulary and persistence/reconnect evidence for source-bound property modifiers is still absent.'
          )
          evidence='resolutionEffectOps.ts generic stack/replace/unique-by-source property modifier instance policy; profile-policy explicit rejection without RulesProfile policy'
          if evidence not in row['implementationEvidence']:
            row['implementationEvidence'].append(evidence)
          production='134d6fba67cb934408323ccfde85faf993d1f55d feat(c9): enforce property modifier instance policy; propertyModifierInstancePolicyRuntime.test.ts stack/replace/unique-by-source plus explicit profile-policy rejection'
          if production not in row['productionEvidence']:
            row['productionEvidence'].append(production)
          row['remainingNamedSeams']=[entry for entry in row['remainingNamedSeams'] if 'instancePolicy is stored' not in entry]
          if not any('profile-policy' in entry for entry in row['remainingNamedSeams']):
            row['remainingNamedSeams'].append('property modifier profile-policy remains explicitly unsupported until RulesProfile defines the stacking policy')
          path.write_text(json.dumps(ledger,indent=2,ensure_ascii=False)+'\n')
      - name: Verify ledger JSON and Family A remains honestly incomplete
        run: |
          node -e "const l=require('./docs/rules/v1-mechanism-coverage-ledger.json'); const r=l.rows.find(x=>x.family==='A'&&x.id==='expression-property'); if(!r||r.disposition!=='INCOMPLETE'||!r.productionEvidence.some(x=>x.includes('134d6fba67cb934408323ccfde85faf993d1f55d'))||r.remainingNamedSeams.some(x=>x.includes('instancePolicy is stored'))) process.exit(1)"
      - name: Commit reconciled Family A evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-a-ledger-instance-policy-7130.yml
          git commit -m "docs(c9): reconcile Family A instance-policy evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
