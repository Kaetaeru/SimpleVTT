name: C9 Family I Monk Movement

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - "src/app/monkFocusRuntimeAdapter.ts"
      - "tests/ui/monkFocusActionRuntime.test.ts"
      - ".github/workflows/c9-family-i-monk-movement.yml"
  pull_request:
    paths:
      - "src/app/monkFocusRuntimeAdapter.ts"
      - "tests/ui/monkFocusActionRuntime.test.ts"
      - ".github/workflows/c9-family-i-monk-movement.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Monk Focus movement runtime
        run: npm run test:monk-focus
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
