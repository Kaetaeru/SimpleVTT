name: C9 Family W Form Lifecycle 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - "tests/domain/c9FamilyWFormArtifactLifecycle.test.ts"
      - ".github/workflows/c9-family-w-form-lifecycle-71304.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify portable form artifact lifecycle
        run: npx tsx --test tests/domain/c9FamilyWFormArtifactLifecycle.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
