name: C9 Family G Spatial Restart 7130

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - "src/app/connectedCommonPlayAuthorityFactRuntime.ts"
      - "tests/ui/c9FamilyGConnectedSpatialFactRuntime.test.ts"
      - "tests/ui/c9FamilyGSpatialFactRestartPersistence.test.ts"
      - "tests/ui/connectedCommonPlayAuthorityFactRouting.test.ts"
      - "docs/rules/v1-mechanism-coverage-ledger.json"
      - "scripts/check-v1-mechanism-coverage.mjs"
      - "scripts/check-legacy-execution-boundary.mjs"
      - ".github/workflows/c9-family-g-spatial-restart-7130.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Family G restart and authority routing
        run: >-
          npx tsx --test
          tests/ui/c9FamilyGConnectedSpatialFactRuntime.test.ts
          tests/ui/c9FamilyGSpatialFactRestartPersistence.test.ts
          tests/ui/connectedCommonPlayAuthorityFactRouting.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Verify V1 coverage ledger structure
        run: npm run test:v1-coverage
      - name: Typecheck
        run: npx tsc --noEmit
