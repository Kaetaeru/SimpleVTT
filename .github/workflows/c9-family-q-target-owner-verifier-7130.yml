name: C9 Family Q Target Owner Verifier 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-target-owner-verifier-7130.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile latest branch before editing
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git fetch origin "$branch"
          git rebase "origin/$branch"
      - name: Add target-owner consent routing and production proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          domain=Path('src/domain/commonPlayOperationRuntime.ts')
          text=domain.read_text(encoding='utf-8')
          old='  responder:"actor"|"actor-owner";'
          new='  responder:"actor"|"actor-owner"|"target-owner";'
          if old in text:
              if text.count(old)!=1: raise SystemExit(f'domain responder type marker mismatch: {text.count(old)}')
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('domain responder type marker missing')
          old='  if(interaction.responder!=="actor"&&interaction.responder!=="actor-owner") throw new DomainEvaluationError(`${label}.responder must be actor or actor-owner for portable Common Play interaction`);'
          new='  if(interaction.responder!=="actor"&&interaction.responder!=="actor-owner"&&interaction.responder!=="target-owner") throw new DomainEvaluationError(`${label}.responder must be actor, actor-owner, or target-owner for portable Common Play interaction`);'
          if old in text:
              if text.count(old)!=1: raise SystemExit(f'domain responder parser marker mismatch: {text.count(old)}')
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('domain responder parser marker missing')
          domain.write_text(text,encoding='utf-8')

          app=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=app.read_text(encoding='utf-8')
          marker='  const actionName=prepared.projectedAction?.name||action.nameKo||action.nameEn;\n  prepared.internal.resolution={'
          insertion='''  const actionName=prepared.projectedAction?.name||action.nameKo||action.nameEn;\n  const interactionResponder=interaction.responder==="target-owner"\n    ?prepared.selectedTargets.length===1?prepared.selectedTargets[0]:undefined\n    :prepared.actorEntity;\n  if(!interactionResponder) {\n    return failAction(prepared.internal,prepared.actor.id,actionId,actionName,targetIds,resolutionId,"target-owner interaction requires exactly one selected target");\n  }\n  prepared.internal.resolution={'''
          if insertion not in text:
              if text.count(marker)!=1: raise SystemExit(f'app interaction insertion marker mismatch: {text.count(marker)}')
              text=text.replace(marker,insertion,1)
          old='      responderId:prepared.actor.id,\n      responderName:prepared.actor.name,'
          new='      responderId:interactionResponder.id,\n      responderName:interactionResponder.name,'
          if old in text:
              if text.count(old)!=1: raise SystemExit(f'app responder marker mismatch: {text.count(old)}')
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('app responder marker missing')
          app.write_text(text,encoding='utf-8')

          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          family=next(entry for entry in data['rows'] if entry.get('family')=='Q')
          family['currentState']=family['currentState'].replace(
              'Portable boolean consent now supports actor and actor-owner responders',
              'Portable boolean consent now supports actor, actor-owner, and target-owner responders',
          )
          impl='installedCommonPlayRuntimeAdapter.ts derives target-owner consent responderId from the single authoritative selected target; connectedActionRoutingAdapter routes and authorizes the interrupt by responder Character id'
          if impl not in family['implementationEvidence']: family['implementationEvidence'].append(impl)
          prod='c9FamilyQTargetOwnerInteractionProduction.test.ts unknown installed target-owner consent routes only to the selected target owner peer, rejects the actor peer, and commits downstream damage plus Reaction payment atomically after approval'
          if prod not in family['productionEvidence']: family['productionEvidence'].append(prod)
          identity='c9FamilyQTargetOwnerInteractionProduction.test.ts uses arbitrary previously-unknown module/content/mechanic/entry identities; responder routing depends on selected target ownership rather than content identity'
          if identity not in family['identityInvarianceEvidence']: family['identityInvarianceEvidence'].append(identity)
          connected='c9FamilyQTargetOwnerInteractionProduction.test.ts sends the blocking prompt to the selected target owner peer, rejects a different peer as interrupt-not-authorized, and broadcasts the accepted authoritative event batch'
          if connected not in family['connectedEvidenceIfRelevant']: family['connectedEvidenceIfRelevant'].append(connected)
          seams=family['remainingNamedSeams']
          old_seam='target, target-owner, DM, and Host responder routing is not yet represented'
          new_seam='target, DM, and Host responder routing is not yet represented'
          if old_seam in seams: seams[seams.index(old_seam)]=new_seam
          old_reconnect='actor-owner reconnect and revision-stale response evidence remain incomplete'
          new_reconnect='actor-owner and target-owner reconnect and revision-stale response evidence remain incomplete'
          if old_reconnect in seams: seams[seams.index(old_reconnect)]=new_reconnect
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/connectedSessionRuntimeAdapter";
          import "../../src/app/connectedActionRoutingAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { connectedManifest } from "../../src/app/connectedSessionRuntimeAdapter";
          import { connectedStateFor } from "../../src/app/connectedSessionState";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { HostSessionLedger } from "../../src/app/connectedSessionProtocol";
          import { tauriSessionTransport } from "../../src/app/tauriSessionTransport";
          import { routeConnectedInterruptResponse } from "../../src/app/connectedInterruptResponsePort";

          const MODULE_ID="homebrew.target-owner-consent";
          const CONTENT_ID="option.target-owner-consent";
          const MECHANIC_ID="external.unknown.target-owner-consent";
          const ENTRY_POINT_ID="ask-target-owner";

          function payload(){return JSON.stringify({
            schemaVersion:"0.1-draft",moduleId:MODULE_ID,moduleVersion:"1",
            rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
            source:{document:"Target Owner Consent Probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],
            content:[{id:CONTENT_ID,category:"option",presentation:{defaultLocale:"en",originalName:"Target Owner Consent",locales:{en:{name:"Target Owner Consent",description:"Portable selected-target owner consent probe"}}},mechanics:[{kind:"common-play",config:{
              schemaVersion:"0.2-draft",id:MECHANIC_ID,
              payments:[{kind:"economy",bucket:"reaction",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],
              entryPoints:[{id:ENTRY_POINT_ID,invocation:"manual",interaction:{id:"target-owner-consent",kind:"consent",responder:"target-owner",mode:"blocking",input:{type:"boolean"},revalidate:"if-revision-changed",stalePolicy:"reject"},targeting:{from:"targets",min:1,max:1},operations:[{kind:"damage.apply",amount:{value:1},damageType:"force",target:"target"}]}],
            }}]}]
          });}

          async function install(adapter:MockAdapter){
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(payload());
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            return installedCommonPlayActionId({catalogId:catalogQualifiedId(CONTENT_ID,MODULE_ID,"1"),mechanicId:MECHANIC_ID,entryPointId:ENTRY_POINT_ID});
          }

          test("target-owner consent routes to the selected target owner and rejects the actor peer",async()=>{
            const sessionId="session.target-owner-consent",host=new MockAdapter();
            const actionId=await install(host);
            const internal=host as unknown as {activeCharacter:{id:string};scene:{entities:Array<{id:string;name:string;hp:number}>}};
            const actorId=internal.activeCharacter.id;
            const target=internal.scene.entities.find((entity)=>entity.id!==actorId&&entity.hp>0);
            assert.ok(target);
            const targetId=target.id,targetHpBefore=target.hp;
            await host.startInitiative();await host.setCurrentActor(actorId);

            const state=connectedStateFor(host);state.mode="host";state.sessionId=sessionId;state.ledger=new HostSessionLedger(sessionId,connectedManifest(host));
            const actorManifest=structuredClone(connectedManifest(host));
            const targetManifest=structuredClone(actorManifest);
            assert.ok(targetManifest.character);
            targetManifest.character={...targetManifest.character,characterId:targetId};
            state.peerManifests.set("peer.actor",actorManifest);
            state.peerManifests.set("peer.target",targetManifest);

            const direct:Array<{peer:string;message:string}>=[],broadcasts:string[]=[];
            const oldSend=tauriSessionTransport.send,oldSendTo=tauriSessionTransport.sendTo;
            tauriSessionTransport.send=async(message)=>{broadcasts.push(message);return 1;};
            tauriSessionTransport.sendTo=async(peer,message)=>{direct.push({peer,message});return 1;};
            try{
              await host.resolveAction(actionId,[targetId]);
              let snapshot=await host.getSnapshot();
              assert.equal(snapshot.resolution?.stage,"interrupt",JSON.stringify(snapshot.resolution));
              assert.equal(snapshot.resolution?.interrupt?.responderId,targetId);
              assert.equal(snapshot.resolution?.interrupt?.responderName,target.name);
              const prompt=direct.map((entry)=>({peer:entry.peer,wire:JSON.parse(entry.message)})).find((entry)=>entry.wire.type==="resolution-interrupt-prompt");
              assert.equal(prompt?.peer,"peer.target",JSON.stringify(direct));
              assert.equal(prompt?.wire.interrupt.responderId,targetId);
              assert.equal(snapshot.scene.entities.find((entity)=>entity.id===targetId)?.hp,targetHpBefore);
              assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,true);

              const resolutionId=snapshot.resolution!.id,promptId=snapshot.resolution!.interrupt!.id;
              const directBeforeUnauthorized=direct.length;
              assert.equal(await routeConnectedInterruptResponse(host,{peer:"peer.actor",message:""},{sessionId,resolutionId,promptId,accept:true}),true);
              const unauthorized=direct.slice(directBeforeUnauthorized).map((entry)=>JSON.parse(entry.message)).filter((wire)=>wire.type==="error");
              assert.equal(unauthorized.at(-1)?.code,"interrupt-not-authorized",JSON.stringify(unauthorized));
              snapshot=await host.getSnapshot();
              assert.equal(snapshot.resolution?.stage,"interrupt");
              assert.equal(snapshot.scene.entities.find((entity)=>entity.id===targetId)?.hp,targetHpBefore);

              assert.equal(await routeConnectedInterruptResponse(host,{peer:"peer.target",message:""},{sessionId,resolutionId,promptId,accept:true}),true);
              snapshot=await host.getSnapshot();
              assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
              assert.equal(snapshot.scene.entities.find((entity)=>entity.id===targetId)?.hp,targetHpBefore-1);
              assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false);
              assert.ok(broadcasts.map((wire)=>JSON.parse(wire)).some((wire)=>wire.type==="event-batch"),JSON.stringify(broadcasts));
            }finally{tauriSessionTransport.send=oldSend;tauriSessionTransport.sendTo=oldSendTo;}
          });
          EOF
      - name: Generate builtin catalog
        run: npm run generate:content
      - name: Verify Family Q target-owner slice
        run: >-
          node --import tsx --test
          tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
          tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts
          tests/ui/commonPlayInteractionProductionRuntime.test.ts
      - name: Verify repository boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified proof and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git rm -f .github/workflows/c9-family-q-target-owner-verifier-7130.yml
          git diff --cached --check
          git commit -m "feat(c9): route target-owner consent interactions"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            npm run generate:content
            node --import tsx --test tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/ui/commonPlayInteractionProductionRuntime.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "branch advanced during publish attempt $attempt; retrying after rebase"
          done
          echo "failed to publish target-owner proof after concurrent branch advances" >&2
          exit 1
