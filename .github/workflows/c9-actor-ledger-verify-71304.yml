name: C9 Actor Ledger Verify 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-actor-ledger-verify-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - id: actor
        name: Verify actor artifact connected replay
        shell: bash
        run: |
          set +e
          node --import tsx --test tests/ui/connectedActorArtifactReconnectProduction.test.ts tests/ui/connectedActorArtifactLifetimeProduction.test.ts
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - id: types
        name: Verify TypeScript
        shell: bash
        run: |
          set +e
          npm exec tsc -- --noEmit
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retire verifier
        if: always()
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-actor-ledger-verify-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            rm -f "$path"
            git add -A "$path"
            if git diff --cached --quiet; then break; fi
            git commit -m "ci(c9): retire actor ledger verifier"
            if git push origin HEAD:"$branch"; then break; fi
            sleep 1
          done
      - name: Preserve verification result
        if: steps.actor.outputs.exit_code != '0' || steps.types.outputs.exit_code != '0'
        run: exit 1
