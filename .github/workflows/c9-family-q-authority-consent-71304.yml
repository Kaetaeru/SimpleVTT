name: C9 Family Q Authority Consent 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-authority-consent-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Bridge DM and Host consent responders
        run: python3 .github/scripts/c9-family-q-authority-consent-71304.py
      - run: npm run generate:content
      - name: Verify Family Q authority responder slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified Family Q authority responder slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Family Q authority responder slice already published"
            exit 0
          fi
          git commit -m "feat(c9): route DM and Host consent responders"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 20); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content >/dev/null
              node --import tsx --test tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1
