name: C9 Family L Death Save Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-death-save-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record verified Family L death-save evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          text=path.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected ledger text missing')
              text=text.replace(old,new,1)

          replace_once(
              'Bounded typed damage/healing plus portable Temporary HP are production-proven; portable character instant-death overkill is production-proven with identity rename and Undo; remaining life/object semantics are incomplete Portable stabilization at 0 HP is production-proven with event-native Undo and external identity rename.',
              'Bounded typed damage/healing plus portable Temporary HP are production-proven; portable character instant-death overkill, stabilization at 0 HP, and death saving throws are production-proven with event-native Undo and external identity rename; remaining damage-at-zero, advanced damage-defense/max-HP, and object/vehicle semantics are incomplete.',
              'Family L current state',
          )
          replace_once(
              '        "commonPlayOperationRuntime.ts parses temp-hp.grant from the Common Play contract and lowers it directly to the shared Resolver temporary-hp operation, including explicit Temporary HP choice semantics"',
              '        "commonPlayOperationRuntime.ts parses temp-hp.grant from the Common Play contract and lowers it directly to the shared Resolver temporary-hp operation, including explicit Temporary HP choice semantics",\n        "commonPlayOperationRuntime.ts parses portable life.death-save and lowers it to the existing shared Resolver death-save operation; installedCommonPlayRuntimeAdapter.ts supplies the authoritative d20 face without content identity dispatch"',
              'Family L implementation evidence',
          )
          replace_once(
              '        "325ddee91c87855c35816f5f16fc8134bb709209 test(c9): prove portable stabilization; C9 Family L Stabilize 71304 run 33315607390 passed unknown/renamed RuleModule 0-HP stabilization, event-native Undo, existing Family L regressions, V1 coverage checker, legacy execution boundary, and tsc --noEmit"',
              '        "325ddee91c87855c35816f5f16fc8134bb709209 test(c9): prove portable stabilization; C9 Family L Stabilize 71304 run 33315607390 passed unknown/renamed RuleModule 0-HP stabilization, event-native Undo, existing Family L regressions, V1 coverage checker, legacy execution boundary, and tsc --noEmit",\n        "e6d44f1587587668e3d1bb1e3aac7dd65850c228 feat(c9): bridge portable death saves; C9 Family L Portable Death Save 71304 run 33316957824 passed unknown/renamed RuleModule death-save production plus Undo, stabilization regression, V1 coverage checker, legacy execution boundary, and tsc --noEmit"',
              'Family L production evidence',
          )
          replace_once(
              '        "c9FamilyLStabilizeProduction.test.ts repeats 0-HP stabilization and Undo under completely unrelated external module/content/mechanic identities"',
              '        "c9FamilyLStabilizeProduction.test.ts repeats 0-HP stabilization and Undo under completely unrelated external module/content/mechanic identities",\n        "c9FamilyLDeathSaveProduction.test.ts repeats authoritative death-save success and event-native Undo under completely unrelated external module/content/mechanic identities"',
              'Family L identity evidence',
          )
          replace_once(
              '        "0 HP/unconscious and stabilization are production-proven; damage-at-zero and death-save production acceptance remain incomplete",',
              '        "0 HP/unconscious, stabilization, and death-save production acceptance are proven; damage-at-zero production acceptance remains incomplete",',
              'Family L remaining death-save seam',
          )
          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify reconciled ledger
        shell: bash
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Commit verified evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-l-death-save-ledger-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): record portable death save evidence"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
