name: C9 Family A Property Projection Step
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-property-projection-step.yml]
permissions:
  contents: write
jobs:
  property-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply Effect-backed movement property projection
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: expected one anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          effects='src/domain/effects.ts'
          replace_once(
              effects,
              'import { DomainEvaluationError, type ExpressionNode, type ProvenanceRecord } from "./profileEngine";',
              'import { DomainEvaluationError, evaluateExpression, type ExpressionNode, type PropertyResolution, type ProvenanceRecord } from "./profileEngine";',
              'effects expression import',
          )
          replace_once(
              effects,
              '''export function effectIsActive(effect:EffectInstance) {
            return effect.suppression===undefined;
          }

          export function suppressEffect''',
              '''export function effectIsActive(effect:EffectInstance) {
            return effect.suppression===undefined;
          }

          export function resolveEffectModifiedProperty(
            effects:EffectInstance[],
            targetId:string,
            property:string,
            inputProperties:Record<string,number>,
          ):PropertyResolution {
            const base=inputProperties[property];
            if(!Number.isFinite(base)) throw new DomainEvaluationError(`unresolved property reference: ${property}`);
            let value=base;
            const provenance:ProvenanceRecord[]=[];
            for(const effect of effects) {
              const modifier=effect.propertyModifier;
              if(effect.targetId!==targetId||!modifier||modifier.property!==property) continue;
              if(!effectIsActive(effect)) {
                provenance.push({source:`effect:${effect.id}`,status:"suppressed",reason:effect.suppression?.reason??"effect suppressed"});
                continue;
              }
              const operand=evaluateExpression(modifier.value,(reference)=>{
                if(reference===property) return value;
                const referenced=inputProperties[reference];
                if(!Number.isFinite(referenced)) throw new DomainEvaluationError(`unresolved property reference: ${reference}`);
                return referenced;
              });
              const before=value;
              switch(modifier.operation) {
                case "add": value+=operand; break;
                case "subtract": value-=operand; break;
                case "set": value=operand; break;
                case "min": value=Math.min(value,operand); break;
                case "max": value=Math.max(value,operand); break;
                case "multiply": value*=operand; break;
              }
              if(!Number.isFinite(value)) throw new DomainEvaluationError(`property modifier produced a non-finite ${property}`);
              provenance.push({source:`effect:${effect.id}`,status:"applied",reason:`${modifier.operation} ${operand}: ${before} -> ${value}`});
            }
            return {property,value,provenance};
          }

          export function suppressEffect''',
              'effect property projection',
          )

          adapter='src/app/installedCommonPlayRuntimeAdapter.ts'
          replace_once(
              adapter,
              'import { resolvePendingResolution } from "../domain/resolution";',
              'import { resolvePendingResolution } from "../domain/resolution";\nimport { resolveEffectModifiedProperty } from "../domain/effects";',
              'adapter effect import',
          )
          replace_once(
              adapter,
              '  const {actor,actorEntity,selectedTargetId,selectedTargets}=prepared;\n  const entryPoint=action.lowered.definition.entryPoints.find((candidate)=>candidate.id===action.entryPointId)!;',
              '''  const {actor,actorEntity,selectedTargetId,selectedTargets,state}=prepared;
            const entryPoint=action.lowered.definition.entryPoints.find((candidate)=>candidate.id===action.entryPointId)!;
            const actorState=state.combatants[actor.id];
            const movementProperties=actorState?{
              "movement.walk":resolveEffectModifiedProperty(
                state.effects,actor.id,"movement.walk",{"movement.walk":actorState.baseSpeed},
              ).value,
            }:undefined;''',
              'adapter movement projection',
          )
          replace_once(
              adapter,
              '    damageDiceFaces:damageDiceFaces(internal,actionId,entryPoint,d20Faces?.length??0),\n    ...(Object.keys(movementFactAnswers).length?{movementFactAnswers}:{}),',
              '    damageDiceFaces:damageDiceFaces(internal,actionId,entryPoint,d20Faces?.length??0),\n    ...(movementProperties?{movementProperties}:{}),\n    ...(Object.keys(movementFactAnswers).length?{movementFactAnswers}:{}),',
              'adapter movement input',
          )

          Path('tests/ui/installedCommonPlayPropertyModifierProduction.test.ts').write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          function moduleJson(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.option`;
            const mechanicId=`${prefix}.property-movement`;
            const config={schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[
              {id:"slow",invocation:"manual",operations:[{kind:"property.modify",property:"movement.walk",operation:"set",value:{value:5},target:"actor",owner:"effect",source:"definition",duration:{kind:"elapsed",amount:{value:1},unit:"minutes"},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:"stack"}]},
              {id:"move",invocation:"manual",operations:[{kind:"movement.relocate",mode:"move",movementType:"walk",target:"actor",distance:{ref:"movement.walk"},destinationFact:{id:"property-move-destination",fact:"spatial.legal-destination",subject:"actor",authority:"actor-owner",visibility:"actor-and-dm",unknownPolicy:"request-authority"}}]},
            ]};
            return {moduleId,contentId,mechanicId,json:JSON.stringify({schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",source:{document:"Unknown property module",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Unknown Property Movement",locales:{en:{name:"Unknown Property Movement"}}},mechanics:[{kind:"common-play",config}]}]})};
          }

          async function run(prefix:string) {
            const adapter=new MockAdapter();
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const pack=moduleJson(prefix);
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const action=(entryPointId:string)=>installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId});
            const before=await adapter.getSnapshot();
            const beforeState=snapshotAdapterTurnRuntimeState(adapter,before.scene)!;
            const initialRemaining=beforeState.combatants["char.aelar"].movement.remaining;
            await adapter.resolveAction(action("slow"),["char.aelar"]);
            const modified=await adapter.getSnapshot();
            const modifiedState=snapshotAdapterTurnRuntimeState(adapter,modified.scene)!;
            assert.deepEqual(modifiedState.effects.at(-1)?.propertyModifier,{property:"movement.walk",operation:"set",value:{value:5},source:"definition",instancePolicy:"stack"});
            await adapter.resolveAction(action("move"),["char.aelar"]);
            const moved=await adapter.getSnapshot();
            const movedState=snapshotAdapterTurnRuntimeState(adapter,moved.scene)!;
            return {spent:initialRemaining-movedState.combatants["char.aelar"].movement.remaining,resolution:moved.resolution};
          }

          test("unknown Common Play property modifier projects through Effect state into production movement",async()=>{
            const result=await run("external-property-a");
            assert.equal(result.spent,5,JSON.stringify(result.resolution));
            assert.equal(result.resolution?.stage,"complete");
          });

          test("renaming the external module preserves property-modified production movement",async()=>{
            const first=await run("external-property-a");
            const renamed=await run("renamed-property-b");
            assert.equal(first.spent,5);
            assert.equal(renamed.spent,5);
          });
          ''')
      - run: npx tsx --test tests/domain/effectsRuntime.test.ts tests/domain/commonPlayPropertyContractRuntime.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - run: npm run generate:content
      - run: npx tsc --noEmit
      - name: Commit verified Family A projection slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/effects.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          git rm .github/workflows/c9-family-a-property-projection-step.yml
          git commit -m "feat(c9): project property effects into movement"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
