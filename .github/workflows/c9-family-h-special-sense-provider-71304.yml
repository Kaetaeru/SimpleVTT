name: C9 Family H Special Sense Authority 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-special-sense-provider-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Stage generic special-sense authority seam
        shell: python
        run: |
          from pathlib import Path
          import json

          authority=Path("src/app/commonPlaySenseAuthority.ts")
          authority.write_text('''import type { SceneVm } from "./contracts";\nimport type { CommonPlaySense } from "../domain/commonPlaySenseRuntime";\n\nexport interface CommonPlaySenseAuthorityProvider {\n  id:string;\n  senses(actorId:string):CommonPlaySense[]|null|undefined;\n}\n\nconst providers=new WeakMap<SceneVm,CommonPlaySenseAuthorityProvider>();\n\nexport function registerCommonPlaySenseAuthorityProvider(scene:SceneVm,provider:CommonPlaySenseAuthorityProvider|null) {\n  if(provider)providers.set(scene,provider);\n  else providers.delete(scene);\n}\n\n/** Returns provider-authored sense profiles without inferring species, class, feature, or content identities. */\nexport function authoritativeCommonPlaySenses(scene:SceneVm,actorId:string):CommonPlaySense[]|null {\n  const senses=providers.get(scene)?.senses(actorId);\n  if(!senses?.length)return null;\n  return senses.map((sense)=>({...sense}));\n}\n''',encoding="utf-8")

          adapter=Path("src/app/commonPlayInterceptorProductionRuntimeAdapter.ts")
          source=adapter.read_text(encoding="utf-8")
          import_anchor='import { resolveCommonPlaySenses } from "../domain/commonPlaySenseRuntime";\n'
          import_line='import { authoritativeCommonPlaySenses } from "./commonPlaySenseAuthority";\n'
          if import_line not in source:
            if import_anchor not in source: raise SystemExit("sense import anchor changed")
            source=source.replace(import_anchor,import_anchor+import_line,1)
          old='''        const composed=resolveCommonPlaySenses([{kind:"normal-sight"}],{\n'''
          new='''        const senses=authoritativeCommonPlaySenses(internal.scene,candidate.sourceActorId)??[{kind:"normal-sight" as const}];\n        const composed=resolveCommonPlaySenses(senses,{\n'''
          if new not in source:
            if old not in source: raise SystemExit("sense composition anchor changed")
            source=source.replace(old,new,1)
          adapter.write_text(source,encoding="utf-8")

          test=Path("tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts")
          source=test.read_text(encoding="utf-8")
          import_anchor='import { resolvePendingResolution } from "../../src/domain/resolution";\n'
          import_line='import { registerCommonPlaySenseAuthorityProvider } from "../../src/app/commonPlaySenseAuthority";\n'
          if import_line not in source:
            if import_anchor not in source: raise SystemExit("test import anchor changed")
            source=source.replace(import_anchor,import_anchor+import_line,1)
          marker='portable production special senses consume provider-authored profiles with range and identity invariance'
          if marker not in source:
            source+='''\n\ntest("portable production special senses consume provider-authored profiles with range and identity invariance",async()=>{\n  const renamed:Identity={...ORIGINAL,moduleId:"external.special-sense-renamed",contentId:"item.special-sense-renamed",mechanicId:"mechanic.special-sense-renamed",interceptorId:"interceptor.special-sense-renamed",interactionId:"interaction.special-sense-renamed",displayName:"Renamed Special Sense Reaction"};\n  for(const identity of [ORIGINAL,renamed]){\n    const adapter=await prepare(identity,true,"d20",undefined,undefined,{light:"darkness",obscurement:"none"});\n    const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n    setSpatialRelation(internal.scene,{\n      sourceId:internal.activeCharacter.id,targetId:OTHER_CHARACTER_ID,distanceFeet:30,visible:true,cover:"none",targetCanSeeAttacker:true,\n      light:"darkness",obscurement:"none",detected:true,provenance:"module:test-special-sense:spatial",\n    });\n    seedHiddenRuntimeEffect(adapter,OTHER_CHARACTER_ID);\n    registerCommonPlaySenseAuthorityProvider(internal.scene,{\n      id:"rules-profile.special-sense-probe",\n      senses(actorId){assert.equal(actorId,internal.activeCharacter.id);return [{kind:"normal-sight"},{kind:"darkvision",rangeFeet:60}];},\n    });\n    const snapshot=await openAbilityCheckInterrupt(adapter);\n    assert.equal(snapshot.resolution?.stage,"interrupt",JSON.stringify(snapshot.resolution));\n    await adapter.respondToInterrupt(false);\n  }\n\n  const outOfRange=await prepare(ORIGINAL,true,"d20",undefined,undefined,{light:"darkness",obscurement:"none"});\n  const internal=outOfRange as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n  setSpatialRelation(internal.scene,{\n    sourceId:internal.activeCharacter.id,targetId:OTHER_CHARACTER_ID,distanceFeet:30,visible:true,cover:"none",targetCanSeeAttacker:true,\n    light:"darkness",obscurement:"none",detected:true,provenance:"module:test-special-sense-range:spatial",\n  });\n  seedHiddenRuntimeEffect(outOfRange,OTHER_CHARACTER_ID);\n  registerCommonPlaySenseAuthorityProvider(internal.scene,{id:"rules-profile.short-darkvision",senses:()=>[{kind:"darkvision",rangeFeet:20}]});\n  const snapshot=await openAbilityCheckInterrupt(outOfRange);\n  assert.notEqual(snapshot.resolution?.stage,"interrupt","out-of-range darkvision must not satisfy sense.can-see");\n});\n'''
          test.write_text(source,encoding="utf-8")

          ledger=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(ledger.read_text(encoding="utf-8"))
          family=next(entry for entry in data["families"] if entry["family"]=="H")
          sentence="commonPlaySenseAuthority.ts provides an identity-independent authoritative observer sense-profile seam; commonPlayInterceptorProductionRuntimeAdapter.ts composes provider-authored special senses and range through resolveCommonPlaySenses for production sense.can-see."
          if sentence not in family["implementationEvidence"]: family["implementationEvidence"].append(sentence)
          production="installedCommonPlayInterceptorProductionRuntime.test.ts proves unknown installed Common Play consumes provider-authored darkvision with range checks under darkness and preserves behavior after full external identity rename"
          if production not in family["productionEvidence"]: family["productionEvidence"].append(production)
          identity="installedCommonPlayInterceptorProductionRuntime.test.ts special-sense probe preserves darkvision/range semantics after module/content/mechanic/interceptor/interaction/display rename"
          if identity not in family["identityInvarianceEvidence"]: family["identityInvarianceEvidence"].append(identity)
          family["currentState"]="Generic status and creature-type awareness paths are production-proven. Common Play defines standard sensing facts with identity-independent provider provenance and connected owner-authority routing. Resolver-owned Hidden effects feed sense.hidden, and provider-authored special-sense profiles now feed production sense.can-see through the shared sensing kernel with explicit range handling. Family H remains incomplete for rules-derived sense-profile projection, Invisible interactions, detection/Search, and discovery semantics."
          family["remainingNamedSeams"]=["rules-derived sense-profile projection, Invisible interactions, detection/Search, and discovery semantics remain incomplete"]
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family H special-sense production seam
        run: |
          node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified change and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-h-special-sense-provider-71304.yml
          git add src/app/commonPlaySenseAuthority.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): bridge authoritative special senses into production"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content >/dev/null
              node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            echo "publish raced with another C9 writer; retry $attempt/5"
          done
          exit 1
