name: C9 Family E Area Import Finalize 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-import-finalize-7130.yml

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admit provider-gated area selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("src/domain/commonPlayOperationRuntime.ts")
          text = runtime.read_text(encoding="utf-8")
          replacements = [
              (
                  'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"|"area"> {',
                  'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"> {',
              ),
              (
                  'const TARGETING_KEYS=new Set(["from","where","min","max"]);',
                  'const TARGETING_KEYS=new Set(["from","where","min","max","area"]);',
              ),
              (
                  'return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where})};',
                  'return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where}),...(parsed.area===undefined?{}:{area:parsed.area})};',
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"runtime patch marker mismatch: {old}")
              text = text.replace(old, new, 1)
          runtime.write_text(text, encoding="utf-8")
          PY
      - run: npm run generate:content
      - name: Verify Family E area slice
        run: npx tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/domain/commonPlayMaplessTargeting.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Commit verified source and remove temporary verifiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts
          git rm -f .github/workflows/c9-family-e-area-import-finalize-7130.yml
          git rm -f .github/workflows/c9-family-e-area-land-7130.yml 2>/dev/null || true
          git rm -f .github/workflows/c9-family-e-area-land-r2-7130.yml 2>/dev/null || true
          git commit -m "feat(c9): admit provider-gated area selectors"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if ! git rebase origin/agent/c9-gate-n-coverage-reconciliation; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
