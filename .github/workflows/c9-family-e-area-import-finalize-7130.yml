name: C9 Family E Area Import Finalize 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-import-finalize-7130.yml

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare deterministic patcher
        shell: bash
        run: |
          cat > /tmp/apply-area-import.py <<'PY'
          from pathlib import Path

          runtime = Path("src/domain/commonPlayOperationRuntime.ts")
          text = runtime.read_text()
          replacements = [
              (
                  'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"|"area"> {',
                  'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"> {',
              ),
              (
                  'const TARGETING_KEYS=new Set(["from","where","min","max"]);',
                  'const TARGETING_KEYS=new Set(["from","where","min","max","area"]);',
              ),
              (
                  'return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where})};',
                  'return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where}),...(parsed.area===undefined?{}:{area:parsed.area})};',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              else:
                  assert new in text
          runtime.write_text(text)

          ui_test = Path("tests/ui/commonPlayRichSelectorProduction.test.ts")
          text = ui_test.read_text()
          replacements = [
              (
                  '  assert.notEqual((await adapter.getSnapshot()).resolution?.actionId,actionId,"relation predicate must reject self before Resolver execution");',
                  '  const rejected=(await adapter.getSnapshot()).resolution;\n  assert.equal(rejected?.actionId,actionId);\n  assert.equal(rejected?.finalOutcome,"적용 거부","relation predicate must reject self before Resolver execution");',
              ),
              (
                  '  assert.notEqual((await adapter.getSnapshot()).resolution?.actionId,actionId,"mapless production must not fabricate area membership");',
                  '  const rejected=(await adapter.getSnapshot()).resolution;\n  assert.equal(rejected?.actionId,actionId);\n  assert.equal(rejected?.finalOutcome,"적용 거부","mapless production must not fabricate area membership");',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              else:
                  assert new in text
          ui_test.write_text(text)
          PY
      - name: Reconcile latest head, verify, and land
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 6); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python /tmp/apply-area-import.py
            npm run generate:content
            node --import tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/domain/commonPlayMaplessTargeting.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            git rm .github/workflows/c9-family-e-area-import-finalize-7130.yml
            git add src/domain/commonPlayOperationRuntime.ts tests/ui/commonPlayRichSelectorProduction.test.ts
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "feat(c9): admit provider-gated area selectors"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
          done
          exit 1
