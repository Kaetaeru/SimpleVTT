name: C9 Family E Area Final Verify 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-import-finalize-7130.yml

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family E selector production slice
        run: >-
          node --import tsx --test
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/domain/commonPlayMaplessTargeting.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify boundaries and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Remove consumed verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-area-import-finalize-7130.yml
          git commit -m "chore(c9): remove consumed Family E verifier"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
