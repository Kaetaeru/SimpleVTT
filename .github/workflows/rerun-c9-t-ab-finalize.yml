name: C9 Finalize Zone Stay And Recharge

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-t-ab-finalize.yml

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Add Recharge availability and consumption proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ui/connectedActorTurnRuleProduction.test.ts')
          text=p.read_text()
          old='    moduleId,actorRulesId,actorContentId,creatorId,creatorContentId,summonId,resourceId,\n'
          new='    moduleId,actorRulesId,actorContentId,creatorId,creatorContentId,summonId,resourceId,actorActionId,\n'
          if old not in text and new not in text:
              raise SystemExit('actor pack return marker not found')
          if old in text:
              text=text.replace(old,new,1)
          marker='test("actor-owned turn-end Common Play rule is invariant under every external identity rename"'
          if 'Recharge action consumes its recovered resource' not in text:
              if marker not in text:
                  raise SystemExit('turn-end test marker not found')
              test='''test("actor-owned Recharge action consumes its recovered resource and recovers on the next turn start",async()=>{\n  const adapter=new MockAdapter();\n  const pack=await install(adapter,"unknown-recharge-consumption");\n  await adapter.resolveAction(pack.summonAction,["char.aelar"]);\n  let snapshot=await advanceUntilActor(adapter,pack.summonId);\n  let runtime=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;\n  let artifact=runtime.artifacts?.find((candidate)=>candidate.artifactKind==="actor"&&candidate.actor?.combatantId===pack.summonId);\n  assert.ok(artifact?.actor?.actionDefinitionIds.includes(pack.actorActionId));\n  assert.equal(actorState(adapter,snapshot,pack.summonId,pack.resourceId).resource,1);\n\n  await adapter.resolveAction(pack.actorActionId,[]);\n  snapshot=await adapter.getSnapshot();\n  runtime=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;\n  artifact=runtime.artifacts?.find((candidate)=>candidate.artifactKind==="actor"&&candidate.actor?.combatantId===pack.summonId);\n  assert.ok(artifact?.actor?.actionDefinitionIds.includes(pack.actorActionId),"consuming the resource must not remove the action identity");\n  assert.equal(actorState(adapter,snapshot,pack.summonId,pack.resourceId).resource,0);\n\n  await adapter.resolveAction(pack.actorActionId,[]);\n  snapshot=await adapter.getSnapshot();\n  assert.equal(actorState(adapter,snapshot,pack.summonId,pack.resourceId).resource,0,"unavailable Recharge action must not spend below zero");\n\n  await adapter.endTurn();\n  snapshot=await advanceUntilActor(adapter,pack.summonId);\n  runtime=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;\n  artifact=runtime.artifacts?.find((candidate)=>candidate.artifactKind==="actor"&&candidate.actor?.combatantId===pack.summonId);\n  assert.ok(artifact?.actor?.actionDefinitionIds.includes(pack.actorActionId));\n  assert.equal(actorState(adapter,snapshot,pack.summonId,pack.resourceId).resource,1);\n});\n\n'''
              text=text.replace(marker,test+marker,1)
          p.write_text(text)
          PY
      - run: npm run generate:content
      - name: Verify Zone stay and Recharge production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if ! npx tsx --test tests/ui/connectedSpatialZoneStayProduction.test.ts tests/ui/connectedActorTurnRuleProduction.test.ts 2>&1 | tee /tmp/focused.log; then
            { echo '# C9 T/AB finalize failed'; echo '```'; tail -120 /tmp/focused.log; echo '```'; } > /tmp/relay.md
            gh issue edit 180 --repo Kaetaeru/SimpleVTT --body-file /tmp/relay.md
            exit 1
          fi
          if ! npx tsc --noEmit 2>&1 | tee /tmp/tsc.log; then
            { echo '# C9 T/AB TypeScript failed'; echo '```'; tail -120 /tmp/tsc.log; echo '```'; } > /tmp/relay.md
            gh issue edit 180 --repo Kaetaeru/SimpleVTT --body-file /tmp/relay.md
            exit 1
          fi
      - name: Reconcile T and AB ledger
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const t=ledger.rows.find(r=>r.family==='T'&&r.id==='zones');
          const ab=ledger.rows.find(r=>r.family==='AB'&&r.id==='recharge-cooldown');
          if(!t||!ab) throw new Error('T or AB ledger row missing');
          t.disposition='IMPLEMENTED';
          t.currentState='Installed arbitrary Zone artifacts cover spawn/opaque placement, manual and authoritative spatial-provider membership, enter/leave/stay/start/end-turn events, canonical frequency, elapsed cleanup, damage/effect trigger lowering, atomic Undo, Host/Client replay, duplicate replay, and fresh reconnect. Provider stay is an explicit authoritative fact and Core does not infer geometry.';
          t.productionEvidence=[...new Set([...(t.productionEvidence??[]),'connectedSpatialZoneStayProduction.test.ts authoritative provider stay through canonical connected events'])];
          t.connectedEvidenceIfRelevant=[...new Set([...(t.connectedEvidenceIfRelevant??[]),'connectedSpatialZoneStayProduction.test.ts Host/Client stay convergence, duplicate replay, reconnect, and Undo'])];
          t.persistenceEvidenceIfRelevant=[...new Set([...(t.persistenceEvidenceIfRelevant??[]),'connectedSpatialZoneStayProduction.test.ts fresh reconnect reconstruction of stay event history'])];
          t.remainingNamedSeams=(t.remainingNamedSeams??[]).filter(s=>!s.includes('zone.stay'));

          ab.disposition='IMPLEMENTED';
          ab.currentState='Schema-backed portable Recharge lowers to the existing recharge-resource Resolver operation, consumes and gates the actor resource separately from the action identity, receives one authoritative die face at turn start, recovers through the existing turn transaction, and converges through connected replay/reconnect/Undo without a monster-specific engine.';
          ab.implementationEvidence=[
            'recharge-resource ResolutionOperation and commonPlayC6Runtime.test.ts authoritative die/range/resource semantics',
            'commonPlayOperationRuntime.ts resource.recharge validation/lowering with authoritative rechargeDiceFaces',
            'commonPlayActorTurnRuleComposition.ts portable turn-start rule compilation',
            'phase09EffectAwareTurnAdapter.ts authoritative die input through existing turn lifecycle'
          ];
          ab.productionEvidence=[
            'connectedActorTurnRuleProduction.test.ts Recharge action availability/consumption and next-turn recovery',
            'Recharge workflow 33280246505 focused connected actor-turn production 4/4 plus TypeScript'
          ];
          ab.identityInvarianceEvidence=[
            'connectedActorTurnRuleProduction.test.ts actor-owned turn-start Recharge is invariant under every external identity rename'
          ];
          ab.connectedEvidenceIfRelevant=[
            'connectedActorTurnRuleProduction.test.ts Recharge Host/Client convergence, duplicate replay, reconnect, and event-native Undo',
            'retained actor-artifact action execution evidence routes arbitrary installed actor actions through Host-authoritative connected events'
          ];
          ab.persistenceEvidenceIfRelevant=[
            'installed RuleModule activation preserves actor action/resource/turn-rule definitions',
            'connectedActorTurnRuleProduction.test.ts fresh replica reconstructs Recharge resource and frequency state from ordered authoritative event history'
          ];
          ab.remainingNamedSeams=['named monster action-catalog presentation migration debt; unknown portable actor Recharge uses the generic actor artifact action/resource path and does not select or fall through to it'];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
          node scripts/check-v1-mechanism-coverage.mjs | tee /tmp/coverage.log
          git diff --check
      - name: Commit verified T and AB coverage
        run: |
          rm .github/workflows/rerun-c9-t-ab-finalize.yml
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add -A
          git commit -m "test(c9): close Zone stay and Recharge coverage"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Update STATE checkpoint
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          const next=ledger.rows.find(r=>r.family==='AC')??ledger.rows.find(r=>r.disposition==='INCOMPLETE');
          const path='.chatgpt-rerun/STATE.md';
          let text=fs.readFileSync(path,'utf8');
          const section=`## Latest C9 reconciliation — Zone stay + Recharge\n\n- Family T is now ledger \`IMPLEMENTED\`: authoritative provider \`zone.stay\` uses the existing Zone transaction and is proven for Host/Client convergence, duplicate replay, reconnect, and Undo. Core still does not infer geometry.\n- Family AB is now ledger \`IMPLEMENTED\`: portable \`resource.recharge\` lowers to existing \`recharge-resource\`, uses authoritative turn-start die input, keeps action identity separate from consumable resource availability, and is proven for consumption/recovery, rename invariance, connected replay/reconnect, and Undo.\n- Exact focused validation for this slice: \`connectedSpatialZoneStayProduction.test.ts\` + \`connectedActorTurnRuleProduction.test.ts\`, plus \`tsc --noEmit\`.\n- Coverage after reconciliation: \`IMPLEMENTED=${counts.IMPLEMENTED??0}\`, \`INCOMPLETE=${counts.INCOMPLETE??0}\`, \`PROVEN_UNNEEDED=${counts.PROVEN_UNNEEDED??0}\`; \`gateNBlockingNamedFallbacks\` remains empty.\n\n`;
          const marker='## Next Exact Action';
          const idx=text.indexOf(marker);
          if(idx<0) throw new Error('STATE Next Exact Action marker missing');
          text=text.slice(0,idx)+section+`${marker}\n\nAudit Family ${next.family} (\`${next.id}\`) from the current ledger and repository evidence. Reuse its existing generic kernel first, connect only the smallest missing production/connected/persistence seams, and do not reopen Families S/T/U/AB or previously audited authority-blocked families without affected-surface evidence.\n`;
          fs.writeFileSync(path,text);
          NODE
          git add .chatgpt-rerun/STATE.md
          git commit -m "docs(rerun): checkpoint Zone stay and Recharge coverage"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Update control last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          const next=ledger.rows.find(r=>r.family==='AC')??ledger.rows.find(r=>r.disposition==='INCOMPLETE');
          const path='.chatgpt-rerun/control.json';
          const control=JSON.parse(fs.readFileSync(path,'utf8'));
          control.status='continue';
          control.reason=`C9 remains active at IMPLEMENTED=${counts.IMPLEMENTED??0}, INCOMPLETE=${counts.INCOMPLETE??0}, PROVEN_UNNEEDED=${counts.PROVEN_UNNEEDED??0} with gateNBlockingNamedFallbacks empty. Families T and AB are now IMPLEMENTED after authoritative Zone stay and portable Recharge production acceptance. Next audit Family ${next.family} (${next.id}) without repeating validated S/T/U/AB work.`;
          control.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(control,null,2)+'\n');
          NODE
          git add .chatgpt-rerun/control.json
          git commit -m "docs(rerun): continue from Family AC"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
          FINAL_SHA=$(git rev-parse HEAD)
          node <<'NODE' > /tmp/final.md
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'));
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          const next=ledger.rows.find(r=>r.family==='AC')??ledger.rows.find(r=>r.disposition==='INCOMPLETE');
          console.log('# C9 T/AB finalize success');
          console.log('Product SHA:',process.env.PRODUCT_SHA??'see branch ancestry');
          console.log('Final SHA:',process.env.FINAL_SHA??'set by shell below');
          console.log('Coverage:',JSON.stringify(counts));
          console.log('gateNBlockingNamedFallbacks:',JSON.stringify(ledger.gateNBlockingNamedFallbacks??[]));
          console.log(`Next: ${next.family} ${next.id}`);
          NODE
          sed -i "s/Final SHA: set by shell below/Final SHA: $FINAL_SHA/" /tmp/final.md
          gh issue edit 180 --repo Kaetaeru/SimpleVTT --body-file /tmp/final.md
      - name: Clean helper after failure
        if: failure()
        run: |
          git reset --hard
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation || true
          rm -f .github/workflows/rerun-c9-t-ab-finalize.yml
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(c9): remove failed T/AB finalize helper"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
