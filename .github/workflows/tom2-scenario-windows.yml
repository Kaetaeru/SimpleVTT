name: Fallen Bell Tower Scenario Windows Verification

on:
  pull_request:
    branches:
      - work/v1-composite
    paths:
      - "scripts/run-tauri-e2e.ps1"
      - "scripts/run-tauri-e2e-tom2-scenario.mjs"
      - "src/app/connected*.ts"
      - "src/app/srdMonster*.ts"
      - "src/app/productionPlayRuntimeAdapter.ts"
      - "src/app/spellSummonRuntimeAdapter.ts"
      - "src-tauri/**"
      - "docs/design/scenarios/fallen-bell-tower.md"
      - ".github/workflows/tom2-scenario-windows.yml"
  push:
    branches:
      - work/v1-composite
    paths:
      - "scripts/run-tauri-e2e.ps1"
      - "scripts/run-tauri-e2e-tom2-scenario.mjs"
      - "src/app/connected*.ts"
      - "src/app/srdMonster*.ts"
      - "src/app/productionPlayRuntimeAdapter.ts"
      - "src/app/spellSummonRuntimeAdapter.ts"
      - "src-tauri/**"
      - ".github/workflows/tom2-scenario-windows.yml"
  workflow_dispatch:

env:
  V1_VERIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  windows-tom2-scenario:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - name: Play 무너진 종탑 (theater of mind, every play kind) on Windows H+P1+P2
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/run-tauri-e2e.ps1 -Root . -TOM2
      - name: Upload TOM Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOM2-WIN-${{ env.V1_VERIFICATION_SHA }}
          path: .live-dev/tauri-e2e/**/artifacts/**
          if-no-files-found: error
          retention-days: 14
