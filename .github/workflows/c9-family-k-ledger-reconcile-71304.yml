name: C9 Family K Ledger Reconcile 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-k-ledger-reconcile-71304.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile verified Family K evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((candidate)=>candidate.family==='K');
          if(!row) throw new Error('Family K ledger row missing');
          if(row.disposition==='IMPLEMENTED') {
            console.log('Family K already reconciled; leaving current evidence untouched');
            process.exit(0);
          }
          if(row.disposition!=='INCOMPLETE') throw new Error(`unexpected Family K disposition: ${row.disposition}`);
          if(!row.remainingNamedSeams.includes('progressionPhase08WeaponMasteryAdapter')) throw new Error('Family K changed concurrently; refusing stale reconciliation');

          row.currentState='All eight 2024 Weapon Mastery shapes are composition-tested from generic Resolver operations. Unknown installed RuleModules prove Graze-like outcome damage and Slow-like source-bound property state through production, complete external identity rename, local runtime restart, connected replay, duplicate replay, reconnect, and Undo. progressionPhase08WeaponMasteryAdapter persists selected weapon IDs and sources for progression but does not dispatch mastery execution by mastery name or content ID.';
          row.disposition='IMPLEMENTED';
          row.implementationEvidence=[
            'commonPlayWeaponMasteryComposition.test.ts composes Cleave, Graze, Nick, Push, Sap, Slow, Topple, and Vex from generic ResolutionOperation primitives, including once-per-turn Cleave, Nick extra-attack economy, forced Push movement, save-gated Topple, and consumed Sap/Vex effects',
            'commonPlayOperationRuntime.ts exposes identity-agnostic Common Play attack outcome damage and property modification primitives used by installed external mastery-shaped definitions',
            'progressionPhase08WeaponMasteryAdapter.ts persists generic selected weaponMasteryIds and weaponMasterySources only; it contains no mastery-name/content-ID execution dispatch'
          ];
          row.productionEvidence=[
            'commonPlayWeaponMasteryComposition.test.ts verifies all eight 2024 mastery semantic shapes through the shared Resolver operation model without mastery-name dispatch',
            'c9FamilyKGrazeConditionalDamageProduction.test.ts unknown installed Common Play applies a Graze-like miss-only damage rider, skips it on hit, and reverses through Undo',
            'c9FamilyKOutcomeDamageProduction.test.ts proves the Graze-like rider emits authoritative damage/HP state changes and reverses through event-native Undo',
            'c9FamilyKConnectedMasteryShapes.test.ts proves one unknown installed RuleModule composes distinct Graze-like immediate damage and Slow-like durable movement-property mastery shapes through production runtime',
            'C9 Family K Portable Mastery run 33316242377 passed full eight-mastery composition, all retained Family K production proofs, connected/restart acceptance, progression persistence, and TypeScript production build at bf9bb51644e09cd6f6214aa9e8d4a9e214c3d72f'
          ];
          row.identityInvarianceEvidence=[
            'c9FamilyKGrazeConditionalDamageProduction.test.ts repeats the Graze-like miss rider after complete external module/content/mechanic identity rename',
            'c9FamilyKOutcomeDamageProduction.test.ts preserves authoritative outcome-conditioned damage after complete external identity rename',
            'c9FamilyKConnectedMasteryShapes.test.ts repeats both Graze-like and Slow-like mastery shapes after completely unrelated module/content/mechanic identity rename'
          ];
          row.connectedEvidenceIfRelevant=[
            'c9FamilyKConnectedMasteryShapes.test.ts Host-authoritative Graze-like damage and Slow-like state converge through client replay, duplicate suppression, reconnect replay, and Undo without mastery-name routing'
          ];
          row.persistenceEvidenceIfRelevant=[
            'c9FamilyKConnectedMasteryShapes.test.ts Slow-like source-bound mastery state survives a fresh adapter through MemoryTurnRuntimeStateStore and reconnect replay after Undo does not resurrect it',
            'progressionPhase08WeaponMasteryRuntime.test.ts commits selected weaponMasteryIds and weaponMasterySources into the authoritative Character progression revision'
          ];
          row.remainingNamedSeams=[];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n','utf8');
          NODE
      - name: Validate ledger structure and Family K final evidence
        shell: bash
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node <<'NODE'
          const ledger=require('./docs/rules/v1-mechanism-coverage-ledger.json');
          const row=ledger.rows.find((candidate)=>candidate.family==='K');
          if(row?.disposition!=='IMPLEMENTED') throw new Error('Family K is not IMPLEMENTED');
          for(const field of ['implementationEvidence','productionEvidence','identityInvarianceEvidence','connectedEvidenceIfRelevant','persistenceEvidenceIfRelevant']) {
            if(!Array.isArray(row[field])||row[field].length===0) throw new Error(`Family K ${field} is empty`);
          }
          if(row.remainingNamedSeams.length!==0) throw new Error('Family K still has named seams');
          NODE
      - name: Commit reconciliation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/c9-family-k-ledger-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          if git diff --cached --quiet; then
            echo 'No reconciliation changes to commit'
            exit 0
          fi
          git commit -m 'docs(c9): reconcile Family K coverage'
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
