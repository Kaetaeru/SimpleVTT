name: W6-05 AUTO Verification

on:
  push:
    paths:
      - "src/app/campaignRationConversion.ts"
      - "src/app/campaignRationConversionRuntimeAdapter.ts"
      - "src/app/campaignPartyStashCapabilityRuntimeAdapter.ts"
      - "src/app/connectedCampaignSystemsRuntimeAdapter.ts"
      - "src/CampaignRationConversionPanel.tsx"
      - "src/CampaignScreen.tsx"
      - "tests/ui/campaignRationConversion.test.ts"
      - "tests/ui/campaignRationConversionRuntime.test.ts"
      - "tests/ui/campaignRationConversionLegacyStash.test.ts"
      - "tests/ui/campaignRationConversionProductionStructure.test.ts"
      - ".github/workflows/w6-05-auto.yml"
  pull_request:
    paths:
      - "src/app/campaignRationConversion.ts"
      - "src/app/campaignRationConversionRuntimeAdapter.ts"
      - "src/app/campaignPartyStashCapabilityRuntimeAdapter.ts"
      - "src/app/connectedCampaignSystemsRuntimeAdapter.ts"
      - "src/CampaignRationConversionPanel.tsx"
      - "src/CampaignScreen.tsx"
      - "tests/ui/campaignRationConversion.test.ts"
      - "tests/ui/campaignRationConversionRuntime.test.ts"
      - "tests/ui/campaignRationConversionLegacyStash.test.ts"
      - "tests/ui/campaignRationConversionProductionStructure.test.ts"
      - ".github/workflows/w6-05-auto.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate:content
      - name: Focused W6-05 tests
        run: |
          npx tsx --test tests/ui/campaignRationConversion.test.ts tests/ui/campaignRationConversionRuntime.test.ts tests/ui/campaignRationConversionLegacyStash.test.ts tests/ui/campaignRationConversionProductionStructure.test.ts > w6-05-auto.log
          cat w6-05-auto.log
      - name: Production build
        run: npm run build
      - name: Upload W6-05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W6-05-AUTO-${{ github.sha }}
          path: w6-05-auto.log
