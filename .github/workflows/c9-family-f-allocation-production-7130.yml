name: C9 Family F Allocation Production

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-f-allocation-production-7130.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile latest branch
        shell: bash
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply portable allocation production bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_once(runtime,
              'export interface CommonPlayConsentInteraction {',
              '''export interface CommonPlayAllocationDefinition {\n  units:LiteralNumberExpression;\n  targets:CommonPlayTargetingSelector;\n  minimumPerTarget?:number;\n  maximumPerTarget?:number;\n  totalMustMatch:boolean;\n}\n\nexport interface CommonPlayConsentInteraction {''')
          replace_once(runtime,
              '''    interaction?:CommonPlayConsentInteraction;\n    targeting?:CommonPlayTargetingSelector;\n    test?:CommonPlayD20TestDefinition;''',
              '''    interaction?:CommonPlayConsentInteraction;\n    targeting?:CommonPlayTargetingSelector;\n    allocation?:CommonPlayAllocationDefinition;\n    test?:CommonPlayD20TestDefinition;''')
          replace_once(runtime,
              'const ENTRY_POINT_KEYS=new Set(["id","invocation","interaction","targeting","test","operations"]);',
              'const ENTRY_POINT_KEYS=new Set(["id","invocation","interaction","targeting","allocation","test","operations"]);')
          replace_once(runtime,
              'const TARGETING_WHERE_KEYS=new Set(["op","ref","value"]);',
              'const TARGETING_WHERE_KEYS=new Set(["op","ref","value"]);\nconst ALLOCATION_KEYS=new Set(["units","targets","minimumPerTarget","maximumPerTarget","totalMustMatch"]);')
          replace_once(runtime,
              'function parsePayment(value:unknown,label:string):CommonPlayPayment {',
              '''function parseAllocation(value:unknown,label:string):CommonPlayAllocationDefinition {\n  const allocation=object(value,label);\n  supportedKeys(allocation,ALLOCATION_KEYS,label);\n  const minimum=allocation.minimumPerTarget;\n  const maximum=allocation.maximumPerTarget;\n  if(minimum!==undefined&&(!Number.isInteger(minimum)||Number(minimum)<0)) throw new DomainEvaluationError(`${label}.minimumPerTarget must be a non-negative integer`);\n  if(maximum!==undefined&&(!Number.isInteger(maximum)||Number(maximum)<1)) throw new DomainEvaluationError(`${label}.maximumPerTarget must be a positive integer`);\n  if(minimum!==undefined&&maximum!==undefined&&Number(maximum)<Math.max(1,Number(minimum))) throw new DomainEvaluationError(`${label} per-target bounds are invalid`);\n  if(typeof allocation.totalMustMatch!=="boolean") throw new DomainEvaluationError(`${label}.totalMustMatch must be boolean`);\n  return {\n    units:nonNegativeLiteralExpression(allocation.units,`${label}.units`),\n    targets:parseTargetingSelector(allocation.targets,`${label}.targets`),\n    ...(minimum===undefined?{}:{minimumPerTarget:Number(minimum)}),\n    ...(maximum===undefined?{}:{maximumPerTarget:Number(maximum)}),\n    totalMustMatch:allocation.totalMustMatch,\n  };\n}\n\nfunction parsePayment(value:unknown,label:string):CommonPlayPayment {''')
          replace_once(runtime,
              '''      ...(entry.interaction===undefined?{}:{interaction:parseConsentInteraction(entry.interaction,`${label}.entryPoints[${index}].interaction`)}),\n      ...(entry.targeting===undefined?{}:{targeting:parseTargetingSelector(entry.targeting,`${label}.entryPoints[${index}].targeting`)}),\n      ...(entry.test===undefined?{}:{test:parseD20Test(entry.test,`${label}.entryPoints[${index}].test`)}),''',
              '''      ...(entry.interaction===undefined?{}:{interaction:parseConsentInteraction(entry.interaction,`${label}.entryPoints[${index}].interaction`)}),\n      ...(entry.targeting===undefined?{}:{targeting:parseTargetingSelector(entry.targeting,`${label}.entryPoints[${index}].targeting`)}),\n      ...(entry.allocation===undefined?{}:{allocation:parseAllocation(entry.allocation,`${label}.entryPoints[${index}].allocation`)}),\n      ...(entry.test===undefined?{}:{test:parseD20Test(entry.test,`${label}.entryPoints[${index}].test`)}),''')

          adapter='src/app/installedCommonPlayRuntimeAdapter.ts'
          replace_once(adapter,
              'import { resolvePendingResolution } from "../domain/resolution";',
              'import { resolvePendingResolution } from "../domain/resolution";\nimport { allocationEntriesFromTargetSequence, resolveCommonPlayAllocation } from "../domain/commonPlayAllocationRuntime";')
          replace_once(adapter,
              '''  const targeting=(entryPoint as {targeting?:{min?:number;max?:number}}).targeting;''',
              '''  const portableEntry=entryPoint as {targeting?:{min?:number;max?:number};allocation?:{targets:{min?:number;max?:number}}};\n  const targeting=portableEntry.targeting;\n  const allocation=portableEntry.allocation;\n  const targetSelector=targeting??allocation?.targets;''')
          replace_once(adapter,
              '''  const targeted=action.lowered.kind==="save-damage"||targeting!==undefined||operations.some((operation)=>(operation.kind==="damage.apply"||operation.kind==="healing.apply")&&operation.target==="target");\n  const multi=action.lowered.kind==="save-damage"||Boolean(targeting&&(targeting.max??1)>1);''',
              '''  const targeted=action.lowered.kind==="save-damage"||targetSelector!==undefined||operations.some((operation)=>(operation.kind==="damage.apply"||operation.kind==="healing.apply")&&operation.target==="target");\n  const multi=action.lowered.kind==="save-damage"||Boolean(targetSelector&&(targetSelector.max??1)>1);''')
          replace_once(adapter,
              '''    ...(multi?{maxTargets:targeting?.max??eligibleTargetIds.length}:{}),''',
              '''    ...(multi?{maxTargets:targetSelector?.max??eligibleTargetIds.length}:{}),''')
          replace_once(adapter,
              '''  const portableEntry=entryPoint as {targeting?:{min?:number;max?:number;where?:{op:string;ref:string;value:string}};operations:Array<{kind:string;target?:string}>};\n  const hasTargeting=portableEntry.targeting!==undefined;\n  if(!hasTargeting&&targetIds.length!==1) return undefined;''',
              '''  const portableEntry=entryPoint as {\n    targeting?:{min?:number;max?:number;where?:{op:string;ref:string;value:string}};\n    allocation?:{targets:{min?:number;max?:number;where?:{op:string;ref:string;value:string}}};\n    operations:Array<{kind:string;target?:string}>;\n  };\n  const hasTargeting=portableEntry.targeting!==undefined;\n  const hasAllocation=portableEntry.allocation!==undefined;\n  if(!hasTargeting&&!hasAllocation&&targetIds.length!==1) return undefined;\n  if(hasAllocation&&!targetIds.length) return undefined;''')
          replace_once(adapter,
              '''  const selectedTargets=targetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id));\n  if(selectedTargets.some((target,index)=>!target||!state!.combatants[targetIds[index]])) return undefined;\n  const needsSelectedTarget=''',
              '''  const selectedTargets=targetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id));\n  if(selectedTargets.some((target,index)=>!target||!state!.combatants[targetIds[index]])) return undefined;\n  const uniqueSelectedTargets=[...new Map(selectedTargets.map((target)=>[target!.id,target!] as const)).values()];\n  const needsSelectedTarget=''')
          replace_once(adapter,
              '''  if(hasTargeting) {\n    const targeting=portableEntry.targeting!;\n    if(targetIds.length<(targeting.min??1)||targetIds.length>(targeting.max??targetIds.length)) return undefined;\n    if(targeting.where?.op==="relation-matches"&&targeting.where.ref==="relation"&&selectedTargets.some((target)=>commonPlayTargetFact(actorEntity,target!).relation!==targeting.where!.value)) return undefined;\n    if(projectedAction&&(!projectedAction.available||targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;\n  } else if(needsSelectedTarget) {''',
              '''  if(hasTargeting) {\n    const targeting=portableEntry.targeting!;\n    if(targetIds.length<(targeting.min??1)||targetIds.length>(targeting.max??targetIds.length)) return undefined;\n    if(targeting.where?.op==="relation-matches"&&targeting.where.ref==="relation"&&selectedTargets.some((target)=>commonPlayTargetFact(actorEntity,target!).relation!==targeting.where!.value)) return undefined;\n    if(projectedAction&&(!projectedAction.available||targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;\n  } else if(hasAllocation) {\n    const selector=portableEntry.allocation!.targets;\n    if(uniqueSelectedTargets.length<(selector.min??0)||uniqueSelectedTargets.length>(selector.max??uniqueSelectedTargets.length)) return undefined;\n    if(selector.where?.op==="relation-matches"&&selector.where.ref==="relation"&&uniqueSelectedTargets.some((target)=>commonPlayTargetFact(actorEntity,target).relation!==selector.where!.value)) return undefined;\n    if(projectedAction&&(!projectedAction.available||uniqueSelectedTargets.some((target)=>!projectedAction.eligibleTargetIds.includes(target.id)))) return undefined;\n  } else if(needsSelectedTarget) {''')
          replace_once(adapter,
              '''  let committed;\n  let operationEntryPoint:CommonPlayOperationDefinition["entryPoints"][number]|undefined;\n  if(lowered.kind==="operations") {\n    const entryPoint=lowered.definition.entryPoints.find((candidate)=>candidate.id===action.entryPointId)!;\n    operationEntryPoint=entryPoint;\n    const pending=''',
              '''  let committed;\n  let operationEntryPoint:CommonPlayOperationDefinition["entryPoints"][number]|undefined;\n  let allocationResult:Extract<ReturnType<typeof resolveCommonPlayAllocation>,{status:"resolved"}>|undefined;\n  if(lowered.kind==="operations") {\n    const entryPoint=lowered.definition.entryPoints.find((candidate)=>candidate.id===action.entryPointId)!;\n    operationEntryPoint=entryPoint;\n    if(entryPoint.allocation) {\n      const candidateTargetIds=[...new Set(selectedTargets.map((target)=>target.id))];\n      const allocation=resolveCommonPlayAllocation({\n        id:`${resolutionId}:allocation`,\n        idempotencyKey:`${actionId}:${state.revision}:${entryPoint.id}:allocation`,\n        expectedRevision:state.revision,\n        authority:internal.sessionMode==="initiative"?"actor-owner":"dm",\n        responderId:actor.id,\n        plan:{\n          units:entryPoint.allocation.units,\n          ...(entryPoint.allocation.minimumPerTarget===undefined?{}:{minimumPerTarget:entryPoint.allocation.minimumPerTarget}),\n          ...(entryPoint.allocation.maximumPerTarget===undefined?{}:{maximumPerTarget:entryPoint.allocation.maximumPerTarget}),\n          totalMustMatch:entryPoint.allocation.totalMustMatch,\n        },\n        candidateTargetIds,\n        allocations:allocationEntriesFromTargetSequence(selectedTargets.map((target)=>target.id)),\n      },state.revision);\n      if(allocation.status!=="resolved") return {status:"rejected" as const,error:allocation.reason,snapshot:await internal.getSnapshot()};\n      allocationResult=allocation;\n    }\n    const pending=''')
          replace_once(adapter,
              '''  const presentationTargetIds=affectedTargetIds.length?affectedTargetIds:operationEntryPoint?.targeting?selectedTargets.map((target)=>target.id):lowered.kind==="save-damage"?selectedTargets.map((target)=>target.id):[selectedTargetId];\n  const presentationTargets=presentationTargetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id)!);\n  const outcome=hp?.outcome??(roll?roll.outcome:"규칙 효과 적용");''',
              '''  const allocationTargetIds=allocationResult?.allocations.map((entry)=>entry.targetId)??[];\n  const presentationTargetIds=affectedTargetIds.length?affectedTargetIds:allocationTargetIds.length?allocationTargetIds:operationEntryPoint?.targeting?selectedTargets.map((target)=>target.id):lowered.kind==="save-damage"?selectedTargets.map((target)=>target.id):[selectedTargetId];\n  const presentationTargets=presentationTargetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id)!);\n  const allocationOutcome=allocationResult?`분배 ${allocationResult.total} · ${allocationResult.allocations.map((entry)=>`${entry.targetId} ${entry.units}`).join(", ")}`:undefined;\n  const outcome=hp?.outcome??(roll?roll.outcome:allocationOutcome??"규칙 효과 적용");''')
          replace_once(adapter,
              '''    compact:hp?.outcome??(roll?`d20 ${roll.natural} ${roll.modifier>=0?"+":"-"} ${Math.abs(roll.modifier)} = ${roll.total} vs ${roll.target} · ${roll.outcome}`:"Common Play 규칙 적용"),\n    detail:[`${lowered.definition.id} · ${action.entryPointId}`,...(roll?[`${roll.family} · ${roll.rollState} · ${roll.outcome}`]:[]),...committed.events.map((event)=>event.summary)],''',
              '''    compact:hp?.outcome??(roll?`d20 ${roll.natural} ${roll.modifier>=0?"+":"-"} ${Math.abs(roll.modifier)} = ${roll.total} vs ${roll.target} · ${roll.outcome}`:allocationOutcome??"Common Play 규칙 적용"),\n    detail:[`${lowered.definition.id} · ${action.entryPointId}`,...(allocationOutcome?[allocationOutcome]:[]),...(roll?[`${roll.family} · ${roll.rollState} · ${roll.outcome}`]:[]),...committed.events.map((event)=>event.summary)],''')

          test=Path('tests/ui/installedCommonPlayAllocationProductionRuntime.test.ts')
          if test.exists(): raise SystemExit(f'{test} already exists')
          test.write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import "../../src/app/offlineRuntimeAdapters";
import "../../src/app/connectedSessionRuntimeAdapter";
import "../../src/app/connectedActionRoutingAdapter";
import "../../src/app/installedContentRuntimeAdapter";
import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
import { MockAdapter } from "../../src/app/mockAdapter";

const MODULE_ID="homebrew.family-f-allocation-probe";
const CONTENT_ID="option.external-family-f-allocation-probe";
const MECHANIC_ID="external.unknown.family-f-allocation-probe";
const ENTRY_POINT_ID="distribute";

function payload() {
  return JSON.stringify({
    schemaVersion:"0.1-draft",moduleId:MODULE_ID,moduleVersion:"1",
    rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
    source:{document:"External Allocation Probe",version:"1",license:"CC0",srdDerived:false},
    dependencies:[],conflicts:[],capabilities:[],content:[{
      id:CONTENT_ID,category:"option",
      presentation:{defaultLocale:"en",originalName:"External Allocation Probe",locales:{en:{name:"External Allocation Probe",description:"Portable fixed-pool allocation probe"}}},
      mechanics:[{kind:"common-play",config:{
        schemaVersion:"0.2-draft",id:MECHANIC_ID,entryPoints:[{
          id:ENTRY_POINT_ID,invocation:"manual",
          allocation:{units:{value:3},targets:{from:"targets",min:1,max:3},minimumPerTarget:1,maximumPerTarget:3,totalMustMatch:true},
          operations:[{kind:"economy.modify",bucket:"action.extra.non-magic",amount:{value:1}}],
        }],
      }}],
    }],
  });
}

function actionId() {
  return installedCommonPlayActionId({
    catalogId:catalogQualifiedId(CONTENT_ID,MODULE_ID,"1"),mechanicId:MECHANIC_ID,entryPointId:ENTRY_POINT_ID,
  });
}

async function install(adapter:MockAdapter,store:MemoryInstalledContentStore) {
  setInstalledContentStoreForTests(adapter,store);
  const preview=await adapter.previewContentImport(payload());
  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
  await adapter.activateContentImport();
}

test("unknown installed Common Play validates fixed-pool allocation before downstream production commit",async()=>{
  const store=new MemoryInstalledContentStore();
  const installer=new MockAdapter();
  await install(installer,store);

  const adapter=new MockAdapter();
  setInstalledContentStoreForTests(adapter,store);
  await adapter.startInitiative();
  await adapter.setCurrentActor("char.aelar");

  await adapter.resolveAction(actionId(),["combatant.goblin-a","combatant.goblin-b"]);
  let snapshot=await adapter.getSnapshot();
  assert.equal(snapshot.scene.economyByActor["char.aelar"]?.extraActions,undefined,"under-allocation must not partially commit downstream operations");

  await adapter.resolveAction(actionId(),["combatant.goblin-a","combatant.goblin-a","combatant.goblin-b"]);
  snapshot=await adapter.getSnapshot();
  assert.equal(snapshot.resolution?.stage,"complete");
  assert.equal(snapshot.resolution?.actionId,actionId());
  assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a","combatant.goblin-b"]);
  assert.match(snapshot.resolution?.compact??"",/분배 3/);
  assert.ok(snapshot.resolution?.detail.some((line)=>line.includes("combatant.goblin-a 2")&&line.includes("combatant.goblin-b 1")));
  assert.equal(snapshot.scene.economyByActor["char.aelar"]?.extraActions?.length,1);

  await adapter.undoLastResolution();
  snapshot=await adapter.getSnapshot();
  assert.equal(snapshot.scene.economyByActor["char.aelar"]?.extraActions,undefined);
});
''',encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify allocation kernel and production bridge
        run: >-
          npx tsx --test
          tests/domain/commonPlayAllocationRuntime.test.ts
          tests/ui/installedCommonPlayAllocationProductionRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified allocation bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-f-allocation-production-7130.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayAllocationProductionRuntime.test.ts .github/workflows
          git commit -m "feat(c9): bridge portable allocation production"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
