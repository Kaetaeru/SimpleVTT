name: C9 Family N Suppression Production 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-n-suppression-production-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify unknown and renamed portable suppression production
        run: |
          npx tsx --test tests/ui/c9FamilyNEffectDurationProduction.test.ts
          npm exec tsc -- --noEmit
          node scripts/check-legacy-execution-boundary.mjs
      - name: Record verified Family N suppression evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path="docs/rules/v1-mechanism-coverage-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(path,"utf8"));
          const family=ledger.rows.find((entry)=>entry.family==="N");
          if(!family) throw new Error("Family N missing from coverage ledger");
          family.currentState=family.currentState.replace(
            "Duration-boundary expiry execution is production-proven through the authoritative clock lifecycle with event-native Undo; suppression/pause-resume, source/dependent cleanup, and remaining named effect adapters remain incomplete.",
            "Duration-boundary expiry execution is production-proven through the authoritative clock lifecycle with event-native Undo; unknown and renamed external effect suppression, elapsed-duration pause/resume, expiry, and event-native Undo are production-proven; source/dependent cleanup and remaining named effect adapters remain incomplete."
          );
          const add=(key,value)=>{ if(!family[key].includes(value)) family[key].push(value); };
          add("implementationEvidence","commonPlayOperationRuntime.ts structurally lowers portable effect.suppress selectors to shared set-effect-suppression Resolver operations; common-play-contract.schema.json defines the same external authoring shape");
          add("productionEvidence","c9FamilyNEffectDurationProduction.test.ts proves unknown installed Common Play suppression, elapsed-duration pause/resume, expiry, and event-native Undo through the production adapter");
          add("identityInvarianceEvidence","c9FamilyNEffectDurationProduction.test.ts repeats suppression, pause/resume, expiry, and Undo under unrelated external module/content/mechanic identities");
          family.remainingNamedSeams=family.remainingNamedSeams.map((entry)=>entry==="suppression/pause-resume and source/dependent-cleanup acceptance remains incomplete"?"source/dependent-cleanup acceptance remains incomplete":entry);
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+"\n");
          NODE
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish evidence and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-n-suppression-production-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): record portable effect suppression evidence"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
