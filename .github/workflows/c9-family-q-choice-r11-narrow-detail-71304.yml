name: C9 Family Q Choice R11 Narrow Detail 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r11-narrow-detail-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified choice bridge and narrow detail payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow=subprocess.check_output([
              'git','show','e1142e01d97c1cc5433db3c0d5b08160950abe8a:.github/workflows/c9-family-q-choice-r10-typefix-71304.yml'
          ],text=True)
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(code,'q-choice-r10-patch','exec'),{'__name__':'__main__'})

          path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=path.read_text(encoding='utf-8')
          old='...(interactionResponse?.selectedIds?.length?[`선택 · ${interactionResponse.selectedIds.join(", ")}`]:[])'
          new='...(interactionResponse&&"selectedIds" in interactionResponse&&interactionResponse.selectedIds.length?[`선택 · ${interactionResponse.selectedIds.join(", ")}`]:[])'
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'choice detail narrowing anchor changed: {text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire Q choice staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts src/app/rogueCoreRuntimeAdapter.ts src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-r5-71304.yml .github/workflows/c9-family-q-choice-r6-diagnostic-71304.yml .github/workflows/c9-family-q-choice-r7-71304.yml .github/workflows/c9-family-q-choice-r8-71304.yml .github/workflows/c9-family-q-choice-r9-71304.yml .github/workflows/c9-family-q-choice-r10-typefix-71304.yml .github/workflows/c9-family-q-choice-r11-narrow-detail-71304.yml .github/workflows/c9-family-q-choice-diagnostic-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
