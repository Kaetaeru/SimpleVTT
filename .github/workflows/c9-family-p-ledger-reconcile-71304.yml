name: C9 Family P Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Reconcile verified Family P evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          row=next(entry for entry in data["rows"] if entry["family"]=="P")
          assert row["disposition"]=="INCOMPLETE"

          row["currentState"]=(
            "Installed damage.taken|damage.dealt effect rules, actor-owned turn-start/end resource rules, Zone enter/leave/stay/start/end-turn rules, recurring once-per-turn/round frequency, canonical interactive interceptor timing points, authoritative Common Play attack.hit|attack.miss|save.success|save.failure outcomes, rest/recharge semantic events, state.applied dispatch, and effect.expired lifecycle dispatch now have generic production evidence. Named post-roll and feature-trigger adapters remain migration debt outside the portable semantic trigger path."
          )

          additions={
            "implementationEvidence":[
              "commonPlaySemanticEventRuntime.ts composes state.applied and effect.expired automatic rules into the same pending Resolver transaction",
              "installedCommonPlayRuntimeAdapter.ts routes installed effect activation through the shared semantic-event trigger dispatcher before authoritative commit",
            ],
            "productionEvidence":[
              "c9FamilyPStateAppliedTriggerProduction.test.ts proves an unknown installed state.applied listener fires atomically from effect activation, supports Undo, and remains rename invariant; workflow run 33312760234 passed",
              "commonPlaySemanticEventRuntime.test.ts effect.expired lifecycle regression proves expiry-triggered operations execute in the authoritative lifecycle resolution; workflow run 33312731941 passed",
            ],
            "identityInvarianceEvidence":[
              "c9FamilyPStateAppliedTriggerProduction.test.ts repeats the installed listener/marker scenario under renamed unknown module/content/mechanic identities",
              "commonPlaySemanticEventRuntime.test.ts repeats effect.expired dispatch under renamed external definition identity",
            ],
          }
          for key,values in additions.items():
            for value in values:
              if value not in row[key]: row[key].append(value)

          row["remainingNamedSeams"]=[
            seam for seam in row.get("remainingNamedSeams",[])
            if seam!="remaining event-family dispatcher composition"
          ]
          assert "named post-roll and feature trigger adapters" in row["remainingNamedSeams"]
          assert "remaining event-family dispatcher composition" not in row["remainingNamedSeams"]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Verify coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish reconciliation and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-p-ledger-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile Family P semantic event coverage"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
