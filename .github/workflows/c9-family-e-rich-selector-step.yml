    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-e-rich-selector-step.yml]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Family E rich selector production wiring
