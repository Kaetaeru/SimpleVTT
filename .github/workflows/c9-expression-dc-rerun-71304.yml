name: C9 Portable Expression DC Rerun 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-expression-dc-rerun-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-expression-dc-rerun-71304
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Implement portable expression DC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          text=path.read_text(encoding='utf-8')

          old='  dc:LiteralNumberExpression;'
          new='  dc:CommonPlayExpression;'
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'expected d20 type anchor once, got {text.count(old)}')
              text=text.replace(old,new,1)

          old='dc:literalExpression(definition.dc,`${label}.dc`)'
          new='dc:numericExpression(definition.dc,`${label}.dc`)'
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'expected d20 parser anchor once, got {text.count(old)}')
              text=text.replace(old,new,1)

          old=(
              '    const conditionContext={\n'
              '      ...(conditionAbility?{ability:conditionAbility}:{}),\n'
              '      ...(selectedTargetFacts?.distanceFeet===undefined?{}:{distanceToTargetFeet:selectedTargetFacts.distanceFeet}),\n'
              '    };\n'
              '    operations.push({\n'
          )
          new=(
              '    const conditionContext={\n'
              '      ...(conditionAbility?{ability:conditionAbility}:{}),\n'
              '      ...(selectedTargetFacts?.distanceFeet===undefined?{}:{distanceToTargetFeet:selectedTargetFacts.distanceFeet}),\n'
              '    };\n'
              '    const d20Target=evaluateExpression(entryPoint.test.dc as ExpressionNode,(property)=>{\n'
              '      const value=input.movementProperties?.[property];\n'
              '      if(!Number.isFinite(value)) throw new DomainEvaluationError(`Common Play d20 target property is unavailable: ${property}`);\n'
              '      return Number(value);\n'
              '    });\n'
              '    if(!Number.isFinite(d20Target)||!Number.isInteger(d20Target)) throw new DomainEvaluationError("Common Play d20 target must resolve to a finite integer");\n'
              '    operations.push({\n'
          )
          if 'const d20Target=evaluateExpression(entryPoint.test.dc as ExpressionNode' not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'expected d20 evaluation anchor once, got {text.count(old)}')
              text=text.replace(old,new,1)

          old='target:literalInteger(entryPoint.test.dc,"d20 target")+attackCoverTargetModifier,'
          new='target:d20Target+attackCoverTargetModifier,'
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'expected d20 target anchor once, got {text.count(old)}')
              text=text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
          PY

          if ! grep -q 'portable d20 DC expressions evaluate authoritative actor profile properties' tests/domain/commonPlayDefinitionRuntime.test.ts; then
            cat >> tests/domain/commonPlayDefinitionRuntime.test.ts <<'TEST'
          
          test("portable d20 DC expressions evaluate authoritative actor profile properties",()=>{
            const definition=parseCommonPlayDefinition({
              schemaVersion:"0.2-draft",id:"external.expression-dc",
              entryPoints:[{
                id:"control",invocation:"manual",
                targeting:{from:"targets",min:1,max:1},
                test:{
                  kind:"saving-throw",roller:"target",
                  property:{choose:"highest",from:["save.str.modifier","save.dex.modifier"]},
                  dc:{op:"add",args:[{value:8},{ref:"proficiency.bonus"},{ref:"ability.str.modifier"}]},
                },
                operations:[],
              }],
            });
            const lowering=lowerAllCommonPlayEntryPoints(definition)[0];
            assert.equal(lowering.kind,"operations");
            if(lowering.kind!=="operations") return;
            const input={
              resolutionId:"expression-dc",actorId:"hero",entryPointId:"control",targetId:"goblin",
              targetingTargets:[{id:"goblin",kind:"creature" as const,relation:"enemy" as const}],
              d20:{faces:[10],modifierContributions:[{source:"target-save",value:2}]},
              movementProperties:{"proficiency.bonus":3,"ability.str.modifier":4},
            };
            const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),lowering.definition,input);
            const d20=pending.operations.find((operation)=>operation.kind==="d20");
            assert.equal(d20?.kind,"d20");
            if(d20?.kind==="d20") assert.equal(d20.request.target,15);

            assert.throws(()=>compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),lowering.definition,{
              ...input,movementProperties:{"proficiency.bonus":3},
            }),/Common Play d20 target property is unavailable: ability\.str\.modifier/);
          });
          TEST
          fi
      - name: Verify portable expression DC
        run: |
          node --import tsx --test tests/domain/commonPlayDefinitionRuntime.test.ts tests/domain/commonPlayD20Runtime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm run generate:content
          npm exec tsc -- --noEmit
      - name: Publish verified implementation and retire staging workflows
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/c9-expression-dc-rerun-71304.yml \
            .github/workflows/c9-expression-dc-finalize-71304.yml \
            .github/workflows/c9-expression-dc-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayDefinitionRuntime.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(c9): evaluate portable d20 expression dc"
          for attempt in $(seq 1 5); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then continue; fi
            git rebase --abort || true
            exit 1
          done
          exit 1
