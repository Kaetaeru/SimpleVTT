name: C9 Family J Spatial Verify 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-spatial-verify-71304.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile latest branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Verify Family J portable attack/control slice
        run: |
          npx tsx --test \
            tests/ui/c9FamilyJSpatialAttackProduction.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJAttackPersistence.test.ts \
            tests/ui/c9FamilyJAmmunitionProduction.test.ts \
            tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
