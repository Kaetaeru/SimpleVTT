name: C9 Family E Authoritative Selector Facts 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-authoritative-selector-facts-7130.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Finish generic selector production bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_or_verify(text, old, new, label):
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"{label}: expected at most one old match, found {text.count(old)}")
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"{label}: neither old nor desired form found")

          runtime=Path("src/domain/commonPlayOperationRuntime.ts")
          text=runtime.read_text()
          text=replace_or_verify(
              text,
              'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"|"area"> {\n  from:"targets";\n  min:number;\n  max:number;\n}\n',
              'export type CommonPlayTargetingSelector=CommonPlaySelector&{\n  from:"targets";\n  min:number;\n  max:number;\n};\n',
              "targeting selector type",
          )
          text=replace_or_verify(
              text,
              'const TARGETING_KEYS=new Set(["from","where","min","max"]);',
              'const TARGETING_KEYS=new Set(["from","where","min","max","orderBy","area"]);',
              "targeting selector keys",
          )
          text=replace_or_verify(
              text,
              '  return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where})};',
              '  return {...parsed,from:"targets",min:parsed.min,max:parsed.max};',
              "targeting selector parse projection",
          )
          runtime.write_text(text)

          adapter=Path("src/app/installedCommonPlayRuntimeAdapter.ts")
          app=adapter.read_text()
          old='    if(targeting.where?.op==="relation-matches"&&targeting.where.ref==="relation"&&selectedTargets.some((target)=>commonPlayTargetFact(actorEntity,target!).relation!==targeting.where!.value)) return undefined;\n'
          if old in app:
              app=app.replace(old,"",1)
          adapter.write_text(app)

          domain_test=Path("tests/domain/commonPlayTargetingRuntime.test.ts")
          domain=domain_test.read_text()
          domain=replace_or_verify(
              domain,
              'import { SIMPLEVTT_APP_RULES_PROFILE } from "../../src/app/simpleVttAppRulesProfile";',
              'import { SIMPLEVTT_APP_RULES_PROFILE } from "../../src/app/realResolutionService";',
              "targeting test rules profile import",
          )
          test_name='portable Common Play selector predicates consume authoritative spatial facts without fabricating them'
          if test_name not in domain:
              marker='test("unsupported Common Play selector shapes reject explicitly",()=>{\n'
              if marker not in domain:
                  raise SystemExit("rich targeting test marker missing")
              rich='''test("portable Common Play selector predicates consume authoritative spatial facts without fabricating them",()=>{\n  const authored=structuredClone(AUTHORED);\n  authored.entryPoints[0].targeting={\n    from:"targets",min:1,max:1,\n    where:{op:"all",args:[\n      {op:"lte",left:{ref:"distanceFeet"},right:{value:30}},\n      {op:"eq",left:{ref:"visible"},right:{value:true}},\n      {op:"ne",left:{ref:"cover"},right:{value:"total"}},\n    ]},\n  };\n  const definition=parseManualCommonPlayOperationDefinition(authored);\n  const accepted=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition,{\n    resolutionId:"authoritative-spatial-facts",actorId:"hero",entryPointId:"mend-other",targetId:"goblin",\n    targetingTargets:[{...target("goblin","enemy"),distanceFeet:20,visible:true,cover:"half"}],\n  });\n  assert.equal(accepted.status,"committed");\n  const rejected=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition,{\n    resolutionId:"authoritative-spatial-facts-reject",actorId:"hero",entryPointId:"mend-other",targetId:"goblin",\n    targetingTargets:[{...target("goblin","enemy"),distanceFeet:40,visible:true,cover:"half"}],\n  });\n  assert.equal(rejected.status,"rejected");\n});\n\n'''
              domain=domain.replace(marker,rich+marker,1)
          domain_test.write_text(domain)

          ui_test=Path("tests/ui/commonPlayRichSelectorProduction.test.ts")
          ui=ui_test.read_text()
          old_relation='''  await adapter.resolveAction(actionId,["char.aelar"]);\n  assert.notEqual((await adapter.getSnapshot()).resolution?.actionId,actionId,"relation predicate must reject self before Resolver execution");\n'''
          new_relation='''  await adapter.resolveAction(actionId,["char.aelar"]);\n  const rejected=await adapter.getSnapshot();\n  assert.equal(rejected.resolution?.actionId,actionId);\n  assert.equal(rejected.resolution?.finalOutcome,"적용 거부");\n  assert.ok(rejected.resolution?.detail.some((line)=>/manual selection contains an ineligible target/.test(line)));\n'''
          ui=replace_or_verify(ui,old_relation,new_relation,"production relation rejection")
          old_area='''  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  assert.notEqual((await adapter.getSnapshot()).resolution?.actionId,actionId,"mapless production must not fabricate area membership");\n'''
          new_area='''  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  const rejected=await adapter.getSnapshot();\n  assert.equal(rejected.resolution?.actionId,actionId);\n  assert.equal(rejected.resolution?.finalOutcome,"적용 거부");\n  assert.ok(rejected.resolution?.detail.some((line)=>/area membership requires a spatial provider or explicit authority answer/.test(line)));\n'''
          ui=replace_or_verify(ui,old_area,new_area,"production area rejection")
          ui_test.write_text(ui)
          PY
      - name: Verify Family E targeting regressions
        run: >-
          node --import tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayMaplessTargeting.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify boundaries and typecheck
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified slice and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-authoritative-selector-facts-7130.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts
          git diff --cached --check
          git commit -m "feat(c9): complete rich selector production bridge"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content
              node --import tsx --test tests/domain/commonPlayTargetingRuntime.test.ts tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayMaplessTargeting.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then
                exit 0
              fi
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "failed to publish rich selector bridge after concurrent retries" >&2
          exit 1
