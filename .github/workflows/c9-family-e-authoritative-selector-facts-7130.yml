name: C9 Family E Selector Production 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-authoritative-selector-facts-7130.yml

permissions:
  contents: write

jobs:
  patch-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Complete shared selector production boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_or_verify(path, old, new, label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old)!=1:
                  raise SystemExit(f'{label}: expected one old form, found {text.count(old)}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_or_verify(runtime,'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"|"area"> {\n  from:"targets";\n  min:number;\n  max:number;\n}\n','export type CommonPlayTargetingSelector=CommonPlaySelector&{\n  from:"targets";\n  min:number;\n  max:number;\n};\n','targeting selector type')
          replace_or_verify(runtime,'const TARGETING_KEYS=new Set(["from","where","min","max"]);','const TARGETING_KEYS=new Set(["from","where","min","max","orderBy","area"]);','targeting selector keys')
          replace_or_verify(runtime,'  return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where})};','  return {...parsed,from:"targets",min:parsed.min,max:parsed.max};','targeting selector parse projection')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          app=adapter.read_text(encoding='utf-8')
          duplicate='    if(targeting.where?.op==="relation-matches"&&targeting.where.ref==="relation"&&selectedTargets.some((target)=>commonPlayTargetFact(actorEntity,target!).relation!==targeting.where!.value)) return undefined;\n'
          if duplicate in app:
              adapter.write_text(app.replace(duplicate,'',1),encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family E selector slice
        run: >-
          node --import tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayMaplessTargeting.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify repository boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(c9): complete shared selector production boundary"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content
              node --import tsx --test tests/domain/commonPlayTargetingRuntime.test.ts tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayMaplessTargeting.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
