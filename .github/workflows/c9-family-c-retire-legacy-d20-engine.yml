name: C9 Family C Retire Legacy D20 Engine

on:
  push:
    paths:
      - '.github/workflows/c9-family-c-retire-legacy-d20-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/c9-remove-legacy-d20-followup-engine.mjs
      - run: npm run generate:content
      - name: Verify legacy ActionVm d20 DSL is gone
        run: '! grep -R -n "runtimeD20FollowUps" src/app'
      - name: Verify Family C portable production paths
        run: npx tsx --test tests/domain/commonPlayReactionDefinitionRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts tests/ui/fighterTacticalMindFollowUpRuntime.test.ts tests/ui/fighterIndomitableFollowUpRuntime.test.ts tests/ui/warlockFiendDarkOnesOwnLuckRuntime.test.ts tests/ui/bardCollegeLorePeerlessSkillRuntime.test.ts tests/ui/bardCollegeLoreCuttingWordsRuntime.test.ts tests/ui/connectedProjectedCharacterDarkOnesOwnLuckResolution.test.ts tests/ui/connectedProjectedCharacterPeerlessSkillResolution.test.ts tests/ui/openAbilityCheckDcRuntime.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Commit verified legacy-engine retirement
        run: |
          rm -f scripts/c9-remove-legacy-d20-followup-engine.mjs .github/workflows/c9-family-c-retire-legacy-d20-engine.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(common-play): retire legacy d20 followup engine'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
