name: C9 Family J Ammunition Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-ammunition-71304.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Merge verified ammunition evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-ammunition-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 30); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          evidence={
            'implementationEvidence':'commonPlayOperationRuntime.ts generic resource PaymentContract composes source-owned ammunition consumption atomically with the existing Common Play attack transaction',
            'productionEvidence':'c9FamilyJAmmunitionProduction.test.ts proves an unknown installed ranged attack consumes a source-owned ammunition pool, rejects at zero without downstream commit, restores through event-native Undo, and repeats under fully renamed external identities',
            'identityInvarianceEvidence':'c9FamilyJAmmunitionProduction.test.ts repeats source-owned ammunition payment and empty-ammunition rejection after complete module/content/mechanic/resource identity rename',
          }
          for field,value in evidence.items():
            if value not in row[field]: row[field].append(value)
          sentence='Portable source-owned ammunition now composes through the generic resource PaymentContract with attack execution, including empty-ammunition atomic rejection, event-native Undo, and complete external identity rename.'
          if sentence not in row['currentState']:
            row['currentState']=row['currentState'].rstrip()+' '+sentence
          row['remainingNamedSeams']=[
            seam.replace('ammunition/loading constraints remain incomplete','Loading constraints remain incomplete')
                .replace('ammunition/loading composition','Loading composition')
            for seam in row['remainingNamedSeams']
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            rm -f "$workflow"
            node scripts/check-v1-mechanism-coverage.mjs
            git add docs/rules/v1-mechanism-coverage-ledger.json "$workflow"
            git commit -m "docs(c9): record portable ammunition evidence"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 0.2
          done
          exit 1
