name: C9 Family E Area Selector 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-selector-7130.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stage generic selector production boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("src/domain/commonPlayOperationRuntime.ts")
          text = runtime.read_text()
          old_interface = 'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"|"area"> {'
          new_interface = 'export interface CommonPlayTargetingSelector extends Omit<CommonPlaySelector,"from"|"min"|"max"|"orderBy"> {'
          if old_interface in text:
              text = text.replace(old_interface, new_interface, 1)
          else:
              assert new_interface in text
          old_keys = 'const TARGETING_KEYS=new Set(["from","where","min","max"]);'
          new_keys = 'const TARGETING_KEYS=new Set(["from","where","min","max","area"]);'
          if old_keys in text:
              text = text.replace(old_keys, new_keys, 1)
          else:
              assert new_keys in text
          old_return = 'return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where})};'
          new_return = 'return {from:"targets",min:parsed.min,max:parsed.max,...(parsed.where===undefined?{}:{where:parsed.where}),...(parsed.area===undefined?{}:{area:parsed.area})};'
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          else:
              assert new_return in text
          runtime.write_text(text)

          adapter = Path("src/app/installedCommonPlayRuntimeAdapter.ts")
          text = adapter.read_text()
          selector_import = 'import { resolveCommonPlaySelector, type CommonPlaySelector, type CommonPlaySelectorCandidate } from "../domain/commonPlaySelectorRuntime";\n'
          import_anchor = 'import { allocationEntriesFromTargetSequence, resolveCommonPlayAllocation } from "../domain/commonPlayAllocationRuntime";\n'
          if selector_import not in text:
              assert import_anchor in text
              text = text.replace(import_anchor, import_anchor + selector_import, 1)

          old_targeting = 'targeting?:{min?:number;max?:number;where?:{op:string;ref:string;value:string}};'
          old_area_targeting = 'targeting?:{min?:number;max?:number;where?:{op:string;ref:string;value:string};area?:unknown};'
          if old_targeting in text:
              text = text.replace(old_targeting, 'targeting?:CommonPlaySelector;', 1)
          elif old_area_targeting in text:
              text = text.replace(old_area_targeting, 'targeting?:CommonPlaySelector;', 1)
          else:
              assert 'targeting?:CommonPlaySelector;' in text

          helper_marker = '''function commonPlayTargetFact(actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):TargetingFactInput {
  return {
    id:target.id,
    kind:"creature",
    relation:target.id===actor.id?"self":target.side===actor.side?"ally":"enemy",
  };
}
'''
          helper = helper_marker + '''
function commonPlaySelectorCandidate(actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {
  const targeting=commonPlayTargetFact(actor,target);
  return {
    id:target.id,
    targeting,
    properties:{id:target.id,kind:target.kind,relation:targeting.relation,name:target.name,side:target.side,hp:target.hp},
  };
}
'''
          if 'function commonPlaySelectorCandidate(' not in text:
              assert helper_marker in text
              text = text.replace(helper_marker, helper, 1)

          old_block = '''  if(hasTargeting) {
    const targeting=portableEntry.targeting!;
    if(targetIds.length<(targeting.min??1)||targetIds.length>(targeting.max??targetIds.length)) return undefined;
    if(targeting.where?.op==="relation-matches"&&targeting.where.ref==="relation"&&selectedTargets.some((target)=>commonPlayTargetFact(actorEntity,target!).relation!==targeting.where!.value)) return undefined;
    if(projectedAction&&(!projectedAction.available||targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;
  } else if(hasAllocation) {'''
          new_block = '''  if(hasTargeting) {
    const targeting=portableEntry.targeting!;
    const candidates=internal.scene.entities
      .filter((target)=>Boolean(state!.combatants[target.id]))
      .map((target)=>commonPlaySelectorCandidate(actorEntity,target));
    const selection=resolveCommonPlaySelector({
      sourceId:actor.id,
      selector:targeting,
      candidates,
      selectedIds:targetIds,
      selection:"manual",
      authority:"actor-owner",
      directTarget:targeting.area===undefined,
    });
    if(selection.status!=="resolved") return undefined;
    if(projectedAction&&(!projectedAction.available||targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;
  } else if(hasAllocation) {'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          else:
              assert 'const selection=resolveCommonPlaySelector({' in text
          adapter.write_text(text)

          domain_test = Path("tests/domain/commonPlayTargetingRuntime.test.ts")
          lines = domain_test.read_text().splitlines()
          lines = [line for line in lines if not ('from:"targets",area:{kind:"instant"}' in line and 'unsupported fields: area' in line)]
          domain_test.write_text("\n".join(lines) + "\n")
          PY
      - run: npm run generate:content
      - name: Verify Family E selector regressions
        run: node --import tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/domain/commonPlayMaplessTargeting.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Commit verified selector boundary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-area-selector-7130.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlayTargetingRuntime.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(c9): gate portable selectors before resolver"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
