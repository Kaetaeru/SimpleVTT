name: C9 Family E Spatial Facts 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-spatial-fact-7130.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify landed Family E spatial selector
        run: >-
          node --import tsx --test
          tests/ui/c9FamilyESpatialSelectorProduction.test.ts
          tests/ui/c9FamilyEConditionSelectorProduction.test.ts
          tests/ui/c9FamilyETagSelectorProduction.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
      - name: Verify repository boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
