name: C9 Family E Reach Fact 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-e-reach-fact-71304.yml"

permissions:
  contents: write

jobs:
  verify-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E provider-owned reach slice
        run: |
          npx tsx --test tests/ui/c9FamilyESpatialSelectorProduction.test.ts tests/domain/commonPlaySelectorRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Retire verified workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-e-reach-fact-71304.yml
          git add .github/workflows/c9-family-e-reach-fact-71304.yml
          git commit -m "chore(c9): retire verified reach workflow"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
