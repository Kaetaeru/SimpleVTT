name: C9 Family Q Stale 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - "tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts"
      - "tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts"
      - "src/app/installedCommonPlayRuntimeAdapter.ts"
      - "src/app/connectedActionRoutingAdapter.ts"
      - "docs/rules/v1-mechanism-coverage-ledger.json"
      - "scripts/check-v1-mechanism-coverage.mjs"
      - ".github/workflows/c9-family-q-stale-71304.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family Q owner interaction stale handling
        run: npx tsx --test tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Verify Gate N coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
