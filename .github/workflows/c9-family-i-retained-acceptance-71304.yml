name: C9 Family I Retained Acceptance 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-retained-acceptance-71304.yml

permissions:
  contents: write

jobs:
  verify-and-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify retained Family I semantics
        run: |
          npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/ui/c9FamilyIMovementProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Reconcile evidence on latest branch and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            npm run generate:content
            npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/ui/c9FamilyIMovementProduction.test.ts
            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='I')
          row['currentState']='Canonical movement.relocate parses through the generic operations lowerer. Unknown installed Common Play production-executes walk, climb, swim, fly, crawl, jump, cost multipliers, push, pull, teleport, explicit no-provoke movement, zero-speed rejection, Undo, connected replay/reconnect, and external identity rename invariance. Family I remains incomplete for rules-derived movement constraints and named movement-grant convergence.'
          row['productionEvidence']=[entry for entry in row['productionEvidence'] if 'c9FamilyIMovementModeAcceptance.test.ts' not in entry]
          retained='c9FamilyIMovementProduction.test.ts retained unknown installed Common Play proves walk/climb/swim/fly/crawl/jump, cost multiplier, push/pull/teleport, explicit no-provoke movement, zero-speed rejection, Undo, and full external identity rename'
          if retained not in row['productionEvidence']:
            row['productionEvidence'].append(retained)
          row['identityInvarianceEvidence']=[entry for entry in row['identityInvarianceEvidence'] if 'c9FamilyIMovementModeAcceptance.test.ts' not in entry]
          retained_identity='c9FamilyIMovementProduction.test.ts retained external identity rename preserves the production movement matrix including no-provoke routing'
          if retained_identity not in row['identityInvarianceEvidence']:
            row['identityInvarianceEvidence'].append(retained_identity)
          row['remainingNamedSeams']=[
            'named movement grants',
            'rules-derived Difficult Terrain, Prone stand cost, drag/carry, alternate-speed, and related movement constraint authority remain incomplete',
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git rm -f --ignore-unmatch .github/workflows/c9-family-i-retained-acceptance-71304.yml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): retain Family I movement acceptance evidence"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
