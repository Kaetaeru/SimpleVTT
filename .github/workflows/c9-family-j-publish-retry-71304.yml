name: C9 Family J Publish Retry 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-j-publish-retry-71304.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast-forward to current branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - name: Apply the already-verified Family J patch
        shell: bash
        run: |
          awk '/python3 <<'\''PY'\''/{capture=1} capture{sub(/^          /,""); print} capture && $0 ~ /^PY$/ {exit}' .github/workflows/c9-family-j-portable-target-save-71304.yml > /tmp/c9-family-j-apply.sh
          grep -q "python3 <<'PY'" /tmp/c9-family-j-apply.sh
          grep -q '^PY$' /tmp/c9-family-j-apply.sh
          bash /tmp/c9-family-j-apply.sh
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify portable target save control
        run: npx tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/unarmedStrikeRuntime.test.ts tests/ui/c9FamilyMConditionImmunityProduction.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Publish verified slice and retire temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-portable-target-save-71304.yml .github/workflows/c9-family-j-publish-retry-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyJPortableControlProduction.test.ts
          git commit -m "feat(c9): lower portable target saving control"
          for attempt in $(seq 1 12); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if ! git rebase origin/agent/c9-gate-n-coverage-reconciliation; then
              git rebase --abort || true
              echo "Concurrent work conflicts with the verified Family J slice; refusing to overwrite it."
              exit 1
            fi
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          echo "Branch remained busy after bounded publish retries."
          exit 1
