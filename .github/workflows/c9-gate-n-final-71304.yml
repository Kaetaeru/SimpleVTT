# Final Gate N one-shot verifier; verifies the exact triggering commit.
# Retriggered after Family J spatial authority fixture reconciliation.
name: C9 Gate N Final Verification 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-gate-n-final-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-gate-n-final-71304
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Gate N coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs --gate-n
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Verify unknown external Common Play production paths
        run: >-
          npx tsx --test
          tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
          tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          tests/ui/installedCommonPlayPropertyModifierReconnect.test.ts
          tests/ui/phase09CommonPlayResourcePersistence.test.ts
          tests/ui/connectedActorTurnRuleProduction.test.ts
          tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Verify repository build gate
        run: npm run build
      - name: Retire one-shot verifier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-gate-n-final-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            rm -f "$path"
            git add -A "$path"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "ci(c9): retire final Gate N verifier"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
