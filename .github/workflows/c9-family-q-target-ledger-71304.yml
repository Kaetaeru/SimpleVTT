name: C9 Family Q Target Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-target-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm ci
      - name: Generate content
        run: npm run generate:content
      - name: Verify landed target responder
        run: npx tsx --test tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
      - name: Verify typecheck
        run: npx tsc --noEmit
      - name: Reconcile Family Q evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text(encoding='utf-8'))
          q=next(row for row in ledger['rows'] if row['family']=='Q')

          q['currentState']=q['currentState'].replace(
              'actor, actor-owner, and target-owner responders',
              'actor, target, actor-owner, and target-owner responders',
          ).replace(
              'Rich choice/multiple-option and the remaining target/DM/Host responder and reconnect/stale-replay matrix remain incomplete.',
              'Rich choice/multiple-option and the remaining DM/Host responder and reconnect/stale-replay matrix remain incomplete.',
          )

          implementation='commonPlayOperationRuntime.ts typed consent interaction supports actor|target|actor-owner|target-owner responders; installedCommonPlayRuntimeAdapter.ts resolves target-directed consent from the authoritative single selected target without content identity dispatch'
          production='50376a0b5baf574a2c26e594c705436fe1363212 feat(c9): route portable target consent responder; c9FamilyQTargetOwnerInteractionProduction.test.ts verifies both target and target-owner production routing, unauthorized-peer rejection, atomic Reaction payment, downstream damage, and authoritative event broadcast'
          identity='c9FamilyQTargetOwnerInteractionProduction.test.ts exercises target and target-owner responder semantics through the same arbitrary previously-unknown external module/content/mechanic identities'
          connected='c9FamilyQTargetOwnerInteractionProduction.test.ts routes target and target-owner prompts only to the selected target Character peer and rejects the actor peer before authoritative commit'

          for field,value in [
              ('implementationEvidence',implementation),
              ('productionEvidence',production),
              ('identityInvarianceEvidence',identity),
              ('connectedEvidenceIfRelevant',connected),
          ]:
              if value not in q[field]:
                  q[field].append(value)

          q['remainingNamedSeams']=[
              'DM and Host responder routing is not yet represented'
              if seam=='target, DM, and Host responder routing is not yet represented'
              else seam
              for seam in q['remainingNamedSeams']
          ]

          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish evidence and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore src/generated || true
          git rm .github/workflows/c9-family-q-target-ledger-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(c9): record target responder evidence"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
