name: C9 Family E Automatic Selector R2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-auto-selector-r2.yml

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse staged selector patch and bridge operation parser
        shell: bash
        run: |
          payload=$(grep -o "echo '[A-Za-z0-9+/=]*' | base64" .github/workflows/c9-family-e-auto-selector-patch.yml | head -1 | cut -d"'" -f2)
          test -n "$payload"
          echo "$payload" | base64 -d | gzip -d > /tmp/c9-family-e-patch.py
          python /tmp/c9-family-e-patch.py
          python -c 'from pathlib import Path; p=Path("src/domain/commonPlayOperationRuntime.ts"); t=p.read_text(); old="const TARGETING_KEYS=new Set([\"from\",\"where\",\"min\",\"max\",\"area\",\"orderBy\"]);"; new="const TARGETING_KEYS=new Set([\"from\",\"where\",\"min\",\"max\",\"area\",\"orderBy\",\"selection\"]);"; assert old in t or new in t; p.write_text(t.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("tests/ui/installedCommonPlayProductionRuntime.test.ts"); t=p.read_text(); marker="test(\"unknown installed Common Play automatic selector uses Host authority ordering without caller target identities\""; i=t.index(marker); old="entryPoint.operations=[];"; j=t.index(old,i); new="entryPoint.operations=[{kind:\"damage.apply\",amount:{value:1},damageType:\"force\",target:\"target\"}];"; p.write_text(t[:j]+new+t[j+len(old):])'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E selector slice
        run: npx tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify typecheck
        run: npx tsc --noEmit
      - name: Commit verified slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlaySelectorRuntime.ts src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(c9): expose automatic selector authority"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
