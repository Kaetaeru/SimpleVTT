name: C9 Family J Attack Diagnostic 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-attack-presentation-fix-71304.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Diagnose Family J final attack rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ui/c9FamilyJSpatialAttackProduction.test.ts')
          s=p.read_text(encoding='utf-8')
          needle='''  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));\n  assert.equal(snapshot.resolution?.rollKind,"attack");'''
          repl='''  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));\n  console.log("C9_FAMILY_J_FINAL_RESOLUTION="+JSON.stringify(snapshot.resolution));\n  console.log("C9_FAMILY_J_EVENT_HISTORY="+JSON.stringify(runtimeResolutionEventHistory(adapter)));\n  assert.equal(snapshot.resolution?.rollKind,"attack");'''
          if needle not in s:
              raise SystemExit('diagnostic insertion point not found')
          p.write_text(s.replace(needle,repl,1),encoding='utf-8')
          PY
          node --import tsx --test tests/ui/c9FamilyJSpatialAttackProduction.test.ts
