name: C9 Family P Semantic Outcomes Recover

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-semantic-outcomes-recover.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Replay verified Family P apply and verification
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/c9-family-p-semantic-outcomes.yml').read_text()

          def run_block(step_name: str) -> None:
              marker = f'      - name: {step_name}\n'
              start = workflow.find(marker)
              if start < 0:
                  raise SystemExit(f'missing workflow step: {step_name}')
              run_marker = '        run: |\n'
              run_start = workflow.find(run_marker, start)
              if run_start < 0:
                  raise SystemExit(f'missing run block: {step_name}')
              body_start = run_start + len(run_marker)
              lines = []
              for line in workflow[body_start:].splitlines():
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      lines.append(line[10:])
                  elif not line.strip():
                      lines.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
              script = '\n'.join(lines) + '\n'
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)

          run_block('Add Common Play semantic d20 outcome events')
          run_block('Verify Family P semantic outcome slice')
          PY
      - name: Commit verified Family P slice on latest branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-p-semantic-outcomes.yml .github/workflows/c9-family-p-semantic-outcomes-recover.yml
          git add src/domain/commonPlaySemanticEventRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlaySemanticEventRuntime.test.ts tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): emit portable d20 outcome events"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
