name: C9 Family P Multi-target Semantic Evidence 7130
# Retry after fixing YAML/Python anchor dedent.
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-p-multitarget-semantic-evidence-7130.yml]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Assert production multi-target semantic history
        shell: python
        run: |
          from pathlib import Path

          path=Path('tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts')
          source=path.read_text()
          old='  const afterSave=await adapter.getSnapshot();\n  const hpAfter=afterSave.scene.entities.filter((entity)=>entity.id.startsWith("combatant.goblin")).map((entity)=>entity.hp);'
          new='  const afterSave=await adapter.getSnapshot();\n  const saveOutcomes=snapshotAdapterTurnRuntimeState(adapter,afterSave.scene)!.history\n    .filter((entry)=>entry.kind==="save.failure"||entry.kind==="save.success")\n    .map((entry)=>({kind:entry.kind,actorId:entry.actorId}));\n  const hpAfter=afterSave.scene.entities.filter((entity)=>entity.id.startsWith("combatant.goblin")).map((entity)=>entity.hp);'
          if source.count(old)!=1:
            raise SystemExit(f'after-save anchor count={source.count(old)}')
          source=source.replace(old,new,1)

          old='  return {adapter,hpDelta:hpBefore.map((hp,index)=>hp-hpAfter[index]),saveResolution:afterSave.resolution,effects:runtime.effects.length,artifactKinds:(runtime.artifacts??[]).map((artifact)=>artifact.artifactKind),summon:afterAll.scene.entities.find((entity)=>entity.id===`${prefix}.summoned`)};'
          new='  return {adapter,hpDelta:hpBefore.map((hp,index)=>hp-hpAfter[index]),saveResolution:afterSave.resolution,saveOutcomes,effects:runtime.effects.length,artifactKinds:(runtime.artifacts??[]).map((artifact)=>artifact.artifactKind),summon:afterAll.scene.entities.find((entity)=>entity.id===`${prefix}.summoned`)};'
          if source.count(old)!=1:
            raise SystemExit(f'return anchor count={source.count(old)}')
          source=source.replace(old,new,1)

          old='  assert.deepEqual(result.hpDelta,[12,21],JSON.stringify(result.saveResolution));\n  assert.equal(result.effects,1);'
          new='  assert.deepEqual(result.hpDelta,[12,21],JSON.stringify(result.saveResolution));\n  assert.deepEqual(result.saveOutcomes.map((entry)=>entry.actorId),["combatant.goblin-a","combatant.goblin-b"]);\n  assert.deepEqual(result.saveOutcomes.map((entry)=>entry.kind).sort(),["save.failure","save.success"]);\n  assert.equal(result.effects,1);'
          if source.count(old)!=1:
            raise SystemExit(f'production assertion anchor count={source.count(old)}')
          source=source.replace(old,new,1)

          old='  assert.deepEqual({hp:first.hpDelta,effects:first.effects,artifacts:first.artifactKinds},{hp:renamed.hpDelta,effects:renamed.effects,artifacts:renamed.artifactKinds});'
          new='  assert.deepEqual({hp:first.hpDelta,saveOutcomes:first.saveOutcomes,effects:first.effects,artifacts:first.artifactKinds},{hp:renamed.hpDelta,saveOutcomes:renamed.saveOutcomes,effects:renamed.effects,artifacts:renamed.artifactKinds});'
          if source.count(old)!=1:
            raise SystemExit(f'rename assertion anchor count={source.count(old)}')
          path.write_text(source.replace(old,new,1))
      - name: Reconcile Family P ledger evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text())
          row=next(row for row in data['rows'] if row['family']=='P')
          before='State/rest/expiry/recharge, multi-target save-damage semantic outcomes, and automatic semantic-event dispatcher composition remain incomplete'
          after='State/rest/expiry/recharge and automatic semantic-event dispatcher composition remain incomplete; multi-target save-damage semantic outcomes now have production and rename-invariance evidence'
          if before in row['currentState']:
            row['currentState']=row['currentState'].replace(before,after)
          elif after not in row['currentState']:
            raise SystemExit('Family P currentState anchor missing')
          production='installedCommonPlayLoweredFamiliesProduction.test.ts unknown external multi-target save emits per-target save.success/save.failure semantic history through the production adapter'
          identity='installedCommonPlayLoweredFamiliesProduction.test.ts renamed external module/content/mechanic preserves multi-target semantic save outcomes'
          if production not in row['productionEvidence']:
            row['productionEvidence'].append(production)
          if identity not in row['identityInvarianceEvidence']:
            row['identityInvarianceEvidence'].append(identity)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
      - run: npx tsx --test tests/domain/commonPlaySaveDamageRuntime.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npx tsc --noEmit
      - name: Commit verified Family P evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-p-multitarget-semantic-evidence-7130.yml
          git commit -m "test(c9): prove multi-target semantic save production"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
