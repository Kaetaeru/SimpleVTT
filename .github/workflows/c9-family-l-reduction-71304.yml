name: C9 Family L Damage Reduction 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-reduction-71304.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Connect portable reduction to shared damage authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          resolution_types = "src/domain/resolutionTypes.ts"
          replace_once(
              resolution_types,
              'import type { DamageDefenseContribution } from "./damage";',
              'import type { DamageAdjustment, DamageDefenseContribution } from "./damage";',
          )
          replace_once(
              resolution_types,
              '''      amount: NumericOperand;\n      defenses?: DamageDefenseContribution[];\n      creatureKind: "character" | "monster";''',
              '''      amount: NumericOperand;\n      adjustments?: DamageAdjustment[];\n      defenses?: DamageDefenseContribution[];\n      creatureKind: "character" | "monster";''',
          )
          replace_once(
              resolution_types,
              '''        amount: NumericOperand;\n        defenses?: DamageDefenseContribution[];\n      }>;''',
              '''        amount: NumericOperand;\n        adjustments?: DamageAdjustment[];\n        defenses?: DamageDefenseContribution[];\n      }>;''',
          )

          health_ops = "src/domain/resolutionHealthOps.ts"
          replace_once(
              health_ops,
              '''  const damage = resolveDamage({ damageType:operation.damageType, amount, hp:beforeHp, defenses });''',
              '''  const damage = resolveDamage({ damageType:operation.damageType, amount, hp:beforeHp, adjustments:operation.adjustments, defenses });''',
          )
          replace_once(
              health_ops,
              '''      damageType:component.damageType,\n      amount:valueFromResult(ctx.results, component.amount),\n      defenses:[...commonDefenses, ...(component.defenses ?? [])],''',
              '''      damageType:component.damageType,\n      amount:valueFromResult(ctx.results, component.amount),\n      adjustments:component.adjustments,\n      defenses:[...commonDefenses, ...(component.defenses ?? [])],''',
          )

          common_play = "src/domain/commonPlayOperationRuntime.ts"
          replace_once(
              common_play,
              '''  damageType:string;\n  multiplier?:number;\n  target?:CommonPlayHpTarget;''',
              '''  damageType:string;\n  multiplier?:number;\n  reduction?:LiteralNumberExpression;\n  target?:CommonPlayHpTarget;''',
          )
          replace_once(
              common_play,
              '''const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target","when"]);''',
              '''const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","reduction","target","when"]);''',
          )
          replace_once(
              common_play,
              '''    const multiplier=operation.multiplier;\n    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);\n    const when=testOutcomePredicate(operation.when,`${label}.when`);''',
              '''    const multiplier=operation.multiplier;\n    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);\n    const reduction=operation.reduction===undefined?undefined:nonNegativeLiteralExpression(operation.reduction,`${label}.reduction`);\n    const when=testOutcomePredicate(operation.when,`${label}.when`);''',
          )
          replace_once(
              common_play,
              '''      ...(multiplier===undefined?{}:{multiplier}),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),''',
              '''      ...(multiplier===undefined?{}:{multiplier}),\n      ...(reduction===undefined?{}:{reduction}),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),''',
          )
          replace_once(
              common_play,
              '''        amount,\n        creatureKind,\n      });''',
              '''        amount,\n        ...(operation.reduction===undefined||operation.reduction.value===0?{}:{adjustments:[{\n          source:`common-play:${supported.id}:${entryPoint.id}:operation:${index}:reduction`,\n          operation:"subtract" as const,\n          value:operation.reduction.value,\n        }]}),\n        creatureKind,\n      });''',
          )

          schema = "schemas/common-play-contract.schema.json"
          replace_once(
              schema,
              '''        "multiplier": {\n          "type": "number",\n          "minimum": 0\n        },\n        "target": {''',
              '''        "multiplier": {\n          "type": "number",\n          "minimum": 0\n        },\n        "reduction": {\n          "$ref": "#/$defs/expression"\n        },\n        "target": {''',
          )

          test_path = "tests/ui/c9FamilyLDamageDefenseProduction.test.ts"
          replace_once(
              test_path,
              '''function packagePayload(prefix:string,multiplier?:number,amount=4,target:"target"|"self"="target") {''',
              '''function packagePayload(prefix:string,multiplier?:number,amount=4,target:"target"|"self"="target",reduction?:number) {''',
          )
          replace_once(
              test_path,
              '''        operations:[{kind:"damage.apply",amount:{value:amount},damageType:"fire",...(multiplier===undefined?{}:{multiplier}),target}],''',
              '''        operations:[{kind:"damage.apply",amount:{value:amount},damageType:"fire",...(multiplier===undefined?{}:{multiplier}),...(reduction===undefined?{}:{reduction:{value:reduction}}),target}],''',
          )
          replace_once(
              test_path,
              '''async function execute(prefix:string,kind?:DamageDefenseKind,multiplier?:number) {\n  const adapter=new MockAdapter();\n  const pack=packagePayload(prefix,multiplier);''',
              '''async function execute(prefix:string,kind?:DamageDefenseKind,multiplier?:number,reduction?:number) {\n  const adapter=new MockAdapter();\n  const pack=packagePayload(prefix,multiplier,4,"target",reduction);''',
          )
          marker = '''test("unknown installed damage.apply enforces character instant-death overkill with rename invariance and Undo",async()=>{'''
          insertion = '''test("unknown installed damage.apply applies structural reduction with rename invariance and Undo",async()=>{\n  assert.equal(await execute("external.family-l-reduction",undefined,undefined,3),1);\n  assert.equal(await execute("completely.renamed-family-l-reduction",undefined,undefined,3),1);\n});\n\n'''
          p = Path(test_path)
          text = p.read_text()
          if insertion not in text:
              if marker not in text:
                  raise SystemExit("missing Family L test insertion anchor")
              p.write_text(text.replace(marker, insertion + marker, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify portable damage reduction and adjacent Family L regressions
        run: npx tsx --test tests/domain/compoundDamage.test.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts
      - name: Verify V1 coverage structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Publish verified Family L slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-l-reduction-71304.yml
          git add src/domain/resolutionTypes.ts src/domain/resolutionHealthOps.ts src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyLDamageDefenseProduction.test.ts
          git commit -m "feat(c9): expose portable damage reduction"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 2
          done
          exit 1
