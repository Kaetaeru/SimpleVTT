name: W6-07 AUTO Verification

on:
  pull_request:
    branches:
      - work/v1-composite
    paths:
      - '.github/workflows/w6-07-auto.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'content/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate:content
      - name: Focused W6-07 tests
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test \
            tests/ui/campaignDmLibraryImport.test.ts \
            tests/ui/campaignDmLibraryGrantDurability.test.ts \
            tests/ui/sessionImageHandoutRuntimeAdapter.test.ts \
            tests/ui/connectedSceneTopologyProjection.test.ts \
            tests/ui/connectedSceneTopologyHostMutation.test.ts \
            tests/ui/productionHostRemoteFixtureIdentityProjection.test.ts \
            | tee /tmp/w6-07.tap
      - name: Production build
        run: npm run build
      - name: Record exact-SHA evidence
        shell: bash
        run: |
          {
            echo "W6-07 AUTO Verification"
            echo "checkout_sha=${GITHUB_SHA}"
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "base_sha=${{ github.event.pull_request.base.sha }}"
            echo "scenario_mapping=MP-G01..MP-G09"
            echo "command=npx tsx --test tests/ui/campaignDmLibraryImport.test.ts tests/ui/campaignDmLibraryGrantDurability.test.ts tests/ui/sessionImageHandoutRuntimeAdapter.test.ts tests/ui/connectedSceneTopologyProjection.test.ts tests/ui/connectedSceneTopologyHostMutation.test.ts tests/ui/productionHostRemoteFixtureIdentityProjection.test.ts"
          } > /tmp/w6-07-evidence.txt
      - name: Upload W6-07 evidence
        uses: actions/upload-artifact@v4
        with:
          name: W6-07-AUTO-${{ github.sha }}
          path: |
            /tmp/w6-07.tap
            /tmp/w6-07-evidence.txt
          if-no-files-found: error
