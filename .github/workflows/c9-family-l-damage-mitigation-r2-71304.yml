name: C9 Family L Damage Mitigation R2 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-l-damage-mitigation-r2-71304.yml"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply portable structural damage mitigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          damage=Path('src/domain/damage.ts')
          text=damage.read_text(encoding='utf-8')
          if 'export interface DamageReductionContribution' not in text:
              anchor='''export interface DamageAdjustment {\n  source: string;\n  operation: DamageAdjustmentOperation;\n  value: number;\n}\n'''
              addition='''\nexport interface DamageReductionContribution {\n  source: string;\n  amount: number;\n}\n\nexport interface DamageThresholdContribution {\n  source: string;\n  threshold: number;\n}\n'''
              if text.count(anchor)!=1: raise SystemExit('damage contribution anchor mismatch')
              text=text.replace(anchor,anchor+addition,1)

          old='''export interface DamageComponentRequest {\n  damageType: string;\n  amount: number;\n  adjustments?: DamageAdjustment[];\n  defenses?: DamageDefenseContribution[];\n}\n'''
          new='''export interface DamageComponentRequest {\n  damageType: string;\n  amount: number;\n  adjustments?: DamageAdjustment[];\n  defenses?: DamageDefenseContribution[];\n  reductions?: DamageReductionContribution[];\n  thresholds?: DamageThresholdContribution[];\n}\n'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit('damage request anchor mismatch')
              text=text.replace(old,new,1)

          old='''export interface CompoundDamageRequest {\n  hp: HpState;\n  components: DamageComponentRequest[];\n}\n'''
          new='''export interface CompoundDamageRequest {\n  hp: HpState;\n  components: DamageComponentRequest[];\n  reductions?: DamageReductionContribution[];\n  thresholds?: DamageThresholdContribution[];\n}\n'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit('compound request anchor mismatch')
              text=text.replace(old,new,1)

          if 'function applyFinalDamageMitigation(' not in text:
              marker='''\nexport function resolveDamageAmount(request: DamageComponentRequest): DamageAmountResolution {\n'''
              helper='''\nfunction applyFinalDamageMitigation(\n  amount: number,\n  reductions: DamageReductionContribution[] | undefined,\n  thresholds: DamageThresholdContribution[] | undefined,\n  provenance: ProvenanceRecord[],\n) {\n  let adjusted = amount;\n  for (const reduction of reductions ?? []) {\n    requireNonNegativeInteger(reduction.amount, `damage reduction from ${reduction.source}`);\n    const before = adjusted;\n    adjusted = Math.max(0, adjusted - reduction.amount);\n    provenance.push({\n      source:reduction.source,\n      status:before !== adjusted ? "applied" : "suppressed",\n      reason:before !== adjusted\n        ? `Damage reduction ${before} -> ${adjusted}`\n        : `Damage reduction ${reduction.amount} had no remaining damage to reduce`,\n    });\n  }\n  for (const threshold of thresholds ?? []) {\n    requireNonNegativeInteger(threshold.threshold, `damage threshold from ${threshold.source}`);\n    const before = adjusted;\n    if (adjusted > 0 && adjusted < threshold.threshold) {\n      adjusted = 0;\n      provenance.push({ source:threshold.source, status:"applied", reason:`Damage ${before} is below threshold ${threshold.threshold}; damage becomes 0` });\n    } else {\n      provenance.push({\n        source:threshold.source,\n        status:"suppressed",\n        reason:adjusted === 0\n          ? `Damage threshold ${threshold.threshold} had no remaining damage to test`\n          : `Damage ${adjusted} meets threshold ${threshold.threshold}`,\n      });\n    }\n  }\n  return adjusted;\n}\n'''
              if text.count(marker)!=1: raise SystemExit('damage mitigation helper marker mismatch')
              text=text.replace(marker,helper+marker,1)

          call='  adjusted = applyFinalDamageMitigation(adjusted, request.reductions, request.thresholds, provenance);\n'
          if call not in text:
              marker='  requireNonNegativeInteger(adjusted, "final damage");\n  return {\n'
              if text.count(marker)!=1: raise SystemExit('single damage mitigation marker mismatch')
              text=text.replace(marker,call+marker,1)

          old='''  const finalDamage = components.reduce((sum, component) => sum + component.finalDamage, 0);\n  const provenance = components.flatMap((component) => component.provenance.map((entry) => ({\n    ...entry,\n    reason:`${component.damageType}: ${entry.reason}`,\n  })));\n  const hp = applyDamageToHp(request.hp, finalDamage, provenance);\n'''
          new='''  let finalDamage = components.reduce((sum, component) => sum + component.finalDamage, 0);\n  const provenance = components.flatMap((component) => component.provenance.map((entry) => ({\n    ...entry,\n    reason:`${component.damageType}: ${entry.reason}`,\n  })));\n  finalDamage = applyFinalDamageMitigation(finalDamage, request.reductions, request.thresholds, provenance);\n  const hp = applyDamageToHp(request.hp, finalDamage, provenance);\n'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit('compound damage mitigation anchor mismatch')
              text=text.replace(old,new,1)
          damage.write_text(text,encoding='utf-8')

          health=Path('src/domain/resolutionHealthOps.ts')
          text=health.read_text(encoding='utf-8')
          old='import { resolveCompoundDamage, resolveDamage, resolveHealing, type DamageDefenseContribution, type DamageResolution } from "./damage";'
          new='import { resolveCompoundDamage, resolveDamage, resolveHealing, type DamageDefenseContribution, type DamageReductionContribution, type DamageResolution, type DamageThresholdContribution } from "./damage";'
          if new not in text:
              if text.count(old)!=1: raise SystemExit('health damage import anchor mismatch')
              text=text.replace(old,new,1)
          old='import { terminateEffectsForCreatureState, terminateEffectsForDamage } from "./effects";'
          new='import { resolveEffectModifiedProperty, terminateEffectsForCreatureState, terminateEffectsForDamage } from "./effects";'
          if new not in text:
              if text.count(old)!=1: raise SystemExit('health effects import anchor mismatch')
              text=text.replace(old,new,1)

          if 'function structuralDamageMitigation(' not in text:
              marker='''\nfunction endActorConcentration(ctx: ResolutionExecutionContext, actorId: string, reason: string) {\n'''
              helper='''\nfunction structuralDamageMitigation(ctx: ResolutionExecutionContext, targetId: string) {\n  const target = requireCombatant(ctx.state, targetId);\n  const inputs = { ...(target.baseProperties ?? {}) };\n  const resolve = (property:string) => resolveEffectModifiedProperty(\n    ctx.state.effects,\n    targetId,\n    property,\n    { ...inputs, [property]:inputs[property] ?? 0 },\n  );\n  const reduction = resolve("damage.reduction");\n  const threshold = resolve("damage.threshold");\n  for (const entry of [reduction, threshold]) {\n    if (!Number.isInteger(entry.value) || entry.value < 0) {\n      throw new DomainEvaluationError(`${entry.property} must resolve to a non-negative integer`);\n    }\n  }\n  const reductions:DamageReductionContribution[] = reduction.value > 0\n    ? [{ source:"property:damage.reduction", amount:reduction.value }]\n    : [];\n  const thresholds:DamageThresholdContribution[] = threshold.value > 0\n    ? [{ source:"property:damage.threshold", threshold:threshold.value }]\n    : [];\n  return { reductions, thresholds, provenance:[...reduction.provenance, ...threshold.provenance] };\n}\n'''
              if text.count(marker)!=1: raise SystemExit('health mitigation helper marker mismatch')
              text=text.replace(marker,helper+marker,1)

          old='''  const damage = resolveDamage({ damageType:operation.damageType, amount, hp:beforeHp, adjustments:operation.adjustments, defenses });\n  return finalizeDamage(\n'''
          new='''  const mitigation = structuralDamageMitigation(ctx, operation.targetId);\n  const damage = resolveDamage({\n    damageType:operation.damageType,\n    amount,\n    hp:beforeHp,\n    adjustments:operation.adjustments,\n    defenses,\n    reductions:mitigation.reductions,\n    thresholds:mitigation.thresholds,\n  });\n  damage.provenance.unshift(...mitigation.provenance);\n  return finalizeDamage(\n'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit('executeDamage anchor mismatch')
              text=text.replace(old,new,1)

          old='''  const damage = resolveCompoundDamage({\n    hp:beforeHp,\n    components:operation.components.map((component) => ({\n      damageType:component.damageType,\n      amount:valueFromResult(ctx.results, component.amount),\n      adjustments:component.adjustments,\n      defenses:[...commonDefenses, ...(component.defenses ?? [])],\n    })),\n  });\n'''
          new='''  const mitigation = structuralDamageMitigation(ctx, operation.targetId);\n  const damage = resolveCompoundDamage({\n    hp:beforeHp,\n    components:operation.components.map((component) => ({\n      damageType:component.damageType,\n      amount:valueFromResult(ctx.results, component.amount),\n      adjustments:component.adjustments,\n      defenses:[...commonDefenses, ...(component.defenses ?? [])],\n    })),\n    reductions:mitigation.reductions,\n    thresholds:mitigation.thresholds,\n  });\n  damage.provenance.unshift(...mitigation.provenance);\n'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit('compound health anchor mismatch')
              text=text.replace(old,new,1)
          health.write_text(text,encoding='utf-8')
          PY
      - name: Add production mitigation regression
        run: |
          if ! grep -q "portable structural damage reduction and threshold" tests/ui/c9FamilyLDamageDefenseProduction.test.ts; then
            cat >> tests/ui/c9FamilyLDamageDefenseProduction.test.ts <<'TS'

          function mitigationPackage(prefix:string,property:"damage.reduction"|"damage.threshold",value:number) {
            const moduleId=`${prefix}.module`,contentId=`${prefix}.option`,mechanicId=`${prefix}.damage`;
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Portable Damage Mitigation Probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],content:[{
                id:contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:"Portable Mitigation",locales:{en:{name:"Portable Mitigation"}}},
                mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[
                  {id:"mitigate",invocation:"manual",targeting:{from:"targets",min:1,max:1},operations:[{
                    kind:"property.modify",property,operation:"add",value:{value},target:"target",owner:"effect",source:"definition",
                    duration:{kind:"elapsed",amount:{value:1},unit:"hours"},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:"stack",
                  }]},
                  {id:"hit",invocation:"manual",targeting:{from:"targets",min:1,max:1},operations:[{kind:"damage.apply",amount:{value:4},damageType:"fire",target:"target"}]},
                ]}}],
              }],
            })};
          }

          async function executePortableMitigation(prefix:string,property:"damage.reduction"|"damage.threshold",value:number) {
            const adapter=new MockAdapter();
            const pack=mitigationPackage(prefix,property,value);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const action=(entryPointId:string)=>installedCommonPlayActionId({
              catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),
              mechanicId:pack.mechanicId,
              entryPointId,
            });
            let snapshot=await adapter.resolveAction(action("mitigate"),[TARGET_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const before=hp(snapshot,TARGET_ID);
            snapshot=await adapter.resolveAction(action("hit"),[TARGET_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const dealt=before-hp(snapshot,TARGET_ID);
            await adapter.undoLastResolution();
            assert.equal(hp(await adapter.getSnapshot(),TARGET_ID),before,"event-native Undo must restore mitigated damage");
            return dealt;
          }

          test("unknown installed damage.apply consumes portable structural damage reduction and threshold with rename invariance and Undo",async()=>{
            assert.equal(await executePortableMitigation("external.family-l-property-reduction","damage.reduction",3),1);
            assert.equal(await executePortableMitigation("completely.renamed-family-l-property-reduction","damage.reduction",3),1);
            assert.equal(await executePortableMitigation("external.family-l-threshold","damage.threshold",5),0);
            assert.equal(await executePortableMitigation("completely.renamed-family-l-threshold","damage.threshold",5),0);
            assert.equal(await executePortableMitigation("external.family-l-threshold-equal","damage.threshold",4),4,"meeting the threshold must preserve full damage");
          });
          TS
          fi
      - name: Verify Family L damage mitigation
        run: |
          node --import tsx --test tests/domain/damage.test.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
          git diff --check
      - name: Publish verified change and clean staging workflows
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          rm -f .github/workflows/c9-family-l-damage-mitigation-71304.yml
          rm -f .github/workflows/c9-family-l-damage-mitigation-r2-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/damage.ts src/domain/resolutionHealthOps.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts .github/workflows/c9-family-l-damage-mitigation-71304.yml .github/workflows/c9-family-l-damage-mitigation-r2-71304.yml
          if git diff --cached --quiet; then
            echo "No verified changes to publish"
            exit 0
          fi
          git commit -m "feat(c9): consume structural damage mitigation"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
