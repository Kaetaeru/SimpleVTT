name: C9 Family Q R3 Fixture Fix 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-r3-fixture-fix-71304.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Repair mandatory Reaction payment in Q authority probe
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-q-authority-responders-r3-71304.yml')
          text=path.read_text(encoding='utf-8')
          old='id:`external.authority.${responder}`,entryPoints:'
          new='id:`external.authority.${responder}`,payments:[{kind:"economy",bucket:"reaction",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],entryPoints:'
          if text.count(old)!=1:
              raise SystemExit(f'expected one authority fixture anchor, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Publish repaired fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-q-authority-responders-r3-71304.yml
          git rm .github/workflows/c9-family-q-r3-fixture-fix-71304.yml
          git commit -m "test(c9): preserve Reaction payment in authority probe"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
