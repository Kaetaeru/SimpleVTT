name: C9 Family H Profile Acquisition 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-profile-acquisition-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-h-profile-acquisition-71304
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Add generic RulesProfile sense acquisition proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          test_path=Path('tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts')
          text=test_path.read_text(encoding='utf-8')

          old='eligibilityExpectations:{light?:"bright"|"dim"|"darkness";obscurement?:"none"|"light"|"heavy"}={},'
          new='eligibilityExpectations:{light?:"bright"|"dim"|"darkness";obscurement?:"none"|"light"|"heavy";canSee?:boolean}={},'
          if old in text:
              text=text.replace(old,new)
          elif text.count(new)<2:
              raise SystemExit('eligibility expectation signature anchor not found')

          old='{op:"eq",left:{ref:"source-sees-trigger"},right:{value:true}},'
          new='{op:"eq",left:{ref:"source-sees-trigger"},right:{value:eligibilityExpectations.canSee??true}},'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('sense.can-see predicate anchor not found')

          old='function seedRulesProfileSense(adapter:MockAdapter,sourceId:string,rangeFeet:number){'
          new='function seedRulesProfileSense(adapter:MockAdapter,sourceId:string,property:string,rangeFeet:number){'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('RulesProfile sense helper signature anchor not found')

          old='kind:"property.modify",property:"sense.darkvision.range-feet",operation:"set",value:{value:rangeFeet},target:"actor",owner:"effect",source:"definition",'
          new='kind:"property.modify",property,operation:"set",value:{value:rangeFeet},target:"actor",owner:"effect",source:"definition",'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('RulesProfile sense property anchor not found')

          old='seedRulesProfileSense(adapter,`${identity.moduleId}.darkvision`,60);'
          new='seedRulesProfileSense(adapter,`${identity.moduleId}.darkvision`,"sense.darkvision.range-feet",60);'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('existing Darkvision sense seed call anchor not found')

          test_name='portable production derives every RulesProfile special sense from generic property modifiers'
          if test_name not in text:
              text += '''\n\ntest("portable production derives every RulesProfile special sense from generic property modifiers",async()=>{\n  const renamed:Identity={...ORIGINAL,moduleId:"external.profile-sense-matrix-renamed",contentId:"item.profile-sense-matrix-renamed",mechanicId:"mechanic.profile-sense-matrix-renamed",interceptorId:"interceptor.profile-sense-matrix-renamed",interactionId:"interaction.profile-sense-matrix-renamed",displayName:"Renamed Profile Sense Matrix"};\n  const scenarios=[\n    {label:"darkvision",property:"sense.darkvision.range-feet",light:"darkness" as const,obscurement:"none" as const,visible:true,targetInvisible:false,sharedGroundContact:false,canSee:true},\n    {label:"blindsight",property:"sense.blindsight.range-feet",light:"dim" as const,obscurement:"heavy" as const,visible:true,targetInvisible:true,sharedGroundContact:false,canSee:true},\n    {label:"tremorsense",property:"sense.tremorsense.range-feet",light:"dim" as const,obscurement:"none" as const,visible:false,targetInvisible:true,sharedGroundContact:true,canSee:false},\n    {label:"truesight",property:"sense.truesight.range-feet",light:"darkness" as const,obscurement:"none" as const,visible:true,targetInvisible:true,sharedGroundContact:false,canSee:true},\n  ];\n  for(const identity of [ORIGINAL,renamed]){\n    for(const scenario of scenarios){\n      const adapter=await prepare(identity,true,"d20",[{kind:"roll.modify",mode:"subtract-die",dice:"1d8"}],undefined,{light:scenario.light,obscurement:scenario.obscurement,canSee:scenario.canSee});\n      const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n      setSpatialRelation(internal.scene,{\n        sourceId:internal.activeCharacter.id,targetId:OTHER_CHARACTER_ID,distanceFeet:30,visible:scenario.visible,cover:"none",targetCanSeeAttacker:true,\n        light:scenario.light,obscurement:scenario.obscurement,targetInvisible:scenario.targetInvisible,sharedGroundContact:scenario.sharedGroundContact,\n        provenance:`profile:test-generic-acquisition:${scenario.label}`,\n      });\n      seedRulesProfileSense(adapter,`${identity.moduleId}.${scenario.label}`,scenario.property,60);\n      seedHiddenRuntimeEffect(adapter,OTHER_CHARACTER_ID);\n      let snapshot=await openAbilityCheckInterrupt(adapter);\n      assert.equal(snapshot.resolution?.stage,"interrupt",`${scenario.label}: ${JSON.stringify(snapshot.resolution)}`);\n      snapshot=await adapter.respondToInterrupt(false);\n      assert.equal(snapshot.resolution?.stage,"complete",`${scenario.label}: ${JSON.stringify(snapshot.resolution)}`);\n    }\n  }\n});\n'''
          test_path.write_text(text,encoding='utf-8')

          ledger_path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger_path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry.get('family')=='H')
          if row.get('disposition') not in {'INCOMPLETE','IMPLEMENTED'}:
              raise SystemExit(f"unexpected Family H disposition: {row.get('disposition')}")
          row['currentState']=(
              'Generic status, visibility, Hidden/Invisible, sensing, and discovery paths are production-proven through Common Play/Resolver authority. RulesProfile-owned numeric Darkvision, Blindsight, Tremorsense, and Truesight ranges are acquired through generic property.modify effects and resolved structurally into authoritative observer senses; production can-see/detected composition remains identity-independent. Portable Wisdom Search/discovery uses unknown external Common Play with Resolver-owned effect removal, failure preservation, event-native Undo, and external identity rename. Family H has no remaining named execution seam.'
          )
          row['disposition']='IMPLEMENTED'
          def add_unique(key,value):
              items=row.setdefault(key,[])
              if value not in items: items.append(value)
          add_unique('implementationEvidence','commonPlayInterceptorProductionRuntimeAdapter.ts resolves sense.darkvision/blindsight/tremorsense/truesight.range-feet through resolveRuntimeProfileProperty over generic property.modify effects before shared resolveCommonPlaySenses composition')
          add_unique('productionEvidence','installedCommonPlayInterceptorProductionRuntime.test.ts proves generic RulesProfile property modifiers acquire Darkvision, Blindsight, Tremorsense, and Truesight in production; Tremorsense proves detected=true while can-see=false')
          add_unique('identityInvarianceEvidence','installedCommonPlayInterceptorProductionRuntime.test.ts RulesProfile special-sense acquisition matrix preserves all four sensing semantics after full external module/content/mechanic/interceptor/interaction/display rename')
          row['remainingNamedSeams']=[]
          ledger_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family H completion
        run: |
          node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified proof and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-h-profile-acquisition-71304.yml
          git add tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "test(c9): complete rules-profile sense acquisition"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
