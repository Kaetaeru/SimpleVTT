name: C9 Legacy Boundary Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-legacy-boundary-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile canonical composition baseline
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='.agents/LEGACY_EXECUTION_BASELINE.json';
          const baseline=JSON.parse(fs.readFileSync(path,'utf8'));
          const old=baseline.entries.filter(e=>e.module==='./unarmedControlRuntimeAdapter');
          const existing=baseline.entries.filter(e=>e.module==='./structuralSaveConditionRuntimeAdapter');
          if(existing.length===0){
            if(old.length!==1) throw new Error(`expected one stale unarmed baseline entry, got ${old.length}`);
            old[0].module='./structuralSaveConditionRuntimeAdapter';
            old[0].classification='GENERIC_ENGINE';
          } else {
            if(existing.length!==1||existing[0].classification!=='GENERIC_ENGINE') throw new Error('structural save baseline classification mismatch');
            baseline.entries=baseline.entries.filter(e=>e.module!=='./unarmedControlRuntimeAdapter');
          }
          fs.writeFileSync(path,JSON.stringify(baseline,null,2)+'\n');
          NODE
      - name: Verify canonical boundary
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified baseline and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/LEGACY_EXECUTION_BASELINE.json
          git rm .github/workflows/c9-legacy-boundary-reconcile-71304.yml
          git commit -m "chore(c9): reconcile structural save execution baseline"
          for attempt in $(seq 1 10); do
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 1
          done
          exit 1
