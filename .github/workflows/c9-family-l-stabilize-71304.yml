name: C9 Family L Portable Stabilization 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-l-stabilize-71304.yml"

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile branch before patch
        shell: bash
        run: git pull --rebase origin "$GITHUB_REF_NAME"
      - run: npm ci
      - name: Route portable stabilization through generic Resolver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found: {path}")
              p.write_text(text.replace(old,new,1),encoding="utf-8")

          source="src/domain/commonPlayOperationRuntime.ts"
          replace(
              source,
              'type CommonPlayTemporaryHpGrant={\n  kind:"temp-hp.grant";\n  amount:LiteralNumberExpression;\n  target?:CommonPlayHpTarget;\n  choice?:"keep-existing"|"take-new";\n};\n\ntype CommonPlayRollModify={',
              'type CommonPlayTemporaryHpGrant={\n  kind:"temp-hp.grant";\n  amount:LiteralNumberExpression;\n  target?:CommonPlayHpTarget;\n  choice?:"keep-existing"|"take-new";\n};\n\ntype CommonPlayLifeStabilize={\n  kind:"life.stabilize";\n  target?:CommonPlayHpTarget;\n};\n\ntype CommonPlayRollModify={',
          )
          replace(
              source,
              '  |CommonPlayHealingApply\n  |CommonPlayTemporaryHpGrant\n  |CommonPlayMovementDefinition',
              '  |CommonPlayHealingApply\n  |CommonPlayTemporaryHpGrant\n  |CommonPlayLifeStabilize\n  |CommonPlayMovementDefinition',
          )
          replace(
              source,
              'const TEMP_HP_GRANT_KEYS=new Set(["kind","amount","target","choice"]);\nconst ROLL_MODIFY_KEYS=',
              'const TEMP_HP_GRANT_KEYS=new Set(["kind","amount","target","choice"]);\nconst LIFE_STABILIZE_KEYS=new Set(["kind","target"]);\nconst ROLL_MODIFY_KEYS=',
          )
          replace(
              source,
              '  if(operation.kind==="temp-hp.grant") {\n    supportedKeys(operation,TEMP_HP_GRANT_KEYS,label);\n    const choice=operation.choice;\n    if(choice!==undefined&&choice!=="keep-existing"&&choice!=="take-new") throw new DomainEvaluationError(`${label}.choice must be keep-existing or take-new`);\n    return {\n      kind:"temp-hp.grant",\n      amount:nonNegativeLiteralExpression(operation.amount,`${label}.amount`),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n      ...(choice===undefined?{}:{choice}),\n    };\n  }\n  throw new DomainEvaluationError(`unsupported Common Play operation: ${String(operation.kind)}`);',
              '  if(operation.kind==="temp-hp.grant") {\n    supportedKeys(operation,TEMP_HP_GRANT_KEYS,label);\n    const choice=operation.choice;\n    if(choice!==undefined&&choice!=="keep-existing"&&choice!=="take-new") throw new DomainEvaluationError(`${label}.choice must be keep-existing or take-new`);\n    return {\n      kind:"temp-hp.grant",\n      amount:nonNegativeLiteralExpression(operation.amount,`${label}.amount`),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n      ...(choice===undefined?{}:{choice}),\n    };\n  }\n  if(operation.kind==="life.stabilize") {\n    supportedKeys(operation,LIFE_STABILIZE_KEYS,label);\n    return {kind:"life.stabilize",...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)})};\n  }\n  throw new DomainEvaluationError(`unsupported Common Play operation: ${String(operation.kind)}`);',
          )
          replace(
              source,
              'if((entryPoint.targeting?.max??1)>1&&entryPoint.operations.some((operation)=>(operation.kind==="damage.apply"||operation.kind==="healing.apply"||operation.kind==="temp-hp.grant")&&operation.target==="target")) {',
              'if((entryPoint.targeting?.max??1)>1&&entryPoint.operations.some((operation)=>(operation.kind==="damage.apply"||operation.kind==="healing.apply"||operation.kind==="temp-hp.grant"||operation.kind==="life.stabilize")&&operation.target==="target")) {',
          )
          replace(
              source,
              '    if(operation.kind==="temp-hp.grant") {\n      operations.push({\n        id:operationId,\n        kind:"temporary-hp",\n        targetId:hpOperationTarget(operation.target,input),\n        amount:literalInteger(operation.amount,"temp-hp.grant amount"),\n        source:`common-play:${supported.id}:${entryPoint.id}:operation:${index}`,\n        ...(operation.choice===undefined?{}:{choice:operation.choice}),\n      });\n      continue;\n    }\n\n    if(operation.kind==="movement.stand") {',
              '    if(operation.kind==="temp-hp.grant") {\n      operations.push({\n        id:operationId,\n        kind:"temporary-hp",\n        targetId:hpOperationTarget(operation.target,input),\n        amount:literalInteger(operation.amount,"temp-hp.grant amount"),\n        source:`common-play:${supported.id}:${entryPoint.id}:operation:${index}`,\n        ...(operation.choice===undefined?{}:{choice:operation.choice}),\n      });\n      continue;\n    }\n\n    if(operation.kind==="life.stabilize") {\n      operations.push({id:operationId,kind:"stabilize",targetId:hpOperationTarget(operation.target,input)});\n      continue;\n    }\n\n    if(operation.kind==="movement.stand") {',
          )

          schema="schemas/common-play-contract.schema.json"
          replace(
              schema,
              '        {\n          "$ref": "#/$defs/tempHpGrant"\n        },\n        {\n          "$ref": "#/$defs/resourceChange"\n        },',
              '        {\n          "$ref": "#/$defs/tempHpGrant"\n        },\n        {\n          "$ref": "#/$defs/lifeStabilize"\n        },\n        {\n          "$ref": "#/$defs/resourceChange"\n        },',
          )
          replace(
              schema,
              '    "resourceChange": {\n      "type": "object",',
              '    "lifeStabilize": {\n      "type": "object",\n      "required": [\n        "kind"\n      ],\n      "properties": {\n        "kind": {\n          "const": "life.stabilize"\n        },\n        "target": {\n          "enum": [\n            "actor",\n            "self",\n            "target"\n          ]\n        }\n      },\n      "additionalProperties": false\n    },\n    "resourceChange": {\n      "type": "object",',
          )

          test_path=Path("tests/domain/c9FamilyLStabilizationCommonPlay.test.ts")
          test_content='''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\nimport {\n  compileCommonPlayEntryPointOperations,\n  parseManualCommonPlayOperationDefinition,\n  resolveCommonPlayEntryPointOperations,\n} from "../../src/domain/commonPlayOperationRuntime";\nimport { runtimeState, TEST_PROFILE } from "./rulesTestState";\n\nconst AUTHORED={\n  schemaVersion:"0.2-draft",\n  id:"external.unknown.family-l-stabilization",\n  entryPoints:[{\n    id:"stabilize-target",\n    invocation:"manual",\n    operations:[{kind:"life.stabilize",target:"target"}],\n  }],\n};\n\nfunction dyingState() {\n  const state=runtimeState();\n  state.combatants.goblin.life.hp.current=0;\n  state.combatants.goblin.life.unconscious=true;\n  state.combatants.goblin.life.deathSaves={successes:1,failures:2};\n  return state;\n}\n\ntest("unknown Common Play lowers portable stabilization through the generic Resolver",()=>{\n  const parsed=parseManualCommonPlayOperationDefinition(AUTHORED);\n  const state=dyingState();\n  const input={resolutionId:"external-stabilize",actorId:"hero",targetId:"goblin",entryPointId:"stabilize-target"};\n  const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,input);\n  assert.deepEqual(pending.operations.map((operation)=>operation.kind),["stabilize"]);\n  assert.equal((pending.operations[0] as {targetId?:string}).targetId,"goblin");\n\n  const result=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,input);\n  assert.equal(result.status,"committed");\n  if(result.status!=="committed") return;\n  assert.equal(result.state.combatants.goblin.life.stable,true);\n  assert.equal(result.state.combatants.goblin.life.unconscious,true);\n  assert.deepEqual(result.state.combatants.goblin.life.deathSaves,{successes:0,failures:0});\n  assert.equal(result.events.some((event)=>event.kind==="stabilize"&&event.targetId==="goblin"),true);\n});\n\ntest("portable stabilization is invariant under external definition and entry-point rename",()=>{\n  const execute=(definition:typeof AUTHORED,entryPointId:string)=>{\n    const result=resolveCommonPlayEntryPointOperations(TEST_PROFILE,dyingState(),parseManualCommonPlayOperationDefinition(definition),{\n      resolutionId:"renamed-stabilize",actorId:"hero",targetId:"goblin",entryPointId,\n    });\n    assert.equal(result.status,"committed");\n    if(result.status!=="committed") return undefined;\n    return {life:result.state.combatants.goblin.life,eventKind:result.events.at(-1)?.kind};\n  };\n  const renamed=structuredClone(AUTHORED);\n  renamed.id="external.unknown.family-l-stabilization-renamed";\n  renamed.entryPoints[0].id="renamed-stabilize";\n  assert.deepEqual(execute(renamed,"renamed-stabilize"),execute(AUTHORED,"stabilize-target"));\n});\n\ntest("portable stabilization rejects named target dispatch and is present in the public schema",()=>{\n  const invalid=structuredClone(AUTHORED) as any;\n  invalid.entryPoints[0].operations[0].target="named-goblin";\n  assert.throws(()=>parseManualCommonPlayOperationDefinition(invalid),/actor, self, or target/);\n\n  const schema=JSON.parse(readFileSync(new URL("../../schemas/common-play-contract.schema.json",import.meta.url),"utf8"));\n  assert.equal(schema.$defs.lifeStabilize.properties.kind.const,"life.stabilize");\n  assert.equal(schema.$defs.operation.oneOf.some((entry:{"$ref"?:string})=>entry.$ref==="#/$defs/lifeStabilize"),true);\n});\n'''
          if test_path.exists() and test_path.read_text(encoding="utf-8")!=test_content:
              raise SystemExit(f"unexpected existing test: {test_path}")
          test_path.write_text(test_content,encoding="utf-8")
          PY
      - name: Verify Family L stabilization slice
        run: |
          npx tsx --test tests/domain/c9FamilyLStabilizationCommonPlay.test.ts tests/domain/commonPlayHpRuntime.test.ts tests/domain/lifeTransitions.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Commit verified slice and retire workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-l-stabilize-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/domain/c9FamilyLStabilizationCommonPlay.test.ts .github/workflows/c9-family-l-stabilize-71304.yml
          git commit -m "feat(c9): route portable stabilization through Resolver"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
