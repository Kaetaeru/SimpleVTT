name: C9 connected undo history repair

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-connected-undo-history-7130.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Instrument event-native Undo stages
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/app/runtimeResolutionUndoAdapter.ts')
          text=path.read_text()
          old='''  if (projected.status==="rejected") return internal.getSnapshot();\n\n  const writeBack=await persistCharacterResolutionEvents(this,history.events,"inverse");\n  if (writeBack.status==="rejected") return internal.getSnapshot();\n'''
          new='''  console.log("C9_UNDO_STAGE",JSON.stringify({stage:"projection",status:projected.status,error:projected.status==="rejected"?projected.error:undefined,runtimeRevision:runtimeState?.revision,projectedRevision:projected.status==="committed"?projected.runtimeState?.revision:undefined}));\n  if (projected.status==="rejected") return internal.getSnapshot();\n\n  const writeBack=await persistCharacterResolutionEvents(this,history.events,"inverse");\n  console.log("C9_UNDO_STAGE",JSON.stringify({stage:"writeBack",...writeBack}));\n  if (writeBack.status==="rejected") return internal.getSnapshot();\n'''
          if text.count(old)!=1: raise SystemExit('expected projection/writeback gate exactly once')
          text=text.replace(old,new,1)
          old2='''    if (!committed) {\n      if (writeBack.changed) await persistCharacterResolutionEvents(this,history.events,"forward");\n      return internal.getSnapshot();\n    }\n'''
          new2='''    console.log("C9_UNDO_STAGE",JSON.stringify({stage:"turnCommit",committed,expectedRevision:runtimeState.revision,nextRevision:projected.runtimeState.revision}));\n    if (!committed) {\n      if (writeBack.changed) await persistCharacterResolutionEvents(this,history.events,"forward");\n      return internal.getSnapshot();\n    }\n'''
          if text.count(old2)!=1: raise SystemExit('expected turn commit gate exactly once')
          path.write_text(text.replace(old2,new2,1))
          PY
      - name: Run actor artifact Undo diagnostics
        run: npx tsx --test tests/ui/connectedActorArtifactReconnectProduction.test.ts
