name: C9 connected undo history repair

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-connected-undo-history-7130.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Undo overrides
        run: grep -R -n -E 'undoLastResolution|previousUndoLastResolution' src/app | head -200
