name: C9 Family G Ledger 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-g-ledger-7130.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile Family G evidence atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=docs/rules/v1-mechanism-coverage-ledger.json
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text())
          row=next(row for row in data["rows"] if row["family"]=="G" and row["id"]=="spatial-geometry")
          assert row["disposition"]=="INCOMPLETE"
          row["currentState"]=(
              "Family G uses authoritative provider/manual spatial facts rather than Core geometry fabrication, as required by the architecture charter. The standard fact registry covers distance, adjacency, reach, size category, occupied space, line-of-effect, Total Cover, area membership, legal destination, and placement; the typed selector contract carries line/cone/cube/sphere/cylinder/emanation shape, origin, dimensions, and range. Connected owner-authority spatial requests resume on reconnect, reject stale peers, and deduplicate retries. Family G remains incomplete only until durable adapter/process-restart persistence for in-flight spatial decisions is proven."
          )
          implementation="commonPlaySpatialFactRuntime.ts COMMON_PLAY_STANDARD_FACTS defines provider/manual authority for distance, adjacency, reach, size category, occupied space, line-of-effect, Total Cover, area membership, legal destination, and placement with normalized answers"
          row["implementationEvidence"]=[entry for entry in row["implementationEvidence"] if not entry.startswith("commonPlaySpatialFactRuntime.ts COMMON_PLAY_STANDARD_FACTS defines provider/manual authority for spatial.distance-feet") and not entry.startswith("commonPlaySpatialFactRuntime.ts COMMON_PLAY_STANDARD_FACTS defines provider/manual authority for distance, adjacency, reach, size category")]
          row["implementationEvidence"].insert(0,implementation)
          production="c9FamilyGSizeSpaceFacts.test.ts proves provider-authoritative size-category/space-feet values, external identity invariance, and explicit DM manual authority without Core geometry fabrication"
          if production not in row["productionEvidence"]: row["productionEvidence"].append(production)
          identity="c9FamilyGSizeSpaceFacts.test.ts proves size/space semantics are unchanged under unrelated external resolution identities"
          if identity not in row["identityInvarianceEvidence"]: row["identityInvarianceEvidence"].append(identity)
          row["remainingNamedSeams"]=["durable adapter/process-restart persistence for in-flight spatial decisions remains absent; connected reconnect/retry routing is already covered"]
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            sha=$(git ls-tree HEAD "$path" | awk '{print $3}')
            python - "$path" "$sha" "$branch" <<'PY'
          import base64,json,sys
          path,sha,branch=sys.argv[1:]
          payload={
              "message":"docs(c9): record spatial size and space evidence",
              "content":base64.b64encode(open(path,"rb").read()).decode("ascii"),
              "sha":sha,
              "branch":branch,
          }
          with open("/tmp/c9-family-g-ledger-payload.json","w",encoding="utf-8") as handle:
              json.dump(payload,handle)
          PY
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --input /tmp/c9-family-g-ledger-payload.json >/tmp/c9-family-g-ledger.json; then
              cat /tmp/c9-family-g-ledger.json
              exit 0
            fi
          done
          exit 1
