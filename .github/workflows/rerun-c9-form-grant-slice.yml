name: C9 Portable Form Granted Actions

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/rerun-c9-form-grant-slice.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply bounded Family W form projection slice
        run: node .github/rerun-c9-form-grant-slice.mjs
      - name: Generate content
        run: npm run generate:content
      - name: Verify focused installed Common Play production
        run: npx tsx --test tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Commit verified Family W slice
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
          git commit -m "feat(common-play): project form granted actions"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
