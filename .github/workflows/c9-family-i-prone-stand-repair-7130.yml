name: C9 Family I Prone Stand Repair 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-prone-stand-repair-7130.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Tighten parse marker and retire repair workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-i-prone-stand-7130.yml')
          text=path.read_text(encoding='utf-8')
          old="marker='''  if(operation.kind===\"movement.relocate\") {\\n'''"
          if old not in text:
              old="marker='''  if(operation.kind==\"movement.relocate\") {\\n'''"
          new="marker='''\\n  if(operation.kind==\"movement.relocate\") {\\n'''"
          if text.count(old)!=1:
              raise SystemExit(f'expected one parse marker, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-i-prone-stand-repair-7130.yml
          git add .github/workflows/c9-family-i-prone-stand-7130.yml
          git commit -m "ci(c9): tighten prone stand verifier marker"
          branch=agent/c9-gate-n-coverage-reconciliation
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
