name: C9 patch portable d20 presentation

on:
  push:
    branches: ["agent/c9-gate-n-coverage-reconciliation"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Patch source and remove one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/app/installedCommonPlayRuntimeAdapter.ts")
          lines=p.read_text().splitlines()
          found=set()
          for i,line in enumerate(lines):
              stripped=line.strip()
              if stripped.startswith("rollKind:hp?.rollKind??"):
                  lines[i]='    rollKind:roll?(roll.family==="attack-roll"?"attack":roll.family==="saving-throw"?"save":"check"):hp?.rollKind,'
                  found.add("rollKind")
              elif stripped.startswith("authoritativeDice:hp?.authoritativeDice??"):
                  lines[i]='    authoritativeDice:roll?(roll.rollState==="normal"?[roll.natural]:roll.dice.faces):hp?.authoritativeDice,'
                  found.add("authoritativeDice")
              elif stripped.startswith("rollTotal:hp?.rollTotal??roll?.total"):
                  lines[i]='    rollTotal:roll?.total??hp?.rollTotal,'
                  found.add("rollTotal")
          if found != {"rollKind","authoritativeDice","rollTotal"}:
              raise SystemExit(f"presentation fields not found exactly: {sorted(found)}")
          p.write_text("\n".join(lines)+"\n")
          PY
          rm .github/workflows/c9-fix-common-play-roll-presentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/installedCommonPlayRuntimeAdapter.ts .github/workflows/c9-fix-common-play-roll-presentation.yml
          git commit -m "fix(c9): preserve portable d20 presentation"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
