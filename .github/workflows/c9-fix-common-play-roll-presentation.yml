name: C9 patch portable d20 presentation

on:
  push:
    branches: ["agent/c9-gate-n-coverage-reconciliation"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Patch source and remove one-shot workflow
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/app/installedCommonPlayRuntimeAdapter.ts"); s=p.read_text(); old="    rollKind:hp?.rollKind??(roll?(roll.family==\"attack-roll\"?\"attack\":roll.family==\"saving-throw\"?\"save\":\"check\"):undefined),\n    authoritativeDice:hp?.authoritativeDice??(roll?.rollState==\"normal\"?[roll.natural]:roll?.dice.faces),\n    rollTotal:hp?.rollTotal??roll?.total,"; new="    rollKind:roll?(roll.family==\"attack-roll\"?\"attack\":roll.family==\"saving-throw\"?\"save\":\"check\"):hp?.rollKind,\n    authoritativeDice:roll?(roll.rollState==\"normal\"?[roll.natural]:roll.dice.faces):hp?.authoritativeDice,\n    rollTotal:roll?.total??hp?.rollTotal,"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          rm .github/workflows/c9-fix-common-play-roll-presentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/installedCommonPlayRuntimeAdapter.ts .github/workflows/c9-fix-common-play-roll-presentation.yml
          git commit -m "fix(c9): preserve portable d20 presentation"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
