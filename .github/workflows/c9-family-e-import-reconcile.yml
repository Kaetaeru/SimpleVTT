name: C9 Family E Import Reconcile

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-import-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile stale invalid-selector fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=path.read_text(encoding='utf-8')
          stale='    {from:"targets",min:1,max:2},\n'
          if text.count(stale)!=1:
              raise SystemExit(f'expected one stale bounded-selector fixture, got {text.count(stale)}')
          path.write_text(text.replace(stale,'',1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify targeting import rejection contract
        run: npx tsx --test --test-name-pattern="installed Common Play rejects unsupported targeting authoring before persistence" tests/ui/ruleModulePackageImport.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified fixture reconciliation
        shell: bash
        run: |
          rm -f .github/workflows/c9-family-e-import-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/ruleModulePackageImport.test.ts .github/workflows/c9-family-e-import-reconcile.yml
          git commit -m "test(c9): accept bounded selector import"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
