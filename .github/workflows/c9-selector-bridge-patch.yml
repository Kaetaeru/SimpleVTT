name: C9 Selector Bridge Patch

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-selector-bridge-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bridge rich selectors into Common Play operations
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');

          function replaceOne(path,before,after) {
            let text=fs.readFileSync(path,'utf8');
            const first=text.indexOf(before);
            if(first<0) throw new Error(`pattern not found in ${path}: ${before.slice(0,120)}`);
            if(text.indexOf(before,first+before.length)>=0) throw new Error(`pattern not unique in ${path}: ${before.slice(0,120)}`);
            text=text.slice(0,first)+after+text.slice(first+before.length);
            fs.writeFileSync(path,text);
          }

          replaceOne(
            'src/domain/commonPlaySelectorRuntime.ts',
            'import { resolveTargeting, type TargetingFactInput, type TargetingResolution } from "./targeting";',
            'import { resolveTargeting, type TargetingFactInput, type TargetingResolution, type TargetingRule } from "./targeting";'
          );
          replaceOne(
            'src/domain/commonPlaySelectorRuntime.ts',
            '  selection:"manual"|"automatic";\n  authority:"actor-owner"|"dm"|"host"|"provider";\n}',
            '  selection:"manual"|"automatic";\n  authority:"actor-owner"|"dm"|"host"|"provider";\n  targetingRule?:Partial<TargetingRule>;\n}'
          );
          replaceOne(
            'src/domain/commonPlaySelectorRuntime.ts',
            '    const targeting=resolveTargeting(input.sourceId,{\n      kind:"any",minTargets:min,maxTargets:max,directTarget:!input.selector.area,\n    },selected.map((candidate)=>candidate.targeting!));',
            '    const targeting=resolveTargeting(input.sourceId,{\n      kind:"any",\n      ...input.targetingRule,\n      minTargets:min,\n      maxTargets:max,\n      directTarget:input.targetingRule?.directTarget??!input.selector.area,\n    },selected.map((candidate)=>candidate.targeting!));'
          );

          replaceOne(
            'src/domain/commonPlayOperationRuntime.ts',
            'import type { CommonPlayFactAnswer, CommonPlayFactQuery } from "./commonPlaySpatialFactRuntime";',
            'import type { CommonPlayFactAnswer, CommonPlayFactQuery } from "./commonPlaySpatialFactRuntime";\nimport { resolveCommonPlaySelector, type CommonPlaySelector } from "./commonPlaySelectorRuntime";'
          );
          replaceOne(
            'src/domain/commonPlayOperationRuntime.ts',
            'export interface CommonPlayTargetingSelector {\n  from:"targets";\n  min:1;\n  max:1;\n}',
            'export type CommonPlayTargetingSelector=CommonPlaySelector & {from:"targets"};'
          );
          replaceOne(
            'src/domain/commonPlayOperationRuntime.ts',
            'const TARGETING_KEYS=new Set(["from","min","max"]);',
            'const TARGETING_KEYS=new Set(["from","where","min","max","orderBy","area"]);'
          );
          replaceOne(
            'src/domain/commonPlayOperationRuntime.ts',
            'function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {\n  const selector=object(value,label);\n  supportedKeys(selector,TARGETING_KEYS,label);\n  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  if(selector.min!==1||selector.max!==1) throw new DomainEvaluationError(`${label}.min and .max must both be 1 for portable Common Play targeting`);\n  return {from:"targets",min:1,max:1};\n}',
            'function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {\n  const selector=object(value,label);\n  supportedKeys(selector,TARGETING_KEYS,label);\n  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  if(selector.min!==undefined&&(typeof selector.min!=="number"||!Number.isInteger(selector.min)||selector.min<0)) {\n    throw new DomainEvaluationError(`${label}.min must be a non-negative integer`);\n  }\n  if(selector.max!==undefined&&(typeof selector.max!=="number"||!Number.isInteger(selector.max)||selector.max<0)) {\n    throw new DomainEvaluationError(`${label}.max must be a non-negative integer`);\n  }\n  const min=selector.min as number|undefined;\n  const max=selector.max as number|undefined;\n  if(max!==undefined&&max<(min??0)) throw new DomainEvaluationError(`${label}.max must be >= min`);\n  if(selector.where!==undefined&&typeof selector.where!=="boolean") object(selector.where,`${label}.where`);\n  const orderBy=selector.orderBy===undefined?undefined:nonEmptyString(selector.orderBy,`${label}.orderBy`);\n  const area=selector.area===undefined?undefined:structuredClone(object(selector.area,`${label}.area`)) as CommonPlayTargetingSelector["area"];\n  return {\n    from:"targets",\n    ...(selector.where===undefined?{}:{where:structuredClone(selector.where) as CommonPlayTargetingSelector["where"]}),\n    ...(min===undefined?{}:{min}),\n    ...(max===undefined?{}:{max}),\n    ...(orderBy===undefined?{}:{orderBy}),\n    ...(area===undefined?{}:{area}),\n  };\n}'
          );
          replaceOne(
            'src/domain/commonPlayOperationRuntime.ts',
            '  if(entryPoint.targeting) {\n    if(!input.targetingTargets) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires pre-resolved targeting facts`);\n    if(input.targetingTargets.length===1&&input.targetId!==undefined&&input.targetId!==input.targetingTargets[0].id) {\n      throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");\n    }\n    operations.push({\n      id:`${input.resolutionId}:targeting`,\n      kind:"targeting",\n      sourceId:input.actorId,\n      rule:{kind:"creature",minTargets:1,maxTargets:1,directTarget:false},\n      targets:input.targetingTargets.map((target)=>({...target})),\n    });\n  }',
            '  if(entryPoint.targeting) {\n    if(!input.targetingTargets) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires pre-resolved targeting facts`);\n    const candidates=input.targetingTargets.map((target)=>({\n      id:target.id,\n      targeting:{...target},\n      properties:{relation:target.relation,kind:target.kind},\n    }));\n    const selection=resolveCommonPlaySelector({\n      sourceId:input.actorId,\n      selector:entryPoint.targeting,\n      candidates,\n      selectedIds:input.targetingTargets.map((target)=>target.id),\n      selection:"manual",\n      authority:"actor-owner",\n      targetingRule:{directTarget:false},\n    });\n    if(selection.status!=="resolved") throw new DomainEvaluationError(`Common Play targeting ${selection.status}: ${selection.reason}`);\n    const targetFacts=selection.targetIds.map((id)=>{\n      const candidate=candidates.find((entry)=>entry.id===id);\n      if(!candidate?.targeting) throw new DomainEvaluationError(`Common Play targeting fact missing for selected target: ${id}`);\n      return {...candidate.targeting};\n    });\n    if(targetFacts.length===1&&input.targetId!==undefined&&input.targetId!==targetFacts[0].id) {\n      throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");\n    }\n    const singleTargetDownstream=entryPoint.operations.some((operation)=>(operation.kind==="damage.apply"||operation.kind==="healing.apply")&&operation.target==="target");\n    if(singleTargetDownstream&&targetFacts.length!==1) {\n      throw new DomainEvaluationError("Common Play singular downstream target requires exactly one selected target");\n    }\n    operations.push({\n      id:`${input.resolutionId}:targeting`,\n      kind:"targeting",\n      sourceId:input.actorId,\n      rule:{kind:"any",minTargets:entryPoint.targeting.min??0,maxTargets:entryPoint.targeting.max??candidates.length,directTarget:false},\n      targets:targetFacts,\n    });\n  }'
          );

          const targetingTest='tests/domain/commonPlayTargetingRuntime.test.ts';
          replaceOne(
            targetingTest,
            'test("unsupported Common Play selector shapes reject explicitly",()=>{\n  const invalid:Array<[Record<string,unknown>,RegExp]>=[\n    [{from:"actors",min:1,max:1},/from must be targets/],\n    [{from:"artifacts",min:1,max:1},/from must be targets/],\n    [{from:"targets",where:{value:true},min:1,max:1},/unsupported fields: where/],\n    [{from:"targets",orderBy:"distance",min:1,max:1},/unsupported fields: orderBy/],\n    [{from:"targets",area:{kind:"instant"},min:1,max:1},/unsupported fields: area/],\n    [{from:"targets",min:0,max:1},/min and .max must both be 1/],\n    [{from:"targets",min:1,max:2},/min and .max must both be 1/],\n  ];\n  for(const [selector,message] of invalid) {\n    const definition=structuredClone(AUTHORED);\n    definition.entryPoints[0].targeting=selector;\n    assert.throws(()=>parseManualCommonPlayOperationDefinition(definition),message);\n  }\n});',
            'test("Common Play targeting selector rejects non-target domains and invalid bounds",()=>{\n  const invalid:Array<[Record<string,unknown>,RegExp]>=[\n    [{from:"actors",min:1,max:1},/from must be targets/],\n    [{from:"artifacts",min:1,max:1},/from must be targets/],\n    [{from:"targets",min:-1,max:1},/min must be a non-negative integer/],\n    [{from:"targets",min:2,max:1},/max must be >= min/],\n    [{from:"targets",min:1,max:2,orderBy:""},/orderBy must be a non-empty string/],\n  ];\n  for(const [selector,message] of invalid) {\n    const definition=structuredClone(AUTHORED);\n    definition.entryPoints[0].targeting=selector;\n    assert.throws(()=>parseManualCommonPlayOperationDefinition(definition),message);\n  }\n});\n\ntest("rich Common Play selector filters and validates multiple manual targets through the existing targeting Resolver",()=>{\n  const authored=structuredClone(AUTHORED);\n  authored.entryPoints[0].targeting={from:"targets",min:1,max:2,orderBy:"id",where:{op:"relation-matches",ref:"relation",value:"enemy"}};\n  authored.entryPoints[0].operations=[];\n  const definition=parseManualCommonPlayOperationDefinition(authored);\n  const state=runtimeState();\n  state.combatants.orc=structuredClone(state.combatants.goblin);\n  state.combatants.orc.id="orc";\n  const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition,{\n    resolutionId:"rich-targeting",actorId:"hero",entryPointId:"mend-other",\n    targetingTargets:[target("goblin","enemy"),target("orc","enemy")],\n  });\n  assert.equal(committed.status,"committed");\n  if(committed.status==="committed") {\n    assert.deepEqual((committed.results["rich-targeting:targeting"] as {targets:Array<{targetId:string}>}).targets.map((entry)=>entry.targetId),["goblin","orc"]);\n  }\n\n  const rejected=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition,{\n    resolutionId:"rich-targeting-ineligible",actorId:"hero",entryPointId:"mend-other",\n    targetingTargets:[target("hero","self")],\n  });\n  assert.equal(rejected.status,"rejected");\n  if(rejected.status==="rejected") assert.match(rejected.error,/ineligible target/);\n});\n\ntest("multi-target selector cannot silently collapse into a singular downstream HP target",()=>{\n  const authored=structuredClone(AUTHORED);\n  authored.entryPoints[0].targeting={from:"targets",min:1,max:2,where:{op:"relation-matches",ref:"relation",value:"enemy"}};\n  const definition=parseManualCommonPlayOperationDefinition(authored);\n  const state=runtimeState();\n  state.combatants.orc=structuredClone(state.combatants.goblin);\n  state.combatants.orc.id="orc";\n  const before=state.combatants.goblin.life.hp.current;\n  const rejected=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition,{\n    resolutionId:"singular-target-guard",actorId:"hero",entryPointId:"mend-other",targetId:"goblin",\n    targetingTargets:[target("goblin","enemy"),target("orc","enemy")],\n  });\n  assert.equal(rejected.status,"rejected");\n  if(rejected.status==="rejected") assert.match(rejected.error,/requires exactly one selected target/);\n  assert.equal(state.combatants.goblin.life.hp.current,before);\n});'
          );
          replaceOne(
            targetingTest,
            'if(missing.status==="rejected") assert.match(missing.error,/pre-resolved target/);',
            'if(missing.status==="rejected") assert.match(missing.error,/pre-resolved target|selector requires 1-1 result/);'
          );

          replaceOne(
            'tests/ui/installedCommonPlayProductionRuntime.test.ts',
            '            targeting:{from:"targets",min:1,max:1},',
            '            targeting:{\n              from:"targets",min:1,max:1,orderBy:"id",\n              where:{op:"any",args:[\n                {op:"relation-matches",ref:"relation",value:"self"},\n                {op:"relation-matches",ref:"relation",value:"enemy"},\n              ]},\n            },'
          );
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify selector bridge
        run: npx tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-selector-bridge-patch.yml
          git add src/domain/commonPlaySelectorRuntime.ts src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
          git commit -m "feat(c9): bridge rich target selectors into production"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
