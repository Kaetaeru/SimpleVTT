name: C9 Family I Movement Mode Matrix 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-mode-matrix-71304.yml

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family I production matrix
        run: >-
          npx tsx --test
          tests/domain/commonPlayMovementRuntime.test.ts
          tests/ui/c9FamilyIMovementModeAcceptance.test.ts
          tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - name: Verify execution boundary and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Record verified Family I matrix evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          text=path.read_text(encoding="utf-8")
          start=text.index('"family": "I"')
          end=text.index('"family": "J"',start)
          segment=text[start:end]

          old_state='''      "currentState": "Canonical movement.relocate now parses through the operations lowerer and executes actor-authority mapless destinations in installed production/Undo; complete modes, costs, connected breadth, and derived constraints remain incomplete",'''
          new_state='''      "currentState": "Canonical movement.relocate production-executes unknown installed walk/climb/swim/fly/crawl/jump plus push/pull/teleport, generic cost multipliers, explicit no-provoke routing, zero-remaining-speed rejection, connected replay/reconnect, and Undo; rules-derived terrain/Prone/drag costs, alternate-speed budgets, and named movement grants remain incomplete",'''
          if new_state not in segment:
              if segment.count(old_state)!=1:
                  raise SystemExit(f"Family I currentState marker count={segment.count(old_state)}")
              segment=segment.replace(old_state,new_state,1)

          old_prod='''      "productionEvidence": [\n        "installedCommonPlayLoweredFamiliesProduction.test.ts mapless stored movement and Undo"\n      ],'''
          new_prod='''      "productionEvidence": [\n        "installedCommonPlayLoweredFamiliesProduction.test.ts mapless stored movement and Undo",\n        "c9FamilyIMovementModeAcceptance.test.ts unknown installed walk/climb/swim/fly/crawl/jump, push/pull/teleport, cost multiplier, explicit no-provoke routing, zero-speed rejection, and Undo"\n      ],'''
          if new_prod not in segment:
              if segment.count(old_prod)!=1:
                  raise SystemExit(f"Family I production marker count={segment.count(old_prod)}")
              segment=segment.replace(old_prod,new_prod,1)

          old_identity='''      "identityInvarianceEvidence": [\n        "commonPlayMovementRuntime.test.ts external definition identity independence"\n      ],'''
          new_identity='''      "identityInvarianceEvidence": [\n        "commonPlayMovementRuntime.test.ts external definition identity independence",\n        "c9FamilyIMovementModeAcceptance.test.ts renamed external module/content/mechanic preserves crawl cost semantics"\n      ],'''
          if new_identity not in segment:
              if segment.count(old_identity)!=1:
                  raise SystemExit(f"Family I identity marker count={segment.count(old_identity)}")
              segment=segment.replace(old_identity,new_identity,1)

          old_seams='''      "remainingNamedSeams": [\n        "named movement grants",\n        "complete movement mode/cost production matrix"\n      ],'''
          new_seams='''      "remainingNamedSeams": [\n        "named movement grants",\n        "rules-derived Difficult Terrain, stand Prone, drag/carry cost sources, and alternate-speed budgets"\n      ],'''
          if new_seams not in segment:
              if segment.count(old_seams)!=1:
                  raise SystemExit(f"Family I seam marker count={segment.count(old_seams)}")
              segment=segment.replace(old_seams,new_seams,1)

          text=text[:start]+segment+text[end:]
          path.write_text(text,encoding="utf-8")
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit evidence and retire one-shot verifiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm -f .github/workflows/c9-family-i-mode-matrix-71304.yml
          if [ -f .github/workflows/c9-family-i-connected-movement-r2-7130.yml ]; then
            git rm -f .github/workflows/c9-family-i-connected-movement-r2-7130.yml
          fi
          git commit -m "docs(c9): reconcile Family I movement matrix"
          for attempt in $(seq 1 6); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content
              npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/ui/c9FamilyIMovementModeAcceptance.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
              node scripts/check-legacy-execution-boundary.mjs
              npx tsc --noEmit
              node scripts/check-v1-mechanism-coverage.mjs
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
