name: C9 Family J Ledger Reconcile Rerun 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-ledger-reconcile-rerun-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile verified Family J ledger state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch='agent/c9-gate-n-coverage-reconciliation'
          workflow='.github/workflows/c9-family-j-ledger-reconcile-rerun-71304.yml'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            node <<'NODE'
          const fs = require('fs');
          const path = 'docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const row = ledger.rows.find((candidate) => candidate.family === 'J');
          if (!row) throw new Error('Family J ledger row missing');
          if (row.disposition !== 'IMPLEMENTED') throw new Error(`Family J disposition is ${row.disposition}`);
          if (!String(row.currentState || '').includes('Family J attack/control execution is complete')) {
            throw new Error('Family J currentState does not declare completed generic execution');
          }
          if (!row.productionEvidence?.some((entry) => entry.includes('c9FamilyJUnarmedSourceComposition71304.test.ts'))) {
            throw new Error('Family J portable Unarmed production evidence missing');
          }
          if (!row.identityInvarianceEvidence?.some((entry) => entry.includes('c9FamilyJUnarmedSourceComposition71304.test.ts'))) {
            throw new Error('Family J Unarmed identity-invariance evidence missing');
          }
          row.remainingNamedSeams = [];
          delete row.remainingNamedSeamCount;
          fs.writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`, 'utf8');
          NODE
            rm -f "$workflow"
            git add docs/rules/v1-mechanism-coverage-ledger.json "$workflow"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'docs(c9): reconcile Family J final seams'
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
          done
          exit 1
