name: C9 Family N Duration Production 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-n-duration-production-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare focused Family N acceptance
        shell: bash
        run: |
          cat > /tmp/write-family-n-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cat > tests/ui/c9FamilyNEffectDurationProduction.test.ts <<'TEST'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/installedContentRuntimeAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          type Duration =
            | {kind:"durable"}
            | {kind:"maintained";policy:"concentration"}
            | {kind:"until-timing";timing:"rest.short.complete"|"rest.long.complete"}
            | {kind:"elapsed";amount:{value:number};unit:"seconds"|"minutes"|"hours"|"days"};

          function packagePayload(prefix:string,duration:Duration) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.effect-content`;
            const mechanicId=`${prefix}.effect-mechanic`;
            const config={
              schemaVersion:"0.2-draft",id:mechanicId,
              entryPoints:[{id:"activate",invocation:"manual",operations:[{kind:"effect.apply",template:"probe",target:"actor"}]}],
              artifactTemplates:[{
                id:"probe",artifactKind:"effect",duration,
                rules:[{id:"noop",event:"damage.taken",frequency:"once-per-resolution",operations:[{kind:"damage.apply",amount:{value:0},damageType:"force",target:"event.actor"}]}],
                lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:"stack",
              }],
            };
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family N duration probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Duration Probe",locales:{en:{name:"Duration Probe"}}},mechanics:[{kind:"common-play",config}]}],
            })};
          }

          async function exercise(prefix:string,duration:Duration,expected:(elapsed:number)=>unknown) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix,duration);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const before=await adapter.getSnapshot();
            const beforeRuntime=snapshotAdapterTurnRuntimeState(adapter,before.scene)!;
            const action=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"activate",
            });
            const resolved=await adapter.resolveAction(action,["char.aelar"]);
            assert.equal(resolved.resolution?.stage,"complete",JSON.stringify(resolved.resolution));
            const runtime=snapshotAdapterTurnRuntimeState(adapter,resolved.scene)!;
            const effect=runtime.effects.find((entry)=>entry.sourceId===pack.mechanicId);
            assert.ok(effect,JSON.stringify(runtime.effects));
            assert.deepEqual(effect.expiry,expected(beforeRuntime.clock.elapsedSeconds));
            if(duration.kind==="maintained") {
              assert.ok(effect.concentrationGroupId);
              assert.equal(runtime.concentration["char.aelar"]?.sourceId,pack.mechanicId);
            }
            await adapter.undoLastResolution();
            const undone=await adapter.getSnapshot();
            const undoneRuntime=snapshotAdapterTurnRuntimeState(adapter,undone.scene)!;
            assert.equal(undoneRuntime.effects.some((entry)=>entry.sourceId===pack.mechanicId),false);
            if(duration.kind==="maintained") assert.equal(undoneRuntime.concentration["char.aelar"],undefined);
          }

          const CASES:Array<{name:string;duration:Duration;expected:(elapsed:number)=>unknown}>=[
            {name:"durable",duration:{kind:"durable"},expected:()=>({kind:"permanent"})},
            {name:"concentration",duration:{kind:"maintained",policy:"concentration"},expected:()=>({kind:"concentration"})},
            {name:"short-rest",duration:{kind:"until-timing",timing:"rest.short.complete"},expected:()=>({kind:"rest",rest:"short"})},
            {name:"long-rest",duration:{kind:"until-timing",timing:"rest.long.complete"},expected:()=>({kind:"rest",rest:"long"})},
            {name:"elapsed",duration:{kind:"elapsed",amount:{value:2},unit:"minutes"},expected:(elapsed)=>({kind:"time",elapsedSeconds:elapsed+120})},
          ];

          test("unknown installed Common Play materializes the portable effect-duration matrix and reverses it through Undo",async()=>{
            for(const probe of CASES) await exercise(`unknown-family-n-${probe.name}`,probe.duration,probe.expected);
          });

          test("renamed external identities preserve the same portable effect-duration matrix",async()=>{
            for(const probe of CASES) await exercise(`renamed-family-n-${probe.name}`,probe.duration,probe.expected);
          });
          TEST
          EOF
          chmod +x /tmp/write-family-n-test.sh
          /tmp/write-family-n-test.sh
      - run: npm run generate:content
      - name: Verify focused Family N duration acceptance
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test tests/ui/c9FamilyNEffectDurationProduction.test.ts tests/domain/commonPlayEffectRuntime.test.ts tests/ui/c9FamilyOConcentrationProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish verified test and ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reconcile() {
            /tmp/write-family-n-test.sh
            node <<'NODE'
          const fs=require('fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((candidate)=>candidate.family==='N'&&candidate.id==='effect-duration-maintained');
          if(!row) throw new Error('Family N row missing');
          const production='c9FamilyNEffectDurationProduction.test.ts proves unknown installed durable, concentration, short-rest, long-rest, and elapsed effect durations materialize through production Common Play/Resolver and reverse through event-native Undo';
          const identity='c9FamilyNEffectDurationProduction.test.ts repeats the complete duration-materialization matrix under unrelated external module/content/mechanic identities';
          row.productionEvidence=[...new Set([...(row.productionEvidence??[]),production])];
          row.identityInvarianceEvidence=[...new Set([...(row.identityInvarianceEvidence??[]),identity])];
          row.currentState='Installed arbitrary-ID persistent effects execute through the shared Common Play/Resolver authority. Production acceptance now covers durable, maintained concentration, short-rest, long-rest, and elapsed duration materialization plus event-native Undo under unknown and renamed external identities; automatic consume/retaliation, connected replay/reconnect, and Undo are also proven. Duration-boundary expiry execution, suppression/pause-resume, source/dependent cleanup, and remaining named effect adapters remain incomplete.';
          row.remainingNamedSeams=(row.remainingNamedSeams??[]).filter((entry)=>entry!=='exhaustive duration/suppression/dependent-cleanup acceptance');
          const seam='duration-boundary expiry execution, suppression/pause-resume, and source/dependent-cleanup acceptance remains incomplete';
          if(!row.remainingNamedSeams.includes(seam)) row.remainingNamedSeams.push(seam);
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
          }
          for attempt in $(seq 1 30); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            reconcile
            npm run generate:content >/dev/null
            npx tsx --test tests/ui/c9FamilyNEffectDurationProduction.test.ts >/dev/null
            node scripts/check-v1-mechanism-coverage.mjs
            git rm -f .github/workflows/c9-family-n-duration-production-71304.yml
            git add tests/ui/c9FamilyNEffectDurationProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test(c9): prove portable effect duration matrix"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
