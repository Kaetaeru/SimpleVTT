name: C9 Family M Portable Conditions

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - "src/domain/conditions.ts"
      - "src/domain/commonPlayOperationRuntime.ts"
      - "tests/domain/c9FamilyMConditions.test.ts"
      - "tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts"
      - "tests/ui/c9FamilyMConditionProductionAcceptance.test.ts"
      - ".github/workflows/c9-family-m-conditions-71304.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content
        run: npm run generate:content
      - name: Verify Family M condition kernel and production lifecycle
        run: >-
          npx tsx --test
          tests/domain/c9FamilyMConditions.test.ts
          tests/domain/c9FamilyMCommonPlayConditionRuntime.test.ts
          tests/ui/c9FamilyMConditionProductionAcceptance.test.ts