name: C9 Family AA Progression Apply

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-aa-progression-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Family AA production projection
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new))

          replace_once(
              "src/app/installedContentContracts.ts",
              '''    /** Validated, data-only Common Play executable definitions carried by built-in or installed content. */
              mechanics?:InstalledCommonPlayMechanicV1[];
              /** Read-only data-only Campaign provider projection from installed content. */''',
              '''    /** Validated, data-only Common Play executable definitions carried by built-in or installed content. */
              mechanics?:InstalledCommonPlayMechanicV1[];
              /** Validated, data-only progression grants projected by the production level-up runtime. */
              progressionContributions?:InstalledProgressionContributionV1[];
              /** Read-only data-only Campaign provider projection from installed content. */''',
          )

          replace_once(
              "src/app/contentCatalogIdentity.ts",
              '''    relationships:cp(entry.relationships),
              capabilities:cp(entry.capabilities),
              ...(entry.campaignProvider?{campaignProvider:cp(entry.campaignProvider)}:{}),''',
              '''    relationships:cp(entry.relationships),
              capabilities:cp(entry.capabilities),
              ...(entry.progressionContributions?{progressionContributions:cp(entry.progressionContributions)}:{}),
              ...(entry.campaignProvider?{campaignProvider:cp(entry.campaignProvider)}:{}),''',
          )

          replace_once(
              "src/app/progressionContracts.ts",
              '''    persistentFeatureOptionIds?: string[];
              persistentFeatureOptionSources?: Record<string, string>;''',
              '''    persistentFeatureOptionIds?: string[];
              persistentFeatureOptionSources?: Record<string, string>;
              /** Stable opaque grant identities contributed by installed RuleModules. */
              installedProgressionGrantIds?: string[];''',
          )

          replace_once(
              "src/app/progressionRuntimeAdapter.ts",
              '''import type { ChoiceSelectionMap, ChoiceSelectionValue } from "../domain/choiceDefinition";
              import { classById, classByName } from "../domain/progressionCatalog";''',
              '''import type { ChoiceSelectionMap, ChoiceSelectionValue } from "../domain/choiceDefinition";
              import { resolveCommonPlayProgressionContributions } from "../domain/commonPlayProgressionContribution";
              import { classById, classByName } from "../domain/progressionCatalog";''',
          )

          replace_once(
              "src/app/progressionRuntimeAdapter.ts",
              '''function targetClassId(sheet: CharacterSheet, draft: LevelUpDraft) {
              return draft.targetClassId ?? sheet.classLevels?.[0]?.classId ?? primaryClass(sheet)?.id ?? "dnd.srd521.class.fighter";
          }

          function requestFor(state: AdapterState) {''',
              '''function targetClassId(sheet: CharacterSheet, draft: LevelUpDraft) {
              return draft.targetClassId ?? sheet.classLevels?.[0]?.classId ?? primaryClass(sheet)?.id ?? "dnd.srd521.class.fighter";
          }

          function installedProgressionContributions(state: AdapterState) {
              return state.catalog.flatMap((entry) => entry.progressionContributions ?? []);
          }

          function installedProgressionGrantLabel(state: AdapterState, grantId: string) {
              return state.catalog.find((entry) => entry.contentId === grantId || entry.id === grantId)?.nameKo ?? grantId;
          }

          function requestFor(state: AdapterState) {''',
          )

          replace_once(
              "src/app/progressionRuntimeAdapter.ts",
              '''  if (internal.edgeState === "save-error") {
              internal.levelUpDraft.validation = [...internal.levelUpDraft.validation, { severity:"blocking", message:"Character Revision 저장에 실패했습니다. 원본은 변경되지 않았습니다." }];
              return internal.getSnapshot();
            }
            applyProgressionCharacterState(internal.activeCharacter,result.state,{
              scope:"full",
              featureLabelById:(featureId)=>internal.catalog.find((entry)=>entry.id===featureId)?.nameKo,
            });
            ensureSignatureSpellResources(internal.activeCharacter);''',
              '''  if (internal.edgeState === "save-error") {
              internal.levelUpDraft.validation = [...internal.levelUpDraft.validation, { severity:"blocking", message:"Character Revision 저장에 실패했습니다. 원본은 변경되지 않았습니다." }];
              return internal.getSnapshot();
            }
            const contributions = installedProgressionContributions(internal);
            const contributionResult = contributions.length
              ? resolveCommonPlayProgressionContributions({
                  revision:0,
                  trackLevels:Object.fromEntries(result.state.classTracks.map((track) => [track.classId, track.level])),
                  grants:[...(internal.activeCharacter.installedProgressionGrantIds ?? [])],
                }, 0, contributions)
              : null;
            if (contributionResult?.status === "rejected") {
              internal.levelUpDraft.validation = [...internal.levelUpDraft.validation, { severity:"blocking", message:`Installed progression contribution rejected: ${contributionResult.error}` }];
              return internal.getSnapshot();
            }
            applyProgressionCharacterState(internal.activeCharacter,result.state,{
              scope:"full",
              featureLabelById:(featureId)=>internal.catalog.find((entry)=>entry.id===featureId)?.nameKo,
            });
            const addedInstalledGrantIds = contributionResult?.status === "committed" ? contributionResult.addedGrantIds : [];
            if (contributionResult?.status === "committed") {
              internal.activeCharacter.installedProgressionGrantIds = [...contributionResult.state.grants];
              for (const grantId of addedInstalledGrantIds) {
                const label = installedProgressionGrantLabel(internal, grantId);
                if (!internal.activeCharacter.features.includes(label)) internal.activeCharacter.features.push(label);
              }
            }
            ensureSignatureSpellResources(internal.activeCharacter);''',
          )

          replace_once(
              "src/app/progressionRuntimeAdapter.ts",
              '''    stateChanges:["Phase 08 Progression transaction → Character Revision", `progressionRevision ${stateBefore.revision} → ${result.state.revision}`],''',
              '''    stateChanges:[
              "Phase 08 Progression transaction → Character Revision",
              `progressionRevision ${stateBefore.revision} → ${result.state.revision}`,
              ...(addedInstalledGrantIds.length ? [`installed progression grants: ${addedInstalledGrantIds.join(", ")}`] : []),
            ],''',
          )

          Path("tests/ui/installedProgressionContributionRuntime.test.ts").write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/progressionRuntimeAdapter";
          import "../../src/app/installedContentRuntimeAdapter";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import type { Phase07AdapterCommands } from "../../src/app/progressionRuntimeAdapter";

          const SOURCE_ID = "option.external.progression-source";
          const GRANT_ID = "option.external.progression-grant";

          function progressionPackage() {
            return JSON.stringify({
              schemaVersion:"0.1-draft",
              moduleId:"homebrew.family-aa-progression",
              moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},
              defaultLocale:"ko",
              source:{document:"Family AA progression probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[
                {
                  id:SOURCE_ID,
                  category:"option",
                  presentation:{defaultLocale:"ko",originalName:"Renamed progression source",locales:{ko:{name:"이름이 바뀐 진행 원천",description:"stable IDs drive progression"}}},
                  progressionContributions:[{track:"dnd.srd521.class.fighter",threshold:6,grants:[GRANT_ID]}],
                },
                {
                  id:GRANT_ID,
                  category:"option",
                  presentation:{defaultLocale:"ko",originalName:"Renamed progression grant",locales:{ko:{name:"이름이 바뀐 외부 보상",description:"projected from opaque grant identity"}}},
                },
              ],
            });
          }

          test("unknown installed RuleModule progression contribution executes through production level-up by stable IDs", async () => {
            const adapter = new MockAdapter();
            setInstalledContentStoreForTests(adapter, new MemoryInstalledContentStore());

            let snapshot = await adapter.previewContentImport(progressionPackage());
            assert.equal(snapshot.contentImport?.validation.some((entry) => entry.severity === "blocking"), false);
            await adapter.activateContentImport();
            snapshot = await adapter.getSnapshot();
            assert.equal(snapshot.contentImport, null);
            assert.ok(snapshot.catalog.some((entry) => entry.contentId === SOURCE_ID && entry.progressionContributions?.[0]?.grants.includes(GRANT_ID)));

            await adapter.startLevelUp(snapshot.activeCharacter.id);
            snapshot = await adapter.getSnapshot();
            assert.equal(snapshot.progressionPlan?.targetClassLevel, 6);
            const choice = snapshot.progressionPlan?.choices.find((entry) => entry.kind === "asi-or-feat");
            assert.ok(choice);
            const progression = adapter as unknown as Phase07AdapterCommands;
            await progression.setProgressionChoice(choice!.id, { kind:"asi", mode:"plus-two", primary:"str" });
            snapshot = await adapter.getSnapshot();
            assert.equal(snapshot.progressionPlan?.blocking.length, 0);

            await adapter.commitLevelUp();
            snapshot = await adapter.getSnapshot();
            assert.equal(snapshot.activeCharacter.level, 6);
            assert.deepEqual(snapshot.activeCharacter.installedProgressionGrantIds, [GRANT_ID]);
            assert.ok(snapshot.activeCharacter.features.includes("이름이 바뀐 외부 보상"));
            assert.equal(snapshot.activeCharacter.features.filter((feature) => feature === "이름이 바뀐 외부 보상").length, 1);
            assert.ok(snapshot.activity[0]?.stateChanges.includes(`installed progression grants: ${GRANT_ID}`));
          });
          '''.replace(/^          /gm, ""))
          PY
      - name: Verify Family AA progression path
        id: verify
        continue-on-error: true
        run: |
          npx tsx --test tests/ui/installedProgressionContributionRuntime.test.ts tests/ui/progressionRuntimeAdapter.test.ts tests/ui/ruleModulePackageImport.test.ts
          npx tsc --noEmit
      - name: Commit verified change
        if: steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-aa-progression-apply.yml
          git add src/app/installedContentContracts.ts src/app/contentCatalogIdentity.ts src/app/progressionContracts.ts src/app/progressionRuntimeAdapter.ts tests/ui/installedProgressionContributionRuntime.test.ts
          git commit -m "feat(c9): execute installed progression contributions"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Remove failed apply workflow
        if: steps.verify.outcome != 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- src/app/installedContentContracts.ts src/app/contentCatalogIdentity.ts src/app/progressionContracts.ts src/app/progressionRuntimeAdapter.ts
          rm -f tests/ui/installedProgressionContributionRuntime.test.ts
          git rm .github/workflows/c9-family-aa-progression-apply.yml
          git commit -m "chore(c9): remove failed progression apply workflow"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
          exit 1
