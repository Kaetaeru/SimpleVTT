name: Persistence

on:
  pull_request:
    paths:
      - "src/app/*Persistence*"
      - "src/app/*persistence*"
      - "src/app/*CharacterLibrary*"
      - "src/app/*characterLibrary*"
      - "src/app/*AuthoringDraft*"
      - "src/app/*authoringDraft*"
      - "src/app/*InstalledContent*"
      - "src/app/*installedContent*"
      - "src/app/*ContentCatalog*"
      - "src/app/*contentCatalog*"
      - "src/app/*ModuleValidation*"
      - "src/app/*moduleValidation*"
      - "src/app/*ruleModulePackage*"
      - "src/app/*RuleModulePackage*"
      - "src/app/*characterCreation*Source*"
      - "src/app/*resolutionCharacter*"
      - "src/app/phase09RealRuntimeAttackAdapter.ts"
      - "src/app/phase09RealAtomicHealingAdapter.ts"
      - "src/app/phase09RealAtomicItemAdapter.ts"
      - "src/app/phase09RealAtomicSavingThrowAdapter.ts"
      - "tests/ui/characterLibrary*.test.ts"
      - "tests/ui/characterSource*.test.ts"
      - "tests/ui/authoringDraft*.test.ts"
      - "tests/ui/installedContent*.test.ts"
      - "tests/ui/declarativeModuleValidation.test.ts"
      - "tests/ui/ruleModulePackage*.test.ts"
      - "tests/ui/resolutionCharacter*.test.ts"
      - "tests/ui/productionFreshCharacterInventory.test.ts"
      - "schemas/**"
      - "rules/profiles/**"
      - "docs/design/**"
      - ".agents/PHASE10_CHECKLIST.md"
      - "src/main.tsx"
      - "src-tauri/**"
      - ".github/workflows/persistence.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "src/app/*Persistence*"
      - "src/app/*persistence*"
      - "src/app/*CharacterLibrary*"
      - "src/app/*characterLibrary*"
      - "src/app/*AuthoringDraft*"
      - "src/app/*authoringDraft*"
      - "src/app/*InstalledContent*"
      - "src/app/*installedContent*"
      - "src/app/*ContentCatalog*"
      - "src/app/*contentCatalog*"
      - "src/app/*ModuleValidation*"
      - "src/app/*moduleValidation*"
      - "src/app/*ruleModulePackage*"
      - "src/app/*RuleModulePackage*"
      - "src/app/*characterCreation*Source*"
      - "src/app/*resolutionCharacter*"
      - "src/app/phase09RealRuntimeAttackAdapter.ts"
      - "src/app/phase09RealAtomicHealingAdapter.ts"
      - "src/app/phase09RealAtomicItemAdapter.ts"
      - "src/app/phase09RealAtomicSavingThrowAdapter.ts"
      - "tests/ui/characterLibrary*.test.ts"
      - "tests/ui/characterSource*.test.ts"
      - "tests/ui/authoringDraft*.test.ts"
      - "tests/ui/installedContent*.test.ts"
      - "tests/ui/declarativeModuleValidation.test.ts"
      - "tests/ui/ruleModulePackage*.test.ts"
      - "tests/ui/resolutionCharacter*.test.ts"
      - "tests/ui/productionFreshCharacterInventory.test.ts"
      - "schemas/**"
      - "rules/profiles/**"
      - "docs/design/**"
      - ".agents/PHASE10_CHECKLIST.md"
      - "src/main.tsx"
      - "src-tauri/**"
      - ".github/workflows/persistence.yml"

jobs:
  application-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Character, content, module and package persistence contracts
        run: npx tsx --test tests/ui/characterLibraryPersistence.test.ts tests/ui/characterLibraryPortraitPersistence.test.ts tests/ui/characterLibraryFailureRecovery.test.ts tests/ui/characterLibraryRuntimeAdapter.test.ts tests/ui/characterLibraryProductionPlayIntegration.test.ts tests/ui/productionFreshCharacterInventory.test.ts tests/ui/characterSourceEditPersistence.test.ts tests/ui/authoringDraftPersistence.test.ts tests/ui/authoringDraftRuntimeAdapter.test.ts tests/ui/installedContentPersistence.test.ts tests/ui/installedContentRuntimeAdapter.test.ts tests/ui/installedContentModuleActivation.test.ts tests/ui/declarativeModuleValidation.test.ts tests/ui/ruleModulePackageImport.test.ts tests/ui/resolutionCharacterDurableProjection.test.ts tests/ui/resolutionCharacterWriteBack.test.ts
      - name: Verify production build
        run: npm run build

  tauri-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable persistence stores and atomic Character recovery
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
