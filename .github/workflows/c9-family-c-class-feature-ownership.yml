name: C9 Family C Class Feature Ownership
# rerun: completed-check projection and event bridge v2

on:
  push:
    paths:
      - '.github/workflows/c9-family-c-class-feature-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/c9-migrate-class-feature-ownership.mjs
      - run: node scripts/c9-fix-completed-common-play-check.mjs
      - run: npm run generate:content
      - name: Diagnose hydrated SessionProjection ownership
        run: |
          cat > ./c9-class-feature-diagnostic.ts <<'TS'
          import "./src/app/offlineRuntimeAdapters.ts";
          import { MockAdapter } from "./src/app/mockAdapter.ts";
          import { buildCharacterSessionProjectionV1 } from "./src/app/characterSessionProjection.ts";
          const adapter=new MockAdapter();
          await adapter.getSnapshot();
          const internal=adapter as unknown as {activeCharacter:any;catalog:any[]};
          const tactical=internal.catalog.filter((entry)=>entry.contentId==="fighter.tactical-mind"||entry.id.includes("fighter.tactical-mind"));
          const fighter=internal.catalog.filter((entry)=>entry.contentId==="dnd.srd521.class.fighter"||entry.id.includes("dnd.srd521.class.fighter"));
          console.log("TACTICAL_CATALOG",JSON.stringify(tactical,null,2));
          console.log("FIGHTER_CATALOG",JSON.stringify(fighter,null,2));
          console.log("AELAR_SOURCE",JSON.stringify({className:internal.activeCharacter.className,classLevels:internal.activeCharacter.classLevels,subclassName:internal.activeCharacter.subclassName,subclassIds:internal.activeCharacter.subclassIds},null,2));
          try {
            const projection=buildCharacterSessionProjectionV1(internal.activeCharacter,internal.catalog);
            console.log("PROJECTION_IDENTITIES",JSON.stringify(projection.contentIdentities,null,2));
          } catch(error) {
            console.log("PROJECTION_ERROR",error instanceof Error?error.stack:String(error));
          }
          TS
          npx tsx ./c9-class-feature-diagnostic.ts
          rm ./c9-class-feature-diagnostic.ts
      - name: Verify Tactical Mind and generic interceptor ownership
        run: npx tsx --test tests/ui/fighterTacticalMindFollowUpRuntime.test.ts tests/ui/openAbilityCheckDcRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Commit verified product migration
        run: |
          rm -f .chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json scripts/c9-migrate-class-feature-ownership.mjs scripts/c9-fix-completed-common-play-check.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-builtin-catalog.mjs src/app/characterSessionProjection.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/productionPlayRuntimeAdapter.ts src/app/characterSessionProjectionReconstruction.ts src/app/mockAdapter.ts content/modules/dnd-srd-5.2.1.classes/module.json content/modules/dnd-srd-5.2.1.subclasses/module.json tests/ui/fighterTacticalMindFollowUpRuntime.test.ts tests/ui/openAbilityCheckDcRuntime.test.ts .chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json scripts/c9-migrate-class-feature-ownership.mjs scripts/c9-fix-completed-common-play-check.mjs
          git commit -m 'feat(common-play): own class feature grants declaratively'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
