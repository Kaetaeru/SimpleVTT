name: C9 Family C Class Feature Ownership

on:
  push:
    paths:
      - '.github/workflows/c9-family-c-class-feature-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Inspect generated progression and exact Tactical Mind references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const progression = JSON.parse(fs.readFileSync('src/generated/progressionCatalog.generated.json','utf8'));
          const fighter = progression.classes.find((entry) => String(entry.id).toLowerCase().includes('fighter'));
          if (!fighter) throw new Error('fighter progression not found');
          const fighterJson = JSON.stringify(fighter);
          const strings = [...new Set((fighterJson.match(/"([^"\\]|\\.)*"/g) || []).map((s) => JSON.parse(s)))];
          const candidateIds = strings.filter((s) => /tactical|second.wind|indomitable|fighter/i.test(s));
          const relevantRows = fighter.progression.filter((row) => /tactical|second wind|indomitable/i.test(JSON.stringify(row)));
          const matches = [];
          const roots = ['src','content','tests'];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else if (/\.(ts|tsx|js|mjs|json|md)$/.test(ent.name)) {
                let text;
                try { text = fs.readFileSync(p,'utf8'); } catch { continue; }
                const lines = text.split(/\r?\n/);
                lines.forEach((line, i) => {
                  if (/tactical[ -]?mind|tacticalMind/i.test(line)) matches.push({path:p,line:i+1,text:line.trim().slice(0,500)});
                });
              }
            }
          }
          roots.forEach((root) => walk(root));
          const out = { fighterId:fighter.id, candidateIds, relevantRows, matches };
          fs.writeFileSync('.chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json', JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(c9): record class feature ownership diagnostic'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
