name: C9 Family C Class Feature Ownership

on:
  push:
    paths:
      - '.github/workflows/c9-family-c-class-feature-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Inspect canonical Fighter feature identity sources
        run: |
          node <<'NODE'
          const fs = require('fs');
          const progression = JSON.parse(fs.readFileSync('src/generated/progressionCatalog.generated.json','utf8'));
          const fighter = progression.classes.find((entry) => String(entry.id).toLowerCase().includes('fighter'));
          if (!fighter) throw new Error('fighter progression not found');
          const module = JSON.parse(fs.readFileSync('content/modules/dnd-srd-5.2.1.classes/module.json','utf8'));
          const tacticalNodes=[];
          function visit(value,path='$'){
            if (!value || typeof value!=='object') return;
            if (/tactical[ -]?mind|전술적 정신/i.test(JSON.stringify(value))) tacticalNodes.push({path,value});
            if (Array.isArray(value)) value.forEach((v,i)=>visit(v,`${path}[${i}]`));
            else Object.entries(value).forEach(([k,v])=>visit(v,`${path}.${k}`));
          }
          visit(module);
          const fighterStrings=[...new Set((JSON.stringify(fighter).match(/"([^"\\]|\\.)*"/g)||[]).map(s=>JSON.parse(s)))];
          const out={fighterId:fighter.id,progressionCandidates:fighterStrings.filter(s=>/tactical|second.wind|indomitable|fighter/i.test(s)),progressionRows:fighter.progression.filter(row=>/tactical|second wind|indomitable/i.test(JSON.stringify(row))),classModuleTacticalNodes:tacticalNodes.slice(0,12)};
          fs.writeFileSync('.chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(c9): refine class feature ownership diagnostic'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
