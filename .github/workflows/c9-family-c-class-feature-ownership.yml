name: C9 Family C Class Feature Ownership

on:
  push:
    paths:
      - '.github/workflows/c9-family-c-class-feature-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Inspect generated catalog grant shape
        run: |
          node <<'NODE'
          const fs=require('fs');
          const module=JSON.parse(fs.readFileSync('content/modules/dnd-srd-5.2.1.classes/module.json','utf8'));
          const fighterSource=module.content.find(e=>e.id==='dnd.srd521.class.fighter');
          const candidates=['generated/builtinCatalog.generated.json','src/generated/builtinCatalog.generated.json'];
          const generatedPath=candidates.find(p=>fs.existsSync(p));
          if(!generatedPath) throw new Error('generated builtin catalog not found');
          const generated=JSON.parse(fs.readFileSync(generatedPath,'utf8'));
          const entries=Array.isArray(generated)?generated:(generated.entries||generated.content||generated.catalog||[]);
          const fighterGenerated=entries.find(e=>e.contentId==='dnd.srd521.class.fighter'||e.id==='dnd.srd521.class.fighter'||String(e.id||'').includes('dnd.srd521.class.fighter'));
          const out={generatedPath,fighterSource,fighterGenerated};
          fs.writeFileSync('.chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(c9): record generated class grant shape'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
