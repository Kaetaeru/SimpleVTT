name: C9 Family C Class Feature Ownership

on:
  push:
    paths:
      - '.github/workflows/c9-family-c-class-feature-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/c9-migrate-class-feature-ownership.mjs
      - run: npm run generate:content
      - name: Verify Tactical Mind and projection ownership
        run: npx tsx --test tests/ui/fighterTacticalMindFollowUpRuntime.test.ts tests/ui/openAbilityCheckDcRuntime.test.ts
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Commit verified product migration
        run: |
          rm -f .chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json scripts/c9-migrate-class-feature-ownership.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-builtin-catalog.mjs src/app/characterSessionProjection.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/productionPlayRuntimeAdapter.ts src/app/characterSessionProjectionReconstruction.ts src/app/mockAdapter.ts content/modules/dnd-srd-5.2.1.classes/module.json tests/ui/fighterTacticalMindFollowUpRuntime.test.ts tests/ui/openAbilityCheckDcRuntime.test.ts .chatgpt-rerun/C9_CLASS_FEATURE_DIAGNOSTIC.json scripts/c9-migrate-class-feature-ownership.mjs
          git commit -m 'feat(common-play): own class feature grants declaratively'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
