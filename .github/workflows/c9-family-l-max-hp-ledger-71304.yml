name: C9 Family L Max HP Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-max-hp-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Prepare deterministic ledger merger
        run: |
          cat > /tmp/merge_family_l.py <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='L')
          sentence='Maximum-HP runtime overlays preserve the authoritative source maximum across Character persistence/restart and inverse write-back.'
          if sentence not in row['currentState']:
              row['currentState']=row['currentState'].rstrip()+(' ' if row['currentState'].strip() else '')+sentence
          for value in [
              'persistenceContracts.ts separates source build maxHp from optional runtime durable maxHp overlay',
              'characterLibraryPersistence.ts preserves sourceMaxHp while materializing runtime maximum HP overrides across restart',
              'resolutionCharacterDurableProjection.ts applies inverse-ready HpStateChange.maximum with drift and current-HP invariant checks',
          ]:
              if value not in row['implementationEvidence']:
                  row['implementationEvidence'].append(value)
          value='c9FamilyLMaxHpPersistence.test.ts proves maximum-HP increase and reduction source/runtime persistence, restart reconstruction, current-HP clamp ordering, and inverse write-back'
          if value not in row['productionEvidence']:
              row['productionEvidence'].append(value)
          value='c9FamilyLMaxHpPersistence.test.ts proves maximum-HP runtime semantics are invariant to content identity because durable projection consumes only structural HpStateChange fields'
          if value not in row['identityInvarianceEvidence']:
              row['identityInvarianceEvidence'].append(value)
          value='c9FamilyLMaxHpPersistence.test.ts proves runtime maximum HP survives Character library materialization without mutating source maxHp and normalizes after inverse write-back'
          if value not in row['persistenceEvidenceIfRelevant']:
              row['persistenceEvidenceIfRelevant'].append(value)
          row['remainingNamedSeams']=[]
          row['disposition']='IMPLEMENTED'
          debt='Named feature/spell HP execution remains cataloged legacy migration debt where it bypasses portable Common Play; it is not a supported portable execution fallback or second HP engine.'
          if debt not in row['currentState']:
              row['currentState']=row['currentState'].rstrip()+(' ' if row['currentState'].strip() else '')+debt
          row['currentState']=row['currentState'].replace('Remaining Family L acceptance is max-HP source-model/write-back semantics and named feature/spell HP migration debt where it bypasses portable Common Play.','')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Merge latest ledger and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
            python /tmp/merge_family_l.py
            node scripts/check-v1-mechanism-coverage.mjs
            git rm .github/workflows/c9-family-l-max-hp-ledger-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git commit -m "docs(c9): finalize Family L damage life coverage"
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 2
          done
          exit 1
