name: v1 Progression Diagnostic

on:
  push:
    branches:
      - "agent/108-production-play-session-ux"
    paths:
      - ".github/workflows/v1-progression-diagnostic.yml"

jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Diagnose progression choice schedule regression
        shell: bash
        run: |
          set +e
          npx tsx --test tests/ui/progressionChoiceScheduleRegression.test.ts > progression.log 2>&1
          status=$?
          cat progression.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 100 progression.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=v1 progression regression::$message"
            exit "$status"
          fi
