name: C9 Family A Property Projection Retry
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-property-projection-retry.yml]
permissions:
  contents: write
jobs:
  property-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Reapply staged projection source changes
        shell: python
        run: |
          from pathlib import Path
          text=Path('.github/workflows/c9-family-a-property-projection-step.yml').read_text()
          start=text.index('      - name: Apply Effect-backed movement property projection')
          run=text.index('        run: |\n',start)+len('        run: |\n')
          end=text.index('      - run: npx tsx --test',run)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[run:end].splitlines())
          exec(compile(code,'property-projection-stage','exec'))
      - name: Allow numeric property expressions for movement distance
        shell: python
        run: |
          import json
          from pathlib import Path

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          source=path.read_text()
          old='''      distance:nonNegativeLiteralExpression(operation.distance,`${label}.distance`),
                ...(operation.costMultiplier===undefined?{}:{costMultiplier:nonNegativeLiteralExpression(operation.costMultiplier,`${label}.costMultiplier`)}),'''
          new='''      distance:numericExpression(operation.distance,`${label}.distance`) as ExpressionNode,
                ...(operation.costMultiplier===undefined?{}:{costMultiplier:numericExpression(operation.costMultiplier,`${label}.costMultiplier`) as ExpressionNode}),'''
          if source.count(old)!=1:
            raise SystemExit(f'movement expression parser anchor count={source.count(old)}')
          path.write_text(source.replace(old,new,1))

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text())
          found=0
          def visit(value):
            global found
            if isinstance(value,dict):
              properties=value.get('properties')
              if isinstance(properties,dict) and isinstance(properties.get('kind'),dict) and properties['kind'].get('const')=='movement.relocate':
                properties['distance']={'$ref':'#/$defs/expression'}
                if 'costMultiplier' in properties:
                  properties['costMultiplier']={'$ref':'#/$defs/expression'}
                found+=1
              for child in value.values(): visit(child)
            elif isinstance(value,list):
              for child in value: visit(child)
          visit(schema)
          if found!=1: raise SystemExit(f'expected one movement.relocate schema, got {found}')
          schema_path.write_text(json.dumps(schema,indent=2,ensure_ascii=False)+'\n')
      - run: npx tsx --test tests/domain/effectsRuntime.test.ts tests/domain/commonPlayPropertyContractRuntime.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - run: npx tsc --noEmit
      - name: Commit verified Family A projection slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/effects.ts src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts schemas/common-play-contract.schema.json tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          git rm .github/workflows/c9-family-a-property-projection-step.yml .github/workflows/c9-family-a-property-projection-retry.yml
          git commit -m "feat(c9): project property effects into movement"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
