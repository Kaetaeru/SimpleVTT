name: C9 Family P Expiry Dispatch 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-p-expiry-dispatch-71304.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/c9-gate-n-coverage-reconciliation"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin "$GITHUB_REF_NAME"
      - name: Add effect-expiry semantic dispatch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one patch anchor, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          effect = Path("src/domain/commonPlayEffectRuntime.ts")
          replace_once(
              effect,
              'export type CommonPlayAutomaticEffectEvent=AutomaticDamageEvent|"attack.hit"|"attack.miss"|"save.success"|"save.failure"|"state.applied"|"rest.short.complete"|"rest.long.complete"|"resource.recharge.success"|"resource.recharge.failure";',
              'export type CommonPlayAutomaticEffectEvent=AutomaticDamageEvent|"attack.hit"|"attack.miss"|"save.success"|"save.failure"|"state.applied"|"effect.expired"|"rest.short.complete"|"rest.long.complete"|"resource.recharge.success"|"resource.recharge.failure";',
          )
          replace_once(
              effect,
              'if (!["damage.taken","damage.dealt","attack.hit","attack.miss","save.success","save.failure","state.applied","rest.short.complete","rest.long.complete","resource.recharge.success","resource.recharge.failure"].includes(rule.event)) throw new Error(`${label} event is unsupported in this runtime slice`);',
              'if (!["damage.taken","damage.dealt","attack.hit","attack.miss","save.success","save.failure","state.applied","effect.expired","rest.short.complete","rest.long.complete","resource.recharge.success","resource.recharge.failure"].includes(rule.event)) throw new Error(`${label} event is unsupported in this runtime slice`);',
          )

          semantic = Path("src/domain/commonPlaySemanticEventRuntime.ts")
          replace_once(
              semantic,
              'import type { D20TestResult } from "./d20";\n',
              'import type { D20TestResult } from "./d20";\nimport { expireEffectsAtClock, expireEffectsForRest, type EffectInstance } from "./effects";\nimport { expireExtendableEffectsAtClock } from "./extendableEffectLifecycle";\n',
          )
          marker = '''function semanticContexts(operation:Extract<PendingResolution["operations"][number],{kind:"d20"}>) {\n  if(operation.request.family==="attack-roll") return [{event:"attack.hit" as const,outcome:"success" as const},{event:"attack.miss" as const,outcome:"failure" as const}];\n  if(operation.request.family==="saving-throw") return [{event:"save.success" as const,outcome:"success" as const},{event:"save.failure" as const,outcome:"failure" as const}];\n  return [];\n}\n'''
          insertion = marker + '''\nfunction predictedExpiryContexts(\n  state:RulesRuntimeState,\n  pending:PendingResolution,\n  operation:ResolutionOperation,\n):Array<{effect:EffectInstance;actorId:string}> {\n  let actorId=pending.actorId;\n  let expired:EffectInstance[]=[];\n  if(operation.kind==="advance-time") {\n    const clock={...state.clock,elapsedSeconds:operation.elapsedSeconds};\n    const generic=expireEffectsAtClock(state.effects,clock);\n    const extendable=expireExtendableEffectsAtClock(generic.active,clock);\n    expired=[...generic.expired,...extendable.expired];\n  } else if(operation.kind==="begin-turn"||operation.kind==="end-turn") {\n    actorId=operation.actorId;\n    const phase:"start"|"end"=operation.kind==="begin-turn"?"start":"end";\n    const clock={...state.clock,round:operation.round,activeActorId:operation.actorId,phase};\n    const generic=expireEffectsAtClock(state.effects,clock);\n    const extendable=expireExtendableEffectsAtClock(generic.active,clock);\n    expired=[...generic.expired,...extendable.expired];\n  } else if(operation.kind==="short-rest"||operation.kind==="long-rest") {\n    actorId=operation.targetId;\n    const owned=state.effects.filter((effect)=>effect.targetId===operation.targetId);\n    const rest=expireEffectsForRest(owned,operation.kind==="short-rest"?"short":"long");\n    expired=[...rest.expired];\n    if(operation.kind==="long-rest") {\n      const exhaustion=rest.active.find((effect)=>effect.kind==="condition"&&effect.conditionId==="exhaustion");\n      if(exhaustion) expired.push(exhaustion);\n    }\n  }\n  return expired.map((effect)=>({effect,actorId}));\n}\n'''
          replace_once(semantic, marker, insertion)
          replace_once(
              semantic,
              '''      when?:ResolutionOperation["when"];\n    }>=[];\n    if(operation.kind==="apply-effect") {''',
              '''      when?:ResolutionOperation["when"];\n      expiredEffectId?:string;\n    }>=[];\n    for(const predicted of predictedExpiryContexts(state,pending,operation)) contexts.push({\n      event:"effect.expired",\n      subjectId:predicted.effect.targetId,\n      actorId:predicted.actorId,\n      targetId:predicted.effect.targetId,\n      when:operation.when,\n      expiredEffectId:predicted.effect.id,\n    });\n    if(operation.kind==="apply-effect") {''',
          )
          replace_once(
              semantic,
              '''            if(template.lifetime.kind==="until-duration"&&Object.keys(frequency.metadataPatch).length) operations.push({\n              id:`${pending.id}:automatic:${context.event}:${definitionIndex}:${effectIndex}:${semanticIndex}:${ruleIndex}:frequency`,\n              kind:"update-effect",effectId:effect.id,metadataPatch:frequency.metadataPatch,\n              ...(context.when?{when:context.when}:{}),\n            });''',
              '''            const selfExpires=context.event==="effect.expired"&&context.expiredEffectId===effect.id;\n            if(!selfExpires&&template.lifetime.kind==="until-duration"&&Object.keys(frequency.metadataPatch).length) operations.push({\n              id:`${pending.id}:automatic:${context.event}:${definitionIndex}:${effectIndex}:${semanticIndex}:${ruleIndex}:frequency`,\n              kind:"update-effect",effectId:effect.id,metadataPatch:frequency.metadataPatch,\n              ...(context.when?{when:context.when}:{}),\n            });''',
          )

          test_path = Path("tests/domain/commonPlaySemanticEventRuntime.test.ts")
          text = test_path.read_text(encoding="utf-8")
          test_name = "Common Play dispatches effect.expired rules in the same authoritative lifecycle resolution"
          if test_name in text:
              raise SystemExit("expiry dispatch regression test already exists")
          text += r'''\n\ntest("Common Play dispatches effect.expired rules in the same authoritative lifecycle resolution",()=>{\n  const run=(definitionId:string)=>{\n    const definition:CommonPlayPersistentEffectDefinition={\n      schemaVersion:"0.2-draft",id:definitionId,\n      entryPoints:[{id:"activate",invocation:"manual",operations:[{kind:"effect.apply",template:"expiring-ward",target:"actor"}]}],\n      artifactTemplates:[{\n        id:"expiring-ward",artifactKind:"effect",duration:{kind:"elapsed",amount:{value:1},unit:"seconds"},\n        rules:[{id:"on-expiry",event:"effect.expired",frequency:"once",operations:[{kind:"damage.apply",amount:{value:3},damageType:"force",target:"event.actor"}]}],\n        lifetime:{kind:"until-duration",onEnd:"destroy"},\n      }],\n    };\n    let state=runtimeState();\n    const activated=resolveCommonPlayEffectActivation(TEST_PROFILE,state,definition,{resolutionId:`activate-${definitionId}`,actorId:"hero",entryPointId:"activate"});\n    assert.equal(activated.status,"committed"); if(activated.status!=="committed") return undefined;\n    state=activated.state;\n    const request:PendingResolution={\n      id:`expire-${definitionId}`,actorId:"hero",sourceId:"external.lifecycle-clock",expectedRevision:state.revision,\n      operations:[{id:"advance",kind:"advance-time",elapsedSeconds:1}],\n    };\n    const expanded=appendCommonPlaySemanticOutcomeTriggers(state,[definition],request,{hero:"character",goblin:"monster"});\n    const resolved=appendCommonPlaySemanticOutcomeEvents(expanded,resolvePendingResolution(TEST_PROFILE,state,expanded));\n    assert.equal(resolved.status,"committed"); if(resolved.status!=="committed") return undefined;\n    return {\n      hp:resolved.state.combatants.hero.life.hp.current,\n      expired:resolved.events.some((event)=>event.kind==="effect.expired"),\n      triggered:Object.keys(resolved.results).some((id)=>id.includes("automatic:effect.expired")),\n      effectStillActive:resolved.state.effects.some((effect)=>effect.sourceId===definitionId),\n    };\n  };\n  const expected={hp:17,expired:true,triggered:true,effectStillActive:false};\n  assert.deepEqual(run("external.unknown.expiry-ward"),expected);\n  assert.deepEqual(run("renamed.unseen.expiry-ward"),expected);\n});\n'''
          test_path.write_text(text,encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content
        run: npm run generate:content
      - name: Verify Family P expiry semantics
        run: npx tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts tests/domain/commonPlayEffectRuntime.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify V1 mechanism ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified change and retire verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-p-expiry-dispatch-71304.yml
          git add src/domain/commonPlayEffectRuntime.ts src/domain/commonPlaySemanticEventRuntime.ts tests/domain/commonPlaySemanticEventRuntime.test.ts .github/workflows/c9-family-p-expiry-dispatch-71304.yml
          git commit -m "feat(c9): dispatch effect expiry semantic triggers"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
