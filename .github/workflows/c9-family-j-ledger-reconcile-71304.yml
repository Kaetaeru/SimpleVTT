name: C9 Family J Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile verified Family J seam bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=agent/c9-gate-n-coverage-reconciliation
          WORKFLOW=.github/workflows/c9-family-j-ledger-reconcile-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((entry)=>entry.family==='J');
          if(!row) throw new Error('Family J row not found');
          if(row.disposition!=='IMPLEMENTED') throw new Error(`Family J is not IMPLEMENTED: ${row.disposition}`);
          const requiredEvidence=[row.implementationEvidence,row.productionEvidence,row.identityInvarianceEvidence,row.persistenceEvidenceIfRelevant];
          if(requiredEvidence.some((entries)=>!Array.isArray(entries)||entries.length===0)) throw new Error('Family J final evidence is incomplete');
          if(!String(row.currentState).includes('attack/control execution is complete')) throw new Error('Family J currentState does not claim completed structural execution');
          row.remainingNamedSeams=[];
          row.remainingNamedSeamCount=0;
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
            git rm -f "$WORKFLOW" || true
            git add docs/rules/v1-mechanism-coverage-ledger.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): reconcile finalized Family J seams"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
          done
          echo "Failed to publish Family J reconciliation after branch races" >&2
          exit 1
