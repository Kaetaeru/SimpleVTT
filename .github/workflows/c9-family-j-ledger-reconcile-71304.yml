name: C9 Family J Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile latest Family J evidence
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const row = ledger.rows.find((candidate) => candidate.family === 'J');
          if (!row) throw new Error('Family J ledger row is missing');
          if (row.disposition !== 'IMPLEMENTED') throw new Error(`Family J is not IMPLEMENTED: ${row.disposition}`);
          const evidence = [...row.productionEvidence, ...row.identityInvarianceEvidence];
          for (const required of ['c9FamilyJUnarmedSourceComposition71304.test.ts', 'unarmedStrikeRuntime.test.ts']) {
            if (!evidence.some((entry) => entry.includes(required))) throw new Error(`Family J evidence missing ${required}`);
          }
          if (!row.currentState.includes('complete source-owned structural runtimeAttack/runtimeSaveCondition payloads')) {
            throw new Error('Family J currentState does not record complete source-owned Unarmed projection');
          }
          row.remainingNamedSeams = [];
          if ('remainingNamedSeamCount' in row) row.remainingNamedSeamCount = 0;
          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE
            npx tsx --test \
              tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts \
              tests/ui/unarmedStrikeRuntime.test.ts
            node scripts/check-legacy-execution-boundary.mjs
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { checkV1MechanismCoverage } from './scripts/check-v1-mechanism-coverage.mjs';
          const ledger = JSON.parse(readFileSync('docs/rules/v1-mechanism-coverage-ledger.json', 'utf8'));
          const row = ledger.rows.find((candidate) => candidate.family === 'J');
          if (!row || row.remainingNamedSeams.length !== 0) throw new Error('Family J named seams were not cleared');
          const result = checkV1MechanismCoverage(ledger, { gateN: true });
          if (result.errors.some((error) => error.startsWith('rows[9]'))) {
            throw new Error(result.errors.filter((error) => error.startsWith('rows[9]')).join('\n'));
          }
          NODE
            git config user.name "github-actions[bot]"
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git rm .github/workflows/c9-family-j-ledger-reconcile-71304.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): finalize Family J attack control evidence"
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            echo "Branch advanced during Family J reconciliation; retrying ($attempt/3)" >&2
          done
          exit 1
