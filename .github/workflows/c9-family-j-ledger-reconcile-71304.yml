name: C9 Family J Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Reconcile Family J evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          row = next(entry for entry in ledger["rows"] if entry["family"] == "J")
          assert row["id"] == "attack-control"
          assert row["disposition"] == "INCOMPLETE"

          row["currentState"] = (
              "Unknown installed Common Play attack-roll plus target damage has production evidence through a projected arbitrary-ID Actor action with Action payment, damage commit, Host/Client convergence, and Undo. "
              "Projected Unarmed grapple/shove dispatches from a typed runtimeSaveCondition action payload rather than named action IDs, with arbitrary action-ID rename evidence. "
              "Unknown installed Common Play target-rolls structural best-of STR/DEX saving throws to apply portable control, while actor-owned best-of STR/DEX ability checks remove Grappled on success through the shared Resolver; failure/success branching, Action payment, Undo, and complete external identity rename are production-proven. "
              "Family J remains incomplete for full source-owned weapon/Unarmed Strike composition, Opportunity Attack, reach/range/cover, Extra Attack/replacement, ammunition/loading constraints, and remaining named attack/action projection."
          )

          implementation = "commonPlayOperationRuntime.ts CommonPlayD20ModifierProperty supports structural {choose:highest,from:[...]} property selection for target saving throws and actor ability checks without content identity dispatch"
          production = "c9FamilyJEscapeProduction.test.ts unknown installed Common Play escapes Grappled with the higher STR/DEX ability check, preserves failed/successful Action payment and Undo, and repeats under renamed identities; C9 Family J Escape 71304 run 33315486862 passed portable control/escape, V1 coverage, legacy-boundary, and typecheck verification"
          identity = "c9FamilyJEscapeProduction.test.ts preserves best-of STR/DEX escape semantics after complete external module/content/mechanic identity rename"
          for field, value in (("implementationEvidence", implementation), ("productionEvidence", production), ("identityInvarianceEvidence", identity)):
              if value not in row[field]:
                  row[field].append(value)

          old = "portable target saving throws and conditional control effects now normalize through Common Play; best-of STR/DEX control choice, escape, and complete grapple/shove source composition remain incomplete"
          new = "complete source-owned grapple/shove action composition remains incomplete beyond the now-proven portable best-of STR/DEX control and escape semantics"
          assert old in row["remainingNamedSeams"], row["remainingNamedSeams"]
          row["remainingNamedSeams"] = [new if value == old else value for value in row["remainingNamedSeams"]]

          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify Family J ledger slice
        run: |
          node --import tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJEscapeProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish reconciled ledger
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-j-ledger-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-j-ledger-reconcile-71304.yml
          git commit -m "docs(c9): reconcile Family J escape evidence"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
