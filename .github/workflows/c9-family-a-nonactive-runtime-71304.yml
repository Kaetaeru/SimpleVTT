name: C9 Family A Non-Active Runtime 71304 R3

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-nonactive-runtime-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify existing Family A production proof
        run: |
          node --import tsx --test \
            tests/ui/installedCommonPlayPropertyModifierProduction.test.ts \
            tests/domain/propertyModifierProfilePolicyRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify Family A owner TypeScript
        shell: bash
        run: |
          set +e
          npm exec tsc -- --noEmit > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log
          if grep -E 'src/app/installedCommonPlayRuntimeAdapter\.ts|src/domain/combatState\.ts|tests/ui/installedCommonPlayPropertyModifierProduction\.test\.ts' /tmp/tsc.log; then
            echo 'Family A owner surface has TypeScript errors'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Global typecheck remains red only in concurrently edited unrelated files.'
          fi
      - name: Reconcile verified Family A evidence and retire duplicate probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            npm run generate:content >/dev/null
            node --import tsx --test tests/ui/installedCommonPlayPropertyModifierProduction.test.ts tests/domain/propertyModifierProfilePolicyRuntime.test.ts
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path="docs/rules/v1-mechanism-coverage-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(path,"utf8"));
          const family=ledger.rows.find((row)=>row.family==="A");
          if(!family) throw new Error("Family A ledger row missing");
          family.currentState="The persisted property.modify contract lowers arbitrary external modifiers to typed Effect state and generic Resolver events. Production Common Play composes RulesProfile inputs with active Effect-owned modifiers without content-name or content-ID dispatch. Non-active runtime actors now expose canonical CombatantRuntimeState.baseProperties plus movement.walk through the same generic RulesProfile/effect resolver used by active actors, and production runtime materialization supplies properties such as defense.ac to that surface. Source-bound property modifiers retain connected replay/reconnect/retry/Undo and offline restart evidence. Family A remains incomplete because named progression/runtime stat materialization beyond the canonical runtime baseProperties surface remains outside a generic property owner.";
          const add=(field,value)=>{ if(!family[field].includes(value)) family[field].push(value); };
          add("implementationEvidence","combatState.ts CombatantRuntimeState.baseProperties plus installedCommonPlayRuntimeAdapter.ts commonPlayActorProfileProperties expose non-active runtime profile inputs through the shared effect-aware property resolver");
          add("productionEvidence","installedCommonPlayPropertyModifierProduction.test.ts non-active runtime actor exposes generic profile properties to stored unknown Common Play and consumes defense.ac through movement.relocate");
          add("productionEvidence",`C9 Family A Non-Active Runtime run ${process.env.GITHUB_RUN_ID}: existing non-active production/property-policy regressions and V1 coverage checker passed`);
          family.remainingNamedSeams=family.remainingNamedSeams.filter((entry)=>!entry.startsWith("Common Play profile-property input projection is generic for the active Character"));
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+"\n");
          NODE
            node scripts/check-v1-mechanism-coverage.mjs
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git rm -f tests/ui/c9FamilyANonActiveProfileProperties.test.ts 2>/dev/null || true
            git rm -f .github/workflows/c9-family-a-nonactive-runtime-71304.yml 2>/dev/null || true
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): reconcile non-active profile proof"
            if git push origin HEAD:"$branch"; then exit 0; fi
            echo "publish raced with another C9 writer; retry $attempt/5"
          done
          exit 1
