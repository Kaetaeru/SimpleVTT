name: C9 Family A Property Production Recover R2
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-property-production-recover-r2.yml]
permissions:
  contents: write
jobs:
  property-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply typed Effect-owned property modifier lowering
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: expected one anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          effects='src/domain/effects.ts'
          replace_once(
              effects,
              'import { DomainEvaluationError, type ProvenanceRecord } from "./profileEngine";',
              'import { DomainEvaluationError, type ExpressionNode, type ProvenanceRecord } from "./profileEngine";',
              'effects import',
          )
          replace_once(
              effects,
              'export interface EffectInstance {',
              '''export interface EffectPropertyModifier {
            property:string;
            operation:"add"|"subtract"|"set"|"min"|"max"|"multiply";
            value:ExpressionNode;
            source:"definition";
            instancePolicy:"stack"|"replace"|"unique-by-source"|"profile-policy";
          }

          export interface EffectInstance {''',
              'effect property type',
          )
          replace_once(
              effects,
              '  conditionId?: ConditionId;\n  tags: string[];',
              '  conditionId?: ConditionId;\n  propertyModifier?: EffectPropertyModifier;\n  tags: string[];',
              'effect instance payload',
          )
          replace_once(
              effects,
              '  conditionId?: ConditionId;\n  tags?: string[];',
              '  conditionId?: ConditionId;\n  propertyModifier?: EffectPropertyModifier;\n  tags?: string[];',
              'effect request payload',
          )
          replace_once(
              effects,
              '  if (request.kind === "condition" && !request.conditionId) throw new DomainEvaluationError("condition effect requires conditionId");\n  if (request.duration.kind === "concentration" && !request.concentrationGroupId) throw new DomainEvaluationError("concentration effect requires concentrationGroupId");',
              '  if (request.kind === "condition" && !request.conditionId) throw new DomainEvaluationError("condition effect requires conditionId");\n  if (request.propertyModifier && request.kind !== "modifier") throw new DomainEvaluationError("property modifier payload requires modifier effect kind");\n  if (request.duration.kind === "concentration" && !request.concentrationGroupId) throw new DomainEvaluationError("concentration effect requires concentrationGroupId");',
              'effect validation',
          )
          replace_once(
              effects,
              '    conditionId:request.conditionId,\n    tags:[...(request.tags ?? [])],',
              '    conditionId:request.conditionId,\n    propertyModifier:request.propertyModifier ? structuredClone(request.propertyModifier) : undefined,\n    tags:[...(request.tags ?? [])],',
              'effect materialization',
          )

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_once(
              runtime,
              'import { DomainEvaluationError, type RollStateContribution, type RulesProfileLike } from "./profileEngine";',
              'import { DomainEvaluationError, type ExpressionNode, type RollStateContribution, type RulesProfileLike } from "./profileEngine";',
              'runtime import',
          )
          replace_once(
              runtime,
              'type CommonPlayExpression=LiteralNumberExpression|Record<string,unknown>;\ntype CommonPlayHpTarget=',
              'type CommonPlayExpression=LiteralNumberExpression|Record<string,unknown>;\ntype CommonPlayPropertyExpression=ExpressionNode;\ntype CommonPlayHpTarget=',
              'property expression type',
          )
          replace_once(
              runtime,
              'type CommonPlayPropertyModifier={\n  kind:"property.modify";\n  property:string;\n  operation:"add"|"subtract"|"set"|"min"|"max"|"multiply";\n  value:CommonPlayExpression;',
              'type CommonPlayPropertyModifier={\n  kind:"property.modify";\n  property:string;\n  operation:"add"|"subtract"|"set"|"min"|"max"|"multiply";\n  value:CommonPlayPropertyExpression;',
              'property value type',
          )
          replace_once(
              runtime,
              'function numericExpression(value:unknown,label:string):CommonPlayExpression {',
              'function numericExpression(value:unknown,label:string):CommonPlayPropertyExpression {',
              'numeric expression return type',
          )
          replace_once(
              runtime,
              '    if(operation.kind==="property.modify") throw new DomainEvaluationError("property.modify production lowering is not implemented; Effect-owned property modifiers must not fall through to another execution engine");',
              '''    if(operation.kind==="property.modify") {
              const targetId=operation.target==="actor"?input.actorId:input.targetId;
              if(!targetId) throw new DomainEvaluationError("Common Play target property modifier requires one pre-resolved target");
              const duration=operation.duration.unit==="days"
                ? {kind:"hours" as const,amount:operation.duration.amount.value*24}
                : {kind:operation.duration.unit,amount:operation.duration.amount.value};
              operations.push({
                id:operationId,
                kind:"apply-effect",
                effect:{
                  id:`${operationId}:effect`,
                  sourceId:`common-play:${supported.id}:${entryPoint.id}:operation:${index}`,
                  sourceActorId:input.actorId,
                  targetId,
                  kind:"modifier",
                  tags:["common-play:property-modifier"],
                  duration,
                  propertyModifier:{
                    property:operation.property,
                    operation:operation.operation,
                    value:structuredClone(operation.value),
                    source:"definition",
                    instancePolicy:operation.instancePolicy,
                  },
                },
              });
              continue;
            }''',
              'property production lowering',
          )

          Path('tests/domain/commonPlayPropertyContractRuntime.test.ts').write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { compileCommonPlayEntryPointOperations, parseCommonPlayOperationDefinition } from "../../src/domain/commonPlayOperationRuntime";
          import { resolvePendingResolution } from "../../src/domain/resolution";
          import { runtimeState, TEST_PROFILE } from "./rulesTestState";

          function definition(id="external.unseen.property-owner") { return {schemaVersion:"0.2-draft",id,entryPoints:[{id:"activate",invocation:"manual",operations:[{kind:"property.modify",property:"movement.walk",operation:"add",value:{op:"add",args:[{ref:"movement.walk"},{value:10}]},target:"actor",owner:"effect",source:"definition",duration:{kind:"elapsed",amount:{value:1},unit:"minutes"},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:"unique-by-source"}]}]}; }

          test("property.modify preserves explicit effect ownership without content identity dispatch",()=>{
            const parsed=parseCommonPlayOperationDefinition(definition());
            const operation=parsed.entryPoints[0]?.operations[0];
            assert.equal(operation?.kind,"property.modify");
            assert.deepEqual(operation,parseCommonPlayOperationDefinition(definition("external.renamed.property-owner")).entryPoints[0]?.operations[0]);
            assert.deepEqual(operation&&"value" in operation?operation.value:undefined,{op:"add",args:[{ref:"movement.walk"},{value:10}]});
          });

          test("property.modify lowers to the authoritative Effect owner and commits through Resolver",()=>{
            const parsed=parseCommonPlayOperationDefinition(definition());
            const state=runtimeState();
            const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,{resolutionId:"property-contract",actorId:"hero",entryPointId:"activate"});
            assert.equal(pending.operations.length,1);
            const operation=pending.operations[0];
            assert.equal(operation?.kind,"apply-effect");
            if(!operation||operation.kind!=="apply-effect") throw new Error("expected apply-effect");
            assert.equal(operation.effect.targetId,"hero");
            assert.equal(operation.effect.kind,"modifier");
            assert.deepEqual(operation.effect.propertyModifier,{property:"movement.walk",operation:"add",value:{op:"add",args:[{ref:"movement.walk"},{value:10}]},source:"definition",instancePolicy:"unique-by-source"});
            const committed=resolvePendingResolution(TEST_PROFILE,state,pending);
            assert.equal(committed.status,"committed");
            if(committed.status!=="committed") return;
            assert.deepEqual(committed.state.effects[0]?.propertyModifier,operation.effect.propertyModifier);
            assert.equal(committed.events[0]?.stateChanges[0]?.kind,"effect");
          });

          test("property.modify rejects ambiguous ownership instead of falling through",()=>{
            const missing=definition() as any; delete missing.entryPoints[0].operations[0].owner;
            assert.throws(()=>parseCommonPlayOperationDefinition(missing),/owner must be effect/);
            const durable=definition() as any; durable.entryPoints[0].operations[0].duration={kind:"durable"};
            assert.throws(()=>parseCommonPlayOperationDefinition(durable),/duration.kind must be elapsed/);
          });
          ''')
      - run: npx tsx --test tests/domain/commonPlayPropertyContractRuntime.test.ts tests/domain/commonPlayDefinitionRuntime.test.ts tests/domain/effectsRuntime.test.ts
      - run: npm run test:common-play-definition
      - run: npm run generate:content
      - run: npx tsc --noEmit
      - name: Commit verified Family A slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/effects.ts src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayPropertyContractRuntime.test.ts
          git rm .github/workflows/c9-family-a-property-production-step.yml .github/workflows/c9-family-a-property-production-recover-r2.yml
          git commit -m "feat(c9): lower property modifiers to typed effects"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 2
          done
          exit 1
