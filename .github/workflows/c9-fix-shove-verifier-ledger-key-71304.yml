name: C9 Fix Shove Verifier Ledger Key 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-fix-shove-verifier-ledger-key-71304.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fix verifier against current ledger shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-j-shove-source-composition-71304.yml')
          text=path.read_text(encoding='utf-8')
          old="ledger['families']"
          new="ledger['rows']"
          if text.count(old)!=1:
              raise SystemExit(f'expected one stale ledger key, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-fix-shove-verifier-ledger-key-71304.yml
          git add .github/workflows/c9-family-j-shove-source-composition-71304.yml
          git commit -m "ci(c9): align shove verifier with ledger rows"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
