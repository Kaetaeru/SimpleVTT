name: C9 Resource Capacity Persistence Patch

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-resource-capacity-persistence-bot.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply capacity persistence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path, before, after, count=1):
              p=Path(path)
              text=p.read_text()
              actual=text.count(before)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact matches, found {actual}: {before[:80]!r}")
              p.write_text(text.replace(before,after))

          def regex(path, pattern, after, count=1):
              p=Path(path)
              text=p.read_text()
              next_text,actual=re.subn(pattern,lambda _:after,text,count=count,flags=re.S)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} regex matches, found {actual}: {pattern[:80]!r}")
              p.write_text(next_text)

          exact(
              "src/app/progressionContracts.ts",
              '''      longRest?: number;\n    };\n  }\n\n  interface CharacterSheet''',
              '''      longRest?: number;\n    };\n    sourceMaximum?: number;\n    maximumAfterLongRest?: number;\n  }\n\n  interface CharacterSheet''',
          )

          exact(
              "src/app/characterLibraryPersistence.ts",
              "    max:resource.max,",
              "    max:resource.sourceMaximum ?? resource.max,",
          )
          regex(
              "src/app/characterLibraryPersistence.ts",
              r'''function resourceRuntimeState\(resource:CharacterResourceVm\):CharacterResourceRuntimeStateV1 \{.*?\n\}\n\nexport function projectCharacterSourceV1''',
              '''function resourceRuntimeState(resource:CharacterResourceVm):CharacterResourceRuntimeStateV1 {\n  const sourceMaximum=resource.sourceMaximum ?? resource.max;\n  return {\n    id:resource.id,\n    current:resource.current,\n    maximum:resource.max===sourceMaximum ? undefined : resource.max,\n    maximumAfterLongRest:resource.maximumAfterLongRest,\n    recoveryLockouts:resource.recoveryLockouts ? cp(resource.recoveryLockouts) : undefined,\n  };\n}\n\nexport function projectCharacterSourceV1''',
          )
          regex(
              "src/app/characterLibraryPersistence.ts",
              r'''function comparableRuntime\(runtime:CharacterRuntimeDurableSnapshotV1\):CharacterRuntimeDurableSnapshotV1 \{.*?\n\}\n\nexport function buildCharacterLibraryRecordV1''',
              '''function comparableRuntime(runtime:CharacterRuntimeDurableSnapshotV1):CharacterRuntimeDurableSnapshotV1 {\n  return {\n    hp:runtime.hp,\n    tempHp:runtime.tempHp,\n    lifeFlags:runtime.lifeFlags ? cp(runtime.lifeFlags) : undefined,\n    resources:runtime.resources.map((resource) => ({\n      id:resource.id,\n      current:resource.current,\n      maximum:resource.maximum,\n      maximumAfterLongRest:resource.maximumAfterLongRest,\n      recoveryLockouts:resource.recoveryLockouts ? cp(resource.recoveryLockouts) : undefined,\n    })),\n    items:runtime.items.map((item) => ({\n      id:item.id,\n      quantity:item.quantity,\n      equipped:item.equipped,\n      wielded:item.wielded,\n      wieldSlot:item.wieldSlot,\n      attuned:item.attuned,\n      charges:item.charges ? { current:item.charges.current } : undefined,\n    })),\n    goldGp:runtime.goldGp,\n  };\n}\n\nexport function buildCharacterLibraryRecordV1''',
          )
          regex(
              "src/app/characterLibraryPersistence.ts",
              r'''function materializeResources\(record:CharacterLibraryRecordV1\):CharacterResourceVm\[\] \{.*?\n\}\n\nfunction materializeItems''',
              '''function materializeResources(record:CharacterLibraryRecordV1):CharacterResourceVm[] {\n  const definitions=record.source.resourceDefinitions;\n  if (!definitions) return cp(record.runtime.resources as unknown as CharacterResourceVm[]);\n  const runtimeById=new Map(record.runtime.resources.map((resource)=>[resource.id,resource]));\n  return definitions.map((definition)=>{\n    const runtime=runtimeById.get(definition.id);\n    const maximum=runtime?.maximum ?? definition.max;\n    return {\n      id:definition.id,\n      label:definition.label,\n      current:Math.min(runtime?.current ?? maximum,maximum),\n      max:maximum,\n      sourceMaximum:definition.max,\n      maximumAfterLongRest:runtime?.maximumAfterLongRest,\n      dieSides:definition.dieSides,\n      source:definition.source,\n      recovery:definition.recovery ? cp(definition.recovery) : undefined,\n      recoveryLockouts:runtime?.recoveryLockouts ? cp(runtime.recoveryLockouts) : undefined,\n    };\n  });\n}\n\nfunction materializeItems''',
          )

          exact(
              "src/app/resolutionCharacterDurableProjection.ts",
              'type DurableCharacterResource=CharacterSheet["resources"][number]&{recoveryLockouts?:ResourceRecoveryLockouts};',
              '''type DurableCharacterResource=CharacterSheet["resources"][number]&{\n  recoveryLockouts?:ResourceRecoveryLockouts;\n  sourceMaximum?:number;\n  maximumAfterLongRest?:number;\n};''',
          )
          exact(
              "src/app/resolutionCharacterDurableProjection.ts",
              '      if (change.recoveryLockouts) return `Character write-back item resource cannot carry recovery lockouts: ${change.resourceId}`;',
              '      if (change.recoveryLockouts) return `Character write-back item resource cannot carry recovery lockouts: ${change.resourceId}`;\n      if (change.capacity) return `Character write-back item resource cannot carry capacity changes: ${change.resourceId}`;',
          )
          exact(
              "src/app/resolutionCharacterDurableProjection.ts",
              '''    resource.current=after;\n    return;\n  }\n  if (change.kind==="death-save")''',
              '''    if (change.capacity) {\n      const expected=direction==="forward" ? change.capacity.before : change.capacity.after;\n      const next=direction==="forward" ? change.capacity.after : change.capacity.before;\n      const currentMarker=resource.maximumAfterLongRest ?? null;\n      if (resource.max!==expected.maximum || currentMarker!==expected.maximumAfterLongRest) {\n        return `Character write-back drift for ${change.targetId}/${label(change)}.capacity`;\n      }\n      if (next.maximum<0 || after>next.maximum) {\n        return `Character write-back invalid capacity for ${change.targetId}/${label(change)}: maximum ${next.maximum}, current ${after}`;\n      }\n      if (resource.sourceMaximum===undefined) resource.sourceMaximum=resource.max;\n      resource.max=next.maximum;\n      if (next.maximumAfterLongRest===null) delete resource.maximumAfterLongRest;\n      else resource.maximumAfterLongRest=next.maximumAfterLongRest;\n    }\n    resource.current=after;\n    return;\n  }\n  if (change.kind==="death-save")''',
          )

          exact(
              "tests/ui/phase09CommonPlayResourcePersistence.test.ts",
              'import { MemoryCharacterLibraryStore } from "../../src/app/memoryCharacterLibraryStore";\n',
              'import { MemoryCharacterLibraryStore } from "../../src/app/memoryCharacterLibraryStore";\nimport { buildCharacterLibraryRecordV1, materializeCharacterRecordV1 } from "../../src/app/characterLibraryPersistence";\nimport { projectResolutionCharacterWriteBack } from "../../src/app/resolutionCharacterDurableProjection";\nimport type { ResolutionEvent } from "../../src/domain/resolutionTypes";\n',
          )
          test_path=Path("tests/ui/phase09CommonPlayResourcePersistence.test.ts")
          test_text=test_path.read_text()
          marker='test("temporary resource capacity overlay persists without mutating source maximum and reverses through Undo projection"'
          if marker in test_text:
              raise SystemExit("capacity persistence test already exists")
          test_text += '''\n\ntest("temporary resource capacity overlay persists without mutating source maximum and reverses through Undo projection",async()=>{\n  const adapter=new MockAdapter();\n  const snapshot=await adapter.getSnapshot();\n  const sheet=structuredClone(snapshot.activeCharacter);\n  const resource=sheet.resources.find((entry)=>entry.id===FIGHTER_SECOND_WIND_RESOURCE_ID);\n  assert.ok(resource);\n  const baseMaximum=resource.max;\n  const event={\n    id:"family-d-capacity-persistence:event",\n    resolutionId:"family-d-capacity-persistence",\n    operationId:"family-d-capacity-persistence:resource",\n    kind:"resource-capacity-probe",\n    actorId:sheet.id,\n    targetId:sheet.id,\n    summary:"temporary capacity probe",\n    provenance:[],\n    stateChanges:[{\n      kind:"resource",\n      targetId:sheet.id,\n      resourceId:resource.id,\n      before:resource.current,\n      after:resource.current,\n      capacity:{\n        before:{maximum:baseMaximum,maximumAfterLongRest:null},\n        after:{maximum:baseMaximum+1,maximumAfterLongRest:baseMaximum},\n      },\n      provenance:[],\n      lifetime:"character-durable",\n      writeBack:"character",\n    }],\n    result:{},\n  } satisfies ResolutionEvent;\n\n  const forward=projectResolutionCharacterWriteBack(sheet,[event],"forward");\n  assert.equal(forward.status,"committed",forward.status==="rejected"?forward.error:undefined);\n  if (forward.status!=="committed") return;\n  const expanded=forward.sheet.resources.find((entry)=>entry.id===resource.id);\n  assert.equal(expanded?.max,baseMaximum+1);\n  assert.equal(expanded?.sourceMaximum,baseMaximum);\n  assert.equal(expanded?.maximumAfterLongRest,baseMaximum);\n\n  const record=buildCharacterLibraryRecordV1(forward.sheet);\n  assert.equal(record.source.resourceDefinitions?.find((entry)=>entry.id===resource.id)?.max,baseMaximum);\n  const durable=record.runtime.resources.find((entry)=>entry.id===resource.id);\n  assert.equal(durable?.maximum,baseMaximum+1);\n  assert.equal(durable?.maximumAfterLongRest,baseMaximum);\n\n  const restarted=materializeCharacterRecordV1(record);\n  const restoredResource=restarted.resources.find((entry)=>entry.id===resource.id);\n  assert.equal(restoredResource?.max,baseMaximum+1);\n  assert.equal(restoredResource?.sourceMaximum,baseMaximum);\n  assert.equal(restoredResource?.maximumAfterLongRest,baseMaximum);\n\n  const inverse=projectResolutionCharacterWriteBack(restarted,[event],"inverse");\n  assert.equal(inverse.status,"committed",inverse.status==="rejected"?inverse.error:undefined);\n  if (inverse.status!=="committed") return;\n  const normalized=inverse.sheet.resources.find((entry)=>entry.id===resource.id);\n  assert.equal(normalized?.max,baseMaximum);\n  assert.equal(normalized?.sourceMaximum,baseMaximum);\n  assert.equal(normalized?.maximumAfterLongRest,undefined);\n\n  const undoneRecord=buildCharacterLibraryRecordV1(inverse.sheet,record);\n  assert.equal(undoneRecord.sourceRevision,record.sourceRevision);\n  assert.equal(undoneRecord.source.resourceDefinitions?.find((entry)=>entry.id===resource.id)?.max,baseMaximum);\n  const undoneRuntime=undoneRecord.runtime.resources.find((entry)=>entry.id===resource.id);\n  assert.equal(undoneRuntime?.maximum,undefined);\n  assert.equal(undoneRuntime?.maximumAfterLongRest,undefined);\n});\n'''
          test_path.write_text(test_text)

          exact(
              ".github/workflows/m1-common-play-resource-economy.yml",
              '      - "src/app/resolutionCharacterDurableProjection.ts"\n',
              '      - "src/app/resolutionCharacterDurableProjection.ts"\n      - "src/app/characterLibraryPersistence.ts"\n      - "src/app/persistenceContracts.ts"\n      - "src/app/progressionContracts.ts"\n',
              count=2,
          )
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify focused resource persistence
        run: npx tsx --test tests/domain/resourceRecoveryLockout.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified patch and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-resource-capacity-persistence-bot.yml
          git add src/app/progressionContracts.ts src/app/characterLibraryPersistence.ts src/app/resolutionCharacterDurableProjection.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts .github/workflows/m1-common-play-resource-economy.yml
          git commit -m "feat(c9): persist temporary resource capacity"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
