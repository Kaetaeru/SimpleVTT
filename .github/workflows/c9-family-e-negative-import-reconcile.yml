name: C9 Family E Negative Import Reconcile

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-negative-import-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reconcile negative import assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=path.read_text(encoding='utf-8')
          replacements=[
            ('/targeting|unsupported fields/.test(entry.message)', '/targeting|unsupported fields|multi-target selection/.test(entry.message)'),
            ('/portable Common Play/.test(entry.message)', '/portable Common Play|portable consent interaction/.test(entry.message)'),
          ]
          for old,new in replacements:
            count=text.count(old)
            if count != 1:
              raise SystemExit(f'expected one assertion match for {old!r}, got {count}')
            text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E production and import slice
        run: npx tsx --test tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts tests/ui/ruleModulePackageImport.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified assertion reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-negative-import-reconcile.yml
          git add tests/ui/ruleModulePackageImport.test.ts
          git diff --cached --check
          git commit -m "test(c9): reconcile bounded target import rejections"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
