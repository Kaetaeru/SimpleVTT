name: C9 Family J Ammunition Rerun 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-ammunition-rerun-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify and publish ammunition evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-ammunition-rerun-71304.yml
          stale=.github/workflows/c9-family-j-ammunition-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            test -f tests/ui/c9FamilyJAmmunitionProduction.test.ts
            python3 - <<'PY'
          import json
          from pathlib import Path
          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          additions={
            'implementationEvidence':'commonPlayOperationRuntime.ts generic resource PaymentContract composes source-owned ammunition consumption atomically with the existing Common Play attack transaction',
            'productionEvidence':'c9FamilyJAmmunitionProduction.test.ts proves an unknown installed ranged attack consumes a source-owned ammunition pool, rejects at zero without downstream commit, restores through event-native Undo, and repeats under fully renamed external identities',
            'identityInvarianceEvidence':'c9FamilyJAmmunitionProduction.test.ts repeats source-owned ammunition payment and empty-ammunition rejection after complete module/content/mechanic/resource identity rename',
          }
          for field,value in additions.items():
              if value not in row[field]: row[field].append(value)
          sentence=' Portable source-owned ammunition composes through the generic resource PaymentContract with attack execution, including empty-ammunition atomic rejection, event-native Undo, and complete external identity rename.'
          if sentence.strip() not in row['currentState']:
              row['currentState']=row['currentState'].rstrip()+sentence
          row['remainingNamedSeams']=[seam.replace(
              'reach, long range, cover, multiattack/Extra Attack/replacement, and ammunition/loading constraints remain incomplete',
              'reach, long range, cover, multiattack/Extra Attack/replacement, and Loading constraints remain incomplete'
          ) for seam in row['remainingNamedSeams']]
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            npm run generate:content
            node --import tsx --test tests/ui/c9FamilyJAmmunitionProduction.test.ts tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJAttackPersistence.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
            node scripts/check-legacy-execution-boundary.mjs
            node scripts/check-v1-mechanism-coverage.mjs
            npm exec tsc -- --noEmit
            rm -f "$workflow" "$stale"
            git add docs/rules/v1-mechanism-coverage-ledger.json "$workflow"
            if [ -f "$stale" ]; then git add "$stale"; else git add -u "$stale" || true; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test(c9): record portable ammunition evidence"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
