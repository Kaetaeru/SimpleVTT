name: C9 Family J Unarmed Identity Fix

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-unarmed-identity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch runtime attack identity bridge and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime="src/app/phase09RealRuntimeAttackAdapter.ts"
          replace_once(
              runtime,
              '''function reject(adapter:MockAdapter,internal:RuntimeAttackAdapterState,error:string,restoreBefore=true) {''',
              '''async function actionForResolution(internal:RuntimeAttackAdapterState,actionId:string) {\n  return internal.action(actionId)\n    ?? Object.values((await internal.getSnapshot()).scene.actionsByActor).flat().find((action)=>action.id===actionId);\n}\n\nfunction reject(adapter:MockAdapter,internal:RuntimeAttackAdapterState,error:string,restoreBefore=true) {''',
          )
          replace_once(
              runtime,
              '''  const action = resolution ? internal.action(resolution.actionId) : undefined;\n  const manual = manualFor(this,action,resolution);''',
              '''  const action = resolution ? await actionForResolution(internal,resolution.actionId) : undefined;\n  const manual = manualFor(this,action,resolution);''',
          )

          test="tests/ui/unarmedStrikeRuntime.test.ts"
          p=Path(test)
          text=p.read_text(encoding='utf-8')
          old='''test("Unarmed damage grapple and shove execute from structural payloads after presentation rename", async () => {\n  const cases=[\n    {canonicalId:"action.unarmed-strike.damage",renamedId:"action.external.unarmed.damage",targetId:"combatant.goblin-a",kind:"damage" as const},\n    {canonicalId:"action.unarmed-strike.grapple",renamedId:"action.external.unarmed.control-a",targetId:"combatant.goblin-a",kind:"grapple" as const},\n    {canonicalId:"action.unarmed-strike.shove-prone",renamedId:"action.external.unarmed.control-b",targetId:"combatant.goblin-b",kind:"shove" as const},\n  ];\n\n  for(const probe of cases) {\n    const adapter=new MockAdapter();\n    await ready(adapter);\n    const baseline=await adapter.getSnapshot();\n    const source=baseline.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id===probe.canonicalId);\n    assert.ok(source);\n    if(probe.kind==="damage") {\n      assert.equal(source.runtimeAttack?.sourceKind,"unarmed");\n      assert.equal(source.damage?.[0].dice,"0d2");\n    } else {\n      assert.deepEqual(source.runtimeSaveCondition?.saveAbilities,["str","dex"]);\n    }\n\n    const beforeHp=baseline.scene.entities.find((entry)=>entry.id===probe.targetId)?.hp;\n    const originalGetSnapshot=adapter.getSnapshot.bind(adapter);\n    adapter.getSnapshot=async()=>{\n      const snapshot=await originalGetSnapshot();\n      const action=snapshot.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id===probe.canonicalId);\n      if(action) action.name=`External ${probe.kind}`;\n      return snapshot;\n    };\n\n    await adapter.setQueuedD20(probe.kind==="damage"?20:1);\n    await adapter.resolveAction(probe.canonicalId,[probe.targetId]);\n    const snapshot=probe.kind==="damage"?await finish(adapter):await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.actionId,probe.canonicalId);\n    if(probe.kind==="damage") {\n      assert.equal(snapshot.scene.entities.find((entry)=>entry.id===probe.targetId)?.hp,beforeHp!-(source.damage?.[0].flat??0));\n    } else if(probe.kind==="grapple") {\n      assert.ok(snapshot.scene.entities.find((entry)=>entry.id===probe.targetId)?.status.some((status)=>status.includes("붙잡힘")));\n    } else {\n      assert.ok(snapshot.scene.entities.find((entry)=>entry.id===probe.targetId)?.status.some((status)=>status.includes("넘어짐")));\n    }\n  }\n});'''
          new='''test("Unarmed damage grapple and shove execute from structural payloads after action identity and presentation rename", async () => {\n  const cases=[\n    {canonicalId:"action.unarmed-strike.damage",renamedId:"action.external.unarmed.damage",targetId:"combatant.goblin-a",kind:"damage" as const},\n    {canonicalId:"action.unarmed-strike.grapple",renamedId:"action.external.unarmed.control-a",targetId:"combatant.goblin-a",kind:"grapple" as const},\n    {canonicalId:"action.unarmed-strike.shove-prone",renamedId:"action.external.unarmed.control-b",targetId:"combatant.goblin-b",kind:"shove" as const},\n  ];\n\n  for(const probe of cases) {\n    const adapter=new MockAdapter();\n    await ready(adapter);\n    const baseline=await adapter.getSnapshot();\n    const source=baseline.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id===probe.canonicalId);\n    assert.ok(source);\n    if(probe.kind==="damage") {\n      assert.equal(source.runtimeAttack?.sourceKind,"unarmed");\n      assert.equal(source.damage?.[0].dice,"0d2");\n    } else {\n      assert.deepEqual(source.runtimeSaveCondition?.saveAbilities,["str","dex"]);\n    }\n\n    const beforeHp=baseline.scene.entities.find((entry)=>entry.id===probe.targetId)?.hp;\n    const originalGetSnapshot=adapter.getSnapshot.bind(adapter);\n    adapter.getSnapshot=async()=>{\n      const snapshot=await originalGetSnapshot();\n      const action=snapshot.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id===probe.canonicalId);\n      if(action) { action.id=probe.renamedId; action.name=`External ${probe.kind}`; }\n      return snapshot;\n    };\n\n    await adapter.setQueuedD20(probe.kind==="damage"?20:1);\n    await adapter.resolveAction(probe.renamedId,[probe.targetId]);\n    const snapshot=probe.kind==="damage"?await finish(adapter):await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.actionId,probe.renamedId);\n    if(probe.kind==="damage") {\n      assert.equal(snapshot.scene.entities.find((entry)=>entry.id===probe.targetId)?.hp,beforeHp!-(source.damage?.[0].flat??0));\n    } else if(probe.kind==="grapple") {\n      assert.ok(snapshot.scene.entities.find((entry)=>entry.id===probe.targetId)?.status.some((status)=>status.includes("붙잡힘")));\n    } else {\n      assert.ok(snapshot.scene.entities.find((entry)=>entry.id===probe.targetId)?.status.some((status)=>status.includes("넘어짐")));\n    }\n  }\n});'''
          if old not in text:
              raise SystemExit("current Unarmed structural payload test anchor changed")
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family J identity and replacement
        run: |
          npx tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJSpatialAttackProduction.test.ts tests/ui/c9FamilyJExtraAttackProduction71304.test.ts tests/ui/unarmedStrikeRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-unarmed-identity-fix.yml
          git add src/app/phase09RealRuntimeAttackAdapter.ts tests/ui/unarmedStrikeRuntime.test.ts
          git commit -m "fix(c9): preserve projected runtime attack identity"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
