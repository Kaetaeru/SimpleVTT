name: C9 Family E Condition Selector Fix Verifier 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-condition-selector-fix-verifier-7130.yml

permissions:
  contents: write

jobs:
  patch-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Patch retry verifier and retire fixer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-e-condition-selector-retry-7130.yml')
          text=path.read_text(encoding='utf-8')
          marker='      - name: Verify Family E condition selector slice\n'
          insert='      - name: Generate builtin catalog\n        run: npm run generate:content\n'
          if insert not in text:
            if text.count(marker)!=1:
              raise SystemExit(f'verifier marker mismatch: {text.count(marker)}')
            text=text.replace(marker,insert+marker,1)
          path.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-e-condition-selector-retry-7130.yml
          git rm -f .github/workflows/c9-family-e-condition-selector-fix-verifier-7130.yml
          git commit -m "ci(c9): generate content before condition selector proof"
          branch=agent/c9-gate-n-coverage-reconciliation
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin HEAD:"$branch"
