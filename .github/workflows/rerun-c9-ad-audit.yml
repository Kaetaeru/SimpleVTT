name: C9 Family AD Authority Audit

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ad-audit.yml

permissions:
  contents: write

jobs:
  audit-and-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0

      - name: Audit AD contracts and checkpoint ledger/state
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          ledger_path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          state_path=Path('.chatgpt-rerun/STATE.md')
          schema=json.loads(Path('schemas/common-play-contract.schema.json').read_text())
          mount=Path('src/domain/commonPlayMountRuntime.ts').read_text()
          artifacts=Path('src/domain/runtimeArtifact.ts').read_text()
          turn=Path('src/app/realTurnRuntimeService.ts').read_text()
          ledger=json.loads(ledger_path.read_text())

          assert len(ledger['rows'])==36
          assert ledger.get('gateNBlockingNamedFallbacks',[])==[]
          row=next(item for item in ledger['rows'] if item['family']=='AD')
          assert row['disposition']=='INCOMPLETE'

          for token in ['riderId','mountId','controllerId','controlledActionIds','mountFallOffOutcome']:
            assert token in mount, token
          for missing in ['capacity','crew','vehicle','dismount']:
            assert missing not in mount, missing
          assert 'initiative:"shared"|"independent"|"none"' in artifacts
          assert 'damageThreshold' in artifacts and 'repairable' in artifacts
          assert 'relation:"barrier"|"wall"|"portal"|"tether"|"rope"' in artifacts

          strings=[]
          def walk(value):
            if isinstance(value,dict):
              strings.extend(value.keys())
              for v in value.values(): walk(v)
            elif isinstance(value,list):
              for v in value: walk(v)
            elif isinstance(value,str): strings.append(value)
          walk(schema)
          assert 'mount' not in strings and 'vehicle' not in strings
          assert re.search(r'\bmount\b',turn,re.I) is None

          row['currentState']=(
            'Kernel validation defines rider/mount/controller identity, size relation, controlled versus independent mode, '
            'movement cost, controlled action IDs, and fall-off/Prone outcome. Existing actor/object/link artifacts separately '
            'provide controller/initiative and vehicle-like HP/AC/threshold/repair pieces, but the persisted Common Play contract '
            'does not define a mount/vehicle relationship and live TurnRuntime has no authoritative rider-mount topology owner. '
            'Mount/dismount cost, controlled initiative/action substitution, fall-off save dispatch, capacity, drawn vehicle, '
            'crew/speed, reconnect, and persistence composition remain undefined.'
          )
          row['implementationEvidence']=[
            'commonPlayMountRuntime.ts relationship validation and fall-off outcome',
            'runtimeArtifact.ts actor/object/link controller, initiative, HP/AC/threshold, repair primitives',
            'commonPlayC6Runtime.test.ts controlled mount validation/fall-off kernel proof',
          ]
          row['productionEvidence']=[]
          row['identityInvarianceEvidence']=[]
          row['connectedEvidenceIfRelevant']=[]
          row['persistenceEvidenceIfRelevant']=[]
          row['remainingNamedSeams']=[
            'persisted portable mount/vehicle relationship and source ownership contract is missing',
            'live rider-mount topology plus controlled/independent initiative/action and mount/dismount/fall-off authority are undefined',
            'vehicle capacity, drawn-vehicle crew/speed, and connected persistence composition are undefined',
          ]

          counts={}
          for item in ledger['rows']:
            counts[item['disposition']]=counts.get(item['disposition'],0)+1
          assert counts=={'INCOMPLETE':32,'IMPLEMENTED':4},counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')

          state=state_path.read_text()
          first=state.find('## Family AC audit — authority contract gap')
          if first<0:
            first=state.find('## Family AC audit — authority contract missing')
          assert first>=0
          prefix=state[:first].rstrip()
          ac='''## Family AC audit — authority contract gap\n\nFamily AC (`legendary-lair-special-timing`) remains `INCOMPLETE`: the kernel compiles owner/timing/option/cost, but the persisted Common Play contract has no portable special-action timing definition and live TurnRuntime has no authoritative after-turn/initiative-count event, refresh/order policy, connected owner interaction, or persistence owner. No production policy was invented.\n'''
          ad='''## Family AD audit — authority contract gap\n\nFamily AD (`mount-vehicle-controller`) remains `INCOMPLETE` after repository-authority audit. The existing mount kernel and artifact primitives are insufficient to claim a production mount/vehicle composition.\n\n- `commonPlayMountRuntime.ts` validates rider/mount/controller identities, size, mode, movement cost, controlled action IDs, and a pure fall-off/Prone outcome.\n- `runtimeArtifact.ts` separately supplies actor controller/initiative plus object HP/AC/damage-threshold/repair and generic link primitives, but none of those contracts defines a rider-mount relationship or mounted-combat ownership.\n- `schemas/common-play-contract.schema.json` has no persisted mount/vehicle relationship vocabulary, and `realTurnRuntimeService.ts` has no live mount topology owner.\n- Mount/dismount cost, controlled action/initiative substitution, independent mount behavior, fall-off save dispatch, capacity, drawn-vehicle crew/speed, reconnect, and durable persistence are therefore not repository-defined production semantics.\n- No AD production source was changed. Coverage remains `IMPLEMENTED=4`, `INCOMPLETE=32`, `PROVEN_UNNEEDED=0`; `gateNBlockingNamedFallbacks` remains empty.\n'''
          nxt='''## Next Exact Action\n\nDo not reopen Families S/T/U/AB or audited authority-blocked P/V/W/X/Y/Z/AA/AC/AD without a repository-defined authority contract. Audit Family AE (`hazards-exposure-environment`): reconcile the existing exposure/environment/falling kernels with authoritative campaign/session clock ownership, periodic Resolver dispatch, recovery/reset, connected replay/reconnect, and persistence. Implement only an already-defined production composition; if campaign-clock persistence or periodic hazard ownership is undefined, keep AE `INCOMPLETE` with the exact contract gap and continue to the next non-blocked family.\n'''
          state_path.write_text(prefix+'\n\n'+ac+'\n'+ad+'\n'+nxt)
          PY

      - name: Validate audit invariants
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'));
          const row=ledger.rows.find(r=>r.family==='AD');
          if(!row||row.disposition!=='INCOMPLETE') throw new Error('Family AD must remain INCOMPLETE');
          const counts=ledger.rows.reduce((m,r)=>(m[r.disposition]=(m[r.disposition]??0)+1,m),{});
          if(counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32) throw new Error(JSON.stringify(counts));
          if((ledger.gateNBlockingNamedFallbacks??[]).length) throw new Error('Gate N named fallback blockers must remain empty');
          if(row.productionEvidence.length||row.connectedEvidenceIfRelevant.length||row.persistenceEvidenceIfRelevant.length) throw new Error('AD audit must not fabricate production evidence');
          console.log(JSON.stringify({family:row.family,disposition:row.disposition,counts}));
          NODE

      - name: Commit ledger and STATE first
        run: |
          rm .github/workflows/rerun-c9-ad-audit.yml
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md .github/workflows/rerun-c9-ad-audit.yml
          git commit -m "docs(c9): record Family AD authority gap"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation

      - name: Publish control last
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.chatgpt-rerun/control.json')
          data=json.loads(p.read_text())
          assert data['run_id']=='b7f27a61-29d8-4ba2-9f93-8e66722d5f41'
          assert data['sequence']==7
          assert data['task_id']=='v1-common-play-c8-rerun'
          data['status']='continue'
          data['reason']=(
            'C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Families AC and AD are now audited authority gaps, not safe adapter tasks: AC lacks persisted/live special-timing ownership; AD has mount and artifact kernels but no persisted rider-mount/vehicle relationship or live topology, initiative/action, capacity/crew, reconnect/persistence owner. No policy was invented. Next audit Family AE hazards/exposure/environment against campaign/session clock ownership and periodic Resolver dispatch.'
          )
          data['updated_at']='2026-08-30'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git add .chatgpt-rerun/control.json
          git commit -m "docs(rerun): continue after Family AD audit"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
