name: C9 State Sequence 11

on:
  push:
    paths:
      - '.github/workflows/c9-state-sequence-11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/c9-state-sequence-11.mjs
      - name: Verify sequence 11 state
        run: |
          grep -F -- '- sequence: `11`' .chatgpt-rerun/STATE.md
          grep -F -- 'IMPLEMENTED=5`, `INCOMPLETE=31`, `PROVEN_UNNEEDED=0' .chatgpt-rerun/STATE.md
          grep -F -- 'Continue with Family D (`payment-resource`)' .chatgpt-rerun/STATE.md
      - name: Commit STATE after PLAN
        run: |
          rm -f scripts/c9-state-sequence-11.mjs .github/workflows/c9-state-sequence-11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chatgpt-rerun/STATE.md
          git rm --cached --ignore-unmatch scripts/c9-state-sequence-11.mjs .github/workflows/c9-state-sequence-11.yml || true
          rm -f scripts/c9-state-sequence-11.mjs .github/workflows/c9-state-sequence-11.yml
          git add -u scripts .github/workflows
          git commit -m 'docs(rerun): checkpoint Family C completion'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
