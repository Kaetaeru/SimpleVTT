name: C9 Family J Ledger Sync 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-j-ledger-sync-71304.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Fast-forward to current branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - name: Reconcile verified Family J evidence
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text())
          family=next(entry for entry in data['families'] if entry['family']=='J')
          family['currentState']=(
            'Unknown installed Common Play attack-roll plus target damage has production evidence through a projected arbitrary-ID Actor action with Action payment, damage commit, Host/Client convergence, and Undo. '
            'Projected Unarmed grapple/shove dispatches from a typed runtimeSaveCondition action payload rather than named action IDs, with arbitrary action-ID rename evidence. '
            'Unknown installed Common Play can now also target-roll a structural saving throw from save.<ability>.modifier and conditionally apply a control condition through the shared Resolver, with failure/success branching, Undo, and complete external identity rename evidence. '
            'Family J remains incomplete for best-of STR/DEX portable control choice and escape plus full weapon/Unarmed Strike, Opportunity Attack, reach/range/cover, Extra Attack/replacement, and ammunition/loading composition.'
          )
          def append_once(key,value):
            if value not in family[key]: family[key].append(value)
          append_once('implementationEvidence','commonPlayOperationRuntime.ts parses target-rolled portable d20 tests with structural property modifiers and lowers test.outcome-conditional condition operations to the shared Resolver; installedCommonPlayRuntimeAdapter.ts supplies save.<ability>.modifier through resolveRuntimeSaveModifier without content identity dispatch')
          append_once('productionEvidence','c9FamilyJPortableControlProduction.test.ts unknown installed Common Play target-rolls a Goblin DEX save, applies grappled only on failure, skips it on success, reverses through Undo, and repeats under completely renamed external identities')
          append_once('productionEvidence','C9 Family J Publish Retry 71304 run 33313408895: 7/7 targeted Family J/M/unarmed regressions, legacy execution boundary, and tsc --noEmit passed; verified slice published as 8c3de34cc818b833bb0f8ff9a46675471a04ddfc')
          append_once('identityInvarianceEvidence','c9FamilyJPortableControlProduction.test.ts preserves target-save and conditional-control semantics after complete external module/content/mechanic identity rename')
          old='projected grapple/shove is action-ID independent but remains outside portable Common Play import/normalization and escape control composition'
          new='portable target saving throws and conditional control effects now normalize through Common Play; best-of STR/DEX control choice, escape, and complete grapple/shove source composition remain incomplete'
          family['remainingNamedSeams']=[new if seam==old else seam for seam in family['remainingNamedSeams']]
          if old in family['remainingNamedSeams']:
            raise SystemExit('stale Family J seam replacement failed')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish evidence and retire verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-ledger-sync-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): record portable Family J control evidence"
          for attempt in $(seq 1 12); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if ! git rebase origin/agent/c9-gate-n-coverage-reconciliation; then
              git rebase --abort || true
              echo "Concurrent ledger edit conflicts with Family J evidence; refusing to overwrite it."
              exit 1
            fi
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          echo "Branch remained busy after bounded publish retries."
          exit 1
