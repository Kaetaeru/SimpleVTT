name: C9 Family X Item Charge Payment 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-x-item-charge-payment-71304.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile with latest branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply portable item charge payment
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          runtime_path=Path('src/domain/commonPlayOperationRuntime.ts')
          runtime=runtime_path.read_text(encoding='utf-8')
          old='''export type CommonPlayItemPayment={\n  kind:"item";\n  selector:{from:"items";definitionId:string};\n  quantity:LiteralNumberExpression;\n  consumed:true;\n  consumeAt:"commit";\n  refundOnCancel:true;\n};'''
          new='''export type CommonPlayItemPayment={\n  kind:"item";\n  selector:{from:"items";definitionId:string};\n  consumeAt:"commit";\n  refundOnCancel:true;\n}&(\n  |{quantity:LiteralNumberExpression;consumed:true;charges?:never}\n  |{charges:LiteralNumberExpression;consumed:false;quantity?:never}\n);'''
          assert old in runtime, 'CommonPlayItemPayment shape changed'
          runtime=runtime.replace(old,new,1)
          old='const ITEM_PAYMENT_KEYS=new Set(["kind","selector","quantity","consumed","consumeAt","refundOnCancel"]);'
          new='const ITEM_PAYMENT_KEYS=new Set(["kind","selector","quantity","charges","consumed","consumeAt","refundOnCancel"]);'
          assert old in runtime, 'item payment key set changed'
          runtime=runtime.replace(old,new,1)
          old='''    const selector=parseItemPaymentSelector(payment.selector,`${label}.selector`);\n    const quantity=literalExpression(payment.quantity,`${label}.quantity`);\n    if(quantity.value<=0) throw new DomainEvaluationError(`${label}.quantity must be a positive integer`);\n    if(payment.consumed!==true) throw new DomainEvaluationError(`${label}.consumed must be true for portable Common Play item payment`);\n    if(payment.consumeAt!=="commit") throw new DomainEvaluationError(`${label}.consumeAt must be commit for portable Common Play item payment`);\n    if(payment.refundOnCancel!==undefined&&payment.refundOnCancel!==true) throw new DomainEvaluationError(`${label}.refundOnCancel must be true when present`);\n    return {kind:"item",selector,quantity,consumed:true,consumeAt:"commit",refundOnCancel:true};'''
          new='''    const selector=parseItemPaymentSelector(payment.selector,`${label}.selector`);\n    const quantity=payment.quantity===undefined?undefined:literalExpression(payment.quantity,`${label}.quantity`);\n    const charges=payment.charges===undefined?undefined:literalExpression(payment.charges,`${label}.charges`);\n    if((quantity===undefined)===(charges===undefined)) throw new DomainEvaluationError(`${label} requires exactly one of quantity or charges`);\n    const amount=quantity??charges!;\n    if(amount.value<=0) throw new DomainEvaluationError(`${label}.${quantity?"quantity":"charges"} must be a positive integer`);\n    if(payment.consumeAt!=="commit") throw new DomainEvaluationError(`${label}.consumeAt must be commit for portable Common Play item payment`);\n    if(payment.refundOnCancel!==undefined&&payment.refundOnCancel!==true) throw new DomainEvaluationError(`${label}.refundOnCancel must be true when present`);\n    if(quantity) {\n      if(payment.consumed!==true) throw new DomainEvaluationError(`${label}.consumed must be true for quantity item payment`);\n      return {kind:"item",selector,quantity,consumed:true,consumeAt:"commit",refundOnCancel:true};\n    }\n    if(payment.consumed!==false) throw new DomainEvaluationError(`${label}.consumed must be false for charge item payment`);\n    return {kind:"item",selector,charges:charges!,consumed:false,consumeAt:"commit",refundOnCancel:true};'''
          assert old in runtime, 'item payment parser changed'
          runtime=runtime.replace(old,new,1)
          old='''      amount:literalInteger(payment.kind==="resource"?payment.amount:payment.quantity,payment.kind==="resource"?"resource payment amount":"item payment quantity"),'''
          new='''      amount:literalInteger(\n        payment.kind==="resource"?payment.amount:"charges" in payment?payment.charges:payment.quantity,\n        payment.kind==="resource"?"resource payment amount":"charges" in payment?"item payment charges":"item payment quantity",\n      ),'''
          assert old in runtime, 'item payment compiler changed'
          runtime=runtime.replace(old,new,1)
          runtime_path.write_text(runtime,encoding='utf-8')

          adapter_path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          adapter=adapter_path.read_text(encoding='utf-8')
          old='const itemQuantityResourceId=(itemId:string)=>`phase09:item:${itemId}:quantity`;'
          new='''const itemQuantityResourceId=(itemId:string)=>`phase09:item:${itemId}:quantity`;\nconst itemChargeResourceId=(itemId:string)=>`phase09:item:${itemId}:charges`;'''
          assert old in adapter, 'item resource helper changed'
          adapter=adapter.replace(old,new,1)
          old='''    const item=matches[0];\n    const resourceId=itemQuantityResourceId(item.id);\n    combatant.resources=combatant.resources.filter((resource)=>resource.id!==resourceId);\n    combatant.resources.push({id:resourceId,label:`${item.name} quantity`,current:item.quantity,maximum:item.quantity});\n    itemPaymentResourceIds[index]=resourceId;\n    ephemeralResourceIds.push(resourceId);'''
          new='''    const item=matches[0];\n    const chargePayment="charges" in payment&&payment.charges!==undefined;\n    if(chargePayment&&!item.charges) throw new Error(`Common Play item charge payment requires charges: ${payment.selector.definitionId}`);\n    const resourceId=chargePayment?itemChargeResourceId(item.id):itemQuantityResourceId(item.id);\n    const current=chargePayment?item.charges!.current:item.quantity;\n    const maximum=chargePayment?item.charges!.max:item.quantity;\n    combatant.resources=combatant.resources.filter((resource)=>resource.id!==resourceId);\n    combatant.resources.push({id:resourceId,label:`${item.name} ${chargePayment?"charges":"quantity"}`,current,maximum});\n    itemPaymentResourceIds[index]=resourceId;\n    ephemeralResourceIds.push(resourceId);'''
          assert old in adapter, 'item payment runtime context changed'
          adapter=adapter.replace(old,new,1)
          adapter_path.write_text(adapter,encoding='utf-8')

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text(encoding='utf-8'))
          item_payment=next(entry for entry in schema['$defs']['payment']['oneOf'] if entry.get('properties',{}).get('kind',{}).get('const')=='item')
          item_payment['required']=['kind','selector','consumeAt']
          item_payment['properties']['charges']={'$ref':'#/$defs/expression'}
          item_payment['oneOf']=[
            {'required':['quantity','consumed'],'properties':{'consumed':{'const':True}},'not':{'required':['charges']}},
            {'required':['charges','consumed'],'properties':{'consumed':{'const':False}},'not':{'required':['quantity']}},
          ]
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > tests/ui/c9FamilyXPortableItemChargePaymentProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { getCharacterLibraryPersistenceStateForTests,setCharacterLibraryStoreForTests } from "../../src/app/characterLibraryRuntimeAdapter";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryCharacterLibraryStore } from "../../src/app/memoryCharacterLibraryStore";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";

          const ITEM_DEFINITION_ID="item.wand-of-magic-missiles";
          const ITEM_INSTANCE_ID="item.wand.aelar";

          function packagePayload(prefix:string) {
            return JSON.stringify({
              schemaVersion:"0.1-draft",moduleId:`homebrew.${prefix}`,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family X Portable Item Charge Payment Probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],content:[{
                id:`option.${prefix}`,category:"option",
                presentation:{defaultLocale:"en",originalName:"Portable Item Charge Payment Probe",locales:{en:{name:"Portable Item Charge Payment Probe",description:"Spends charges from one matching inventory item through Common Play"}}},
                mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:`external.${prefix}`,
                  payments:[{kind:"item",selector:{from:"items",definitionId:ITEM_DEFINITION_ID},charges:{value:2},consumed:false,consumeAt:"commit",refundOnCancel:true}],
                  entryPoints:[{id:"spend",invocation:"manual",operations:[]}]}}],
              }],
            });
          }

          function persistedCharges(adapter:MockAdapter,characterId:string) {
            return getCharacterLibraryPersistenceStateForTests(adapter)?.document?.characters
              .find((entry)=>entry.characterId===characterId)?.runtime.items
              .find((item)=>item.id===ITEM_INSTANCE_ID)?.charges?.current;
          }

          async function restartedCharges(store:MemoryCharacterLibraryStore) {
            const restarted=new MockAdapter();
            setCharacterLibraryStoreForTests(restarted,store);
            const snapshot=await restarted.getSnapshot();
            return snapshot.activeCharacter.items.find((item)=>item.id===ITEM_INSTANCE_ID)?.charges?.current;
          }

          async function exercise(prefix:string) {
            const characterStore=new MemoryCharacterLibraryStore();
            const adapter=new MockAdapter();
            setCharacterLibraryStoreForTests(adapter,characterStore);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(packagePayload(prefix));
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            let snapshot=await adapter.getSnapshot();
            const characterId=snapshot.activeCharacter.id;
            assert.equal(snapshot.activeCharacter.items.find((item)=>item.id===ITEM_INSTANCE_ID)?.charges?.current,7);
            const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(`option.${prefix}`,`homebrew.${prefix}`,"1"),mechanicId:`external.${prefix}`,entryPointId:"spend"});
            await adapter.resolveAction(actionId,[characterId]);
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(snapshot.activeCharacter.items.find((item)=>item.id===ITEM_INSTANCE_ID)?.charges?.current,5);
            assert.equal(persistedCharges(adapter,characterId),5);
            assert.equal(await restartedCharges(characterStore),5);
            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.activeCharacter.items.find((item)=>item.id===ITEM_INSTANCE_ID)?.charges?.current,7);
            assert.equal(persistedCharges(adapter,characterId),7);
            assert.equal(await restartedCharges(characterStore),7);
            return {before:7,afterSpend:5,afterUndo:7};
          }

          test("unknown installed Common Play item charge payment persists through restart and Undo and is rename invariant",async()=>{
            assert.deepEqual(await exercise("family-x-item-charge-a"),{before:7,afterSpend:5,afterUndo:7});
            assert.deepEqual(await exercise("renamed-family-x-item-charge-b"),{before:7,afterSpend:5,afterUndo:7});
          });
          EOF
      - name: Verify Family X portable item payments
        run: |
          node --import tsx --test tests/ui/c9FamilyXPortableItemPaymentProduction.test.ts tests/ui/c9FamilyXPortableItemChargePaymentProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
      - name: Publish verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyXPortableItemChargePaymentProduction.test.ts
          git rm .github/workflows/c9-family-x-item-charge-payment-71304.yml
          git diff --cached --quiet || git commit -m "feat(c9): support portable item charge payment"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
