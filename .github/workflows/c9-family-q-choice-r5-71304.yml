name: C9 Family Q Choice R5 71304
# rerun-trigger: 71304-q-choice-r5-domain-boundary

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r5-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified Q behavior and close type shapes
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow=Path('.github/workflows/c9-family-q-choice-r4-71304.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(code,'q-choice-r4-patch','exec'),{'__name__':'__main__'})

          adapter_path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          adapter=adapter_path.read_text(encoding='utf-8')
          loose_spread='...(interactionResponse?{interactionResponse}:{}),'
          exact_spread='...(interactionResponse?{interactionResponse:interactionResponse.selectedIds!==undefined?{interactionId:interactionResponse.interactionId,selectedIds:[...interactionResponse.selectedIds]}:{interactionId:interactionResponse.interactionId,accepted:true as const}}:{}),'
          if adapter.count(loose_spread)!=1:
              raise SystemExit(f'Q interaction response boundary anchor changed: {adapter.count(loose_spread)}')
          adapter=adapter.replace(loose_spread,exact_spread,1)
          min_check='choiceCandidates!.length<interaction.input.selector.min'
          min_check_fixed='choiceCandidates!.length<(interaction.input.selector.min??0)'
          if adapter.count(min_check)!=1:
              raise SystemExit(f'Q choice min anchor changed: {adapter.count(min_check)}')
          adapter=adapter.replace(min_check,min_check_fixed,1)
          bounds='min:interaction.input.selector.min,max:interaction.input.selector.max,'
          bounds_fixed='min:interaction.input.selector.min??0,max:interaction.input.selector.max??choiceCandidates!.length,'
          if adapter.count(bounds)!=1:
              raise SystemExit(f'Q choice bounds anchor changed: {adapter.count(bounds)}')
          adapter=adapter.replace(bounds,bounds_fixed,1)
          adapter_path.write_text(adapter,encoding='utf-8')

          wire_path=Path('src/app/connectedSessionWire.ts')
          wire=wire_path.read_text(encoding='utf-8')
          choice_anchor='function isInterrupt(value:unknown):value is InterruptView {\n  const choice=value.choice;'
          choice_fixed='function isInterrupt(value:unknown):value is InterruptView {\n  if(!isRecord(value)) return false;\n  const choice=value.choice;'
          if wire.count(choice_anchor)!=1:
              raise SystemExit(f'Q wire narrowing anchor changed: {wire.count(choice_anchor)}')
          wire_path.write_text(wire.replace(choice_anchor,choice_fixed,1),encoding='utf-8')

          turn_path=Path('src/app/phase09RealTurnRuntimeAdapter.ts')
          turn=turn_path.read_text(encoding='utf-8')
          old_sig='MockAdapter.prototype.respondToInterrupt=async function respondToInterruptWithTurnRuntime(accept:boolean) {'
          new_sig='MockAdapter.prototype.respondToInterrupt=async function respondToInterruptWithTurnRuntime(accept:boolean,selectedIds?:string[]) {'
          if new_sig not in turn:
              if turn.count(old_sig)!=1:
                  raise SystemExit(f'turn interrupt signature anchor changed: {turn.count(old_sig)}')
              turn=turn.replace(old_sig,new_sig,1)
          old_call='if (!session||!resolution||!interrupt) return previousRespondToInterrupt.call(this,accept);'
          new_call='if (!session||!resolution||!interrupt) return previousRespondToInterrupt.call(this,accept,selectedIds);'
          if new_call not in turn:
              if turn.count(old_call)!=1:
                  raise SystemExit(f'turn interrupt forwarding anchor changed: {turn.count(old_call)}')
              turn=turn.replace(old_call,new_call,1)
          turn_path.write_text(turn,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire Q staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts src/app/rogueCoreRuntimeAdapter.ts src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts src/app/phase09RealTurnRuntimeAdapter.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-r5-71304.yml .github/workflows/c9-family-q-choice-diagnostic-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
