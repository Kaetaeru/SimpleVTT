name: Phase14 Apply Non-Character UX

on:
  push:
    branches:
      - agent/108-production-play-session-ux
    paths:
      - ".github/workflows/phase14-apply-non-character-ux.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped refactor
        run: python3 scripts/phase14_non_character_ux_refactor.py
      - name: Commit scoped source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/ProductionSessionWorkspaceBridge.tsx src/production-session-workspace.css src/app/connectedSessionWire.ts src/app/connectedSessionRuntimeAdapter.ts
          git commit -m "refactor(phase14): redesign non-character production UX"
          git push origin HEAD:agent/108-production-play-session-ux
