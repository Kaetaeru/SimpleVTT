name: C9 Family J Structural Ledger 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-structural-ledger-71304.yml]

permissions:
  contents: write

concurrency:
  group: c9-family-j-structural-ledger-71304
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile latest branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - name: Reconcile Family J structural source evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const doc=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=doc.rows.find((entry)=>entry.family==='J');
          if(!row) throw new Error('Family J row missing');
          if(row.disposition!=='INCOMPLETE') throw new Error(`Family J disposition changed to ${row.disposition}; inspect before reconciling`);

          const implementation='productionPlayRuntimeAdapter.ts resolves a projected weapon attack back to its source ItemInstance through grantedActionIds, then reads generic weapon-definition mode/properties; presentation-name matching and ranged-name regex inference are no longer source-selection authority';
          const production='ff4eea4c3e20b2c25690d54cbfb10a6e94f1fe8f refactor(c9): use structural weapon action sources; C9 Family J Structural Weapon Source 71304 run 33316313480 passed the structural source regression, legacy execution boundary, tsc --noEmit, and published successfully';
          const identity='c9FamilyJStructuralWeaponSource.test.ts renames both the attack and source item presentation while preserving structural shortbow range/DEX projection, and proves presentation text alone cannot infer weapon range without a grantedActionIds source link';
          const current='Production weapon projection now resolves source equipment structurally through ItemInstance.grantedActionIds and weapon-definition data, with explicit presentation rename invariance; presentation names no longer select or infer the weapon source.';
          const oldSeam='full generic weapon and Unarmed Strike action projection is not yet proven across source-owned equipment/stat definitions';
          const newSeam='structural equipment-to-attack source linking is production-proven; full generic weapon property/stat composition and Unarmed Strike source composition remain incomplete';

          const add=(list,value)=>{ if(!list.includes(value)) list.push(value); };
          add(row.implementationEvidence,implementation);
          add(row.productionEvidence,production);
          add(row.identityInvarianceEvidence,identity);
          if(!row.currentState.includes(current)) row.currentState += ` ${current}`;
          const index=row.remainingNamedSeams.indexOf(oldSeam);
          if(index>=0) row.remainingNamedSeams[index]=newSeam;
          else if(!row.remainingNamedSeams.includes(newSeam)) throw new Error('expected Family J source seam text not found');

          fs.writeFileSync(path,JSON.stringify(doc,null,2)+'\n','utf8');
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify structural source regression
        run: npx tsx --test tests/ui/c9FamilyJStructuralWeaponSource.test.ts
      - name: Verify canonical coverage checker
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Publish reconciled ledger
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-structural-ledger-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile structural weapon source evidence"
          for attempt in $(seq 1 8); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
