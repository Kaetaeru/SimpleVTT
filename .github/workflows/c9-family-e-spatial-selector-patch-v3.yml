name: C9 Family E spatial selector patch v3

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-spatial-selector-patch-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bridge authoritative spatial facts into selector candidates
        shell: python
        run: |
          from pathlib import Path
          path=Path("src/app/installedCommonPlayRuntimeAdapter.ts")
          source=path.read_text(encoding="utf-8")
          import_anchor='import { resolveRuntimeProfileProperty, SIMPLEVTT_APP_RULES_PROFILE } from "./realResolutionService";\n'
          spatial_import='import { authoritativeCommonPlaySpatialRelation } from "./realSpatialRuntimeService";\n'
          if spatial_import not in source:
              if import_anchor not in source: raise SystemExit("import anchor changed")
              source=source.replace(import_anchor,import_anchor+spatial_import,1)
          old_signature='function commonPlaySelectorCandidate(actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {\n  const targeting=commonPlayTargetFact(actor,target);\n'
          new_signature='function commonPlaySelectorCandidate(scene:SceneVm,actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {\n  const targeting=commonPlayTargetFact(actor,target);\n  const spatial=authoritativeCommonPlaySpatialRelation(scene,actor.id,target.id);\n  if(spatial) {\n    targeting.distanceFeet=spatial.distanceFeet;\n    targeting.visible=spatial.visible;\n    targeting.cover=spatial.cover;\n  }\n'
          if new_signature not in source:
              if old_signature not in source: raise SystemExit("selector signature changed")
              source=source.replace(old_signature,new_signature,1)
          property_anchor='      vulnerabilities:[...target.vulnerabilities],\n'
          property_insert='      vulnerabilities:[...target.vulnerabilities],\n      ...(spatial?{\n        "spatial.distance-feet":spatial.distanceFeet,\n        "sense.line-of-sight":spatial.visible,\n        "cover.level":spatial.cover,\n        "cover.total":spatial.cover==="total",\n      }:{}),\n'
          if '"spatial.distance-feet":spatial.distanceFeet' not in source:
              if property_anchor not in source: raise SystemExit("selector property anchor changed")
              source=source.replace(property_anchor,property_insert,1)
          old_call='.map((target)=>commonPlaySelectorCandidate(actorEntity,target))'
          new_call='.map((target)=>commonPlaySelectorCandidate(internal.scene,actorEntity,target))'
          if old_call in source:
              source=source.replace(old_call,new_call)
          if old_call in source or new_call not in source:
              raise SystemExit("selector call-site migration incomplete")
          path.write_text(source,encoding="utf-8")
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E rich selector production path
        run: npx tsx --test tests/ui/commonPlayRichSelectorProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified production patch and retire staging workflows
        run: |
          rm -f .github/workflows/c9-family-e-spatial-selector-patch.yml .github/workflows/c9-family-e-spatial-selector-patch-v2.yml .github/workflows/c9-family-e-spatial-selector-patch-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/app/installedCommonPlayRuntimeAdapter.ts .github/workflows/c9-family-e-spatial-selector-patch.yml .github/workflows/c9-family-e-spatial-selector-patch-v2.yml .github/workflows/c9-family-e-spatial-selector-patch-v3.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(c9): bridge authoritative spatial facts into selectors"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if ! git rebase origin/agent/c9-gate-n-coverage-reconciliation; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 2
          done
          exit 1
