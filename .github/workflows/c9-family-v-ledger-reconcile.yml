name: C9 Family V Ledger Reconcile

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-v-ledger-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Family V evidence
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const family=ledger.rows.find((entry)=>entry.family==='V'&&entry.id==='actor-artifact-summon');
          if(!family) throw new Error('Family V actor-artifact-summon not found');
          family.currentState='Portable actor artifacts now cover typed combatant spawn/projection, source/owner/controller and initiative semantics, definition-driven scoped actions, source-owned granted despawn, elapsed lifetime cleanup, until-source-recast replacement, Host/Client replay, duplicate handling, fresh reconnect, event-native Undo, and external identity rename through the generic artifact Resolver path.';
          family.disposition='IMPLEMENTED';
          family.implementationEvidence=[
            'commonPlayArtifactRuntime.ts actor spawn, lifetime, and until-source-recast replacement lowering',
            'commonPlayArtifactLifecycleRuntime.ts source-owned actor granted artifact.remove lowering',
            'resolutionArtifactOps.ts typed actor combatant spawn/remove lifecycle',
            'runtimeStateChange.ts combatant StateChange',
            'installedCommonPlayRuntimeAdapter.ts scoped actor action projection and execution',
            'installedCommonPlayArtifactLifecycleAdapter.ts source-owned actor lifecycle action projection and dispatch'
          ];
          family.productionEvidence=[
            'installedCommonPlayLoweredFamiliesProduction.test.ts summoned action execution and Undo',
            'connectedActorArtifactLifetimeProduction.test.ts elapsed actor despawn with connected replay, reconnect, duplicate replay, and Undo',
            'connectedActorArtifactReconnectProduction.test.ts fresh replay and until-source-recast replacement with reconnect and Undo',
            'connectedActorArtifactLifecycleProduction.test.ts source-owned granted despawn, resummon, reconnect, and Undo'
          ];
          family.identityInvarianceEvidence=[
            'commonPlayArtifactActivationRuntime.test.ts',
            'installedCommonPlayLoweredFamiliesProduction.test.ts renamed module run',
            'connectedActorArtifactLifetimeProduction.test.ts elapsed lifecycle rename invariance',
            'connectedActorArtifactReconnectProduction.test.ts replacement rename invariance',
            'connectedActorArtifactLifecycleProduction.test.ts source-owned despawn/resummon rename invariance'
          ];
          family.connectedEvidenceIfRelevant=[
            'installedCommonPlayLoweredFamiliesProduction.test.ts actor/action event transport, projection convergence, execution, and Undo',
            'connectedActorArtifactLifetimeProduction.test.ts Host/Client despawn convergence, duplicate replay, reconnect, and Undo',
            'connectedActorArtifactReconnectProduction.test.ts Host/Client spawn/replacement convergence, reconnect, and Undo',
            'connectedActorArtifactLifecycleProduction.test.ts Host/Client source-owned despawn convergence and Undo'
          ];
          family.persistenceEvidenceIfRelevant=[
            'connectedActorArtifactReconnectProduction.test.ts fresh connected replay reconstructs spawn/replacement and replayed Undo state',
            'connectedActorArtifactLifetimeProduction.test.ts fresh reconnect preserves elapsed despawn and restored Undo state',
            'connectedActorArtifactLifecycleProduction.test.ts fresh reconnect preserves source-owned spawn/despawn/Undo state'
          ];
          family.remainingNamedSeams=[];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
      - name: Verify coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "docs(c9): reconcile Family V actor artifact coverage"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
