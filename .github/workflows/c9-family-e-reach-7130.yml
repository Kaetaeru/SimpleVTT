name: C9 Family E Reach Selector 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-reach-7130.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Stage authored reach acceptance probe
        shell: bash
        run: |
          cat > tests/ui/c9FamilyEReachSelectorProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/installedContentRuntimeAdapter";
          import type { CharacterSheet, SceneVm } from "../../src/app/contracts";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { setSpatialRelation } from "../../src/app/spatialRuntimeContracts";

          type Identity={moduleId:string;contentId:string;mechanicId:string;entryPointId:string;displayName:string};
          const ORIGINAL:Identity={moduleId:"homebrew.family-e-reach",contentId:"option.family-e-reach",mechanicId:"external.unknown.family-e-reach",entryPointId:"reach-target",displayName:"Reach Target"};
          const RENAMED:Identity={moduleId:"homebrew.renamed-family-e-reach",contentId:"option.renamed-family-e-reach",mechanicId:"external.renamed.family-e-reach",entryPointId:"renamed-reach-target",displayName:"Renamed Reach Target"};
          const TARGET_ID="combatant.goblin-a";

          function payload(identity:Identity) {
            return JSON.stringify({
              schemaVersion:"0.1-draft",moduleId:identity.moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family E reach selector probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{
                id:identity.contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:identity.displayName,locales:{en:{name:identity.displayName}}},
                mechanics:[{kind:"common-play",config:{
                  schemaVersion:"0.2-draft",id:identity.mechanicId,
                  entryPoints:[{
                    id:identity.entryPointId,invocation:"manual",
                    targeting:{
                      from:"targets",min:1,max:1,
                      where:{op:"lte",left:{ref:"spatial.distance-feet"},right:{value:10}},
                    },
                    operations:[],
                  }],
                }}],
              }],
            });
          }

          function setDistance(internal:{activeCharacter:CharacterSheet;scene:SceneVm},distanceFeet:number) {
            setSpatialRelation(internal.scene,{
              sourceId:internal.activeCharacter.id,targetId:TARGET_ID,distanceFeet,
              visible:true,cover:"none",targetCanSeeAttacker:true,
              provenance:"module:c9-family-e-reach:selector",
            });
          }

          async function exercise(identity:Identity) {
            const adapter=new MockAdapter();
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(payload(identity));
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};
            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),
              mechanicId:identity.mechanicId,entryPointId:identity.entryPointId,
            });

            setDistance(internal,15);
            const beyondReach=await adapter.resolveAction(actionId,[TARGET_ID]);
            assert.equal(beyondReach.resolution?.finalOutcome,"적용 거부",JSON.stringify(beyondReach.resolution));

            setDistance(internal,10);
            const atReach=await adapter.resolveAction(actionId,[TARGET_ID]);
            assert.equal(atReach.resolution?.stage,"complete",JSON.stringify(atReach.resolution));
            assert.deepEqual(atReach.resolution?.targetIds,[TARGET_ID]);
            return atReach.resolution?.targetIds;
          }

          test("unknown installed selector composes authored reach with provider-owned distance under identity rename",async()=>{
            const original=await exercise(ORIGINAL);
            const renamed=await exercise(RENAMED);
            assert.deepEqual(renamed,original);
          });
          EOF
      - name: Verify reach composition
        run: |
          node --import tsx --test tests/ui/c9FamilyEReachSelectorProduction.test.ts tests/ui/c9FamilyESpatialSelectorProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified reach test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/c9FamilyEReachSelectorProduction.test.ts
          git diff --cached --check
          git commit -m "test(c9): prove authored reach over spatial authority"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content >/dev/null
              node --import tsx --test tests/ui/c9FamilyEReachSelectorProduction.test.ts tests/ui/c9FamilyESpatialSelectorProduction.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              node scripts/check-legacy-execution-boundary.mjs
              npm exec tsc -- --noEmit
              if git push origin HEAD:"$branch"; then break; fi
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Record reach evidence and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path="docs/rules/v1-mechanism-coverage-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(path,"utf8"));
          const family=ledger.rows.find((row)=>row.family==="E");
          if(!family) throw new Error("Family E ledger row missing");
          const add=(field,value)=>{ if(!family[field].includes(value)) family[field].push(value); };
          family.currentState=family.currentState
            .replace(/Reach provider facts,\s*/g,"")
            .replace(/reach provider facts,\s*/g,"")
            .replace(/reach provider facts/g,"");
          if(!family.currentState.includes("Authored reach thresholds consume provider-owned authoritative distance")) {
            family.currentState += " Authored reach thresholds consume provider-owned authoritative distance through the shared selector kernel, so reach reuses the same spatial authority instead of introducing a second reach engine.";
          }
          add("implementationEvidence","commonPlaySelectorRuntime.ts generic semantic predicates compose authored reach thresholds with provider-owned spatial.distance-feet; no reach-specific execution primitive or identity dispatch is required");
          add("productionEvidence",`c9FamilyEReachSelectorProduction.test.ts proves an unknown installed 10ft authored reach accepts an authoritative 10ft target, rejects 15ft, and passes through production Common Play; verifier run ${process.env.GITHUB_RUN_ID}`);
          add("identityInvarianceEvidence","c9FamilyEReachSelectorProduction.test.ts preserves authored reach semantics after complete external module/content/mechanic/entry/display rename");
          family.remainingNamedSeams=(family.remainingNamedSeams??[])
            .map((seam)=>seam.replace(/reach provider facts,\s*/g,"").replace(/reach provider facts/g,"").replace(/^,\s*/,"").trim())
            .filter(Boolean);
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+"\n");
          NODE
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git rm .github/workflows/c9-family-e-reach-7130.yml
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): record authored reach selector proof"
            npm run generate:content >/dev/null
            node --import tsx --test tests/ui/c9FamilyEReachSelectorProduction.test.ts tests/ui/c9FamilyESpatialSelectorProduction.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            if git push origin HEAD:"$branch"; then exit 0; fi
            if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
