name: C9 Family A Non-Active Profile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-a-nonactive-profile-71304.yml"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Patch non-active profile projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=path.read_text(encoding='utf-8')
          old='''function commonPlayActorProfileProperties(
            internal:AdapterState,
            state:RulesRuntimeState,
            actorId:string,
          ):Record<string,number>|undefined {
            const actorState=state.combatants[actorId];
            if(!actorState) return undefined;
            if(internal.activeCharacter.id!==actorId) {
              return {
                "movement.walk":resolveRuntimeProfileProperty(
                  state.effects,actorId,"movement.walk",{"movement.walk":actorState.baseSpeed},
                ).value,
              };
            }
            const character=internal.activeCharacter;
            const inputs:Record<string,number>={
              "ability.str.score":character.abilities.str,
              "ability.dex.score":character.abilities.dex,
              "ability.con.score":character.abilities.con,
              "ability.int.score":character.abilities.int,
              "ability.wis.score":character.abilities.wis,
              "ability.cha.score":character.abilities.cha,
              "progression.character.level":character.level,
              "proficiency.bonus":character.proficiencyBonus,
              "defense.ac":character.ac,
              "movement.walk":actorState.baseSpeed,
              "hp.current":actorState.life.hp.current,
              "hp.maximum":actorState.life.hp.maximum,
              "hp.temporary":actorState.life.hp.temporary,
            };
            const projected={...inputs};
            for(const [property,definition] of Object.entries(SIMPLEVTT_APP_RULES_PROFILE.properties)) {
              if(!Number.isFinite(inputs[property])&&!definition.formula) continue;
              projected[property]=resolveRuntimeProfileProperty(state.effects,actorId,property,inputs).value;
            }
            return projected;
          }
'''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          new='''function commonPlayActorProfileProperties(
            internal:AdapterState,
            state:RulesRuntimeState,
            actorId:string,
          ):Record<string,number>|undefined {
            const actorState=state.combatants[actorId];
            if(!actorState) return undefined;
            const inputs:Record<string,number>={
              ...(actorState.baseProperties??{}),
              "movement.walk":actorState.baseSpeed,
              "hp.current":actorState.life.hp.current,
              "hp.maximum":actorState.life.hp.maximum,
              "hp.temporary":actorState.life.hp.temporary,
            };
            if(internal.activeCharacter.id===actorId) {
              const character=internal.activeCharacter;
              Object.assign(inputs,{
                "ability.str.score":character.abilities.str,
                "ability.dex.score":character.abilities.dex,
                "ability.con.score":character.abilities.con,
                "ability.int.score":character.abilities.int,
                "ability.wis.score":character.abilities.wis,
                "ability.cha.score":character.abilities.cha,
                "progression.character.level":character.level,
                "proficiency.bonus":character.proficiencyBonus,
                "defense.ac":character.ac,
              });
            }
            const projected={...inputs};
            for(const [property,definition] of Object.entries(SIMPLEVTT_APP_RULES_PROFILE.properties)) {
              if(!Number.isFinite(inputs[property])&&!definition.formula) continue;
              projected[property]=resolveRuntimeProfileProperty(state.effects,actorId,property,inputs).value;
            }
            return projected;
          }
'''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('commonPlayActorProfileProperties anchor changed')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Add production regression
        shell: bash
        run: |
          cat > tests/ui/c9FamilyANonActiveProfileProperties.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/installedContentRuntimeAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";

          const MODULE_ID="homebrew.family-a-nonactive";
          const CONTENT_ID="option.family-a-nonactive";
          const MECHANIC_ID="external.unknown.family-a-nonactive";
          const ENTRY_POINT_ID="move-by-ac";

          function payload() {
            return JSON.stringify({
              schemaVersion:"0.1-draft",moduleId:MODULE_ID,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family A Non-Active Profile Probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{
                id:CONTENT_ID,category:"option",
                presentation:{defaultLocale:"en",originalName:"Non-Active Profile Probe",locales:{en:{name:"Non-Active Profile Probe"}}},
                mechanics:[{kind:"common-play",config:{
                  schemaVersion:"0.2-draft",id:MECHANIC_ID,
                  entryPoints:[{id:ENTRY_POINT_ID,invocation:"manual",operations:[{
                    kind:"movement.relocate",mode:"move",movementType:"walk",target:"actor",
                    distance:{ref:"defense.ac"},
                    destinationFact:{id:"nonactive-ac-destination",fact:"spatial.legal-destination",subject:"actor",authority:"actor-owner",visibility:"actor-and-dm",unknownPolicy:"request-authority"},
                  }]}],
                }}],
              }],
            });
          }

          test("unknown stored Common Play reads a non-active runtime actor profile property",async()=>{
            const adapter=new MockAdapter();
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(payload());
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            const actorId="combatant.goblin-a";
            await adapter.setCurrentActor(actorId);
            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(CONTENT_ID,MODULE_ID,"1"),mechanicId:MECHANIC_ID,entryPointId:ENTRY_POINT_ID,
            });
            await adapter.configureReadyAction({actorId,actionId,trigger:"Aelar acts"});
            await adapter.setCurrentActor("char.aelar");
            const before=await adapter.getSnapshot();
            const baseAc=before.scene.entities.find((entity)=>entity.id===actorId)!.ac;
            const beforeMovement=before.scene.economyByActor[actorId]!.movement;
            const trigger=(before.scene.actionsByActor[actorId]??[]).find((action)=>action.name.startsWith("발동 ·"));
            assert.ok(trigger,JSON.stringify(before.scene.actionsByActor[actorId]));
            await adapter.resolveAction(trigger.id,[actorId]);
            const after=await adapter.getSnapshot();
            assert.equal(after.resolution?.stage,"complete",JSON.stringify(after.resolution));
            assert.equal(beforeMovement-after.scene.economyByActor[actorId]!.movement,baseAc);
          });
          EOF
      - name: Verify focused Family A production paths
        run: npx tsx --test tests/ui/c9FamilyANonActiveProfileProperties.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish verified change and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c9-family-a-nonactive-profile-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyANonActiveProfileProperties.test.ts .github/workflows/c9-family-a-nonactive-profile-71304.yml
          git commit -m "feat(c9): project non-active actor profile properties"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
