name: C9 Family E Automatic Selector Bridge

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-automatic-selector-bridge.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch generic automatic selector production bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1))

          replace("src/domain/commonPlaySelectorRuntime.ts",
              '  orderBy?:string;\n  area?:CommonPlayInstantArea;',
              '  orderBy?:string;\n  selection?:"manual"|"automatic";\n  area?:CommonPlayInstantArea;')
          replace("src/domain/commonPlaySelectorRuntime.ts",
              'const SELECTOR_KEYS=new Set(["from","where","min","max","orderBy","area"]);',
              'const SELECTOR_KEYS=new Set(["from","where","min","max","orderBy","selection","area"]);')
          replace("src/domain/commonPlaySelectorRuntime.ts",
              '  const orderBy=selector.orderBy===undefined?undefined:stringValue(selector.orderBy,`${label}.orderBy`);\n  const area=selector.area===undefined?undefined:instantArea(selector.area,`${label}.area`);',
              '  const orderBy=selector.orderBy===undefined?undefined:stringValue(selector.orderBy,`${label}.orderBy`);\n  const selection=selector.selection===undefined?undefined:selector.selection;\n  if(selection!==undefined&&selection!=="manual"&&selection!=="automatic") throw new DomainEvaluationError(`${label}.selection must be manual or automatic`);\n  const area=selector.area===undefined?undefined:instantArea(selector.area,`${label}.area`);')
          replace("src/domain/commonPlaySelectorRuntime.ts",
              '    ...(orderBy===undefined?{}:{orderBy}),\n    ...(area===undefined?{}:{area}),',
              '    ...(orderBy===undefined?{}:{orderBy}),\n    ...(selection===undefined?{}:{selection}),\n    ...(area===undefined?{}:{area}),')

          replace("src/domain/commonPlayOperationRuntime.ts",
              'const TARGETING_KEYS=new Set(["from","where","min","max","area","orderBy"]);',
              'const TARGETING_KEYS=new Set(["from","where","min","max","area","orderBy","selection"]);')

          replace("schemas/common-play-contract.schema.json",
              '        "orderBy": {\n          "type": "string",\n          "minLength": 1\n        },\n        "area": {',
              '        "orderBy": {\n          "type": "string",\n          "minLength": 1\n        },\n        "selection": {\n          "enum": [\n            "manual",\n            "automatic"\n          ]\n        },\n        "area": {')

          replace("src/app/installedCommonPlayRuntimeAdapter.ts",
              '  const portableEntry=entryPoint as {targeting?:{min?:number;max?:number};allocation?:{targets:{min?:number;max?:number}}};\n  const targeting=portableEntry.targeting;',
              '  const portableEntry=entryPoint as {targeting?:{min?:number;max?:number;selection?:"manual"|"automatic"};allocation?:{targets:{min?:number;max?:number}}};\n  const targeting=portableEntry.targeting;')
          replace("src/app/installedCommonPlayRuntimeAdapter.ts",
              '  const multi=action.lowered.kind==="save-damage"||Boolean(targetSelector&&(targetSelector.max??1)>1);\n  const eligibleTargetIds=targeted\n    ?scene.entities.filter((entity)=>state.combatants[entity.id]).map((entity)=>entity.id)\n    :[actorId];',
              '  const automaticTargeting=targeting?.selection==="automatic";\n  const multi=action.lowered.kind==="save-damage"||Boolean(targetSelector&&(targetSelector.max??1)>1);\n  const eligibleTargetIds=automaticTargeting\n    ?[actorId]\n    :targeted?scene.entities.filter((entity)=>state.combatants[entity.id]).map((entity)=>entity.id):[actorId];')
          replace("src/app/installedCommonPlayRuntimeAdapter.ts",
              '    name:action.nameKo||action.nameEn,category:action.category==="spell"?"magic":"basic",\n    target:targeted?"any":"self",economy,resolutionKind,',
              '    name:action.nameKo||action.nameEn,category:action.category==="spell"?"magic":"basic",\n    target:targeted&&!automaticTargeting?"any":"self",economy,resolutionKind,')
          replace("src/app/installedCommonPlayRuntimeAdapter.ts",
              '    eligibleTargetIds,\n    ...(multi?{maxTargets:targetSelector?.max??eligibleTargetIds.length}:{}),',
              '    eligibleTargetIds,\n    ...(multi&&!automaticTargeting?{maxTargets:targetSelector?.max??eligibleTargetIds.length}:{}),')
          replace("src/app/installedCommonPlayRuntimeAdapter.ts",
              '  const selectedTargetId=targetIds[0];\n  if(!actorEntity||!state.combatants[actor.id]) return undefined;\n  const selectedTargets=targetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id));\n  if(selectedTargets.some((target,index)=>!target||!state!.combatants[targetIds[index]])) return undefined;\n  const uniqueSelectedTargets=[...new Map(selectedTargets.map((target)=>[target!.id,target!] as const)).values()];',
              '  let effectiveTargetIds=[...targetIds];\n  let selectedTargetId=effectiveTargetIds[0];\n  if(!actorEntity||!state.combatants[actor.id]) return undefined;\n  let selectedTargets=effectiveTargetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id));\n  if(selectedTargets.some((target,index)=>!target||!state!.combatants[effectiveTargetIds[index]])) return undefined;\n  let uniqueSelectedTargets=[...new Map(selectedTargets.map((target)=>[target!.id,target!] as const)).values()];')
          replace("src/app/installedCommonPlayRuntimeAdapter.ts",
              '  if(hasTargeting) {\n    const targeting=portableEntry.targeting!;\n    const candidates=internal.scene.entities',
              '  if(hasTargeting) {\n    const targeting=portableEntry.targeting!;\n    const selectionMode=targeting.selection??"manual";\n    if(selectionMode==="automatic"&&targetIds.length&&!(targetIds.length===1&&targetIds[0]===actor.id)) return undefined;\n    const candidates=internal.scene.entities')
          replace("src/app/installedCommonPlayRuntimeAdapter.ts",
              '      candidates,\n      selectedIds:targetIds,\n      selection:"manual",\n      authority:"actor-owner",\n      directTarget:false,\n    });\n    if(selection.status!=="resolved") return undefined;\n    if(projectedAction&&(!projectedAction.available||targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;',
              '      candidates,\n      selectedIds:selectionMode==="manual"?targetIds:undefined,\n      selection:selectionMode,\n      authority:selectionMode==="automatic"?"host":"actor-owner",\n      directTarget:false,\n    });\n    if(selection.status!=="resolved") return undefined;\n    effectiveTargetIds=selection.targetIds;\n    selectedTargetId=effectiveTargetIds[0]??actor.id;\n    selectedTargets=effectiveTargetIds.map((id)=>internal.scene.entities.find((candidate)=>candidate.id===id));\n    if(selectedTargets.some((target,index)=>!target||!state!.combatants[effectiveTargetIds[index]])) return undefined;\n    uniqueSelectedTargets=[...new Map(selectedTargets.map((target)=>[target!.id,target!] as const)).values()];\n    if(projectedAction&&(!projectedAction.available||selectionMode==="manual"&&targetIds.some((id)=>!projectedAction.eligibleTargetIds.includes(id)))) return undefined;')

          test_path=Path("tests/ui/commonPlayRichSelectorProduction.test.ts")
          text=test_path.read_text()
          helper='''\nfunction automaticPayload(identity:Identity) {\n  const authored=JSON.parse(payload(identity));\n  authored.content[0].mechanics[0].config.entryPoints[0].targeting={\n    from:"targets",selection:"automatic",min:1,max:1,orderBy:"hp",\n    where:{op:"eq",left:{ref:"relation"},right:{value:"enemy"}},\n  };\n  return JSON.stringify(authored);\n}\n\nasync function installAutomatic(adapter:MockAdapter,identity:Identity) {\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(automaticPayload(identity));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  return installedCommonPlayActionId({catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),mechanicId:identity.mechanicId,entryPointId:identity.entryPointId});\n}\n'''
          install_marker='async function execute(identity:Identity) {'
          if 'function automaticPayload(identity:Identity)' not in text:
              if install_marker not in text:
                  raise SystemExit("automatic helper insertion anchor missing")
              text=text.replace(install_marker,helper+'\n'+install_marker,1)
          automatic_test='''test("unknown installed automatic selector uses host authority and authored ordering without manual target identity",async()=>{\n  async function run(identity:Identity) {\n    const adapter=new MockAdapter();\n    const actionId=await installAutomatic(adapter,identity);\n    await adapter.startInitiative();\n    await adapter.setCurrentActor("char.aelar");\n    await adapter.resolveAction(actionId,["char.aelar"]);\n    const snapshot=await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.stage,"complete");\n    assert.deepEqual(snapshot.resolution?.targetIds,["combatant.wolf"],"lowest-HP eligible enemy is selected by the shared orderBy kernel");\n    return snapshot.resolution?.targetIds;\n  }\n  assert.deepEqual(await run(RENAMED),await run(ORIGINAL));\n});\n\n'''
          area_marker='test("unknown installed area selector imports but refuses execution without provider-backed membership",async()=>{'
          if 'unknown installed automatic selector uses host authority' not in text:
              if area_marker not in text:
                  raise SystemExit("automatic test insertion anchor missing")
              text=text.replace(area_marker,automatic_test+area_marker,1)
          else:
              stale='''    const projected=await adapter.getSnapshot();\n    const action=projected.scene.actionsByActor["char.aelar"].find((candidate)=>candidate.id===actionId);\n    assert.equal(action?.target,"self");\n    assert.deepEqual(action?.eligibleTargetIds,["char.aelar"]);\n'''
              text=text.replace(stale,'')
          test_path.write_text(text)

          ledger_path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger=json.loads(ledger_path.read_text())
          family=next(entry for entry in ledger["families"] if entry.get("family")=="E")
          implementation="commonPlaySelectorRuntime.ts parses authored manual/automatic selector authority and applies structural orderBy before bounded selection; installedCommonPlayRuntimeAdapter.ts delegates automatic target choice to that shared kernel with Host authority"
          production="commonPlayRichSelectorProduction.test.ts unknown installed automatic selector selects the lowest-HP eligible enemy by authored orderBy through Host authority and remains identity-invariant"
          if implementation not in family["implementationEvidence"]:
              family["implementationEvidence"].append(implementation)
          if production not in family["productionEvidence"]:
              family["productionEvidence"].append(production)
          for key in ("currentState",):
              family[key]=family[key].replace("ordering/object/point selection, and automatic-vs-manual production authority", "object/point selection")
          family["remainingNamedSeams"]=[seam.replace("ordering/object/point selection, and automatic-vs-manual production selector authority", "object/point selection") for seam in family["remainingNamedSeams"]]
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+"\n")
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family E automatic selector production
        run: >-
          node --import tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify Gate N boundaries and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source slice and retire staging workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-e-automatic-selector-bridge.yml
          git rm -f .github/workflows/c9-family-e-automatic-selector-runner-7130.yml || true
          git add schemas/common-play-contract.schema.json src/domain/commonPlaySelectorRuntime.ts src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/commonPlayRichSelectorProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): bridge automatic selector authority"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1