name: C9 Structural Save Baseline Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-fix-structural-save-baseline-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile structural save baseline
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.agents/LEGACY_EXECUTION_BASELINE.json')
          data=json.loads(path.read_text())
          replaced=0
          for entry in data['entries']:
              if entry.get('module')=='./unarmedControlRuntimeAdapter':
                  entry['module']='./structuralSaveConditionRuntimeAdapter'
                  replaced+=1
          if replaced != 1:
              raise SystemExit(f'expected one stale baseline entry, replaced {replaced}')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
          git rm .github/workflows/c9-fix-structural-save-baseline-71304.yml
          git diff --check
      - run: npm ci
      - run: npm run generate:content
      - run: node --import tsx --test tests/ui/c9FamilyXPortableItemPaymentProduction.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: npm exec tsc -- --noEmit
      - name: Publish verified baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/LEGACY_EXECUTION_BASELINE.json
          git commit -m 'chore(c9): reconcile structural save boundary baseline'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
