name: C9 Family H Hidden Reveal Proof 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-hidden-reveal-proof-7130.yml
      - src/app/runtimeResolutionUndoAdapter.ts
      - tests/ui/sessionStatusEffectEventRuntime.test.ts

permissions:
  contents: write

jobs:
  verify-and-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Hidden lifecycle and sensing production
        run: >-
          npx tsx --test
          tests/ui/sessionStatusEffectEventRuntime.test.ts
          tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          tests/ui/connectedProjectedCharacterCunningHideResolution.test.ts
      - name: Verify coverage, legacy boundary, and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Reconcile Family H evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          row = next((entry for entry in ledger["rows"] if entry.get("family") == "H" and entry.get("id") == "senses-visibility-hiding"), None)
          if not row or row.get("disposition") != "INCOMPLETE":
              raise SystemExit("Family H row missing or no longer INCOMPLETE; refuse stale reconciliation")

          row["currentState"] = (
              "Generic status and creature-type awareness paths are production-proven. Common Play defines standard sensing facts for can-see, can-hear, detected, light, obscurement, and hidden with identity-independent provider provenance and connected owner-authority routing. Resolver-owned session Hidden effects now feed sense.hidden, unknown external Hide-style status actions commit Hidden as authoritative Effect StateChanges, and endsOnAttack reveal removes that Effect through the same event path with event-native Undo. Family H remains incomplete for rules-derived composition of lighting, obscurement, special senses, detection/Search, and discovery semantics."
          )
          evidence = "sessionStatusEffectEventRuntime.test.ts proves unknown external Hidden apply -> attack reveal remove-effect -> event-native Undo restore through authoritative Resolver events"
          if evidence not in row["productionEvidence"]:
              row["productionEvidence"].append(evidence)
          row["remainingNamedSeams"] = [
              seam for seam in row["remainingNamedSeams"]
              if seam not in {
                  "Rogue action projection",
                  "full sensing relation composition across sense types, lighting, obscurement, Invisible/Hidden, detection/search, and reveal remains incomplete",
                  "rules-derived sensing provider composition for lighting, obscurement, special senses, Hidden, Hide/Search, detection, and reveal/end-Hidden remains incomplete",
              }
          ]
          replacement = "rules-derived sensing composition for lighting, obscurement, special senses, Invisible interactions, detection/Search, and discovery remains incomplete"
          if replacement not in row["remainingNamedSeams"]:
              row["remainingNamedSeams"].append(replacement)
          path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Commit verified Family H evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-h-hidden-reveal-proof-7130.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): record generic Hidden reveal lifecycle"
          for attempt in $(seq 1 10); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
