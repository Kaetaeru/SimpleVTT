name: C9 Family Q Choice Kernel 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-kernel-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch portable choice interaction kernel
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('src/domain/commonPlaySelectorRuntime.ts')
          text=path.read_text(encoding='utf-8')
          old='authority:"actor-owner"|"dm"|"host"|"provider";'
          new='authority:"actor-owner"|"target-owner"|"dm"|"host"|"provider";'
          if new not in text:
              if text.count(old)!=1: raise SystemExit(f'selector authority anchor count={text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          text=path.read_text(encoding='utf-8')

          old='''export interface CommonPlayConsentInteraction {\n  id:string;\n  kind:"consent";\n  responder:"actor"|"target"|"actor-owner"|"target-owner"|"dm"|"host";\n  mode:"blocking";\n  input:{type:"boolean"};\n  revalidate:"always"|"if-revision-changed";\n  stalePolicy?:"reject";\n}\n'''
          new='''export interface CommonPlayConsentInteraction {\n  id:string;\n  kind:"consent";\n  responder:"actor"|"target"|"actor-owner"|"target-owner"|"dm"|"host";\n  mode:"blocking";\n  input:{type:"boolean"};\n  revalidate:"always"|"if-revision-changed";\n  stalePolicy?:"reject";\n}\n\nexport interface CommonPlayChoiceInteraction {\n  id:string;\n  kind:"choice";\n  responder:"actor"|"target"|"actor-owner"|"target-owner"|"dm"|"host";\n  mode:"blocking";\n  input:{type:"choice";selector:CommonPlaySelector};\n  revalidate:"always"|"if-revision-changed";\n  stalePolicy?:"reject";\n}\n\nexport type CommonPlayInteraction=CommonPlayConsentInteraction|CommonPlayChoiceInteraction;\n'''
          if 'export interface CommonPlayChoiceInteraction' not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction type anchor count={text.count(old)}')
              text=text.replace(old,new,1)

          old='interaction?:CommonPlayConsentInteraction;'
          new='interaction?:CommonPlayInteraction;'
          if new not in text:
              if text.count(old)!=1: raise SystemExit(f'entry interaction type anchor count={text.count(old)}')
              text=text.replace(old,new,1)

          old='''  interactionResponse?:{\n    interactionId:string;\n    accepted:true;\n  };'''
          new='''  interactionResponse?:\n    | {interactionId:string;accepted:true}\n    | {interactionId:string;selectedIds:string[]};'''
          if '| {interactionId:string;selectedIds:string[]};' not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction response anchor count={text.count(old)}')
              text=text.replace(old,new,1)

          old='const INTERACTION_INPUT_KEYS=new Set(["type"]);'
          new='const INTERACTION_INPUT_KEYS=new Set(["type","selector"]);'
          if new not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction input keys anchor count={text.count(old)}')
              text=text.replace(old,new,1)

          old='''function parseConsentInteraction(value:unknown,label:string):CommonPlayConsentInteraction {\n  const interaction=object(value,label);\n  supportedKeys(interaction,INTERACTION_KEYS,label);\n  if(interaction.kind!=="consent") throw new DomainEvaluationError(`${label}.kind must be consent for portable Common Play interaction`);\n  if(interaction.responder!=="actor"&&interaction.responder!=="target"&&interaction.responder!=="actor-owner"&&interaction.responder!=="target-owner"&&interaction.responder!=="dm"&&interaction.responder!=="host") throw new DomainEvaluationError(`${label}.responder must be actor, target, actor-owner, target-owner, dm, or host for portable Common Play interaction`);\n  if(interaction.mode!=="blocking") throw new DomainEvaluationError(`${label}.mode must be blocking for portable Common Play interaction`);\n  const input=object(interaction.input,`${label}.input`);\n  supportedKeys(input,INTERACTION_INPUT_KEYS,`${label}.input`);\n  if(input.type!=="boolean") throw new DomainEvaluationError(`${label}.input.type must be boolean for portable Common Play interaction`);\n  if(interaction.revalidate!=="always"&&interaction.revalidate!=="if-revision-changed") throw new DomainEvaluationError(`${label}.revalidate must be always or if-revision-changed for portable Common Play interaction`);\n  if(interaction.stalePolicy!==undefined&&interaction.stalePolicy!=="reject") throw new DomainEvaluationError(`${label}.stalePolicy must be reject for portable Common Play interaction`);\n  return {\n    id:nonEmptyString(interaction.id,`${label}.id`),kind:"consent",responder:interaction.responder,mode:"blocking",input:{type:"boolean"},revalidate:interaction.revalidate,\n    ...(interaction.stalePolicy?{stalePolicy:"reject" as const}:{}),\n  };\n}\n'''
          new='''function parseCommonPlayInteraction(value:unknown,label:string):CommonPlayInteraction {\n  const interaction=object(value,label);\n  supportedKeys(interaction,INTERACTION_KEYS,label);\n  if(interaction.kind!=="consent"&&interaction.kind!=="choice") throw new DomainEvaluationError(`${label}.kind must be consent or choice for portable Common Play interaction`);\n  if(interaction.responder!=="actor"&&interaction.responder!=="target"&&interaction.responder!=="actor-owner"&&interaction.responder!=="target-owner"&&interaction.responder!=="dm"&&interaction.responder!=="host") throw new DomainEvaluationError(`${label}.responder must be actor, target, actor-owner, target-owner, dm, or host for portable Common Play interaction`);\n  if(interaction.mode!=="blocking") throw new DomainEvaluationError(`${label}.mode must be blocking for portable Common Play interaction`);\n  const input=object(interaction.input,`${label}.input`);\n  supportedKeys(input,INTERACTION_INPUT_KEYS,`${label}.input`);\n  if(interaction.revalidate!=="always"&&interaction.revalidate!=="if-revision-changed") throw new DomainEvaluationError(`${label}.revalidate must be always or if-revision-changed for portable Common Play interaction`);\n  if(interaction.stalePolicy!==undefined&&interaction.stalePolicy!=="reject") throw new DomainEvaluationError(`${label}.stalePolicy must be reject for portable Common Play interaction`);\n  const shared={\n    id:nonEmptyString(interaction.id,`${label}.id`),responder:interaction.responder,mode:"blocking" as const,revalidate:interaction.revalidate,\n    ...(interaction.stalePolicy?{stalePolicy:"reject" as const}:{}),\n  };\n  if(interaction.kind==="consent") {\n    if(input.type!=="boolean"||input.selector!==undefined) throw new DomainEvaluationError(`${label}.input must be boolean without selector for portable consent interaction`);\n    return {...shared,kind:"consent",input:{type:"boolean"}};\n  }\n  if(input.type!=="choice"||input.selector===undefined) throw new DomainEvaluationError(`${label}.input requires type=choice and selector for portable choice interaction`);\n  const selector=parseCommonPlaySelector(input.selector,`${label}.input.selector`);\n  if(selector.selection==="automatic") throw new DomainEvaluationError(`${label}.input.selector.selection must be manual when present for portable choice interaction`);\n  return {...shared,kind:"choice",input:{type:"choice",selector}};\n}\n'''
          if 'function parseCommonPlayInteraction(' not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction parser anchor count={text.count(old)}')
              text=text.replace(old,new,1)

          old='parseConsentInteraction(entry.interaction,`${label}.entryPoints[${index}].interaction`)'
          new='parseCommonPlayInteraction(entry.interaction,`${label}.entryPoints[${index}].interaction`)'
          if new not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction parser call anchor count={text.count(old)}')
              text=text.replace(old,new,1)

          old='''  if(entryPoint.interaction) {\n    if(!input.interactionResponse) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires accepted interaction authorization`);\n    if(input.interactionResponse.interactionId!==entryPoint.interaction.id) throw new DomainEvaluationError("Common Play interaction authorization identity mismatch");\n    if(input.interactionResponse.accepted!==true) throw new DomainEvaluationError("Common Play interaction authorization must be accepted");\n  }\n'''
          new='''  if(entryPoint.interaction) {\n    if(!input.interactionResponse) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires interaction authorization`);\n    if(input.interactionResponse.interactionId!==entryPoint.interaction.id) throw new DomainEvaluationError("Common Play interaction authorization identity mismatch");\n    if(entryPoint.interaction.kind==="consent") {\n      if(!("accepted" in input.interactionResponse)||input.interactionResponse.accepted!==true) throw new DomainEvaluationError("Common Play consent interaction authorization must be accepted");\n    } else {\n      if(!("selectedIds" in input.interactionResponse)) throw new DomainEvaluationError("Common Play choice interaction requires selected identities");\n      const responder=entryPoint.interaction.responder;\n      const authority=responder==="dm"?"dm":responder==="host"?"host":responder==="target"||responder==="target-owner"?"target-owner":"actor-owner";\n      const choiceResolution=resolveCommonPlaySelector({\n        sourceId:input.actorId,\n        selector:entryPoint.interaction.input.selector,\n        candidates:input.targetingCandidates??[],\n        selectedIds:[...input.interactionResponse.selectedIds],\n        selection:"manual",\n        authority,\n      });\n      if(choiceResolution.status!=="resolved") throw new DomainEvaluationError(`Common Play choice selector rejected: ${choiceResolution.reason}`);\n    }\n  }\n'''
          if 'Common Play choice interaction requires selected identities' not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction compiler gate anchor count={text.count(old)}')
              text=text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')

          path=Path('tests/domain/commonPlayInteractionProductionRuntime.test.ts')
          text=path.read_text(encoding='utf-8')
          for line in [
              '    ["kind","choice"],\n',
              '    ["responder","target"],\n',
              '    ["responder","target-owner"],\n',
              '    ["responder","dm"],\n',
              '    ["responder","host"],\n',
              '    ["input",{type:"choice",selector:{from:"targets",min:1,max:1}}],\n',
          ]:
              text=text.replace(line,'')
          text=text.replace('/requires accepted interaction authorization/', '/requires interaction authorization/')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Add choice interaction kernel regression
        run: |
          cat > tests/domain/c9FamilyQChoiceInteractionKernel.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import {
            compileCommonPlayEntryPointOperations,
            parseManualCommonPlayOperationDefinition,
          } from "../../src/domain/commonPlayOperationRuntime";
          import type { CommonPlaySelectorCandidate } from "../../src/domain/commonPlaySelectorRuntime";
          import { runtimeState, TEST_PROFILE } from "./rulesTestState";

          const candidates:CommonPlaySelectorCandidate[]=[
            {id:"orc",targeting:{id:"orc",kind:"creature",relation:"enemy",cover:"none"},properties:{relation:"enemy",initiative:12}},
            {id:"goblin",targeting:{id:"goblin",kind:"creature",relation:"enemy",cover:"none"},properties:{relation:"enemy",initiative:18}},
            {id:"hero",targeting:{id:"hero",kind:"creature",relation:"self",cover:"none"},properties:{relation:"self",initiative:20}},
          ];

          function definition(responder:"actor-owner"|"target-owner"="actor-owner") {
            return parseManualCommonPlayOperationDefinition({
              schemaVersion:"0.2-draft",
              id:"external.generic-choice",
              payments:[{kind:"economy",bucket:"reaction",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],
              entryPoints:[{
                id:"choose",
                invocation:"manual",
                interaction:{
                  id:"choose-enemies",
                  kind:"choice",
                  responder,
                  mode:"blocking",
                  input:{
                    type:"choice",
                    selector:{
                      from:"targets",
                      where:{op:"relation-matches",ref:"relation",value:"enemy"},
                      min:1,
                      max:2,
                      orderBy:"initiative",
                      selection:"manual",
                    },
                  },
                  revalidate:"always",
                },
                operations:[{kind:"healing.apply",amount:{value:1},target:"actor"}],
              }],
            });
          }

          function input(selectedIds:string[], interactionId="choose-enemies") {
            return {
              resolutionId:"choice-kernel",
              actorId:"hero",
              entryPointId:"choose",
              targetingCandidates:candidates,
              interactionResponse:{interactionId,selectedIds},
            };
          }

          test("schema-defined manual choice parses through the portable Common Play runtime",()=>{
            const parsed=definition();
            assert.equal(parsed.entryPoints[0].interaction?.kind,"choice");
            if(parsed.entryPoints[0].interaction?.kind!=="choice") return;
            assert.equal(parsed.entryPoints[0].interaction.input.type,"choice");
            assert.deepEqual(parsed.entryPoints[0].interaction.input.selector,{from:"targets",where:{op:"relation-matches",ref:"relation",value:"enemy"},min:1,max:2,orderBy:"initiative",selection:"manual"});
          });

          test("valid multiple-option choice gates Reaction payment and downstream operations deterministically",()=>{
            const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition(),input(["goblin","orc"]));
            assert.deepEqual(pending.operations.map((operation)=>operation.kind),["use-economy","healing"]);
          });

          test("choice rejects missing, duplicate, ineligible, excessive, and mismatched selections before commit",()=>{
            const parsed=definition();
            const state=runtimeState();
            assert.throws(()=>compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,{...input(["orc"]),interactionResponse:undefined}),/requires interaction authorization/);
            assert.throws(()=>compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,input(["orc"],"wrong")),/identity mismatch/);
            assert.throws(()=>compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,input(["orc","orc"])),/duplicate/);
            assert.throws(()=>compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,input(["hero"])),/ineligible/);
            assert.throws(()=>compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,input(["orc","goblin","hero"])),/ineligible|requires 1-2/);
          });

          test("target-owner choice records target-owner selector authority without a second execution engine",()=>{
            const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),definition("target-owner"),input(["orc"]));
            assert.deepEqual(pending.operations.map((operation)=>operation.kind),["use-economy","healing"]);
          });

          test("automatic selector is rejected for an interactive choice while omitted selection defaults to manual execution",()=>{
            const base=JSON.parse(JSON.stringify(definition())) as any;
            base.entryPoints[0].interaction.input.selector.selection="automatic";
            assert.throws(()=>parseManualCommonPlayOperationDefinition(base),/must be manual/);
            delete base.entryPoints[0].interaction.input.selector.selection;
            const parsed=parseManualCommonPlayOperationDefinition(base);
            const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),parsed,input(["orc"]));
            assert.deepEqual(pending.operations.map((operation)=>operation.kind),["use-economy","healing"]);
          });
          TS
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Verify choice interaction kernel
        run: npx tsx --test tests/domain/c9FamilyQChoiceInteractionKernel.test.ts tests/domain/commonPlayInteractionProductionRuntime.test.ts tests/domain/commonPlaySelectorRuntime.test.ts
      - name: Verify C9 guardrails and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified kernel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/domain/commonPlaySelectorRuntime.ts tests/domain/commonPlayInteractionProductionRuntime.test.ts tests/domain/c9FamilyQChoiceInteractionKernel.test.ts
          git rm .github/workflows/c9-family-q-choice-kernel-71304.yml
          git commit -m "feat(c9): validate portable choice interactions"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
