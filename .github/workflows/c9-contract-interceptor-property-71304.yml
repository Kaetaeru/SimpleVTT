name: C9 Interceptor Property Contract 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-contract-interceptor-property-71304.yml
      - .github/scripts/c9-contract-interceptor-property-71304.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-contract-interceptor-property-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - name: Reconcile schema, verify, commit, and retire
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 .github/scripts/c9-contract-interceptor-property-71304.py
            npm run generate:content >/dev/null
            python tools/validate_contracts.py
            node --import tsx --test tests/domain/commonPlayReactionDefinitionRuntime.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            git rm .github/workflows/c9-contract-interceptor-property-71304.yml .github/scripts/c9-contract-interceptor-property-71304.py
            git add schemas/common-play-contract.schema.json .github/workflows/c9-contract-interceptor-property-71304.yml .github/scripts/c9-contract-interceptor-property-71304.py
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "fix(c9): validate transient interceptor property modifiers"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
