name: C9 Interceptor Property Contract 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-contract-interceptor-property-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-contract-interceptor-property-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - name: Reconcile schema, verify, commit, and retire
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          from pathlib import Path
          path=Path('schemas/common-play-contract.schema.json')
          text=path.read_text(encoding='utf-8')
          definition='''    "interceptorPropertyModify": {
              "type": "object",
              "required": [
                "kind",
                "property",
                "operation",
                "value"
              ],
              "properties": {
                "kind": {
                  "const": "property.modify"
                },
                "property": {
                  "type": "string",
                  "minLength": 1
                },
                "operation": {
                  "enum": [
                    "add",
                    "subtract",
                    "set",
                    "min",
                    "max",
                    "multiply"
                  ]
                },
                "value": {
                  "$ref": "#/$defs/expression"
                }
              },
              "additionalProperties": false
            },
'''
          if '"interceptorPropertyModify"' not in text:
              anchor='    "rollModify": {\n'
              if text.count(anchor)!=1:
                  raise SystemExit(f'rollModify anchor count: {text.count(anchor)}')
              text=text.replace(anchor,definition+anchor,1)
          marker='    "interceptor": {'
          start=text.index(marker)
          tail=text[start:]
          old='''        "operations": {
              "type": "array",
              "items": {
                "$ref": "#/$defs/operation"
              }
            }
'''
          new='''        "operations": {
              "type": "array",
              "items": {
                "oneOf": [
                  {
                    "$ref": "#/$defs/interceptorPropertyModify"
                  },
                  {
                    "$ref": "#/$defs/operation"
                  }
                ]
              }
            }
'''
          if '#/$defs/interceptorPropertyModify' not in tail:
              if tail.count(old)!=1:
                  raise SystemExit(f'interceptor operations anchor count: {tail.count(old)}')
              tail=tail.replace(old,new,1)
              text=text[:start]+tail
          path.write_text(text,encoding='utf-8')
          PY
            npm run generate:content >/dev/null
            python tools/validate_contracts.py
            node --import tsx --test tests/domain/commonPlayReactionDefinitionRuntime.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            git rm .github/workflows/c9-contract-interceptor-property-71304.yml
            git add schemas/common-play-contract.schema.json .github/workflows/c9-contract-interceptor-property-71304.yml
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "fix(c9): validate transient interceptor property modifiers"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
