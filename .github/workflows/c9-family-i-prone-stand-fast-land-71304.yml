name: C9 Family I Prone Stand Fast Landing 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-prone-stand-fast-land-71304.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract previously verified idempotent patcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/c9-family-i-prone-stand-land-71304.yml').read_text(encoding='utf-8')
          marker="          cat > /tmp/apply-prone.py <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("          PY\n",start)
          lines=[]
          for line in source[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-prone.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Verify once and fast-land across branch races
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          python3 /tmp/apply-prone.py
          rm -f .github/workflows/c9-family-i-prone-stand-fast-land-71304.yml
          npm run generate:content
          npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/domain/commonPlayProneStandRuntime.test.ts tests/ui/c9FamilyIMovementProduction.test.ts
          node -e 'JSON.parse(require("fs").readFileSync("schemas/common-play-contract.schema.json","utf8"))'
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npx tsc --noEmit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Family I prone standing is already landed and helpers are clean"
            exit 0
          fi
          git commit -m "feat(c9): support portable prone standing"
          for attempt in $(seq 1 30); do
            echo "fast landing attempt $attempt"
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "Family I patch now conflicts with concurrent repository work; stopping instead of forcing" >&2
              exit 1
            fi
            node scripts/check-v1-mechanism-coverage.mjs
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep 1
          done
          echo "failed to land verified Family I patch after 30 immediate rebase/push attempts" >&2
          exit 1
