name: C9 Family A Profile Policy Runner 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-profile-policy-runner-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-a-profile-policy-runner-71304
  cancel-in-progress: false

jobs:
  patch-verify-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply RulesProfile-owned property modifier policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          engine=Path('src/domain/profileEngine.ts')
          text=engine.read_text(encoding='utf-8')
          old='  roundingPolicy?: { id: string; default?: "floor"|"ceil"|"round" };\n  properties: Record<string, { storage?: string; formula?: ExpressionNode }>;' 
          new='  roundingPolicy?: { id: string; default?: "floor"|"ceil"|"round" };\n  propertyModifierPolicy?: { defaultInstancePolicy: "stack"|"replace"|"unique-by-source" };\n  properties: Record<string, { storage?: string; formula?: ExpressionNode }>;' 
          if new not in text:
              if old not in text: raise SystemExit('profileEngine policy anchor missing')
              text=text.replace(old,new,1)
          engine.write_text(text,encoding='utf-8')

          ops=Path('src/domain/resolutionEffectOps.ts')
          text=ops.read_text(encoding='utf-8')
          old='function displacedPropertyModifierEffects(effects:EffectInstance[],effect:EffectInstance):EffectInstance[] {\n  const modifier=effect.propertyModifier;\n  if(!modifier||modifier.instancePolicy==="stack") return [];\n  if(modifier.instancePolicy==="profile-policy") {\n    throw new DomainEvaluationError("property modifier profile-policy requires an explicit RulesProfile stacking policy");\n  }\n  return effects.filter((existing)=>{\n    const current=existing.propertyModifier;\n    if(existing.targetId!==effect.targetId||!current||current.property!==modifier.property) return false;\n    if(modifier.instancePolicy==="replace") return true;\n    return existing.sourceId===effect.sourceId;\n  });\n}'
          new='function displacedPropertyModifierEffects(effects:EffectInstance[],effect:EffectInstance,profile:ResolutionExecutionContext["profile"]):EffectInstance[] {\n  const modifier=effect.propertyModifier;\n  if(!modifier) return [];\n  const policy=modifier.instancePolicy==="profile-policy" ? profile.propertyModifierPolicy?.defaultInstancePolicy : modifier.instancePolicy;\n  if(!policy) throw new DomainEvaluationError("property modifier profile-policy requires an explicit RulesProfile stacking policy");\n  if(policy==="stack") return [];\n  return effects.filter((existing)=>{\n    const current=existing.propertyModifier;\n    if(existing.targetId!==effect.targetId||!current||current.property!==modifier.property) return false;\n    if(policy==="replace") return true;\n    return existing.sourceId===effect.sourceId;\n  });\n}'
          if new not in text:
              if old not in text: raise SystemExit('resolutionEffectOps policy anchor missing')
              text=text.replace(old,new,1)
          old_call='const displacedEffects=displacedPropertyModifierEffects(ctx.state.effects,effect);'
          new_call='const displacedEffects=displacedPropertyModifierEffects(ctx.state.effects,effect,ctx.profile);'
          if new_call not in text:
              if old_call not in text: raise SystemExit('resolutionEffectOps policy call anchor missing')
              text=text.replace(old_call,new_call,1)
          ops.write_text(text,encoding='utf-8')

          schema_path=Path('schemas/rules-profile.schema.json')
          schema=json.loads(schema_path.read_text(encoding='utf-8'))
          schema['properties']['propertyModifierPolicy']={'type':'object','required':['defaultInstancePolicy'],'properties':{'defaultInstancePolicy':{'enum':['stack','replace','unique-by-source']}},'additionalProperties':False}
          schema_path.write_text(json.dumps(schema,separators=(',',':'))+'\n',encoding='utf-8')

          profile_path=Path('rules/profiles/dnd.srd-5.2.1.profile.json')
          profile=json.loads(profile_path.read_text(encoding='utf-8'))
          profile['propertyModifierPolicy']={'defaultInstancePolicy':'unique-by-source'}
          profile_path.write_text(json.dumps(profile,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          service=Path('src/app/realResolutionService.ts')
          text=service.read_text(encoding='utf-8')
          old='  roundingPolicy:dndSrdRulesProfile.roundingPolicy as RulesProfileLike["roundingPolicy"],\n  properties:dndSrdRulesProfile.properties as RulesProfileLike["properties"],'
          new='  roundingPolicy:dndSrdRulesProfile.roundingPolicy as RulesProfileLike["roundingPolicy"],\n  propertyModifierPolicy:dndSrdRulesProfile.propertyModifierPolicy as RulesProfileLike["propertyModifierPolicy"],\n  properties:dndSrdRulesProfile.properties as RulesProfileLike["properties"],'
          if new not in text:
              if old not in text: raise SystemExit('realResolutionService profile anchor missing')
              text=text.replace(old,new,1)
          service.write_text(text,encoding='utf-8')

          test_path=Path('tests/domain/propertyModifierInstancePolicyRuntime.test.ts')
          text=test_path.read_text(encoding='utf-8')
          import_anchor='import type { RuntimeState } from "../../src/domain/combatState";'
          import_line='import type { RulesProfileLike } from "../../src/domain/profileEngine";'
          if import_line not in text:
              if import_anchor not in text: raise SystemExit('instance policy test import anchor missing')
              text=text.replace(import_anchor,import_anchor+'\n'+import_line,1)
          old='function apply(state:RuntimeState,id:string,policy:Policy,resolutionId:string) {\n  const parsed=parseCommonPlayOperationDefinition(definition(id,policy));\n  const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,{resolutionId,actorId:"hero",entryPointId:"activate"});\n  return resolvePendingResolution(TEST_PROFILE,state,pending);\n}'
          new='function apply(state:RuntimeState,id:string,policy:Policy,resolutionId:string,profile:RulesProfileLike=TEST_PROFILE) {\n  const parsed=parseCommonPlayOperationDefinition(definition(id,policy));\n  const pending=compileCommonPlayEntryPointOperations(profile,state,parsed,{resolutionId,actorId:"hero",entryPointId:"activate"});\n  return resolvePendingResolution(profile,state,pending);\n}'
          if new not in text:
              if old not in text: raise SystemExit('instance policy apply anchor missing')
              text=text.replace(old,new,1)
          marker='test("profile-policy delegates structurally to the active RulesProfile",()=>{'
          if marker not in text:
              text += '\n'+marker+'\n  const profile:RulesProfileLike={...TEST_PROFILE,propertyModifierPolicy:{defaultInstancePolicy:"unique-by-source"}};\n  const first=committed(apply(runtimeState(),"external.profile.same","profile-policy","profile-policy-1",profile));\n  const firstEffect=propertyEffects(first.state)[0]!;\n  const second=committed(apply(first.state,"external.profile.same","profile-policy","profile-policy-2",profile));\n  assert.equal(propertyEffects(second.state).length,1);\n  const changes=second.events.flatMap((event)=>event.stateChanges).filter((change)=>change.kind==="effect");\n  assert.ok(changes.some((change)=>change.effectId===firstEffect.id&&change.operation==="removed"));\n  const third=committed(apply(second.state,"external.profile.other","profile-policy","profile-policy-3",profile));\n  assert.equal(propertyEffects(third.state).length,2);\n});\n'
          test_path.write_text(text,encoding='utf-8')

          production=Path('tests/ui/installedCommonPlayPropertyModifierProduction.test.ts')
          text=production.read_text(encoding='utf-8')
          old='import { resolveRuntimeProfileProperty } from "../../src/app/realResolutionService";'
          new='import { SIMPLEVTT_APP_RULES_PROFILE, resolveRuntimeProfileProperty } from "../../src/app/realResolutionService";'
          if new not in text:
              if old not in text: raise SystemExit('production profile import anchor missing')
              text=text.replace(old,new,1)
          marker='test("production D&D profile owns the generic property modifier instance policy",()=>{'
          if marker not in text:
              anchor='test("production property owner composes profile-derived values with active Effect modifiers",()=>{'
              if anchor not in text: raise SystemExit('production property test anchor missing')
              addition='test("production D&D profile owns the generic property modifier instance policy",()=>{\n  assert.equal(SIMPLEVTT_APP_RULES_PROFILE.propertyModifierPolicy?.defaultInstancePolicy,"unique-by-source");\n});\n\n'
              text=text.replace(anchor,addition+anchor,1)
          production.write_text(text,encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify profile-policy path
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test tests/domain/propertyModifierInstancePolicyRuntime.test.ts
          npx tsx --test tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          npx tsc --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Reconcile Family A evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='A')
          row['currentState']=row['currentState'].replace('profile-policy rejects explicitly until RulesProfile supplies a stacking policy.','profile-policy delegates structurally to the active RulesProfile default instance policy; D&D SRD 5.2.1 declares unique-by-source.')
          row['currentState']=row['currentState'].replace('Family A remains incomplete because property materialization outside the currently projected canonical CharacterSheet/turn-runtime vocabulary is not yet unified under a generic property owner, and profile-policy remains unsupported until RulesProfile defines the stacking policy.','Family A remains incomplete because property materialization outside the currently projected canonical CharacterSheet/turn-runtime vocabulary is not yet unified under a generic property owner.')
          row['remainingNamedSeams']=[entry for entry in row['remainingNamedSeams'] if not entry.startswith('property modifier profile-policy remains explicitly unsupported')]
          impl='RulesProfile propertyModifierPolicy structurally owns profile-policy default instance semantics; resolutionEffectOps delegates profile-policy through ctx.profile without content identity dispatch'
          prod='realResolutionService maps the D&D SRD RulesProfile unique-by-source property modifier policy into production; propertyModifierInstancePolicyRuntime.test.ts proves profile-policy displacement remains inverse-ready'
          if impl not in row['implementationEvidence']: row['implementationEvidence'].append(impl)
          if prod not in row['productionEvidence']: row['productionEvidence'].append(prod)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit verified Family A profile policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/c9-family-a-profile-policy-71304.yml .github/workflows/c9-family-a-profile-policy-runner-71304.yml
          git add src/domain/profileEngine.ts src/domain/resolutionEffectOps.ts schemas/rules-profile.schema.json rules/profiles/dnd.srd-5.2.1.profile.json src/app/realResolutionService.ts tests/domain/propertyModifierInstancePolicyRuntime.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "feat(c9): resolve RulesProfile property modifier policy"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1
