name: W5-07 AUTO Verification

on:
  pull_request:
    paths:
      - "src/app/connectedSessionRuntimeAdapter.ts"
      - "src/app/connectedActionRoutingAdapter.ts"
      - "src/app/connectedResolutionPresentation.ts"
      - "tests/ui/connectedThreePeerRemoteAttackOwnership.test.ts"
      - ".github/workflows/w5-07-auto.yml"
  push:
    branches:
      - "work/v1-composite"
      - "agent/**"
    paths:
      - "src/app/connectedSessionRuntimeAdapter.ts"
      - "src/app/connectedActionRoutingAdapter.ts"
      - "src/app/connectedResolutionPresentation.ts"
      - "tests/ui/connectedThreePeerRemoteAttackOwnership.test.ts"
      - ".github/workflows/w5-07-auto.yml"

jobs:
  remote-attack-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify MP-C01/C03 remote attack ownership and spectator presentation
        run: npx tsx --test tests/ui/connectedThreePeerRemoteAttackOwnership.test.ts
