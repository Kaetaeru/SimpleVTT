name: W5-07 AUTO Verification

on:
  pull_request:
    paths:
      - "src/app/productionAcceptanceRuntimeAdapter.ts"
      - "src/app/connectedSessionRuntimeAdapter.ts"
      - "src/app/connectedActionRoutingAdapter.ts"
      - "src/app/connectedResolutionPresentation.ts"
      - "src/app/characterSessionProjectionMount.ts"
      - "tests/ui/connectedThreePeerRemoteAttackOwnership.test.ts"
      - "tests/ui/connectedThreePeerRemoteRejectionExactlyOnce.test.ts"
      - "tests/ui/connectedThreePeerDuplicateEventBatch.test.ts"
      - ".github/workflows/w5-07-auto.yml"
  push:
    branches:
      - "work/v1-composite"
      - "agent/**"
    paths:
      - "src/app/productionAcceptanceRuntimeAdapter.ts"
      - "src/app/connectedSessionRuntimeAdapter.ts"
      - "src/app/connectedActionRoutingAdapter.ts"
      - "src/app/connectedResolutionPresentation.ts"
      - "src/app/characterSessionProjectionMount.ts"
      - "tests/ui/connectedThreePeerRemoteAttackOwnership.test.ts"
      - "tests/ui/connectedThreePeerRemoteRejectionExactlyOnce.test.ts"
      - "tests/ui/connectedThreePeerDuplicateEventBatch.test.ts"
      - ".github/workflows/w5-07-auto.yml"

jobs:
  remote-attack-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify W5-07 three-peer action slices
        shell: bash
        run: |
          set +e
          npx tsx --test \
            tests/ui/connectedThreePeerRemoteAttackOwnership.test.ts \
            tests/ui/connectedThreePeerRemoteRejectionExactlyOnce.test.ts \
            tests/ui/connectedThreePeerDuplicateEventBatch.test.ts \
            > w5-07-auto.log 2>&1
          status=$?
          cat w5-07-auto.log
          exit "$status"
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W5-07-AUTO-${{ github.sha }}
          path: w5-07-auto.log
          if-no-files-found: error
          retention-days: 14
