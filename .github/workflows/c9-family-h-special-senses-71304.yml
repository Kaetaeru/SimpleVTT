name: C9 Family H Special Senses 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-h-special-senses-71304.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/c9-gate-n-coverage-reconciliation"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Apply Family H patch
        run: python .github/c9-family-h-special-senses-71304.py
      - name: Verify Family H production slice
        run: |
          node --import tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/domain/commonPlaySpatialFactRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          npx tsc --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Commit verified slice and retire staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/spatialRuntimeContracts.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
          git rm .github/workflows/c9-family-h-special-senses-71304.yml .github/c9-family-h-special-senses-71304.py
          git commit -m "feat(c9): wire special senses into production facts"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
