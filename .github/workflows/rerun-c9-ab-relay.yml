name: C9 Family AB Relay

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-ab-relay.yml

permissions:
  contents: write
  issues: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Relay Family AB row
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE' > /tmp/ab-audit.md
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('docs/rules/v1-mechanism-coverage-ledger.json','utf8'));
          const row=ledger.rows.find((candidate)=>candidate.family==='AB');
          if(!row) throw new Error('Family AB row not found');
          const counts=ledger.rows.reduce((acc,item)=>(acc[item.disposition]=(acc[item.disposition]??0)+1,acc),{});
          console.log('# Family AB audit relay');
          console.log('HEAD:',process.env.GITHUB_SHA);
          console.log('```json');
          console.log(JSON.stringify(row,null,2));
          console.log('```');
          console.log('Counts:',JSON.stringify(counts));
          console.log('gateNBlockingNamedFallbacks:',JSON.stringify(ledger.gateNBlockingNamedFallbacks??[]));
          NODE
          gh issue edit 180 --repo Kaetaeru/SimpleVTT --body-file /tmp/ab-audit.md
      - name: Remove relay workflow
        if: always()
        run: |
          rm .github/workflows/rerun-c9-ab-relay.yml
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(c9): remove Family AB relay helper"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
