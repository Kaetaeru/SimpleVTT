name: C9 Family G Standard Spatial Facts

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-g-standard-spatial-facts-7130.yml
      - tests/domain/c9FamilyGStandardSpatialFacts.test.ts
      - src/domain/commonPlaySpatialFactRuntime.ts
      - src/app/connectedCommonPlayAuthorityFactRuntime.ts
      - tests/ui/connectedCommonPlayAuthorityFactRouting.test.ts
      - tests/ui/connectedCommonPlayAuthorityFactDispatch.test.ts

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family G standard spatial facts
        run: >-
          node --import tsx --test
          tests/domain/commonPlaySpatialFactRuntime.test.ts
          tests/domain/c9FamilyGStandardSpatialFacts.test.ts
          tests/domain/commonPlayMaplessTargeting.test.ts
          tests/ui/connectedCommonPlayAuthorityFactRouting.test.ts
          tests/ui/connectedCommonPlayAuthorityFactDispatch.test.ts
      - name: Verify legacy execution boundary
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node --test tests/ui/legacyExecutionBoundary.test.mjs
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Retire verifier after successful evidence run
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-g-standard-spatial-facts-7130.yml
          git commit -m "chore(c9): retire Family G spatial fact verifier"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
