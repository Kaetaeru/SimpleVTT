name: C9 Family I Compile Boundary Fix 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-compile-boundary-fix-71304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch normal Common Play compile rejection boundary
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='src/app/installedCommonPlayRuntimeAdapter.ts';
          const lines=fs.readFileSync(path,'utf8').split('\n');
          const index=lines.findIndex((line)=>line.includes('const pending=compileCommonPlayEntryPointOperations('));
          if(index<0) throw new Error('normal Common Play compile call not found');
          const original=lines[index].trimStart().replace(/^const pending=/,'pending=');
          lines.splice(index,1,
            '    let pending;',
            '    try {',
            `      ${original}`,
            '    } catch(error) {',
            '      return {status:"rejected" as const,error:error instanceof Error?error.message:String(error),snapshot:await internal.getSnapshot()};',
            '    }',
          );
          fs.writeFileSync(path,lines.join('\n'));
          NODE
      - run: npm ci
      - run: npm run generate:content
      - run: node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npm exec tsc -- --noEmit
      - name: Publish verified patch and retire temporary verifiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/installedCommonPlayRuntimeAdapter.ts
          git rm -f .github/workflows/c9-family-i-rules-movement-71304.yml .github/workflows/c9-family-i-compile-boundary-fix-71304.yml
          git commit -m "fix(c9): normalize portable movement constraint rejection"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
