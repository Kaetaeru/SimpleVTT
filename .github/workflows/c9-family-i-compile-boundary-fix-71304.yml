name: C9 Family I Compile Boundary Fix 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-compile-boundary-fix-71304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - run: node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npm exec tsc -- --noEmit
      - name: Retire temporary Family I verifiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-i-rules-movement-71304.yml .github/workflows/c9-family-i-compile-boundary-fix-71304.yml
          git commit -m "chore(c9): retire Family I verifiers"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
