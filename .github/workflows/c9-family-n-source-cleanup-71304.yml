name: C9 Family N Source Cleanup 71304

on:
  push:
    paths:
      - ".github/workflows/c9-family-n-source-cleanup-71304.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile Family N ledger
        run: python .github/scripts/c9-family-n-source-cleanup-71304.py
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family N production lifecycle
        run: npx tsx --test tests/domain/c9FamilyNEffectLifecycleAcceptance.test.ts tests/domain/commonPlayEffectSuppressionRuntime.test.ts tests/ui/c9FamilyNEffectDurationProduction.test.ts
      - run: npm run build
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: node -e "const l=require('./docs/rules/v1-mechanism-coverage-ledger.json'); const r=l.rows.find(x=>x.family==='N'); if(r.disposition!=='IMPLEMENTED'||r.remainingNamedSeams.length) process.exit(1)"
      - run: git diff --check
      - name: Publish verified Family N reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-n-source-cleanup-71304.yml .github/scripts/c9-family-n-source-cleanup-71304.py
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): finalize Family N effect lifecycle evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
