name: C9 Family N Structural Termination 71304

on:
  push:
    paths:
      - ".github/workflows/c9-family-n-source-cleanup-71304.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply structural Family N termination extension
        run: python .github/scripts/c9-family-n-source-cleanup-71304.py
      - run: npm ci
      - name: Generate content prerequisites
        run: npm run generate:content
      - name: Verify Family N portable lifecycle
        run: >-
          npx tsx --test
          tests/domain/c9FamilyNEffectLifecycleAcceptance.test.ts
          tests/domain/commonPlayEffectSuppressionRuntime.test.ts
          tests/ui/c9FamilyNEffectDurationProduction.test.ts
      - name: Verify source types
        run: npx tsc -p tsconfig.json --noEmit
      - name: Verify Family N coverage classification
        shell: bash
        run: |
          set -euo pipefail
          out="$(node scripts/check-v1-mechanism-coverage.mjs 2>&1 || true)"
          printf '%s\n' "$out"
          if grep -Eq 'ledger violates Gate N|missing implementation evidence|required connected-state evidence|required persistence evidence' <<<"$out"; then
            exit 1
          fi
          incomplete="$(printf '%s\n' "$out" | sed -n -e 's/^Error: Incomplete V1 mechanism families: //p' -e 's/^Incomplete V1 mechanism families: //p')"
          if grep -Eq '(^|, )N(,|$)' <<<"$incomplete"; then
            echo "Family N remains incomplete"
            exit 1
          fi
      - run: node scripts/check-legacy-execution-boundary.mjs
      - name: Verify Family N ledger evidence
        run: >-
          node -e "const l=require('./docs/rules/v1-mechanism-coverage-ledger.json');
          const r=l.rows.find(x=>x.family==='N');
          if(r.disposition!=='IMPLEMENTED'||r.remainingNamedSeams.length) process.exit(1);
          for(const f of ['implementationEvidence','productionEvidence','identityInvarianceEvidence','connectedEvidenceIfRelevant','persistenceEvidenceIfRelevant']) if(!r[f]?.length) process.exit(1)"
      - run: git diff --check
      - name: Publish verified Family N structural termination
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-n-source-cleanup-71304.yml .github/scripts/c9-family-n-source-cleanup-71304.py
          git add src/domain/commonPlayEffectRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyNEffectDurationProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "feat(c9): expose portable effect termination policy"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
