name: C9 Family E Selector Cardinality Helper

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-e-cardinality-helper.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal Family E cardinality parity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/domain/commonPlayOperationRuntime.ts')
          text = runtime.read_text()
          old = '''export interface CommonPlayTargetingSelector {\n  from:"targets";\n  min:1;\n  max:1;\n}'''
          new = '''export interface CommonPlayTargetingSelector {\n  from:"targets";\n  min:number;\n  max:number;\n}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {\n  const selector=object(value,label);\n  supportedKeys(selector,TARGETING_KEYS,label);\n  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  if(selector.min!==1||selector.max!==1) throw new DomainEvaluationError(`${label}.min and .max must both be 1 for portable Common Play targeting`);\n  return {from:"targets",min:1,max:1};\n}'''
          new = '''function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {\n  const selector=object(value,label);\n  supportedKeys(selector,TARGETING_KEYS,label);\n  if(selector.from!=="targets") throw new DomainEvaluationError(`${label}.from must be targets for portable Common Play targeting`);\n  if(!Number.isInteger(selector.min)||Number(selector.min)<0) throw new DomainEvaluationError(`${label}.min must be a non-negative integer for portable Common Play targeting`);\n  if(!Number.isInteger(selector.max)||Number(selector.max)<Number(selector.min)) throw new DomainEvaluationError(`${label}.max must be an integer >= .min for portable Common Play targeting`);\n  return {from:"targets",min:Number(selector.min),max:Number(selector.max)};\n}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if(input.targetingTargets.length===1&&input.targetId!==undefined&&input.targetId!==input.targetingTargets[0].id) {\n      throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");\n    }\n    operations.push({\n      id:`${input.resolutionId}:targeting`,\n      kind:"targeting",\n      sourceId:input.actorId,\n      rule:{kind:"creature",minTargets:1,maxTargets:1,directTarget:false},\n      targets:input.targetingTargets.map((target)=>({...target})),\n    });'''
          new = '''    if(input.targetId!==undefined&&(input.targetingTargets.length!==1||input.targetId!==input.targetingTargets[0].id)) {\n      throw new DomainEvaluationError("Common Play downstream target requires exactly one matching validated targeting selection");\n    }\n    operations.push({\n      id:`${input.resolutionId}:targeting`,\n      kind:"targeting",\n      sourceId:input.actorId,\n      rule:{kind:"creature",minTargets:entryPoint.targeting.min,maxTargets:entryPoint.targeting.max,directTarget:false},\n      targets:input.targetingTargets.map((target)=>({...target})),\n    });'''
          assert old in text
          text = text.replace(old, new, 1)
          runtime.write_text(text)

          test_file = Path('tests/domain/commonPlayTargetingRuntime.test.ts')
          text = test_file.read_text()
          marker = '''test("unsupported Common Play selector shapes reject explicitly",()=>{'''
          insert = '''test("bounded Common Play selector preserves explicit multi-target cardinality through the existing targeting Resolver",()=>{\n  const definition=structuredClone(AUTHORED);\n  definition.entryPoints[0].targeting={from:"targets",min:1,max:2};\n  definition.entryPoints[0].operations=[];\n  const parsed=parseManualCommonPlayOperationDefinition(definition);\n  assert.deepEqual(parsed.entryPoints[0].targeting,{from:"targets",min:1,max:2});\n  const selected=[target("hero","self"),target("goblin","enemy")];\n  const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),parsed,{\n    resolutionId:"multi-targeting",\n    actorId:"hero",\n    entryPointId:"mend-other",\n    targetingTargets:selected,\n  });\n  const targeting=pending.operations[0];\n  assert.equal(targeting.kind,"targeting");\n  if(targeting.kind!=="targeting") return;\n  assert.equal(targeting.rule.minTargets,1);\n  assert.equal(targeting.rule.maxTargets,2);\n  assert.deepEqual(targeting.targets,selected);\n\n  const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),parsed,{\n    resolutionId:"multi-targeting",\n    actorId:"hero",\n    entryPointId:"mend-other",\n    targetingTargets:selected,\n  });\n  assert.equal(committed.status,"committed");\n  if(committed.status!=="committed") return;\n  assert.deepEqual((committed.results["multi-targeting:targeting"] as {targets:Array<{targetId:string}>}).targets.map((entry)=>entry.targetId),["hero","goblin"]);\n});\n\n'''
          assert marker in text
          text = text.replace(marker, insert + marker, 1)
          old = '''    [{from:"targets",min:0,max:1},/min and .max must both be 1/],\n    [{from:"targets",min:1,max:2},/min and .max must both be 1/],'''
          new = '''    [{from:"targets",min:-1,max:1},/min must be a non-negative integer/],\n    [{from:"targets",min:2,max:1},/max must be an integer >= .min/],'''
          assert old in text
          text = text.replace(old, new, 1)
          test_file.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E cardinality slice
        run: npx tsx --test tests/domain/commonPlayTargetingRuntime.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified patch and remove helper
        run: |
          rm .github/workflows/c9-family-e-cardinality-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayTargetingRuntime.test.ts .github/workflows/c9-family-e-cardinality-helper.yml
          git commit -m "feat(c9): support bounded Common Play target cardinality"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
