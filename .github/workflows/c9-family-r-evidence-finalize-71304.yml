name: C9 Family R Evidence Finalize 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-r-evidence-finalize-71304.yml

permissions:
  contents: write

jobs:
  finalize-kernel-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish verified kernel evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 20); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          row = next(entry for entry in data['rows'] if entry['family'] == 'R')
          implementation = [
              'commonPlaySimultaneousOrderingRuntime.ts generic pending/resolved ordering state with actor-controller|dm authority, revision/responder validation, exact candidate permutation, deterministic projection, and idempotent exact replay',
              'commonPlaySimultaneousOrderingRuntime.test.ts covers automatic zero/one-candidate resolution, authority/stale rejection, invalid permutations, deterministic ordering, replay, and conflicting replay rejection',
          ]
          identity = 'commonPlaySimultaneousOrderingRuntime.test.ts repeats the same relative mechanical ordering under unrelated renamed external candidate identities'
          remaining = 'production Common Play timing-window collection and Host-connected decision transport/reconnect/replay are not yet wired to the ordering kernel'
          changed = False
          if row.get('currentState') == 'No explicit generic ordering authority proof':
              row['currentState'] = 'A generic typed simultaneous-ordering decision kernel now validates eligible candidate sets, actor-controller/DM authority, stale revisions, exact permutations, deterministic ordered projection, and idempotent exact replay. Production timing-window collection, Host-connected decision transport/reconnect, and unknown RuleModule execution remain incomplete.'
              changed = True
          for evidence in implementation:
              if evidence not in row['implementationEvidence']:
                  row['implementationEvidence'].append(evidence)
                  changed = True
          if identity not in row['identityInvarianceEvidence']:
              row['identityInvarianceEvidence'].append(identity)
              changed = True
          if remaining not in row['remainingNamedSeams']:
              row['remainingNamedSeams'].append(remaining)
              changed = True
          if changed:
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
            if git diff --quiet -- docs/rules/v1-mechanism-coverage-ledger.json; then
              echo "Family R kernel evidence already recorded"
              exit 0
            fi
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
            git commit -m "docs(c9): record simultaneous ordering kernel evidence"
            npm run generate:content >/dev/null
            node --import tsx --test tests/domain/commonPlaySimultaneousOrderingRuntime.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            if git push origin HEAD:"$branch"; then exit 0; fi
            echo "Family R evidence publish raced; retry $attempt/20"
          done
          exit 1
