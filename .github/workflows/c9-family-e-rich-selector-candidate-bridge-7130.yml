name: C9 Family E Rich Selector Candidate Bridge 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-rich-selector-candidate-bridge-7130.yml

permissions:
  contents: write

jobs:
  verify-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Align obsolete rejection cases with supported interaction economy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=p.read_text(encoding='utf-8')
          replacements={
            '    (mechanic)=>{mechanic.config.entryPoints[0].interaction.revalidate="if-revision-changed";},\n':'    (mechanic)=>{mechanic.config.entryPoints[0].interaction.revalidate="never";},\n',
            '    (mechanic)=>{mechanic.config.payments[0].bucket="action";},\n':'    (mechanic)=>{mechanic.config.payments[0].bucket="free-action";},\n',
          }
          for old,new in replacements.items():
            if old in text:
              text=text.replace(old,new,1)
            elif new not in text:
              raise SystemExit(f'missing rejection-test marker: {old.strip()}')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify rich selector production and import boundary
        run: >-
          npx tsx --test
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify legacy boundary and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified rejection coverage and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/ruleModulePackageImport.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "test(c9): align interaction rejection coverage"
          fi
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git rm .github/workflows/c9-family-e-rich-selector-candidate-bridge-7130.yml
          if git ls-files --error-unmatch .github/workflows/c9-family-e-rich-predicate-bridge-7130.yml >/dev/null 2>&1; then
            git rm .github/workflows/c9-family-e-rich-predicate-bridge-7130.yml
          fi
          git commit -m "chore(c9): retire rich selector verifier"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
