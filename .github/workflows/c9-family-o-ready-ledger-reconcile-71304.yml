name: C9 Family O Ready Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-o-ready-ledger-reconcile-71304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile verified Ready evidence and retire staging workflows
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          verified_sha=""
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 20); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            current_sha=$(git rev-parse HEAD)
            rerun=true
            if [ -n "$verified_sha" ] && git diff --quiet "$verified_sha..$current_sha" -- \
              src/app/installedCommonPlayRuntimeAdapter.ts \
              src/domain/commonPlayStoredInvocationRuntime.ts \
              src/domain/concentration.ts \
              src/domain/resolutionEffectOps.ts \
              tests/ui/c9FamilyOReadyConcentrationProduction.test.ts \
              tests/ui/c9FamilyOConcentrationProduction.test.ts; then
              rerun=false
            fi

            if [ "$rerun" = true ]; then
              npm run generate:content >/dev/null
              node --import tsx --test \
                tests/ui/c9FamilyOReadyConcentrationProduction.test.ts \
                tests/ui/c9FamilyOConcentrationProduction.test.ts
              npm exec tsc -- --noEmit
              verified_sha="$current_sha"
            fi

            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in ledger['rows'] if entry.get('family')=='O')

          row['currentState']=(
            'Generic concentration kernel plus portable maintained-effect lowering compose through the shared Resolver. '
            'Unknown installed RuleModule activation, Host/client replay, duplicate handling, Undo, fresh reconnect, and rename invariance are proven. '
            'Readied spell capture now starts held concentration structurally for portable spell-category Common Play in the same stored-invocation capture transaction, '
            'links the stored invocation to that concentration, ends it on trigger, and reverses capture plus concentration through event-native Undo. '
            'Long-cast concentration setup remains incomplete.'
          )

          additions={
            'implementationEvidence':[
              'installedCommonPlayRuntimeAdapter.ts configureReadyAction derives held concentration structurally from CatalogEntry category=spell, emits start-concentration in the stored-invocation capture transaction, and records concentrationGroupId/onTriggerConcentration=end without content-name or mechanic-id dispatch',
            ],
            'productionEvidence':[
              'c9FamilyOReadyConcentrationProduction.test.ts proves an unknown installed spell Ready capture starts held concentration atomically with action spend and stored invocation creation, then event-native Undo reverses the complete capture',
            ],
            'identityInvarianceEvidence':[
              'c9FamilyOReadyConcentrationProduction.test.ts repeats Ready concentration under unrelated external module/content/mechanic identities and proves non-spell portable content does not acquire concentration by name',
            ],
          }
          for key,values in additions.items():
            for value in values:
              if value not in row[key]:
                row[key].append(value)

          row['remainingNamedSeams']=[
            'long-cast concentration setup is not yet proven through the portable Common Play/Resolver production path'
          ]
          row['disposition']='INCOMPLETE'
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs

            rm -f \
              .github/workflows/c9-family-o-ready-concentration-v3.yml \
              .github/workflows/c9-family-o-ready-concentration-v4.yml \
              .github/workflows/c9-family-o-ready-ledger-reconcile-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json \
              .github/workflows/c9-family-o-ready-concentration-v3.yml \
              .github/workflows/c9-family-o-ready-concentration-v4.yml \
              .github/workflows/c9-family-o-ready-ledger-reconcile-71304.yml
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): reconcile readied concentration evidence"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
