name: C9 Family I Granted Movement Primitive 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-granted-movement-primitive-71304.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate and verify portable granted movement
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-i-granted-movement-primitive-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          movement=Path('src/domain/commonPlayMovementRuntime.ts')
          text=movement.read_text()
          old='type CommonPlayMovementMode="teleport"|"push"|"pull"|"move";'
          new='type CommonPlayMovementMode="teleport"|"push"|"pull"|"move"|"granted";'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('unexpected CommonPlayMovementMode shape')
          old_line='      movementMode:definition.mode,destinationRef:answer.value,'
          new_line='      ...(definition.mode==="granted"?{}:{movementMode:definition.mode}),destinationRef:answer.value,'
          if old_line in text:
              text=text.replace(old_line,new_line,1)
          elif new_line not in text:
              raise SystemExit('unexpected free-move projection shape')
          movement.write_text(text)

          operation=Path('src/domain/commonPlayOperationRuntime.ts')
          text=operation.read_text()
          old='    if(operation.mode!=="move"&&operation.mode!=="push"&&operation.mode!=="pull"&&operation.mode!=="teleport") throw new DomainEvaluationError(`${label}.mode is unsupported`);'
          new='    if(operation.mode!=="move"&&operation.mode!=="push"&&operation.mode!=="pull"&&operation.mode!=="teleport"&&operation.mode!=="granted") throw new DomainEvaluationError(`${label}.mode is unsupported`);'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('unexpected movement mode parser shape')
          operation.write_text(text)

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text())
          matches=[]
          for name,definition in schema.get('$defs',{}).items():
              props=definition.get('properties',{}) if isinstance(definition,dict) else {}
              if props.get('kind',{}).get('const')=='movement.relocate':
                  matches.append((name,props))
          if len(matches)!=1:
              raise SystemExit(f'expected one movement.relocate schema definition, got {[m[0] for m in matches]}')
          enum=matches[0][1].get('mode',{}).get('enum')
          if not isinstance(enum,list):
              raise SystemExit('movement.relocate mode enum missing')
          if 'granted' not in enum:
              enum.append('granted')
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+'\n')

          test_path=Path('tests/ui/c9FamilyIGrantedMovementProduction.test.ts')
          if not test_path.exists():
              test_path.write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";

          function modulePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.content`;
            const mechanicId=`${prefix}.mechanic`;
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Unknown granted movement",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],content:[{
                id:contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:"Portable Granted Step",locales:{en:{name:"Portable Granted Step"}}},
                mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{
                  id:"step",invocation:"manual",operations:[{
                    kind:"movement.relocate",mode:"granted",target:"actor",distance:{value:10},
                    doesNotProvokeOpportunityAttacks:true,
                    destinationFact:{id:"granted-destination",fact:"spatial.legal-destination",subject:"actor",authority:"actor-owner",visibility:"actor-and-dm",unknownPolicy:"request-authority"}
                  }]
                }]}}]
              }]
            })};
          }

          async function run(prefix:string) {
            const adapter=new MockAdapter();
            const pack=modulePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const before=(await adapter.getSnapshot()).scene.economyByActor["char.aelar"]!.movement;
            const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"step"});
            await adapter.resolveAction(actionId,["char.aelar"]);
            const snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete","unknown granted movement must commit through Common Play");
            assert.equal(snapshot.scene.economyByActor["char.aelar"]?.movement,before,"granted movement must not spend regular movement budget");
            assert.match(snapshot.resolution?.detail.join("\n")??"",/granted movement/i);
            return before;
          }

          test("unknown Common Play executes granted movement without named movement dispatch",async()=>{
            assert.equal(await run("external-family-i-granted"),30);
          });

          test("renaming external granted-movement identities preserves semantics",async()=>{
            assert.equal(await run("renamed-family-i-granted"),30);
          });
          ''')
          PY
            rm -f "$workflow"
            npm run generate:content
            node --import tsx --test tests/ui/c9FamilyIGrantedMovementProduction.test.ts tests/ui/c9FamilyIMovementGrantProduction.test.ts tests/ui/c9FamilyIMovementProduction.test.ts
            node scripts/check-legacy-execution-boundary.mjs
            node scripts/check-v1-mechanism-coverage.mjs
            npm exec tsc -- --noEmit
            git add src/domain/commonPlayMovementRuntime.ts src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyIGrantedMovementProduction.test.ts "$workflow"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "feat(c9): expose portable granted movement"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
