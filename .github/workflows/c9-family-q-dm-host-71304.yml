name: C9 Family Q Authority Ledger Sync 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-dm-host-71304.yml

permissions:
  contents: write

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify and reconcile Family Q evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            npm run generate:content >/dev/null
            node --import tsx --test \
              tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts \
              tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts \
              tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts
            npx tsc --noEmit
            node scripts/check-legacy-execution-boundary.mjs

            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text())
          row=next((entry for entry in ledger['rows'] if entry.get('family')=='Q'),None)
          if not row or row.get('id')!='interaction-reaction':
              raise SystemExit('Family Q ledger row missing')

          row['currentState']=(
              'Portable boolean consent supports actor, target, actor-owner, target-owner, DM, and Host responders through the existing blocking Resolution interrupt. '
              'Character-owner prompts route over the connected session path, rebind and resend after owner reconnect, reject stale old-peer responses, and revalidate before acceptance. '
              'DM/Host consent remains on local authoritative host control, rejects Character-peer approval, and commits payment plus downstream effects atomically through the same event path. '
              'Rich choice/multiple-option payloads and durable restart persistence for an in-flight blocking interaction remain incomplete.'
          )
          additions={
              'implementationEvidence':[
                  'commonPlayOperationRuntime.ts parses schema-authorized dm|host consent responders; installedCommonPlayRuntimeAdapter.ts maps them to authority:dm|authority:host on the existing blocking interrupt without a second interaction engine',
                  'connectedSessionRuntimeAdapter.ts rebinds a pending Character-owner interrupt prompt after reconnect while connectedActionRoutingAdapter authorizes responses structurally by responderId',
              ],
              'productionEvidence':[
                  '49f3b55bea55a8e45947d1dd1f5070e9b3b4b85c feat(c9): route DM and Host consent authority; c9FamilyQAuthorityInteractionProduction.test.ts verifies unknown and fully renamed dm|host modules, remote Character rejection, local authority acceptance, Reaction payment, damage commit, and authoritative event broadcast',
                  '4f007c12506a3e33c4cf983410205b559130d526 feat(c9): resume owner consent after reconnect; its verifier passed target-owner and actor-owner interaction regressions, typecheck, coverage, and legacy boundary before publishing',
              ],
              'identityInvarianceEvidence':[
                  'c9FamilyQAuthorityInteractionProduction.test.ts repeats DM and Host local-authority consent after fully renaming module/content/mechanic/entry identities',
              ],
              'connectedEvidenceIfRelevant':[
                  'c9FamilyQTargetOwnerInteractionProduction.test.ts rebinds a pending target-owner prompt to a reconnected peer, rejects the stale old peer, and accepts the rebound owner exactly once',
                  'c9FamilyQAuthorityInteractionProduction.test.ts proves DM/Host prompts stay on local authority, reject Character-peer responses, and publish the accepted canonical event batch',
              ],
          }
          for key,values in additions.items():
              bucket=row[key]
              for value in values:
                  if value not in bucket:
                      bucket.append(value)

          obsolete={
              'DM and Host responder routing is not yet represented',
              'actor-owner and target-owner reconnect and revision-stale response evidence remain incomplete',
          }
          row['remainingNamedSeams']=[entry for entry in row.get('remainingNamedSeams',[]) if entry not in obsolete]
          remaining=[
              'choice and multiple-option interaction payloads are not yet represented by the boolean consent contract',
              'durable restart persistence for an in-flight blocking interaction remains incomplete',
          ]
          for entry in remaining:
              if entry not in row['remainingNamedSeams']:
                  row['remainingNamedSeams'].append(entry)
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          PY

            node scripts/check-v1-mechanism-coverage.mjs
            git rm .github/workflows/c9-family-q-dm-host-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git diff --cached --check
            git commit -m "chore(c9): reconcile Family Q authority evidence"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
