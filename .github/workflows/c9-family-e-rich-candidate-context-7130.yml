name: C9 Family E Rich Candidate Context 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-rich-candidate-context-7130.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Carry authoritative scene properties into Resolver selector candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          runtime='src/domain/commonPlayOperationRuntime.ts'
          replace_once(
              runtime,
              'import { parseCommonPlaySelector, resolveCommonPlaySelector, type CommonPlaySelector } from "./commonPlaySelectorRuntime";\n',
              'import { parseCommonPlaySelector, resolveCommonPlaySelector, type CommonPlaySelector, type CommonPlaySelectorCandidate } from "./commonPlaySelectorRuntime";\n',
          )
          replace_once(
              runtime,
              '  targetingTargets?:TargetingFactInput[];\n  creatureKinds?:Record<string,"character"|"monster">;\n',
              '  targetingTargets?:TargetingFactInput[];\n  targetingCandidates?:CommonPlaySelectorCandidate[];\n  creatureKinds?:Record<string,"character"|"monster">;\n',
          )
          replace_once(
              runtime,
              '      candidates:input.targetingTargets.map(targetingSelectorCandidate),\n',
              '      candidates:input.targetingCandidates??input.targetingTargets.map(targetingSelectorCandidate),\n',
          )

          adapter='src/app/installedCommonPlayRuntimeAdapter.ts'
          replace_once(
              adapter,
              'import { allocationEntriesFromTargetSequence, resolveCommonPlayAllocation } from "../domain/commonPlayAllocationRuntime";\n',
              'import { allocationEntriesFromTargetSequence, resolveCommonPlayAllocation } from "../domain/commonPlayAllocationRuntime";\nimport type { CommonPlaySelectorCandidate } from "../domain/commonPlaySelectorRuntime";\n',
          )
          helper='''function commonPlaySelectorCandidate(actor:SceneVm["entities"][number],target:SceneVm["entities"][number]):CommonPlaySelectorCandidate {\n  const targeting=commonPlayTargetFact(actor,target);\n  return {\n    id:target.id,\n    targeting,\n    properties:{\n      id:target.id,relation:targeting.relation,name:target.name,side:target.side,kind:target.kind,\n      hp:target.hp,maxHp:target.maxHp,tempHp:target.tempHp,ac:target.ac,initiative:target.initiative,\n      status:[...target.status],resistances:[...target.resistances],immunities:[...target.immunities],vulnerabilities:[...target.vulnerabilities],\n    },\n  };\n}\n\n'''
          p=Path(adapter)
          text=p.read_text(encoding='utf-8')
          if 'function commonPlaySelectorCandidate(' not in text:
              marker='function damageDiceFaces(\n'
              if text.count(marker)!=1: raise SystemExit('candidate helper marker mismatch')
              text=text.replace(marker,helper+marker,1)
          old='    targetingTargets:entryPoint.targeting?selectedTargets.map((target)=>commonPlayTargetFact(actorEntity,target)):undefined,\n'
          new=old+'    targetingCandidates:entryPoint.targeting?selectedTargets.map((target)=>commonPlaySelectorCandidate(actorEntity,target)):undefined,\n'
          if new not in text:
              if text.count(old)!=1: raise SystemExit('operation input targeting marker mismatch')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          production=Path('tests/ui/installedCommonPlayProductionRuntime.test.ts')
          text=production.read_text(encoding='utf-8')
          title='test("unknown installed Common Play rich predicate filters authoritative scene properties without identity dispatch",async()=>{'
          if title not in text:
              marker='test("unknown installed Common Play relation selector rejects an ineligible target before production commit",async()=>{'
              if text.count(marker)!=1: raise SystemExit('production relation test marker mismatch')
              addition='''test("unknown installed Common Play rich predicate filters authoritative scene properties without identity dispatch",async()=>{\n  const adapter=new MockAdapter();\n  const payload=JSON.parse(targetingPackagePayload()) as any;\n  payload.content[0].mechanics[0].config.entryPoints[0].targeting={\n    from:"targets",where:{op:"contains",left:{ref:"status"},right:{value:"중독됨"}},min:1,max:1,\n  };\n  setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const preview=await adapter.previewContentImport(JSON.stringify(payload));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  const actionId=installedCommonPlayActionId({\n    catalogId:catalogQualifiedId(TARGETING_IDENTITY.contentId,TARGETING_IDENTITY.moduleId,"1"),\n    mechanicId:TARGETING_IDENTITY.mechanicId,entryPointId:TARGETING_IDENTITY.entryPointId,\n  });\n  injureSceneEntity(adapter,"combatant.goblin-a",10);\n  injureSceneEntity(adapter,"combatant.goblin-b",10);\n  await adapter.startInitiative();\n  await adapter.setCurrentActor("char.aelar");\n  let snapshot=await adapter.getSnapshot();\n  const ineligibleBefore=snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-b")!.hp;\n  await adapter.resolveAction(actionId,["combatant.goblin-b"]);\n  snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-b")!.hp,ineligibleBefore);\n\n  const eligibleBefore=snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp;\n  await adapter.resolveAction(actionId,["combatant.goblin-a"]);\n  snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.stage,"complete");\n  assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);\n  assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="combatant.goblin-a")!.hp,eligibleBefore+5);\n});\n\n'''
              text=text.replace(marker,addition+marker,1)
          production.write_text(text,encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E rich selector slice
        run: >-
          npx tsx --test
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify coverage, legacy boundary, and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified slice without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m "feat(c9): carry rich selector candidate context"; fi
          for path in \
            .github/workflows/c9-family-e-rich-candidate-context-7130.yml \
            .github/workflows/c9-family-e-rich-predicate-bridge-7130.yml \
            .github/workflows/c9-family-e-rich-predicate-bridge-r2-7130.yml; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git rm "$path"; fi
          done
          if git ls-files --error-unmatch .tmp-rerun-marker >/dev/null 2>&1; then git rm .tmp-rerun-marker; fi
          if ! git diff --cached --quiet; then git commit -m "chore(c9): remove consumed selector verifiers"; fi
          for attempt in 1 2 3 4 5 6; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          echo "rich selector candidate slice could not acquire a clean fast-forward window" >&2
          exit 1
