name: C9 Family K Graze Conditional Damage 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-k-graze-conditional-damage-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-k-graze-conditional-damage-71304
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Add outcome-conditioned portable damage and focused proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          text=path.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global text
              if new in text:
                  return
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text=text.replace(old,new,1)

          replace_once(
              'type CommonPlayDamageApply={\n  kind:"damage.apply";\n  amount:LiteralNumberExpression|string;\n  damageType:string;\n  multiplier?:number;\n  target?:CommonPlayHpTarget;\n};',
              'type CommonPlayDamageApply={\n  kind:"damage.apply";\n  amount:LiteralNumberExpression|string;\n  damageType:string;\n  multiplier?:number;\n  target?:CommonPlayHpTarget;\n  when?:CommonPlayTestOutcomePredicate;\n};',
              'damage type',
          )
          replace_once(
              'const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target"]);',
              'const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target","when"]);',
              'damage keys',
          )
          replace_once(
              '    const multiplier=operation.multiplier;\n    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);\n    return {\n      kind:"damage.apply",\n      amount,\n      damageType:nonEmptyString(operation.damageType,`${label}.damageType`),\n      ...(multiplier===undefined?{}:{multiplier}),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n    };',
              '    const multiplier=operation.multiplier;\n    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);\n    const when=testOutcomePredicate(operation.when,`${label}.when`);\n    return {\n      kind:"damage.apply",\n      amount,\n      damageType:nonEmptyString(operation.damageType,`${label}.damageType`),\n      ...(multiplier===undefined?{}:{multiplier}),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n      ...(when?{when}:{}),\n    };',
              'damage parse',
          )
          replace_once(
              '  if(entryPoint.operations.some((operation)=>(operation.kind==="condition.apply"||operation.kind==="condition.remove"||operation.kind==="effect.remove")&&operation.when)&&!entryPoint.test) throw new DomainEvaluationError(`${label}.entryPoints[${index}] test.outcome conditional operation requires a d20 test`);',
              '  if(entryPoint.operations.some((operation)=>(operation.kind==="condition.apply"||operation.kind==="condition.remove"||operation.kind==="effect.remove"||operation.kind==="damage.apply")&&operation.when)&&!entryPoint.test) throw new DomainEvaluationError(`${label}.entryPoints[${index}] test.outcome conditional operation requires a d20 test`);',
              'conditional validation',
          )
          replace_once(
              '    if(operation.kind==="damage.apply") {\n      const targetId=hpOperationTarget(operation.target,input);',
              '    if(operation.kind==="damage.apply") {\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome" as const,equals:operation.when.right.value}:undefined;\n      const targetId=hpOperationTarget(operation.target,input);',
              'damage compile predicate',
          )
          replace_once(
              '        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          request:{',
              '        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          ...(when?{when}:{}),\n          request:{',
              'damage roll predicate',
          )
          replace_once(
              '      operations.push({\n        id:operationId,\n        kind:"damage",\n        targetId,',
              '      operations.push({\n        id:operationId,\n        kind:"damage",\n        ...(when?{when}:{}),\n        targetId,',
              'damage predicate',
          )
          path.write_text(text,encoding='utf-8')

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text(encoding='utf-8'))
          props=schema['$defs']['damageApply']['properties']
          expected={'$ref':'#/$defs/predicate'}
          if props.get('when') not in (None,expected):
              raise SystemExit(f'incompatible damageApply.when schema: {props.get("when")!r}')
          props['when']=expected
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          const TARGET_ID="combatant.goblin-a";

          function moduleJson(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.option`;
            const mechanicId=`${prefix}.mechanic`;
            const config={schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{
              id:"graze",invocation:"manual",targeting:{from:"targets",min:1,max:1},
              test:{kind:"attack-roll",roller:"actor",dc:{value:10}},
              operations:[{kind:"damage.apply",amount:{value:3},damageType:"force",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"failure"}}}],
            }]};
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Unknown Family K Graze probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Graze",locales:{en:{name:"Portable Graze"}}},mechanics:[{kind:"common-play",config}]}],
            })};
          }

          async function prepare(prefix:string) {
            const adapter=new MockAdapter();
            const pack=moduleJson(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            return {adapter,actionId:installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"graze"})};
          }

          function hp(adapter:MockAdapter,snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>) {
            const target=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.combatants[TARGET_ID];
            assert.ok(target);
            return target.hp;
          }

          async function exercise(prefix:string,face:number) {
            const {adapter,actionId}=await prepare(prefix);
            const beforeSnapshot=await adapter.getSnapshot();
            const before=hp(adapter,beforeSnapshot);
            await adapter.setQueuedD20(face);
            const afterSnapshot=await adapter.resolveAction(actionId,[TARGET_ID]);
            assert.equal(afterSnapshot.resolution?.stage,"complete",JSON.stringify(afterSnapshot.resolution));
            return {adapter,before,after:hp(adapter,afterSnapshot)};
          }

          test("unknown installed Common Play applies a Graze-like rider only on attack failure and Undo restores HP",async()=>{
            const miss=await exercise("external-family-k-graze",1);
            assert.equal(miss.after,miss.before-3);
            await miss.adapter.undoLastResolution();
            assert.equal(hp(miss.adapter,await miss.adapter.getSnapshot()),miss.before);

            const hit=await exercise("external-family-k-hit",15);
            assert.equal(hit.after,hit.before);
          });

          test("Graze-like conditional damage is invariant to external module/content/mechanic identity",async()=>{
            const first=await exercise("external-family-k-a",1);
            const renamed=await exercise("renamed-family-k-b",1);
            assert.equal(first.before-first.after,3);
            assert.equal(renamed.before-renamed.after,3);
          });
          TS

      - name: Verify Family K generic Graze slice
        run: >-
          node --import tsx --test
          tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts
          tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts
          tests/ui/c9FamilyJAttackPersistence.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Typecheck application
        run: npm exec tsc -- --noEmit
      - name: Publish verified Family K slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='K')
          row['currentState']='Generic Common Play now supports attack-outcome-conditioned damage through the shared Resolver, proving a Graze-like miss rider without weapon/content identity dispatch. Family K remains incomplete for the remaining mastery compositions and named progression-to-runtime convergence.'
          for field,value in {
            'implementationEvidence':'commonPlayOperationRuntime.ts damage.apply.when reuses the generic test.outcome ResolutionOperation predicate already used by portable condition/effect operations',
            'productionEvidence':'c9FamilyKGrazeConditionalDamageProduction.test.ts unknown installed Common Play applies a Graze-like miss-only damage rider, skips it on hit, and reverses through Undo',
            'identityInvarianceEvidence':'c9FamilyKGrazeConditionalDamageProduction.test.ts repeats the Graze-like miss rider after complete external module/content/mechanic identity rename',
          }.items():
              if value not in row[field]: row[field].append(value)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-k-graze-conditional-damage-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "feat(c9): support portable Graze conditional damage"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
