name: C9 Family A Derived Non-Active Projection 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-a-derived-nonactive-projection-7130.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Project full profile surface for non-active actors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("src/app/installedCommonPlayRuntimeAdapter.ts")
          text=path.read_text()
          old='''  if(internal.activeCharacter.id!==actorId) {\n    const inputs:Record<string,number>={...(actorState.baseProperties??{})};\n    inputs["movement.walk"]??=actorState.baseSpeed;\n    const projected={...inputs};\n    for(const property of Object.keys(inputs).sort((left,right)=>left.localeCompare(right))) {\n      projected[property]=resolveRuntimeProfileProperty(state.effects,actorId,property,inputs).value;\n    }\n    return projected;\n  }\n'''
          new='''  if(internal.activeCharacter.id!==actorId) {\n    const inputs:Record<string,number>={\n      ...(actorState.baseProperties??{}),\n      "movement.walk":actorState.baseSpeed,\n      "hp.current":actorState.life.hp.current,\n      "hp.maximum":actorState.life.hp.maximum,\n      "hp.temporary":actorState.life.hp.temporary,\n    };\n    const projected={...inputs};\n    for(const [property,definition] of Object.entries(SIMPLEVTT_APP_RULES_PROFILE.properties)) {\n      if(!Number.isFinite(inputs[property])&&!definition.formula) continue;\n      try {\n        projected[property]=resolveRuntimeProfileProperty(state.effects,actorId,property,inputs).value;\n      } catch {\n        continue;\n      }\n    }\n    return projected;\n  }\n'''
          if old not in text:
            if '"hp.current":actorState.life.hp.current' in text[text.index('function commonPlayActorProfileProperties('):text.index('\nfunction operationExecutionInput(',text.index('function commonPlayActorProfileProperties('))]:
              raise SystemExit(0)
            raise SystemExit("non-active profile projection seam changed")
          path.write_text(text.replace(old,new,1))
          PY
      - name: Verify production property owner and branch health
        run: |
          npx tsx --test tests/ui/c9FamilyANonActiveProfileProperties.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          npx tsc --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/app/installedCommonPlayRuntimeAdapter.ts; then
            exit 0
          fi
          git add src/app/installedCommonPlayRuntimeAdapter.ts
          git commit -m "fix(c9): project derived properties for non-active actors"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
