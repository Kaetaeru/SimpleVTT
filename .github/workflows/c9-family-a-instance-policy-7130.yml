name: C9 Family A Instance Policy 7130
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-instance-policy-7130.yml]
permissions:
  contents: write
jobs:
  instance-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Apply generic property modifier instance policy
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/domain/resolutionEffectOps.ts')
          source=path.read_text()
          old='''  const beforeLife = structuredClone(target.life);
  ctx.state.effects.push(effect);
  const provenance:ProvenanceRecord[] = [{
    source:effect.sourceId,
    status:"applied",
    reason:`effect ${effect.id} applied to ${effect.targetId}`,
  }];
  const changes:RuntimeStateChange[] = [effectStateChange(effect.targetId, effect.id, "added", provenance, undefined, effect)];'''
          new='''  const supersededEffects:EffectInstance[]=[];
  if(effect.propertyModifier&&effect.propertyModifier.instancePolicy!=="stack") {
    const policy=effect.propertyModifier.instancePolicy;
    const matching=ctx.state.effects.filter((existing)=>
      existing.targetId===effect.targetId&&existing.propertyModifier?.property===effect.propertyModifier?.property
    );
    if(policy==="profile-policy"&&matching.length) {
      throw new DomainEvaluationError(`property modifier ${effect.propertyModifier.property} profile-policy requires an explicit RulesProfile stacking policy`);
    }
    const replaced=policy==="replace"
      ? matching
      : policy==="unique-by-source"
        ? matching.filter((existing)=>existing.sourceId===effect.sourceId)
        : [];
    if(replaced.length) {
      const replacedIds=new Set(replaced.map((existing)=>existing.id));
      supersededEffects.push(...replaced);
      ctx.state.effects=ctx.state.effects.filter((existing)=>!replacedIds.has(existing.id));
    }
  }

  const beforeLife = structuredClone(target.life);
  ctx.state.effects.push(effect);
  const supersededProvenance:ProvenanceRecord[]=supersededEffects.map((existing)=>({
    source:existing.sourceId,
    status:"superseded",
    reason:`effect ${existing.id} superseded by ${effect.id}`,
  }));
  const provenance:ProvenanceRecord[] = [
    ...supersededProvenance,
    {
      source:effect.sourceId,
      status:"applied",
      reason:`effect ${effect.id} applied to ${effect.targetId}`,
    },
  ];
  const changes:RuntimeStateChange[] = [
    ...supersededEffects.map((existing,index)=>effectStateChange(
      existing.targetId,existing.id,"removed",[supersededProvenance[index]],existing,undefined,
    )),
    effectStateChange(effect.targetId, effect.id, "added", provenance, undefined, effect),
  ];'''
          if source.count(old)!=1:
            raise SystemExit(f'apply-effect anchor count={source.count(old)}')
          path.write_text(source.replace(old,new,1))
      - name: Add instance policy regression
        shell: python
        run: |
          from pathlib import Path
          Path('tests/domain/commonPlayPropertyInstancePolicyRuntime.test.ts').write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { compileCommonPlayEntryPointOperations, parseCommonPlayOperationDefinition } from "../../src/domain/commonPlayOperationRuntime";
          import { resolvePendingResolution } from "../../src/domain/resolution";
          import type { ResolutionCommit } from "../../src/domain/resolutionTypes";
          import { runtimeState, TEST_PROFILE } from "./rulesTestState";

          type InstancePolicy="stack"|"replace"|"unique-by-source"|"profile-policy";

          function definition(id:string,instancePolicy:InstancePolicy,value=5) {
            return parseCommonPlayOperationDefinition({
              schemaVersion:"0.2-draft",
              id,
              entryPoints:[{
                id:"activate",
                invocation:"manual",
                operations:[{
                  kind:"property.modify",
                  property:"movement.walk",
                  operation:"set",
                  value:{value},
                  target:"actor",
                  owner:"effect",
                  source:"definition",
                  duration:{kind:"elapsed",amount:{value:1},unit:"minutes"},
                  lifetime:{kind:"until-duration",onEnd:"destroy"},
                  instancePolicy,
                }],
              }],
            });
          }

          function apply(state:ReturnType<typeof runtimeState>,rule:ReturnType<typeof definition>,resolutionId:string):ResolutionCommit {
            return resolvePendingResolution(TEST_PROFILE,state,compileCommonPlayEntryPointOperations(TEST_PROFILE,state,rule,{
              resolutionId,
              actorId:"hero",
              entryPointId:"activate",
            }));
          }

          function committed(value:ResolutionCommit) {
            assert.equal(value.status,"committed");
            if(value.status!=="committed") throw new Error(value.error);
            return value;
          }

          test("property.modify unique-by-source replaces only the prior instance from the same source",()=>{
            const rule=definition("external.unknown.property.unique","unique-by-source");
            const first=committed(apply(runtimeState(),rule,"property-unique-first"));
            const second=committed(apply(first.state,rule,"property-unique-second"));
            assert.equal(second.state.effects.length,1);
            assert.equal(second.state.effects[0]?.sourceId,"common-play:external.unknown.property.unique:activate:operation:0");
            assert.equal(second.state.effects[0]?.id,"property-unique-second:operation:0:effect");
            const changes=second.events.flatMap((event)=>event.stateChanges).filter((change)=>change.kind==="effect");
            assert.deepEqual(changes.map((change)=>change.operation),["removed","added"]);
          });

          test("property.modify replace supersedes other sources for the same target property",()=>{
            const first=committed(apply(runtimeState(),definition("external.unknown.property.base","stack"),"property-replace-first"));
            const second=committed(apply(first.state,definition("external.unknown.property.replacer","replace",7),"property-replace-second"));
            assert.equal(second.state.effects.length,1);
            assert.equal(second.state.effects[0]?.sourceId,"common-play:external.unknown.property.replacer:activate:operation:0");
            const changes=second.events.flatMap((event)=>event.stateChanges).filter((change)=>change.kind==="effect");
            assert.deepEqual(changes.map((change)=>change.operation),["removed","added"]);
          });

          test("property.modify stack preserves independent providers",()=>{
            const first=committed(apply(runtimeState(),definition("external.unknown.property.stack-a","stack"),"property-stack-first"));
            const second=committed(apply(first.state,definition("external.unknown.property.stack-b","stack",7),"property-stack-second"));
            assert.equal(second.state.effects.length,2);
          });

          test("property.modify profile-policy rejects ambiguous providers until RulesProfile defines stacking policy",()=>{
            const first=committed(apply(runtimeState(),definition("external.unknown.property.profile-base","stack"),"property-profile-first"));
            const second=apply(first.state,definition("external.unknown.property.profile-policy","profile-policy",7),"property-profile-second");
            assert.equal(second.status,"rejected");
            if(second.status!=="rejected") return;
            assert.match(second.error,/profile-policy requires an explicit RulesProfile stacking policy/);
            assert.equal(second.state,first.state);
          });
          '''.replace('\n          ','\n').lstrip())
      - run: npx tsx --test tests/domain/commonPlayPropertyContractRuntime.test.ts tests/domain/commonPlayPropertyInstancePolicyRuntime.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
      - run: npx tsc --noEmit
      - name: Commit verified Family A instance policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/resolutionEffectOps.ts tests/domain/commonPlayPropertyInstancePolicyRuntime.test.ts
          git rm .github/workflows/c9-family-a-instance-policy-7130.yml
          git commit -m "feat(c9): enforce property modifier instance policy"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
