name: C9 Family A Property Instance Policy 7130
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-instance-policy-7130.yml]
permissions:
  contents: write
jobs:
  family-a-instance-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Enforce generic property modifier instance policies
        shell: python
        run: |
          from pathlib import Path

          path=Path('src/domain/resolutionEffectOps.ts')
          source=path.read_text()
          anchor='export function executeApplyEffect(ctx:ResolutionExecutionContext, operation:ApplyEffectOp):OperationExecution {'
          if source.count(anchor)!=1:
              raise SystemExit(f'executeApplyEffect anchor count={source.count(anchor)}')
          helper='''function displacedPropertyModifierEffects(effects:EffectInstance[],effect:EffectInstance):EffectInstance[] {\n  const modifier=effect.propertyModifier;\n  if(!modifier||modifier.instancePolicy==="stack") return [];\n  if(modifier.instancePolicy==="profile-policy") {\n    throw new DomainEvaluationError("property modifier profile-policy requires an explicit RulesProfile stacking policy");\n  }\n  return effects.filter((existing)=>{\n    const current=existing.propertyModifier;\n    if(existing.targetId!==effect.targetId||!current||current.property!==modifier.property) return false;\n    if(modifier.instancePolicy==="replace") return true;\n    return existing.sourceId===effect.sourceId;\n  });\n}\n\n'''
          source=source.replace(anchor,helper+anchor,1)
          old='''  const beforeLife = structuredClone(target.life);\n  ctx.state.effects.push(effect);\n  const provenance:ProvenanceRecord[] = [{\n    source:effect.sourceId,\n    status:"applied",\n    reason:`effect ${effect.id} applied to ${effect.targetId}`,\n  }];\n  const changes:RuntimeStateChange[] = [effectStateChange(effect.targetId, effect.id, "added", provenance, undefined, effect)];'''
          new='''  const displacedEffects=displacedPropertyModifierEffects(ctx.state.effects,effect);\n  if(displacedEffects.length) {\n    const displacedIds=new Set(displacedEffects.map((entry)=>entry.id));\n    ctx.state.effects=ctx.state.effects.filter((entry)=>!displacedIds.has(entry.id));\n  }\n  const beforeLife = structuredClone(target.life);\n  ctx.state.effects.push(effect);\n  const provenance:ProvenanceRecord[] = [{\n    source:effect.sourceId,\n    status:"applied",\n    reason:`effect ${effect.id} applied to ${effect.targetId}`,\n  }];\n  displacedEffects.forEach((entry)=>provenance.push({\n    source:entry.sourceId,\n    status:"applied",\n    reason:`property modifier effect ${entry.id} displaced by ${effect.id}`,\n  }));\n  const changes:RuntimeStateChange[] = [\n    ...displacedEffects.map((entry)=>effectStateChange(entry.targetId,entry.id,"removed",provenance,entry,undefined)),\n    effectStateChange(effect.targetId, effect.id, "added", provenance, undefined, effect),\n  ];'''
          if source.count(old)!=1:
              raise SystemExit(f'apply-effect mutation anchor count={source.count(old)}')
          path.write_text(source.replace(old,new,1))

          Path('tests/domain/propertyModifierInstancePolicyRuntime.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { compileCommonPlayEntryPointOperations, parseCommonPlayOperationDefinition } from "../../src/domain/commonPlayOperationRuntime";\nimport { resolvePendingResolution } from "../../src/domain/resolution";\nimport type { RuntimeState } from "../../src/domain/combatState";\nimport { runtimeState, TEST_PROFILE } from "./rulesTestState";\n\ntype Policy="stack"|"replace"|"unique-by-source"|"profile-policy";\nfunction definition(id:string,policy:Policy) { return {schemaVersion:"0.2-draft",id,entryPoints:[{id:"activate",invocation:"manual",operations:[{kind:"property.modify",property:"movement.walk",operation:"add",value:{value:5},target:"actor",owner:"effect",source:"definition",duration:{kind:"elapsed",amount:{value:1},unit:"minutes"},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:policy}]}]}; }\nfunction apply(state:RuntimeState,id:string,policy:Policy,resolutionId:string) {\n  const parsed=parseCommonPlayOperationDefinition(definition(id,policy));\n  const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,state,parsed,{resolutionId,actorId:"hero",entryPointId:"activate"});\n  return resolvePendingResolution(TEST_PROFILE,state,pending);\n}\nfunction committed(result:ReturnType<typeof apply>) {\n  assert.equal(result.status,"committed");\n  if(result.status!=="committed") throw new Error("expected committed resolution");\n  return result;\n}\nfunction propertyEffects(state:RuntimeState) { return state.effects.filter((effect)=>effect.propertyModifier?.property==="movement.walk"); }\n\ntest("stack retains independent generic property modifier effects",()=>{\n  const first=committed(apply(runtimeState(),"external.stack.one","stack","stack-1"));\n  const second=committed(apply(first.state,"external.stack.two","stack","stack-2"));\n  assert.equal(propertyEffects(second.state).length,2);\n});\n\ntest("replace displaces prior effects for the same target and property with reversible state changes",()=>{\n  const first=committed(apply(runtimeState(),"external.replace.old","stack","replace-1"));\n  const before=propertyEffects(first.state)[0]!;\n  const second=committed(apply(first.state,"external.replace.new","replace","replace-2"));\n  assert.equal(propertyEffects(second.state).length,1);\n  const changes=second.events.flatMap((event)=>event.stateChanges).filter((change)=>change.kind==="effect");\n  assert.ok(changes.some((change)=>change.effectId===before.id&&change.operation==="removed"));\n  assert.ok(changes.some((change)=>change.effectId!==before.id&&change.operation==="added"));\n});\n\ntest("unique-by-source replaces only the same structural source",()=>{\n  const first=committed(apply(runtimeState(),"external.unique.same","unique-by-source","unique-1"));\n  const second=committed(apply(first.state,"external.unique.same","unique-by-source","unique-2"));\n  assert.equal(propertyEffects(second.state).length,1);\n  const third=committed(apply(second.state,"external.unique.other","unique-by-source","unique-3"));\n  assert.equal(propertyEffects(third.state).length,2);\n});\n\ntest("profile-policy fails explicitly until RulesProfile owns a stacking policy",()=>{\n  const result=apply(runtimeState(),"external.profile.policy","profile-policy","profile-policy");\n  assert.equal(result.status,"rejected");\n});\n''')
      - run: npx tsx --test tests/domain/propertyModifierInstancePolicyRuntime.test.ts tests/domain/commonPlayPropertyContractRuntime.test.ts tests/domain/effectsRuntime.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
      - run: npx tsc --noEmit
      - name: Commit verified Family A instance policy semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/resolutionEffectOps.ts tests/domain/propertyModifierInstancePolicyRuntime.test.ts
          git rm .github/workflows/c9-family-a-instance-policy-7130.yml
          git commit -m "feat(c9): enforce property modifier instance policy"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
