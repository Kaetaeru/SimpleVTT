name: C9 Family J Ledger Evidence Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-ledger-evidence-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile Family J evidence with current source authority
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          assert row['disposition']=='INCOMPLETE'

          old='Projected Unarmed grapple/shove dispatches from a typed runtimeSaveCondition action payload rather than named action IDs, with arbitrary action-ID rename evidence.'
          new='Projected Unarmed grapple/shove dispatches from a typed runtimeSaveCondition action payload rather than named action IDs; built-in source projection is presentation-rename proven, while unknown portable Common Play control identity invariance is proven separately.'
          if old not in row['currentState']:
              raise SystemExit('Family J currentState evidence anchor changed')
          row['currentState']=row['currentState'].replace(old,new,1)

          old_prod='unarmedStrikeRuntime.test.ts executes projected grapple after replacing its action ID with an unrelated external ID'
          new_prod='unarmedStrikeRuntime.test.ts proves projected Unarmed damage/grapple/shove execution after presentation rename; source action IDs remain canonical'
          try:
              index=row['productionEvidence'].index(old_prod)
          except ValueError:
              raise SystemExit('Family J production evidence anchor changed')
          row['productionEvidence'][index]=new_prod

          old_identity='unarmedStrikeRuntime.test.ts runtimeSaveCondition rename probe preserves save/condition semantics under an unrelated action ID'
          new_identity='c9FamilyJPortableControlProduction.test.ts proves target-save/conditional-control semantics under fully renamed external module/content/mechanic identities; built-in unarmedStrikeRuntime evidence is presentation-only and is not used as identity-invariance proof'
          try:
              index=row['identityInvarianceEvidence'].index(old_identity)
          except ValueError:
              raise SystemExit('Family J identity evidence anchor changed')
          row['identityInvarianceEvidence'][index]=new_identity

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Commit verified reconciliation and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-j-ledger-evidence-reconcile-71304.yml
          git commit -m "docs(c9): reconcile Family J identity evidence"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
