name: C9 Spellcasting Audit Checkpoint

on:
  push:
    branches: ["agent/c9-gate-n-coverage-reconciliation"]
    paths: [".github/workflows/rerun-c9-z-audit-checkpoint.yml"]

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile latest branch
        run: |
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - name: Publish STATE checkpoint
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/STATE.md';
          let text=fs.readFileSync(path,'utf8');
          const marker='## Next Exact Action\n';
          if(!text.includes(marker)) throw new Error('STATE Next Exact Action marker missing');
          const section=`## Family Z/AA audit — named/durable ownership blockers\n\nFamily Z (\`spellcasting-meta\`) remains \`INCOMPLETE\`. The typed component and maintained-casting kernels are reusable, but production still selects spell mechanics through \`spellMechanicById(metadata.spellId)\` in \`productionSpellRuntimeAdapter.ts\`, which is content-identity dispatch forbidden by the architecture charter. \`resolveSpellComponents()\` can also report consumed material components, but that output is not atomically joined to the Character-owned durable inventory transaction. Do not hide either gap behind another spell adapter.\n\nFamily AA (\`progression\`) remains \`INCOMPLETE\`. Its installed progression contributions belong to the existing ProgressionDraft/Character revision domain, while the live level-up projection still has named adapters. Do not force progression grants into a combat Resolution merely to satisfy Gate N evidence.\n\n`;
          if(!text.includes('## Family Z/AA audit — named/durable ownership blockers')) text=text.replace(marker,section+marker);
          text=text.replace(/## Next Exact Action\n[\s\S]*$/m,`## Next Exact Action\n\nDo not reopen Families S/T/U or the audited authority-blocked V/W/X/Y/Z/AA seams. Move to Family AB (\`recharge-cooldown\`), whose generic \`recharge-resource\` Resolver operation already exists. Audit and, if structurally bounded, connect portable Recharge availability/consumption/turn-start recovery to the existing actor resource/action catalog and connected event path with authoritative die input, replay/reconnect, Undo, and arbitrary identity. Reuse the existing Resolver resource operation and turn lifecycle; do not create a monster-specific engine or invent die authority.\n`);
          fs.writeFileSync(path,text);
          NODE
          git rm .github/workflows/rerun-c9-z-audit-checkpoint.yml
          git add .chatgpt-rerun/STATE.md
          git commit -m "docs(rerun): checkpoint spellcasting ownership audit"
      - name: Publish control last
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=3, INCOMPLETE=33, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family U is IMPLEMENTED. X/Y are blocked by an undefined portable Character-owned durable item source/write-back contract; Z remains blocked by spellMechanicById content-identity dispatch plus an unjoined durable material-consumption boundary; AA remains blocked at the existing progression/Character revision projection boundary. Next audit Family AB Recharge using the existing recharge-resource Resolver operation and turn/resource authority without a monster-specific engine.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          git add .chatgpt-rerun/control.json
          git commit -m "docs(rerun): continue to recharge coverage audit"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation