name: C9 Family L Max HP Source 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-max-hp-source-71304.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply max HP source-model slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing: {path}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1))

          replace("src/app/persistenceContracts.ts",
          '''export interface CharacterSourceSnapshotV1 {\n  characterId:string;\n  name:string;\n  rulesProfile:RulesProfileRefV1;''',
          '''export interface CharacterSourceSnapshotV1 {\n  characterId:string;\n  name:string;\n  /** Source-owned maximum HP. Optional only for backward-compatible V1 hydration. */\n  maxHp?:number;\n  rulesProfile:RulesProfileRefV1;''')
          replace("src/app/characterLibraryPersistence.ts",
          '''  return {\n    characterId:sheet.id,\n    name:sheet.name,\n    rulesProfile:{''',
          '''  return {\n    characterId:sheet.id,\n    name:sheet.name,\n    maxHp:sheet.maxHp,\n    rulesProfile:{''')
          replace("src/app/characterLibraryPersistence.ts",
          '''  sheet.id=source.characterId;\n  sheet.name=source.name;\n  sheet.className=source.build.className;''',
          '''  sheet.id=source.characterId;\n  sheet.name=source.name;\n  if (source.maxHp !== undefined) sheet.maxHp=source.maxHp;\n  sheet.className=source.build.className;''')
          replace("src/app/characterSessionProjection.ts",
          '''    source,\n    sourceAuthority:{ maxHp:sheet.maxHp },\n    runtime,''',
          '''    source,\n    sourceAuthority:{ maxHp:source.maxHp ?? sheet.maxHp },\n    runtime,''')
          replace("src/app/characterSessionProjection.ts",
          '''    const source=parseSource(raw.source);\n    const sourceAuthority=parseSourceAuthority(raw.sourceAuthority);\n    const runtime=parseRuntime(raw.runtime);''',
          '''    const source=parseSource(raw.source);\n    const sourceAuthority=parseSourceAuthority(raw.sourceAuthority);\n    if (source.maxHp !== undefined) {\n      if (!nonNegativeInteger(source.maxHp)) throw new Error("projection source maxHp must be a non-negative integer");\n      if (source.maxHp !== sourceAuthority.maxHp) throw new Error("projection source maxHp does not match sourceAuthority.maxHp");\n    }\n    const runtime=parseRuntime(raw.runtime);''')
          replace("src/app/resolutionCharacterDurableProjection.ts",
          '''  if (change.kind==="hp") {\n    if (change.field==="maximum") return "Character write-back for maximum HP requires an explicit source-model contract";\n    const before=direction==="forward" ? change.before : change.after;\n    const after=direction==="forward" ? change.after : change.before;\n    const current=change.field==="current" ? sheet.hp : sheet.tempHp;\n    if (current!==before) return `Character write-back drift for ${change.targetId}/${label(change)}: expected ${before}, current ${current}`;\n    if (change.field==="current") sheet.hp=after;\n    else sheet.tempHp=after;\n    return;\n  }''',
          '''  if (change.kind==="hp") {\n    const before=direction==="forward" ? change.before : change.after;\n    const after=direction==="forward" ? change.after : change.before;\n    const current=change.field==="current" ? sheet.hp : change.field==="maximum" ? sheet.maxHp : sheet.tempHp;\n    if (current!==before) return `Character write-back drift for ${change.targetId}/${label(change)}: expected ${before}, current ${current}`;\n    if (after<0 || !Number.isInteger(after)) return `Character write-back invalid ${label(change)} value: ${after}`;\n    if (change.field==="current") sheet.hp=after;\n    else if (change.field==="maximum") sheet.maxHp=after;\n    else sheet.tempHp=after;\n    return;\n  }''')
          replace("src/domain/resolutionTypes.ts",
          '''  | (OperationBase & {\n      kind: "healing";\n      targetId: string;\n      amount: NumericOperand;\n    })\n  | (OperationBase & {\n      kind: "temporary-hp";''',
          '''  | (OperationBase & {\n      kind: "healing";\n      targetId: string;\n      amount: NumericOperand;\n    })\n  | (OperationBase & {\n      kind: "maximum-hp";\n      targetId: string;\n      amount: NumericOperand;\n    })\n  | (OperationBase & {\n      kind: "temporary-hp";''')
          replace("src/domain/resolutionHealthOps.ts",
          '''type HealingOp = Extract<ResolutionOperation, { kind:"healing" }>;\ntype TemporaryHpOp = Extract<ResolutionOperation, { kind:"temporary-hp" }>;''',
          '''type HealingOp = Extract<ResolutionOperation, { kind:"healing" }>;\ntype MaximumHpOp = Extract<ResolutionOperation, { kind:"maximum-hp" }>;\ntype TemporaryHpOp = Extract<ResolutionOperation, { kind:"temporary-hp" }>;''')
          replace("src/domain/resolutionHealthOps.ts",
          '''export function executeHealing(ctx: ResolutionExecutionContext, operation: HealingOp): OperationExecution {''',
          '''export function executeMaximumHpChange(ctx:ResolutionExecutionContext,operation:MaximumHpOp):OperationExecution {\n  const target=requireCombatant(ctx.state,operation.targetId);\n  const beforeHp={...target.life.hp};\n  const delta=valueFromResult(ctx.results,operation.amount);\n  if (!Number.isInteger(delta) || delta===0) throw new DomainEvaluationError("maximum HP change must resolve to a non-zero integer");\n  const maximum=beforeHp.maximum+delta;\n  if (maximum<0) throw new DomainEvaluationError("maximum HP cannot become negative");\n  target.life.hp={...beforeHp,maximum,current:Math.min(beforeHp.current,maximum)};\n  const provenance=[{source:ctx.pending.sourceId,status:"applied" as const,reason:`Maximum HP ${beforeHp.maximum} -> ${maximum}`}];\n  const result={delta,nextHp:{...target.life.hp},provenance};\n  const changes=hpStateChanges(operation.targetId,beforeHp,target.life.hp,provenance);\n  return {result,event:makeEvent(ctx.pending,operation,`${operation.targetId} maximum HP ${beforeHp.maximum} -> ${maximum}`,result,provenance,changes,operation.targetId)};\n}\n\nexport function executeHealing(ctx: ResolutionExecutionContext, operation: HealingOp): OperationExecution {''')
          replace("src/domain/resolution.ts",
          '''import { executeCompoundDamage, executeDamage, executeDeathSave, executeHealing, executeStabilize, executeTemporaryHp } from "./resolutionHealthOps";''',
          '''import { executeCompoundDamage, executeDamage, executeDeathSave, executeHealing, executeMaximumHpChange, executeStabilize, executeTemporaryHp } from "./resolutionHealthOps";''')
          replace("src/domain/resolution.ts",
          '''    case "healing": return executeHealing(ctx, operation);\n    case "temporary-hp": return executeTemporaryHp(ctx, operation);''',
          '''    case "healing": return executeHealing(ctx, operation);\n    case "maximum-hp": return executeMaximumHpChange(ctx, operation);\n    case "temporary-hp": return executeTemporaryHp(ctx, operation);''')
          replace("src/domain/commonPlayOperationRuntime.ts",
          '''type CommonPlayHealingApply={\n  kind:"healing.apply";\n  amount:LiteralNumberExpression;\n  target?:CommonPlayHpTarget;\n};\n\ntype CommonPlayTemporaryHpGrant={''',
          '''type CommonPlayHealingApply={\n  kind:"healing.apply";\n  amount:LiteralNumberExpression;\n  target?:CommonPlayHpTarget;\n};\n\ntype CommonPlayMaximumHpChange={\n  kind:"hp.maximum.change";\n  amount:CommonPlayExpression;\n  target?:CommonPlayHpTarget;\n};\n\ntype CommonPlayTemporaryHpGrant={''')
          replace("src/domain/commonPlayOperationRuntime.ts",
          '''  |CommonPlayDamageApply\n  |CommonPlayHealingApply\n  |CommonPlayTemporaryHpGrant''',
          '''  |CommonPlayDamageApply\n  |CommonPlayHealingApply\n  |CommonPlayMaximumHpChange\n  |CommonPlayTemporaryHpGrant''')
          replace("src/domain/commonPlayOperationRuntime.ts",
          '''const HEALING_APPLY_KEYS=new Set(["kind","amount","target"]);\nconst CONDITION_CHANGE_KEYS''',
          '''const HEALING_APPLY_KEYS=new Set(["kind","amount","target"]);\nconst MAXIMUM_HP_CHANGE_KEYS=new Set(["kind","amount","target"]);\nconst CONDITION_CHANGE_KEYS''')
          replace("src/domain/commonPlayOperationRuntime.ts",
          '''  if(operation.kind==="healing.apply") {\n    supportedKeys(operation,HEALING_APPLY_KEYS,label);''',
          '''  if(operation.kind==="hp.maximum.change") {\n    supportedKeys(operation,MAXIMUM_HP_CHANGE_KEYS,label);\n    return {kind:"hp.maximum.change",amount:numericExpression(operation.amount,`${label}.amount`),...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)})};\n  }\n  if(operation.kind==="healing.apply") {\n    supportedKeys(operation,HEALING_APPLY_KEYS,label);''')
          replace("src/domain/commonPlayOperationRuntime.ts",
          '''(operation.kind==="damage.apply"||operation.kind==="healing.apply"||operation.kind==="temp-hp.grant"||operation.kind==="life.stabilize")&&operation.target==="target"''',
          '''(operation.kind==="damage.apply"||operation.kind==="healing.apply"||operation.kind==="hp.maximum.change"||operation.kind==="temp-hp.grant"||operation.kind==="life.stabilize")&&operation.target==="target"''')
          replace("src/domain/commonPlayOperationRuntime.ts",
          '''    if(operation.kind==="healing.apply") {\n      operations.push({''',
          '''    if(operation.kind==="hp.maximum.change") {\n      const amount=actorExpressionInteger(operation.amount,input,"hp.maximum.change amount",0);\n      if (amount===0) throw new DomainEvaluationError("hp.maximum.change amount must resolve to a non-zero integer");\n      operations.push({id:operationId,kind:"maximum-hp",targetId:hpOperationTarget(operation.target,input),amount});\n      continue;\n    }\n\n    if(operation.kind==="healing.apply") {\n      operations.push({''')
          replace("schemas/common-play-contract.schema.json",
          '''        {\n          "$ref": "#/$defs/healingApply"\n        },\n        {\n          "$ref": "#/$defs/tempHpGrant"\n        },''',
          '''        {\n          "$ref": "#/$defs/healingApply"\n        },\n        {\n          "$ref": "#/$defs/maximumHpChange"\n        },\n        {\n          "$ref": "#/$defs/tempHpGrant"\n        },''')
          replace("schemas/common-play-contract.schema.json",
          '''    "tempHpGrant": {\n      "type": "object",''',
          '''    "maximumHpChange": {\n      "type": "object",\n      "required": ["kind", "amount"],\n      "properties": {\n        "kind": {"const": "hp.maximum.change"},\n        "amount": {"$ref": "#/$defs/expression"},\n        "target": {"enum": ["actor", "self", "target"]}\n      },\n      "additionalProperties": false\n    },\n    "tempHpGrant": {\n      "type": "object",''')
          Path("tests/ui/c9FamilyLMaximumHpProduction71304.test.ts").write_text(r'''import assert from "node:assert/strict";\nimport test from "node:test";\nimport "../../src/app/offlineRuntimeAdapters";\nimport { getCharacterLibraryPersistenceStateForTests, setCharacterLibraryStoreForTests } from "../../src/app/characterLibraryRuntimeAdapter";\nimport { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";\nimport { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";\nimport { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";\nimport { MemoryCharacterLibraryStore } from "../../src/app/memoryCharacterLibraryStore";\nimport { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";\nimport { MockAdapter } from "../../src/app/mockAdapter";\n\nfunction packagePayload(prefix:string){\n  const moduleId=`${prefix}.module`,contentId=`${prefix}.option`,mechanicId=`${prefix}.maximum-hp`;\n  return {moduleId,contentId,mechanicId,json:JSON.stringify({schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",source:{document:"Portable Maximum HP Probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Maximum HP",locales:{en:{name:"Portable Maximum HP"}}},mechanics:[{kind:"common-play",config:{schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{id:"increase",invocation:"manual",operations:[{kind:"hp.maximum.change",amount:{value:5},target:"self"}]}]}}]}]})};\n}\nfunction persistedSourceMaxHp(adapter:MockAdapter,characterId:string){return getCharacterLibraryPersistenceStateForTests(adapter)?.document?.characters.find((entry)=>entry.characterId===characterId)?.source.maxHp;}\nasync function restartedMaxHp(store:MemoryCharacterLibraryStore){const restarted=new MockAdapter();setCharacterLibraryStoreForTests(restarted,store);return (await restarted.getSnapshot()).activeCharacter.maxHp;}\nasync function execute(prefix:string){\n  const characterStore=new MemoryCharacterLibraryStore(),adapter=new MockAdapter();\n  setCharacterLibraryStoreForTests(adapter,characterStore);setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());\n  const pack=packagePayload(prefix),preview=await adapter.previewContentImport(pack.json);\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();await adapter.startInitiative();await adapter.setCurrentActor("char.aelar");\n  let snapshot=await adapter.getSnapshot();const characterId=snapshot.activeCharacter.id,before=snapshot.activeCharacter.maxHp;\n  assert.equal(snapshot.scene.entities.find((entry)=>entry.id===characterId)?.maxHp,before);assert.equal(persistedSourceMaxHp(adapter,characterId),before);\n  const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"increase"});\n  snapshot=await adapter.resolveAction(actionId,[characterId]);\n  assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));assert.equal(snapshot.activeCharacter.maxHp,before+5);assert.equal(snapshot.scene.entities.find((entry)=>entry.id===characterId)?.maxHp,before+5);assert.equal(persistedSourceMaxHp(adapter,characterId),before+5);assert.equal(await restartedMaxHp(characterStore),before+5);\n  snapshot=await adapter.undoLastResolution();assert.equal(snapshot.activeCharacter.maxHp,before);assert.equal(snapshot.scene.entities.find((entry)=>entry.id===characterId)?.maxHp,before);assert.equal(persistedSourceMaxHp(adapter,characterId),before);assert.equal(await restartedMaxHp(characterStore),before);\n  return before+5;\n}\ntest("unknown installed hp.maximum.change persists as source-owned max HP and reverses through Undo",async()=>{assert.equal(await execute("external.max-hp-original"),await execute("completely.renamed-max-hp"));});\n'''.replace('\\n','\n'))
          PY
      - name: Commit candidate and rebase onto latest branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/persistenceContracts.ts src/app/characterLibraryPersistence.ts src/app/characterSessionProjection.ts src/app/resolutionCharacterDurableProjection.ts src/domain/resolutionTypes.ts src/domain/resolutionHealthOps.ts src/domain/resolution.ts src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyLMaximumHpProduction71304.test.ts
          git rm .github/workflows/c9-family-l-max-hp-source-71304.yml
          git commit -m "feat(c9): make portable max HP source-owned"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - name: Verify Family L max HP slice
        shell: bash
        run: |
          npx tsx --test tests/ui/c9FamilyLMaximumHpProduction71304.test.ts tests/ui/c9FamilyLTemporaryHpProduction.test.ts tests/ui/c9FamilyLCriticalDiceProduction71304.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish verified change
        shell: bash
        run: git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
