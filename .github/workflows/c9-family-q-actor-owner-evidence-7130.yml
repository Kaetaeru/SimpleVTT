name: C9 Family Q Actor Owner Evidence 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-actor-owner-evidence-7130.yml

permissions:
  contents: write

jobs:
  verify-and-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family Q actor and actor-owner consent
        run: >-
          node --import tsx --test
          tests/domain/commonPlayActorOwnerInteractionRuntime.test.ts
          tests/domain/commonPlayInteractionProductionRuntime.test.ts
          tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify boundaries and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Reconcile Family Q evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='Q')
          row['currentState']=(
            'Portable boolean consent now supports actor and actor-owner responders through the existing blocking '
            'Resolution interrupt. Unknown installed Common Play routes the owner-directed prompt over the connected '
            'session path, preserves decline-before-commit semantics, revalidates before acceptance, and commits '
            'Reaction payment plus downstream effects atomically. Rich choice/multiple-option and the remaining '
            'target/DM/Host responder and reconnect/stale-replay matrix remain incomplete.'
          )
          row['implementationEvidence']=[
            'commonPlayOperationRuntime.ts typed consent interaction supports actor|actor-owner responders, always|if-revision-changed revalidation, and reject stale policy',
            'installedCommonPlayRuntimeAdapter.ts uses the existing Resolution interrupt and revalidates the installed action before atomic acceptance commit',
          ]
          row['productionEvidence']=[
            'c2c8824f7e0fc883463c285bb9572ded72a9e232 feat(c9): route actor-owner consent interactions',
            'commonPlayInteractionProductionRuntime.test.ts actor consent, decline/payment safety, target validation, and unsupported-shape boundaries',
            'installedCommonPlayActorOwnerInteractionProduction.test.ts unknown installed actor-owner prompt routing and atomic accepted commit',
          ]
          row['identityInvarianceEvidence']=[
            'installedCommonPlayActorOwnerInteractionProduction.test.ts uses arbitrary previously-unknown module/content/mechanic identities and resolves the interaction structurally rather than by content name',
          ]
          row['connectedEvidenceIfRelevant']=[
            'installedCommonPlayActorOwnerInteractionProduction.test.ts Host directs the blocking prompt to the owning peer and broadcasts the accepted authoritative event batch',
          ]
          row['persistenceEvidenceIfRelevant']=[]
          row['remainingNamedSeams']=[
            'choice and multiple-option interaction payloads are not yet represented by the boolean consent contract',
            'target, target-owner, DM, and Host responder routing is not yet represented',
            'actor-owner reconnect, stale-response rejection, duplicate/replay, and decline connected evidence remain incomplete',
            'named post-roll follow-up adapters remain migration debt outside the portable interaction path',
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified evidence and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          if ! git diff --cached --quiet; then git commit -m "docs(c9): reconcile Family Q actor-owner evidence"; fi
          git rm .github/workflows/c9-family-q-actor-owner-evidence-7130.yml
          git commit -m "chore(c9): remove Family Q evidence verifier"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep 2
          done
          test "$pushed" -eq 1
