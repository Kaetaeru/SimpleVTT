name: C9 Family H Finalize 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-h-finalize-71304.yml]

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - run: npm run generate:content
      - name: Reconcile Family H ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item.get('family')=='H')
          if row.get('disposition')=='IMPLEMENTED':
              raise SystemExit(0)
          if row.get('disposition')!='INCOMPLETE':
              raise SystemExit(f"unexpected Family H disposition: {row.get('disposition')}")

          seam='rules-derived special-sense acquisition/derivation into authoritative observer sense profiles remains incomplete'
          if seam not in row.get('remainingNamedSeams',[]):
              raise SystemExit(f"Family H changed concurrently; refusing stale finalize: {row.get('remainingNamedSeams')}")

          row['currentState']=(
              'Generic status, creature-type awareness, Hidden/Invisible effects, provider-authored sensing facts, and special-sense composition are production-proven through the shared Common Play/Resolver sensing kernel. '
              'RulesProfile numeric sense.darkvision/blindsight/tremorsense/truesight.range-feet properties now project structurally from commonPlayActorProfileProperties into authoritative observer senses without content-name or content-ID dispatch. '
              'Unknown external Wisdom Search/discovery uses the canonical ability.wis.modifier, preserves Hidden on failure, removes Resolver-owned Hidden on success, restores it through event-native Undo, and preserves semantics under full external identity rename.'
          )

          def add_unique(key,value):
              items=row.setdefault(key,[])
              if value not in items:
                  items.append(value)

          add_unique('implementationEvidence','rules/profiles/dnd.srd-5.2.1.profile.json declares generic sense.darkvision/blindsight/tremorsense/truesight.range-feet properties; commonPlayInterceptorProductionRuntimeAdapter.ts RULES_PROFILE_SENSE_PROPERTIES derives observer senses through commonPlayActorProfileProperties without content identity dispatch')
          add_unique('productionEvidence','8d806628c76d2b0c19fec5eb3c7df1b859d6f55e ci(c9): finish Family H sense-profile regression proof; C9 Family H Sense Profile 71304 run 33314316843 passed rules-derived profile-sense production regression, shared sensing regressions, legacy boundary, and tsc --noEmit before verifier retirement at a208f86eb3ea55fcd5047871f372846f5c9c26fc')
          add_unique('identityInvarianceEvidence','installedCommonPlayInterceptorProductionRuntime.test.ts proves Darkvision derived from a generic RulesProfile property modifier continues to drive production sensing after full external module/content/mechanic/interceptor/interaction/display rename')
          row['remainingNamedSeams']=[]
          row['disposition']='IMPLEMENTED'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify Family H production and contracts
        run: |
          node --import tsx --test \
            tests/domain/commonPlaySenseRuntime.test.ts \
            tests/domain/commonPlayPropertyContractRuntime.test.ts \
            tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts \
            tests/ui/c9FamilyHSearchDiscovery.test.ts \
            tests/ui/c9FamilyHSearchDiscoveryProduction.test.ts \
            tests/ui/c9FamilyHTremorsenseProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc -p tsconfig.json --noEmit
      - name: Publish verified Family H final state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-h-finalize-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          if git diff --cached --quiet; then
            echo "no Family H ledger delta to publish"
            exit 0
          fi
          git diff --cached --check
          git commit -m "docs(c9): finalize Family H coverage"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
