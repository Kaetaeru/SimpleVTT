name: C9 Family E Automatic Selector Bridge Fix

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-automatic-selector-bridge-fix.yml

permissions:
  contents: write

jobs:
  fix-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Repair ledger collection key and retire fixer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-e-automatic-selector-bridge.yml')
          text=path.read_text()
          old='ledger["families"]'
          new='ledger["rows"]'
          if new not in text:
              if old not in text:
                  raise SystemExit('ledger collection anchor missing')
              path.write_text(text.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-automatic-selector-bridge-fix.yml
          git add .github/workflows/c9-family-e-automatic-selector-bridge.yml
          git diff --cached --check
          git commit -m "ci(c9): fix automatic selector bridge ledger key"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1