name: C9 Family I Fleet Step Generic 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-fleet-step-generic-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-i-fleet-step-generic-71304
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard source owners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/app/contracts.ts)" = "e1ebad6d1083ddc8b634bf98449e4d774c07898b"
          test "$(git hash-object src/app/effectGrantActionRuntimeAdapter.ts)" = "48d5c664ee04aae74e3b403cb815886ff573b6f4"
          test "$(git hash-object src/app/monkOpenHandFleetStepRuntimeAdapter.ts)" = "25f0dba6cbf650476e22dabb458225f72414d58f"
          test "$(git hash-object tests/ui/monkOpenHandFleetStepRuntime.test.ts)" = "5c9fbf3366d5cd9ec0b8fc1f39dedb93e07fc7ad"
      - name: Route Fleet Step through structural granted movement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('src/app/contracts.ts',
              '  movementBudgetGainFeet?:number;\n  runtimeSaveCondition?:{',
              '  movementBudgetGainFeet?:number;\n  runtimeGrantedMovement?:{\n    distanceFeet:number;\n    maximumDistanceFeet:number;\n    doesNotProvokeOpportunityAttacks?:boolean;\n  };\n  runtimeSaveCondition?:{')

          replace_once('src/app/effectGrantActionRuntimeAdapter.ts',
              '  const grant=source?.runtimeEffectGrant;\n  if(!source||!grant)return previousResolveAction.call(this,actionId,targetIds);',
              '  const grant=source?.runtimeEffectGrant;\n  const movement=source?.runtimeGrantedMovement;\n  if(!source||(!grant&&!movement))return previousResolveAction.call(this,actionId,targetIds);')
          replace_once('src/app/effectGrantActionRuntimeAdapter.ts',
              '  if(!source.available||targetIds.length!==1||!targetId||grant.excludeActor&&targetId===source.actorId||!source.eligibleTargetIds.includes(targetId))return snapshot;',
              '  if(!source.available||targetIds.length!==1||!targetId||grant?.excludeActor&&targetId===source.actorId||!source.eligibleTargetIds.includes(targetId))return snapshot;')
          replace_once('src/app/effectGrantActionRuntimeAdapter.ts',
              '  const exclusiveTag=grant.exclusiveTag;',
              '  const exclusiveTag=grant?.exclusiveTag;')
          replace_once('src/app/effectGrantActionRuntimeAdapter.ts',
              '  if(source.resourceCost)operations.push({id:`${resolutionId}:resource`,kind:"spend-resource",actorId:source.actorId,resourceId:source.resourceCost.resourceId,amount:source.resourceCost.amount});\n  operations.push({id:`${resolutionId}:effect`,kind:"apply-effect",effect:{id:`effect.grant.${encodeURIComponent(source.id)}.${targetId}.${resolutionId}`,sourceId:source.id,sourceActorId:source.actorId,targetId,kind:"marker",tags:[...grant.tags],duration:structuredClone(grant.duration),termination:grant.termination?structuredClone(grant.termination):undefined,metadata:grant.metadata?structuredClone(grant.metadata):undefined}});\n  const committed=resolvePendingResolution',
              '  if(source.resourceCost)operations.push({id:`${resolutionId}:resource`,kind:"spend-resource",actorId:source.actorId,resourceId:source.resourceCost.resourceId,amount:source.resourceCost.amount});\n  if(movement)operations.push({id:`${resolutionId}:movement`,kind:"free-move",actorId:source.actorId,distanceFeet:movement.distanceFeet,maximumDistanceFeet:movement.maximumDistanceFeet,doesNotProvokeOpportunityAttacks:movement.doesNotProvokeOpportunityAttacks===true});\n  if(grant)operations.push({id:`${resolutionId}:effect`,kind:"apply-effect",effect:{id:`effect.grant.${encodeURIComponent(source.id)}.${targetId}.${resolutionId}`,sourceId:source.id,sourceActorId:source.actorId,targetId,kind:"marker",tags:[...grant.tags],duration:structuredClone(grant.duration),termination:grant.termination?structuredClone(grant.termination):undefined,metadata:grant.metadata?structuredClone(grant.metadata):undefined}});\n  const committed=resolvePendingResolution')
          replace_once('src/app/effectGrantActionRuntimeAdapter.ts',
              '  const label=typeof grant.metadata?.publicLabel==="string"?grant.metadata.publicLabel:source.name;\n  const sensed=awareness(internal,source);const outcome=sensed?.outcome??`${target.name}에게 ${label} 적용`;\n  const resolution:ResolutionView=',
              '  const label=grant&&typeof grant.metadata?.publicLabel==="string"?grant.metadata.publicLabel:source.name;\n  const sensed=awareness(internal,source);\n  const outcomeParts=[movement?`추가 이동 ${movement.distanceFeet}피트${movement.doesNotProvokeOpportunityAttacks?" · 기회 공격 없음":""}`:undefined,grant?`${target.name}에게 ${label} 적용`:undefined].filter((entry):entry is string=>Boolean(entry));\n  const outcome=sensed?.outcome??(outcomeParts.join(" · ")||source.name);\n  const resolution:ResolutionView=')

          p=Path('src/app/monkOpenHandFleetStepRuntimeAdapter.ts')
          text=p.read_text(encoding='utf-8')
          text=text.replace('import type { ActionVm, ActivityEntry, AppSnapshot, CharacterSheet, ResolutionView, SceneVm, SessionMode } from "./contracts";', 'import type { ActionVm, AppSnapshot, CharacterSheet, ResolutionView, SceneVm, SessionMode } from "./contracts";')
          for line in [
              'import { applyResolutionEvents } from "./realEventApplyService";\n',
              'import { projectResolutionEventsToActivity } from "./realActivityProjectionService";\n',
              'import { recordRuntimeResolutionEvents } from "./runtimeResolutionEventHistory";\n',
              'import { projectTurnRuntimeToScene } from "./realTurnRuntimeService";\n',
              'import { persistCharacterResolutionEvents } from "./resolutionCharacterWriteBackPort";\n',
              'import { SIMPLEVTT_APP_RULES_PROFILE } from "./realResolutionService";\n',
          ]:
              if line not in text: raise SystemExit(f'missing Fleet import: {line.strip()}')
              text=text.replace(line,'',1)
          text=text.replace('import { commitAdapterTurnRuntimeState, snapshotAdapterTurnRuntimeState, turnRuntimeSessions } from "./turnRuntimeSessionRegistry";', 'import { snapshotAdapterTurnRuntimeState } from "./turnRuntimeSessionRegistry";')
          text=text.replace('  OPEN_HAND_FLEET_STEP_FEATURE_ID,\n  STEP_OF_THE_WIND_SOURCE_ID,\n  resolveOpenHandFleetStep,', '  OPEN_HAND_FLEET_STEP_FEATURE_ID,\n  OPEN_HAND_FLEET_STEP_JUMP_TAG,\n  STEP_OF_THE_WIND_SOURCE_ID,')
          old_state='''interface AdapterState {\n  sessionMode:SessionMode;\n  scene:SceneVm;\n  activeCharacter:CharacterSheet;\n  resolution:ResolutionView|null;\n  activity:ActivityEntry[];\n  lastResolutionId:string|null;\n  lastBefore:unknown;\n  syncChar():void;\n  getSnapshot():Promise<AppSnapshot>;\n}\n'''
          new_state='''interface AdapterState {\n  sessionMode:SessionMode;\n  scene:SceneVm;\n  activeCharacter:CharacterSheet;\n  resolution:ResolutionView|null;\n  getSnapshot():Promise<AppSnapshot>;\n}\n'''
          if old_state not in text: raise SystemExit('Fleet AdapterState shape changed')
          text=text.replace(old_state,new_state,1)
          start=text.index('function seedFocus(')
          end=text.index('\nMockAdapter.prototype.getSnapshot=',start)
          text=text[:start]+text[end+1:]
          old_basic='{id:OPEN_HAND_FLEET_STEP_ACTION_ID,actorId:sheet.id,name:"날랜 발걸음 · 질주",category:"basic",target:"self",economy:"없음",resolutionKind:"no-roll",summary:`즉시 ${distance}피트 추가 이동`,available:true,eligibleTargetIds:self,details:[{label:"효과",value:`직전 추가 행동 후 최대 ${distance}피트 추가 이동`},{label:"비용",value:"없음"},{label:"출처",value:"SRD 5.2.1 · Monk · Warrior of the Open Hand · Fleet Step",source:OPEN_HAND_FLEET_STEP_FEATURE_ID}]},'
          new_basic='{id:OPEN_HAND_FLEET_STEP_ACTION_ID,actorId:sheet.id,name:"날랜 발걸음 · 질주",category:"basic",target:"self",economy:"없음",resolutionKind:"no-roll",summary:`즉시 ${distance}피트 추가 이동`,available:true,eligibleTargetIds:self,runtimeGrantedMovement:{distanceFeet:distance,maximumDistanceFeet:distance},details:[{label:"효과",value:`직전 추가 행동 후 최대 ${distance}피트 추가 이동`},{label:"비용",value:"없음"},{label:"출처",value:"SRD 5.2.1 · Monk · Warrior of the Open Hand · Fleet Step",source:OPEN_HAND_FLEET_STEP_FEATURE_ID}]},'
          if old_basic not in text: raise SystemExit('Fleet basic projection changed')
          text=text.replace(old_basic,new_basic,1)
          old_focus='{id:OPEN_HAND_FLEET_STEP_FOCUS_ACTION_ID,actorId:sheet.id,name:"날랜 발걸음 · 집중",category:"basic",target:"self",economy:"없음",resolutionKind:"no-roll",summary:`${distance}피트 추가 이동 · 기 ${focus?.current??0}/${focus?.max??0}`,available:Boolean(focus&&focus.current>0),disabledReason:focus&&focus.current>0?undefined:"기 점수가 없습니다.",eligibleTargetIds:self,resourceCost:focus?{resourceId:focus.id,amount:1}:undefined,details:[{label:"효과",value:`최대 ${distance}피트 추가 이동 · 기회 공격 유발 안 함 · 도약 거리 2배`},{label:"비용",value:"기 1"},{label:"출처",value:"SRD 5.2.1 · Monk · Warrior of the Open Hand · Fleet Step",source:OPEN_HAND_FLEET_STEP_FEATURE_ID}]},'
          new_focus='{id:OPEN_HAND_FLEET_STEP_FOCUS_ACTION_ID,actorId:sheet.id,name:"날랜 발걸음 · 집중",category:"basic",target:"self",economy:"없음",resolutionKind:"no-roll",summary:`${distance}피트 추가 이동 · 기 ${focus?.current??0}/${focus?.max??0}`,available:Boolean(focus&&focus.current>0),disabledReason:focus&&focus.current>0?undefined:"기 점수가 없습니다.",eligibleTargetIds:self,resourceCost:focus?{resourceId:focus.id,amount:1}:undefined,runtimeGrantedMovement:{distanceFeet:distance,maximumDistanceFeet:distance,doesNotProvokeOpportunityAttacks:true},runtimeEffectGrant:{tags:[OPEN_HAND_FLEET_STEP_JUMP_TAG],duration:{kind:"until-turn-boundary",actorId:sheet.id,round:snapshot.scene.round,boundary:"end"},metadata:{jumpDistanceMultiplier:2,publicLabel:"날랜 발걸음 · 도약 거리 2배"}},details:[{label:"효과",value:`최대 ${distance}피트 추가 이동 · 기회 공격 유발 안 함 · 도약 거리 2배`},{label:"비용",value:"기 1"},{label:"출처",value:"SRD 5.2.1 · Monk · Warrior of the Open Hand · Fleet Step",source:OPEN_HAND_FLEET_STEP_FEATURE_ID}]},'
          if old_focus not in text: raise SystemExit('Fleet focus projection changed')
          text=text.replace(old_focus,new_focus,1)
          start=text.index('MockAdapter.prototype.resolveAction=async function resolveOpenHandFleetStepAction')
          end=text.index('\nMockAdapter.prototype.advanceResolution=',start)
          replacement='''MockAdapter.prototype.resolveAction=async function trackOpenHandFleetStepTrigger(actionId:string,targetIds:string[]){\n  const internal=this as unknown as AdapterState;\n  const snapshot=await previousResolveAction.call(this,actionId,targetIds);\n  rememberTrigger(this,internal);\n  return snapshot;\n};\n'''
          text=text[:start]+replacement+text[end+1:]
          p.write_text(text,encoding='utf-8')

          p=Path('tests/ui/monkOpenHandFleetStepRuntime.test.ts')
          text=p.read_text(encoding='utf-8')
          addition='''\n\ntest("renaming the Fleet Step action identity preserves structural granted-movement execution",async()=>{\n  const adapter=await monk();let snapshot=await triggerWithWholeness(adapter);const actorId=snapshot.activeCharacter.id;const focusBefore=focus(snapshot);\n  const internal=adapter as unknown as {scene:SceneVm};const projected=action(snapshot,OPEN_HAND_FLEET_STEP_FOCUS_ACTION_ID);assert.ok(projected);\n  const externalId="external.unknown.family-i.fleet-step";const renamed=structuredClone(projected);renamed.id=externalId;\n  internal.scene.actionsByActor[actorId]=[...(internal.scene.actionsByActor[actorId]??[]).filter((entry)=>entry.id!==OPEN_HAND_FLEET_STEP_FOCUS_ACTION_ID),renamed];\n  await adapter.resolveAction(externalId,[actorId]);snapshot=await adapter.getSnapshot();\n  assert.equal(snapshot.resolution?.actionId,externalId);assert.equal(snapshot.resolution?.stage,"complete");assert.equal(focus(snapshot),focusBefore-1);assert.equal(hasJumpEffect(adapter,actorId),true);\n  await adapter.undoLastResolution();snapshot=await adapter.getSnapshot();assert.equal(focus(snapshot),focusBefore);assert.equal(hasJumpEffect(adapter,actorId),false);\n});\n'''
          if 'renaming the Fleet Step action identity preserves structural granted-movement execution' in text: raise SystemExit('Fleet rename test already exists')
          p.write_text(text.rstrip()+addition,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify generic Fleet Step convergence
        run: |
          node --import tsx --test tests/ui/monkOpenHandFleetStepRuntime.test.ts tests/ui/c9FamilyIMovementProduction.test.ts tests/ui/c9FamilyIMovementGrantProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Reconcile Family I authority after verified migration
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item['family']=='I')
          row['currentState']='Family I movement execution is complete through generic Common Play/Resolver and structural runtime facts. Unknown external RuleModules cover movement types, Difficult Terrain, drag/carry, alternate-speed grants, forced movement, teleport, Prone stand, connected replay/reconnect, Undo, and rename invariance. Open Hand Fleet Step now retains only feature-specific trigger/projection gating in its named adapter; its granted movement, Focus payment, no-opportunity-attack flag, and jump Effect execute through generic structural action facts without Action-ID dispatch.'
          row['disposition']='IMPLEMENTED'
          row['remainingNamedSeams']=[]
          for value in [
            'ActionVm.runtimeGrantedMovement is a structural granted-movement fact consumed by effectGrantActionRuntimeAdapter.ts through the shared Resolver free-move operation',
            'monkOpenHandFleetStepRuntimeAdapter.ts no longer resolves Fleet Step movement; it only projects/gates actions carrying runtimeGrantedMovement, resourceCost, and runtimeEffectGrant facts',
          ]:
            if value not in row['implementationEvidence']: row['implementationEvidence'].append(value)
          run_id=os.environ.get('GITHUB_RUN_ID','unknown')
          evidence=f'C9 Family I Fleet Step Generic 71304 run {run_id}: named Fleet Step movement execution migrated to structural generic Resolver facts; Fleet Step, external movement, legacy-boundary, and TypeScript verification passed'
          if evidence not in row['productionEvidence']: row['productionEvidence'].append(evidence)
          identity='monkOpenHandFleetStepRuntime.test.ts renames the focused Fleet Step Action ID and preserves granted movement, Focus payment, jump Effect, and event-native Undo through the structural generic execution path'
          if identity not in row['identityInvarianceEvidence']: row['identityInvarianceEvidence'].append(identity)
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          inventory=Path('docs/rules/legacy-execution-inventory.md')
          text=inventory.read_text(encoding='utf-8')
          note='Open Hand Fleet Step no longer owns movement/resource/effect execution in its named runtime adapter. Its feature-specific trigger and action projection remain named compatibility behavior, while projected actions carry structural `runtimeGrantedMovement`, `resourceCost`, and `runtimeEffectGrant` facts that the generic Resolver adapter commits; an arbitrary renamed action ID proves the movement execution is identity-independent.\n\n'
          anchor='## LEGACY_EXECUTION — progression / portable character materialization\n'
          if note not in text:
            if anchor not in text: raise SystemExit('legacy inventory insertion anchor missing')
            text=text.replace(anchor,note+anchor,1)
          inventory.write_text(text,encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Publish verified convergence and retire one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/c9-family-i-fleet-step-generic-71304.yml
          rm -f .github/workflows/c9-family-i-ledger-reconcile-71304.yml
          git add -A
          git commit -m "feat(c9): converge Family I named movement execution"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then git rebase --abort || true; exit 1; fi
            sleep 1
          done
          exit 1
