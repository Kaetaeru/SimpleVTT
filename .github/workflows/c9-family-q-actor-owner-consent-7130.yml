name: C9 Family Q Actor Owner Consent 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-actor-owner-consent-7130.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve actor-owner consent through operation lowering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/domain/commonPlayOperationRuntime.ts')
          text=path.read_text(encoding='utf-8')
          old='''export interface CommonPlayConsentInteraction {
            id:string;
            kind:"consent";
            responder:"actor";
            mode:"blocking";
            input:{type:"boolean"};
            revalidate:"always";
          }'''
          new='''export interface CommonPlayConsentInteraction {
            id:string;
            kind:"consent";
            responder:"actor"|"actor-owner";
            mode:"blocking";
            input:{type:"boolean"};
            revalidate:"always"|"if-revision-changed";
            stalePolicy?:"reject";
          }'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction interface anchor count={text.count(old)}')
              text=text.replace(old,new,1)
          text=text.replace('const INTERACTION_KEYS=new Set(["id","kind","responder","mode","input","revalidate"]);','const INTERACTION_KEYS=new Set(["id","kind","responder","mode","input","revalidate","stalePolicy"]);',1)
          old='''function parseConsentInteraction(value:unknown,label:string):CommonPlayConsentInteraction {
            const interaction=object(value,label);
            supportedKeys(interaction,INTERACTION_KEYS,label);
            if(interaction.kind!=="consent") throw new DomainEvaluationError(`${label}.kind must be consent for portable Common Play interaction`);
            if(interaction.responder!=="actor") throw new DomainEvaluationError(`${label}.responder must be actor for portable Common Play interaction`);
            if(interaction.mode!=="blocking") throw new DomainEvaluationError(`${label}.mode must be blocking for portable Common Play interaction`);
            const input=object(interaction.input,`${label}.input`);
            supportedKeys(input,INTERACTION_INPUT_KEYS,`${label}.input`);
            if(input.type!=="boolean") throw new DomainEvaluationError(`${label}.input.type must be boolean for portable Common Play interaction`);
            if(interaction.revalidate!=="always") throw new DomainEvaluationError(`${label}.revalidate must be always for portable Common Play interaction`);
            return {
              id:nonEmptyString(interaction.id,`${label}.id`),
              kind:"consent",
              responder:"actor",
              mode:"blocking",
              input:{type:"boolean"},
              revalidate:"always",
            };
          }'''
          new='''function parseConsentInteraction(value:unknown,label:string):CommonPlayConsentInteraction {
            const interaction=object(value,label);
            supportedKeys(interaction,INTERACTION_KEYS,label);
            if(interaction.kind!=="consent") throw new DomainEvaluationError(`${label}.kind must be consent for portable Common Play interaction`);
            if(interaction.responder!=="actor"&&interaction.responder!=="actor-owner") throw new DomainEvaluationError(`${label}.responder must be actor or actor-owner for portable Common Play interaction`);
            if(interaction.mode!=="blocking") throw new DomainEvaluationError(`${label}.mode must be blocking for portable Common Play interaction`);
            const input=object(interaction.input,`${label}.input`);
            supportedKeys(input,INTERACTION_INPUT_KEYS,`${label}.input`);
            if(input.type!=="boolean") throw new DomainEvaluationError(`${label}.input.type must be boolean for portable Common Play interaction`);
            if(interaction.revalidate!=="always"&&interaction.revalidate!=="if-revision-changed") throw new DomainEvaluationError(`${label}.revalidate must be always or if-revision-changed for portable Common Play interaction`);
            if(interaction.stalePolicy!==undefined&&interaction.stalePolicy!=="reject") throw new DomainEvaluationError(`${label}.stalePolicy must be reject for portable Common Play interaction`);
            return {
              id:nonEmptyString(interaction.id,`${label}.id`),
              kind:"consent",
              responder:interaction.responder,
              mode:"blocking",
              input:{type:"boolean"},
              revalidate:interaction.revalidate,
              ...(interaction.stalePolicy?{stalePolicy:"reject" as const}:{}),
            };
          }'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit(f'interaction parser anchor count={text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Add focused actor-owner interaction regressions
        shell: bash
        run: |
          cat > tests/domain/commonPlayActorOwnerInteractionRuntime.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { parseManualCommonPlayOperationDefinition, resolveCommonPlayEntryPointOperations } from "../../src/domain/commonPlayOperationRuntime";
          import { runtimeState, TEST_PROFILE } from "./rulesTestState";

          test("portable actor-owner consent preserves revision-aware stale rejection and commits atomically",()=>{
            const definition=parseManualCommonPlayOperationDefinition({
              schemaVersion:"0.2-draft",id:"external.actor-owner-consent",
              payments:[{kind:"economy",bucket:"reaction",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],
              entryPoints:[{
                id:"react",invocation:"manual",
                interaction:{id:"owner-consent",kind:"consent",responder:"actor-owner",mode:"blocking",input:{type:"boolean"},revalidate:"if-revision-changed",stalePolicy:"reject"},
                operations:[{kind:"healing.apply",amount:{value:5},target:"self"}],
              }],
            });
            assert.deepEqual(definition.entryPoints[0].interaction,{
              id:"owner-consent",kind:"consent",responder:"actor-owner",mode:"blocking",input:{type:"boolean"},revalidate:"if-revision-changed",stalePolicy:"reject",
            });
            const state=runtimeState();
            state.combatants.hero.life.hp.current=10;
            const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition,{
              resolutionId:"owner-consent-resolution",actorId:"hero",entryPointId:"react",targetId:"hero",
              interactionResponse:{interactionId:"owner-consent",accepted:true},
            });
            assert.equal(committed.status,"committed");
            if(committed.status!=="committed") return;
            assert.equal(committed.state.combatants.hero.life.hp.current,15);
            assert.equal(committed.state.combatants.hero.economy.reaction,false);
            assert.deepEqual(committed.events.map((event)=>event.kind),["use-economy","healing"]);
          });
          EOF
          cat > tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/connectedSessionRuntimeAdapter";
          import "../../src/app/connectedActionRoutingAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { connectedManifest } from "../../src/app/connectedSessionRuntimeAdapter";
          import { connectedStateFor } from "../../src/app/connectedSessionState";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { HostSessionLedger } from "../../src/app/connectedSessionProtocol";
          import { tauriSessionTransport } from "../../src/app/tauriSessionTransport";

          const MODULE_ID="homebrew.actor-owner-consent";
          const CONTENT_ID="option.actor-owner-consent";
          const MECHANIC_ID="external.actor-owner-consent";
          const ENTRY_POINT_ID="react";

          function payload(){return JSON.stringify({
            schemaVersion:"0.1-draft",moduleId:MODULE_ID,moduleVersion:"1",
            rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
            source:{document:"Actor Owner Consent Probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],
            content:[{id:CONTENT_ID,category:"option",presentation:{defaultLocale:"en",originalName:"Actor Owner Consent",locales:{en:{name:"Actor Owner Consent",description:"Portable remote owner consent probe"}}},mechanics:[{kind:"common-play",config:{
              schemaVersion:"0.2-draft",id:MECHANIC_ID,
              payments:[{kind:"economy",bucket:"reaction",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],
              entryPoints:[{id:ENTRY_POINT_ID,invocation:"manual",interaction:{id:"owner-consent",kind:"consent",responder:"actor-owner",mode:"blocking",input:{type:"boolean"},revalidate:"if-revision-changed",stalePolicy:"reject"},operations:[{kind:"healing.apply",amount:{value:5},target:"self"}]}],
            }}]}],
          });}

          async function install(adapter:MockAdapter){
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(payload());
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            return installedCommonPlayActionId({catalogId:catalogQualifiedId(CONTENT_ID,MODULE_ID,"1"),mechanicId:MECHANIC_ID,entryPointId:ENTRY_POINT_ID});
          }

          test("actor-owner consent routes the blocking prompt to the owning connected Character and commits through the existing event path",async()=>{
            const sessionId="session.actor-owner-consent";
            const host=new MockAdapter();
            const actionId=await install(host);
            const internal=host as unknown as {activeCharacter:{id:string;hp:number;maxHp:number};scene:{entities:Array<{id:string;hp:number}>}};
            internal.activeCharacter.hp=Math.max(0,internal.activeCharacter.maxHp-10);
            internal.scene.entities.find((entity)=>entity.id===internal.activeCharacter.id)!.hp=internal.activeCharacter.hp;
            await host.startInitiative();
            await host.setCurrentActor(internal.activeCharacter.id);
            const before=await host.getSnapshot();
            const hostState=connectedStateFor(host);
            hostState.mode="host";hostState.sessionId=sessionId;hostState.ledger=new HostSessionLedger(sessionId,connectedManifest(host));
            hostState.peerManifests.set("peer.owner",connectedManifest(host));
            const direct:Array<{peer:string;message:string}>=[];
            const broadcasts:string[]=[];
            const oldSend=tauriSessionTransport.send;
            const oldSendTo=tauriSessionTransport.sendTo;
            tauriSessionTransport.send=async(message)=>{broadcasts.push(message);return 1;};
            tauriSessionTransport.sendTo=async(peer,message)=>{direct.push({peer,message});return 1;};
            try{
              await host.resolveAction(actionId,[internal.activeCharacter.id]);
              let snapshot=await host.getSnapshot();
              assert.equal(snapshot.resolution?.stage,"interrupt",JSON.stringify(snapshot.resolution));
              assert.equal(snapshot.resolution?.interrupt?.responderId,internal.activeCharacter.id);
              const prompt=direct.map((entry)=>({peer:entry.peer,wire:JSON.parse(entry.message)})).find((entry)=>entry.wire.type==="resolution-interrupt-prompt");
              assert.equal(prompt?.peer,"peer.owner",JSON.stringify(direct));
              assert.equal(prompt?.wire.interrupt.responderId,internal.activeCharacter.id);
              assert.equal(snapshot.activeCharacter.hp,before.activeCharacter.hp);
              assert.equal(snapshot.scene.economyByActor[internal.activeCharacter.id]?.reaction,true);
              await host.respondToInterrupt(true);
              snapshot=await host.getSnapshot();
              assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
              assert.equal(snapshot.activeCharacter.hp,before.activeCharacter.hp+5);
              assert.equal(snapshot.scene.economyByActor[internal.activeCharacter.id]?.reaction,false);
              assert.ok(broadcasts.map((wire)=>JSON.parse(wire)).some((wire)=>wire.type==="event-batch"),JSON.stringify(broadcasts));
            } finally {
              tauriSessionTransport.send=oldSend;
              tauriSessionTransport.sendTo=oldSendTo;
            }
          });
          EOF
      - name: Verify Family Q actor-owner consent
        run: node --import tsx --test tests/domain/commonPlayActorOwnerInteractionRuntime.test.ts tests/domain/commonPlayInteractionProductionRuntime.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Verify coverage and legacy boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Commit verified Family Q slice and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-q-actor-owner-consent-7130.yml
          git add src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayActorOwnerInteractionRuntime.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts
          git commit -m "feat(c9): route actor-owner consent interactions"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep 2
          done
          test "$pushed" -eq 1
