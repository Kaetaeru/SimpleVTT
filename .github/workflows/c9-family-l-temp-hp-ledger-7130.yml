name: C9 Family L Temporary HP Ledger 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-temp-hp-ledger-7130.yml

permissions:
  contents: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify landed Temporary HP slice
        run: npx tsx --test tests/ui/c9FamilyLTemporaryHpProduction.test.ts
      - name: Record Family L evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          row=next((r for r in data['rows'] if r.get('family')=='L' and r.get('id')=='damage-life'),None)
          if row is None:
              raise SystemExit('Family L damage-life row missing')
          evidence={
            'implementationEvidence':'commonPlayOperationRuntime.ts parses temp-hp.grant from the Common Play contract and lowers it directly to the shared Resolver temporary-hp operation, including explicit Temporary HP choice semantics',
            'productionEvidence':'c9FamilyLTemporaryHpProduction.test.ts executes an unknown installed temp-hp.grant through production Common Play, Resolver Temporary HP state change, and one-step Undo',
            'identityInvarianceEvidence':'c9FamilyLTemporaryHpProduction.test.ts preserves Temporary HP behavior across unrelated external module/content/mechanic identities',
            'connectedEvidenceIfRelevant':'c9FamilyLTemporaryHpProduction.test.ts replays portable Temporary HP grant and Undo through Host-authoritative connected resolution events',
            'persistenceEvidenceIfRelevant':'c9FamilyLTemporaryHpProduction.test.ts reconstructs the post-Undo Temporary HP state on a fresh connected replica from the Host event ledger',
          }
          for key,value in evidence.items():
              if value not in row[key]:
                  row[key].append(value)
          row['currentState']='Bounded typed damage/healing plus portable Temporary HP are production-proven; complete life/object semantics remain incomplete'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify coverage, legacy boundary, and types
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-l-temp-hp-ledger-7130.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): record portable Temporary HP evidence"
          for attempt in $(seq 1 12); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
