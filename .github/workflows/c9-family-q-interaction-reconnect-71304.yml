name: C9 Family Q Interaction Reconnect 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - tests/ui/c9FamilyQInteractionReconnectProduction.test.ts
      - src/app/connectedActionRoutingAdapter.ts
      - src/app/connectedSessionRuntimeAdapter.ts
      - src/app/installedCommonPlayRuntimeAdapter.ts
      - src/domain/commonPlayOperationRuntime.ts
      - docs/rules/v1-mechanism-coverage-ledger.json
      - scripts/check-v1-mechanism-coverage.mjs
      - .github/workflows/c9-family-q-interaction-reconnect-71304.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family Q reconnect persistence
        run: npx tsx --test tests/ui/c9FamilyQInteractionReconnectProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Verify C9 coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
