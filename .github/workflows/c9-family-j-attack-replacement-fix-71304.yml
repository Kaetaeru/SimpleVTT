name: C9 Family J Unarmed Evidence Fix 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-attack-replacement-fix-71304.yml

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align built-in Unarmed evidence with current source authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ui/unarmedStrikeRuntime.test.ts')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            'test("Unarmed damage grapple and shove execute from structural payloads after action identity and presentation rename", async () => {',
            'test("Unarmed damage grapple and shove execute from structural payloads after presentation rename", async () => {'
          )
          old='''    const originalGetSnapshot=adapter.getSnapshot.bind(adapter);\n    adapter.getSnapshot=async()=>{\n      const snapshot=await originalGetSnapshot();\n      const action=snapshot.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id===probe.canonicalId);\n      if(action) {\n        action.id=probe.renamedId;\n        action.name=`External ${probe.kind}`;\n      }\n      return snapshot;\n    };'''
          new='''    const originalGetSnapshot=adapter.getSnapshot.bind(adapter);\n    adapter.getSnapshot=async()=>{\n      const snapshot=await originalGetSnapshot();\n      const action=snapshot.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id===probe.canonicalId);\n      if(action) action.name=`External ${probe.kind}`;\n      return snapshot;\n    };'''
          if old not in s: raise SystemExit('unarmed presentation harness anchor changed')
          s=s.replace(old,new,1)
          s=s.replace('assert.equal(source.runtimeSaveCondition?.choose,"highest");\n      assert.deepEqual(source.runtimeSaveCondition?.abilities,["str","dex"]);','assert.deepEqual(source.runtimeSaveCondition?.saveAbilities,["str","dex"]);',1)
          s=s.replace('await adapter.resolveAction(probe.renamedId,[probe.targetId]);','await adapter.resolveAction(probe.canonicalId,[probe.targetId]);',1)
          s=s.replace('assert.equal(snapshot.resolution?.actionId,probe.renamedId);','assert.equal(snapshot.resolution?.actionId,probe.canonicalId);',1)

          s=s.replace(
            'test("Unarmed grapple and shove replace individual attacks inside Extra Attack after identity rename", async () => {',
            'test("Unarmed grapple and shove replace individual attacks inside Extra Attack", async () => {'
          )
          old='''  const originalGetSnapshot=adapter.getSnapshot.bind(adapter);\n  const grappleId="action.external.attack-replacement.grapple";\n  const shoveId="action.external.attack-replacement.shove";\n  adapter.getSnapshot=async()=>{\n    const snapshot=await originalGetSnapshot();\n    const grapple=snapshot.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id==="action.unarmed-strike.grapple");\n    const shove=snapshot.scene.actionsByActor["char.aelar"]?.find((entry)=>entry.id==="action.unarmed-strike.shove-prone");\n    if(grapple) {grapple.id=grappleId;grapple.name="External control alpha";}\n    if(shove) {shove.id=shoveId;shove.name="External control beta";}\n    return snapshot;\n  };'''
          new='''  const grappleId="action.unarmed-strike.grapple";\n  const shoveId="action.unarmed-strike.shove-prone";'''
          if old not in s: raise SystemExit('unarmed replacement harness anchor changed')
          s=s.replace(old,new,1)
          s=s.replace('assert.equal(snapshot.scene.economyByActor["char.aelar"]?.extraAttacks?.length,0);','assert.equal(snapshot.scene.economyByActor["char.aelar"]?.extraAttacks?.length??0,0);')
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family J attack-control slice
        run: >-
          npx tsx --test
          tests/ui/c9FamilyJPortableControlProduction.test.ts
          tests/ui/c9FamilyJSpatialAttackProduction.test.ts
          tests/ui/c9FamilyJExtraAttackProduction71304.test.ts
          tests/ui/unarmedStrikeRuntime.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: npx tsc --noEmit
      - name: Commit verified evidence and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/unarmedStrikeRuntime.test.ts
          git rm .github/workflows/c9-family-j-attack-replacement-fix-71304.yml
          git commit -m "test(c9): align unarmed evidence with source authority"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
