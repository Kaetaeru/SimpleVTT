name: Named execution boundary

on:
  pull_request:
    paths:
      - "src/app/**"
      - "scripts/check-named-execution-boundary.mjs"
      - "tests/ui/namedExecutionBoundary.test.mjs"
      - ".agents/NAMED_EXECUTION_BASELINE.json"
      - ".github/workflows/named-execution-boundary.yml"
  push:
    branches:
      - "agent/**"
      - "work/v1-composite"
    paths:
      - "src/app/**"
      - "scripts/check-named-execution-boundary.mjs"
      - "tests/ui/namedExecutionBoundary.test.mjs"
      - ".agents/NAMED_EXECUTION_BASELINE.json"
      - ".github/workflows/named-execution-boundary.yml"

permissions:
  contents: read

jobs:
  named-execution-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify named execution debt does not grow
        run: node --test tests/ui/namedExecutionBoundary.test.mjs
