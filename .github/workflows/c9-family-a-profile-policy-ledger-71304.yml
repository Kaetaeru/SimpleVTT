name: C9 Family A Profile Policy Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-profile-policy-ledger-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-a-profile-policy-ledger-71304
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile verified Family A profile-policy evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          doc=json.loads(path.read_text())
          row=next(entry for entry in doc['rows'] if entry['family']=='A')

          old='and profile-policy stacking remains explicitly unsupported until RulesProfile defines that policy. '
          if old in row['currentState']:
              row['currentState']=row['currentState'].replace(old,'and RulesProfile now owns the structural profile-policy stacking decision. ')
          elif 'RulesProfile now owns the structural profile-policy stacking decision' not in row['currentState']:
              raise SystemExit('Family A currentState profile-policy anchor missing')

          old_impl='resolutionEffectOps.ts generic stack/replace/unique-by-source property modifier instance policy; profile-policy explicit rejection without RulesProfile policy'
          if old_impl in row['implementationEvidence']:
              row['implementationEvidence'].remove(old_impl)
          additions=[
              'profileEngine.ts RulesProfileLike propertyModifierPolicy.defaultInstancePolicy plus rules-profile.schema.json portable stack/replace/unique-by-source policy vocabulary',
              'resolutionEffectOps.ts resolves property.modify instancePolicy profile-policy from ResolutionExecutionContext.profile without content identity dispatch',
              'dnd.srd-5.2.1.profile.json declares unique-by-source as the D&D profile property-modifier stacking policy',
              'propertyModifierProfilePolicyRuntime.test.ts proves profile-policy replacement by structural source while distinct sources continue to coexist',
          ]
          for entry in additions:
              if entry not in row['implementationEvidence']:
                  row['implementationEvidence'].append(entry)

          production=[
              '759fcf04d6a449b646b4f6645688aa8ecccb6dd7 feat(c9): resolve property modifier profile policy',
              'C9 Family A Profile Policy 71304 run 33311552359: profile-policy runtime, existing property instance-policy/production regressions, tsc --noEmit, and V1 coverage checker pass',
          ]
          for entry in production:
              if entry not in row['productionEvidence']:
                  row['productionEvidence'].append(entry)

          row['remainingNamedSeams']=[entry for entry in row['remainingNamedSeams'] if 'profile-policy' not in entry]
          if any('profile-policy' in entry for entry in row['remainingNamedSeams']):
              raise SystemExit('Family A profile-policy blocker remains')
          if row['disposition']!='INCOMPLETE':
              raise SystemExit('Family A should remain INCOMPLETE until generic property owner seams close')

          path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify coverage source of truth
        run: npm run test:v1-coverage
      - name: Commit verified ledger reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-a-profile-policy-ledger-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): reconcile Family A profile policy"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1