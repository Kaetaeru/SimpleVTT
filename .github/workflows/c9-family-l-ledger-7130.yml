name: C9 Family L Ledger 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-ledger-7130.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile verified Family L evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next((entry for entry in data['rows'] if entry.get('family')=='L'),None)
          if row is None:
              raise SystemExit('Family L row is missing')
          if row.get('disposition')!='INCOMPLETE':
              raise SystemExit(f"Family L disposition changed unexpectedly: {row.get('disposition')}")

          row['currentState']=(
              'Bounded damage/healing is PRODUCTION. Unknown installed temp-hp.grant now lowers structurally '
              'through the existing Resolver Temporary HP operation, preserves the domain keep-existing/take-new '
              'non-stacking choice, and has external identity rename, Host/Client replay, event-native Undo, and '
              'reconnect evidence. Family L remains incomplete for the remaining full damage/life/object semantic matrix.'
          )

          additions={
              'implementationEvidence':[
                  'commonPlayOperationRuntime.ts generic temp-hp.grant parsing/lowering preserves the existing TemporaryHpChoice contract into the Resolver temporary-hp operation',
                  'temporaryHp.ts and resolutionHealthOps.ts remain the single Temporary HP non-stacking/choice and HpStateChange execution authority',
              ],
              'productionEvidence':[
                  '4752de7dffc560684cb9d5ad04b3475e64de8673 feat(c9): lower portable Temporary HP',
                  'c9FamilyLTemporaryHpProduction.test.ts unknown installed temp-hp.grant production execution and Undo',
                  'C9 Family L Portable Temporary HP 7130 run 33311003691: focused production test, coverage checker, legacy execution boundary, and tsc --noEmit passed',
              ],
              'identityInvarianceEvidence':[
                  'c9FamilyLTemporaryHpProduction.test.ts renamed external module/content/mechanic preserves Temporary HP semantics',
              ],
              'connectedEvidenceIfRelevant':[
                  'c9FamilyLTemporaryHpProduction.test.ts Host/Client authoritative replay, event-native Undo, and fresh reconnect converge Temporary HP',
              ],
          }
          for key,values in additions.items():
              current=row.setdefault(key,[])
              for value in values:
                  if value not in current:
                      current.append(value)

          row['remainingNamedSeams']=[
              'complete generic threshold/reduction/critical-dice and max-HP acceptance remains incomplete',
              'complete 0 HP, unconscious/death, death-save, stabilization, instant-death production acceptance remains incomplete',
              'Object/Vehicle damage production acceptance remains incomplete',
              'named feature/spell HP execution remains migration debt where it bypasses portable Common Play',
          ]

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify ledger and execution boundary
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Commit verified Family L ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-l-ledger-7130.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): record portable Temporary HP evidence"
          for attempt in $(seq 1 12); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
