name: C9 Family Q Target Responder Reconcile 71304

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-q-target-responder-reconcile-71304.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/c9-gate-n-coverage-reconciliation"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin "$GITHUB_REF_NAME"
      - name: Reconcile target responder evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger=json.loads(path.read_text(encoding="utf-8"))
          q=next(row for row in ledger["rows"] if row["family"]=="Q")
          q["currentState"]=q["currentState"].replace(
              "Rich choice/multiple-option and the remaining target/DM/Host responder and reconnect/stale-replay matrix remain incomplete.",
              "Rich choice/multiple-option and the remaining DM/Host responder and reconnect/stale-replay matrix remain incomplete.",
          )
          q["implementationEvidence"]=[
              item.replace(
                  "installedCommonPlayRuntimeAdapter.ts derives target-owner consent responderId from the single authoritative selected target; connectedActionRoutingAdapter routes and authorizes the interrupt by responder Character id",
                  "installedCommonPlayRuntimeAdapter.ts derives target and target-owner consent responderId from the single authoritative selected target; connectedActionRoutingAdapter routes and authorizes the interrupt by responder Character id",
              )
              for item in q["implementationEvidence"]
          ]
          q["productionEvidence"]=[
              item.replace(
                  "c9FamilyQTargetOwnerInteractionProduction.test.ts unknown installed target-owner consent routes only to the selected target owner peer, rejects the actor peer, and commits downstream damage plus Reaction payment atomically after approval",
                  "c9FamilyQTargetOwnerInteractionProduction.test.ts unknown installed target-owner and target consent each route only to the selected target peer, reject the actor peer, and commit downstream damage plus Reaction payment atomically after approval",
              )
              for item in q["productionEvidence"]
          ]
          q["identityInvarianceEvidence"]=[
              item.replace(
                  "c9FamilyQTargetOwnerInteractionProduction.test.ts uses arbitrary previously-unknown module/content/mechanic/entry identities; responder routing depends on selected target ownership rather than content identity",
                  "c9FamilyQTargetOwnerInteractionProduction.test.ts uses arbitrary previously-unknown module/content/mechanic/entry identities for target-owner and target responders; routing depends on the selected target rather than content identity",
              )
              for item in q["identityInvarianceEvidence"]
          ]
          q["connectedEvidenceIfRelevant"]=[
              item.replace(
                  "c9FamilyQTargetOwnerInteractionProduction.test.ts sends the blocking prompt to the selected target owner peer, rejects a different peer as interrupt-not-authorized, and broadcasts the accepted authoritative event batch",
                  "c9FamilyQTargetOwnerInteractionProduction.test.ts sends target-owner and target blocking prompts to the selected target peer, rejects a different peer as interrupt-not-authorized, and broadcasts the accepted authoritative event batch",
              )
              for item in q["connectedEvidenceIfRelevant"]
          ]
          q["remainingNamedSeams"]=[
              "DM and Host responder routing is not yet represented" if item=="target, DM, and Host responder routing is not yet represented" else item
              for item in q["remainingNamedSeams"]
          ]
          path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content
        run: npm run generate:content
      - name: Verify target responder production
        run: npx tsx --test tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify mechanism ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish reconciliation and retire verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-q-target-responder-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-q-target-responder-reconcile-71304.yml
          git commit -m "docs(c9): reconcile Family Q target responder evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
