name: C9 Family P State Applied Verify 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-state-applied-verify-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Verify state-applied production and semantic runtime
        run: npx tsx --test tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts tests/domain/commonPlaySemanticEventRuntime.test.ts
      - name: Verify V1 coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Remove verifier after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git rm .github/workflows/c9-family-p-state-applied-verify-71304.yml
          git commit -m "chore(c9): remove state-applied verifier"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
