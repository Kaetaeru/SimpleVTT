name: C9 Family L Critical Dice Fixture Correction 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-critical-dice-rerun-71304.yml

permissions:
  contents: write

jobs:
  correct-and-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Correct critical dice test fixture and rerun verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-l-critical-dice-71304.yml')
          text=path.read_text(encoding='utf-8')
          old='const TARGET_ID="combatant.training-guardian";'
          new='const TARGET_ID="combatant.goblin-b";'
          if old not in text and new not in text:
              raise SystemExit('critical fixture anchor changed')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-family-l-critical-dice-71304.yml
          git rm .github/workflows/c9-family-l-critical-dice-rerun-71304.yml
          git commit -m "test(c9): correct portable critical dice fixture"
          for attempt in $(seq 1 10); do
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 1
          done
          exit 1
