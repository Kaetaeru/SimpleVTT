name: C9 Family P Finalize 71304 V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-finalize-71304-v2.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Family P portable trigger authority
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts
          if grep -R --line-number --fixed-strings 'runtimeD20FollowUps' src/app src/domain; then
            echo 'legacy runtimeD20FollowUps producer/engine still exists' >&2
            exit 1
          fi
          node --import tsx --test \
            tests/domain/commonPlaySemanticEventRuntime.test.ts \
            tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts \
            tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts \
            tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts \
            tests/ui/connectedDamageDealtTriggerProduction.test.ts \
            tests/ui/connectedActorTurnRuleProduction.test.ts \
            tests/ui/connectedTurnResolutionEventTransport.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish Family P authority reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch=agent/c9-gate-n-coverage-reconciliation

          apply_docs() {
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledgerPath='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const family=ledger.rows.find((row)=>row.family==='P');
          if(!family) throw new Error('Family P ledger row missing');
          family.currentState='Portable Common Play owns automatic damage, attack/save outcome, state-applied, effect-expired, rest, recharge, actor-turn, and Zone lifecycle trigger semantics with canonical once/turn/round/resolution frequency. Post-roll decision/recalculation is owned by the accepted Family C Common Play interceptor path; the removed named d20 follow-up engine is not a fallback for supported portable content.';
          family.disposition='IMPLEMENTED';
          const add=(field,value)=>{ if(!family[field].includes(value)) family[field].push(value); };
          add('implementationEvidence','Family C accepted Common Play d20 interceptor authority plus commonPlaySemanticEventRuntime.ts, commonPlayEffectRuntime.ts, commonPlayFrequencyRuntime.ts, actor-turn rules, and Zone lifecycle provide the required generic trigger/timing/frequency composition without a second named d20 engine');
          add('productionEvidence',`C9 Family P Finalize 71304 V2 run ${process.env.GITHUB_RUN_ID}: semantic-event, state.applied, attack/save outcome, interceptor, damage trigger, actor-turn, Zone turn, legacy-boundary, and typecheck verification passed before publication`);
          add('identityInvarianceEvidence','Family C unknown/renamed interceptor acceptance and Family P unknown/renamed semantic-event regressions prove trigger selection is structural rather than content-identity based');
          family.remainingNamedSeams=[];
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const inventoryPath='docs/rules/legacy-execution-inventory.md';
          let inventory=fs.readFileSync(inventoryPath,'utf8');
          inventory=inventory.split('\n').filter((line)=>!line.includes('bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts')).join('\n');
          inventory=inventory.replace(
            'Cutting Words remains the named post-roll seam.',
            'Cutting Words and the legacy runtimeD20FollowUps side engine have been removed; supported post-roll execution is owned by portable Common Play.'
          );
          fs.writeFileSync(inventoryPath,inventory.endsWith('\n')?inventory:inventory+'\n');
          NODE
          }

          verify_latest() {
            test ! -e src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts
            if grep -R --line-number --fixed-strings 'runtimeD20FollowUps' src/app src/domain; then return 1; fi
            node --import tsx --test \
              tests/domain/commonPlaySemanticEventRuntime.test.ts \
              tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts \
              tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts \
              tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts \
              tests/ui/connectedDamageDealtTriggerProduction.test.ts \
              tests/ui/connectedActorTurnRuleProduction.test.ts \
              tests/ui/connectedTurnResolutionEventTransport.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
          }

          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            apply_docs
            verify_latest
            git add docs/rules/v1-mechanism-coverage-ledger.json docs/rules/legacy-execution-inventory.md
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'Family P authority already reconciled by another writer'
              exit 0
            fi
            git commit -m 'docs(c9): finalize Family P trigger coverage'
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Family P publish raced; retry ${attempt}/6"
          done
          exit 1