name: C9 Family E Automatic Target-Free 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-automatic-targetfree-7130.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Strengthen automatic selector production proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/commonPlayRichSelectorProduction.test.ts')
          text=path.read_text()
          marker='test("unknown installed automatic selector uses host authority and authored ordering without manual target identity",async()=>{'
          if marker not in text:
              raise SystemExit('automatic selector test marker missing')
          before, block=text.split(marker,1)
          old='''    await adapter.resolveAction(actionId,["char.aelar"]);\n    const snapshot=await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.stage,"complete");'''
          new='''    await adapter.resolveAction(actionId,[]);\n    const snapshot=await adapter.getSnapshot();\n    assert.equal(snapshot.resolution?.actionId,actionId,"automatic selector must produce a fresh action resolution without a manual target identity");\n    assert.equal(snapshot.resolution?.stage,"complete");'''
          if new not in block:
              if old not in block:
                  raise SystemExit('automatic selector assertion block missing')
              block=block.replace(old,new,1)
          path.write_text(before+marker+block)
          PY
      - name: Repair semantic lifecycle state-change narrowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('src/domain/commonPlaySemanticEventRuntime.ts')
          text=path.read_text()
          import_line='import type { EffectStateChange } from "./runtimeStateChange";\n'
          anchor='import type { CommonPlayAutomaticEffectEvent, CommonPlayPersistentEffectDefinition } from "./commonPlayEffectRuntime";\n'
          if import_line not in text:
              if anchor not in text: raise SystemExit('semantic event import anchor missing')
              text=text.replace(anchor,anchor+import_line,1)
          replacements={
            'const applied=authoritativeEvent.stateChanges.filter((change)=>change.kind==="effect"&&change.operation==="added");':
            'const applied=authoritativeEvent.stateChanges.filter((change):change is EffectStateChange=>change.kind==="effect"&&change.operation==="added");',
            'const expired=authoritativeEvent.stateChanges.filter((change)=>change.kind==="effect"&&change.operation==="removed");':
            'const expired=authoritativeEvent.stateChanges.filter((change):change is EffectStateChange=>change.kind==="effect"&&change.operation==="removed");',
          }
          for old,new in replacements.items():
              if new not in text:
                  if old not in text: raise SystemExit(f'semantic narrowing target missing: {old}')
                  text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify automatic selector production and Gate N boundaries
        run: |
          node --import tsx --test tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-automatic-targetfree-7130.yml
          git add src/domain/commonPlaySemanticEventRuntime.ts tests/ui/commonPlayRichSelectorProduction.test.ts
          git diff --cached --check
          git commit -m "fix(c9): restore semantic narrowing and automatic selector proof"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 12); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1
