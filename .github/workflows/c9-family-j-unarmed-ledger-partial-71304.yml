name: C9 Family J Unarmed Ledger Partial 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-unarmed-ledger-partial-71304.yml]

permissions:
  contents: write

jobs:
  verify-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify complete Unarmed source composition
        shell: bash
        run: |
          npm run generate:content
          npx tsx --test \
            tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts \
            tests/ui/unarmedStrikeRuntime.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/ui/c9FamilyJExtraAttackProduction71304.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Reconcile only proven Unarmed seams
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(p.read_text())
          row=next((row for row in ledger['rows'] if row.get('family')=='J'),None)
          if row is None or row.get('disposition')!='INCOMPLETE':
              raise SystemExit(f'Family J authority changed: {None if row is None else row.get("disposition")}')
          closed={
            'generic weapon action projection is structurally source-owned and presentation-rename invariant; complete Unarmed Strike source composition remains incomplete',
            'portable target saving throws, best-of STR/DEX control choice, conditional control effects, and escape now normalize through Common Play; complete grapple/shove source composition remains incomplete',
          }
          seams=row.get('remainingNamedSeams',[])
          missing=closed-set(seams)
          if missing:
              raise SystemExit(f'Expected Unarmed seams changed: {sorted(missing)}')
          row['remainingNamedSeams']=[seam for seam in seams if seam not in closed]
          old='Family J remains incomplete for complete Unarmed Strike source composition.'
          new='Complete Unarmed Strike source composition is production-proven through unknown installed Common Play for damage, Grapple, Shove-to-Prone, Shove-to-Push, structural attack economy, event-native Undo, and unrelated external identities.'
          state=row.get('currentState','')
          if old in state:
              state=state.replace(old,new,1)
          elif new not in state:
              state=state.rstrip()+' '+new
          row['currentState']=state
          def add(key,value):
              values=row.setdefault(key,[])
              if value not in values: values.append(value)
          add('implementationEvidence','Common Play test.property choose:highest with damage.apply, condition.apply, movement.relocate, and structural attack economy composes complete Unarmed Strike without content identity dispatch')
          add('productionEvidence','tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts proves unknown installed Unarmed damage/Grapple/Shove-Prone/Shove-Push execution and event-native Undo through Common Play/Resolver')
          add('identityInvarianceEvidence','tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts repeats the complete Unarmed composition under unrelated module/content/mechanic/entry-point identities with identical outcomes')
          add('productionEvidence','49830ee9769243f3fb40a5ff3c13c9cfe32a585d makes projected Unarmed best-save choice explicitly source-owned via choose:highest; run 33317650788 passed targeted tests, coverage checker, legacy boundary, and tsc')
          if row.get('disposition')!='INCOMPLETE':
              raise SystemExit('Family J must remain INCOMPLETE while other named attack/action projection debt remains')
          p.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'disposition':row['disposition'],'remainingNamedSeams':row['remainingNamedSeams']},ensure_ascii=False,indent=2))
          PY
      - name: Publish and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-j-unarmed-ledger-partial-71304.yml
          git commit -m "docs(c9): reconcile proven Unarmed coverage"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
