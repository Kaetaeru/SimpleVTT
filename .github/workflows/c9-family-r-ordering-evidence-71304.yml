name: C9 Family R Ordering Evidence 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-r-ordering-evidence-71304.yml

permissions:
  contents: write

jobs:
  finalize-ordering-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python - <<'PY'
          from pathlib import Path

          rules = Path('.github/workflows/rules-domain.yml')
          text = rules.read_text(encoding='utf-8')
          anchor = '          tests/domain/commonPlayReactionRuntime.test.ts\n'
          addition = '          tests/domain/commonPlaySimultaneousOrderingRuntime.test.ts\n'
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('rules-domain.yml: expected one Common Play reaction test anchor')
              text = text.replace(anchor, anchor + addition, 1)
              rules.write_text(text, encoding='utf-8')

          ledger = Path('docs/rules/v1-mechanism-coverage-ledger.json')
          text = ledger.read_text(encoding='utf-8')
          start = text.index('      "id": "simultaneous-ordering"')
          end = text.index('      "id": "stored-invocation-ready"', start)
          block = text[start:end]
          evidence = 'commonPlaySimultaneousOrderingRuntime.ts generic pending/resolved ordering state'
          if evidence not in block:
              baseline = '"currentState": "No explicit generic ordering authority proof"'
              if baseline not in block:
                  raise SystemExit('ledger: Family R changed concurrently; refusing to overwrite it')
              block = block.replace(
                  baseline,
                  '"currentState": "A generic typed simultaneous-ordering decision kernel now validates eligible candidate sets, actor-controller/DM authority, stale revisions, exact permutations, deterministic ordered projection, and idempotent exact replay. Production timing-window collection, Host-connected decision transport/reconnect, and unknown RuleModule execution remain incomplete."',
                  1,
              )
              block = block.replace(
                  '"implementationEvidence": []',
                  '"implementationEvidence": [\n        "commonPlaySimultaneousOrderingRuntime.ts generic pending/resolved ordering state with actor-controller|dm authority, revision/responder validation, exact candidate permutation, deterministic projection, and idempotent exact replay",\n        "commonPlaySimultaneousOrderingRuntime.test.ts covers automatic zero/one-candidate resolution, authority/stale rejection, invalid permutations, deterministic ordering, replay, and conflicting replay rejection"\n      ]',
                  1,
              )
              block = block.replace(
                  '"identityInvarianceEvidence": []',
                  '"identityInvarianceEvidence": [\n        "commonPlaySimultaneousOrderingRuntime.test.ts repeats the same relative mechanical ordering under unrelated renamed external candidate identities"\n      ]',
                  1,
              )
              block = block.replace(
                  '"remainingNamedSeams": []',
                  '"remainingNamedSeams": [\n        "production Common Play timing-window collection and Host-connected decision transport/reconnect/replay are not yet wired to the ordering kernel"\n      ]',
                  1,
              )
              text = text[:start] + block + text[end:]
              ledger.write_text(text, encoding='utf-8')
          PY
            git rm -f --ignore-unmatch .github/workflows/c9-family-r-ordering-kernel-71304.yml .github/workflows/c9-family-r-ordering-evidence-71304.yml
            git add -A .github/workflows/rules-domain.yml docs/rules/v1-mechanism-coverage-ledger.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(c9): record simultaneous ordering kernel evidence"
            npm run generate:content >/dev/null
            node --import tsx --test tests/domain/commonPlaySimultaneousOrderingRuntime.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            if git push origin HEAD:"$branch"; then exit 0; fi
            echo "Family R evidence publish raced; retry $attempt/5"
          done
          exit 1
