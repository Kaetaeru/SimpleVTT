name: C9 Family R Ordering Evidence 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-r-ordering-evidence-71304.yml

permissions:
  contents: write

jobs:
  finalize-ordering-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python - <<'PY'
          from pathlib import Path

          rules = Path('.github/workflows/rules-domain.yml')
          text = rules.read_text(encoding='utf-8')
          anchor = '          tests/domain/commonPlayReactionRuntime.test.ts\n'
          addition = '          tests/domain/commonPlaySimultaneousOrderingRuntime.test.ts\n'
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('rules-domain.yml: expected one Common Play reaction test anchor')
              text = text.replace(anchor, anchor + addition, 1)
              rules.write_text(text, encoding='utf-8')

          ledger = Path('docs/rules/v1-mechanism-coverage-ledger.json')
          text = ledger.read_text(encoding='utf-8')
          old = '''      "currentState": "No explicit generic ordering authority proof",
          "requiredSemantics": [
            "timing window",
            "eligible effects",
            "ordering authority",
            "player/DM choice",
            "deterministic ordered execution",
            "Host authority",
            "reconnect/replay"
          ],
          "transactionDomain": "Typed pending decision plus session authority",
          "disposition": "INCOMPLETE",
          "implementationEvidence": [],
          "productionEvidence": [],
          "identityInvarianceEvidence": [],
          "connectedEvidenceIfRelevant": [],
          "persistenceEvidenceIfRelevant": [],
          "remainingNamedSeams": [],'''
          new = '''      "currentState": "A generic typed simultaneous-ordering decision kernel now validates eligible candidate sets, actor-controller/DM authority, stale revisions, exact permutations, deterministic ordered projection, and idempotent exact replay. Production timing-window collection, Host-connected decision transport/reconnect, and unknown RuleModule execution remain incomplete.",
          "requiredSemantics": [
            "timing window",
            "eligible effects",
            "ordering authority",
            "player/DM choice",
            "deterministic ordered execution",
            "Host authority",
            "reconnect/replay"
          ],
          "transactionDomain": "Typed pending decision plus session authority",
          "disposition": "INCOMPLETE",
          "implementationEvidence": [
            "commonPlaySimultaneousOrderingRuntime.ts generic pending/resolved ordering state with actor-controller|dm authority, revision/responder validation, exact candidate permutation, deterministic projection, and idempotent exact replay",
            "commonPlaySimultaneousOrderingRuntime.test.ts covers automatic zero/one-candidate resolution, authority/stale rejection, invalid permutations, deterministic ordering, replay, and conflicting replay rejection"
          ],
          "productionEvidence": [],
          "identityInvarianceEvidence": [
            "commonPlaySimultaneousOrderingRuntime.test.ts repeats the same relative mechanical ordering under unrelated renamed external candidate identities"
          ],
          "connectedEvidenceIfRelevant": [],
          "persistenceEvidenceIfRelevant": [],
          "remainingNamedSeams": [
            "production Common Play timing-window collection and Host-connected decision transport/reconnect/replay are not yet wired to the ordering kernel"
          ],'''
          if old in text:
              text = text.replace(old, new, 1)
              ledger.write_text(text, encoding='utf-8')
          elif 'commonPlaySimultaneousOrderingRuntime.ts generic pending/resolved ordering state' not in text:
              raise SystemExit('ledger: Family R baseline changed without expected ordering evidence')
          PY
            rm -f .github/workflows/c9-family-r-ordering-kernel-71304.yml
            rm -f .github/workflows/c9-family-r-ordering-evidence-71304.yml
            git add .github/workflows/rules-domain.yml docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-r-ordering-kernel-71304.yml .github/workflows/c9-family-r-ordering-evidence-71304.yml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(c9): record simultaneous ordering kernel evidence"
            npm run generate:content >/dev/null
            node --import tsx --test tests/domain/commonPlaySimultaneousOrderingRuntime.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            if git push origin HEAD:"$branch"; then exit 0; fi
            echo "Family R evidence publish raced; retry $attempt/5"
          done
          exit 1
