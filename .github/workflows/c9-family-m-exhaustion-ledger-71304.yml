name: C9 Family M Exhaustion Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-m-exhaustion-ledger-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-m-exhaustion-ledger-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Reconcile verified Family M Exhaustion evidence
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/ui/c9FamilyMExhaustionProduction.test.ts tests/ui/c9FamilyMConditionImmunityProduction.test.ts
          npm exec tsc -- --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs

          cat > /tmp/reconcile-family-m.mjs <<'NODE'
          import fs from "node:fs";
          const path="docs/rules/v1-mechanism-coverage-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(path,"utf8"));
          const row=ledger.rows.find((entry)=>entry.family==="M"&&entry.id==="conditions");
          if(!row) throw new Error("Family M conditions row missing");
          const add=(key,value)=>{
            row[key]??=[];
            if(!row[key].includes(value)) row[key].push(value);
          };
          row.currentState="The shared Resolver condition Effect path enforces explicit combatant condition immunities, active tagged condition-immunity Effects, and rules-derived condition immunities before adding a condition Effect. Unknown installed Common Play condition.apply/remove has production and external identity-rename proof for explicit Poisoned immunity, Petrified-derived Poisoned immunity, successful application after immunity removal, and Undo. Portable Exhaustion stacks structurally as distinct Resolver-owned condition Effects through unknown installed Common Play, reaches the SRD level-6 fatal state, and event-native Undo restores level 5; the same behavior is proven after complete external identity rename. Host-authoritative connected apply/remove replay, duplicate suppression, Undo, fresh reconnect, and renamed external identity convergence are proven for portable conditions. Exhaustive SRD condition semantics and remaining named condition-specific adapters remain incomplete.";
          add("implementationEvidence","conditions.ts exhaustionLevel/exhaustionIsFatal/effectiveSpeed/conditionD20Adjustments derive Exhaustion level, fatal level 6, speed penalty, and d20 penalty structurally from active Exhaustion Effects");
          add("implementationEvidence","commonPlayOperationRuntime.ts lowers each portable condition.apply to a resolution-scoped unique apply-effect ID, allowing repeated Exhaustion applications to stack without content identity dispatch");
          add("implementationEvidence","resolutionEffectOps.ts applies level-6 Exhaustion death and emits inverse-ready EffectStateChange/LifeFlag StateChanges through the shared Resolver");
          add("productionEvidence","e74a03a242cea413116c1cc427456fdbc2553723 test(c9): prove portable exhaustion stacking");
          add("productionEvidence","C9 Family M Exhaustion 71304 run 33314531337: unknown installed portable Exhaustion stacked through levels 1-6, level 6 produced death, event-native Undo restored level 5/alive, existing condition-immunity regression passed, and tsc --noEmit, V1 coverage checker, and legacy execution boundary all passed");
          add("identityInvarianceEvidence","c9FamilyMExhaustionProduction.test.ts repeats level-1 through level-6 Exhaustion plus Undo under unrelated external module/content/mechanic identities with identical results");
          row.remainingNamedSeams=(row.remainingNamedSeams??[]).filter((entry)=>!entry.includes("Exhaustion stacking/levels"));
          const remaining=[
            "exhaustive SRD condition production semantics beyond the proven immunity and Exhaustion slices remain incomplete",
            "remaining named condition-specific adapters remain migration debt where they bypass portable Common Play/Resolver"
          ];
          for(const value of remaining) if(!row.remainingNamedSeams.includes(value)) row.remainingNamedSeams.push(value);
          row.disposition="INCOMPLETE";
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+"\n","utf8");
          NODE

          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            node /tmp/reconcile-family-m.mjs
            rm -f .github/workflows/c9-family-m-exhaustion-ledger-71304.yml
            git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-m-exhaustion-ledger-71304.yml
            git diff --cached --check
            node scripts/check-v1-mechanism-coverage.mjs
            git commit -m "docs(c9): reconcile Family M exhaustion evidence"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
