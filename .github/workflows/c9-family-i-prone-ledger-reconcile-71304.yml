name: C9 Family I Prone Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-prone-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Remove stale Prone seam and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          text=path.read_text(encoding='utf-8')
          old='rules-derived Difficult Terrain, Prone stand cost, drag/carry, alternate-speed, and related movement constraint authority remain incomplete'
          new='rules-derived Difficult Terrain, drag/carry, alternate-speed, and related movement constraint authority remain incomplete'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale Family I seam, found {count}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          rm -f .github/workflows/c9-family-i-prone-ledger-reconcile-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(c9): reconcile portable prone standing evidence"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 30); do
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "Family I ledger reconciliation conflicts with concurrent work; stopping" >&2
              exit 1
            fi
            node scripts/check-v1-mechanism-coverage.mjs
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
