name: C9 Family A Evidence Reconcile 7130
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-evidence-reconcile-7130.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile verified Family A evidence
        shell: python
        run: |
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(path.read_text())
          row=next(entry for entry in ledger['rows'] if entry['family']=='A')
          row['currentState']=(
            'The persisted property.modify contract carries explicit target, Effect ownership, definition source, elapsed duration, destroy-on-end lifetime, and instance policy. '
            'commonPlayOperationRuntime generically lowers arbitrary external property.modify definitions to the existing apply-effect ResolutionOperation with a typed propertyModifier payload, Resolver commits that payload into EffectState, and installed Common Play projects active movement.walk property effects into the existing movement expression consumer without content-name or content-ID dispatch. '
            'Generic Effect application enforces stack, replace, and unique-by-source instance policies with reversible Effect StateChanges; profile-policy rejects explicitly until RulesProfile supplies a stacking policy. '
            'Source-bound property modifiers now converge through connected event replay, fresh reconnect, and event-native Undo. Family A remains incomplete because production property projection is not yet generic across the full property vocabulary and named progression/runtime stat materialization remains outside the generic property owner.'
          )
          impl='commonPlayPropertyInstancePolicyRuntime.test.ts stack/replace/unique-by-source semantics emit inverse-ready removed/added Effect StateChanges; profile-policy explicit rejection without RulesProfile policy'
          if impl not in row['implementationEvidence']: row['implementationEvidence'].append(impl)
          row['productionEvidence']=[entry.replace('propertyModifierInstancePolicyRuntime.test.ts','commonPlayPropertyInstancePolicyRuntime.test.ts') for entry in row['productionEvidence']]
          run='C9 Family A Instance Policy 7130 run 33310216464: property contract, instance-policy event semantics, connected property persistence/reconnect/Undo, and tsc --noEmit all pass'
          if run not in row['productionEvidence']: row['productionEvidence'].append(run)
          connected='installedCommonPlayPropertyModifierProduction.test.ts source-bound property modifier Host/Client replay, fresh reconnect, and connected Undo convergence'
          if connected not in row['connectedEvidenceIfRelevant']: row['connectedEvidenceIfRelevant'].append(connected)
          persistence='installedCommonPlayPropertyModifierProduction.test.ts source-bound session-runtime Effect survives authoritative event replay into a fresh reconnect replica and is removed consistently by event-native Undo'
          if persistence not in row['persistenceEvidenceIfRelevant']: row['persistenceEvidenceIfRelevant'].append(persistence)
          row['remainingNamedSeams']=[entry for entry in row['remainingNamedSeams'] if entry!='source-bound property modifier persistence/reconnect evidence is absent']
          path.write_text(json.dumps(ledger,indent=2,ensure_ascii=False)+'\n')
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-a-evidence-reconcile-7130.yml
          git commit -m "docs(c9): reconcile Family A instance and reconnect evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
