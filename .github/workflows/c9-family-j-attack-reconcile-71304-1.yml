name: C9 Family J Portable Attack Reconcile 71304-1

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-attack-reconcile-71304-1.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reconcile and verify against latest branch
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/c9-gate-n-coverage-reconciliation'
          self='.github/workflows/c9-family-j-attack-reconcile-71304-1.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"

            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          rows=data.get('rows',data.get('families',[]))
          row=next(item for item in rows if item['family']=='J')

          def add(key,value):
              if value not in row[key]:
                  row[key].append(value)

          add('implementationEvidence','commonPlayOperationRuntime.ts structurally composes attack-roll d20 tests with target damage.apply through the shared Resolver operation path')
          add('productionEvidence','installedCommonPlayLoweredFamiliesProduction.test.ts#summoned Actor projects and executes its portable Common Play action with economy and Undo')
          add('identityInvarianceEvidence','installedCommonPlayLoweredFamiliesProduction.test.ts executes the summoned attack from arbitrary previously-unknown module/content/mechanic/action identities rather than a registered attack content ID')
          add('connectedEvidenceIfRelevant','installedCommonPlayLoweredFamiliesProduction.test.ts#summoned Actor action and Undo converge through Host-authoritative connected events')

          row['currentState']='Unknown installed Common Play attack-roll plus target damage now has production evidence through a projected arbitrary-ID Actor action with Action payment, damage commit, Host/Client convergence, and Undo. Family J remains incomplete for full weapon/Unarmed Strike, Opportunity Attack, grapple/shove/escape, reach/range/cover, Extra Attack/replacement, and ammunition/loading composition.'
          row['remainingNamedSeams']=[
              'full generic weapon and Unarmed Strike action projection is not yet proven across source-owned equipment/stat definitions',
              'Opportunity Attack and grapple/shove/escape control composition remain outside the portable Common Play attack acceptance',
              'reach, long range, cover, multiattack/Extra Attack/replacement, and ammunition/loading constraints remain incomplete',
              'Rage attack rider and other named attack/action projection remain migration debt',
          ]
          if row['disposition']!='INCOMPLETE':
              raise SystemExit('Family J unexpectedly finalized by another job; refusing stale reconciliation')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            npx tsx --test --test-name-pattern='summoned Actor' tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
            node scripts/check-legacy-execution-boundary.mjs
            npx tsc --noEmit

            git rm "$self"
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git commit -m 'docs(c9): reconcile portable attack evidence'
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "push raced with another C9 writer; retrying from latest branch ($attempt/3)"
          done
          echo 'failed to publish Family J reconciliation after three branch races' >&2
          exit 1
