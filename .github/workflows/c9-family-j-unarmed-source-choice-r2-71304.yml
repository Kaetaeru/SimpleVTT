name: C9 Family J Unarmed Source Choice R2 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-unarmed-source-choice-r2-71304.yml]

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make Unarmed save selection source-owned
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/app/contracts.ts')
          s=p.read_text(encoding='utf-8')
          old='''  runtimeSaveCondition?:{\n    conditionId:ConditionId;\n    label:string;\n    displayName:string;\n    saveAbilities:AbilityKey[];'''
          new='''  runtimeSaveCondition?:{\n    conditionId:ConditionId;\n    label:string;\n    displayName:string;\n    choose:"highest";\n    saveAbilities:AbilityKey[];'''
          if new not in s:
            if old not in s: raise SystemExit('runtimeSaveCondition contract anchor changed')
            s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')

          p=Path('src/app/productionPlayRuntimeAdapter.ts')
          s=p.read_text(encoding='utf-8')
          old='runtimeSaveCondition:{conditionId:'
          new='runtimeSaveCondition:{choose:"highest",conditionId:'
          if old in s:
            if s.count(old)!=2: raise SystemExit(f'unarmed producer count changed: {s.count(old)}')
            s=s.replace(old,new)
            p.write_text(s,encoding='utf-8')
          elif s.count(new)!=2:
            raise SystemExit(f'unarmed source choice state unexpected: {s.count(new)}')

          p=Path('src/app/unarmedControlRuntimeAdapter.ts')
          s=p.read_text(encoding='utf-8')
          old='''  const control=action?.runtimeSaveCondition;\n  if (!control) return previousResolveAction.call(this,actionId,targetIds);'''
          new='''  const control=action?.runtimeSaveCondition;\n  if (!control) return previousResolveAction.call(this,actionId,targetIds);\n  if (control.choose!=="highest") return snapshot;'''
          if new not in s:
            if old not in s: raise SystemExit('unarmed control choice anchor changed')
            s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')

          p=Path('tests/ui/unarmedStrikeRuntime.test.ts')
          s=p.read_text(encoding='utf-8')
          assertion='assert.equal(source.runtimeSaveCondition?.choose,"highest");'
          if assertion not in s:
            old='''    } else {\n      assert.deepEqual(source.runtimeSaveCondition?.saveAbilities,["str","dex"]);\n    }'''
            new='''    } else {\n      assert.equal(source.runtimeSaveCondition?.choose,"highest");\n      assert.deepEqual(source.runtimeSaveCondition?.saveAbilities,["str","dex"]);\n    }'''
            if old not in s: raise SystemExit('source choice assertion anchor changed')
            s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Verify Family J source-owned choice
        shell: bash
        run: |
          npm run generate:content
          npx tsx --test tests/ui/unarmedStrikeRuntime.test.ts tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJSpatialAttackProduction.test.ts tests/ui/c9FamilyJExtraAttackProduction71304.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish verified source and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/contracts.ts src/app/productionPlayRuntimeAdapter.ts src/app/unarmedControlRuntimeAdapter.ts tests/ui/unarmedStrikeRuntime.test.ts
          git rm .github/workflows/c9-family-j-unarmed-source-choice-r2-71304.yml
          git commit -m "fix(c9): make unarmed save selection source-owned"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
            sleep 1
          done
          exit 1
