name: C9 Family H Ledger Sync 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-h-ledger-sync-71304.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update Family H on latest ledger without overwriting parallel rows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=docs/rules/v1-mechanism-coverage-ledger.json
          for attempt in $(seq 1 20); do
            gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" > /tmp/ledger-response.json
            sha="$(jq -r .sha /tmp/ledger-response.json)"
            jq -r .content /tmp/ledger-response.json | tr -d '\n' | base64 -d > /tmp/ledger.json
            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('/tmp/ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next((entry for entry in data['rows'] if entry.get('family')=='H'),None)
          if row is None:
              raise SystemExit('Family H row not found')
          if row.get('disposition')!='INCOMPLETE':
              raise SystemExit(f"Family H disposition changed unexpectedly: {row.get('disposition')}")

          row['currentState']=(
              'Generic status and creature-type awareness paths are production-proven. Common Play defines standard sensing facts for can-see, can-hear, detected, light, obscurement, and hidden with identity-independent provider provenance and connected owner-authority routing. Resolver-owned session Hidden effects feed sense.hidden, unknown external Hide-style status actions commit Hidden as authoritative Effect StateChanges, and endsOnAttack reveal removes that Effect through the same event path with event-native Undo. Provider-authored line-of-sight, lighting, obscurement, and special-sense facts compose through the shared sensing kernel before production answers sense.can-see/detected; active Resolver-owned Invisible conditions are combined with provider target-invisibility rather than bypassing the generic sensing kernel. Family H remains incomplete for rules-derived special-sense acquisition/derivation, detection/Search, and discovery semantics.'
          )

          def add_unique(key,value):
              items=row.setdefault(key,[])
              if value not in items:
                  items.append(value)

          add_unique('implementationEvidence','commonPlayInterceptorProductionRuntimeAdapter.ts composes provider-authored observer senses/targetInvisible with active Resolver-owned Invisible Effects through resolveCommonPlaySenses rather than a named condition adapter')
          add_unique('implementationEvidence','spatialRuntimeContracts.ts carries provider-authored observerSenses and targetInvisible facts while Core retains generic special-sense composition semantics')
          add_unique('productionEvidence','42fa3c47df4c8d8efc51c8b7912fd4304e74592d feat(c9): wire special senses into production facts; installedCommonPlayInterceptorProductionRuntime.test.ts proves provider-authored Darkvision, Blindsight, and Truesight production composition under external identity rename')
          add_unique('productionEvidence','C9 Family H Invisible Sight 71304 run 33313630506: 21/21 targeted sensing/interceptor tests, legacy execution boundary, and tsc --noEmit passed; production normal sight consumed an active Resolver-owned Invisible condition')
          add_unique('identityInvarianceEvidence','installedCommonPlayInterceptorProductionRuntime.test.ts special-sight matrix preserves provider-authored sensing semantics after full external module/content/mechanic/interceptor/interaction/display rename')
          row['remainingNamedSeams']=['rules-derived special-sense acquisition/derivation, detection/Search, and discovery semantics remain incomplete']

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          reloaded=json.loads(path.read_text(encoding='utf-8'))
          check=next(entry for entry in reloaded['rows'] if entry.get('family')=='H')
          assert check['disposition']=='INCOMPLETE'
          assert check['remainingNamedSeams']==['rules-derived special-sense acquisition/derivation, detection/Search, and discovery semantics remain incomplete']
          assert reloaded['gateNBlockingNamedFallbacks']==data['gateNBlockingNamedFallbacks']
          PY
            content="$(base64 -w0 < /tmp/ledger.json)"
            jq -n --arg message "docs(c9): record Family H sensing evidence" --arg content "$content" --arg sha "$sha" --arg branch "$branch" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/update.json
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input /tmp/update.json >/dev/null 2>/tmp/put.err; then
              exit 0
            fi
            cat /tmp/put.err >&2
            sleep 1
          done
          exit 1
