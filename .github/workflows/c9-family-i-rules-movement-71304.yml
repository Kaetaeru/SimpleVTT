name: C9 Family I Rules Movement 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - tests/ui/c9FamilyIMovementProduction.test.ts
      - src/domain/commonPlayMovementRuntime.ts
      - src/app/installedCommonPlayRuntimeAdapter.ts
      - .github/workflows/c9-family-i-rules-movement-71304.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: npm exec tsc -- --noEmit
