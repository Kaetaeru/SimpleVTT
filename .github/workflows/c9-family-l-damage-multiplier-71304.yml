name: C9 Family L Damage Multiplier 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-damage-multiplier-71304.yml

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Connect schema-declared damage multiplier to Common Play runtime
        shell: python
        run: |
          from pathlib import Path

          runtime_path = Path('src/domain/commonPlayOperationRuntime.ts')
          text = runtime_path.read_text()

          def replace_once(old, new):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing expected runtime fragment: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''type CommonPlayDamageApply={\n  kind:"damage.apply";\n  amount:LiteralNumberExpression|string;\n  damageType:string;\n  target?:CommonPlayHpTarget;\n};''',
              '''type CommonPlayDamageApply={\n  kind:"damage.apply";\n  amount:LiteralNumberExpression|string;\n  damageType:string;\n  multiplier?:number;\n  target?:CommonPlayHpTarget;\n};''',
          )
          replace_once(
              'const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","target"]);',
              'const DAMAGE_APPLY_KEYS=new Set(["kind","amount","damageType","multiplier","target"]);',
          )
          replace_once(
              '''    } else amount=nonNegativeLiteralExpression(operation.amount,`${label}.amount`);\n    return {\n      kind:"damage.apply",\n      amount,\n      damageType:nonEmptyString(operation.damageType,`${label}.damageType`),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n    };''',
              '''    } else amount=nonNegativeLiteralExpression(operation.amount,`${label}.amount`);\n    const multiplier=operation.multiplier;\n    if(multiplier!==undefined&&(typeof multiplier!=="number"||!Number.isFinite(multiplier)||multiplier<0)) throw new DomainEvaluationError(`${label}.multiplier must be a finite non-negative number`);\n    return {\n      kind:"damage.apply",\n      amount,\n      damageType:nonEmptyString(operation.damageType,`${label}.damageType`),\n      ...(multiplier===undefined?{}:{multiplier}),\n      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),\n    };''',
          )
          replace_once(
              '''      let amount:number|{operationId:string;field:"total"};\n      if(typeof operation.amount==="string") {''',
              '''      const multiplier=operation.multiplier;\n      const rounding=multiplier===undefined?undefined:profile.roundingPolicy?.default;\n      if(multiplier!==undefined&&!rounding) throw new DomainEvaluationError("damage.apply multiplier requires a RulesProfile rounding policy");\n      let amount:number|{operationId:string;field:"total";multiplier?:number;rounding?:"floor"|"ceil"|"round"};\n      if(typeof operation.amount==="string") {''',
          )
          replace_once(
              '''        amount={operationId:rollId,field:"total"};\n      } else amount=literalInteger(operation.amount,"damage.apply amount");''',
              '''        amount={operationId:rollId,field:"total",...(multiplier===undefined?{}:{multiplier,rounding})};\n      } else {\n        const literal=literalInteger(operation.amount,"damage.apply amount");\n        if(multiplier===undefined) amount=literal;\n        else {\n          const scaled=literal*multiplier;\n          amount=rounding==="ceil"?Math.ceil(scaled):rounding==="round"?Math.round(scaled):Math.floor(scaled);\n        }\n      }''',
          )
          runtime_path.write_text(text)

          test_path = Path('tests/ui/c9FamilyLDamageDefenseProduction.test.ts')
          test = test_path.read_text()

          def replace_test(old, new):
              global test
              if new in test:
                  return
              if old not in test:
                  raise SystemExit(f'missing expected test fragment: {old[:120]!r}')
              test = test.replace(old, new, 1)

          replace_test('function packagePayload(prefix:string) {', 'function packagePayload(prefix:string,multiplier?:number) {')
          replace_test(
              'operations:[{kind:"damage.apply",amount:{value:8},damageType:"fire",target:"target"}],',
              'operations:[{kind:"damage.apply",amount:{value:4},damageType:"fire",...(multiplier===undefined?{}:{multiplier}),target:"target"}],',
          )
          replace_test('async function execute(prefix:string,kind:DamageDefenseKind) {', 'async function execute(prefix:string,kind?:DamageDefenseKind,multiplier?:number) {')
          replace_test('  const pack=packagePayload(prefix);', '  const pack=packagePayload(prefix,multiplier);')
          replace_test(
              '  runtime.state.combatants[TARGET_ID].damageDefenses=[{source:`${prefix}.runtime-defense`,kind,damageType:"fire"}];',
              '  runtime.state.combatants[TARGET_ID].damageDefenses=kind?[{source:`${prefix}.runtime-defense`,kind,damageType:"fire"}]:[];',
          )
          marker = '''test("unknown installed damage.apply honors generic target damage defenses with rename invariance and Undo",async()=>{\n  const expected:Record<DamageDefenseKind,number>={resistance:4,vulnerability:16,immunity:0};\n  for(const kind of ["resistance","vulnerability","immunity"] as const) {\n    assert.equal(await execute(`external.family-l-${kind}`,kind),expected[kind]);\n    assert.equal(await execute(`completely.renamed-family-l-${kind}`,kind),expected[kind]);\n  }\n});'''
          addition = '''test("unknown installed damage.apply honors generic target damage defenses with rename invariance and Undo",async()=>{\n  const expected:Record<DamageDefenseKind,number>={resistance:2,vulnerability:8,immunity:0};\n  for(const kind of ["resistance","vulnerability","immunity"] as const) {\n    assert.equal(await execute(`external.family-l-${kind}`,kind),expected[kind]);\n    assert.equal(await execute(`completely.renamed-family-l-${kind}`,kind),expected[kind]);\n  }\n});\n\ntest("unknown installed damage.apply honors schema-declared multiplier with profile rounding, rename invariance, and Undo",async()=>{\n  assert.equal(await execute("external.family-l-multiplier",undefined,0.6),2);\n  assert.equal(await execute("completely.renamed-family-l-multiplier",undefined,0.6),2);\n});'''
          if 'schema-declared multiplier with profile rounding' not in test:
              if marker not in test:
                  raise SystemExit('missing Family L damage defense test marker')
              test = test.replace(marker, addition, 1)
          test_path.write_text(test)
      - run: npm ci
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family L portable damage multiplier
        run: npx tsx --test tests/ui/c9FamilyLDamageDefenseProduction.test.ts
      - name: Verify V1 coverage structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Commit verified runtime bridge
        shell: bash
        run: |
          rm .github/workflows/c9-family-l-damage-multiplier-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts .github/workflows/c9-family-l-damage-multiplier-71304.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(c9): execute portable damage multiplier"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
