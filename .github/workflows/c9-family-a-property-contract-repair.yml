name: C9 Family A Property Contract Repair

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-property-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply repaired Family A contract slice
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/c9-family-a-property-contract-step.yml').read_text()
          start_marker = '      - name: Apply Family A contract slice\n        shell: python\n        run: |\n'
          end_marker = '      - run: npx tsx --test tests/domain/commonPlayPropertyContractRuntime.test.ts tests/domain/commonPlayDefinitionRuntime.test.ts\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = textwrap.dedent(workflow[start:end])
          stale = '    if(operation.kind==="roll.modify") continue;\n  if(operation.kind==="resource.recharge") {'
          current = '    if(operation.kind==="roll.modify") continue;\n    if(operation.kind==="resource.recharge") {'
          if stale not in code:
              raise SystemExit('Family A stale lowering anchor not found')
          code = code.replace(stale, current, 1)
          exec(compile(code, 'family-a-property-contract-step', 'exec'), {})
      - run: npx tsx --test tests/domain/commonPlayPropertyContractRuntime.test.ts tests/domain/commonPlayDefinitionRuntime.test.ts
      - run: npm run test:common-play-definition
      - run: node -e "JSON.parse(require('node:fs').readFileSync('schemas/common-play-contract.schema.json','utf8'))"
      - run: npx tsc --noEmit
      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/common-play-contract.schema.json src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayPropertyContractRuntime.test.ts
          git rm .github/workflows/c9-family-a-property-contract-step.yml .github/workflows/c9-family-a-property-contract-repair.yml
          git commit -m "feat(c9): define property modifier ownership contract"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          npx tsx --test tests/domain/commonPlayPropertyContractRuntime.test.ts tests/domain/commonPlayDefinitionRuntime.test.ts
          npx tsc --noEmit
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
