name: C9 Family P Finalize 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-finalize-71304.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify portable semantic trigger production
        run: npx tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts tests/ui/connectedDamageDealtTriggerProduction.test.ts tests/ui/connectedActorTurnRuleProduction.test.ts
      - name: Reconcile Family P final disposition
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ledger_path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          ledger=json.loads(ledger_path.read_text(encoding="utf-8"))
          assert ledger["gateNBlockingNamedFallbacks"] == []
          row=next(entry for entry in ledger["rows"] if entry["family"]=="P")
          required=("attack.hit","attack.miss","save.success","save.failure","state.applied","effect.expired","rest/recharge")
          state=row["currentState"]
          for token in required:
              assert token in state, (token,state)

          baseline=json.loads(Path(".agents/LEGACY_EXECUTION_BASELINE.json").read_text(encoding="utf-8"))
          modules={entry.get("module","") for entry in baseline.get("entries",[])}
          transitive={entry.get("path","") for entry in baseline.get("transitiveEntries",[])}
          assert "./bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter" not in modules
          assert "src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts" not in transitive
          assert not Path("src/app/bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts").exists()

          if row["disposition"]=="INCOMPLETE":
              row["disposition"]="IMPLEMENTED"
              row["currentState"]=(
                  "Generic Common Play semantic trigger orchestration covers attack/save outcomes, damage taken/dealt, turn/round and Zone timing, rest completion, recharge outcomes, state.applied, effect.expired, and once/turn/round/resolution frequency through the shared Resolver transaction. Unknown installed RuleModules have production and identity-invariance evidence. Remaining named built-in activation/projection adapters are legacy content migration debt outside this portable trigger dispatcher and are not portable execution fallbacks."
              )
              row["remainingNamedSeams"]=[
                  "named built-in feature activation/projection adapters remain legacy content migration debt outside portable semantic trigger dispatch; they are not portable execution fallbacks"
              ]
              evidence="C9 Family P Finalize 71304 verifies current semantic trigger production, legacy boundary, typecheck, and coverage before final disposition"
              if evidence not in row["productionEvidence"]:
                  row["productionEvidence"].append(evidence)
          elif row["disposition"]!="IMPLEMENTED":
              raise SystemExit(f"unexpected Family P disposition: {row['disposition']}")

          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Verify coverage and legacy boundary
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish Family P completion and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-p-finalize-71304.yml
          git commit -m "docs(c9): complete Family P trigger coverage"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
