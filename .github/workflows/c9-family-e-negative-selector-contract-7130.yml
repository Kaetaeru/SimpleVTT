name: C9 Family E Negative Selector Contract 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-negative-selector-contract-7130.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Keep negative targeting fixture actually unsupported
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=path.read_text(encoding='utf-8')
          old='    {from:"targets",where:{value:true},min:1,max:1},'
          new='    {from:"targets",where:{op:"unknown",ref:"relation"},min:1,max:1},'
          if text.count(old)!=1:
              raise SystemExit(f'expected one stale selector fixture, got {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify targeting import and production slice
        run: >-
          npx tsx --test
          tests/domain/commonPlaySelectorRuntime.test.ts
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify coverage and legacy boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified contract update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-negative-selector-contract-7130.yml
          git add tests/ui/ruleModulePackageImport.test.ts
          git commit -m "test(c9): keep targeting rejection fixture unsupported"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if git rebase origin/agent/c9-gate-n-coverage-reconciliation && git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              pushed=1
              break
            fi
            git rebase --abort || true
          done
          test "$pushed" -eq 1
