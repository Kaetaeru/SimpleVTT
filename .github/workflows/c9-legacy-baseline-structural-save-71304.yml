name: C9 Legacy Baseline Structural Save 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-legacy-baseline-structural-save-71304.yml"

permissions:
  contents: write

jobs:
  reconcile-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile structural save composition baseline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.agents/LEGACY_EXECUTION_BASELINE.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entries = data.get('entries', [])
          old = [entry for entry in entries if entry.get('module') == './unarmedControlRuntimeAdapter']
          new = [entry for entry in entries if entry.get('module') == './structuralSaveConditionRuntimeAdapter']
          if len(new) == 1 and not old:
              if new[0].get('classification') != 'GENERIC_ENGINE':
                  raise SystemExit('structural save baseline classification is not GENERIC_ENGINE')
          elif len(old) == 1 and not new:
              if old[0].get('classification') != 'GENERIC_ENGINE':
                  raise SystemExit('unarmed baseline classification is not GENERIC_ENGINE')
              old[0]['module'] = './structuralSaveConditionRuntimeAdapter'
          else:
              raise SystemExit(f'unexpected baseline state: old={len(old)} new={len(new)}')
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/check-legacy-execution-boundary.mjs
      - name: Publish reconciled baseline
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/LEGACY_EXECUTION_BASELINE.json
          git rm .github/workflows/c9-legacy-baseline-structural-save-71304.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(c9): reconcile structural save legacy baseline"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
          done
          exit 1
