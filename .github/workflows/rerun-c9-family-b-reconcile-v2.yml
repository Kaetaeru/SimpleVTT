name: C9 Family B Reconciliation V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-family-b-reconcile-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Verify and record Family B boundary
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const requireToken=(path,token)=>{const text=fs.readFileSync(path,'utf8');if(!text.includes(token))throw new Error(`${path} missing ${token}`)};
          requireToken('src/domain/commonPlayFrequencyRuntime.ts','once-per-turn');
          requireToken('src/domain/commonPlayFrequencyRuntime.ts','once-per-round');
          requireToken('src/domain/resolutionTurnOps.ts','begin-turn');
          requireToken('src/domain/resolutionTurnOps.ts','end-turn');
          requireToken('src/domain/commonPlayStoredInvocationRuntime.ts','trigger');
          requireToken('src/domain/commonPlayOperationRuntime.ts','bonus-action');
          requireToken('src/domain/commonPlayOperationRuntime.ts','reaction');

          const lp='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(lp,'utf8'));
          const row=ledger.rows.find(r=>r.family==='B');
          if(!row||row.disposition!=='INCOMPLETE')throw new Error(`unexpected Family B disposition ${row?.disposition}`);
          const counts=ledger.rows.reduce((a,r)=>(a[r.disposition]=(a[r.disposition]??0)+1,a),{});
          if(ledger.rows.length!==36||counts.IMPLEMENTED!==4||counts.INCOMPLETE!==32||(counts.PROVEN_UNNEEDED??0)!==0)throw new Error(`unexpected counts ${JSON.stringify(counts)}`);
          if((ledger.gateNBlockingNamedFallbacks??[]).length)throw new Error('gateNBlockingNamedFallbacks nonempty');
          row.currentState='Generic Action/Bonus Action/Reaction payments, canonical begin/end/advance-time turn-clock changes, off-turn stored invocation, and once/once-per-turn/once-per-round/once-per-resolution frequency are implemented with production evidence. Family-wide timing remains INCOMPLETE because the still-open Family P event vocabulary/order contract and Family AC initiative-count/refresh/order ownership define timing points that the current repository intentionally does not invent.';
          const add=(field,values)=>{row[field]??=[];for(const v of values)if(!row[field].includes(v))row[field].push(v)};
          add('implementationEvidence',[
            '583ff38c generic Action/Bonus Action/Reaction payments',
            'fbcee3c6 canonical begin-turn/end-turn/advance-time turn-clock StateChanges',
            'commonPlayFrequencyRuntime.ts generic once/turn/round/resolution frequency policy',
            'c87402f9 off-turn stored invocation with Reaction payment'
          ]);
          add('productionEvidence',[
            '64a1ff5d connected turn lifecycle event-native Undo authority',
            'connectedTurnResolutionEventTransport.test.ts turn lifecycle Host/Client replay/reconnect/Undo'
          ]);
          add('remainingNamedSeams',[
            'Family P undefined generic event vocabulary/order semantics',
            'Family AC undefined initiative-count/refresh/order ownership'
          ]);
          fs.writeFileSync(lp,JSON.stringify(ledger,null,2)+'\n');

          const sp='.chatgpt-rerun/STATE.md';
          let state=fs.readFileSync(sp,'utf8');
          const marker='## Next Exact Action';
          const idx=state.lastIndexOf(marker);
          if(idx<0)throw new Error('STATE next marker missing');
          const before=state.slice(0,idx).replace(/\n+$/,'')+'\n\n';
          const section='## Family B audit — implemented timing core, final policy dependencies remain\n\nFamily B (`turn-action-economy-timing`) remains `INCOMPLETE`. The generic runtime already owns Action/Bonus Action/Reaction payment, canonical turn-clock transitions, off-turn stored invocation, and once/turn/round/resolution frequency. Its unresolved family-wide surface is not another turn engine: it is the repository-undefined Family P event vocabulary/order contract plus Family AC initiative-count/refresh/order ownership. Those timing points were not invented.\n\n';
          const next='## Next Exact Action\n\nMove to Family C (`d20-test-lifecycle`) as the next concrete implementation gap. Inspect the remaining `bardCollegeLoreCuttingWordsFollowUpRuntimeAdapter.ts` named execution against the installed generic Common Play interceptor production path. Re-derive Cutting Words from RulesProfile/SRD behavior rather than legacy output; use existing generic d20/damage subtract-die, payment, eligibility/fact, connected/replay/reconnect/Undo semantics when sufficient. If context-dependent Bardic Inspiration die sizing or multi-trigger orchestration needs a reusable missing contract, capture that exact gap instead of adding class/subclass ID dispatch. Delete only named execution actually absorbed.\n';
          fs.writeFileSync(sp,before+section+next);
          NODE
          node scripts/check-v1-mechanism-coverage.mjs
          git diff --check
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json .chatgpt-rerun/STATE.md
          git commit -m "docs(c9): reconcile timing coverage boundary"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
      - name: Publish control last and remove helper
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          node <<'NODE'
          const fs=require('node:fs');
          const p='.chatgpt-rerun/control.json';
          const data=JSON.parse(fs.readFileSync(p,'utf8'));
          data.status='continue';
          data.reason='C9 remains active at IMPLEMENTED=4, INCOMPLETE=32, PROVEN_UNNEEDED=0 with gateNBlockingNamedFallbacks empty. Family B has the generic action-economy, turn-clock, off-turn stored-invocation, and frequency core, but final timing depends on the already-recorded Family P event vocabulary/order and Family AC initiative-count/refresh policies. Next tackle Family C by migrating the remaining named Cutting Words post-roll path onto the existing generic interceptor/subtract-die production authority where the current contract is sufficient.';
          data.updated_at='2026-08-30';
          fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n');
          NODE
          git rm --ignore-unmatch .github/workflows/rerun-c9-family-b-reconcile-v2.yml
          git add .chatgpt-rerun/control.json
          git commit -m "docs(rerun): continue from d20 lifecycle gap"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
