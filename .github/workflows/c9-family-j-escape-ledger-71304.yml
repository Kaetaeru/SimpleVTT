name: C9 Family J Escape Ledger 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-escape-ledger-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-j-escape-ledger-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile verified Family J escape evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-escape-ledger-71304.yml
          ledger=docs/rules/v1-mechanism-coverage-ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            node <<'NODE'
          const fs = require('fs');
          const path = 'docs/rules/v1-mechanism-coverage-ledger.json';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = Array.isArray(doc) ? doc : (doc.rows ?? doc.families ?? doc.mechanismFamilies);
          if (!Array.isArray(rows)) throw new Error('coverage ledger rows not found');
          const row = rows.find((candidate) => candidate.family === 'J');
          if (!row) throw new Error('Family J row not found');
          const proof = '440a9345ecbf6459ca572e39207f3756c5ed6217 test(c9): prove portable grapple escape; C9 Family J Escape 71304 run 33315525052 passed unknown/renamed best-of STR/DEX grapple escape, legacy execution boundary, and tsc --noEmit';
          const identity = 'c9FamilyJPortableControlProduction.test.ts preserves grapple escape semantics under unrelated external module/content/mechanic identities';
          if (!row.currentState.includes('best-of STR/DEX portable escape is production-proven')) {
            row.currentState = row.currentState.replace(
              'Family J remains incomplete for best-of STR/DEX portable control choice and escape plus full weapon/Unarmed Strike, Opportunity Attack, reach/range/cover, Extra Attack/replacement, and ammunition/loading composition.',
              'Best-of STR/DEX portable control choice and escape are production-proven through unknown installed Common Play with failure/success branching and event-native Undo. Family J remains incomplete for full weapon/Unarmed Strike source composition, Opportunity Attack, reach/range/cover, Extra Attack/replacement, and ammunition/loading composition.'
            );
          }
          row.productionEvidence ??= [];
          if (!row.productionEvidence.includes(proof)) row.productionEvidence.push(proof);
          row.identityInvarianceEvidence ??= [];
          if (!row.identityInvarianceEvidence.includes(identity)) row.identityInvarianceEvidence.push(identity);
          row.remainingNamedSeams = (row.remainingNamedSeams ?? []).map((seam) =>
            seam.includes('best-of STR/DEX control choice, escape, and complete grapple/shove source composition remain incomplete')
              ? 'portable target saving throws, best-of STR/DEX control choice, conditional control effects, and escape now normalize through Common Play; complete grapple/shove source composition remains incomplete'
              : seam
          );
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
            node scripts/check-v1-mechanism-coverage.mjs
            rm -f "$workflow"
            git add "$ledger" "$workflow"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): reconcile Family J grapple escape"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
