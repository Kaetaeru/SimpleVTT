name: C9 Family E Area Import Fix

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-area-import-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep rich selector canonical while narrowing operation IR
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/domain/commonPlayDefinitionRuntime.ts')
          text=path.read_text(encoding='utf-8')
          old='  projected.targeting=structuredClone(targeting);'
          new='  projected.targeting={from:"targets",min:Number(targeting.min),max:Number(targeting.max)};'
          if old not in text:
              if new not in text:
                  raise SystemExit('expected Family E targeting projection seam was not found')
          else:
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          PY
      - run: npm run generate:content
      - name: Verify Family E selector regressions
        run: node --import tsx --test tests/domain/commonPlaySelectorRuntime.test.ts tests/domain/commonPlayMaplessTargeting.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Commit verified fix and retire temporary verifiers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayDefinitionRuntime.ts
          for file in \
            .github/workflows/c9-family-e-area-import-fix.yml \
            .github/workflows/c9-family-e-selector-verify.yml \
            .github/workflows/c9-family-e-selector-full-verify.yml; do
            if [ -f "$file" ]; then git rm "$file"; fi
          done
          git commit -m "fix(c9): preserve rich selector outside operation IR"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
