name: C9 Retrigger Family E 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-retrigger-family-e-7130.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Retrigger authoritative selector verifier and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/c9-family-e-authoritative-selector-facts-7130.yml')
          text=path.read_text()
          marker='# retrigger: area-error-contract-v4\n'
          if marker not in text:
              path.write_text(text + '\n' + marker)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-retrigger-family-e-7130.yml
          git add .github/workflows/c9-family-e-authoritative-selector-facts-7130.yml
          git commit -m "ci(c9): rerun authoritative selector verification"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 8); do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin HEAD:"$branch"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
