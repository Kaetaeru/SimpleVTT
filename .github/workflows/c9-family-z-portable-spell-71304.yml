name: C9 Family Z Portable Spell 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - tests/ui/c9FamilyZPortableSpellProduction.test.ts
      - .github/workflows/c9-family-z-portable-spell-71304.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify portable spell production path
        run: node --import tsx --test tests/ui/c9FamilyZPortableSpellProduction.test.ts
      - name: Verify Gate N evidence contract
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npm exec tsc -- --noEmit
