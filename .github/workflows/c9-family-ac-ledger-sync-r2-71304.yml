name: C9 Family AC Ledger Sync R2 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-ac-ledger-sync-r2-71304.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Assert published authoring contract
        shell: bash
        run: |
          grep -q 'CommonPlaySpecialActionAuthoringDefinition' src/domain/commonPlaySpecialTimingRuntime.ts
          grep -q 'specialActions' src/domain/commonPlayDefinitionRuntime.ts
          grep -q 'specialActions' schemas/common-play-contract.schema.json
          grep -q 'portable special timing authoring binds owner at runtime' tests/domain/commonPlayC6Runtime.test.ts
      - name: Reconcile Family AC verified evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item['family']=='AC')
          assert row['disposition']=='INCOMPLETE'
          row['currentState']=(
            'Kernel compilation validates owner-authorized turn/after-turn/initiative-count timing, option selection, cost, and generic Resolver payloads. '
            'Common Play now also persists owner-neutral specialActions authoring for turn-start/turn-end/after-turn/initiative-count timing, reusable entry-point options, optional resource pools, and per-option cost; session actor identity is intentionally bound only at runtime. '
            'Authoritative RuntimeClock still lacks initiative-count progression and production still lacks a generic session dispatcher/replay-reconnect path for portable special actions, so the family remains incomplete.'
          )
          implementation='3a101b51ab99bbb3f4e5acffd9501fb7eabc7e36: portable specialActions authoring schema/parser with runtime-bound ownership and entryPointId option references'
          persistence='C9 Family AC Authoring Contract R2 run 33313341650 job 99262204177: installed Common Play persistence/rehydration/session-sync regression passed with portable special timing mechanic'
          if implementation not in row['implementationEvidence']:
            row['implementationEvidence'].append(implementation)
          if persistence not in row['persistenceEvidenceIfRelevant']:
            row['persistenceEvidenceIfRelevant'].append(persistence)
          row['remainingNamedSeams']=[
            'authoritative initiative-count event source and refresh/order semantics',
            'session timing dispatcher plus connected off-turn interaction/replay/reconnect'
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish ledger sync and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-ac-ledger-sync-r2-71304.yml
          git commit -m 'docs(c9): record Family AC authoring coverage'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
