name: C9 Family J Attack Replacement 71304 R2

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-attack-replacement-71304-r2.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix projected action identity and add replacement acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime=Path('src/app/phase09RealResolutionAdapter.ts')
          text=runtime.read_text(encoding='utf-8')
          marker='''function migratedResolutionAction(action:ActionVm) {\n  return action.resolutionKind === "ability-check"\n    || action.resolutionKind === "attack"\n    || action.resolutionKind === "healing";\n}\n'''
          helper='''function migratedResolutionAction(action:ActionVm) {\n  return action.resolutionKind === "ability-check"\n    || action.resolutionKind === "attack"\n    || action.resolutionKind === "healing";\n}\n\nasync function projectedAction(internal:Phase09ResolutionAdapterState,actionId:string) {\n  const canonical=internal.action(actionId);\n  if (canonical) return canonical;\n  const snapshot=await internal.getSnapshot();\n  return Object.values(snapshot.scene.actionsByActor).flat().find((action)=>action.id===actionId);\n}\n'''
          if helper not in text:
              if marker not in text: raise SystemExit('migratedResolutionAction marker missing')
              text=text.replace(marker,helper,1)
          text=text.replace('''  const action = internal.action(actionId);\n  if (!action || !migratedResolutionAction(action)) {''','''  const action = await projectedAction(internal,actionId);\n  if (!action || !migratedResolutionAction(action)) {''',1)
          text=text.replace('''  const action = internal.action(resolution.actionId);\n  if (!action) return oldAdvanceResolution.call(this);''','''  const action = await projectedAction(internal,resolution.actionId);\n  if (!action) return oldAdvanceResolution.call(this);''',1)
          runtime.write_text(text,encoding='utf-8')

          test_file=Path('tests/ui/unarmedStrikeRuntime.test.ts')
          text=test_file.read_text(encoding='utf-8')
          text=text.replace('''assert.equal(snapshot.scene.economyByActor["char.aelar"]?.extraAttacks?.length,0);''','''assert.equal(snapshot.scene.economyByActor["char.aelar"]?.extraAttacks?.length??0,0);''')
          test_file.write_text(text,encoding='utf-8')

          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          text=ledger.read_text(encoding='utf-8')
          old='''Family J remains incomplete for complete Unarmed Strike source composition, Opportunity Attack qualification, reach/long range, Extra Attack/replacement, . Portable source-owned ammunition now composes through the generic resource PaymentContract with attack execution, including empty-ammunition atomic rejection, event-native Undo, and complete external identity rename. Loading now constrains structurally linked weapon action projection from the source weapon property itself, so a Loading weapon is capped at one attack without presentation-name or content-action-ID dispatch. Portable Extra Attack economy composes through structural attacksPerAction into the existing attack-only extraAttacks Resolver primitive, including projected availability, exhaustion, Undo, and complete external identity rename. Portable Extra Attack economy composes through structural actionKind/attacksPerAction into the existing attack-only extraAttacks Resolver primitive, including production projection availability, exhaustion, Undo, and complete external identity rename.'''
          new='''Family J remains incomplete for complete Unarmed Strike/grapple-shove source composition and remaining named attack/action projection migration debt. Opportunity Attack, reach/long range/cover, source-owned ammunition, Loading, portable Extra Attack, and attack replacement now compose through structural runtime facts and the shared Resolver without content identity dispatch.'''
          if old in text:
              text=text.replace(old,new,1)
          seam='''        "attack replacement remains incomplete; reach/long range and structural cover are now generic and verified",'''
          if seam in text:
              text=text.replace(seam,'''        "attack replacement, reach/long range, and structural cover are now generic and verified",''',1)
          evidence='''        "c9FamilyJExtraAttackProduction71304.test.ts proves an unknown installed attack uses one standard Action for two sequential production attack transactions, blocks a third, and restores the consumed extra attack plus damage through event-native Undo"'''
          if evidence in text and 'c9FamilyJAttackReplacementProduction71304R2.test.ts proves' not in text:
              text=text.replace(evidence,evidence+''',\n        "c9FamilyJAttackReplacementProduction71304R2.test.ts proves renamed Unarmed grapple/shove replace individual attack slots, reject after exhaustion, and restore the consumed replacement through event-native Undo"''',1)
          ledger.write_text(text,encoding='utf-8')
          PY
          cat > tests/ui/c9FamilyJAttackReplacementProduction71304R2.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          async function ready(adapter:MockAdapter) {
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            await adapter.selectDmActor("char.aelar");
          }

          function hasStatus(snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>,targetId:string,text:string) {
            return snapshot.scene.entities.find((entry)=>entry.id===targetId)?.status.some((status)=>status.includes(text))??false;
          }

          test("renamed Unarmed grapple can replace the first attack and renamed shove can replace the Extra Attack, with Undo restoring the grant",async()=>{
            const adapter=new MockAdapter();
            await ready(adapter);
            const renamedGrapple="action.external.family-j-replacement.control-a";
            const renamedShove="action.external.family-j-replacement.control-b";
            const originalGetSnapshot=adapter.getSnapshot.bind(adapter);
            adapter.getSnapshot=async()=>{
              const snapshot=await originalGetSnapshot();
              const actions=snapshot.scene.actionsByActor["char.aelar"]??[];
              const grapple=actions.find((entry)=>entry.id==="action.unarmed-strike.grapple");
              const shove=actions.find((entry)=>entry.id==="action.unarmed-strike.shove-prone");
              if(grapple){grapple.id=renamedGrapple;grapple.name="External Control Alpha";}
              if(shove){shove.id=renamedShove;shove.name="External Control Beta";}
              return snapshot;
            };

            await adapter.setQueuedD20(1);
            await adapter.resolveAction(renamedGrapple,["combatant.goblin-a"]);
            let snapshot=await adapter.getSnapshot();
            let state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(snapshot.resolution?.actionId,renamedGrapple);
            assert.equal(hasStatus(snapshot,"combatant.goblin-a","붙잡힘"),true);
            assert.equal(state.combatants["char.aelar"].economy.action,false);
            assert.equal(state.combatants["char.aelar"].economy.extraAttacks?.length,1);

            await adapter.setQueuedD20(1);
            await adapter.resolveAction(renamedShove,["combatant.goblin-b"]);
            snapshot=await adapter.getSnapshot();
            state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(snapshot.resolution?.actionId,renamedShove);
            assert.equal(hasStatus(snapshot,"combatant.goblin-b","넘어짐"),true);
            assert.equal(state.combatants["char.aelar"].economy.action,false);
            assert.equal(state.combatants["char.aelar"].economy.extraAttacks?.length,0);

            const revisionAfterSecond=state.revision;
            await adapter.setQueuedD20(1);
            await adapter.resolveAction(renamedGrapple,["combatant.goblin-b"]);
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.revision,revisionAfterSecond);
            assert.equal(hasStatus(snapshot,"combatant.goblin-b","붙잡힘"),false);

            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(hasStatus(snapshot,"combatant.goblin-b","넘어짐"),false);
            assert.equal(hasStatus(snapshot,"combatant.goblin-a","붙잡힘"),true);
            assert.equal(state.combatants["char.aelar"].economy.action,false);
            assert.equal(state.combatants["char.aelar"].economy.extraAttacks?.length,1);
          });
          EOF
      - name: Verify Family J attack replacement
        run: |
          npm run generate:content
          node --import tsx --test tests/ui/c9FamilyJAttackReplacementProduction71304R2.test.ts tests/ui/unarmedStrikeRuntime.test.ts tests/ui/c9FamilyJExtraAttackProduction71304.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified acceptance and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-j-attack-replacement-71304-r2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add src/app/phase09RealResolutionAdapter.ts tests/ui/unarmedStrikeRuntime.test.ts tests/ui/c9FamilyJAttackReplacementProduction71304R2.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "fix(c9): resolve projected unarmed attack identities"
          for attempt in $(seq 1 10); do
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 1
          done
          exit 1
