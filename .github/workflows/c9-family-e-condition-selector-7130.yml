name: C9 Family E Condition Selector 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-condition-selector-7130.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Reconcile latest branch before editing
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git fetch origin "$branch"
          git rebase "origin/$branch"
      - name: Add condition selector production proof and ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/ui/c9FamilyEConditionSelectorProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/installedContentRuntimeAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";

          type Identity={moduleId:string;contentId:string;mechanicId:string;entryPointId:string;displayName:string};
          const ORIGINAL:Identity={moduleId:"homebrew.family-e-condition",contentId:"option.family-e-condition",mechanicId:"external.unknown.family-e-condition",entryPointId:"condition-target",displayName:"Condition Target"};
          const RENAMED:Identity={moduleId:"homebrew.renamed-family-e-condition",contentId:"option.renamed-family-e-condition",mechanicId:"external.renamed.family-e-condition",entryPointId:"renamed-condition-target",displayName:"Renamed Condition Target"};
          const CONDITION="condition:restrained";

          function payload(identity:Identity) {
            return JSON.stringify({
              schemaVersion:"0.1-draft",moduleId:identity.moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family E Condition Selector Probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{
                id:identity.contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:identity.displayName,locales:{en:{name:identity.displayName}}},
                mechanics:[{kind:"common-play",config:{
                  schemaVersion:"0.2-draft",id:identity.mechanicId,
                  entryPoints:[{id:identity.entryPointId,invocation:"manual",targeting:{
                    from:"targets",
                    where:{op:"contains",left:{ref:"status"},right:{value:CONDITION}},
                    min:1,max:1,
                  },operations:[]}],
                }}],
              }],
            });
          }

          async function execute(identity:Identity) {
            const adapter=new MockAdapter();
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const internal=adapter as unknown as {scene:{entities:Array<{id:string;name:string;status:string[]}>}};
            const restrained=internal.scene.entities.find((entity)=>entity.id==="combatant.goblin-a");
            assert.ok(restrained);
            restrained.status.push(CONDITION);

            const preview=await adapter.previewContentImport(payload(identity));
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");

            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(identity.contentId,identity.moduleId,"1"),
              mechanicId:identity.mechanicId,entryPointId:identity.entryPointId,
            });
            await adapter.resolveAction(actionId,["combatant.goblin-b"]);
            let snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.actionId,actionId);
            assert.equal(snapshot.resolution?.finalOutcome,"적용 거부");

            restrained.name=`renamed-target-${identity.moduleId}`;
            await adapter.resolveAction(actionId,["combatant.goblin-a"]);
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete");
            assert.equal(snapshot.resolution?.actionId,actionId);
            assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a"]);
            return snapshot.resolution?.targetIds;
          }

          test("unknown installed Common Play condition selector consumes authoritative Scene status and survives identity rename",async()=>{
            const original=await execute(ORIGINAL);
            const renamed=await execute(RENAMED);
            assert.deepEqual(renamed,original);
          });
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          family=next(entry for entry in data['rows'] if entry.get('family')=='E')
          family['currentState']=family['currentState'].replace(
            'through the shared selector kernel;',
            'through the shared selector kernel, including authoritative Scene status/condition membership;'
          )
          evidence='installedCommonPlayRuntimeAdapter.ts supplies authoritative Scene status[] candidate properties consumed by generic contains predicates for condition/status membership'
          if evidence not in family['implementationEvidence']:
            family['implementationEvidence'].append(evidence)
          prod='c9FamilyEConditionSelectorProduction.test.ts unknown installed condition selector rejects a target without the runtime-owned Scene status, accepts the matching target, and preserves behavior across arbitrary module/content/mechanic/entry/display identity rename'
          if prod not in family['productionEvidence']:
            family['productionEvidence'].append(prod)
          identity='c9FamilyEConditionSelectorProduction.test.ts completely renamed external identities preserve condition/status selector semantics through the same generic contains predicate path'
          if identity not in family['identityInvarianceEvidence']:
            family['identityInvarianceEvidence'].append(identity)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify Family E condition selector slice
        run: >-
          node --import tsx --test
          tests/ui/c9FamilyEConditionSelectorProduction.test.ts
          tests/ui/c9FamilyETagSelectorProduction.test.ts
          tests/ui/commonPlayRichSelectorProduction.test.ts
      - name: Verify repository boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified proof and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/c9FamilyEConditionSelectorProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git rm -f .github/workflows/c9-family-e-condition-selector-7130.yml
          git diff --cached --check
          git commit -m "test(c9): prove Family E condition selector production"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            npm run generate:content
            node --import tsx --test tests/ui/c9FamilyEConditionSelectorProduction.test.ts tests/ui/c9FamilyETagSelectorProduction.test.ts tests/ui/commonPlayRichSelectorProduction.test.ts
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            npm exec tsc -- --noEmit
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
          done
          echo "publish failed after 3 verified fast-forward retries" >&2
          exit 1
