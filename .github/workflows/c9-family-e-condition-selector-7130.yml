name: C9 Family E Condition Selector 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-condition-selector-7130.yml
      - tests/ui/c9FamilyEConditionSelectorProduction.test.ts
      - src/domain/commonPlaySelectorRuntime.ts
      - src/app/installedCommonPlayRuntimeAdapter.ts
      - docs/rules/v1-mechanism-coverage-ledger.json

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family E condition selector production
        run: npx tsx --test tests/ui/c9FamilyEConditionSelectorProduction.test.ts
      - name: Verify V1 mechanism coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
