name: C9 Family H Normal Sight Composition 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-h-normal-sight-composition-71304.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile latest branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Family H normal sight composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime=Path('src/app/commonPlayInterceptorProductionRuntimeAdapter.ts')
          text=runtime.read_text()
          import_anchor='''import { authoritativeCommonPlaySpatialRelation } from "./realSpatialRuntimeService";\n'''
          import_line='''import { resolveCommonPlaySenses } from "../domain/commonPlaySenseRuntime";\n'''
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('sense runtime import anchor changed')
              text=text.replace(import_anchor,import_anchor+import_line,1)
          old='''      if(query.fact==="sense.can-see")return {status:"answered",value:relation.visible};'''
          new='''      if(query.fact==="sense.can-see"){\n        if(relation.light===undefined||relation.obscurement===undefined)return {status:"answered",value:relation.visible};\n        const composed=resolveCommonPlaySenses([{kind:"normal-sight"}],{\n          distanceFeet:relation.distanceFeet,\n          light:relation.light==="darkness"?"dark":relation.light,\n          obscurement:relation.obscurement,\n          lineOfSight:relation.visible,\n          lineOfEffect:relation.cover!=="total",\n          targetInvisible:false,\n          targetHidden:false,\n          targetAudible:false,\n          observerCanHear:false,\n          sharedGroundContact:false,\n        });\n        return {status:"answered",value:composed.canSee};\n      }'''
          if old not in text:
              if new not in text:
                  raise SystemExit('sense.can-see production anchor changed')
          else:
              text=text.replace(old,new,1)
          runtime.write_text(text)

          test=Path('tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts')
          text=test.read_text()
          old='''  selection?:{families?:Array<"ability-check"|"saving-throw"|"attack-roll">;outcomes?:Array<"success"|"failure">},\n){'''
          new='''  selection?:{families?:Array<"ability-check"|"saving-throw"|"attack-roll">;outcomes?:Array<"success"|"failure">},\n  eligibilityExpectations:{light?:"bright"|"dim"|"darkness";obscurement?:"none"|"light"|"heavy"}={},\n){'''
          if text.count(old)<2:
              raise SystemExit(f'expected package/prepare signature anchors twice, found {text.count(old)}')
          text=text.replace(old,new,2)
          old='''                {op:"eq",left:{ref:"trigger-light"},right:{value:"dim"}},\n                {op:"eq",left:{ref:"trigger-obscurement"},right:{value:"none"}},'''
          new='''                {op:"eq",left:{ref:"trigger-light"},right:{value:eligibilityExpectations.light??"dim"}},\n                {op:"eq",left:{ref:"trigger-obscurement"},right:{value:eligibilityExpectations.obscurement??"none"}},'''
          if old not in text:
              raise SystemExit('eligibility expectation anchor changed')
          text=text.replace(old,new,1)
          old='''  const preview=await adapter.previewContentImport(packagePayload(identity,withEligibility,interceptorKind,operations,selection));'''
          new='''  const preview=await adapter.previewContentImport(packagePayload(identity,withEligibility,interceptorKind,operations,selection,eligibilityExpectations));'''
          if old not in text:
              raise SystemExit('prepare packagePayload anchor changed')
          text=text.replace(old,new,1)
          anchor='''test("portable damage-roll interceptor reduces authoritative production damage and Undo restores HP, resource, and Reaction",async()=>{'''
          addition='''test("portable production normal sight composes authoritative lighting and obscurement",async()=>{\n  const operations=[{kind:"roll.modify",mode:"subtract-die",dice:"1d8"}];\n  const scenarios=[\n    {label:"darkness",light:"darkness" as const,obscurement:"none" as const},\n    {label:"heavy obscurement",light:"dim" as const,obscurement:"heavy" as const},\n  ];\n  for(const scenario of scenarios){\n    const adapter=await prepare(ORIGINAL,true,"d20",operations,undefined,{light:scenario.light,obscurement:scenario.obscurement});\n    const internal=adapter as unknown as {activeCharacter:CharacterSheet;scene:SceneVm};\n    setSpatialRelation(internal.scene,{\n      sourceId:internal.activeCharacter.id,targetId:OTHER_CHARACTER_ID,distanceFeet:30,visible:true,cover:"none",targetCanSeeAttacker:true,\n      light:scenario.light,obscurement:scenario.obscurement,detected:true,provenance:`module:test-${scenario.label}:spatial`,\n    });\n    seedHiddenRuntimeEffect(adapter,OTHER_CHARACTER_ID);\n    const snapshot=await openAbilityCheckInterrupt(adapter);\n    assert.notEqual(snapshot.resolution?.stage,"interrupt",`normal sight must reject ${scenario.label} even when raw line of sight is true`);\n  }\n});\n\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('Family H production test anchor changed')
              text=text.replace(anchor,addition+anchor,1)
          test.write_text(text)
          PY
      - run: npm install --no-audit --no-fund
      - name: Verify sensing kernel and production composition
        run: npx tsx --test tests/domain/commonPlaySenseRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify C9 coverage structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Record Family H evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text())
          row=next(row for row in data['rows'] if row['family']=='H')
          row['currentState']=(
            'Generic status and creature-type awareness paths are production-proven. Common Play defines standard sensing facts for can-see, can-hear, detected, light, obscurement, and hidden with identity-independent provider provenance and connected owner-authority routing. Resolver-owned session Hidden effects feed sense.hidden, unknown external Hide-style status actions commit Hidden as authoritative Effect StateChanges, and endsOnAttack reveal removes that Effect through the same event path with event-native Undo. Provider-authored line-of-sight, lighting, and obscurement now compose through the shared normal-sight sensing kernel before production answers sense.can-see. Family H remains incomplete for special senses, Invisible interactions, detection/Search, and discovery semantics.'
          )
          implementation='commonPlayInterceptorProductionRuntimeAdapter.ts composes provider-authored line-of-sight/light/obscurement through resolveCommonPlaySenses normal-sight before answering sense.can-see'
          production='installedCommonPlayInterceptorProductionRuntime.test.ts proves raw visible=true is insufficient for normal sight in authoritative darkness or heavy obscurement while preserving external Common Play fact routing'
          if implementation not in row['implementationEvidence']: row['implementationEvidence'].append(implementation)
          if production not in row['productionEvidence']: row['productionEvidence'].append(production)
          row['remainingNamedSeams']=[
            'live sanctity facts',
            'rules-derived special senses, Invisible interactions, detection/Search, and discovery semantics remain incomplete',
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified Family H progress
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c9-family-h-normal-sight-composition-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/commonPlayInterceptorProductionRuntimeAdapter.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-h-normal-sight-composition-71304.yml
          git commit -m "feat(c9): compose normal sight sensing facts"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
