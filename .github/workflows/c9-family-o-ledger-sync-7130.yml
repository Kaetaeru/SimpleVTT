# retrigger after rows-key repair
name: C9 Family O Ledger Sync 7130

on:
  push:
    paths:
      - '.github/workflows/c9-family-o-ledger-sync-7130.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record verified Family O evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const family=ledger.rows.find((entry)=>entry.family==='O');
          if(!family) throw new Error('Family O not found');
          family.currentState='Generic concentration kernel plus portable maintained-effect lowering now compose through the shared Resolver. Unknown installed RuleModule activation, Host/client replay, duplicate handling, Undo, fresh reconnect, and rename invariance are proven. Readied/long-cast concentration setup remains incomplete.';
          family.implementationEvidence=[
            'commonPlayEffectRuntime.ts maintained concentration lowering through shared start-concentration + apply-effect operations',
            'concentration.ts generic single-source replacement and damage save/DC behavior',
            'resolutionEffectOps.ts concentration replacement, incap/death end, and dependent-effect cleanup'
          ];
          family.productionEvidence=[
            'c9FamilyOConcentrationProduction.test.ts unknown installed maintained concentration production activation and Undo',
            'concentrationDamageResult.test.ts reversible damage-save concentration cleanup'
          ];
          family.identityInvarianceEvidence=[
            'commonPlayEffectRuntime.test.ts arbitrary renamed portable concentration definitions',
            'c9FamilyOConcentrationProduction.test.ts renamed unknown installed identities preserve production semantics'
          ];
          family.connectedEvidenceIfRelevant=[
            'c9FamilyOConcentrationProduction.test.ts Host/client event replay, duplicate handling, and Undo convergence'
          ];
          family.persistenceEvidenceIfRelevant=[
            'c9FamilyOConcentrationProduction.test.ts fresh replica reconnect from authoritative Host ledger after Undo'
          ];
          family.remainingNamedSeams=[
            'readied/long-cast concentration setup still originates from spell/stored-invocation-specific setup outside portable maintained-effect activation'
          ];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
      - name: Verify ledger remains authoritative and valid
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          git diff --check
      - name: Commit verified ledger sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/c9-family-o-ledger-sync-7130.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-o-ledger-sync-7130.yml
          git commit -m "docs(c9): record Family O concentration evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
