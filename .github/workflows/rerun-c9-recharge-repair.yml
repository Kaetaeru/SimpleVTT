name: C9 Recharge Production Repair

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/rerun-c9-recharge-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Complete portable Recharge turn wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def ensure(path, marker, old, new):
              p=Path(path)
              text=p.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing Recharge patch anchor in {path}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1))

          runtime="src/domain/commonPlayOperationRuntime.ts"
          ensure(runtime,'type CommonPlayRechargeResource={','type CommonPlayEconomyModify={','type CommonPlayRechargeResource={\n  kind:"resource.recharge";\n  resource:string;\n  die:{sides:number};\n  succeedsOn:{minimum:number;maximum?:number};\n};\n\ntype CommonPlayEconomyModify={')
          ensure(runtime,'  |CommonPlayRechargeResource\n','  |CommonPlayResourceChange\n  |CommonPlayEconomyModify','  |CommonPlayResourceChange\n  |CommonPlayRechargeResource\n  |CommonPlayEconomyModify')
          ensure(runtime,'  rechargeDiceFaces?:Record<number,number[]>;','  damageDiceFaces?:Record<number,number[]>;\n  movementFactAnswers?:Record<number,CommonPlayFactAnswer>;','  damageDiceFaces?:Record<number,number[]>;\n  rechargeDiceFaces?:Record<number,number[]>;\n  movementFactAnswers?:Record<number,CommonPlayFactAnswer>;')
          ensure(runtime,'const RESOURCE_RECHARGE_KEYS=', 'const RESOURCE_CHANGE_KEYS=new Set(["kind","resource","amount","target"]);\nconst ECONOMY_MODIFY_KEYS', 'const RESOURCE_CHANGE_KEYS=new Set(["kind","resource","amount","target"]);\nconst RESOURCE_RECHARGE_KEYS=new Set(["kind","resource","die","succeedsOn"]);\nconst RECHARGE_DIE_KEYS=new Set(["sides"]);\nconst RECHARGE_RANGE_KEYS=new Set(["minimum","maximum"]);\nconst ECONOMY_MODIFY_KEYS')
          ensure(runtime,'unsupported Common Play operation: ${String(operation.kind)}', '  if(operation.kind==="damage.apply") {', '  if(operation.kind==="resource.recharge") {\n    supportedKeys(operation,RESOURCE_RECHARGE_KEYS,label);\n    const resource=nonEmptyString(operation.resource,`${label}.resource`);\n    const die=object(operation.die,`${label}.die`);\n    supportedKeys(die,RECHARGE_DIE_KEYS,`${label}.die`);\n    if(!Number.isInteger(die.sides)||Number(die.sides)<2||Number(die.sides)>20) throw new DomainEvaluationError(`${label}.die.sides must be an integer between 2 and 20`);\n    const succeedsOn=object(operation.succeedsOn,`${label}.succeedsOn`);\n    supportedKeys(succeedsOn,RECHARGE_RANGE_KEYS,`${label}.succeedsOn`);\n    if(!Number.isInteger(succeedsOn.minimum)) throw new DomainEvaluationError(`${label}.succeedsOn.minimum must be an integer`);\n    if(succeedsOn.maximum!==undefined&&!Number.isInteger(succeedsOn.maximum)) throw new DomainEvaluationError(`${label}.succeedsOn.maximum must be an integer`);\n    const minimum=Number(succeedsOn.minimum);\n    const maximum=succeedsOn.maximum===undefined?undefined:Number(succeedsOn.maximum);\n    const upper=maximum??Number(die.sides);\n    if(minimum<1||upper>Number(die.sides)||minimum>upper) throw new DomainEvaluationError(`${label}.succeedsOn must fit within the recharge die`);\n    return {kind:"resource.recharge",resource,die:{sides:Number(die.sides)},succeedsOn:{minimum,...(maximum===undefined?{}:{maximum})}};\n  }\n  if(operation.kind==="damage.apply") {')
          ensure(runtime,'Common Play recharge operation ${index} requires exactly one authoritative die face','    if(operation.kind==="resource.change") {','    if(operation.kind==="resource.recharge") {\n      const faces=input.rechargeDiceFaces?.[index];\n      if(!faces||faces.length!==1) throw new DomainEvaluationError(`Common Play recharge operation ${index} requires exactly one authoritative die face`);\n      operations.push({\n        id:operationId,kind:"recharge-resource",actorId:input.actorId,resourceId:operation.resource,timing:"turn-start",\n        die:{sides:operation.die.sides,faces:[faces[0]]},succeedsOn:{...operation.succeedsOn},\n      });\n      continue;\n    }\n    if(operation.kind==="resource.change") {')

          composition="src/app/commonPlayActorTurnRuleComposition.ts"
          ensure(composition,'resource.change or resource.recharge only','    if(record.kind!=="resource.change") {\n      throw new DomainEvaluationError(`Common Play actor turn rule ${value.id} currently supports resource.change only`);\n    }','    if(record.kind!=="resource.change"&&record.kind!=="resource.recharge") {\n      throw new DomainEvaluationError(`Common Play actor turn rule ${value.id} currently supports resource.change or resource.recharge only`);\n    }')
          ensure(composition,'rechargeDieFace?:(ruleId:string,operationIndex:number,sides:number)=>number;','  input:{id:string;kind:TurnBoundaryKind;actorId:string},\n):ResolutionOperation[] {','  input:{\n    id:string;kind:TurnBoundaryKind;actorId:string;\n    rechargeDieFace?:(ruleId:string,operationIndex:number,sides:number)=>number;\n  },\n):ResolutionOperation[] {')
          ensure(composition,'const rechargeDiceFaces=Object.fromEntries','      const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,definition,{\n        resolutionId,actorId:input.actorId,entryPointId,\n      });','      const rechargeDiceFaces=Object.fromEntries(rule.operations.flatMap((operation,index)=>{\n        if(operation.kind!=="resource.recharge") return [];\n        const die=operation.die as {sides?:unknown}|undefined;\n        if(!die||!Number.isInteger(die.sides)||Number(die.sides)<2||Number(die.sides)>20) throw new DomainEvaluationError(`Common Play actor turn rule ${rule.id} has an invalid recharge die`);\n        if(!input.rechargeDieFace) throw new DomainEvaluationError(`Common Play actor turn rule ${rule.id} requires authoritative recharge die input`);\n        return [[index,[input.rechargeDieFace(rule.id,index,Number(die.sides))]]];\n      }));\n      const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,definition,{\n        resolutionId,actorId:input.actorId,entryPointId,\n        ...(Object.keys(rechargeDiceFaces).length?{rechargeDiceFaces}:{}),\n      });')

          turn="src/app/phase09EffectAwareTurnAdapter.ts"
          ensure(turn,'function authoritativeRechargeFace(', 'function eventId() {\n  return `phase09.turn-lifecycle.${Date.now()}.${Math.floor(Math.random()*1000)}`;\n}', 'function eventId() {\n  return `phase09.turn-lifecycle.${Date.now()}.${Math.floor(Math.random()*1000)}`;\n}\n\nfunction authoritativeRechargeFace(adapter:MockAdapter,actionId:string,sides:number,drawIndex:{value:number}) {\n  const internal=adapter as unknown as EffectAwareTurnAdapterState;\n  const limit=20-(20%sides);\n  let face:number;\n  do face=internal.d20(actionId,drawIndex.value++); while(face>limit);\n  return ((face-1)%sides)+1;\n}')
          ensure(turn,'const rechargeDrawIndex={value:0};','  const actorTurnRules=await installedCommonPlayActorTurnRuleBindings(this,session.state);\n  const advanced=advanceTurnRuntimeLifecycle(session,(boundary)=>[','  const actorTurnRules=await installedCommonPlayActorTurnRuleBindings(this,session.state);\n  const rechargeDrawIndex={value:0};\n  const advanced=advanceTurnRuntimeLifecycle(session,(boundary)=>[')
          ensure(turn,'rechargeDieFace:(_ruleId,_operationIndex,sides)=>authoritativeRechargeFace','    ...compileInstalledCommonPlayActorTurnRuleOperations(boundary.state,actorTurnRules,{\n      id:boundary.resolutionId,kind:boundary.kind,actorId:boundary.actorId,\n    }),','    ...compileInstalledCommonPlayActorTurnRuleOperations(boundary.state,actorTurnRules,{\n      id:boundary.resolutionId,kind:boundary.kind,actorId:boundary.actorId,\n      rechargeDieFace:(_ruleId,_operationIndex,sides)=>authoritativeRechargeFace(this,`${boundary.resolutionId}:recharge`,sides,rechargeDrawIndex),\n    }),')

          test="tests/ui/connectedActorTurnRuleProduction.test.ts"
          ensure(test,'{kind:"resource.recharge",resource:resourceId,die:{sides:6},succeedsOn:{minimum:1,maximum:6}},','        {kind:"resource.change",resource:resourceId,amount:{value:1},target:"actor"},','        {kind:"resource.recharge",resource:resourceId,die:{sides:6},succeedsOn:{minimum:1,maximum:6}},')
          ensure(test,'turn-start Recharge Common Play rule is invariant','turn-start Common Play rule is invariant','turn-start Recharge Common Play rule is invariant')
          ensure(test,'turn-start Recharge rule converges','turn-start rule converges','turn-start Recharge rule converges')
          PY
      - run: npm run generate:content
      - name: Verify Recharge connected production
        run: npx tsx --test tests/ui/connectedActorTurnRuleProduction.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Commit verified Recharge slice
        run: |
          rm -f .github/workflows/rerun-c9-recharge-production.yml .github/workflows/rerun-c9-recharge-repair.yml
          git config user.name "ChatGPT Rerun"
          git config user.email "chatgpt-rerun@users.noreply.github.com"
          git add -A
          git commit -m "feat(c9): route portable recharge through turn lifecycle"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
