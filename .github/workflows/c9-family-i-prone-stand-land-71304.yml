name: C9 Family I Prone Stand Landing 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-prone-stand-land-71304.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare idempotent Family I patcher
        shell: bash
        run: |
          cat > /tmp/apply-prone.py <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding="utf-8")
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1),encoding="utf-8")

          path=Path("src/domain/commonPlayOperationRuntime.ts")
          text=path.read_text(encoding="utf-8")
          if 'type CommonPlayMovementStand=' not in text:
              replace_once(path,'import type { RulesRuntimeState } from "./combatState";','import { conditionEffectsFor, type RulesRuntimeState } from "./combatState";')
              replace_once(path,'import { compileCommonPlayMovement, type CommonPlayMovementDefinition } from "./commonPlayMovementRuntime";','import { compileCommonPlayMovement, type CommonPlayMovementDefinition } from "./commonPlayMovementRuntime";\nimport { effectiveSpeed, proneStandingCost } from "./conditions";\nimport { effectIsActive } from "./effects";')
              replace_once(path,'type CommonPlayHpTarget="actor"|"self"|"target";','type CommonPlayHpTarget="actor"|"self"|"target";\ntype CommonPlayMovementStand={kind:"movement.stand";target:"actor"|"self"};')
              replace_once(path,'  |CommonPlayMovementDefinition\n  |CommonPlayRollModify;','  |CommonPlayMovementDefinition\n  |CommonPlayMovementStand\n  |CommonPlayRollModify;')
              replace_once(path,'const MOVEMENT_RELOCATE_KEYS=new Set(["kind","mode","movementType","target","distance","costMultiplier","doesNotProvokeOpportunityAttacks","destinationFact"]);','const MOVEMENT_RELOCATE_KEYS=new Set(["kind","mode","movementType","target","distance","costMultiplier","doesNotProvokeOpportunityAttacks","destinationFact"]);\nconst MOVEMENT_STAND_KEYS=new Set(["kind","target"]);')
              text=path.read_text(encoding="utf-8")
              parse_start=text.index('function parseOperation(')
              parse_marker='  if(operation.kind==="movement.relocate") {\n'
              parse_index=text.index(parse_marker,parse_start)
              stand_parse='''  if(operation.kind==="movement.stand") {\n    supportedKeys(operation,MOVEMENT_STAND_KEYS,label);\n    if(operation.target!=="actor"&&operation.target!=="self") throw new DomainEvaluationError(`${label}.target must be actor or self`);\n    return {kind:"movement.stand",target:operation.target};\n  }\n'''
              text=text[:parse_index]+stand_parse+text[parse_index:]
              path.write_text(text,encoding="utf-8")
              text=path.read_text(encoding="utf-8")
              compile_start=text.index('export function compileCommonPlayEntryPointOperations(')
              compile_marker='    if(operation.kind==="movement.relocate") {\n'
              compile_index=text.index(compile_marker,compile_start)
              stand_compile='''    if(operation.kind==="movement.stand") {\n      const actor=state.combatants[input.actorId];\n      if(!actor) throw new DomainEvaluationError(`combatant not found: ${input.actorId}`);\n      const conditions=conditionEffectsFor(state,input.actorId);\n      const proneEffects=state.effects.filter((effect)=>\n        effectIsActive(effect)&&effect.targetId===input.actorId&&effect.kind==="condition"&&effect.conditionId==="prone"\n      );\n      if(!proneEffects.length) throw new DomainEvaluationError("movement.stand requires an active explicit Prone condition");\n      const speed=effectiveSpeed(actor.economy.movementMaximum,conditions);\n      const cost=proneStandingCost(speed,conditions);\n      if(cost<=0) throw new DomainEvaluationError("movement.stand requires positive effective speed");\n      operations.push({id:operationId,kind:"move",actorId:input.actorId,distanceFeet:cost,distanceTraveledFeet:0,movementActivity:"stand"});\n      proneEffects.forEach((effect,proneIndex)=>operations.push({id:`${operationId}:remove-prone:${proneIndex}`,kind:"remove-effect",effectId:effect.id}));\n      continue;\n    }\n'''
              text=text[:compile_index]+stand_compile+text[compile_index:]
              path.write_text(text,encoding="utf-8")

          path=Path("src/domain/resolutionTypes.ts")
          text=path.read_text(encoding="utf-8")
          if 'movementActivity?:"relocate"|"stand";' not in text:
              replace_once(path,'      distanceTraveledFeet?:number;\n      destinationRef?:string;','      distanceTraveledFeet?:number;\n      movementActivity?:"relocate"|"stand";\n      destinationRef?:string;')

          path=Path("src/domain/resolutionActionOps.ts")
          text=path.read_text(encoding="utf-8")
          if 'movementActivity==="stand"' not in text:
              replace_once(path,'      reason:`${actorId} moves ${operation.distanceFeet} ft`,','      reason:operation.movementActivity==="stand"\n        ? `${actorId} spends ${operation.distanceFeet} ft of movement to stand`\n        : `${actorId} moves ${operation.distanceFeet} ft`,')
              replace_once(path,'    ...(operation.distanceTraveledFeet===undefined?{}:{movementCostFeet:operation.distanceFeet}),\n    ...(operation.movementMode?{movementMode:operation.movementMode}:{}),','    ...(operation.distanceTraveledFeet===undefined?{}:{movementCostFeet:operation.distanceFeet}),\n    ...(operation.movementActivity?{movementActivity:operation.movementActivity}:{}),\n    ...(operation.movementMode?{movementMode:operation.movementMode}:{}),')
              replace_once(path,'    event:makeEvent(ctx.pending, operation, `${actorId} moves ${operation.distanceFeet} ft`, result, provenance, changes, actorId),','    event:makeEvent(ctx.pending, operation, operation.movementActivity==="stand"\n      ? `${actorId} stands from Prone`\n      : `${actorId} moves ${operation.distanceFeet} ft`, result, provenance, changes, actorId),')

          schema_path=Path("schemas/common-play-contract.schema.json")
          schema=json.loads(schema_path.read_text(encoding="utf-8"))
          refs=schema["$defs"]["operation"]["oneOf"]
          stand_ref={"$ref":"#/$defs/movementStand"}
          if stand_ref not in refs:
              refs.insert(refs.index({"$ref":"#/$defs/movementOperation"})+1,stand_ref)
          schema["$defs"]["movementStand"]={"type":"object","required":["kind","target"],"properties":{"kind":{"const":"movement.stand"},"target":{"enum":["actor","self"]}},"additionalProperties":False}
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          test_path=Path("tests/domain/commonPlayProneStandRuntime.test.ts")
          if not test_path.exists():
              test_path.write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { parseManualCommonPlayOperationDefinition, resolveCommonPlayEntryPointOperations } from "../../src/domain/commonPlayOperationRuntime";
          import { runtimeState, TEST_PROFILE } from "./rulesTestState";
          function stateWithProne(){const state=runtimeState();state.clock.activeActorId="hero";state.clock.phase="action";state.combatants.hero.economy.movement=30;state.combatants.hero.economy.movementMaximum=30;state.effects.push({id:"effect.external.prone",sourceId:"external.unknown.prone-source",targetId:"hero",kind:"condition",conditionId:"prone",tags:[],expiry:{kind:"permanent"}});return state;}
          function definition(id="external.unknown.family-i-stand"){return parseManualCommonPlayOperationDefinition({schemaVersion:"0.2-draft",id,entryPoints:[{id:"stand",invocation:"manual",operations:[{kind:"movement.stand",target:"actor"}]}]});}
          test("portable movement.stand spends half effective speed and removes Prone atomically",()=>{const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,stateWithProne(),definition(),{resolutionId:"stand-resolution",actorId:"hero",entryPointId:"stand"});assert.equal(committed.status,"committed");if(committed.status!=="committed")return;assert.equal(committed.state.combatants.hero.economy.movement,15);assert.equal(committed.state.effects.some((effect)=>effect.conditionId==="prone"&&effect.targetId==="hero"),false);assert.equal(committed.events.length,2);assert.match(committed.events[0].summary,/stands from Prone/);assert.ok(committed.events[0].stateChanges.some((change)=>change.kind==="economy"&&change.field==="movement"));assert.ok(committed.events[1].stateChanges.some((change)=>change.kind==="effect"&&change.effectId==="effect.external.prone"&&change.after===undefined));});
          test("portable movement.stand rejects insufficient movement without partially removing Prone",()=>{const state=stateWithProne();state.combatants.hero.economy.movement=10;const rejected=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition(),{resolutionId:"stand-insufficient",actorId:"hero",entryPointId:"stand"});assert.equal(rejected.status,"rejected");assert.equal(state.combatants.hero.economy.movement,10);assert.equal(state.effects.some((effect)=>effect.conditionId==="prone"),true);});
          test("portable movement.stand rejects zero effective speed without removing Prone",()=>{const state=stateWithProne();state.effects.push({id:"effect.external.grappled",sourceId:"external.unknown.grapple",sourceActorId:"enemy",targetId:"hero",kind:"condition",conditionId:"grappled",tags:[],expiry:{kind:"permanent"}});const rejected=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition(),{resolutionId:"stand-zero-speed",actorId:"hero",entryPointId:"stand"});assert.equal(rejected.status,"rejected");assert.equal(state.combatants.hero.economy.movement,30);assert.equal(state.effects.some((effect)=>effect.conditionId==="prone"),true);});
          test("portable movement.stand semantics are invariant under external definition identity rename",()=>{const first=resolveCommonPlayEntryPointOperations(TEST_PROFILE,stateWithProne(),definition("external.first.stand"),{resolutionId:"stand-first",actorId:"hero",entryPointId:"stand"});const second=resolveCommonPlayEntryPointOperations(TEST_PROFILE,stateWithProne(),definition("unrelated.renamed.stand"),{resolutionId:"stand-second",actorId:"hero",entryPointId:"stand"});assert.equal(first.status,"committed");assert.equal(second.status,"committed");if(first.status!=="committed"||second.status!=="committed")return;assert.equal(first.state.combatants.hero.economy.movement,second.state.combatants.hero.economy.movement);assert.equal(first.state.effects.some((effect)=>effect.conditionId==="prone"),false);assert.equal(second.state.effects.some((effect)=>effect.conditionId==="prone"),false);});
          '''.replace("          ",""),encoding="utf-8")

          path=Path("tests/ui/c9FamilyIMovementProduction.test.ts")
          text=path.read_text(encoding="utf-8")
          if 'runPortableStand' not in text:
              replace_once(path,'import { MockAdapter } from "../../src/app/mockAdapter";','import { MockAdapter } from "../../src/app/mockAdapter";\nimport { ensureAdapterTurnRuntimeState, turnRuntimeSessions } from "../../src/app/turnRuntimeSessionRegistry";')
              replace_once(path,'''    {\n      id:"move-full",\n      invocation:"manual" as const,\n      operations:[{\n        kind:"movement.relocate" as const,\n        mode:"move" as const,\n        movementType:"walk" as const,\n        target:"actor",\n        distance:{ref:"movement.walk"},\n        destinationFact:destinationFact("destination-full"),\n      }],\n    },\n  ];''','''    {\n      id:"move-full",\n      invocation:"manual" as const,\n      operations:[{\n        kind:"movement.relocate" as const,\n        mode:"move" as const,\n        movementType:"walk" as const,\n        target:"actor",\n        distance:{ref:"movement.walk"},\n        destinationFact:destinationFact("destination-full"),\n      }],\n    },\n    {id:"stand",invocation:"manual" as const,operations:[{kind:"movement.stand" as const,target:"actor" as const}]},\n  ];''')
              insert='''\nasync function seedProne(adapter:MockAdapter){const snapshot=await adapter.getSnapshot();ensureAdapterTurnRuntimeState(adapter,snapshot.scene);const session=turnRuntimeSessions.get(adapter);assert.ok(session,"turn runtime session must exist");session.state.effects.push({id:"effect.external.prone",sourceId:"external.unknown.prone-source",targetId:"char.aelar",kind:"condition",conditionId:"prone",tags:[],expiry:{kind:"permanent"}});}\nasync function runPortableStand(prefix:string){const {adapter,action}=await install(prefix);await seedProne(adapter);const before=(await adapter.getSnapshot()).scene.economyByActor["char.aelar"]!.movement;await adapter.resolveAction(action("stand"),["char.aelar"]);let snapshot=await adapter.getSnapshot();assert.equal(snapshot.resolution?.stage,"complete","portable stand must commit through production Common Play");assert.equal(snapshot.scene.economyByActor["char.aelar"]?.movement,before-15);assert.equal(turnRuntimeSessions.get(adapter)?.state.effects.some((effect)=>effect.conditionId==="prone"&&effect.targetId==="char.aelar"),false);await adapter.undoLastResolution();snapshot=await adapter.getSnapshot();assert.equal(snapshot.scene.economyByActor["char.aelar"]?.movement,before,"stand Undo must restore movement budget");assert.equal(turnRuntimeSessions.get(adapter)?.state.effects.some((effect)=>effect.conditionId==="prone"&&effect.targetId==="char.aelar"),true,"stand Undo must restore Prone");return before;}\n'''
              replace_once(path,'\nasync function runMovementMatrix(prefix:string) {',insert+'\nasync function runMovementMatrix(prefix:string) {')
              tests='''\ntest("unknown installed Common Play stands from Prone through production Resolver and Undo",async()=>{assert.equal(await runPortableStand("unknown-family-i-stand"),30);});\ntest("renaming the external movement.stand identities preserves production semantics",async()=>{assert.equal(await runPortableStand("renamed-family-i-stand"),30);});\n'''
              replace_once(path,'\ntest("renaming every external Family I identity preserves the production movement matrix",async()=>{',tests+'\ntest("renaming every external Family I identity preserves the production movement matrix",async()=>{')

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          text=path.read_text(encoding="utf-8")
          start=text.index('"family": "I"')
          end=text.index('"family": "J"',start)
          segment=text[start:end]
          if 'commonPlayProneStandRuntime.test.ts' not in segment:
              segment=segment.replace('        "commonPlayOperationRuntime.ts movement.relocate lowering"','        "commonPlayOperationRuntime.ts movement.relocate lowering",\n        "conditions.ts effectiveSpeed/proneStandingCost plus commonPlayOperationRuntime.ts movement.stand lowering reuse shared movement budget and Effect removal owners"')
              segment=segment.replace('        "C9 Family I Movement Mode Matrix run 33310511648: production matrix, legacy execution boundary, and tsc --noEmit passed at d3b105c37a8cb2c3c715b1abddf62f3abb638fce"','        "C9 Family I Movement Mode Matrix run 33310511648: production matrix, legacy execution boundary, and tsc --noEmit passed at d3b105c37a8cb2c3c715b1abddf62f3abb638fce",\n        "commonPlayProneStandRuntime.test.ts and c9FamilyIMovementProduction.test.ts prove portable Prone stand cost/removal, zero-speed rejection, production execution, rename invariance, and event-native Undo"')
              segment=segment.replace('        "rules-derived Difficult Terrain, Prone stand cost, drag/carry, zero-speed, alternate-speed, and related movement constraint authority remain incomplete"','        "rules-derived Difficult Terrain, drag/carry, alternate-speed, and related movement constraint authority remain incomplete"')
              text=text[:start]+segment+text[end:]
              path.write_text(text,encoding="utf-8")

          for helper in [
              ".github/workflows/c9-family-i-prone-stand-7130.yml",
              ".github/workflows/c9-family-i-prone-stand-fix-71304.yml",
              ".github/workflows/c9-family-i-prone-stand-land-71304.yml",
          ]:
              p=Path(helper)
              if p.exists(): p.unlink()
          PY
      - name: Apply, verify, and land with branch-race retry
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5; do
            echo "landing attempt $attempt"
            python3 /tmp/apply-prone.py
            npm run generate:content
            npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/domain/commonPlayProneStandRuntime.test.ts tests/ui/c9FamilyIMovementProduction.test.ts
            node -e 'JSON.parse(require("fs").readFileSync("schemas/common-play-contract.schema.json","utf8"))'
            node scripts/check-legacy-execution-boundary.mjs
            node scripts/check-v1-mechanism-coverage.mjs
            npx tsc --noEmit
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat(c9): support portable prone standing"
            fi
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npx tsx --test tests/domain/commonPlayProneStandRuntime.test.ts tests/ui/c9FamilyIMovementProduction.test.ts
              node scripts/check-v1-mechanism-coverage.mjs
              npx tsc --noEmit
              if git push origin "HEAD:$branch"; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
          done
          echo "failed to land Family I prone standing after retries" >&2
          exit 1
