name: C9 Family O Ready Ledger

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-o-ready-ledger-71304.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Patch Family O evidence
        run: python .github/scripts/c9-family-o-ready-ledger-71304.py
      - name: Verify ledger JSON and Family O checkpoint
        run: |
          python - <<'PY'
          import json
          data=json.load(open('docs/rules/v1-mechanism-coverage-ledger.json',encoding='utf-8'))
          row=next(entry for entry in data['mechanismFamilies'] if entry['family']=='O')
          assert row['disposition']=='INCOMPLETE'
          assert 'Long-cast concentration setup remains incomplete.' in row['currentState']
          assert row['remainingNamedSeams']==['long-cast concentration setup still lacks portable castProcess execution through the shared Resolver']
          assert any('c9FamilyOReadyConcentrationProduction.test.ts' in value for value in row['productionEvidence'])
          assert any('c9FamilyOReadyConcentrationProduction.test.ts' in value for value in row['identityInvarianceEvidence'])
          PY
      - name: Commit evidence and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-o-ready-ledger-71304.yml
          rm .github/scripts/c9-family-o-ready-ledger-71304.py
          git add docs/rules/v1-mechanism-coverage-ledger.json .github/workflows/c9-family-o-ready-ledger-71304.yml .github/scripts/c9-family-o-ready-ledger-71304.py
          git commit -m "docs(c9): record portable readied spell concentration"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
