name: C9 Family I Portable Free Movement 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-portable-free-movement-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-i-portable-free-movement-71304
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add portable free movement and verify
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-i-portable-free-movement-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            node <<'NODE'
          const fs=require('node:fs');
          function replaceOnce(path,before,after){
            const source=fs.readFileSync(path,'utf8');
            const count=source.split(before).length-1;
            if(count!==1) throw new Error(`${path}: expected one replacement, found ${count}`);
            fs.writeFileSync(path,source.replace(before,after));
          }

          replaceOnce(
            'src/domain/commonPlayMovementRuntime.ts',
            'type CommonPlayMovementMode="teleport"|"push"|"pull"|"move";',
            'type CommonPlayMovementMode="teleport"|"push"|"pull"|"free"|"move";'
          );
          replaceOnce(
            'src/domain/commonPlayMovementRuntime.ts',
            '      movementMode:definition.mode,destinationRef:answer.value,',
            '      movementMode:definition.mode==="free"?undefined:definition.mode,destinationRef:answer.value,'
          );
          replaceOnce(
            'src/domain/commonPlayOperationRuntime.ts',
            '    if(operation.mode!=="move"&&operation.mode!=="push"&&operation.mode!=="pull"&&operation.mode!=="teleport") throw new DomainEvaluationError(`${label}.mode is unsupported`);',
            '    if(operation.mode!=="move"&&operation.mode!=="push"&&operation.mode!=="pull"&&operation.mode!=="teleport"&&operation.mode!=="free") throw new DomainEvaluationError(`${label}.mode is unsupported`);'
          );
          replaceOnce(
            'schemas/common-play-contract.schema.json',
            '            "teleport",\n            "push",\n            "pull",\n            "move"',
            '            "teleport",\n            "push",\n            "pull",\n            "free",\n            "move"'
          );

          const testPath='tests/domain/commonPlayMovementRuntime.test.ts';
          let testSource=fs.readFileSync(testPath,'utf8');
          const importNeedle='import { compileCommonPlayMovement } from "../../src/domain/commonPlayMovementRuntime";';
          if(!testSource.includes('parseCommonPlayOperationDefinition')) {
            testSource=testSource.replace(importNeedle,`${importNeedle}\nimport { parseCommonPlayOperationDefinition, resolveCommonPlayEntryPointOperations } from "../../src/domain/commonPlayOperationRuntime";`);
          }
          const marker='portable free movement lowers through Common Play without content identity dispatch';
          if(!testSource.includes(marker)) {
            testSource += `\n\ntest("${marker}",()=>{\n  const results:unknown[]=[];\n  for(const [definitionId,entryPointId] of [["external.unknown.free-movement","grant"],["external.renamed.free-movement","renamed-grant"]] as const){\n    const definition=parseCommonPlayOperationDefinition({\n      schemaVersion:"0.2-draft",\n      id:definitionId,\n      entryPoints:[{\n        id:entryPointId,\n        invocation:"manual",\n        operations:[{\n          kind:"movement.relocate",\n          mode:"free",\n          target:"actor",\n          distance:{value:15},\n          doesNotProvokeOpportunityAttacks:true,\n          destinationFact:{...movement.destinationFact,id:"free-destination"},\n        }],\n      }],\n    });\n    const state=runtimeState();\n    const movementBefore=state.combatants.hero.economy.movement;\n    const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition,{\n      resolutionId:\`resolution-${entryPointId}\`,\n      actorId:"hero",\n      entryPointId,\n      movementFactAnswers:{0:{...authorityAnswer,queryId:"free-destination",resolutionId:\`resolution-${entryPointId}\`}},\n    });\n    assert.equal(committed.status,"committed");\n    if(committed.status!=="committed")continue;\n    assert.equal(committed.state.combatants.hero.economy.movement,movementBefore);\n    assert.equal(committed.events.length,1);\n    results.push(committed.events[0].result);\n  }\n  assert.equal(results.length,2);\n  assert.deepEqual(results[0],results[1]);\n  assert.deepEqual(results[0],{distanceFeet:15,maximumDistanceFeet:15,regularMovementSpent:0,doesNotProvokeOpportunityAttacks:true,destinationRef:"point:b4"});\n});\n`;
            fs.writeFileSync(testPath,testSource);
          }
          NODE

            npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts
            npx tsc --noEmit
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            rm -f "$workflow"
            git add src/domain/commonPlayMovementRuntime.ts src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/domain/commonPlayMovementRuntime.test.ts "$workflow"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "feat(c9): expose portable free movement"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
