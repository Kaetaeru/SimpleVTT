name: C9 Family N Workflow Fixer 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-n-workflow-fixer-71304.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Repair YAML indentation and retire fixer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/c9-family-n-source-cleanup-71304.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "addition = r'''")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "'''")
          for i in range(start + 1, end + 1):
              if lines[i] and not lines[i].startswith('          '):
                  lines[i] = '          ' + lines[i]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-n-workflow-fixer-71304.yml
          git add .github/workflows/c9-family-n-source-cleanup-71304.yml
          git diff --check
          git commit -m "ci(c9): repair Family N source cleanup verifier"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
