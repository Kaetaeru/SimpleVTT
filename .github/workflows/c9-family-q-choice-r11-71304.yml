name: C9 Family Q Choice R11 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r11-71304.yml

permissions:
  contents: write

jobs:
  verify-current-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify current Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node --test tests/contracts/commonPlayRepresentativeScenarios.test.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
          git diff --check
      - name: Retire verified Family Q staging
        run: |
          set -euo pipefail
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-r5-71304.yml .github/workflows/c9-family-q-choice-r6-diagnostic-71304.yml .github/workflows/c9-family-q-choice-r7-71304.yml .github/workflows/c9-family-q-choice-r8-71304.yml .github/workflows/c9-family-q-choice-r8-diagnostic-71304.yml .github/workflows/c9-family-q-choice-r9-71304.yml .github/workflows/c9-family-q-choice-r10-71304.yml .github/workflows/c9-family-q-choice-r11-71304.yml .github/workflows/c9-family-q-choice-diagnostic-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(c9): retire verified Family Q choice staging"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
