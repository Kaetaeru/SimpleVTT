name: C9 Family AC Authoring Contract

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-ac-authoring-contract-71304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add persisted special-action authoring contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old,new,1)

          runtime_path=Path("src/domain/commonPlayDefinitionRuntime.ts")
          runtime=runtime_path.read_text(encoding="utf-8")
          runtime=replace_once(runtime,
          '''export interface CommonPlayEntryPointIR extends Obj {
            id:string;
            invocation:"manual"|"triggered"|"automatic"|"granted";
            operations:Obj[];
          }
          ''',
          '''export interface CommonPlayEntryPointIR extends Obj {
            id:string;
            invocation:"manual"|"triggered"|"automatic"|"granted";
            operations:Obj[];
          }

          export type CommonPlaySpecialTimingIR=
            | {kind:"turn-start"|"turn-end";actor:"owner"|"other"}
            | {kind:"after-turn";actor:"other"}
            | {kind:"initiative-count";count:number};

          export interface CommonPlaySpecialActionOptionIR extends Obj {
            id:string;
            cost:number;
            entryPointId:string;
          }

          export interface CommonPlaySpecialActionIR extends Obj {
            id:string;
            timing:CommonPlaySpecialTimingIR;
            poolResourceId?:string;
            options:CommonPlaySpecialActionOptionIR[];
          }
          ''',"special action types")
          runtime=replace_once(runtime,
          '''  entryPoints?:CommonPlayEntryPointIR[];
            artifactTemplates?:Obj[];
          ''',
          '''  entryPoints?:CommonPlayEntryPointIR[];
            specialActions?:CommonPlaySpecialActionIR[];
            artifactTemplates?:Obj[];
          ''',"definition specialActions field")
          runtime=replace_once(runtime,
          '''  "entryPoints","artifactTemplates","rules","interceptors",
          ]);''',
          '''  "entryPoints","specialActions","artifactTemplates","rules","interceptors",
          ]);''',"top level specialActions key")
          runtime=replace_once(runtime,
          '''function uniqueIds(values:Obj[]|undefined,label:string) {
            const ids=new Set<string>();
            for(const [index,value] of (values??[]).entries()) {
              const id=stableId(value.id,`${label}[${index}].id`);
              if(ids.has(id)) throw new DomainEvaluationError(`${label} contains duplicate id: ${id}`);
              ids.add(id);
            }
          }
          ''',
          '''function uniqueIds(values:Obj[]|undefined,label:string) {
            const ids=new Set<string>();
            for(const [index,value] of (values??[]).entries()) {
              const id=stableId(value.id,`${label}[${index}].id`);
              if(ids.has(id)) throw new DomainEvaluationError(`${label} contains duplicate id: ${id}`);
              ids.add(id);
            }
          }

          const SPECIAL_ACTION_KEYS=new Set(["id","timing","poolResourceId","options"]);
          const SPECIAL_OPTION_KEYS=new Set(["id","cost","entryPointId"]);
          const SPECIAL_TIMING_KEYS=new Set(["kind","actor","count"]);

          function parseSpecialActions(value:unknown,entryPoints:CommonPlayEntryPointIR[],label:string):CommonPlaySpecialActionIR[]|undefined {
            if(value===undefined) return undefined;
            if(!Array.isArray(value)||!value.length) throw new DomainEvaluationError(`${label} must be a non-empty array`);
            const entryPointIds=new Set(entryPoints.map((entryPoint)=>entryPoint.id));
            const actionIds=new Set<string>();
            return value.map((item,index)=>{
              const action=object(item,`${label}[${index}]`);
              const unsupported=Object.keys(action).filter((key)=>!SPECIAL_ACTION_KEYS.has(key));
              if(unsupported.length) throw new DomainEvaluationError(`${label}[${index}] contains unsupported fields: ${unsupported.join(", ")}`);
              const id=stableId(action.id,`${label}[${index}].id`);
              if(actionIds.has(id)) throw new DomainEvaluationError(`${label} contains duplicate id: ${id}`);
              actionIds.add(id);
              const timingRaw=object(action.timing,`${label}[${index}].timing`);
              const timingUnsupported=Object.keys(timingRaw).filter((key)=>!SPECIAL_TIMING_KEYS.has(key));
              if(timingUnsupported.length) throw new DomainEvaluationError(`${label}[${index}].timing contains unsupported fields: ${timingUnsupported.join(", ")}`);
              let timing:CommonPlaySpecialTimingIR;
              if(timingRaw.kind==="turn-start"||timingRaw.kind==="turn-end") {
                if(timingRaw.actor!=="owner"&&timingRaw.actor!=="other") throw new DomainEvaluationError(`${label}[${index}].timing.actor is unsupported`);
                if(timingRaw.count!==undefined) throw new DomainEvaluationError(`${label}[${index}].timing.count is unsupported for ${timingRaw.kind}`);
                timing={kind:timingRaw.kind,actor:timingRaw.actor};
              } else if(timingRaw.kind==="after-turn") {
                if(timingRaw.actor!=="other"||timingRaw.count!==undefined) throw new DomainEvaluationError(`${label}[${index}].timing must target another actor after turn`);
                timing={kind:"after-turn",actor:"other"};
              } else if(timingRaw.kind==="initiative-count") {
                if(!Number.isInteger(timingRaw.count)||timingRaw.actor!==undefined) throw new DomainEvaluationError(`${label}[${index}].timing.count must be an integer initiative count`);
                timing={kind:"initiative-count",count:Number(timingRaw.count)};
              } else {
                throw new DomainEvaluationError(`${label}[${index}].timing.kind is unsupported`);
              }
              const poolResourceId=action.poolResourceId===undefined?undefined:stableId(action.poolResourceId,`${label}[${index}].poolResourceId`);
              if(!Array.isArray(action.options)||!action.options.length) throw new DomainEvaluationError(`${label}[${index}].options must be a non-empty array`);
              const optionIds=new Set<string>();
              const options=action.options.map((optionValue,optionIndex)=>{
                const option=object(optionValue,`${label}[${index}].options[${optionIndex}]`);
                const optionUnsupported=Object.keys(option).filter((key)=>!SPECIAL_OPTION_KEYS.has(key));
                if(optionUnsupported.length) throw new DomainEvaluationError(`${label}[${index}].options[${optionIndex}] contains unsupported fields: ${optionUnsupported.join(", ")}`);
                const optionId=stableId(option.id,`${label}[${index}].options[${optionIndex}].id`);
                if(optionIds.has(optionId)) throw new DomainEvaluationError(`${label}[${index}].options contains duplicate id: ${optionId}`);
                optionIds.add(optionId);
                if(!Number.isInteger(option.cost)||Number(option.cost)<0) throw new DomainEvaluationError(`${label}[${index}].options[${optionIndex}].cost must be a non-negative integer`);
                const entryPointId=stableId(option.entryPointId,`${label}[${index}].options[${optionIndex}].entryPointId`);
                if(!entryPointIds.has(entryPointId)) throw new DomainEvaluationError(`${label}[${index}].options[${optionIndex}] references unknown entry point: ${entryPointId}`);
                if(Number(option.cost)>0&&!poolResourceId) throw new DomainEvaluationError(`${label}[${index}] requires poolResourceId when an option has positive cost`);
                return {id:optionId,cost:Number(option.cost),entryPointId};
              });
              return {id,timing,...(poolResourceId?{poolResourceId}:{}),options};
            });
          }
          ''',"special action parser")
          runtime=replace_once(runtime,
          '''  uniqueIds(entryPoints,label+".entryPoints");
            uniqueIds(bindings,label+".bindings");''',
          '''  uniqueIds(entryPoints,label+".entryPoints");
            const specialActions=parseSpecialActions(raw.specialActions,entryPoints??[],`${label}.specialActions`);
            uniqueIds(bindings,label+".bindings");''',"parse special actions")
          runtime=replace_once(runtime,
          '''    ...(entryPoints?{entryPoints}:{}),
              ...(artifactTemplates?{artifactTemplates}:{}),''',
          '''    ...(entryPoints?{entryPoints}:{}),
              ...(specialActions?{specialActions}:{}),
              ...(artifactTemplates?{artifactTemplates}:{}),''',"return special actions")
          runtime_path.write_text(runtime,encoding="utf-8")

          schema_path=Path("schemas/common-play-contract.schema.json")
          schema=json.loads(schema_path.read_text(encoding="utf-8"))
          schema["properties"]["specialActions"]={"$ref":"#/$defs/specialActions"}
          defs=schema["$defs"]
          defs["specialTiming"]={
            "oneOf":[
              {"type":"object","required":["kind","actor"],"properties":{"kind":{"enum":["turn-start","turn-end"]},"actor":{"enum":["owner","other"]}},"additionalProperties":False},
              {"type":"object","required":["kind","actor"],"properties":{"kind":{"const":"after-turn"},"actor":{"const":"other"}},"additionalProperties":False},
              {"type":"object","required":["kind","count"],"properties":{"kind":{"const":"initiative-count"},"count":{"type":"integer"}},"additionalProperties":False},
            ]
          }
          defs["specialActionOption"]={
            "type":"object","required":["id","cost","entryPointId"],
            "properties":{"id":{"$ref":"#/$defs/stableId"},"cost":{"type":"integer","minimum":0},"entryPointId":{"$ref":"#/$defs/stableId"}},
            "additionalProperties":False,
          }
          defs["specialAction"]={
            "type":"object","required":["id","timing","options"],
            "properties":{
              "id":{"$ref":"#/$defs/stableId"},"timing":{"$ref":"#/$defs/specialTiming"},
              "poolResourceId":{"$ref":"#/$defs/stableId"},
              "options":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/specialActionOption"}},
            },
            "additionalProperties":False,
          }
          defs["specialActions"]={"type":"array","minItems":1,"items":{"$ref":"#/$defs/specialAction"}}
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          test_path=Path("tests/domain/commonPlayDefinitionRuntime.test.ts")
          test_text=test_path.read_text(encoding="utf-8")
          marker='test("canonical special-action authoring persists owner-neutral timing and option references"'
          if marker not in test_text:
              test_text+='''\n\ntest("canonical special-action authoring persists owner-neutral timing and option references",()=>{\n  const authored={\n    schemaVersion:"0.2-draft",id:"external.unseen.special-actions",\n    entryPoints:[{id:"tail-swipe",invocation:"granted",operations:[{kind:"resource.change",resource:"resource.legendary",amount:{value:0}}]}],\n    specialActions:[\n      {id:"legendary",timing:{kind:"after-turn",actor:"other"},poolResourceId:"resource.legendary",options:[{id:"tail",cost:1,entryPointId:"tail-swipe"},{id:"free-tail",cost:0,entryPointId:"tail-swipe"}]},\n      {id:"lair",timing:{kind:"initiative-count",count:20},options:[{id:"pulse",cost:0,entryPointId:"tail-swipe"}]},\n    ],\n  };\n  const definition=parseCommonPlayDefinition(authored);\n  assert.equal(definition.specialActions?.[0]?.timing.kind,"after-turn");\n  assert.equal(definition.specialActions?.[0]?.options.length,2);\n  assert.equal(definition.specialActions?.[1]?.timing.kind,"initiative-count");\n  assert.equal(Object.hasOwn(definition.specialActions?.[0]??{},"ownerActorId"),false);\n  assert.throws(()=>parseCommonPlayDefinition({...authored,specialActions:[{...authored.specialActions[0],ownerActorId:"dragon"}]}),/unsupported fields/);\n  assert.throws(()=>parseCommonPlayDefinition({...authored,specialActions:[{id:"legendary",timing:{kind:"after-turn",actor:"other"},options:[{id:"tail",cost:1,entryPointId:"tail-swipe"}]}]}),/poolResourceId/);\n  assert.throws(()=>parseCommonPlayDefinition({...authored,specialActions:[{id:"legendary",timing:{kind:"after-turn",actor:"other"},options:[{id:"tail",cost:0,entryPointId:"missing"}]}]}),/unknown entry point/);\n  const schema=JSON.parse(readFileSync(new URL("../../schemas/common-play-contract.schema.json",import.meta.url),"utf8"));\n  assert.equal(schema.properties.specialActions.$ref,"#/$defs/specialActions");\n  assert.equal(schema.$defs.specialAction.additionalProperties,false);\n});\n'''
          test_path.write_text(test_text,encoding="utf-8")
          PY
      - name: Verify Family AC authoring slice
        run: |
          python3 -m json.tool schemas/common-play-contract.schema.json >/dev/null
          npx tsx --test tests/domain/commonPlayDefinitionRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Reconcile Family AC ledger evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          row=next(item for item in data["families"] if item["family"]=="AC")
          row["currentState"]=(
            "Common Play now persists owner-neutral specialActions authoring for turn-start/turn-end/after-turn/initiative-count timing, reusable entry-point options, optional resource pools, and per-option cost; runtime actor ownership remains session-bound rather than source-authored. "
            "The kernel compiler still validates concrete runtime owner/timing/cost/option execution. RuntimeClock still lacks authoritative initiative-count progression and production has no generic session dispatcher/replay-reconnect path for these portable special actions, so the family remains incomplete."
          )
          evidence="commonPlayDefinitionRuntime.ts + common-play-contract.schema.json persist owner-neutral specialActions timing/pool/cost/multiple-option authoring by portable entryPointId reference; commonPlayDefinitionRuntime.test.ts rejects runtime actor identity, unknown entry points, and paid options without a pool"
          if evidence not in row["implementationEvidence"]:
              row["implementationEvidence"].append(evidence)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified Family AC slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-ac-authoring-contract-71304.yml
          git add src/domain/commonPlayDefinitionRuntime.ts schemas/common-play-contract.schema.json tests/domain/commonPlayDefinitionRuntime.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "feat(c9): persist Family AC special action authoring"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
