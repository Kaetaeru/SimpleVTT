name: C9 Family AC Authoring Contract 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-ac-authoring-contract-71304.yml

permissions:
  contents: write

jobs:
  authoring-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Add portable special-timing authoring contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime=Path('src/domain/commonPlaySpecialTimingRuntime.ts')
          text=runtime.read_text(encoding='utf-8')
          anchor='''export interface CommonPlayTimingEvent {\n  kind:"turn-start"|"turn-end"|"after-turn"|"initiative-count";\n  actorId?:string;\n  initiativeCount?:number;\n}\n'''
          insert='''export interface CommonPlaySpecialActionAuthoringDefinition {\n  id:string;\n  timing:CommonPlayTimingWindow;\n  options:Array<{id:string;cost:number;entryPointId:string}>;\n  poolResourceId?:string;\n}\n\ntype Obj=Record<string,unknown>;\nconst STABLE_ID=/^[a-z0-9][a-z0-9._-]*$/;\n\nfunction authoringObject(value:unknown,label:string):Obj {\n  if(!value||typeof value!=="object"||Array.isArray(value)) throw new DomainEvaluationError(`${label} must be an object`);\n  return value as Obj;\n}\n\nfunction authoringStableId(value:unknown,label:string) {\n  if(typeof value!=="string"||!STABLE_ID.test(value)) throw new DomainEvaluationError(`${label} must be a stable id`);\n  return value;\n}\n\nfunction parseTimingWindow(value:unknown,label:string):CommonPlayTimingWindow {\n  const timing=authoringObject(value,label);\n  const kind=timing.kind;\n  if(kind==="initiative-count") {\n    const unsupported=Object.keys(timing).filter((key)=>key!=="kind"&&key!=="count");\n    if(unsupported.length) throw new DomainEvaluationError(`${label} contains unsupported fields: ${unsupported.join(", ")}`);\n    if(!Number.isInteger(timing.count)||Number(timing.count)<0) throw new DomainEvaluationError(`${label}.count must be a non-negative integer`);\n    return {kind,count:Number(timing.count)};\n  }\n  if(kind==="turn-start"||kind==="turn-end") {\n    const unsupported=Object.keys(timing).filter((key)=>key!=="kind"&&key!=="actor");\n    if(unsupported.length) throw new DomainEvaluationError(`${label} contains unsupported fields: ${unsupported.join(", ")}`);\n    if(timing.actor!=="owner"&&timing.actor!=="other") throw new DomainEvaluationError(`${label}.actor must be owner or other`);\n    return {kind,actor:timing.actor};\n  }\n  if(kind==="after-turn") {\n    const unsupported=Object.keys(timing).filter((key)=>key!=="kind"&&key!=="actor");\n    if(unsupported.length) throw new DomainEvaluationError(`${label} contains unsupported fields: ${unsupported.join(", ")}`);\n    if(timing.actor!=="other") throw new DomainEvaluationError(`${label}.actor must be other`);\n    return {kind,actor:"other"};\n  }\n  throw new DomainEvaluationError(`${label}.kind is unsupported`);\n}\n\nexport function parseCommonPlaySpecialActionAuthoring(\n  value:unknown,\n  label="Common Play special action",\n):CommonPlaySpecialActionAuthoringDefinition {\n  const raw=authoringObject(value,label);\n  const unsupported=Object.keys(raw).filter((key)=>!new Set(["id","timing","options","poolResourceId"]).has(key));\n  if(unsupported.length) throw new DomainEvaluationError(`${label} contains unsupported fields: ${unsupported.join(", ")}`);\n  const id=authoringStableId(raw.id,`${label}.id`);\n  const timing=parseTimingWindow(raw.timing,`${label}.timing`);\n  const poolResourceId=raw.poolResourceId===undefined?undefined:authoringStableId(raw.poolResourceId,`${label}.poolResourceId`);\n  if(!Array.isArray(raw.options)||raw.options.length===0) throw new DomainEvaluationError(`${label}.options must be a non-empty array`);\n  const optionIds=new Set<string>();\n  const options=raw.options.map((value,index)=>{\n    const option=authoringObject(value,`${label}.options[${index}]`);\n    const optionUnsupported=Object.keys(option).filter((key)=>!new Set(["id","cost","entryPointId"]).has(key));\n    if(optionUnsupported.length) throw new DomainEvaluationError(`${label}.options[${index}] contains unsupported fields: ${optionUnsupported.join(", ")}`);\n    const optionId=authoringStableId(option.id,`${label}.options[${index}].id`);\n    if(optionIds.has(optionId)) throw new DomainEvaluationError(`${label}.options contains duplicate id: ${optionId}`);\n    optionIds.add(optionId);\n    if(!Number.isInteger(option.cost)||Number(option.cost)<0) throw new DomainEvaluationError(`${label}.options[${index}].cost must be a non-negative integer`);\n    return {id:optionId,cost:Number(option.cost),entryPointId:authoringStableId(option.entryPointId,`${label}.options[${index}].entryPointId`)};\n  });\n  if(options.some((option)=>option.cost>0)&&!poolResourceId) throw new DomainEvaluationError(`${label} requires poolResourceId when an option has a cost`);\n  return {id,timing,options,...(poolResourceId?{poolResourceId}:{})};\n}\n\n'''
          if insert not in text:
              if text.count(anchor)!=1: raise SystemExit('special timing runtime anchor mismatch')
              text=text.replace(anchor,insert+anchor,1)
              runtime.write_text(text,encoding='utf-8')

          definition=Path('src/domain/commonPlayDefinitionRuntime.ts')
          text=definition.read_text(encoding='utf-8')
          import_anchor='''import type { CommonPlayArtifactActivationDefinition } from "./commonPlayArtifactRuntime";\n'''
          import_line='''import { parseCommonPlaySpecialActionAuthoring, type CommonPlaySpecialActionAuthoringDefinition } from "./commonPlaySpecialTimingRuntime";\n'''
          if import_line not in text:
              if text.count(import_anchor)!=1: raise SystemExit('definition import anchor mismatch')
              text=text.replace(import_anchor,import_anchor+import_line,1)
          ir_anchor='''  interceptors?:Obj[];\n}\n'''
          ir_replace='''  interceptors?:Obj[];\n  specialActions?:CommonPlaySpecialActionAuthoringDefinition[];\n}\n'''
          if ir_replace not in text:
              if text.count(ir_anchor)!=1: raise SystemExit('definition IR anchor mismatch')
              text=text.replace(ir_anchor,ir_replace,1)
          keys_old='''  "entryPoints","artifactTemplates","rules","interceptors",\n]);'''
          keys_new='''  "entryPoints","artifactTemplates","rules","interceptors","specialActions",\n]);'''
          if keys_new not in text:
              if text.count(keys_old)!=1: raise SystemExit('definition keys anchor mismatch')
              text=text.replace(keys_old,keys_new,1)
          parse_anchor='''  const interceptors=objectArray(raw.interceptors,`${label}.interceptors`);\n  const entryPointObjects=objectArray(raw.entryPoints,`${label}.entryPoints`);\n'''
          parse_replace='''  const interceptors=objectArray(raw.interceptors,`${label}.interceptors`);\n  const specialActions=objectArray(raw.specialActions,`${label}.specialActions`)?.map((action,index)=>parseCommonPlaySpecialActionAuthoring(action,`${label}.specialActions[${index}]`));\n  const entryPointObjects=objectArray(raw.entryPoints,`${label}.entryPoints`);\n'''
          if parse_replace not in text:
              if text.count(parse_anchor)!=1: raise SystemExit('definition parse anchor mismatch')
              text=text.replace(parse_anchor,parse_replace,1)
          validate_anchor='''  uniqueIds(interceptors,label+".interceptors");\n  return {\n'''
          validate_replace='''  uniqueIds(interceptors,label+".interceptors");\n  const specialActionIds=new Set<string>();\n  const entryPointIds=new Set((entryPoints??[]).map((entryPoint)=>entryPoint.id));\n  for(const [index,action] of (specialActions??[]).entries()) {\n    if(specialActionIds.has(action.id)) throw new DomainEvaluationError(`${label}.specialActions contains duplicate id: ${action.id}`);\n    specialActionIds.add(action.id);\n    for(const option of action.options) if(!entryPointIds.has(option.entryPointId)) {\n      throw new DomainEvaluationError(`${label}.specialActions[${index}] option ${option.id} references missing entry point: ${option.entryPointId}`);\n    }\n  }\n  return {\n'''
          if validate_replace not in text:
              if text.count(validate_anchor)!=1: raise SystemExit('definition validation anchor mismatch')
              text=text.replace(validate_anchor,validate_replace,1)
          return_anchor='''    ...(interceptors?{interceptors}:{}),\n  };\n'''
          return_replace='''    ...(interceptors?{interceptors}:{}),\n    ...(specialActions?{specialActions}:{}),\n  };\n'''
          if return_replace not in text:
              if text.count(return_anchor)!=1: raise SystemExit('definition return anchor mismatch')
              text=text.replace(return_anchor,return_replace,1)
          definition.write_text(text,encoding='utf-8')

          schema=Path('schemas/common-play-contract.schema.json')
          text=schema.read_text(encoding='utf-8')
          top_anchor='''    "interceptors": {\n      "type": "array",\n      "items": {\n        "$ref": "#/$defs/interceptor"\n      }\n    }\n'''
          top_replace='''    "interceptors": {\n      "type": "array",\n      "items": {\n        "$ref": "#/$defs/interceptor"\n      }\n    },\n    "specialActions": {\n      "type": "array",\n      "items": {\n        "$ref": "#/$defs/specialAction"\n      }\n    }\n'''
          if top_replace not in text:
              if text.count(top_anchor)!=1: raise SystemExit('schema top-level anchor mismatch')
              text=text.replace(top_anchor,top_replace,1)
          defs_anchor='''    "entryPoint": {\n'''
          defs_insert='''    "specialTimingWindow": {\n      "oneOf": [\n        {\n          "type": "object",\n          "required": ["kind", "actor"],\n          "properties": {\n            "kind": {"enum": ["turn-start", "turn-end"]},\n            "actor": {"enum": ["owner", "other"]}\n          },\n          "additionalProperties": false\n        },\n        {\n          "type": "object",\n          "required": ["kind", "actor"],\n          "properties": {\n            "kind": {"const": "after-turn"},\n            "actor": {"const": "other"}\n          },\n          "additionalProperties": false\n        },\n        {\n          "type": "object",\n          "required": ["kind", "count"],\n          "properties": {\n            "kind": {"const": "initiative-count"},\n            "count": {"type": "integer", "minimum": 0}\n          },\n          "additionalProperties": false\n        }\n      ]\n    },\n    "specialActionOption": {\n      "type": "object",\n      "required": ["id", "cost", "entryPointId"],\n      "properties": {\n        "id": {"$ref": "#/$defs/stableId"},\n        "cost": {"type": "integer", "minimum": 0},\n        "entryPointId": {"$ref": "#/$defs/stableId"}\n      },\n      "additionalProperties": false\n    },\n    "specialAction": {\n      "type": "object",\n      "required": ["id", "timing", "options"],\n      "properties": {\n        "id": {"$ref": "#/$defs/stableId"},\n        "timing": {"$ref": "#/$defs/specialTimingWindow"},\n        "poolResourceId": {"$ref": "#/$defs/stableId"},\n        "options": {\n          "type": "array",\n          "minItems": 1,\n          "items": {"$ref": "#/$defs/specialActionOption"}\n        }\n      },\n      "additionalProperties": false\n    },\n'''
          if defs_insert not in text:
              if text.count(defs_anchor)!=1: raise SystemExit('schema defs anchor mismatch')
              text=text.replace(defs_anchor,defs_insert+defs_anchor,1)
          schema.write_text(text,encoding='utf-8')

          c6=Path('tests/domain/commonPlayC6Runtime.test.ts')
          text=c6.read_text(encoding='utf-8')
          import_anchor='''import { compileCommonPlaySpecialAction } from "../../src/domain/commonPlaySpecialTimingRuntime";\n'''
          import_line='''import { parseCommonPlayDefinition } from "../../src/domain/commonPlayDefinitionRuntime";\n'''
          if import_line not in text:
              if text.count(import_anchor)!=1: raise SystemExit('c6 import anchor mismatch')
              text=text.replace(import_anchor,import_anchor+import_line,1)
          test_anchor='''test("durable projects and exposure counters are revision-safe and threshold based",()=>{\n'''
          test_insert='''test("portable special timing authoring binds owner at runtime and validates option entry points",()=>{\n  const parsed=parseCommonPlayDefinition({\n    schemaVersion:"0.2-draft",id:"external.special-authoring",\n    entryPoints:[\n      {id:"tail",invocation:"triggered",operations:[]},\n      {id:"wing",invocation:"triggered",operations:[]},\n    ],\n    specialActions:[\n      {id:"legendary-window",timing:{kind:"after-turn",actor:"other"},poolResourceId:"legendary",options:[\n        {id:"tail-option",cost:2,entryPointId:"tail"},\n        {id:"wing-option",cost:1,entryPointId:"wing"},\n      ]},\n      {id:"lair-window",timing:{kind:"initiative-count",count:20},options:[{id:"lair-option",cost:0,entryPointId:"wing"}]},\n    ],\n  });\n  assert.deepEqual(parsed.specialActions?.map((action)=>action.timing),[{kind:"after-turn",actor:"other"},{kind:"initiative-count",count:20}]);\n  assert.equal("ownerActorId" in (parsed.specialActions?.[0]??{}),false,"portable content must not persist a session actor identity");\n  assert.throws(()=>parseCommonPlayDefinition({\n    schemaVersion:"0.2-draft",id:"external.invalid-special",entryPoints:[{id:"known",invocation:"triggered",operations:[]}],\n    specialActions:[{id:"bad",timing:{kind:"after-turn",actor:"other"},options:[{id:"missing",cost:0,entryPointId:"unknown"}]}],\n  }),/references missing entry point/);\n});\n\n'''
          if test_insert not in text:
              if text.count(test_anchor)!=1: raise SystemExit('c6 test anchor mismatch')
              text=text.replace(test_anchor,test_insert+test_anchor,1)
          c6.write_text(text,encoding='utf-8')

          package_test=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=package_test.read_text(encoding='utf-8')
          helper_anchor='''function portableCommonPlayInteractionMechanic() {\n'''
          helper_insert='''function portableCommonPlaySpecialTimingMechanic() {\n  return {\n    kind:"common-play",\n    config:{\n      schemaVersion:"0.2-draft",\n      id:"external.unknown.special-timing-action",\n      entryPoints:[\n        {id:"tail",invocation:"triggered",operations:[{kind:"damage.apply",amount:{value:4},damageType:"force",target:"target"}]},\n        {id:"wing",invocation:"triggered",operations:[{kind:"damage.apply",amount:{value:2},damageType:"bludgeoning",target:"target"}]},\n      ],\n      specialActions:[{\n        id:"legendary-window",\n        timing:{kind:"after-turn",actor:"other"},\n        poolResourceId:"resource.external.legendary",\n        options:[\n          {id:"tail-option",cost:2,entryPointId:"tail"},\n          {id:"wing-option",cost:1,entryPointId:"wing"},\n        ],\n      }],\n    },\n  };\n}\n\n'''
          if helper_insert not in text:
              if text.count(helper_anchor)!=1: raise SystemExit('package helper anchor mismatch')
              text=text.replace(helper_anchor,helper_insert+helper_anchor,1)
          mechanics_old='''  const mechanics=[portableCommonPlayMechanic(),portableCommonPlayD20Mechanic(),portableCommonPlayHpMechanic(),portableCommonPlayTargetingMechanic(),portableCommonPlayInteractionMechanic()];\n'''
          mechanics_new='''  const mechanics=[portableCommonPlayMechanic(),portableCommonPlayD20Mechanic(),portableCommonPlayHpMechanic(),portableCommonPlayTargetingMechanic(),portableCommonPlayInteractionMechanic(),portableCommonPlaySpecialTimingMechanic()];\n'''
          if mechanics_new not in text:
              if text.count(mechanics_old)!=1: raise SystemExit('package mechanics anchor mismatch')
              text=text.replace(mechanics_old,mechanics_new,1)
          package_test.write_text(text,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family AC authoring slice
        run: |
          npx tsx --test tests/domain/commonPlayC6Runtime.test.ts tests/ui/ruleModulePackageImport.test.ts
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/common-play-contract.schema.json','utf8')); console.log('schema json ok')"
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish authoring contract and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/common-play-contract.schema.json src/domain/commonPlaySpecialTimingRuntime.ts src/domain/commonPlayDefinitionRuntime.ts tests/domain/commonPlayC6Runtime.test.ts tests/ui/ruleModulePackageImport.test.ts
          git rm .github/workflows/c9-family-ac-authoring-contract-71304.yml
          git commit -m "feat(c9): persist portable special timing definitions"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
