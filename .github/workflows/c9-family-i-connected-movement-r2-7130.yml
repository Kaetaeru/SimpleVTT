name: C9 Family I Connected Movement R2 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-connected-movement-r2-7130.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Add connected movement acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts")
          text=path.read_text(encoding="utf-8")
          title='test("unknown stored movement converges through Host replay, duplicate handling, Undo, and reconnect",async()=>{'
          if title not in text:
              marker='test("Ready UI captures an installed Common Play payload without the legacy WeakMap execution path",async()=>{\n'
              if text.count(marker)!=1:
                  raise SystemExit(f"movement insertion marker count={text.count(marker)}")
              test='''test("unknown stored movement converges through Host replay, duplicate handling, Undo, and reconnect",async()=>{\n  const prefix="unknown-connected-movement",sessionId="session.common-play-movement";\n  const host=new MockAdapter();const {action}=await install(host,prefix);\n  const hostState=connectedStateFor(host);hostState.mode="host";hostState.sessionId=sessionId;hostState.ledger=new HostSessionLedger(sessionId,connectedManifest(host));\n  const originalSend=tauriSessionTransport.send;\n  const runHost=async(operation:()=>Promise<unknown>)=>{\n    const wires:string[]=[];tauriSessionTransport.send=async(message)=>{wires.push(message);return 1;};\n    try { await operation(); } finally { tauriSessionTransport.send=originalSend; }\n    const batch=wires.map((wire)=>JSON.parse(wire)).find((wire)=>wire.type==="event-batch") as {events:ConnectedSessionEvent[]}|undefined;\n    assert.ok(batch,JSON.stringify(wires));\n    assert.equal(wires.every((wire)=>decodeConnectedWireMessage(wire).status==="ok"),true);\n    return batch;\n  };\n\n  const captureBatch=await runHost(()=>host.resolveAction(action(8,"prepare"),["char.aelar"]));\n  const turnBatch=await runHost(()=>host.endTurn());\n\n  const client=new MockAdapter();await install(client,prefix);\n  const clientState=connectedStateFor(client);clientState.mode="client";clientState.sessionId=sessionId;clientState.replica=new ClientSessionReplica(sessionId);\n  assert.equal((await applyConnectedClientEvents(client,captureBatch.events)).status,"applied");\n  assert.equal((await applyConnectedClientEvents(client,turnBatch.events)).status,"applied");\n\n  const trigger=(await host.getSnapshot()).scene.actionsByActor["char.aelar"]?.find((candidate)=>parseStoredInvocationCommonPlayActionId(candidate.id));\n  assert.ok(trigger);\n  const before=(await host.getSnapshot()).scene.economyByActor["char.aelar"]!.movement;\n  const movementBatch=await runHost(()=>host.resolveAction(trigger.id,["char.aelar"]));\n  assert.equal((await applyConnectedClientEvents(client,movementBatch.events)).status,"applied");\n  assert.equal((await applyConnectedClientEvents(client,movementBatch.events)).status,"duplicate");\n\n  let hostSnapshot=await host.getSnapshot(),clientSnapshot=await client.getSnapshot();\n  assert.equal(hostSnapshot.scene.economyByActor["char.aelar"]?.movement,before-10);\n  assert.equal(clientSnapshot.scene.economyByActor["char.aelar"]?.movement,hostSnapshot.scene.economyByActor["char.aelar"]?.movement);\n  assert.equal(clientSnapshot.scene.economyByActor["char.aelar"]?.reaction,false);\n  assert.deepEqual(snapshotAdapterTurnRuntimeState(client,clientSnapshot.scene)?.artifacts,snapshotAdapterTurnRuntimeState(host,hostSnapshot.scene)?.artifacts);\n\n  const undoBatch=await runHost(()=>host.undoLastResolution());\n  assert.equal((await applyConnectedClientEvents(client,undoBatch.events)).status,"applied");\n  hostSnapshot=await host.getSnapshot();clientSnapshot=await client.getSnapshot();\n  assert.equal(hostSnapshot.scene.economyByActor["char.aelar"]?.movement,before);\n  assert.equal(clientSnapshot.scene.economyByActor["char.aelar"]?.movement,before);\n  assert.equal(clientSnapshot.scene.economyByActor["char.aelar"]?.reaction,true);\n  assert.deepEqual(snapshotAdapterTurnRuntimeState(client,clientSnapshot.scene)?.artifacts,snapshotAdapterTurnRuntimeState(host,hostSnapshot.scene)?.artifacts);\n\n  const reconnect=new MockAdapter();await install(reconnect,prefix);\n  const reconnectState=connectedStateFor(reconnect);reconnectState.mode="client";reconnectState.sessionId=sessionId;reconnectState.replica=new ClientSessionReplica(sessionId);\n  assert.equal((await applyConnectedClientEvents(reconnect,hostState.ledger!.eventsAfter(0))).status,"applied");\n  const reconnectSnapshot=await reconnect.getSnapshot();\n  assert.equal(reconnectSnapshot.scene.economyByActor["char.aelar"]?.movement,before);\n  assert.equal(reconnectSnapshot.scene.economyByActor["char.aelar"]?.reaction,true);\n  assert.deepEqual(snapshotAdapterTurnRuntimeState(reconnect,reconnectSnapshot.scene)?.artifacts,snapshotAdapterTurnRuntimeState(host,hostSnapshot.scene)?.artifacts);\n});\n\n'''
              path.write_text(text.replace(marker,test+marker,1),encoding="utf-8")
          PY
      - name: Verify movement production and connected acceptance
        run: >-
          npx tsx --test
          tests/domain/commonPlayMovementRuntime.test.ts
          tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
      - name: Verify legacy boundary and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Record verified Family I connected evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          text=path.read_text(encoding="utf-8")
          start=text.index('"family": "I"')
          end=text.index('"family": "J"',start)
          segment=text[start:end]
          old='''      "connectedEvidenceIfRelevant": [],\n      "persistenceEvidenceIfRelevant": [],\n      "remainingNamedSeams": [\n        "named movement grants",\n        "complete movement mode/cost production matrix"\n      ],'''
          new='''      "connectedEvidenceIfRelevant": [\n        "installedCommonPlayLoweredFamiliesProduction.test.ts unknown stored movement Host/Client replay, duplicate handling, connected Undo, and reconnect"\n      ],\n      "persistenceEvidenceIfRelevant": [],\n      "remainingNamedSeams": [\n        "named movement grants",\n        "complete movement mode/cost production matrix"\n      ],'''
          if new not in segment:
              if segment.count(old)!=1:
                  raise SystemExit(f"Family I evidence marker count={segment.count(old)}")
              segment=segment.replace(old,new,1)
              text=text[:start]+segment+text[end:]
              path.write_text(text,encoding="utf-8")
          PY
      - name: Commit verified slice and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          git add tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          if ! git diff --cached --quiet; then git commit -m "test(c9): prove connected portable movement"; fi
          git rm .github/workflows/c9-family-i-connected-movement-r2-7130.yml
          git commit -m "chore(c9): remove connected movement verifier"
          for attempt in $(seq 1 6); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              npm run generate:content
              npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
              node scripts/check-legacy-execution-boundary.mjs
              npx tsc --noEmit
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
