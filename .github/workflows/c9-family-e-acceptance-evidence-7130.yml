name: C9 Family E Acceptance Evidence

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-acceptance-evidence-7130.yml

permissions:
  contents: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify restart and rename acceptance
        run: node --import tsx --test tests/ui/c9FamilyERelationSelectorAcceptance.test.ts
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Record bounded Family E evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          family=next(row for row in data['rows'] if row['family']=='E')
          if family['id']!='targeting-selectors':
              raise SystemExit('Family E identity mismatch')

          def add(key, value):
              if value not in family[key]:
                  family[key].append(value)

          add('identityInvarianceEvidence', 'c9FamilyERelationSelectorAcceptance.test.ts arbitrary module/content/mechanic/entry/display rename preserves portable enemy-relation semantics after installed-content restart')
          add('identityInvarianceEvidence', 'installedCommonPlayProductionRuntime.test.ts targeting production semantics are invariant under external identity and display rename')
          add('connectedEvidenceIfRelevant', 'installedCommonPlayProductionRuntime.test.ts Host-authoritative targeting ResolutionEvents converge targetIds and downstream healing on Client')
          add('persistenceEvidenceIfRelevant', 'c9FamilyERelationSelectorAcceptance.test.ts relation selector survives installed-content persistence and fresh MockAdapter rehydration before production execution')
          add('productionEvidence', f"C9 Family E Acceptance Evidence run {os.environ['GITHUB_RUN_ID']}: restart/rename relation acceptance and tsc --noEmit passed")

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 - <<'PY'
          import json
          data=json.load(open('docs/rules/v1-mechanism-coverage-ledger.json',encoding='utf-8'))
          family=next(row for row in data['rows'] if row['family']=='E')
          assert family['disposition']=='INCOMPLETE'
          assert family['identityInvarianceEvidence']
          assert family['connectedEvidenceIfRelevant']
          assert family['persistenceEvidenceIfRelevant']
          PY
      - name: Commit verified evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/workflows/c9-family-e-acceptance-evidence-7130.yml
          git diff --cached --check
          git commit -m "docs(c9): retain Family E identity persistence evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
