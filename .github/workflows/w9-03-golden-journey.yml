name: W9-03 Zero-to-Next-Session Golden Journey

on:
  pull_request:
    branches:
      - work/v1-composite
    paths:
      - "scripts/run-tauri-e2e.ps1"
      - "scripts/run-tauri-e2e-w9-03.mjs"
      - "content/examples/**"
      - ".github/workflows/w9-03-golden-journey.yml"
  # push trigger is restored once the golden journey passes on a PR head; until then it iterates on agent/* branches only.
  workflow_dispatch:

env:
  V1_VERIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  windows-golden-journey:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - name: Run W9-03 first run -> import -> Character -> Campaign -> Session -> restart -> Session 2 on Windows
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/run-tauri-e2e.ps1 -Root . -W903
      - name: Upload W9-03 Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W9-03-WIN-${{ env.V1_VERIFICATION_SHA }}
          path: .live-dev/tauri-e2e/**/artifacts/**
          if-no-files-found: error
          retention-days: 14
