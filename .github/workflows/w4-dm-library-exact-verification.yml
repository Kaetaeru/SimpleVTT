name: W4 DM Library Exact Verification

on:
  push:
    branches:
      - "agent/w4-06-exact-tests-*"
    paths:
      - ".github/workflows/w4-dm-library-exact-verification.yml"
      - "src/CampaignSystemsPanel.tsx"
      - "src/CampaignDmLibraryOrganizationPanel.tsx"
      - "src/CampaignDmLibraryNotePanel.tsx"
      - "src/app/campaignDmLibraryOrganizationContracts.ts"
      - "src/app/campaignDmLibraryOrganizationRuntimeAdapter.ts"
      - "src/app/campaignDmLibraryImport.ts"
      - "src/app/campaignPersistenceContracts.ts"
      - "tests/ui/campaignDmLibrary*.test.ts"

jobs:
  dm-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify W4-06 DM Library contracts
        run: >-
          npx tsx --test
          tests/ui/campaignDmLibraryOrganizationRuntime.test.ts
          tests/ui/campaignDmLibraryOrganizationStructure.test.ts
          tests/ui/campaignDmLibraryImport.test.ts
          tests/ui/campaignDmLibraryNoteStructure.test.ts
          tests/ui/campaignDmLibraryDeleteProvenance.test.ts
          tests/ui/campaignDmLibraryStructure.test.ts
