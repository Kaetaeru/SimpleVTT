name: C9 Family Q Host DM Interaction 71304

# rerun on the latest reconciled C9 head
on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-host-dm-71304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate builtin catalog required by production adapters
        run: npm run generate:builtin-catalog
      - name: Apply Family Q authority consent bridge
        run: python3 .github/scripts/c9-family-q-authority-consent-71304.py
      - name: Verify Family Q authority responders
        run: |
          node --import tsx --test tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Commit verified Family Q slice and retire staging files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git rm .github/scripts/c9-family-q-authority-consent-71304.py .github/workflows/c9-family-q-host-dm-71304.yml
          git commit -m "feat(c9): route authority consent responders"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
