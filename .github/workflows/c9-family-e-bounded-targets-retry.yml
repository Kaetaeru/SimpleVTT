name: C9 Family E Bounded Targets Retry

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-bounded-targets-retry.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply bounded multi-target selector support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing {label}:\n{old}")
              return text.replace(old, new, 1)

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          text=runtime.read_text()
          text=replace_once(text,
          '''export interface CommonPlayTargetingSelector {
            from:"targets";
            min:1;
            max:1;
          }'''.replace('            ',''),
          '''export interface CommonPlayTargetingSelector {
            from:"targets";
            min:number;
            max:number;
          }'''.replace('            ',''), 'targeting selector type')
          text=replace_once(text,
          '''  if(selector.min!==1||selector.max!==1) throw new DomainEvaluationError(`${label}.min and .max must both be 1 for portable Common Play targeting`);
          return {from:"targets",min:1,max:1};'''.replace('          ',''),
          '''  if(!Number.isInteger(selector.min)||Number(selector.min)<1) throw new DomainEvaluationError(`${label}.min must be a positive integer for portable Common Play targeting`);
          if(!Number.isInteger(selector.max)||Number(selector.max)<Number(selector.min)) throw new DomainEvaluationError(`${label}.max must be an integer >= min for portable Common Play targeting`);
          return {from:"targets",min:Number(selector.min),max:Number(selector.max)};'''.replace('          ',''), 'targeting selector parser')
          text=replace_once(text,
          '''    if(input.targetingTargets.length===1&&input.targetId!==undefined&&input.targetId!==input.targetingTargets[0].id) {
              throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");
            }'''.replace('            ',''),
          '''    if(input.targetId!==undefined&&!input.targetingTargets.some((target)=>target.id===input.targetId)) {
              throw new DomainEvaluationError("Common Play downstream target does not match the validated targeting selection");
            }'''.replace('            ',''), 'downstream target membership')
          text=replace_once(text,
          '      rule:{kind:"creature",minTargets:1,maxTargets:1,directTarget:false},',
          '      rule:{kind:"creature",minTargets:entryPoint.targeting.min,maxTargets:entryPoint.targeting.max,directTarget:false},',
          'targeting rule bounds')
          runtime.write_text(text)

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text()
          text=replace_once(text,
          '  const multi=action.lowered.kind==="save-damage";',
          '  const multi=action.lowered.kind==="save-damage"||Boolean(targeting&&(targeting.max??1)>1);',
          'projected multi-target action')
          text=replace_once(text,
          '  const presentationTargetIds=affectedTargetIds.length?affectedTargetIds:[selectedTargetId];',
          '  const presentationTargetIds=affectedTargetIds.length?affectedTargetIds:operationEntryPoint?.targeting?selectedTargets.map((target)=>target.id):lowered.kind==="save-damage"?selectedTargets.map((target)=>target.id):[selectedTargetId];',
          'multi-target presentation')
          adapter.write_text(text)

          domain=Path('tests/domain/commonPlayTargetingRuntime.test.ts')
          text=domain.read_text()
          text=replace_once(text,
          '''    [{from:"targets",min:0,max:1},/min and .max must both be 1/],
            [{from:"targets",min:1,max:2},/min and .max must both be 1/],'''.replace('            ',''),
          '''    [{from:"targets",min:0,max:1},/min must be a positive integer/],
            [{from:"targets",min:2,max:1},/max must be an integer >= min/],'''.replace('            ',''),
          'invalid selector assertions')
          marker='test("unsupported Common Play selector shapes reject explicitly",()=>{'
          addition='''test("bounded Common Play selector preserves authored multi-target limits without fabricating spatial facts",()=>{
            const authored=structuredClone(AUTHORED);
            authored.entryPoints[0].targeting={from:"targets",min:1,max:2};
            authored.entryPoints[0].operations=[];
            const definition=parseManualCommonPlayOperationDefinition(authored);
            const state=runtimeState();
            const selected=[target("goblin","enemy"),target("hero","self")];
            const pending=compileCommonPlayEntryPointOperations(TEST_PROFILE,state,definition,{
              resolutionId:"external-multi-targeting",
              actorId:"hero",
              entryPointId:"mend-other",
              targetingTargets:selected,
            });
            assert.equal(pending.operations.length,1);
            const targeting=pending.operations[0];
            assert.equal(targeting.kind,"targeting");
            if(targeting.kind!=="targeting") return;
            assert.deepEqual(targeting.rule,{kind:"creature",minTargets:1,maxTargets:2,directTarget:false});
            assert.deepEqual(targeting.targets,selected);

            const committed=resolveCommonPlayEntryPointOperations(TEST_PROFILE,state,definition,{
              resolutionId:"external-multi-targeting-commit",
              actorId:"hero",
              entryPointId:"mend-other",
              targetingTargets:selected,
            });
            assert.equal(committed.status,"committed");
            if(committed.status!=="committed") return;
            assert.deepEqual((committed.results["external-multi-targeting-commit:targeting"] as {targets:Array<{targetId:string}>}).targets.map((entry)=>entry.targetId),["goblin","hero"]);
          });

          '''.replace('          ','')
          if marker not in text:
              raise SystemExit('missing domain insertion marker')
          text=text.replace(marker,addition+marker,1)
          domain.write_text(text)

          production=Path('tests/ui/installedCommonPlayProductionRuntime.test.ts')
          text=production.read_text()
          marker='test("installed Common Play targeting validates one existing target before healing and supports Undo",async()=>{'
          addition='''test("unknown installed Common Play preserves a bounded multi-target selection through production resolution",async()=>{
            const adapter=new MockAdapter();
            const payload=JSON.parse(targetingPackagePayload()) as {content:Array<{mechanics:Array<{config:{entryPoints:Array<{targeting:{from:string;min:number;max:number};operations:unknown[]}>}}>}>};
            const entryPoint=payload.content[0].mechanics[0].config.entryPoints[0];
            entryPoint.targeting={from:"targets",min:1,max:2};
            entryPoint.operations=[];
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(JSON.stringify(payload));
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(TARGETING_IDENTITY.contentId,TARGETING_IDENTITY.moduleId,"1"),
              mechanicId:TARGETING_IDENTITY.mechanicId,
              entryPointId:TARGETING_IDENTITY.entryPointId,
            });
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            await adapter.resolveAction(actionId,["combatant.goblin-a","combatant.goblin-b"]);
            const snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete");
            assert.equal(snapshot.resolution?.actionId,actionId);
            assert.deepEqual(snapshot.resolution?.targetIds,["combatant.goblin-a","combatant.goblin-b"]);
            assert.ok(snapshot.resolution?.detail.some((line)=>/validated 2 target/.test(line)));
          });

          '''.replace('          ','')
          if marker not in text:
              raise SystemExit('missing production insertion marker')
          text=text.replace(marker,addition+marker,1)
          production.write_text(text)
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family E bounded target slice
        run: >-
          npx tsx --test
          tests/domain/commonPlayTargetingRuntime.test.ts
          tests/ui/installedCommonPlayProductionRuntime.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified change and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-e-bounded-targets-retry.yml .github/workflows/c9-family-e-bounded-targets-step.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/commonPlayTargetingRuntime.test.ts tests/ui/installedCommonPlayProductionRuntime.test.ts
          git commit -m "feat(c9): support bounded multi-target selectors"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
