name: C9 Final Gate N Rerun 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-final-gate-n-rerun-71304.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Gate N coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs --gate-n
      - name: Legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Unknown external Common Play acceptance slices
        run: |
          node --import tsx --test \
            tests/domain/commonPlaySenseRuntime.test.ts \
            tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts \
            tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts \
            tests/ui/installedCommonPlayPropertyModifierProduction.test.ts \
            tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts \
            tests/ui/phase09CommonPlayResourcePersistence.test.ts \
            tests/ui/c9FamilyQAuthorityResponderProduction.test.ts \
            tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts \
            tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts
      - name: TypeScript
        run: npm exec tsc -- --noEmit
