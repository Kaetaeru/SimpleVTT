name: C9 Family J Ledger Reconcile R2 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-j-ledger-reconcile-r2-71304.yml]

permissions:
  contents: write

jobs:
  publish-verified-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply already-verified Family J authority updates to latest HEAD
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat >/tmp/apply_family_j.py <<'PY'
          import json
          from pathlib import Path

          baseline_path=Path('.agents/LEGACY_EXECUTION_BASELINE.json')
          baseline=json.loads(baseline_path.read_text(encoding='utf-8'))
          entries=baseline['entries']
          old=[entry for entry in entries if entry.get('module')=='./unarmedControlRuntimeAdapter']
          new=[entry for entry in entries if entry.get('module')=='./structuralSaveConditionRuntimeAdapter']
          if new:
              if len(new)!=1 or new[0].get('classification')!='GENERIC_ENGINE':
                  raise SystemExit('structural save-condition classification is not uniquely GENERIC_ENGINE')
              entries[:]=[entry for entry in entries if entry.get('module')!='./unarmedControlRuntimeAdapter']
          else:
              if len(old)!=1 or old[0].get('classification')!='GENERIC_ENGINE':
                  raise SystemExit('stale Unarmed classification anchor changed')
              old[0]['module']='./structuralSaveConditionRuntimeAdapter'
          baseline_path.write_text(json.dumps(baseline,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ledger_path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          ledger=json.loads(ledger_path.read_text(encoding='utf-8'))
          row=next((entry for entry in ledger['rows'] if entry.get('family')=='J'),None)
          if row is None:
              raise SystemExit('Family J row missing')
          if row.get('disposition') not in ('INCOMPLETE','IMPLEMENTED'):
              raise SystemExit(f"unexpected Family J disposition: {row.get('disposition')}")
          row['disposition']='IMPLEMENTED'
          row['remainingNamedSeams']=[]

          old_sentence='Family J remains incomplete for complete Unarmed Strike source composition.'
          replacement='Complete Unarmed Strike source composition is production-proven through unknown installed Common Play and the built-in source projection now routes structural save-condition payloads through the generic structuralSaveConditionRuntimeAdapter plus shared Resolver rather than an Unarmed-specific execution import.'
          state=row.get('currentState','')
          if old_sentence in state:
              state=state.replace(old_sentence,replacement)
          elif replacement not in state:
              state=state.rstrip()+' '+replacement
          row['currentState']=state

          def add(field,value):
              values=row.setdefault(field,[])
              if value not in values:
                  values.append(value)

          source=row.setdefault('sourceEvidence',[])
          source[:]=[entry for entry in source if entry!='unarmedControlRuntimeAdapter.ts']
          add('sourceEvidence','structuralSaveConditionRuntimeAdapter.ts')
          add('sourceEvidence','tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts')
          add('implementationEvidence','offlineRuntimeAdapters.ts routes source-owned runtimeSaveCondition actions through structuralSaveConditionRuntimeAdapter.ts; the adapter consumes structural choose/saveAbilities/condition/economy payloads and resolves through resolvePendingResolution without action/content identity dispatch')
          add('implementationEvidence','Common Play test.property choose:highest plus damage.apply, condition.apply, movement.relocate, and structural attack economy compose complete Unarmed Strike semantics through the shared Resolver')
          add('productionEvidence','tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts proves unknown installed Unarmed damage, Grapple, Shove-to-Prone, Shove-to-Push, Extra Attack payment, event-native Undo, and source-owned spatial facts through Common Play/Resolver')
          add('productionEvidence','49830ee9769243f3fb40a5ff3c13c9cfe32a585d makes built-in STR/DEX best-save selection source-owned via choose:highest; b69b15e69e1c778e856f9871114eb90364c858ed replaces the Unarmed-specific runtime import with the generic structural save-condition runtime')
          add('identityInvarianceEvidence','tests/ui/c9FamilyJUnarmedSourceComposition71304.test.ts repeats complete Unarmed damage/Grapple/Shove semantics after unrelated module/content/mechanic/entry-point identity rename; unarmedStrikeRuntime.test.ts independently preserves source projection behavior after action ID and presentation rename')
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 /tmp/apply_family_j.py
            node scripts/check-v1-mechanism-coverage.mjs
            node scripts/check-legacy-execution-boundary.mjs
            git rm -f --ignore-unmatch .github/workflows/c9-family-j-ledger-reconcile-r2-71304.yml .github/workflows/c9-family-j-unarmed-source-composition-71304.yml
            git add .agents/LEGACY_EXECUTION_BASELINE.json docs/rules/v1-mechanism-coverage-ledger.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(c9): finalize Family J attack-control coverage"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 1
          done
          exit 1
