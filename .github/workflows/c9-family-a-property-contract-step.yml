name: C9 Family A Property Contract Step
on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-family-a-property-contract-step.yml]
permissions:
  contents: write
jobs:
  property-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply Family A contract slice
        shell: python
        run: |
          import json
          from pathlib import Path

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text())
          prop=schema['$defs']['propertyModify']
          if prop['required'] != ['kind','property','operation','value']:
              raise SystemExit('unexpected propertyModify contract')
          prop['required']=['kind','property','operation','value','target','owner','source','duration','lifetime','instancePolicy']
          prop['properties'].update({
            'target':{'enum':['actor','target']},
            'owner':{'const':'effect'},
            'source':{'const':'definition'},
            'duration':{
              'type':'object','required':['kind','amount','unit'],
              'properties':{
                'kind':{'const':'elapsed'},
                'amount':{'type':'object','required':['value'],'properties':{'value':{'type':'integer','minimum':1}},'additionalProperties':False},
                'unit':{'enum':['seconds','minutes','hours','days']},
              },'additionalProperties':False,
            },
            'lifetime':{
              'type':'object','required':['kind','onEnd'],
              'properties':{'kind':{'const':'until-duration'},'onEnd':{'const':'destroy'}},
              'additionalProperties':False,
            },
            'instancePolicy':{'enum':['stack','replace','unique-by-source','profile-policy']},
          })
          schema_path.write_text(json.dumps(schema,indent=2,ensure_ascii=False)+'\n')

          path=Path('src/domain/commonPlayOperationRuntime.ts')
          s=path.read_text()
          def once(old,new,label):
              global s
              if s.count(old)!=1: raise SystemExit(f'{label}: expected one anchor, got {s.count(old)}')
              s=s.replace(old,new,1)

          once('type CommonPlayResourceChange={', '''type CommonPlayPropertyModifier={
            kind:"property.modify";
            property:string;
            operation:"add"|"subtract"|"set"|"min"|"max"|"multiply";
            value:CommonPlayExpression;
            target:"actor"|"target";
            owner:"effect";
            source:"definition";
            duration:{kind:"elapsed";amount:LiteralNumberExpression;unit:"seconds"|"minutes"|"hours"|"days"};
            lifetime:{kind:"until-duration";onEnd:"destroy"};
            instancePolicy:"stack"|"replace"|"unique-by-source"|"profile-policy";
          };

          type CommonPlayResourceChange={''','type')
          once('export type CommonPlayOperation=\n  |CommonPlayResourceChange', 'export type CommonPlayOperation=\n  |CommonPlayPropertyModifier\n  |CommonPlayResourceChange','union')
          once('const D20_TEST_KEYS=new Set(["kind","roller","property","dc","perTarget"]);', '''const D20_TEST_KEYS=new Set(["kind","roller","property","dc","perTarget"]);
          const PROPERTY_MODIFY_KEYS=new Set(["kind","property","operation","value","target","owner","source","duration","lifetime","instancePolicy"]);
          const PROPERTY_DURATION_KEYS=new Set(["kind","amount","unit"]);
          const PROPERTY_LIFETIME_KEYS=new Set(["kind","onEnd"]);''','keys')
          once('function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {', '''function numericExpression(value:unknown,label:string):CommonPlayExpression {
            const expression=object(value,label);
            if("value" in expression) return literalExpression(expression,label);
            if("ref" in expression) {
              supportedKeys(expression,new Set(["ref"]),label);
              return {ref:nonEmptyString(expression.ref,`${label}.ref`)};
            }
            supportedKeys(expression,new Set(["op","args"]),label);
            if(expression.op!=="add"&&expression.op!=="subtract"&&expression.op!=="multiply"&&expression.op!=="divide"&&expression.op!=="min"&&expression.op!=="max"&&expression.op!=="floor"&&expression.op!=="ceil") throw new DomainEvaluationError(`${label}.op is unsupported`);
            if(!Array.isArray(expression.args)||!expression.args.length) throw new DomainEvaluationError(`${label}.args must be a non-empty array`);
            return {op:expression.op,args:expression.args.map((arg,index)=>numericExpression(arg,`${label}.args[${index}]`))};
          }

          function parseTargetingSelector(value:unknown,label:string):CommonPlayTargetingSelector {''','expression')
          once('''function parseOperation(value:unknown,label:string):CommonPlayOperation {
            const operation=object(value,label);''', '''function parseOperation(value:unknown,label:string):CommonPlayOperation {
            const operation=object(value,label);
            if(operation.kind==="property.modify") {
              supportedKeys(operation,PROPERTY_MODIFY_KEYS,label);
              const mode=operation.operation;
              if(mode!=="add"&&mode!=="subtract"&&mode!=="set"&&mode!=="min"&&mode!=="max"&&mode!=="multiply") throw new DomainEvaluationError(`${label}.operation is unsupported`);
              if(operation.target!=="actor"&&operation.target!=="target") throw new DomainEvaluationError(`${label}.target must be actor or target`);
              if(operation.owner!=="effect") throw new DomainEvaluationError(`${label}.owner must be effect`);
              if(operation.source!=="definition") throw new DomainEvaluationError(`${label}.source must be definition`);
              const duration=object(operation.duration,`${label}.duration`);
              supportedKeys(duration,PROPERTY_DURATION_KEYS,`${label}.duration`);
              if(duration.kind!=="elapsed") throw new DomainEvaluationError(`${label}.duration.kind must be elapsed for the portable property modifier slice`);
              const amount=literalExpression(duration.amount,`${label}.duration.amount`);
              if(amount.value<=0) throw new DomainEvaluationError(`${label}.duration.amount must be positive`);
              if(duration.unit!=="seconds"&&duration.unit!=="minutes"&&duration.unit!=="hours"&&duration.unit!=="days") throw new DomainEvaluationError(`${label}.duration.unit is unsupported`);
              const lifetime=object(operation.lifetime,`${label}.lifetime`);
              supportedKeys(lifetime,PROPERTY_LIFETIME_KEYS,`${label}.lifetime`);
              if(lifetime.kind!=="until-duration"||lifetime.onEnd!=="destroy") throw new DomainEvaluationError(`${label}.lifetime must destroy at duration end`);
              if(operation.instancePolicy!=="stack"&&operation.instancePolicy!=="replace"&&operation.instancePolicy!=="unique-by-source"&&operation.instancePolicy!=="profile-policy") throw new DomainEvaluationError(`${label}.instancePolicy is unsupported`);
              return {kind:"property.modify",property:nonEmptyString(operation.property,`${label}.property`),operation:mode,value:numericExpression(operation.value,`${label}.value`),target:operation.target,owner:"effect",source:"definition",duration:{kind:"elapsed",amount,unit:duration.unit},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:operation.instancePolicy};
            }''','parser')
          once('    if(operation.kind==="roll.modify") continue;\n    if(operation.kind==="resource.recharge") {', '    if(operation.kind==="roll.modify") continue;\n    if(operation.kind==="property.modify") throw new DomainEvaluationError("property.modify production lowering is not implemented; Effect-owned property modifiers must not fall through to another execution engine");\n    if(operation.kind==="resource.recharge") {','lowering')
          path.write_text(s)

          Path('tests/domain/commonPlayPropertyContractRuntime.test.ts').write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { compileCommonPlayEntryPointOperations, parseCommonPlayOperationDefinition } from "../../src/domain/commonPlayOperationRuntime";
          import { runtimeState, TEST_PROFILE } from "./rulesTestState";

          function definition(id="external.unseen.property-owner") { return {schemaVersion:"0.2-draft",id,entryPoints:[{id:"activate",invocation:"manual",operations:[{kind:"property.modify",property:"movement.walk",operation:"add",value:{op:"add",args:[{ref:"movement.walk"},{value:10}]},target:"actor",owner:"effect",source:"definition",duration:{kind:"elapsed",amount:{value:1},unit:"minutes"},lifetime:{kind:"until-duration",onEnd:"destroy"},instancePolicy:"unique-by-source"}]}]}; }

          test("property.modify preserves explicit effect ownership without content identity dispatch",()=>{
            const parsed=parseCommonPlayOperationDefinition(definition());
            const operation=parsed.entryPoints[0]?.operations[0];
            assert.equal(operation?.kind,"property.modify");
            assert.deepEqual(operation,parseCommonPlayOperationDefinition(definition("external.renamed.property-owner")).entryPoints[0]?.operations[0]);
            assert.deepEqual(operation&&"value" in operation?operation.value:undefined,{op:"add",args:[{ref:"movement.walk"},{value:10}]});
          });

          test("property.modify rejects ambiguous ownership and has no production fallback",()=>{
            const missing=definition() as any; delete missing.entryPoints[0].operations[0].owner;
            assert.throws(()=>parseCommonPlayOperationDefinition(missing),/owner must be effect/);
            const durable=definition() as any; durable.entryPoints[0].operations[0].duration={kind:"durable"};
            assert.throws(()=>parseCommonPlayOperationDefinition(durable),/duration.kind must be elapsed/);
            const parsed=parseCommonPlayOperationDefinition(definition());
            assert.throws(()=>compileCommonPlayEntryPointOperations(TEST_PROFILE,runtimeState(),parsed,{resolutionId:"property-contract",actorId:"hero",entryPointId:"activate"}),/property.modify production lowering is not implemented/);
          });
          ''')
      - run: npx tsx --test tests/domain/commonPlayPropertyContractRuntime.test.ts tests/domain/commonPlayDefinitionRuntime.test.ts
      - run: npm run test:common-play-definition
      - run: node -e "JSON.parse(require('node:fs').readFileSync('schemas/common-play-contract.schema.json','utf8'))"
      - run: npm run generate:content
      - run: npx tsc --noEmit
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/common-play-contract.schema.json src/domain/commonPlayOperationRuntime.ts tests/domain/commonPlayPropertyContractRuntime.test.ts
          git rm .github/workflows/c9-family-a-property-contract-step.yml
          git commit -m "feat(c9): define property modifier ownership contract"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
