name: C9 Verify Family J Spatial Ordering

on:
  push:
    branches: ["agent/c9-gate-n-coverage-reconciliation"]
    paths:
      - ".github/workflows/c9-verify-family-j-spatial.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11db010a68de94c724aba9c48d07c5ebd10ca59f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Verify queue-before-spatial authority ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ui/c9FamilyJSpatialAttackProduction.test.ts')
          s=p.read_text()
          old='''  setRelation(internal,5,true,"half");\n  await adapter.setQueuedD20(15);'''
          new='''  await adapter.setQueuedD20(15);\n  setRelation(internal,5,true,"half");'''
          if s.count(old)!=1: raise SystemExit(f'expected ordering block once, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          npx tsx --test tests/ui/c9FamilyJSpatialAttackProduction.test.ts
