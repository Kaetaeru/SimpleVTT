name: C9 Diagnose Family J Spatial

on:
  push:
    branches: ["agent/c9-gate-n-coverage-reconciliation"]
    paths:
      - ".github/workflows/c9-verify-family-j-spatial.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11db010a68de94c724aba9c48d07c5ebd10ca59f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Expose spatial rejection detail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ui/c9FamilyJSpatialAttackProduction.test.ts')
          s=p.read_text()
          old='assert.equal(snapshot.resolution?.rollKind,"attack");'
          new='assert.equal(snapshot.resolution?.rollKind,"attack",JSON.stringify(snapshot.resolution));'
          if s.count(old)!=1: raise SystemExit(f'expected assertion once, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          npx tsx --test tests/ui/c9FamilyJSpatialAttackProduction.test.ts
