name: C9 Diagnose Family J Spatial Candidate

on:
  push:
    branches: ["agent/c9-gate-n-coverage-reconciliation"]
    paths:
      - ".github/workflows/c9-verify-family-j-spatial.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11db010a68de94c724aba9c48d07c5ebd10ca59f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Expose selector candidate spatial state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          s=p.read_text()
          old='  const spatial=authoritativeCommonPlaySpatialRelation(scene,actor.id,target.id);'
          new=old+'\n  console.error("C9_SPATIAL_CANDIDATE",actor.id,target.id,Object.keys(scene.spatialByPair??{}),spatial);'
          if s.count(old)!=1: raise SystemExit(f'expected candidate spatial line once, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          t=Path('tests/ui/c9FamilyJSpatialAttackProduction.test.ts')
          ts=t.read_text()
          old_assert='assert.equal(snapshot.resolution?.rollKind,"attack");'
          new_assert='assert.equal(snapshot.resolution?.rollKind,"attack",JSON.stringify(snapshot.resolution));'
          if ts.count(old_assert)!=1: raise SystemExit(f'expected assertion once, found {ts.count(old_assert)}')
          t.write_text(ts.replace(old_assert,new_assert))
          PY
          npx tsx --test tests/ui/c9FamilyJSpatialAttackProduction.test.ts
