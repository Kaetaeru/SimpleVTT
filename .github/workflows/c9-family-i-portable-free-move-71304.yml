name: C9 Family I Portable Free Move 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-portable-free-move-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-i-portable-free-move-71304
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - name: Add portable granted-movement operation and proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          runtime = Path('src/domain/commonPlayOperationRuntime.ts')
          text = runtime.read_text(encoding='utf-8')

          old = 'import { DomainEvaluationError, type ExpressionNode, type RollStateContribution, type RulesProfileLike } from "./profileEngine";'
          new = 'import { DomainEvaluationError, evaluateExpression, type ExpressionNode, type RollStateContribution, type RulesProfileLike } from "./profileEngine";'
          if old not in text and new not in text:
              raise SystemExit('profileEngine import anchor missing')
          text = text.replace(old, new, 1)

          anchor = 'type CommonPlayMovementStand={kind:"movement.stand";target:"actor"|"self"};\n'
          addition = '''type CommonPlayMovementGrant={\n  kind:"movement.grant";\n  target:"actor"|"self";\n  distance:CommonPlayExpression;\n  maximumDistance?:CommonPlayExpression;\n  doesNotProvokeOpportunityAttacks?:boolean;\n};\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('movement type anchor missing')
              text = text.replace(anchor, anchor + addition, 1)

          union_anchor = '  |CommonPlayMovementDefinition\n  |CommonPlayMovementStand\n'
          union_new = '  |CommonPlayMovementDefinition\n  |CommonPlayMovementGrant\n  |CommonPlayMovementStand\n'
          if union_new not in text:
              if union_anchor not in text:
                  raise SystemExit('operation union anchor missing')
              text = text.replace(union_anchor, union_new, 1)

          key_anchor = 'const MOVEMENT_RELOCATE_KEYS=new Set(["kind","mode","movementType","target","distance","costMultiplier","doesNotProvokeOpportunityAttacks","destinationFact"]);\n'
          key_new = key_anchor + 'const MOVEMENT_GRANT_KEYS=new Set(["kind","target","distance","maximumDistance","doesNotProvokeOpportunityAttacks"]);\n'
          if 'const MOVEMENT_GRANT_KEYS=' not in text:
              if key_anchor not in text:
                  raise SystemExit('movement key anchor missing')
              text = text.replace(key_anchor, key_new, 1)

          parser_anchor = '''  if(operation.kind==="movement.stand") {\n    supportedKeys(operation,MOVEMENT_STAND_KEYS,label);\n'''
          parser_block = '''  if(operation.kind==="movement.grant") {\n    supportedKeys(operation,MOVEMENT_GRANT_KEYS,label);\n    if(operation.target!=="actor"&&operation.target!=="self") throw new DomainEvaluationError(`${label}.target must be actor or self`);\n    if(operation.doesNotProvokeOpportunityAttacks!==undefined&&typeof operation.doesNotProvokeOpportunityAttacks!=="boolean") throw new DomainEvaluationError(`${label}.doesNotProvokeOpportunityAttacks must be boolean`);\n    return {\n      kind:"movement.grant",\n      target:operation.target,\n      distance:numericExpression(operation.distance,`${label}.distance`),\n      ...(operation.maximumDistance===undefined?{}:{maximumDistance:numericExpression(operation.maximumDistance,`${label}.maximumDistance`)}),\n      ...(operation.doesNotProvokeOpportunityAttacks===undefined?{}:{doesNotProvokeOpportunityAttacks:operation.doesNotProvokeOpportunityAttacks===true}),\n    };\n  }\n'''
          if parser_block not in text:
              if parser_anchor not in text:
                  raise SystemExit('movement parser anchor missing')
              text = text.replace(parser_anchor, parser_block + parser_anchor, 1)

          compiler_anchor = '''    if(operation.kind==="movement.stand") {\n      const actor=state.combatants[input.actorId];\n'''
          compiler_block = '''    if(operation.kind==="movement.grant") {\n      const properties=input.movementProperties??{};\n      const resolveReference=(property:string)=>{\n        const value=properties[property];\n        if(!Number.isFinite(value)) throw new DomainEvaluationError(`movement.grant property is unavailable: ${property}`);\n        return Number(value);\n      };\n      const distance=evaluateExpression(operation.distance as ExpressionNode,resolveReference);\n      const maximumDistance=evaluateExpression((operation.maximumDistance??operation.distance) as ExpressionNode,resolveReference);\n      if(!Number.isFinite(distance)||distance<0) throw new DomainEvaluationError("movement.grant distance must be a non-negative finite number");\n      if(!Number.isFinite(maximumDistance)||maximumDistance<0) throw new DomainEvaluationError("movement.grant maximumDistance must be a non-negative finite number");\n      operations.push({\n        id:operationId,\n        kind:"free-move",\n        actorId:input.actorId,\n        distanceFeet:distance,\n        maximumDistanceFeet:maximumDistance,\n        ...(operation.doesNotProvokeOpportunityAttacks===true?{doesNotProvokeOpportunityAttacks:true}:{}),\n      });\n      continue;\n    }\n'''
          if compiler_block not in text:
              if compiler_anchor not in text:
                  raise SystemExit('movement compiler anchor missing')
              text = text.replace(compiler_anchor, compiler_block + compiler_anchor, 1)

          runtime.write_text(text, encoding='utf-8')

          schema_path = Path('schemas/common-play-contract.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          refs = schema['$defs']['operation']['oneOf']
          grant_ref = {'$ref':'#/$defs/movementGrant'}
          if grant_ref not in refs:
              movement_index = next(i for i, entry in enumerate(refs) if entry.get('$ref') == '#/$defs/movementOperation')
              refs.insert(movement_index, grant_ref)
          schema['$defs']['movementGrant'] = {
              'type':'object',
              'required':['kind','target','distance'],
              'properties':{
                  'kind':{'const':'movement.grant'},
                  'target':{'enum':['actor','self']},
                  'distance':{'$ref':'#/$defs/expression'},
                  'maximumDistance':{'$ref':'#/$defs/expression'},
                  'doesNotProvokeOpportunityAttacks':{'type':'boolean'},
                  'when':{'$ref':'#/$defs/predicate'},
              },
              'additionalProperties':False,
          }
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cat > tests/ui/c9FamilyIPortableFreeMoveProduction.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { runtimeResolutionEventHistory } from "../../src/app/runtimeResolutionEventHistory";

          function modulePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.content`;
            const mechanicId=`${prefix}.mechanic`;
            return {
              moduleId,contentId,mechanicId,
              json:JSON.stringify({
                schemaVersion:"0.1-draft",
                moduleId,
                moduleVersion:"1",
                rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},
                defaultLocale:"en",
                source:{document:"Unknown Family I granted movement",version:"1",license:"CC0",srdDerived:false},
                dependencies:[],conflicts:[],capabilities:[],
                content:[{
                  id:contentId,
                  category:"option",
                  presentation:{defaultLocale:"en",originalName:"Portable Granted Movement",locales:{en:{name:"Portable Granted Movement"}}},
                  mechanics:[{
                    kind:"common-play",
                    config:{
                      schemaVersion:"0.2-draft",
                      id:mechanicId,
                      entryPoints:[{
                        id:"move-now",
                        invocation:"manual",
                        operations:[{
                          kind:"movement.grant",
                          target:"actor",
                          distance:{ref:"movement.walk"},
                          maximumDistance:{ref:"movement.walk"},
                          doesNotProvokeOpportunityAttacks:true,
                        }],
                      }],
                    },
                  }],
                }],
              }),
            };
          }

          async function run(prefix:string) {
            const adapter=new MockAdapter();
            const pack=modulePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const actionId=installedCommonPlayActionId({
              catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),
              mechanicId:pack.mechanicId,
              entryPointId:"move-now",
            });
            const before=(await adapter.getSnapshot()).scene.economyByActor["char.aelar"]!.movement;
            await adapter.resolveAction(actionId,["char.aelar"]);
            const snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete");
            assert.equal(snapshot.scene.economyByActor["char.aelar"]?.movement,before,"granted movement must not spend regular movement budget");
            const history=runtimeResolutionEventHistory(adapter);
            assert.equal(history?.events.length,1);
            assert.equal(history?.events[0]?.kind,"free-move");
            assert.deepEqual(history?.events[0]?.result,{
              distanceFeet:30,
              maximumDistanceFeet:30,
              regularMovementSpent:0,
              doesNotProvokeOpportunityAttacks:true,
            });
            assert.match(history?.events[0]?.provenance[0]?.reason??"",/without provoking Opportunity Attacks/);
            await adapter.undoLastResolution();
            assert.equal((await adapter.getSnapshot()).scene.economyByActor["char.aelar"]?.movement,before);
          }

          test("unknown Common Play executes granted movement through the generic free-move kernel",async()=>{
            await run("external-family-i-free-move");
          });

          test("renaming every external identity preserves granted movement semantics",async()=>{
            await run("renamed-family-i-free-move");
          });
          TS
      - name: Generate content and verify Family I portable movement
        run: |
          npm run generate:content
          npx tsx --test \
            tests/ui/c9FamilyIPortableFreeMoveProduction.test.ts \
            tests/ui/c9FamilyIMovementGrantProduction.test.ts \
            tests/ui/c9FamilyIMovementProduction.test.ts \
            tests/ui/c9FamilyIRulesDerivedMovementCostProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish implementation and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-i-portable-free-move-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyIPortableFreeMoveProduction.test.ts
          git commit -m "feat(c9): make granted movement portable"
          for attempt in $(seq 1 8); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
