name: C9 Family K Portable Mastery

on:
  push:
    paths:
      - "src/app/connectedSessionRuntimeAdapter.ts"
      - "src/app/installedCommonPlayRuntimeAdapter.ts"
      - "src/app/progressionPhase08WeaponMasteryAdapter.ts"
      - "src/domain/commonPlayOperationRuntime.ts"
      - "src/domain/commonPlayMovementRuntime.ts"
      - "src/domain/resolution.ts"
      - "src/domain/resolutionTypes.ts"
      - "src/domain/weaponMasteryProgression.ts"
      - "src/domain/progressionPhase08WeaponMastery.ts"
      - "tests/domain/commonPlayWeaponMasteryComposition.test.ts"
      - "tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts"
      - "tests/ui/c9FamilyKOutcomeDamageProduction.test.ts"
      - "tests/ui/c9FamilyKWeaponMasteryGraze.test.ts"
      - "tests/ui/c9FamilyKConnectedMasteryShapes.test.ts"
      - "tests/ui/progressionPhase08WeaponMasteryRuntime.test.ts"
      - ".github/workflows/c9-family-k-portable-mastery.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify portable Weapon Mastery composition and production paths
        run: >-
          npx tsx --test
          tests/domain/commonPlayWeaponMasteryComposition.test.ts
          tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts
          tests/ui/c9FamilyKOutcomeDamageProduction.test.ts
          tests/ui/c9FamilyKWeaponMasteryGraze.test.ts
          tests/ui/c9FamilyKConnectedMasteryShapes.test.ts
          tests/ui/progressionPhase08WeaponMasteryRuntime.test.ts
      - name: Typecheck and build
        run: npm run build
