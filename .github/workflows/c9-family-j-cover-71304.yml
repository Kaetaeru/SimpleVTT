name: C9 Family J Cover 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-cover-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Add generic attack cover semantic and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime=Path('src/domain/commonPlayOperationRuntime.ts')
          text=runtime.read_text()
          marker='const attackCoverTargetModifier='
          if marker not in text:
            anchor='''    const selectedTargetFacts=input.targetId\n      ? input.targetingTargets?.find((target)=>target.id===input.targetId)\n      : undefined;\n    const conditionContext={'''
            replacement='''    const selectedTargetFacts=input.targetId\n      ? input.targetingTargets?.find((target)=>target.id===input.targetId)\n      : undefined;\n    const attackCoverTargetModifier=entryPoint.test.kind==="attack-roll"\n      ?selectedTargetFacts?.cover==="half"?2:selectedTargetFacts?.cover==="three-quarters"?5:0\n      :0;\n    if(entryPoint.test.kind==="attack-roll"&&selectedTargetFacts?.cover==="total") {\n      throw new DomainEvaluationError("Common Play attack-roll target has total cover");\n    }\n    const conditionContext={'''
            if anchor not in text: raise SystemExit('selected target facts anchor changed')
            text=text.replace(anchor,replacement,1)
            old='''        target:literalInteger(entryPoint.test.dc,"d20 target"),\n        targetSource:`common-play:${supported.id}:${entryPoint.id}:dc`,'''
            new='''        target:literalInteger(entryPoint.test.dc,"d20 target")+attackCoverTargetModifier,\n        targetSource:`common-play:${supported.id}:${entryPoint.id}:dc${attackCoverTargetModifier?":cover":""}`,'''
            if old not in text: raise SystemExit('d20 target anchor changed')
            text=text.replace(old,new,1)
            runtime.write_text(text)

          test=Path('tests/ui/c9FamilyJPortableControlProduction.test.ts')
          text=test.read_text()
          if 'generic attack-roll applies authoritative cover' not in text:
            text=text.replace('''import { MockAdapter } from "../../src/app/mockAdapter";\n''','''import { MockAdapter } from "../../src/app/mockAdapter";\nimport { SIMPLEVTT_APP_RULES_PROFILE } from "../../src/app/realResolutionService";\nimport { compileCommonPlayEntryPointOperations, parseCommonPlayOperationDefinition } from "../../src/domain/commonPlayOperationRuntime";\n''',1)
            text+='''\n\ntest("Family J generic attack-roll applies authoritative cover without content identity dispatch",async()=>{\n  const adapter=new MockAdapter();\n  await adapter.startInitiative();\n  await adapter.setCurrentActor("char.aelar");\n  const snapshot=await adapter.getSnapshot();\n  const state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene);\n  assert.ok(state);\n  const definition=parseCommonPlayOperationDefinition({schemaVersion:"0.2-draft",id:"external.attack-cover-probe",entryPoints:[{id:"attack",invocation:"manual",targeting:{from:"targets",min:1,max:1},test:{kind:"attack-roll",roller:"actor",dc:{value:12}},operations:[]}]});\n  const compile=(cover:"none"|"half"|"three-quarters"|"total")=>compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,state,definition,{resolutionId:`cover-${cover}`,actorId:"char.aelar",entryPointId:"attack",targetId:TARGET_ID,targetingTargets:[{id:TARGET_ID,kind:"creature",relation:"enemy",distanceFeet:5,visible:true,cover}],d20:{faces:[10],targetId:TARGET_ID}});\n  for(const [cover,target] of [["none",12],["half",14],["three-quarters",17]] as const){\n    const pending=compile(cover);\n    const operation=pending.operations.find((candidate)=>candidate.id===`cover-${cover}:test`);\n    assert.equal(operation?.kind,"d20");\n    if(operation?.kind==="d20") assert.equal(operation.request.target,target);\n  }\n  assert.throws(()=>compile("total"),/total cover/);\n});\n'''
            test.write_text(text)
          PY
      - name: Verify Family J cover slice
        run: |
          node --import tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified slice
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-j-cover-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts tests/ui/c9FamilyJPortableControlProduction.test.ts .github/workflows/c9-family-j-cover-71304.yml
          git commit -m "feat(c9): apply structural cover to portable attacks"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
