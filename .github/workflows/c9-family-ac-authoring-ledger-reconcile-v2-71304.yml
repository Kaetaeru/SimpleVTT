name: C9 Family AC Authoring Ledger Reconcile V2

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-ac-authoring-ledger-reconcile-v2-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm ci
      - name: Verify persisted Family AC authoring contract
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { parseCommonPlayDefinition } from "./src/domain/commonPlayDefinitionRuntime.ts";

          const authored={
            schemaVersion:"0.2-draft",
            id:"external.unseen.special-actions",
            entryPoints:[
              {id:"tail-swipe",invocation:"granted",operations:[{kind:"resource.change",resource:"resource.legendary",amount:{value:0}}]},
            ],
            specialActions:[
              {id:"legendary",timing:{kind:"after-turn",actor:"other"},poolResourceId:"resource.legendary",options:[{id:"tail",cost:1,entryPointId:"tail-swipe"}]},
              {id:"lair",timing:{kind:"initiative-count",count:20},options:[{id:"pulse",cost:0,entryPointId:"tail-swipe"}]},
            ],
          };
          const parsed=parseCommonPlayDefinition(authored);
          assert.equal(parsed.specialActions?.[0]?.timing.kind,"after-turn");
          assert.equal(parsed.specialActions?.[0]?.options[0]?.entryPointId,"tail-swipe");
          assert.equal(parsed.specialActions?.[1]?.timing.kind,"initiative-count");
          assert.throws(()=>parseCommonPlayDefinition({...authored,specialActions:[{...authored.specialActions[0],ownerActorId:"dragon"}]}),/unsupported fields/);
          assert.throws(()=>parseCommonPlayDefinition({...authored,specialActions:[{id:"legendary",timing:{kind:"after-turn",actor:"other"},options:[{id:"tail",cost:0,entryPointId:"missing"}]}]}),/missing entry point/);

          const schema=JSON.parse(readFileSync("schemas/common-play-contract.schema.json","utf8"));
          assert.equal(schema.properties.specialActions.type,"array");
          assert.equal(schema.properties.specialActions.items.$ref,"#/$defs/specialAction");
          NODE
          node --import tsx --test tests/domain/commonPlayC6Runtime.test.ts tests/domain/commonPlayDefinitionRuntime.test.ts
          npx tsc --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Reconcile authoritative Family AC ledger
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          row=next(item for item in data["rows"] if item["family"]=="AC")
          row["currentState"]=(
            "Common Play persists owner-neutral specialActions authoring for turn-start/turn-end/after-turn/initiative-count timing, reusable entry-point options, optional resource pools, and per-option cost while runtime actor ownership remains session-bound. "
            "The generic special-action kernel validates concrete owner/timing/cost/option execution. RuntimeClock still lacks authoritative initiative-count progression and production still lacks the generic session dispatcher plus connected replay/reconnect path required to schedule these portable definitions, so Family AC remains INCOMPLETE."
          )
          evidence=(
            "3a101b51ab99bbb3f4e5acffd9501fb7eabc7e36 feat(c9): persist portable special timing definitions; "
            "commonPlaySpecialTimingRuntime.ts + commonPlayDefinitionRuntime.ts + common-play-contract.schema.json retain owner-neutral specialActions timing/pool/cost/multiple-option authoring by portable entryPointId reference"
          )
          if evidence not in row["implementationEvidence"]:
              row["implementationEvidence"].append(evidence)
          row["remainingNamedSeams"]=[
            seam for seam in row["remainingNamedSeams"]
            if seam != "persisted portable special-action timing/option contract"
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Commit verified reconciliation and retire duplicate staging workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules/v1-mechanism-coverage-ledger.json
          if [ -f .github/workflows/c9-family-ac-authoring-contract-71304.yml ]; then
            git rm .github/workflows/c9-family-ac-authoring-contract-71304.yml
          fi
          git rm .github/workflows/c9-family-ac-authoring-ledger-reconcile-v2-71304.yml
          git commit -m "chore(c9): reconcile Family AC authoring evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation

# rerun: reconcile verified AC authoring evidence
