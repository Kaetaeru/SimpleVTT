name: C9 Family E Import Message Reconcile

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-e-import-message-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile portable interaction validation assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=path.read_text(encoding='utf-8')
          old='/portable Common Play/.test(entry.message)'
          new='/portable (?:Common Play|consent)/.test(entry.message)'
          if text.count(old)!=1:
              raise SystemExit(f'expected one stale portable interaction assertion, got {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify RuleModule import validation contract
        run: npx tsx --test tests/ui/ruleModulePackageImport.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified assertion reconciliation
        shell: bash
        run: |
          rm -f .github/workflows/c9-family-e-import-message-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/ruleModulePackageImport.test.ts .github/workflows/c9-family-e-import-message-reconcile.yml
          git commit -m "test(c9): align portable interaction validation assertion"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
