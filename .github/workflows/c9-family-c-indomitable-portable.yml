name: C9 Family C Indomitable Portable Migration

on:
  push:
    paths:
      - '.github/workflows/c9-family-c-indomitable-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/c9-migrate-indomitable-common-play.mjs
      - run: npm run generate:content
      - name: Verify Family C Indomitable and generic d20 paths
        run: npx tsx --test tests/domain/commonPlayReactionDefinitionRuntime.test.ts tests/ui/fighterIndomitableFollowUpRuntime.test.ts tests/ui/installedCommonPlayInterceptorProductionRuntime.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Commit verified migration
        run: |
          rm -f scripts/c9-migrate-indomitable-common-play.mjs .github/workflows/c9-family-c-indomitable-portable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(common-play): migrate Indomitable declaratively'
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
