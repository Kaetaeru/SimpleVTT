name: W7-02 AUTO Verification

on:
  pull_request:
    branches:
      - work/v1-composite
    paths:
      - '.github/workflows/w7-02-auto.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'content/**'
  push:
    branches:
      - work/v1-composite
    paths:
      - '.github/workflows/w7-02-auto.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'content/**'
  workflow_dispatch:

env:
  V1_VERIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate:content
      - name: Focused W7-02 tests
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test \
            tests/ui/productionClientReconnect.test.ts \
            tests/ui/productionParticipantLifecycle.test.ts \
            tests/ui/connectedResolutionPresentation.test.ts \
            tests/ui/connectedTurnProjection.test.ts \
            tests/ui/connectedDurableFailure.test.ts \
            tests/ui/connectedOwnerInventoryRestart.test.ts \
            tests/ui/connectedLongRestHostRestartRecovery.test.ts \
            tests/ui/c9FamilyOReadyConcentrationProduction.test.ts \
            tests/ui/phase09ManualMovementReactionAdapter.test.ts \
            tests/ui/phase09ConcentrationSaveWorkflow.test.ts \
            | tee /tmp/w7-02.tap
      - name: Production build
        run: npm run build
      - name: Record exact-SHA evidence
        shell: bash
        run: |
          {
            echo "W7-02 AUTO Verification"
            echo "checkout_sha=${GITHUB_SHA}"
            echo "verification_sha=${{ env.V1_VERIFICATION_SHA }}"
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "base_sha=${{ github.event.pull_request.base.sha }}"
            echo "scenario_mapping=MP-H04..MP-H08"
            echo "command=npx tsx --test tests/ui/productionClientReconnect.test.ts tests/ui/productionParticipantLifecycle.test.ts tests/ui/connectedResolutionPresentation.test.ts tests/ui/connectedTurnProjection.test.ts tests/ui/connectedDurableFailure.test.ts tests/ui/connectedOwnerInventoryRestart.test.ts tests/ui/connectedLongRestHostRestartRecovery.test.ts tests/ui/c9FamilyOReadyConcentrationProduction.test.ts tests/ui/phase09ManualMovementReactionAdapter.test.ts tests/ui/phase09ConcentrationSaveWorkflow.test.ts"
          } > /tmp/w7-02-evidence.txt
      - name: Upload W7-02 evidence
        uses: actions/upload-artifact@v4
        with:
          name: W7-02-AUTO-${{ env.V1_VERIFICATION_SHA }}
          path: |
            /tmp/w7-02.tap
            /tmp/w7-02-evidence.txt
          if-no-files-found: error
