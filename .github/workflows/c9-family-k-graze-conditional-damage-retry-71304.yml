name: C9 Family K Graze Conditional Damage Retry 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-k-graze-conditional-damage-retry-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Reuse Family K staging and correct runtime HP observation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/c9-family-k-graze-conditional-damage-71304.yml').read_text(encoding='utf-8').splitlines()
          marker='      - name: Add outcome-conditioned portable damage and focused proof'
          start=source.index(marker)
          run_index=next(i for i in range(start+1,len(source)) if source[i]=='        run: |')
          end=next((i for i in range(run_index+1,len(source)) if source[i].startswith('      - name: ')),len(source))
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in source[run_index+1:end])+'\n'
          Path('/tmp/family-k-stage.sh').write_text(script,encoding='utf-8')
          PY
          bash /tmp/family-k-stage.sh
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts')
          text=path.read_text(encoding='utf-8')
          old='return target.hp;'
          new='return target.life.hp.current;'
          if old not in text and new not in text:
              raise SystemExit('Family K HP observation anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify Family K generic Graze slice
        run: >-
          node --import tsx --test
          tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts
          tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts
          tests/ui/c9FamilyJAttackPersistence.test.ts
      - name: Verify boundaries and types
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified Family K slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='K')
          row['currentState']='Generic Common Play now supports attack-outcome-conditioned damage through the shared Resolver, proving a Graze-like miss rider without weapon/content identity dispatch. Family K remains incomplete for the remaining mastery compositions and named progression-to-runtime convergence.'
          additions={
            'implementationEvidence':'commonPlayOperationRuntime.ts damage.apply.when reuses the generic test.outcome ResolutionOperation predicate already used by portable condition/effect operations',
            'productionEvidence':'c9FamilyKGrazeConditionalDamageProduction.test.ts unknown installed Common Play applies a Graze-like miss-only damage rider, skips it on hit, and reverses through Undo',
            'identityInvarianceEvidence':'c9FamilyKGrazeConditionalDamageProduction.test.ts repeats the Graze-like miss rider after complete external module/content/mechanic identity rename',
          }
          for field,value in additions.items():
              if value not in row[field]: row[field].append(value)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-k-graze-conditional-damage-71304.yml
          git rm .github/workflows/c9-family-k-graze-conditional-damage-retry-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "feat(c9): support portable Graze conditional damage"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
