name: C9 Family I Rules Constraints 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-rules-constraints-71304.yml

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family I rules-derived movement constraints
        run: |
          node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts tests/domain/commonPlayMovementRuntime.test.ts tests/ui/commonPlayProneStandRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Remove temporary verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-i-rules-constraints-71304.yml
          git add .github/workflows/c9-family-i-rules-constraints-71304.yml
          git commit -m "chore(c9): remove Family I temporary verifier"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
