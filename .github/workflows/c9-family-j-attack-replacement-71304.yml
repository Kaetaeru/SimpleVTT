name: C9 Family J Attack Replacement 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-attack-replacement-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch structural attack replacement and acceptance proof
        shell: python
        run: |
          from pathlib import Path

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          old='''  const extraAttackAvailable=("test" in entryPoint&&entryPoint.test?.kind==="attack-roll")&&Boolean(combatant.economy.extraAttacks?.length);'''
          new='''  const extraAttackAvailable=payment?.kind==="economy"&&payment.bucket==="action"&&payment.actionKind==="attack"&&Boolean(combatant.economy.extraAttacks?.length);'''
          if new not in text:
              assert text.count(old)==1, 'Extra Attack projector anchor drifted'
              adapter.write_text(text.replace(old,new,1),encoding='utf-8')

          Path('tests/ui/c9FamilyJAttackReplacementProduction71304.test.ts').write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { projectCommonPlayRuntimeArtifactAction } from "../../src/app/installedCommonPlayRuntimeAdapter";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          const TARGET_ID="combatant.goblin-a";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`,contentId=`${prefix}.fighter`,mechanicId=`${prefix}.attack-action`;
            const payment={kind:"economy",bucket:"action",amount:{value:1},actionKind:"attack",attacksPerAction:2,consumeAt:"commit",refundOnCancel:true};
            const targeting={from:"targets",min:1,max:1};
            const config={schemaVersion:"0.2-draft",id:mechanicId,payments:[payment],entryPoints:[
              {id:"strike",invocation:"manual",targeting,test:{kind:"attack-roll",roller:"actor",dc:{value:1}},operations:[{kind:"damage.apply",amount:{value:1},damageType:"slashing",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}}]},
              {id:"shove",invocation:"manual",targeting,test:{kind:"saving-throw",roller:"target",property:{choose:"highest",from:["save.str.modifier","save.dex.modifier"]},dc:{value:99},perTarget:false},operations:[{kind:"condition.apply",condition:"prone",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"failure"}}}]},
            ]};
            return {moduleId,contentId,mechanicId,json:JSON.stringify({schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",source:{document:"Unknown portable attack replacement",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Attack Replacement",locales:{en:{name:"Portable Attack Replacement"}}},mechanics:[{kind:"common-play",config}]}]})};
          }

          async function exercise(prefix:string) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            let snapshot=await adapter.previewContentImport(pack.json);
            assert.ok(!snapshot.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(snapshot.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            snapshot=await adapter.getSnapshot();
            const actorId=snapshot.activeCharacter.id;
            const action=(entryPointId:string)=>installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId});

            await adapter.resolveAction(action("strike"),[TARGET_ID]);
            snapshot=await adapter.getSnapshot();
            let state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(state.combatants[actorId].economy.action,false);
            assert.equal(state.combatants[actorId].economy.extraAttacks?.length,1);

            const replacement=await projectCommonPlayRuntimeArtifactAction(adapter,action("shove"),actorId,snapshot,state);
            assert.equal(replacement?.resolutionKind,"saving-throw");
            assert.equal(replacement?.available,true,"an attack-kind payment must allow a non-attack-roll replacement to consume the remaining attack");

            await adapter.setQueuedD20(1);
            await adapter.resolveAction(action("shove"),[TARGET_ID]);
            snapshot=await adapter.getSnapshot();
            state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(state.combatants[actorId].economy.action,false);
            assert.equal(state.combatants[actorId].economy.extraAttacks?.length,0);
            assert.equal(state.effects.some((effect)=>effect.targetId===TARGET_ID&&effect.conditionId==="prone"),true);

            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            state=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)!;
            assert.equal(state.combatants[actorId].economy.action,false);
            assert.equal(state.combatants[actorId].economy.extraAttacks?.length,1);
            assert.equal(state.effects.some((effect)=>effect.targetId===TARGET_ID&&effect.conditionId==="prone"),false);
          }

          test("unknown installed Common Play can replace one Extra Attack with a structural save/control action",async()=>{await exercise("external-family-j-replacement");});
          test("portable attack replacement remains invariant under complete external identity rename",async()=>{await exercise("renamed-family-j-replacement");});
          ''',encoding='utf-8')
      - name: Verify Family J attack replacement
        run: |
          npm run generate:content
          node --import tsx --test \
            tests/ui/c9FamilyJAttackReplacementProduction71304.test.ts \
            tests/ui/c9FamilyJExtraAttackProduction71304.test.ts \
            tests/ui/c9FamilyJPortableControlProduction.test.ts \
            tests/domain/commonPlayActionEconomyRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Record verified evidence and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          ledger=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(ledger.read_text(encoding='utf-8'))
          row=next(entry for entry in data['rows'] if entry['family']=='J')
          additions={
            'implementationEvidence':'installedCommonPlayRuntimeAdapter.ts projects remaining Extra Attack availability from the structural economy payment actionKind=attack contract, allowing non-attack-roll attack replacements without content identity dispatch',
            'productionEvidence':'c9FamilyJAttackReplacementProduction71304.test.ts proves an unknown installed Attack Action replaces its remaining attack with a target saving-throw/control entry point and reverses the replacement through event-native Undo',
            'identityInvarianceEvidence':'c9FamilyJAttackReplacementProduction71304.test.ts repeats the mixed attack -> save/control replacement flow after complete external module/content/mechanic identity rename',
          }
          for field,value in additions.items():
              if value not in row[field]: row[field].append(value)
          sentence=' Portable replace-one-attack semantics now follow the structural economy payment actionKind=attack contract, so an unknown Common Play save/control entry point can consume an Extra Attack slot without requiring attack-roll dispatch.'
          if sentence.strip() not in row['currentState']:
              row['currentState']=row['currentState'].rstrip()+sentence
          row['remainingNamedSeams']=[seam for seam in row['remainingNamedSeams'] if not seam.startswith('attack replacement remains incomplete;')]
          ledger.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/check-v1-mechanism-coverage.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-j-attack-replacement-71304.yml
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyJAttackReplacementProduction71304.test.ts docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "feat(c9): support structural attack replacement"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
