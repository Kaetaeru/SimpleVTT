name: C9 Family Q Choice R10 Typefix 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-r10-typefix-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified choice bridge and close type boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow=subprocess.check_output([
              'git','show','33b85e4d5ffd162c123169467a7a35abbebd35b7:.github/workflows/c9-family-q-choice-r9-71304.yml'
          ],text=True)
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(code,'q-choice-r9-patch','exec'),{'__name__':'__main__'})

          wire=Path('src/app/connectedSessionWire.ts')
          text=wire.read_text(encoding='utf-8')
          old='''function isInterrupt(value:unknown):value is InterruptView {\n  const choice=value.choice;'''
          new='''function isInterrupt(value:unknown):value is InterruptView {\n  if(!isRecord(value)) return false;\n  const choice=value.choice;'''
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'connected interrupt guard anchor changed: {text.count(old)}')
              text=text.replace(old,new,1)
          wire.write_text(text,encoding='utf-8')

          adapter=Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text=adapter.read_text(encoding='utf-8')
          broad='interactionResponse?:{interactionId:string;accepted?:true;selectedIds?:string[]}'
          exact='interactionResponse?:{interactionId:string;accepted:true}|{interactionId:string;selectedIds:string[]}'
          if broad in text:
              text=text.replace(broad,exact)
          elif exact not in text:
              raise SystemExit('interaction response parameter anchor changed')
          broad_local='let interactionResponse:{interactionId:string;accepted?:true;selectedIds?:string[]};'
          exact_local='let interactionResponse:{interactionId:string;accepted:true}|{interactionId:string;selectedIds:string[]};'
          if broad_local in text:
              text=text.replace(broad_local,exact_local,1)
          elif exact_local not in text:
              raise SystemExit('interaction response local union anchor changed')
          old_min='choiceCandidates!.length<interaction.input.selector.min'
          new_min='choiceCandidates!.length<(interaction.input.selector.min??0)'
          if old_min in text:
              text=text.replace(old_min,new_min,1)
          elif new_min not in text:
              raise SystemExit('choice minimum guard anchor changed')
          old_bounds='min:interaction.input.selector.min,max:interaction.input.selector.max,'
          new_bounds='min:interaction.input.selector.min??0,max:interaction.input.selector.max??choiceCandidates!.length,'
          if old_bounds in text:
              text=text.replace(old_bounds,new_bounds,1)
          elif new_bounds not in text:
              raise SystemExit('choice prompt bounds anchor changed')
          adapter.write_text(text,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family Q choice vertical slice
        run: |
          node --import tsx --test tests/ui/c9FamilyQChoiceInteractionProduction.test.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts tests/ui/c9FamilyQAuthorityInteractionProduction.test.ts tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts tests/domain/commonPlayOperationRuntime.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified source and retire Q choice staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayOperationRuntime.ts src/app/contracts.ts src/app/mockAdapter.ts src/app/installedCommonPlayRuntimeAdapter.ts src/app/connectedInterruptResponsePort.ts src/app/connectedActionRoutingAdapter.ts src/app/connectedSessionWire.ts src/app/commonPlayInterceptorProductionRuntimeAdapter.ts src/app/consumableD20BonusEffectFollowUpRuntimeAdapter.ts src/app/rogueCoreRuntimeAdapter.ts src/app/monkOpenHandQuiveringPalmRuntimeAdapter.ts tests/ui/c9FamilyQChoiceInteractionProduction.test.ts
          git rm -f --ignore-unmatch .github/workflows/c9-family-q-choice-71304.yml .github/workflows/c9-family-q-choice-r2-71304.yml .github/workflows/c9-family-q-choice-r3-71304.yml .github/workflows/c9-family-q-choice-r4-71304.yml .github/workflows/c9-family-q-choice-r5-71304.yml .github/workflows/c9-family-q-choice-r6-diagnostic-71304.yml .github/workflows/c9-family-q-choice-r7-71304.yml .github/workflows/c9-family-q-choice-r8-71304.yml .github/workflows/c9-family-q-choice-r9-71304.yml .github/workflows/c9-family-q-choice-r10-typefix-71304.yml .github/workflows/c9-family-q-choice-diagnostic-71304.yml .github/workflows/c9-family-q-choice-kernel-71304.yml .github/workflows/c9-family-q-choice-kernel-fix-71304.yml
          git commit -m "feat(c9): carry portable choice interactions through Resolver"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || exit 1
            sleep 1
          done
          exit 1
