name: C9 Family I Connected Ledger 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-connected-ledger-7130.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile verified connected evidence only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path("docs/rules/v1-mechanism-coverage-ledger.json")
          text=path.read_text()
          start=text.index('"family": "I"')
          end=text.index('"family": "J"',start)
          segment=text[start:end]
          evidence='installedCommonPlayLoweredFamiliesProduction.test.ts unknown stored movement converges through Host replay, duplicate handling, Undo, and reconnect'
          if evidence not in segment:
              old='"connectedEvidenceIfRelevant": [],'
              if segment.count(old)!=1:
                  raise SystemExit(f"Family I empty connected evidence count={segment.count(old)}")
              new='"connectedEvidenceIfRelevant": [\n        "'+evidence+'"\n      ],'
              segment=segment.replace(old,new,1)
              text=text[:start]+segment+text[end:]
              path.write_text(text)
          json.loads(path.read_text())
          PY
          git diff --check
      - name: Commit and fast-publish ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-i-connected-ledger-7130.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): record connected movement evidence"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in $(seq 1 40); do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              node -e 'JSON.parse(require("fs").readFileSync("docs/rules/v1-mechanism-coverage-ledger.json","utf8"))'
              if git push origin HEAD:"$branch"; then exit 0; fi
            fi
            git rebase --abort || true
            sleep 1
          done
          exit 1
