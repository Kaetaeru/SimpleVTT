name: C9 Family I Rules Movement Verify 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-rules-movement-verify-71304.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - run: node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: npm exec tsc -- --noEmit
