name: C9 Family U Diagnostic

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - "src/domain/commonPlayArtifactLifecycleRuntime.ts"
      - "src/app/installedCommonPlayArtifactLifecycleAdapter.ts"
      - "src/domain/commonPlayArtifactRuntime.ts"
      - "schemas/common-play-contract.schema.json"
      - "tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts"
      - ".github/workflows/rerun-c9-family-u-diagnostic.yml"

jobs:
  family-u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify object/link artifact lifecycle
        run: npx tsx --test tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts
      - name: Typecheck and production build
        run: npm run build
