name: C9 Family U Diagnostic

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - "src/domain/commonPlayArtifactLifecycleRuntime.ts"
      - "src/app/installedCommonPlayArtifactLifecycleAdapter.ts"
      - "src/domain/commonPlayArtifactRuntime.ts"
      - "schemas/common-play-contract.schema.json"
      - "tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts"
      - ".github/workflows/rerun-c9-family-u-diagnostic.yml"

jobs:
  family-u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify object/link artifact lifecycle
        run: npx tsx --test tests/ui/connectedObjectLinkArtifactLifecycleProduction.test.ts
      - name: Capture typecheck diagnostic
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > tsc-error.txt 2>&1
          status=$?
          first=$(head -n 1 tsc-error.txt | base64 -w 0 | tr '+/' '-_' | tr -d '=' | cut -c 1-180)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "first=$first" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish typecheck diagnostic
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tsc-${{ steps.typecheck.outputs.first }}
          path: tsc-error.txt
      - name: Require typecheck
        run: test "${{ steps.typecheck.outputs.status }}" = "0"
      - name: Production build
        run: npm run build