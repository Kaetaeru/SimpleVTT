name: C9 Family I Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-ledger-reconcile-71304.yml

permissions:
  contents: write

concurrency:
  group: c9-family-i-ledger-reconcile-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile verified Family I ledger state
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((entry)=>entry.family==='I');
          if(!row) throw new Error('Family I row missing');
          const evidence=[...(row.productionEvidence??[]),...(row.identityInvarianceEvidence??[])].join('\n');
          if(!evidence.includes('C9 Family I Final Verifier 71304 run 33315323863')) throw new Error('Family I final verifier evidence missing');
          if(!evidence.includes('c9FamilyIMovementGrantProduction.test.ts')) throw new Error('Family I movement-grant identity evidence missing');
          row.currentState='Family I is complete through canonical movement.relocate and generic RulesProfile-derived movement constraints. Unknown installed and fully renamed external Common Play production-executes walk, climb, swim, fly, crawl, jump, Difficult-Terrain-style cost multiplication, drag/carry multiplication, alternate-speed bounds, portable movement grants, stand from Prone, push/pull/teleport, explicit no-provoke movement, zero-speed rejection, connected replay/reconnect, and event-native Undo without content identity dispatch.';
          row.disposition='IMPLEMENTED';
          row.remainingNamedSeams=[];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
          node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify current Family I production slice
        run: |
          npm ci
          npm run generate:content
          node --import tsx --test tests/ui/c9FamilyIMovementGrantProduction.test.ts tests/ui/c9FamilyIMovementProduction.test.ts tests/ui/c9FamilyIRulesDerivedMovementCostProduction.test.ts tests/domain/commonPlayMovementRuntime.test.ts tests/ui/commonPlayProneStandRuntime.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish ledger reconciliation and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          path=.github/workflows/c9-family-i-ledger-reconcile-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$path"
          git add docs/rules/v1-mechanism-coverage-ledger.json "$path"
          git commit -m "docs(c9): finalize Family I movement coverage"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
            git fetch origin "$branch"
            git rebase "origin/$branch"
          done
          exit 1
