name: C9 Family I Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-ledger-reconcile-71304.yml

permissions:
  contents: write

jobs:
  reconcile-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Reconcile verified Family I evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          families=data.get('families') if isinstance(data,dict) else data
          row=next((entry for entry in families if entry.get('family')=='I'),None)
          if row is None: raise SystemExit('Family I ledger row not found')
          row['currentState']='Canonical movement.relocate parses through the generic operations lowerer. Unknown installed Common Play production-executes walk, climb, swim, fly, crawl, jump, cost multipliers, push, pull, teleport, explicit no-provoke movement, zero-speed rejection, Undo, connected replay/reconnect, and external identity rename invariance. Rules-derived movement cost multipliers and alternate-speed bounds are production-proven through generic profile properties, and portable compile rejection is normalized into the standard production resolution failure path. Family I remains incomplete for rules-derived Difficult Terrain/drag-carry authority and named movement-grant convergence.'
          evidence='c069949e80d8931013ee621108486f979bef4dff fix(c9): normalize portable movement rejection; C9 Family I Rules Constraints 71304 run 33314826038 passed rules-derived movement cost and alternate-speed production tests, movement/Prone regressions, legacy execution boundary, V1 coverage checker, and tsc --noEmit'
          if evidence not in row['productionEvidence']: row['productionEvidence'].append(evidence)
          row['remainingNamedSeams']=[
            'named movement grants',
            'rules-derived Difficult Terrain and drag/carry movement constraint authority remain incomplete'
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify coverage ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish ledger reconciliation and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-i-ledger-reconcile-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): reconcile Family I movement constraints"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
