name: C9 Family I Ledger Reconcile 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-ledger-reconcile-71304.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c9-family-i-ledger-reconcile-71304
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Family I ledger evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const row=ledger.rows.find((candidate)=>candidate.family==='I');
          if(!row) throw new Error('Family I ledger row missing');
          const add=(field,value)=>{ if(!row[field].includes(value)) row[field].push(value); };
          add('implementationEvidence','commonPlayMovementRuntime.ts composes generic movement.cost.multiplier and movement.drag-carry.multiplier with movement-type speed bounds without content identity dispatch');
          add('productionEvidence','1edcedfa5a2e8e300e7106e60436fd267c407a29 test(c9): prove drag carry movement authority; C9 Family I Drag Carry Proof 71304 run 33315183958 passed unknown and renamed external RuleModule movement-cost, drag/carry, alternate-speed, Undo, legacy-boundary, coverage, and typecheck verification');
          add('identityInvarianceEvidence','c9FamilyIRulesDerivedMovementProduction.test.ts preserves Difficult Terrain, drag/carry multiplier, alternate-speed, and Undo semantics after complete external module/content/mechanic identity rename');
          row.currentState='Family I is complete through canonical movement.relocate and generic RulesProfile-derived movement constraints. Unknown installed and fully renamed external Common Play production-executes walk, climb, swim, fly, crawl, jump, Difficult-Terrain-style cost multiplication, drag/carry multiplication, alternate-speed bounds, stand from Prone, push/pull/teleport, explicit no-provoke movement, zero-speed rejection, connected replay/reconnect, and event-native Undo without content identity dispatch.';
          row.disposition='IMPLEMENTED';
          row.remainingNamedSeams=[];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Verify Family I production evidence
        run: >-
          npx tsx --test
          tests/ui/c9FamilyIRulesDerivedMovementProduction.test.ts
          tests/ui/c9FamilyIMovementProduction.test.ts
          tests/ui/commonPlayProneStandRuntime.test.ts
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Publish reconciliation and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-family-i-ledger-reconcile-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$workflow"
          git add docs/rules/v1-mechanism-coverage-ledger.json "$workflow"
          git commit -m "docs(c9): reconcile Family I movement coverage"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              exit 1
            fi
            sleep 1
          done
          exit 1
