name: C9 Family I Drag Carry 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-drag-carry-71304.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family I rules-derived movement
        run: node --import tsx --test tests/ui/c9FamilyIMovementProduction.test.ts tests/ui/c9FamilyIRulesDerivedMovementProduction.test.ts
      - run: node scripts/check-legacy-execution-boundary.mjs
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - run: npm exec tsc -- --noEmit
