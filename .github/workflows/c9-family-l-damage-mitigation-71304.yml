name: C9 Family L Damage Mitigation 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-l-damage-mitigation-71304.yml"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:builtin-catalog
      - name: Apply focused Family L patch
        run: python3 .github/c9-family-l-damage-mitigation-71304.py
      - name: Verify Family L damage mitigation
        run: |
          node --import tsx --test tests/domain/damage.test.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          node scripts/check-v1-mechanism-coverage.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified change
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/damage.ts src/domain/resolutionHealthOps.ts tests/ui/c9FamilyLDamageDefenseProduction.test.ts
          git rm .github/c9-family-l-damage-mitigation-71304.py .github/workflows/c9-family-l-damage-mitigation-71304.yml
          git commit -m "feat(c9): apply structural damage mitigation"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || exit 1
          done
          exit 1
