name: C9 Reconcile Family J Evidence 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-reconcile-family-j-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast-forward to current branch state
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content dependencies
        run: npm run generate:content
      - name: Verify Family J portable control
        run: npx tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts
      - name: Reconcile Family J ledger evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='docs/rules/v1-mechanism-coverage-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(path,'utf8'));
          const family=ledger.families.find((entry)=>entry.family==='J');
          if(!family) throw new Error('Family J ledger entry not found');
          family.currentState='Unknown installed Common Play attack-roll plus target damage has production evidence through a projected arbitrary-ID Actor action with Action payment, damage commit, Host/Client convergence, and Undo. Projected Unarmed grapple/shove dispatches from a typed runtimeSaveCondition action payload rather than named action IDs, with arbitrary action-ID rename evidence. Unknown installed Common Play can target-roll structural saving throws and ability checks, select the highest of declared STR/DEX save or ability modifiers, conditionally apply or remove grappled from authoritative test.outcome, and reverse the result through Undo under complete external identity rename. Family J remains incomplete for full source-owned weapon/Unarmed Strike composition, Opportunity Attack, reach/range/cover, Extra Attack/replacement, and ammunition/loading semantics.';
          const add=(key,value)=>{ if(!family[key].includes(value)) family[key].push(value); };
          add('implementationEvidence','commonPlayOperationRuntime.ts and common-play-contract.schema.json accept structural {choose:"highest",from:[...]} d20 modifier properties; installedCommonPlayRuntimeAdapter.ts resolves each declared save/profile property and selects the highest modifier without content identity dispatch');
          add('productionEvidence','c9FamilyJPortableControlProduction.test.ts proves best-of STR/DEX target grapple saves and actor escape checks, conditional grapple apply/remove, Action payment, and event-native Undo');
          add('productionEvidence','UI run 33315546036 at f3585c4a7a5f164ead30a49e67945127892b1993: Verify C9 Family J portable control passed');
          add('identityInvarianceEvidence','c9FamilyJPortableControlProduction.test.ts repeats both best-of grapple and escape semantics under unrelated renamed external module/content/mechanic identities');
          family.remainingNamedSeams=[
            'full generic weapon and Unarmed Strike action projection is not yet proven across source-owned equipment/stat definitions',
            'complete grapple/shove source composition remains incomplete beyond the now-proven structural best-of save/check and conditional control path',
            'Opportunity Attack portable acceptance remains incomplete beyond existing projection-driven integration',
            'reach, long range, cover, multiattack/Extra Attack/replacement, and ammunition/loading constraints remain incomplete',
            'Rage attack rider and other named attack/action projection remain migration debt'
          ];
          fs.writeFileSync(path,JSON.stringify(ledger,null,2)+'\n');
          NODE
      - name: Verify coverage ledger contract
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish reconciliation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-reconcile-family-j-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git commit -m "docs(c9): reconcile Family J portable control evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
