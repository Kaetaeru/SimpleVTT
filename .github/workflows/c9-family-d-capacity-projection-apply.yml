name: C9 Family D Capacity Projection Apply

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-d-capacity-projection-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch resource capacity projection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path("src/app/realEventApplyService.ts")
          text=path.read_text()

          old='''    const resource=resources.find((entry)=>entry.id===change.resourceId)!;\n    resource.current=change.after;\n    return;\n'''
          new='''    const resource=resources.find((entry)=>entry.id===change.resourceId)!;\n    resource.current=change.after;\n    if (change.capacity) resource.max=change.capacity.after.maximum;\n    return;\n'''
          if text.count(old)!=1:
              raise SystemExit(f"unexpected app resource projection count: {text.count(old)}")
          text=text.replace(old,new)

          old='''    const resource=combatant.resources.find((entry)=>entry.id===change.resourceId);\n    if (resource) resource.current=change.after;\n    return;\n'''
          new='''    const resource=combatant.resources.find((entry)=>entry.id===change.resourceId);\n    if (resource) {\n      resource.current=change.after;\n      if (change.capacity) {\n        resource.maximum=change.capacity.after.maximum;\n        if (change.capacity.after.maximumAfterLongRest===null) delete resource.maximumAfterLongRest;\n        else resource.maximumAfterLongRest=change.capacity.after.maximumAfterLongRest;\n      }\n    }\n    return;\n'''
          if text.count(old)!=1:
              raise SystemExit(f"unexpected runtime resource projection count: {text.count(old)}")
          text=text.replace(old,new)

          needle='''    if (runtime.found && !deepEquals(runtime.value,change.before)) {\n      return `event-native apply runtime drift for ${change.targetId}/${changeField(change)}`;\n    }\n    if (app.found) applyAppChange(probeScene,probeResources,probeItems,change);\n'''
          replacement='''    if (runtime.found && !deepEquals(runtime.value,change.before)) {\n      return `event-native apply runtime drift for ${change.targetId}/${changeField(change)}`;\n    }\n    if (change.kind==="resource" && change.capacity && !itemResource(change.resourceId)) {\n      const appResource=probeResources.find((entry)=>entry.id===change.resourceId);\n      if (appResource && appResource.max!==change.capacity.before.maximum) {\n        return `event-native apply capacity drift for ${change.targetId}/${changeField(change)}`;\n      }\n      const runtimeResource=probeRuntime?.combatants[change.targetId]?.resources.find((entry)=>entry.id===change.resourceId);\n      if (runtimeResource && (\n        runtimeResource.maximum!==change.capacity.before.maximum ||\n        (runtimeResource.maximumAfterLongRest??null)!==change.capacity.before.maximumAfterLongRest\n      )) {\n        return `event-native apply runtime capacity drift for ${change.targetId}/${changeField(change)}`;\n      }\n    }\n    if (app.found) applyAppChange(probeScene,probeResources,probeItems,change);\n'''
          if text.count(needle)!=1:
              raise SystemExit(f"unexpected validation insertion count: {text.count(needle)}")
          text=text.replace(needle,replacement)
          path.write_text(text)

          test_path=Path("tests/ui/realEventResourceCapacityProjection.test.ts")
          test_path.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport "../../src/app/offlineRuntimeAdapters";\nimport { applyResolutionEvents } from "../../src/app/realEventApplyService";\nimport { MockAdapter } from "../../src/app/mockAdapter";\nimport { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";\nimport { FIGHTER_SECOND_WIND_RESOURCE_ID } from "../../src/domain/coreClassResources";\nimport type { ResolutionEvent } from "../../src/domain/resolutionTypes";\n\ntest("resource capacity state changes project through app and runtime state and reverse cleanly",async()=>{\n  const adapter=new MockAdapter();\n  await adapter.startInitiative();\n  await adapter.setCurrentActor("char.aelar");\n  const snapshot=await adapter.getSnapshot();\n  const characterId=snapshot.activeCharacter.id;\n  const resource=snapshot.activeCharacter.resources.find((entry)=>entry.id===FIGHTER_SECOND_WIND_RESOURCE_ID);\n  assert.ok(resource);\n  const runtime=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene);\n  assert.ok(runtime);\n  const combatant=runtime.combatants[characterId];\n  assert.ok(combatant);\n  combatant.resources.push({\n    id:resource.id,\n    label:resource.label,\n    current:resource.current,\n    maximum:resource.max,\n    ...(resource.recovery?{recovery:structuredClone(resource.recovery)}:{}),\n    ...(resource.maximumAfterLongRest!==undefined?{maximumAfterLongRest:resource.maximumAfterLongRest}:{}),\n  });\n  const runtimeResource=combatant.resources.find((entry)=>entry.id===resource.id);\n  assert.ok(runtimeResource);\n\n  const baseMaximum=resource.max;\n  const event={\n    id:"family-d-capacity-projection:event",\n    resolutionId:"family-d-capacity-projection",\n    operationId:"family-d-capacity-projection:resource",\n    kind:"resource-capacity-projection-probe",\n    actorId:characterId,\n    targetId:characterId,\n    summary:"temporary capacity projection probe",\n    provenance:[],\n    stateChanges:[{\n      kind:"resource",\n      targetId:characterId,\n      resourceId:resource.id,\n      before:resource.current,\n      after:resource.current,\n      capacity:{\n        before:{maximum:baseMaximum,maximumAfterLongRest:runtimeResource.maximumAfterLongRest??null},\n        after:{maximum:baseMaximum+1,maximumAfterLongRest:baseMaximum},\n      },\n      provenance:[],\n      lifetime:"character-durable",\n      writeBack:"character",\n    }],\n    result:{},\n  } satisfies ResolutionEvent;\n\n  const forward=applyResolutionEvents(snapshot.scene,[event],snapshot.activeCharacter.resources,[],runtime);\n  assert.equal(forward.status,"committed",forward.status==="rejected"?forward.error:undefined);\n  if (forward.status!=="committed") return;\n  assert.equal(forward.resources.find((entry)=>entry.id===resource.id)?.max,baseMaximum+1);\n  const forwardRuntimeResource=forward.runtimeState?.combatants[characterId]?.resources.find((entry)=>entry.id===resource.id);\n  assert.equal(forwardRuntimeResource?.maximum,baseMaximum+1);\n  assert.equal(forwardRuntimeResource?.maximumAfterLongRest,baseMaximum);\n\n  const inverse=structuredClone(event);\n  const inverseChange=inverse.stateChanges[0];\n  assert.equal(inverseChange.kind,"resource");\n  if (inverseChange.kind!=="resource" || !inverseChange.capacity) return;\n  inverseChange.capacity={before:event.stateChanges[0].capacity!.after,after:event.stateChanges[0].capacity!.before};\n  const reverted=applyResolutionEvents(forward.scene,[inverse],forward.resources,[],forward.runtimeState);\n  assert.equal(reverted.status,"committed",reverted.status==="rejected"?reverted.error:undefined);\n  if (reverted.status!=="committed") return;\n  assert.equal(reverted.resources.find((entry)=>entry.id===resource.id)?.max,baseMaximum);\n  const revertedRuntimeResource=reverted.runtimeState?.combatants[characterId]?.resources.find((entry)=>entry.id===resource.id);\n  assert.equal(revertedRuntimeResource?.maximum,baseMaximum);\n  assert.equal(revertedRuntimeResource?.maximumAfterLongRest,undefined);\n});\n''')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family D capacity projection
        run: npx tsx --test tests/ui/realEventResourceCapacityProjection.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified projection fix
        run: |
          rm .github/workflows/c9-family-d-capacity-projection-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/realEventApplyService.ts tests/ui/realEventResourceCapacityProjection.test.ts .github/workflows/c9-family-d-capacity-projection-apply.yml
          git commit -m "fix(c9): project resource capacity events"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          exit 1
