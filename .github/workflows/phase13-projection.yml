name: Main Playable

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: main-playable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "schemas/**"
      - "docs/design/**"
      - ".github/workflows/phase13-projection.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - "main"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "schemas/**"
      - "docs/design/**"
      - ".github/workflows/phase13-projection.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  playable-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify full UI, rules, TypeScript, and production frontend
        run: npm run build
      - name: Verify Phase 11 complete offline playable walkthrough
        run: npx tsx --test tests/ui/phase11OfflineWalkthrough.test.ts
      - name: Verify Phase 12 connected-session authority
        run: npx tsx --test tests/ui/connectedSessionProtocol.test.ts tests/ui/connectedSessionWire.test.ts tests/ui/connectedActionReservation.test.ts tests/ui/connectedDurableFailure.test.ts tests/ui/realEventApplyService.test.ts tests/ui/connectedCorrectionApply.test.ts tests/ui/connectedSessionRuntimeAdapter.test.ts tests/ui/connectedTwoPeerResolution.test.ts tests/ui/connectedTurnProjection.test.ts tests/ui/connectedAttackEventCapture.test.ts tests/ui/productionSessionEnd.test.ts
      - name: Verify Phase 13 arbitrary Character SessionProjection
        run: npx tsx --test tests/ui/characterSessionProjection.test.ts tests/ui/characterSessionProjectionReconstruction.test.ts tests/ui/characterSessionProjectionMount.test.ts tests/ui/connectedCharacterProjectionHandshake.test.ts tests/ui/connectedProjectedCharacterResolution.test.ts tests/ui/connectedProjectedCharacterInventoryResolution.test.ts tests/ui/connectedProjectedCharacterSpellResolution.test.ts tests/ui/connectedProjectedCharacterSkillResolution.test.ts
      - name: Verify Phase 14 DM prepared Combatant flow
        run: npx tsx --test tests/ui/productionDmPreparedCombatantFlow.test.ts
      - name: Verify Phase 14 live DM adjudication and Undo
        run: npx tsx --test tests/ui/productionDmLiveAdjudicationFlow.test.ts
      - name: Verify Phase 14 live Combatant theater-of-mind action
        run: npx tsx --test tests/ui/productionDmLiveCombatantAction.test.ts
      - name: Verify Phase 14 Host preparation metadata and active content
        run: npx tsx --test tests/ui/productionSessionPreparationMetadata.test.ts

  windows-playable:
    runs-on: windows-latest
    needs: playable-contract
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Tauri persistence and connected-session transport
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows playable executable
        run: npm run tauri:build -- --no-bundle
      - name: Stage main playable artifact
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/simplevtt.exe"
          if (-not (Test-Path $source)) { throw "SimpleVTT executable was not produced at $source" }
          New-Item -ItemType Directory -Force -Path playable-artifact | Out-Null
          Copy-Item $source "playable-artifact/SimpleVTT.exe"
          @(
            "SimpleVTT main playable build",
            "commit=${{ env.SOURCE_SHA }}",
            "ref=${{ github.ref }}",
            "run_id=${{ github.run_id }}",
            "scope=character creation + progression + persistence + offline play + connected play + arbitrary Character SessionProjection"
          ) | Set-Content -Encoding utf8 "playable-artifact/BUILD.txt"
          @(
            "SimpleVTT main playable walkthrough",
            "",
            "1. Create and save a Character, close/reopen the app, and confirm local restore.",
            "2. Level the Character through a representative progression choice and confirm Character Sheet updates.",
            "3. Use Freeform checks/actions/spells/items, initiative/turn economy, attacks, damage, healing, conditions, concentration, reactions, DM correction, Activity/dice/provenance, and Undo.",
            "4. Confirm visual dice replay for creation ability rolls, level-up hit-die HP rolls, and authoritative play resolution.",
            "5. Import/instantiate a Combatant and resolve a representative runtime action.",
            "6. For connected play, start Host on one Windows instance and Join from another using <HOST_IPV4>:3210.",
            "7. Join with a locally saved Character unknown to the host and confirm it mounts as an ephemeral SessionProjection without creating a permanent host Character copy.",
            "8. Resolve a Character-durable action remotely, confirm host/client convergence, reconnect idempotently, and verify durable state persists only in the owning client's Character library.",
            "9. Explicitly end the connected session, confirm former clients become ended/offline without reconnecting, then start a fresh Host session with no stale participants/projections/turn state."
          ) | Set-Content -Encoding utf8 "playable-artifact/PLAYABLE-WALKTHROUGH.txt"
      - name: Upload Windows playable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVTT-Main-Playable-${{ env.SOURCE_SHA }}
          path: playable-artifact/
          if-no-files-found: error
          retention-days: 14
