name: Phase 13 SessionProjection

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - "agent/104-arbitrary-character-session-projection"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/ui/**"
      - "docs/design/session-runtime.md"
      - ".agents/PHASE13_CHECKLIST.md"
      - ".github/workflows/phase13-projection.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  projection-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate canonical content
        run: npm run generate:content
      - name: Verify arbitrary Character SessionProjection boundary
        run: npx tsx --test tests/ui/characterSessionProjection.test.ts
      - name: Verify Phase 12 connected authority remains green
        run: npx tsx --test tests/ui/connectedSessionProtocol.test.ts tests/ui/connectedSessionWire.test.ts tests/ui/connectedActionReservation.test.ts tests/ui/connectedDurableFailure.test.ts tests/ui/realEventApplyService.test.ts tests/ui/connectedCorrectionApply.test.ts tests/ui/connectedSessionRuntimeAdapter.test.ts tests/ui/connectedTwoPeerResolution.test.ts tests/ui/connectedTurnProjection.test.ts tests/ui/connectedAttackEventCapture.test.ts
      - name: Verify Phase 11 offline walkthrough remains green
        run: npx tsx --test tests/ui/phase11OfflineWalkthrough.test.ts
      - name: Verify production frontend gate
        run: npm run build
