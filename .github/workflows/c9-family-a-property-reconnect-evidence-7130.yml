name: C9 Family A Property Reconnect Evidence

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths:
      - ".github/workflows/c9-family-a-property-reconnect-evidence-7130.yml"
      - "tests/ui/installedCommonPlayPropertyModifierProduction.test.ts"
      - "tests/ui/installedCommonPlayPropertyModifierReconnect.test.ts"
      - "src/domain/effects.ts"
      - "src/domain/commonPlayOperationRuntime.ts"
      - "src/app/installedCommonPlayRuntimeAdapter.ts"
      - "src/app/connectedSessionRuntimeAdapter.ts"

permissions:
  contents: write

jobs:
  property-reconnect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run generate:content
      - name: Verify unknown property production and reconnect evidence
        run: npx tsx --test tests/ui/installedCommonPlayPropertyModifierProduction.test.ts tests/ui/installedCommonPlayPropertyModifierReconnect.test.ts
      - name: Verify legacy execution boundary
        run: |
          node scripts/check-legacy-execution-boundary.mjs
          node --test tests/ui/legacyExecutionBoundary.test.mjs
      - run: npx tsc --noEmit
      - name: Remove verified staging workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-a-property-reconnect-evidence-7130.yml
          git commit -m "test(c9): verify property modifier reconnect evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            git rebase origin/agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 2
          done
          exit 1
