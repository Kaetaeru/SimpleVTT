name: C9 Family J Escape 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-j-escape-71304.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Add portable grapple escape production proof
        run: |
          cat > tests/ui/c9FamilyJEscapeProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/installedContentRuntimeAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          const ACTOR_ID="char.aelar";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.escape`;
            const setupMechanicId=`${prefix}.setup`;
            const escapeMechanicId=`${prefix}.mechanic`;
            const setupConfig={
              schemaVersion:"0.2-draft",id:setupMechanicId,
              entryPoints:[{id:"setup-grappled",invocation:"manual",operations:[{kind:"condition.apply",condition:"grappled",target:"actor"}]}],
            };
            const escapeConfig={
              schemaVersion:"0.2-draft",id:escapeMechanicId,
              payments:[{kind:"economy",bucket:"action",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],
              entryPoints:[{
                id:"escape-grapple",invocation:"manual",
                test:{kind:"ability-check",roller:"actor",property:{choose:"highest",from:["ability.str.modifier","ability.dex.modifier"]},dc:{value:12},perTarget:false},
                operations:[{kind:"condition.remove",condition:"grappled",target:"actor",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}}}],
              }],
            };
            return {moduleId,contentId,setupMechanicId,escapeMechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family J portable escape probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Escape Probe",locales:{en:{name:"Portable Escape Probe"}}},mechanics:[{kind:"common-play",config:setupConfig},{kind:"common-play",config:escapeConfig}]}],
            })};
          }

          async function exercise(prefix:string) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            let snapshot=await adapter.previewContentImport(pack.json);
            assert.ok(!snapshot.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(snapshot.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor(ACTOR_ID);
            const catalogId=catalogQualifiedId(pack.contentId,pack.moduleId,"1");
            const setupId=installedCommonPlayActionId({catalogId,mechanicId:pack.setupMechanicId,entryPointId:"setup-grappled"});
            const escapeId=installedCommonPlayActionId({catalogId,mechanicId:pack.escapeMechanicId,entryPointId:"escape-grapple"});

            snapshot=await adapter.resolveAction(setupId,[ACTOR_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===ACTOR_ID&&effect.conditionId==="grappled"),true);

            await adapter.setQueuedD20(1);
            snapshot=await adapter.resolveAction(escapeId,[ACTOR_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(snapshot.resolution?.rollKind,"check");
            assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===ACTOR_ID&&effect.conditionId==="grappled"),true);
            assert.equal(snapshot.scene.economyByActor[ACTOR_ID]?.action,false);
            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===ACTOR_ID&&effect.conditionId==="grappled"),true);
            assert.equal(snapshot.scene.economyByActor[ACTOR_ID]?.action,true);

            await adapter.setQueuedD20(20);
            snapshot=await adapter.resolveAction(escapeId,[ACTOR_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===ACTOR_ID&&effect.conditionId==="grappled"),false);
            assert.equal(snapshot.scene.economyByActor[ACTOR_ID]?.action,false);
            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.effects.some((effect)=>effect.targetId===ACTOR_ID&&effect.conditionId==="grappled"),true);
            assert.equal(snapshot.scene.economyByActor[ACTOR_ID]?.action,true);
          }

          test("unknown installed Common Play escapes grapple with the higher STR/DEX check and preserves failure/success Undo under identity rename",async()=>{
            await exercise("unknown-family-j-escape");
            await exercise("renamed-family-j-escape");
          });
          EOF
      - name: Verify Family J escape
        run: |
          node --import tsx --test tests/ui/c9FamilyJPortableControlProduction.test.ts tests/ui/c9FamilyJEscapeProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified escape proof
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/c9-family-j-escape-71304.yml
          git add tests/ui/c9FamilyJEscapeProduction.test.ts .github/workflows/c9-family-j-escape-71304.yml
          git commit -m "test(c9): prove portable grapple escape"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
