name: C9 Actor Artifact Undo HP Base 71304

on:
  push:
    branches: [agent/c9-gate-n-coverage-reconciliation]
    paths: [.github/workflows/c9-actor-artifact-undo-hp-base-71304.yml]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generate:content
      - name: Canonicalize spawned actor HP profile bases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/domain/resolutionArtifactOps.ts')
          s=p.read_text()
          needle='''  for(const [property,value] of Object.entries(actor.properties)) {\n    if(typeof value==="number"&&Number.isFinite(value)) baseProperties[property]=value;\n  }\n  return {'''
          replacement='''  for(const [property,value] of Object.entries(actor.properties)) {\n    if(typeof value==="number"&&Number.isFinite(value)) baseProperties[property]=value;\n  }\n  baseProperties["hp.current"]=Number(actor.properties["hp.current"]??maximum);\n  baseProperties["hp.maximum"]=maximum;\n  baseProperties["hp.temporary"]=Number(actor.properties["hp.temporary"]??0);\n  return {'''
          if needle not in s:
              raise SystemExit('actorCombatant insertion point not found')
          p.write_text(s.replace(needle,replacement,1))
          PY
      - name: Verify connected actor artifact Undo
        run: node --import tsx --test tests/ui/connectedActorArtifactReconnectProduction.test.ts
      - name: Verify C9 boundaries
        run: |
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish fix and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          workflow=.github/workflows/c9-actor-artifact-undo-hp-base-71304.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$workflow"
          git add src/domain/resolutionArtifactOps.ts
          git commit -m "fix(c9): stabilize actor artifact undo state"
          for attempt in $(seq 1 12); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep 1
          done
          exit 1
