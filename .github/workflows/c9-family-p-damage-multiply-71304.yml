name: C9 Family P Generic Damage Multiplier

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-damage-multiply-71304.yml
      - .github/scripts/c9-family-p-damage-multiply.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile latest branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Apply generic damage multiplier patch
        run: python3 .github/scripts/c9-family-p-damage-multiply.py
      - name: Verify focused runtime and typecheck
        run: |
          npx tsx --test tests/domain/c9FamilyPDamageMultiplier.test.ts tests/domain/commonPlayReactionRuntime.test.ts tests/domain/commonPlayReactionDefinitionRuntime.test.ts
          npx tsc --noEmit
      - name: Commit verified source change
        run: |
          git config user.name "chatgpt-c9-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/domain/commonPlayRuntime.ts src/domain/commonPlayReactionDefinitionRuntime.ts schemas/common-play-contract.schema.json tests/domain/c9FamilyPDamageMultiplier.test.ts
          git commit -m "feat(c9): support structural damage multipliers"
          for attempt in 1 2 3; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
          done
          exit 1
      - name: Remove staging files
        run: |
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git rm .github/workflows/c9-family-p-damage-multiply-71304.yml .github/scripts/c9-family-p-damage-multiply.py
          git commit -m "chore(c9): remove damage multiplier staging files"
          for attempt in 1 2 3; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
          done
          exit 1
