name: C9 Family Q Choice 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-choice-71304.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add structural choice payload to existing interrupt path
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Domain: schema/evaluator parity for the already-declared choice + selector shape.
          p=Path('src/domain/commonPlayOperationRuntime.ts'); text=p.read_text(encoding='utf-8')
          old='''export interface CommonPlayConsentInteraction {\n  id:string;\n  kind:"consent";\n  responder:"actor"|"target"|"actor-owner"|"target-owner"|"dm"|"host";\n  mode:"blocking";\n  input:{type:"boolean"};\n  revalidate:"always"|"if-revision-changed";\n  stalePolicy?:"reject";\n}\n'''
          new=old+'''\nexport interface CommonPlayChoiceInteraction {\n  id:string;\n  kind:"choice";\n  responder:"actor"|"target"|"actor-owner"|"target-owner"|"dm"|"host";\n  mode:"blocking";\n  input:{type:"choice";selector:CommonPlayTargetingSelector};\n  revalidate:"always"|"if-revision-changed";\n  stalePolicy?:"reject";\n}\n\nexport type CommonPlayInteraction=CommonPlayConsentInteraction|CommonPlayChoiceInteraction;\n'''
          if text.count(old)!=1: raise SystemExit('interaction interface anchor changed')
          text=text.replace(old,new,1)
          text=text.replace('interaction?:CommonPlayConsentInteraction;','interaction?:CommonPlayInteraction;',1)
          text=text.replace('''  interactionResponse?:{\n    interactionId:string;\n    accepted:true;\n  };\n''','''  interactionResponse?:{\n    interactionId:string;\n    accepted?:true;\n    selectedIds?:string[];\n  };\n  interactionCandidates?:CommonPlaySelectorCandidate[];\n''',1)
          text=text.replace('const INTERACTION_INPUT_KEYS=new Set(["type"]);','const INTERACTION_INPUT_KEYS=new Set(["type","selector"]);',1)
          old_parse='''function parseConsentInteraction(value:unknown,label:string):CommonPlayConsentInteraction {\n  const interaction=object(value,label);\n  supportedKeys(interaction,INTERACTION_KEYS,label);\n  if(interaction.kind!=="consent") throw new DomainEvaluationError(`${label}.kind must be consent for portable Common Play interaction`);\n  if(interaction.responder!=="actor"&&interaction.responder!=="target"&&interaction.responder!=="actor-owner"&&interaction.responder!=="target-owner"&&interaction.responder!=="dm"&&interaction.responder!=="host") throw new DomainEvaluationError(`${label}.responder must be actor, target, actor-owner, target-owner, dm, or host for portable Common Play interaction`);\n  if(interaction.mode!=="blocking") throw new DomainEvaluationError(`${label}.mode must be blocking for portable Common Play interaction`);\n  const input=object(interaction.input,`${label}.input`);\n  supportedKeys(input,INTERACTION_INPUT_KEYS,`${label}.input`);\n  if(input.type!=="boolean") throw new DomainEvaluationError(`${label}.input.type must be boolean for portable Common Play interaction`);\n  if(interaction.revalidate!=="always"&&interaction.revalidate!=="if-revision-changed") throw new DomainEvaluationError(`${label}.revalidate must be always or if-revision-changed for portable Common Play interaction`);\n  if(interaction.stalePolicy!==undefined&&interaction.stalePolicy!=="reject") throw new DomainEvaluationError(`${label}.stalePolicy must be reject for portable Common Play interaction`);\n  return {\n    id:nonEmptyString(interaction.id,`${label}.id`),kind:"consent",responder:interaction.responder,mode:"blocking",input:{type:"boolean"},revalidate:interaction.revalidate,\n    ...(interaction.stalePolicy?{stalePolicy:"reject" as const}:{}),\n  };\n}\n'''
          new_parse='''function parseInteraction(value:unknown,label:string):CommonPlayInteraction {\n  const interaction=object(value,label);\n  supportedKeys(interaction,INTERACTION_KEYS,label);\n  if(interaction.responder!=="actor"&&interaction.responder!=="target"&&interaction.responder!=="actor-owner"&&interaction.responder!=="target-owner"&&interaction.responder!=="dm"&&interaction.responder!=="host") throw new DomainEvaluationError(`${label}.responder must be actor, target, actor-owner, target-owner, dm, or host for portable Common Play interaction`);\n  if(interaction.mode!=="blocking") throw new DomainEvaluationError(`${label}.mode must be blocking for portable Common Play interaction`);\n  if(interaction.revalidate!=="always"&&interaction.revalidate!=="if-revision-changed") throw new DomainEvaluationError(`${label}.revalidate must be always or if-revision-changed for portable Common Play interaction`);\n  if(interaction.stalePolicy!==undefined&&interaction.stalePolicy!=="reject") throw new DomainEvaluationError(`${label}.stalePolicy must be reject for portable Common Play interaction`);\n  const input=object(interaction.input,`${label}.input`);\n  supportedKeys(input,INTERACTION_INPUT_KEYS,`${label}.input`);\n  const common={id:nonEmptyString(interaction.id,`${label}.id`),responder:interaction.responder,mode:"blocking" as const,revalidate:interaction.revalidate,...(interaction.stalePolicy?{stalePolicy:"reject" as const}:{})};\n  if(interaction.kind==="consent") {\n    if(input.type!=="boolean"||input.selector!==undefined) throw new DomainEvaluationError(`${label}.input must be boolean for portable consent interaction`);\n    return {...common,kind:"consent",input:{type:"boolean"}};\n  }\n  if(interaction.kind==="choice") {\n    if(input.type!=="choice"||input.selector===undefined) throw new DomainEvaluationError(`${label}.input must be choice with selector for portable choice interaction`);\n    const selector=parseTargetingSelector(input.selector,`${label}.input.selector`);\n    if((selector.selection??"manual")!=="manual") throw new DomainEvaluationError(`${label}.input.selector must use manual selection`);\n    if(selector.max<1) throw new DomainEvaluationError(`${label}.input.selector.max must allow at least one choice`);\n    return {...common,kind:"choice",input:{type:"choice",selector}};\n  }\n  throw new DomainEvaluationError(`${label}.kind must be consent or choice for portable Common Play interaction`);\n}\n'''
          if text.count(old_parse)!=1: raise SystemExit('parse consent anchor changed')
          text=text.replace(old_parse,new_parse,1)
          text=text.replace('parseConsentInteraction(entry.interaction,`${label}.interaction`)','parseInteraction(entry.interaction,`${label}.interaction`)',1)
          old_auth='''  if(entryPoint.interaction) {\n    if(!input.interactionResponse) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires accepted interaction authorization`);\n    if(input.interactionResponse.interactionId!==entryPoint.interaction.id) throw new DomainEvaluationError("Common Play interaction authorization identity mismatch");\n    if(input.interactionResponse.accepted!==true) throw new DomainEvaluationError("Common Play interaction authorization must be accepted");\n  }\n'''
          new_auth='''  if(entryPoint.interaction) {\n    if(!input.interactionResponse) throw new DomainEvaluationError(`Common Play entry point ${entryPoint.id} requires interaction authorization`);\n    if(input.interactionResponse.interactionId!==entryPoint.interaction.id) throw new DomainEvaluationError("Common Play interaction authorization identity mismatch");\n    if(entryPoint.interaction.kind==="consent") {\n      if(input.interactionResponse.accepted!==true||input.interactionResponse.selectedIds!==undefined) throw new DomainEvaluationError("Common Play consent authorization must be accepted");\n    } else {\n      if(input.interactionResponse.accepted!==undefined||!input.interactionResponse.selectedIds) throw new DomainEvaluationError("Common Play choice authorization requires selectedIds");\n      const choice=resolveCommonPlaySelector({\n        sourceId:input.actorId,selector:entryPoint.interaction.input.selector,candidates:input.interactionCandidates??[],\n        selectedIds:input.interactionResponse.selectedIds,selection:"manual",authority:"actor-owner",directTarget:false,\n      });\n      if(choice.status!=="resolved") throw new DomainEvaluationError(`Common Play choice authorization rejected: ${choice.reason}`);\n    }\n  }\n'''
          if text.count(old_auth)!=1: raise SystemExit('interaction authorization anchor changed')
          text=text.replace(old_auth,new_auth,1)
          p.write_text(text,encoding='utf-8')

          # App contract: optional choice payload; boolean callers remain source-compatible.
          replace_once('src/app/contracts.ts','''export interface InterruptView {\n  id: string;\n  responderId: string;\n  responderName: string;\n  trigger: string;\n  optionName: string;\n  cost: string;\n  effect: string;\n  source: string;\n}\n''','''export interface InterruptView {\n  id: string;\n  responderId: string;\n  responderName: string;\n  trigger: string;\n  optionName: string;\n  cost: string;\n  effect: string;\n  source: string;\n  choice?: { min:number; max:number; options:Array<{id:string;name:string}> };\n}\n''')
          replace_once('src/app/contracts.ts','respondToInterrupt(accept: boolean): Promise<AppSnapshot>;','respondToInterrupt(accept: boolean, selectedIds?: string[]): Promise<AppSnapshot>;')
          replace_once('src/app/mockAdapter.ts','async respondToInterrupt(accept:boolean){','async respondToInterrupt(accept:boolean,_selectedIds?:string[]){')

          # Production Common Play bridge: project options and revalidate selected IDs before the same atomic commit.
          p=Path('src/app/installedCommonPlayRuntimeAdapter.ts'); text=p.read_text(encoding='utf-8')
          text=text.replace('''  resolutionId:string,\n  interactionId?:string,\n  itemPaymentResourceIds?:Record<number,string>,\n''','''  resolutionId:string,\n  interactionResponse?:{interactionId:string;accepted?:true;selectedIds?:string[]},\n  interactionCandidates?:CommonPlaySelectorCandidate[],\n  itemPaymentResourceIds?:Record<number,string>,\n''',1)
          text=text.replace('''    ...(itemPaymentResourceIds?{itemPaymentResourceIds}:{}),\n    actionKind:entryPoint.test?.kind==="attack-roll"?"attack" as const:action.category==="spell"?"magic" as const:"other" as const,\n    ...(interactionId?{interactionResponse:{interactionId,accepted:true as const}}:{}),\n''','''    ...(itemPaymentResourceIds?{itemPaymentResourceIds}:{}),\n    actionKind:entryPoint.test?.kind==="attack-roll"?"attack" as const:action.category==="spell"?"magic" as const:"other" as const,\n    ...(interactionResponse?{interactionResponse}:{}),\n    ...(interactionCandidates?{interactionCandidates}:{}),\n''',1)
          text=text.replace('''  resolutionId:string,\n  interactionId?:string,\n) {\n''','''  resolutionId:string,\n  interactionResponse?:{interactionId:string;accepted?:true;selectedIds?:string[]},\n) {\n''',1)
          old_compile='''    const itemContext=itemPaymentRuntimeContext(internal,state,lowered.definition);\n    const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionId,itemContext.itemPaymentResourceIds));\n'''
          new_compile='''    const itemContext=itemPaymentRuntimeContext(internal,state,lowered.definition);\n    const interactionCandidates=entryPoint.interaction?.kind==="choice"\n      ?commonPlayTargetCandidates(adapter,internal.scene,itemContext.state,actorEntity,entryPoint.interaction.input.selector)\n      :undefined;\n    const pending=compileCommonPlayEntryPointOperations(SIMPLEVTT_APP_RULES_PROFILE,itemContext.state,lowered.definition,operationExecutionInput(internal,actionId,action,prepared,resolutionId,interactionResponse,interactionCandidates,itemContext.itemPaymentResourceIds));\n'''
          if text.count(old_compile)!=1: raise SystemExit('production compile anchor changed')
          text=text.replace(old_compile,new_compile,1)
          old_interrupt='''  prepared.internal.resolution={\n'''
          insert='''  const choiceCandidates=interaction.kind==="choice"\n    ?commonPlayTargetCandidates(this,prepared.internal.scene,prepared.state,prepared.actorEntity,interaction.input.selector)\n    :undefined;\n  if(interaction.kind==="choice"&&choiceCandidates!.length<interaction.input.selector.min) {\n    return failAction(prepared.internal,prepared.actor.id,actionId,actionName,targetIds,resolutionId,"choice interaction has too few authoritative options");\n  }\n  prepared.internal.resolution={\n'''
          # only the resolveAction occurrence after interaction responder block
          pos=text.index('  prepared.internal.resolution={',text.index('const interactionResponder=authorityResponder'))
          text=text[:pos]+insert+text[pos+len('  prepared.internal.resolution={\n'):]
          old_source='''      effect:"승인 시 선언된 Common Play 효과를 적용합니다.",\n      source:action.source,\n'''
          new_source='''      effect:interaction.kind==="choice"?"선택 확정 시 선언된 Common Play 효과를 적용합니다.":"승인 시 선언된 Common Play 효과를 적용합니다.",\n      source:action.source,\n      ...(interaction.kind==="choice"?{choice:{\n        min:interaction.input.selector.min,max:interaction.input.selector.max,\n        options:choiceCandidates!.map((candidate)=>({id:candidate.id,name:typeof candidate.properties.name==="string"?candidate.properties.name:candidate.id})),\n      }}:{}),\n'''
          if text.count(old_source)!=1: raise SystemExit('interrupt source anchor changed')
          text=text.replace(old_source,new_source,1)
          text=text.replace('MockAdapter.prototype.respondToInterrupt=async function respondToCommonPlayInteraction(accept:boolean) {','MockAdapter.prototype.respondToInterrupt=async function respondToCommonPlayInteraction(accept:boolean,selectedIds?:string[]) {',1)
          old_response='''  if(!accept) return finishInteraction(internal,resolution,"Common Play 상호작용 거절");\n\n  const prepared=prepareCommonPlayAction(this,resolution.actionId,resolution.targetIds,action,runtimeArtifactReference?.actorId,false,allowUnprojectedRuntimeArtifact);\n  if(!prepared) return finishInteraction(internal,resolution,"Common Play 상호작용 현재 권한 재검증 실패");\n  const result=await executeCommonPlayAction(this,resolution.actionId,action,prepared,resolution.id,interrupt.id);\n'''
          new_response='''  if(!accept) return finishInteraction(internal,resolution,"Common Play 상호작용 거절");\n  let interactionResponse:{interactionId:string;accepted?:true;selectedIds?:string[]};\n  if(entryPoint.interaction.kind==="consent") {\n    if(selectedIds!==undefined) return finishInteraction(internal,resolution,"Common Play consent 응답에 선택 payload를 사용할 수 없습니다.");\n    interactionResponse={interactionId:interrupt.id,accepted:true};\n  } else {\n    const choice=interrupt.choice;\n    const selection=selectedIds??[];\n    const unique=[...new Set(selection)];\n    const optionIds=new Set(choice?.options.map((option)=>option.id)??[]);\n    if(!choice||unique.length!==selection.length||selection.length<choice.min||selection.length>choice.max||selection.some((id)=>!optionIds.has(id))) {\n      return finishInteraction(internal,resolution,"Common Play choice 응답 검증 실패");\n    }\n    interactionResponse={interactionId:interrupt.id,selectedIds:[...selection]};\n  }\n\n  const prepared=prepareCommonPlayAction(this,resolution.actionId,resolution.targetIds,action,runtimeArtifactReference?.actorId,false,allowUnprojectedRuntimeArtifact);\n  if(!prepared) return finishInteraction(internal,resolution,"Common Play 상호작용 현재 권한 재검증 실패");\n  const result=await executeCommonPlayAction(this,resolution.actionId,action,prepared,resolution.id,interactionResponse);\n'''
          if text.count(old_response)!=1: raise SystemExit('response anchor changed')
          text=text.replace(old_response,new_response,1)
          old_detail='''    detail:[`${lowered.definition.id} · ${action.entryPointId}`,...(allocationOutcome?[allocationOutcome]:[]),...(roll?[`${roll.family} · ${roll.rollState} · ${roll.outcome}`]:[]),...committed.events.map((event)=>event.summary)],\n'''
          new_detail='''    detail:[`${lowered.definition.id} · ${action.entryPointId}`,...(interactionResponse?.selectedIds?.length?[`선택 · ${interactionResponse.selectedIds.join(", ")}`]:[]),...(allocationOutcome?[allocationOutcome]:[]),...(roll?[`${roll.family} · ${roll.rollState} · ${roll.outcome}`]:[]),...committed.events.map((event)=>event.summary)],\n'''
          if text.count(old_detail)!=1: raise SystemExit('presentation detail anchor changed')
          text=text.replace(old_detail,new_detail,1)
          p.write_text(text,encoding='utf-8')

          # Connected response transport carries the same optional selection IDs.
          replace_once('src/app/connectedInterruptResponsePort.ts','''  accept:boolean;\n}\n''','''  accept:boolean;\n  selectedIds?:string[];\n}\n''')
          p=Path('src/app/connectedActionRoutingAdapter.ts'); text=p.read_text(encoding='utf-8')
          text=text.replace('MockAdapter.prototype.respondToInterrupt=async function respondConnectedInterrupt(accept:boolean) {','MockAdapter.prototype.respondToInterrupt=async function respondConnectedInterrupt(accept:boolean,selectedIds?:string[]) {',1)
          text=text.replace('response:{sessionId:state.sessionId,resolutionId:app.resolution.id,promptId:interrupt.id,accept},','response:{sessionId:state.sessionId,resolutionId:app.resolution.id,promptId:interrupt.id,accept,...(selectedIds?{selectedIds:[...selectedIds]}:{})},',1)
          text=text.replace('const next=await previousRespondToInterrupt.call(this,accept);','const next=await previousRespondToInterrupt.call(this,accept,selectedIds);',1)
          text=text.replace('await adapter.respondToInterrupt(response.accept);','await adapter.respondToInterrupt(response.accept,response.selectedIds);',1)
          p.write_text(text,encoding='utf-8')

          p=Path('src/app/connectedSessionWire.ts'); text=p.read_text(encoding='utf-8')
          old='''  return isRecord(value)&&isString(value.id)&&isString(value.responderId)&&isString(value.responderName)\n    &&isString(value.trigger)&&isString(value.optionName)&&isString(value.cost)&&isString(value.effect)&&isString(value.source)\n    &&Object.keys(value).every((key)=>["id","responderId","responderName","trigger","optionName","cost","effect","source"].includes(key));\n'''
          new='''  const choice=value.choice;\n  const validChoice=choice===undefined||(isRecord(choice)&&isCursor(choice.min)&&isCursor(choice.max)&&Number(choice.max)>=Number(choice.min)\n    &&Array.isArray(choice.options)&&choice.options.every((option)=>isRecord(option)&&isString(option.id)&&isString(option.name)));\n  return isRecord(value)&&isString(value.id)&&isString(value.responderId)&&isString(value.responderName)\n    &&isString(value.trigger)&&isString(value.optionName)&&isString(value.cost)&&isString(value.effect)&&isString(value.source)&&validChoice\n    &&Object.keys(value).every((key)=>["id","responderId","responderName","trigger","optionName","cost","effect","source","choice"].includes(key));\n'''
          if text.count(old)!=1: raise SystemExit('wire interrupt validator anchor changed')
          text=text.replace(old,new,1)
          old='''    if(!isRecord(response)||!isString(response.sessionId)||!isString(response.resolutionId)||!isString(response.promptId)||typeof response.accept!=="boolean") return "invalid resolution-interrupt-response message";\n'''
          new='''    if(!isRecord(response)||!isString(response.sessionId)||!isString(response.resolutionId)||!isString(response.promptId)||typeof response.accept!=="boolean"||(response.selectedIds!==undefined&&!isStringArray(response.selectedIds))) return "invalid resolution-interrupt-response message";\n'''
          if text.count(old)!=1: raise SystemExit('wire response validator anchor changed')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # Unknown external package proof: multiple authoritative options, connected selection payload, atomic payment/effect, decline safety, rename invariance.
          Path('tests/ui/c9FamilyQChoiceInteractionProduction.test.ts').write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/connectedSessionRuntimeAdapter";
          import "../../src/app/connectedActionRoutingAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { connectedManifest } from "../../src/app/connectedSessionRuntimeAdapter";
          import { connectedStateFor } from "../../src/app/connectedSessionState";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { HostSessionLedger } from "../../src/app/connectedSessionProtocol";
          import { tauriSessionTransport } from "../../src/app/tauriSessionTransport";
          import { routeConnectedInterruptResponse } from "../../src/app/connectedInterruptResponsePort";

          function payload(prefix:string){return JSON.stringify({
            schemaVersion:"0.1-draft",moduleId:`homebrew.${prefix}`,moduleVersion:"1",
            rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
            source:{document:"Choice Probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],
            content:[{id:`option.${prefix}`,category:"option",presentation:{defaultLocale:"en",originalName:"Choice Probe",locales:{en:{name:"Choice Probe",description:"Portable multiple-option interaction"}}},mechanics:[{kind:"common-play",config:{
              schemaVersion:"0.2-draft",id:`external.${prefix}`,
              payments:[{kind:"economy",bucket:"reaction",amount:{value:1},consumeAt:"commit",refundOnCancel:true}],
              entryPoints:[{id:"choose",invocation:"manual",interaction:{id:"portable-choice",kind:"choice",responder:"actor-owner",mode:"blocking",input:{type:"choice",selector:{from:"targets",min:1,max:2,selection:"manual"}},revalidate:"always",stalePolicy:"reject"},operations:[{kind:"healing.apply",amount:{value:1},target:"actor"}]}],
            }}]}]
          });}

          async function setup(prefix:string){
            const host=new MockAdapter();setInstalledContentStoreForTests(host,new MemoryInstalledContentStore());
            const preview=await host.previewContentImport(payload(prefix));
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await host.activateContentImport();
            const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(`option.${prefix}`,`homebrew.${prefix}`,"1"),mechanicId:`external.${prefix}`,entryPointId:"choose"});
            const internal=host as unknown as {activeCharacter:{id:string};scene:{entities:Array<{id:string;hp:number}>}};
            const actorId=internal.activeCharacter.id;
            await host.startInitiative();await host.setCurrentActor(actorId);
            const state=connectedStateFor(host);const sessionId=`session.${prefix}`;
            state.mode="host";state.sessionId=sessionId;state.ledger=new HostSessionLedger(sessionId,connectedManifest(host));
            const manifest=structuredClone(connectedManifest(host));state.peerManifests.set("peer.actor",manifest);
            return {host,actionId,actorId,sessionId,internal};
          }

          async function accepted(prefix:string){
            const {host,actionId,actorId,sessionId,internal}=await setup(prefix);
            const hpBefore=internal.scene.entities.find((entity)=>entity.id===actorId)!.hp;
            const direct:Array<{peer:string;message:string}>=[],broadcasts:string[]=[];
            const oldSend=tauriSessionTransport.send,oldSendTo=tauriSessionTransport.sendTo;
            tauriSessionTransport.send=async(message)=>{broadcasts.push(message);return 1;};
            tauriSessionTransport.sendTo=async(peer,message)=>{direct.push({peer,message});return 1;};
            try{
              await host.resolveAction(actionId,[actorId]);
              let snapshot=await host.getSnapshot();
              assert.equal(snapshot.resolution?.stage,"interrupt",JSON.stringify(snapshot.resolution));
              const choice=snapshot.resolution?.interrupt?.choice;assert.ok(choice);
              assert.equal(choice.min,1);assert.equal(choice.max,2);assert.ok(choice.options.length>=2,JSON.stringify(choice));
              assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,true);
              assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore);
              const selectedIds=choice.options.slice(0,2).map((option)=>option.id);
              const resolutionId=snapshot.resolution!.id,promptId=snapshot.resolution!.interrupt!.id;
              assert.equal(await routeConnectedInterruptResponse(host,{peer:"peer.actor",message:""},{sessionId,resolutionId,promptId,accept:true,selectedIds}),true);
              snapshot=await host.getSnapshot();
              assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
              assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore+1);
              assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,false);
              assert.ok(snapshot.resolution?.detail.some((line)=>line.includes(selectedIds.join(", "))),JSON.stringify(snapshot.resolution?.detail));
              assert.ok(broadcasts.map((wire)=>JSON.parse(wire)).some((wire)=>wire.type==="event-batch"),JSON.stringify(broadcasts));
              return {delta:(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp??0)-hpBefore,selectedCount:selectedIds.length};
            }finally{tauriSessionTransport.send=oldSend;tauriSessionTransport.sendTo=oldSendTo;}
          }

          test("unknown installed Common Play choice carries multiple connected options into one atomic Resolver commit and is rename invariant",async()=>{
            assert.deepEqual(await accepted("family-q-choice-a"),{delta:1,selectedCount:2});
            assert.deepEqual(await accepted("renamed-family-q-choice-b"),{delta:1,selectedCount:2});
          });

          test("portable choice decline leaves Reaction and downstream effect untouched",async()=>{
            const {host,actionId,actorId,internal}=await setup("family-q-choice-decline");
            const hpBefore=internal.scene.entities.find((entity)=>entity.id===actorId)!.hp;
            await host.resolveAction(actionId,[actorId]);
            let snapshot=await host.getSnapshot();assert.equal(snapshot.resolution?.stage,"interrupt");
            await host.respondToInterrupt(false);
            snapshot=await host.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete");
            assert.equal(snapshot.scene.entities.find((entity)=>entity.id===actorId)?.hp,hpBefore);
            assert.equal(snapshot.scene.economyByActor[actorId]?.reaction,true);
          });
