name: C9 Family L Critical Dice Apply 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-l-critical-dice-apply-71304.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=agent/c9-gate-n-coverage-reconciliation
          WF=.github/workflows/c9-family-l-critical-dice-apply-71304.yml
          SCRIPT=.github/c9-patches/family-l-critical-dice-71304.mjs
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin "$BRANCH" || true
              git reset --hard "origin/$BRANCH" || true
              rm -f "$WF" "$SCRIPT"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "chore(c9): remove failed critical dice verifier" || true
                git fetch origin "$BRANCH" || true
                git rebase "origin/$BRANCH" || true
                git push origin HEAD:"$BRANCH" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          npm ci
          npm run generate:content
          node "$SCRIPT"
          npx tsx --test tests/ui/c9FamilyLDamageDefenseProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc -p tsconfig.json --noEmit

          rm -f "$WF" "$SCRIPT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(c9): prove portable critical damage dice"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
