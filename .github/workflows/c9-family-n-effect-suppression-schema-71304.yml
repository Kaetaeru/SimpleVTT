name: C9 Family N Effect Suppression Schema 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-n-effect-suppression-schema-71304.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore effect.suppress schema definition
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path="schemas/common-play-contract.schema.json";
          const schema=JSON.parse(fs.readFileSync(path,"utf8"));
          schema.$defs.effectSuppress ??= {
            type:"object",
            required:["kind","selector","suppressed"],
            properties:{
              kind:{const:"effect.suppress"},
              selector:{$ref:"#/$defs/selector"},
              suppressed:{type:"boolean"},
              reason:{type:"string",minLength:1},
              pauseDuration:{type:"boolean"},
              when:{$ref:"#/$defs/predicate"}
            },
            additionalProperties:false
          };
          fs.writeFileSync(path,JSON.stringify(schema,null,2)+"\n");
          NODE
      - name: Verify schema-runtime parity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const schema=JSON.parse(fs.readFileSync("schemas/common-play-contract.schema.json","utf8"));
          assert.deepEqual(schema.$defs.effectSuppress.required,["kind","selector","suppressed"]);
          assert.equal(schema.$defs.effectSuppress.properties.kind.const,"effect.suppress");
          assert.equal(schema.$defs.effectSuppress.properties.selector.$ref,"#/$defs/selector");
          assert.equal(schema.$defs.effectSuppress.properties.suppressed.type,"boolean");
          assert.equal(schema.$defs.effectSuppress.properties.reason.minLength,1);
          assert.equal(schema.$defs.effectSuppress.properties.pauseDuration.type,"boolean");
          assert.equal(schema.$defs.effectSuppress.properties.when.$ref,"#/$defs/predicate");
          assert.ok(schema.$defs.operation.oneOf.some((entry)=>entry.$ref==="#/$defs/effectSuppress"));
          NODE
          npm run test:common-play-definition
          npm exec tsc -- --noEmit
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
      - name: Publish verified schema fix and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-n-effect-suppression-schema-71304.yml
          git add schemas/common-play-contract.schema.json
          git commit -m "fix(c9): expose portable effect suppression schema"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
