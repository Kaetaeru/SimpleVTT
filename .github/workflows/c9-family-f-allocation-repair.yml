name: C9 Family F Allocation Repair

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-f-allocation-repair.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile latest branch
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Execute staged allocation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/c9-family-f-allocation-production-7130.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          if marker not in workflow or '\n          PY' not in workflow:
              raise SystemExit('staged allocation patch markers are missing')
          script = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, 'family-f-allocation-staged.py', 'exec'))
          PY
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify allocation production slice
        run: >-
          npx tsx --test
          tests/domain/commonPlayAllocationRuntime.test.ts
          tests/ui/installedCommonPlayAllocationProductionRuntime.test.ts
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Commit verified allocation bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/c9-family-f-allocation-production-7130.yml \
            .github/workflows/c9-family-f-allocation-repair.yml
          git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayAllocationProductionRuntime.test.ts .github/workflows
          git commit -m "feat(c9): bridge portable allocation production"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
