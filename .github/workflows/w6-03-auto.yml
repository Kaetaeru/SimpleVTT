name: W6-03 AUTO Verification

on:
  push:
    paths:
      - "src/CampaignSystemsPanel.tsx"
      - "src/app/campaignPartyStashPolicyRuntimeAdapter.ts"
      - "src/app/connectedPartyStashApprovalRuntimeAdapter.ts"
      - "src/app/connectedPartyStashHostPolicyAdapter.ts"
      - "tests/ui/campaignSystems.test.ts"
      - "tests/ui/connectedPartyStashApprovalOwnerTransfer.test.ts"
      - ".github/workflows/w6-03-auto.yml"
  pull_request:
    paths:
      - "src/CampaignSystemsPanel.tsx"
      - "src/app/campaignPartyStashPolicyRuntimeAdapter.ts"
      - "src/app/connectedPartyStashApprovalRuntimeAdapter.ts"
      - "src/app/connectedPartyStashHostPolicyAdapter.ts"
      - "tests/ui/campaignSystems.test.ts"
      - "tests/ui/connectedPartyStashApprovalOwnerTransfer.test.ts"
      - ".github/workflows/w6-03-auto.yml"
  workflow_dispatch:

env:
  V1_VERIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate:content
      - name: Focused W6-03 tests
        run: |
          npx tsx --test tests/ui/campaignSystems.test.ts tests/ui/connectedPartyStashApprovalOwnerTransfer.test.ts > w6-03-auto.log
          cat w6-03-auto.log
      - name: Production build
        run: npm run build
      - name: Upload W6-03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W6-03-AUTO-${{ env.V1_VERIFICATION_SHA }}
          path: w6-03-auto.log
