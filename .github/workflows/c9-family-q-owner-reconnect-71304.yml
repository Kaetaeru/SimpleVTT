name: C9 Family Q Owner Reconnect 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-q-owner-reconnect-71304.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch owner reconnect routing and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/app/connectedSessionRuntimeAdapter.ts')
          text = source.read_text()
          anchor = '''export async function broadcastConnectedWire(message:ConnectedWireMessage) {
            await tauriSessionTransport.send(encodeConnectedWireMessage(message));
          }
          '''
          insert = '''export async function broadcastConnectedWire(message:ConnectedWireMessage) {
            await tauriSessionTransport.send(encodeConnectedWireMessage(message));
          }

          export async function resumeConnectedInterruptPromptForCharacter(adapter:MockAdapter,peer:string,characterId:string) {
            const state=connectedStateFor(adapter);
            const app=connectedInternal(adapter);
            const resolution=app.resolution;
            const interrupt=resolution?.stage==="interrupt"?resolution.interrupt:undefined;
            if(state.mode!=="host"||!state.ledger||!resolution||!interrupt||interrupt.responderId!==characterId) return {status:"ignored" as const};
            await sendConnectedWireTo(peer,{
              type:"resolution-interrupt-prompt",
              sessionId:state.ledger.sessionId,
              resolutionId:resolution.id,
              presentationSequence:state.nextPresentationSequence,
              interrupt:structuredClone(interrupt),
            });
            return {status:"sent" as const};
          }
          '''
          if anchor not in text:
              raise SystemExit('connectedSessionRuntimeAdapter broadcast anchor not found')
          text = text.replace(anchor, insert, 1)
          hello = '        if(characterId) await resumeConnectedCommonPlayAuthorityFactRequestsForCharacter(adapter,characterId);'
          replacement = '''        if(characterId) {
                  await resumeConnectedCommonPlayAuthorityFactRequestsForCharacter(adapter,characterId);
                  await resumeConnectedInterruptPromptForCharacter(adapter,message.peer,characterId);
                }'''
          if hello not in text:
              raise SystemExit('connectedSessionRuntimeAdapter reconnect anchor not found')
          text = text.replace(hello, replacement, 1)
          source.write_text(text)

          test = Path('tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts')
          text = test.read_text()
          imp = 'import { connectedManifest } from "../../src/app/connectedSessionRuntimeAdapter";'
          imp2 = 'import { connectedManifest, resumeConnectedInterruptPromptForCharacter } from "../../src/app/connectedSessionRuntimeAdapter";'
          if imp not in text:
              raise SystemExit('Q test import anchor not found')
          text = text.replace(imp, imp2, 1)
          accept = '''    assert.equal(await routeConnectedInterruptResponse(host,{peer:"peer.target",message:""},{sessionId,resolutionId,promptId,accept:true}),true);
              snapshot=await host.getSnapshot();'''
          expanded = '''    if(responder==="target-owner") {
                  state.peerManifests.delete("peer.target");
                  const reboundPeer="peer.target.reconnected";
                  state.peerManifests.set(reboundPeer,targetManifest);
                  const directBeforeReconnect=direct.length;
                  assert.deepEqual(await resumeConnectedInterruptPromptForCharacter(host,reboundPeer,targetId),{status:"sent"});
                  const resumed=direct.slice(directBeforeReconnect).map((entry)=>({peer:entry.peer,wire:JSON.parse(entry.message)})).find((entry)=>entry.wire.type==="resolution-interrupt-prompt");
                  assert.equal(resumed?.peer,reboundPeer,JSON.stringify(direct.slice(directBeforeReconnect)));
                  assert.equal(resumed?.wire.resolutionId,resolutionId);
                  assert.equal(resumed?.wire.interrupt.id,promptId);

                  const directBeforeStale=direct.length;
                  assert.equal(await routeConnectedInterruptResponse(host,{peer:"peer.target",message:""},{sessionId,resolutionId,promptId,accept:true}),true);
                  const stale=direct.slice(directBeforeStale).map((entry)=>JSON.parse(entry.message)).filter((wire)=>wire.type==="error");
                  assert.equal(stale.at(-1)?.code,"interrupt-not-pending",JSON.stringify(stale));
                  snapshot=await host.getSnapshot();
                  assert.equal(snapshot.resolution?.stage,"interrupt");
                  assert.equal(snapshot.scene.entities.find((entity)=>entity.id===targetId)?.hp,targetHpBefore);
                  assert.equal(await routeConnectedInterruptResponse(host,{peer:reboundPeer,message:""},{sessionId,resolutionId,promptId,accept:true}),true);
                } else {
                  assert.equal(await routeConnectedInterruptResponse(host,{peer:"peer.target",message:""},{sessionId,resolutionId,promptId,accept:true}),true);
                }
                snapshot=await host.getSnapshot();'''
          if accept not in text:
              raise SystemExit('Q test acceptance anchor not found')
          text = text.replace(accept, expanded, 1)
          test.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family Q reconnect regression
        run: >-
          npx tsx --test
          tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
          tests/ui/installedCommonPlayActorOwnerInteractionProduction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish verified patch and self-retire
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-q-owner-reconnect-71304.yml
          git add src/app/connectedSessionRuntimeAdapter.ts tests/ui/c9FamilyQTargetOwnerInteractionProduction.test.ts
          git commit -m "feat(c9): resume owner consent after reconnect"
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git rebase origin/agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
