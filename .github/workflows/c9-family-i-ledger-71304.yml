name: C9 Family I Ledger Reconciliation 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-ledger-71304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Verify Family I production evidence and repository boundaries
        run: |
          npx tsx --test tests/domain/commonPlayMovementRuntime.test.ts tests/ui/c9FamilyIMovementModeAcceptance.test.ts tests/ui/c9FamilyIMovementProduction.test.ts tests/ui/installedCommonPlayLoweredFamiliesProduction.test.ts
          node scripts/check-legacy-execution-boundary.mjs
          npx tsc --noEmit
      - name: Publish ledger reconciliation against latest branch and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=agent/c9-gate-n-coverage-reconciliation
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(row for row in data['rows'] if row['family']=='I')
          stale='Canonical movement.relocate now parses through the operations lowerer and executes actor-authority mapless destinations in installed production/Undo; complete modes, costs, connected breadth, and derived constraints remain incomplete'
          if row.get('currentState')==stale:
            row['currentState']='Canonical movement.relocate executes unknown installed Common Play through production Resolver/Undo for walk, climb, swim, fly, crawl, jump, push, pull, teleport, cost multipliers, no-provoke, and zero-speed rejection with identity-invariant external content. Family I remains incomplete for named movement grants and derived movement constraints including Difficult Terrain, stand-from-Prone, drag/carry, and alternate-speed composition.'
          for evidence in [
            'c9FamilyIMovementModeAcceptance.test.ts portable walk/climb/swim/fly/crawl/jump, push/pull/teleport, no-provoke, zero-speed rejection, Undo, and rename invariance',
            'c9FamilyIMovementProduction.test.ts unknown installed RuleModule production matrix for movement types, cost multiplier, forced movement, teleport, Undo, and full external identity rename',
            'C9 Family I Movement Mode Matrix run 33310511648: production matrix, legacy execution boundary, and tsc --noEmit passed at d3b105c37a8cb2c3c715b1abddf62f3abb638fce',
          ]:
            if evidence not in row['productionEvidence']:
              row['productionEvidence'].append(evidence)
          for evidence in [
            'c9FamilyIMovementModeAcceptance.test.ts renamed external movement definition preserves production semantics',
            'c9FamilyIMovementProduction.test.ts renaming module/content/mechanic identities preserves the full production movement matrix',
          ]:
            if evidence not in row['identityInvarianceEvidence']:
              row['identityInvarianceEvidence'].append(evidence)
          seams=[seam for seam in row.get('remainingNamedSeams',[]) if seam!='complete movement mode/cost production matrix']
          derived='Difficult Terrain, stand-from-Prone, drag/carry, and alternate-speed derived movement constraints remain outside portable production proof'
          if not any('Difficult Terrain' in seam and 'alternate' in seam for seam in seams):
            seams.append(derived)
          row['remainingNamedSeams']=seams
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            node scripts/check-v1-mechanism-coverage.mjs
            git add docs/rules/v1-mechanism-coverage-ledger.json
            git rm -f --ignore-unmatch .github/workflows/c9-family-i-ledger-71304.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs(c9): reconcile Family I movement matrix evidence"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
