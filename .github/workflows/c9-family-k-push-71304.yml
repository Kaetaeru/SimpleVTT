name: C9 Family K Target Push 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-k-push-71304.yml

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile latest branch state
        run: git pull --ff-only origin agent/c9-gate-n-coverage-reconciliation
      - run: npm ci
      - run: npm run generate:content
      - name: Add generic conditional target movement and Family K proof
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one patch target, found {text.count(old)}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          replace_once(
              'src/domain/commonPlayMovementRuntime.ts',
              '  target:string;\n  distance?:ExpressionNode;',
              '  target:string;\n  when?:{op:"eq";left:{ref:"test.outcome"};right:{value:"success"|"failure"}};\n  distance?:ExpressionNode;',
          )

          replace_once(
              'src/domain/commonPlayOperationRuntime.ts',
              'const MOVEMENT_RELOCATE_KEYS=new Set(["kind","mode","movementType","target","distance","costMultiplier","doesNotProvokeOpportunityAttacks","destinationFact"]);',
              'const MOVEMENT_RELOCATE_KEYS=new Set(["kind","mode","movementType","target","distance","costMultiplier","doesNotProvokeOpportunityAttacks","destinationFact","when"]);',
          )
          replace_once(
              'src/domain/commonPlayOperationRuntime.ts',
              '    if(operation.target!=="actor"&&operation.target!=="self") throw new DomainEvaluationError(`${label}.target must be actor or self`);\n    if(operation.doesNotProvokeOpportunityAttacks!==undefined&&typeof operation.doesNotProvokeOpportunityAttacks!=="boolean") throw new DomainEvaluationError(`${label}.doesNotProvokeOpportunityAttacks must be boolean`);',
              '    if(operation.target!=="actor"&&operation.target!=="self"&&operation.target!=="target") throw new DomainEvaluationError(`${label}.target must be actor, self, or target`);\n    if(operation.doesNotProvokeOpportunityAttacks!==undefined&&typeof operation.doesNotProvokeOpportunityAttacks!=="boolean") throw new DomainEvaluationError(`${label}.doesNotProvokeOpportunityAttacks must be boolean`);',
          )
          replace_once(
              'src/domain/commonPlayOperationRuntime.ts',
              '    if(destinationFact.unknownPolicy!=="block"&&destinationFact.unknownPolicy!=="request-authority"&&destinationFact.unknownPolicy!=="treat-false"&&destinationFact.unknownPolicy!=="unsupported") throw new DomainEvaluationError(`${label}.destinationFact.unknownPolicy is unsupported`);\n    return {\n      kind:"movement.relocate",mode:operation.mode,movementType:operation.movementType as CommonPlayMovementDefinition["movementType"],target:operation.target,\n      distance:numericExpression(operation.distance,`${label}.distance`) as ExpressionNode,',
              '    if(destinationFact.unknownPolicy!=="block"&&destinationFact.unknownPolicy!=="request-authority"&&destinationFact.unknownPolicy!=="treat-false"&&destinationFact.unknownPolicy!=="unsupported") throw new DomainEvaluationError(`${label}.destinationFact.unknownPolicy is unsupported`);\n    const when=testOutcomePredicate(operation.when,`${label}.when`);\n    return {\n      kind:"movement.relocate",mode:operation.mode,movementType:operation.movementType as CommonPlayMovementDefinition["movementType"],target:operation.target,\n      ...(when?{when}:{}),\n      distance:numericExpression(operation.distance,`${label}.distance`) as ExpressionNode,',
          )
          replace_once(
              'src/domain/commonPlayOperationRuntime.ts',
              '    if(operation.kind==="movement.relocate") {\n      const definition={...operation,target:input.actorId,destinationFact:{...operation.destinationFact!,subject:operation.destinationFact!.subject==="actor"||operation.destinationFact!.subject==="self"?input.actorId:operation.destinationFact!.subject}};\n      const compiled=compileCommonPlayMovement({id:operationId,definition,answer:input.movementFactAnswers?.[index],properties:input.movementProperties});\n      if(compiled.status!=="compiled") throw new DomainEvaluationError(compiled.reason);\n      operations.push(compiled.operation);\n      continue;\n    }',
              '    if(operation.kind==="movement.relocate") {\n      const movementTargetId=operation.target==="target"?input.targetId:input.actorId;\n      if(!movementTargetId) throw new DomainEvaluationError("Common Play target movement requires one pre-resolved target");\n      const authoredSubject=operation.destinationFact!.subject;\n      const subject=authoredSubject==="actor"||authoredSubject==="self"?input.actorId:authoredSubject==="target"?movementTargetId:authoredSubject;\n      const definition={...operation,target:movementTargetId,destinationFact:{...operation.destinationFact!,subject}};\n      const compiled=compileCommonPlayMovement({id:operationId,definition,answer:input.movementFactAnswers?.[index],properties:input.movementProperties});\n      if(compiled.status!=="compiled") throw new DomainEvaluationError(compiled.reason);\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome" as const,equals:operation.when.right.value}:undefined;\n      operations.push({...compiled.operation,...(when?{when}:{})});\n      continue;\n    }',
          )

          replace_once(
              'src/app/installedCommonPlayRuntimeAdapter.ts',
              '    const subject=operation.destinationFact.subject==="actor"||operation.destinationFact.subject==="self"?actor.id:operation.destinationFact.subject;',
              '    const subject=operation.destinationFact.subject==="actor"||operation.destinationFact.subject==="self"?actor.id:operation.destinationFact.subject==="target"&&selectedTargetId?selectedTargetId:operation.destinationFact.subject;',
          )

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text(encoding='utf-8'))
          matches=[]
          def walk(node):
              if isinstance(node,dict):
                  props=node.get('properties')
                  if isinstance(props,dict) and props.get('kind',{}).get('const')=='movement.relocate':
                      matches.append(node)
                  for value in node.values(): walk(value)
              elif isinstance(node,list):
                  for value in node: walk(value)
          walk(schema)
          if len(matches)!=1:
              raise SystemExit(f'expected one movement.relocate schema, found {len(matches)}')
          movement=matches[0]
          target_enum=movement['properties']['target'].get('enum')
          if target_enum is None:
              const=movement['properties']['target'].get('const')
              target_enum=[const] if const else []
              movement['properties']['target']={'enum':target_enum}
          for value in ['actor','self','target']:
              if value not in target_enum: target_enum.append(value)
          movement['properties']['when']={'$ref':'#/$defs/d20ResultCondition'}
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > tests/ui/c9FamilyKPushConditionalMovementProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { runtimeResolutionEventHistory } from "../../src/app/runtimeResolutionEventHistory";

          const TARGET_ID="combatant.goblin-a";

          function moduleJson(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.option`;
            const mechanicId=`${prefix}.mechanic`;
            const config={schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{
              id:"push",invocation:"manual",targeting:{from:"targets",min:1,max:1},
              test:{kind:"attack-roll",roller:"actor",dc:{value:10}},
              operations:[{
                kind:"movement.relocate",mode:"push",target:"target",distance:{value:10},
                when:{op:"eq",left:{ref:"test.outcome"},right:{value:"success"}},
                destinationFact:{id:"push-destination",fact:"spatial.legal-destination",subject:"target",authority:"host",visibility:"public",unknownPolicy:"request-authority"},
              }],
            }]};
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Unknown Family K Push probe",version:"1",license:"CC0",srdDerived:false},dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Push",locales:{en:{name:"Portable Push"}}},mechanics:[{kind:"common-play",config}]}],
            })};
          }

          async function prepare(prefix:string) {
            const adapter=new MockAdapter();
            const pack=moduleJson(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const actionId=installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"push"});
            return {adapter,actionId};
          }

          async function exercise(prefix:string,face:number) {
            const {adapter,actionId}=await prepare(prefix);
            await adapter.setQueuedD20(face);
            const snapshot=await adapter.resolveAction(actionId,[TARGET_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const events=runtimeResolutionEventHistory(adapter)?.events??[];
            return events.filter((event)=>event.kind==="free-move");
          }

          test("unknown installed Common Play pushes the selected target only after a successful attack",async()=>{
            const hit=await exercise("external-family-k-push",15);
            assert.equal(hit.length,1);
            assert.equal(hit[0]?.actorId,TARGET_ID);
            assert.deepEqual(hit[0]?.result,{distanceFeet:10,maximumDistanceFeet:10,regularMovementSpent:0,doesNotProvokeOpportunityAttacks:false,movementMode:"push",destinationRef:hit[0]?.result&&typeof hit[0].result==="object"?(hit[0].result as {destinationRef:string}).destinationRef:undefined});
            assert.match(String((hit[0]?.result as {destinationRef?:string})?.destinationRef),/^manual:/);

            const miss=await exercise("external-family-k-push-miss",1);
            assert.equal(miss.length,0);
          });

          test("Push-like conditional target movement is invariant to external module/content/mechanic identity",async()=>{
            const first=await exercise("external-family-k-push-a",15);
            const renamed=await exercise("renamed-family-k-push-b",15);
            assert.equal(first[0]?.actorId,TARGET_ID);
            assert.equal(renamed[0]?.actorId,TARGET_ID);
            assert.equal((first[0]?.result as {movementMode?:string})?.movementMode,"push");
            assert.equal((renamed[0]?.result as {movementMode?:string})?.movementMode,"push");
          });
          EOF
      - name: Verify Family K conditional target movement
        run: |
          node --import tsx --test tests/ui/c9FamilyKGrazeConditionalDamageProduction.test.ts tests/ui/c9FamilyKPushConditionalMovementProduction.test.ts tests/ui/c9FamilyIMovementProduction.test.ts
          node scripts/check-v1-mechanism-coverage.mjs
          node scripts/check-legacy-execution-boundary.mjs
          npm exec tsc -- --noEmit
      - name: Publish verified implementation and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-k-push-71304.yml
          git add src/domain/commonPlayMovementRuntime.ts src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyKPushConditionalMovementProduction.test.ts
          git diff --cached --check
          git commit -m "feat(c9): support conditional target movement"
          for attempt in $(seq 1 10); do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              exit 1
            fi
            sleep 1
          done
          exit 1
