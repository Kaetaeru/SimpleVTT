name: C9 Family K Outcome Damage R3 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - ".github/workflows/c9-family-k-outcome-damage-r3-71304.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - name: Reconcile latest branch state
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:content
      - name: Add generic outcome-conditioned damage
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          source_path=Path("src/domain/commonPlayOperationRuntime.ts")
          source=source_path.read_text(encoding="utf-8")

          match=re.search(r'type CommonPlayDamageApply=\{\n(?P<body>.*?)\n\};',source,re.S)
          if not match:
              raise SystemExit("CommonPlayDamageApply block not found")
          block=match.group(0)
          if 'when?:CommonPlayTestOutcomePredicate;' not in block:
              anchor='  target?:CommonPlayHpTarget;'
              if anchor not in block:
                  raise SystemExit("CommonPlayDamageApply target anchor not found")
              updated=block.replace(anchor,anchor+'\n  when?:CommonPlayTestOutcomePredicate;',1)
              source=source[:match.start()]+updated+source[match.end():]

          keys=re.search(r'const DAMAGE_APPLY_KEYS=new Set\(\[(?P<body>[^\]]*)\]\);',source)
          if not keys:
              raise SystemExit("DAMAGE_APPLY_KEYS not found")
          keys_block=keys.group(0)
          if '"when"' not in keys_block:
              updated=keys_block[:-3]+',"when"]);'
              source=source[:keys.start()]+updated+source[keys.end():]

          parser_start=source.find('  if(operation.kind==="damage.apply") {')
          if parser_start<0:
              raise SystemExit("damage.apply parser block not found")
          parser_end=source.find('  if(operation.kind==="healing.apply") {',parser_start)
          if parser_end<0:
              raise SystemExit("damage.apply parser end not found")
          parser=source[parser_start:parser_end]
          if 'const when=testOutcomePredicate(operation.when' not in parser:
              return_anchor='    return {\n      kind:"damage.apply",'
              if return_anchor not in parser:
                  raise SystemExit("damage.apply parser return anchor not found")
              parser=parser.replace(return_anchor,'    const when=testOutcomePredicate(operation.when,`${label}.when`);\n'+return_anchor,1)
              target_anchor='      ...(operation.target===undefined?{}:{target:hpTarget(operation.target,`${label}.target`)}),'
              if target_anchor not in parser:
                  raise SystemExit("damage.apply parser target anchor not found")
              parser=parser.replace(target_anchor,target_anchor+'\n      ...(when?{when}:{}),',1)
              source=source[:parser_start]+parser+source[parser_end:]

          lower_start=source.find('    if(operation.kind==="damage.apply") {',parser_end)
          if lower_start<0:
              raise SystemExit("damage.apply lowering block not found")
          lower_end=source.find('    if(operation.kind==="healing.apply") {',lower_start)
          if lower_end<0:
              raise SystemExit("damage.apply lowering end not found")
          lower=source[lower_start:lower_end]
          if 'const when=operation.when?' not in lower:
              target_anchor='    if(operation.kind==="damage.apply") {\n      const targetId=hpOperationTarget(operation.target,input);'
              if target_anchor not in lower:
                  raise SystemExit("damage.apply lowering target anchor not found")
              lower=lower.replace(target_anchor,'    if(operation.kind==="damage.apply") {\n      const when=operation.when?{operationId:`${input.resolutionId}:test`,field:"outcome",equals:operation.when.right.value}:undefined;\n      const targetId=hpOperationTarget(operation.target,input);',1)
              roll_anchor='        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          request:{'
              if roll_anchor not in lower:
                  raise SystemExit("damage.apply damage-roll anchor not found")
              lower=lower.replace(roll_anchor,'        operations.push({\n          id:rollId,\n          kind:"damage-roll",\n          ...(when?{when}:{}),\n          request:{',1)
              damage_anchor='      operations.push({\n        id:operationId,\n        kind:"damage",\n        targetId,'
              if damage_anchor not in lower:
                  raise SystemExit("damage.apply damage anchor not found")
              lower=lower.replace(damage_anchor,'      operations.push({\n        id:operationId,\n        kind:"damage",\n        ...(when?{when}:{}),\n        targetId,',1)
              source=source[:lower_start]+lower+source[lower_end:]

          source_path.write_text(source,encoding="utf-8")

          schema_path=Path("schemas/common-play-contract.schema.json")
          schema=json.loads(schema_path.read_text(encoding="utf-8"))
          properties=schema["$defs"]["damageApply"]["properties"]
          expected={"$ref":"#/$defs/predicate"}
          if properties.get("when") not in (None,expected):
              raise SystemExit(f"damageApply.when incompatible: {properties.get('when')!r}")
          properties["when"]=expected
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          cat > tests/ui/c9FamilyKOutcomeDamageProduction.test.ts <<'TS'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";
          import { runtimeResolutionEventHistory } from "../../src/app/runtimeResolutionEventHistory";
          import { snapshotAdapterTurnRuntimeState } from "../../src/app/turnRuntimeSessionRegistry";

          const TARGET_ID="combatant.goblin-a";

          function packagePayload(prefix:string) {
            const moduleId=`${prefix}.module`;
            const contentId=`${prefix}.mastery-probe`;
            const mechanicId=`${prefix}.mechanic`;
            return {moduleId,contentId,mechanicId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"Family K outcome-conditioned damage probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],
              content:[{id:contentId,category:"option",presentation:{defaultLocale:"en",originalName:"Portable Mastery Probe",locales:{en:{name:"Portable Mastery Probe"}}},mechanics:[{kind:"common-play",config:{
                schemaVersion:"0.2-draft",id:mechanicId,entryPoints:[{id:"graze-like-miss-rider",invocation:"manual",targeting:{from:"targets",min:1,max:1},test:{kind:"attack-roll",roller:"actor",dc:{value:10}},operations:[{kind:"damage.apply",amount:{value:3},damageType:"force",target:"target",when:{op:"eq",left:{ref:"test.outcome"},right:{value:"failure"}}}]}]
              }}]}]
            })};
          }

          async function prepare(prefix:string) {
            const adapter=new MockAdapter();
            const pack=packagePayload(prefix);
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            return {adapter,actionId:installedCommonPlayActionId({catalogId:catalogQualifiedId(pack.contentId,pack.moduleId,"1"),mechanicId:pack.mechanicId,entryPointId:"graze-like-miss-rider"})};
          }

          function targetHp(adapter:MockAdapter,snapshot:Awaited<ReturnType<MockAdapter["getSnapshot"]>>) {
            const target=snapshotAdapterTurnRuntimeState(adapter,snapshot.scene)?.combatants[TARGET_ID];
            assert.ok(target,"target combatant must exist");
            return target.hp;
          }

          async function exercise(prefix:string,face:number) {
            const {adapter,actionId}=await prepare(prefix);
            let snapshot=await adapter.getSnapshot();
            const before=targetHp(adapter,snapshot);
            await adapter.setQueuedD20(face);
            snapshot=await adapter.resolveAction(actionId,[TARGET_ID]);
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            const after=targetHp(adapter,snapshot);
            const damageEvents=runtimeResolutionEventHistory(adapter)?.events.filter((event)=>event.kind==="hp-changed")??[];
            return {adapter,before,after,damageEvents};
          }

          test("unknown installed Common Play can apply a Graze-like damage rider only on attack failure",async()=>{
            const miss=await exercise("unknown-family-k-graze",1);
            assert.equal(miss.after,miss.before-3);
            assert.equal(miss.damageEvents.length,1);
            await miss.adapter.undoLastResolution();
            assert.equal(targetHp(miss.adapter,await miss.adapter.getSnapshot()),miss.before);
            const hit=await exercise("unknown-family-k-hit-control",15);
            assert.equal(hit.after,hit.before);
            assert.equal(hit.damageEvents.length,0);
          });

          test("outcome-conditioned damage is invariant to external module/content/mechanic identity",async()=>{
            const first=await exercise("unknown-family-k-identity-a",1);
            const renamed=await exercise("renamed-family-k-identity-b",1);
            assert.equal(first.before-first.after,3);
            assert.equal(renamed.before-renamed.after,3);
          });
          TS
      - name: Verify Family K outcome-conditioned damage
        run: npx tsx --test tests/ui/c9FamilyKOutcomeDamageProduction.test.ts
      - name: Verify existing semantic outcome regression
        run: npx tsx --test tests/ui/installedCommonPlaySemanticOutcomeProduction.test.ts tests/ui/c9FamilyJAttackPersistence.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify coverage ledger structure
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish verified slice and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-k-outcome-damage-r2-71304.yml .github/workflows/c9-family-k-outcome-damage-r3-71304.yml
          git add src/domain/commonPlayOperationRuntime.ts schemas/common-play-contract.schema.json tests/ui/c9FamilyKOutcomeDamageProduction.test.ts
          if ! git diff --cached --quiet; then git commit -m "feat(c9): support outcome-conditioned damage"; fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Cleanup R3 workflow after failure
        if: failure()
        run: |
          git rebase --abort || true
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/c9-family-k-outcome-damage-r3-71304.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(c9): remove failed Family K outcome verifier"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/c9-gate-n-coverage-reconciliation || { git rebase --abort || true; continue; }
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then exit 0; fi
            sleep 1
          done
          exit 0
