name: C9 Family X Item Payment Race Safe R3

on:
  push:
    branches:
      - "agent/c9-gate-n-coverage-reconciliation"
    paths:
      - ".github/workflows/c9-family-x-item-payment-race-safe-r3.yml"

permissions:
  contents: write

jobs:
  item-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare patch
        run: python .github/scripts/c9-family-x-item-payment-transform-r3.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply verify and push
        run: |
          set -euo pipefail
          TARGET=agent/c9-gate-n-coverage-reconciliation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$TARGET"
            git reset --hard FETCH_HEAD
            python /tmp/c9-family-x-item-payment-step.py
            npm run generate:content
            npx tsx --test tests/ui/installedCommonPlayItemPaymentProduction.test.ts tests/ui/phase09CommonPlayResourcePersistence.test.ts
            node scripts/check-legacy-execution-boundary.mjs
            npx tsc --noEmit
            rm -f .github/workflows/c9-family-x-item-payment-step.yml
            rm -f .github/workflows/c9-family-x-item-payment-race-safe.yml
            rm -f .github/workflows/c9-family-x-item-payment-race-safe-r2.yml
            rm -f .github/workflows/c9-family-x-item-payment-race-safe-r3.yml
            rm -f .github/scripts/c9-family-x-item-payment-step.py
            rm -f .github/scripts/c9-family-x-item-payment-transform-r3.py
            git add src/domain/commonPlayOperationRuntime.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/installedCommonPlayItemPaymentProduction.test.ts .github/workflows .github/scripts
            git commit -m "feat(c9): route portable item payments through resolver"
            if git push origin HEAD:"$TARGET"; then
              exit 0
            fi
          done
          exit 1
