name: C9 Family I Ledger Cleanup 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-i-ledger-cleanup-71304.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Remove duplicate Family I ledger wording
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/rules/v1-mechanism-coverage-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          row=next(item for item in data['rows'] if item.get('family')=='I')
          duplicate=' Generic RulesProfile property modifiers now derive movement cost multipliers and alternate fly speed into authoritative production movement input. Family I remains incomplete for drag/carry authority, remaining movement constraints, and named movement-grant convergence.'
          row['currentState']=row.get('currentState','').replace(duplicate,'')
          redundant='rules-derived drag/carry and remaining movement constraint authority remain incomplete'
          row['remainingNamedSeams']=[seam for seam in row.get('remainingNamedSeams',[]) if seam!=redundant]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Publish cleanup and retire workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-i-ledger-cleanup-71304.yml
          git add docs/rules/v1-mechanism-coverage-ledger.json
          git diff --cached --check
          git commit -m "docs(c9): normalize Family I movement evidence"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
