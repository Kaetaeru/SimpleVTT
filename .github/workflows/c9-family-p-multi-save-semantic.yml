name: C9 Family P Multi Save Semantic Outcomes

"on":
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-multi-save-semantic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply multi-target save semantic outcome patch
        env:
          PATCH_B64: >-
             
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | tr -d '[:space:]' | base64 -d > /tmp/c9-multi-save.py
          python /tmp/c9-multi-save.py
          npm ci
          npm run generate:content
          npx tsx --test tests/domain/commonPlaySaveDamageRuntime.test.ts tests/domain/commonPlaySemanticEventRuntime.test.ts
          npx tsc --noEmit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/commonPlayEntryPointRuntime.ts tests/domain/commonPlaySaveDamageRuntime.test.ts
          git rm .github/workflows/c9-family-p-multi-save-semantic.yml
          git commit -m "feat(c9): emit multi-target save outcome events"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
