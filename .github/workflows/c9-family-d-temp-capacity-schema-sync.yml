name: C9 Family D Temporary Capacity Schema

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-d-temp-capacity-schema-sync.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align persisted schema with temporary resource capacity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema_path=Path('schemas/common-play-contract.schema.json')
          schema=json.loads(schema_path.read_text())
          props=schema['$defs']['resourceChange']['properties']
          expected={'maximumDelta':{'$ref':'#/$defs/expression'},'temporaryCapacityUntilLongRest':{'const':True}}
          for key,value in expected.items():
              if key in props and props[key]!=value:
                  raise SystemExit(f'{key}: conflicting persisted schema definition')
              props[key]=value
          schema_path.write_text(json.dumps(schema,ensure_ascii=False,indent=2)+'\n')

          test_path=Path('tests/ui/ruleModulePackageImport.test.ts')
          text=test_path.read_text()
          title='installed Common Play accepts portable temporary resource capacity before persistence'
          if title not in text:
              marker='test("portable Common Play resource targets are rejected before unsupported mechanics can be persisted", async () => {'
              if text.count(marker)!=1:
                  raise SystemExit(f'import-test marker mismatch: {text.count(marker)}')
              addition='''test("installed Common Play accepts portable temporary resource capacity before persistence", async () => {\n  const store=new MemoryInstalledContentStore();\n  const adapter=new MockAdapter();\n  setInstalledContentStoreForTests(adapter,store);\n  const raw=JSON.parse(packagePayload()) as {content:Array<Record<string,unknown>>};\n  const mechanic=portableCommonPlayMechanic() as unknown as {config:{entryPoints:Array<{operations:Array<Record<string,unknown>>}>}};\n  mechanic.config.entryPoints[0].operations=[{\n    kind:"resource.change",\n    resource:"resource.external.primary",\n    amount:{value:0},\n    maximumDelta:{value:2},\n    temporaryCapacityUntilLongRest:true,\n  }];\n  raw.content[0].mechanics=[mechanic];\n\n  const preview=await adapter.previewContentImport(JSON.stringify(raw));\n  assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));\n  await adapter.activateContentImport();\n  const generation=(await store.readGenerations())[0];\n  if(!generation?.payload) throw new Error("expected installed-content generation");\n  const operation=decodeInstalledContent(generation.payload).entries.find((entry)=>entry.contentId==="option.atomic-parent")?.mechanics?.[0].config.entryPoints?.[0].operations?.[0];\n  assert.deepEqual(operation,{\n    kind:"resource.change",\n    resource:"resource.external.primary",\n    amount:{value:0},\n    maximumDelta:{value:2},\n    temporaryCapacityUntilLongRest:true,\n  });\n});\n\n'''
              text=text.replace(marker,addition+marker,1)
              test_path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify temporary capacity package import
        run: >-
          npx tsx --test
          --test-name-pattern="installed Common Play accepts portable temporary resource capacity before persistence"
          tests/ui/ruleModulePackageImport.test.ts
      - name: Verify Family D resource regressions
        run: >-
          npx tsx --test
          tests/domain/commonPlayResourceEconomyRuntime.test.ts
          tests/ui/phase09CommonPlayResourcePersistence.test.ts
          tests/domain/resourceRecoveryLockout.test.ts
      - name: Verify Gate N ledger
        run: node scripts/check-v1-mechanism-coverage.mjs
      - name: Verify legacy execution boundary
        run: node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit verified patch safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/c9-family-d-temp-capacity-schema-sync.yml
          git add schemas/common-play-contract.schema.json tests/ui/ruleModulePackageImport.test.ts .github/workflows
          git commit -m "fix(c9): persist portable temporary resource capacity"
          for attempt in $(seq 1 12); do
            git fetch origin agent/c9-gate-n-coverage-reconciliation
            if ! git rebase origin/agent/c9-gate-n-coverage-reconciliation; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:agent/c9-gate-n-coverage-reconciliation; then
              exit 0
            fi
            sleep 1
          done
          echo "bounded push retries exhausted" >&2
          exit 1
