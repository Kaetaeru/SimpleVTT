name: C9 Family A Profile Effect Projection 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-profile-effect-projection-7130.yml

permissions:
  contents: write

concurrency:
  group: c9-family-a-profile-effect-projection-7130
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync branch head
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation

      - name: Apply generic derived-property reference composition
        run: |
          python - <<'PY'
          from pathlib import Path

          effects = Path('src/domain/effects.ts')
          text = effects.read_text()
          old = '''  inputProperties:Record<string,number>,\n):PropertyResolution {\n  const base=inputProperties[property];\n  if(!Number.isFinite(base)) throw new DomainEvaluationError(`unresolved property reference: ${property}`);\n  let value=base;'''
          new = '''  inputProperties:Record<string,number>,\n  resolveReference?:(property:string)=>number|undefined,\n):PropertyResolution {\n  const base=inputProperties[property]??resolveReference?.(property);\n  if(typeof base!=="number"||!Number.isFinite(base)) throw new DomainEvaluationError(`unresolved property reference: ${property}`);\n  let value=base;'''
          if old not in text:
              raise SystemExit('effects base resolver anchor missing')
          text = text.replace(old, new, 1)
          old = '''      const referenced=inputProperties[reference];\n      if(!Number.isFinite(referenced)) throw new DomainEvaluationError(`unresolved property reference: ${reference}`);\n      return referenced;'''
          new = '''      const referenced=inputProperties[reference]??resolveReference?.(reference);\n      if(typeof referenced!=="number"||!Number.isFinite(referenced)) throw new DomainEvaluationError(`unresolved property reference: ${reference}`);\n      return referenced;'''
          if old not in text:
              raise SystemExit('effects reference resolver anchor missing')
          effects.write_text(text.replace(old, new, 1))

          service = Path('src/app/realResolutionService.ts')
          text = service.read_text()
          old = '''  const modified=resolveEffectModifiedProperty(\n    effects,targetId,property,{...inputProperties,[property]:base.value},\n  );'''
          new = '''  const modified=resolveEffectModifiedProperty(\n    effects,targetId,property,{...inputProperties,[property]:base.value},\n    (reference)=>resolveProfileProperty(SIMPLEVTT_APP_RULES_PROFILE,reference,inputProperties).value,\n  );'''
          if old not in text:
              raise SystemExit('runtime profile effect composition anchor missing')
          service.write_text(text.replace(old, new, 1))

          test = Path('tests/domain/effectModifiedProfileProperty.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { resolveRuntimeProfileProperty } from "../../src/app/realResolutionService";\nimport type { EffectInstance } from "../../src/domain/effects";\nimport type { ExpressionNode } from "../../src/domain/profileEngine";\n\nfunction modifier(property:string,operation:"add"|"set",value:ExpressionNode):EffectInstance {\n  return {\n    id:`effect:${property}`,sourceId:"external.unknown.property",targetId:"actor.a",kind:"modifier",tags:[],expiry:{kind:"time",elapsedSeconds:60},\n    propertyModifier:{property,operation,value,source:"definition",instancePolicy:"stack"},\n  };\n}\n\ntest("production profile resolver composes arbitrary derived properties with Effect modifiers",()=>{\n  const result=resolveRuntimeProfileProperty(\n    [modifier("ability.dex.modifier","add",{value:1})],"actor.a","ability.dex.modifier",{"ability.dex.score":14},\n  );\n  assert.equal(result.value,3);\n  assert.ok(result.provenance.some((entry)=>entry.source.startsWith("profile:dnd.srd-5.2.1/")));\n  assert.ok(result.provenance.some((entry)=>entry.source==="effect:effect:ability.dex.modifier"));\n});\n\ntest("Effect modifier expressions resolve another profile-derived property",()=>{\n  const result=resolveRuntimeProfileProperty(\n    [modifier("initiative","add",{ref:"ability.dex.modifier"})],"actor.a","initiative",\n    {initiative:1,"ability.dex.score":14},\n  );\n  assert.equal(result.value,3);\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused Family A regressions
        run: npx tsx --test tests/domain/effectModifiedProfileProperty.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Verify Gate N ledger checker
        run: npm run test:v1-coverage

      - name: Rebase onto latest branch and reverify
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          npx tsx --test tests/domain/effectModifiedProfileProperty.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          npx tsc --noEmit
          npm run test:v1-coverage

      - name: Commit verified change and remove temporary workflow
        run: |
          rm .github/workflows/c9-family-a-profile-effect-projection-7130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/effects.ts src/app/realResolutionService.ts tests/domain/effectModifiedProfileProperty.test.ts .github/workflows/c9-family-a-profile-effect-projection-7130.yml
          git commit -m "feat(c9): resolve derived property refs in effect modifiers"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
