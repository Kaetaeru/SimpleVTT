name: C9 Family A Profile Effect Projection 7130

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-a-profile-effect-projection-7130.yml

permissions:
  contents: write

concurrency:
  group: c9-family-a-profile-effect-projection-7130
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync branch head
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git reset --hard origin/agent/c9-gate-n-coverage-reconciliation

      - name: Apply minimal Family A profile-effect composition
        run: |
          python - <<'PY'
          from pathlib import Path

          effects = Path('src/domain/effects.ts')
          text = effects.read_text()
          old = 'import { DomainEvaluationError, evaluateExpression, type ExpressionNode, type PropertyResolution, type ProvenanceRecord } from "./profileEngine";'
          new = 'import { DomainEvaluationError, evaluateExpression, resolveProfileProperty, type ExpressionNode, type PropertyResolution, type ProvenanceRecord, type RulesProfileLike } from "./profileEngine";'
          if old not in text:
              raise SystemExit('effects import anchor missing')
          text = text.replace(old, new, 1)

          old = '''  inputProperties:Record<string,number>,\n):PropertyResolution {\n  const base=inputProperties[property];\n  if(!Number.isFinite(base)) throw new DomainEvaluationError(`unresolved property reference: ${property}`);\n  let value=base;'''
          new = '''  inputProperties:Record<string,number>,\n  resolveReference?:(property:string)=>number|undefined,\n):PropertyResolution {\n  const base=inputProperties[property]??resolveReference?.(property);\n  if(typeof base!=="number"||!Number.isFinite(base)) throw new DomainEvaluationError(`unresolved property reference: ${property}`);\n  let value=base;'''
          if old not in text:
              raise SystemExit('effects base resolver anchor missing')
          text = text.replace(old, new, 1)

          old = '''      const referenced=inputProperties[reference];\n      if(!Number.isFinite(referenced)) throw new DomainEvaluationError(`unresolved property reference: ${reference}`);\n      return referenced;'''
          new = '''      const referenced=inputProperties[reference]??resolveReference?.(reference);\n      if(typeof referenced!=="number"||!Number.isFinite(referenced)) throw new DomainEvaluationError(`unresolved property reference: ${reference}`);\n      return referenced;'''
          if old not in text:
              raise SystemExit('effects reference resolver anchor missing')
          text = text.replace(old, new, 1)

          anchor = '\nexport function suppressEffect(effect:EffectInstance,clock:RuntimeClock,reason:string,pauseDuration=false):EffectInstance {'
          addition = '''\nexport function resolveEffectModifiedProfileProperty(\n  profile:RulesProfileLike,\n  effects:EffectInstance[],\n  targetId:string,\n  property:string,\n  inputProperties:Record<string,number>,\n):PropertyResolution {\n  const base=resolveProfileProperty(profile,property,inputProperties);\n  const resolved=resolveEffectModifiedProperty(\n    effects,targetId,property,{...inputProperties,[property]:base.value},\n    (reference)=>resolveProfileProperty(profile,reference,inputProperties).value,\n  );\n  return {property,value:resolved.value,provenance:[...base.provenance,...resolved.provenance]};\n}\n'''
          if anchor not in text:
              raise SystemExit('effects wrapper insertion anchor missing')
          text = text.replace(anchor, addition + anchor, 1)
          effects.write_text(text)

          service = Path('src/app/realResolutionService.ts')
          text = service.read_text()
          old = '  properties:{},'
          new = '  properties:dndSrdRulesProfile.properties as RulesProfileLike["properties"],'
          if old not in text:
              raise SystemExit('rules profile properties anchor missing')
          service.write_text(text.replace(old, new, 1))

          adapter = Path('src/app/installedCommonPlayRuntimeAdapter.ts')
          text = adapter.read_text()
          old = 'import { resolveEffectModifiedProperty } from "../domain/effects";'
          new = 'import { resolveEffectModifiedProfileProperty } from "../domain/effects";'
          if old not in text:
              raise SystemExit('installed adapter effect import anchor missing')
          text = text.replace(old, new, 1)
          old = '''    "movement.walk":resolveEffectModifiedProperty(\n      state.effects,actor.id,"movement.walk",{"movement.walk":actorState.baseSpeed},\n    ).value,'''
          new = '''    "movement.walk":resolveEffectModifiedProfileProperty(\n      SIMPLEVTT_APP_RULES_PROFILE,state.effects,actor.id,"movement.walk",{"movement.walk":actorState.baseSpeed},\n    ).value,'''
          if old not in text:
              raise SystemExit('installed adapter movement projection anchor missing')
          adapter.write_text(text.replace(old, new, 1))

          test = Path('tests/domain/effectModifiedProfileProperty.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport dndSrdRulesProfile from "../../rules/profiles/dnd.srd-5.2.1.profile.json";\nimport { resolveEffectModifiedProfileProperty, type EffectInstance } from "../../src/domain/effects";\nimport type { RulesProfileLike } from "../../src/domain/profileEngine";\n\nconst profile:RulesProfileLike={\n  profileId:"dnd.srd-5.2.1",\n  roundingPolicy:dndSrdRulesProfile.roundingPolicy as RulesProfileLike["roundingPolicy"],\n  properties:dndSrdRulesProfile.properties as RulesProfileLike["properties"],\n};\n\nfunction modifier(property:string,operation:"add"|"set",value:EffectInstance["propertyModifier"] extends infer M ? M extends {value:infer V} ? V : never : never):EffectInstance {\n  return {\n    id:`effect:${property}`,sourceId:"external.unknown.property",targetId:"actor.a",kind:"modifier",tags:[],expiry:{kind:"time",elapsedSeconds:60},\n    propertyModifier:{property,operation,value,source:"definition",instancePolicy:"stack"},\n  };\n}\n\ntest("profile-derived arbitrary properties compose with Effect-owned modifiers",()=>{\n  const result=resolveEffectModifiedProfileProperty(\n    profile,[modifier("ability.dex.modifier","add",{value:1})],"actor.a","ability.dex.modifier",{"ability.dex.score":14},\n  );\n  assert.equal(result.value,3);\n  assert.ok(result.provenance.some((entry)=>entry.source.startsWith("profile:dnd.srd-5.2.1/")));\n  assert.ok(result.provenance.some((entry)=>entry.source==="effect:effect:ability.dex.modifier"));\n});\n\ntest("Effect modifier expressions can reference another profile-derived property",()=>{\n  const result=resolveEffectModifiedProfileProperty(\n    profile,[modifier("initiative","add",{ref:"ability.dex.modifier"})],"actor.a","initiative",\n    {"initiative":1,"ability.dex.score":14},\n  );\n  assert.equal(result.value,3);\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused Family A regressions
        run: npx tsx --test tests/domain/effectModifiedProfileProperty.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Verify Gate N ledger checker
        run: npm run test:v1-coverage

      - name: Rebase onto latest branch and reverify
        run: |
          git fetch origin agent/c9-gate-n-coverage-reconciliation
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          npx tsx --test tests/domain/effectModifiedProfileProperty.test.ts tests/ui/installedCommonPlayPropertyModifierProduction.test.ts
          npx tsc --noEmit
          npm run test:v1-coverage

      - name: Commit verified change and remove temporary workflow
        run: |
          rm .github/workflows/c9-family-a-profile-effect-projection-7130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/effects.ts src/app/realResolutionService.ts src/app/installedCommonPlayRuntimeAdapter.ts tests/domain/effectModifiedProfileProperty.test.ts .github/workflows/c9-family-a-profile-effect-projection-7130.yml
          git commit -m "feat(c9): compose profile and effect property resolution"
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
