name: C9 Family P State Applied Dispatch 71304

on:
  push:
    branches:
      - agent/c9-gate-n-coverage-reconciliation
    paths:
      - .github/workflows/c9-family-p-state-applied-dispatch-71304.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c9-gate-n-coverage-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync branch
        run: git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
      - name: Bridge effect activation through existing semantic dispatcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("src/app/installedCommonPlayRuntimeAdapter.ts")
          text=path.read_text(encoding="utf-8")
          old_import='import { appendCommonPlayDamageTakenTriggers, resolveCommonPlayEffectActivation, type CommonPlayPersistentEffectDefinition } from "../domain/commonPlayEffectRuntime";'
          new_import='import { appendCommonPlayDamageTakenTriggers, compileCommonPlayEffectActivation, type CommonPlayPersistentEffectDefinition } from "../domain/commonPlayEffectRuntime";'
          if old_import in text:
              text=text.replace(old_import,new_import,1)
          elif new_import not in text:
              raise SystemExit("effect runtime import anchor changed")
          old='''  } else if(lowered.kind==="effect") {
            committed=resolveCommonPlayEffectActivation(SIMPLEVTT_APP_RULES_PROFILE,state,lowered.definition,{resolutionId,actorId:actor.id,entryPointId:action.entryPointId,actionKind});
          } else if(lowered.kind==="zone") {'''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new='''  } else if(lowered.kind==="effect") {
            const pending=compileCommonPlayEffectActivation(state,lowered.definition,{resolutionId,actorId:actor.id,entryPointId:action.entryPointId,actionKind});
            const effectDefinitions=await installedPersistentEffectDefinitions(adapter);
            const automaticPending=appendCommonPlaySemanticOutcomeTriggers(
              state,effectDefinitions,pending,Object.fromEntries(internal.scene.entities.map((entity)=>[entity.id,entity.kind==="character"?"character":"monster"])),
            );
            committed=appendCommonPlaySemanticOutcomeEvents(
              automaticPending,
              resolvePendingResolution(SIMPLEVTT_APP_RULES_PROFILE,state,automaticPending),
            );
          } else if(lowered.kind==="zone") {'''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit("effect activation branch anchor changed")
          path.write_text(text,encoding="utf-8")
          PY
      - name: Add focused production regression
        shell: bash
        run: |
          cat > tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import "../../src/app/offlineRuntimeAdapters";
          import "../../src/app/installedContentRuntimeAdapter";
          import { catalogQualifiedId } from "../../src/app/contentCatalogIdentity";
          import { installedCommonPlayActionId } from "../../src/app/installedCommonPlayActionReference";
          import { setInstalledContentStoreForTests } from "../../src/app/installedContentRuntimeAdapter";
          import { MemoryInstalledContentStore } from "../../src/app/memoryInstalledContentStore";
          import { MockAdapter } from "../../src/app/mockAdapter";

          function moduleJson(suffix:string) {
            const moduleId=`homebrew.state-applied-${suffix}`;
            const contentId=`option.state-applied-${suffix}`;
            const listenerId=`external.listener-${suffix}`;
            const markerId=`external.marker-${suffix}`;
            return {moduleId,contentId,listenerId,markerId,json:JSON.stringify({
              schemaVersion:"0.1-draft",moduleId,moduleVersion:"1",
              rulesProfile:{id:"dnd.srd-5.2.1",version:"0.1-draft"},defaultLocale:"en",
              source:{document:"State Applied Probe",version:"1",license:"CC0",srdDerived:false},
              dependencies:[],conflicts:[],capabilities:[],content:[{
                id:contentId,category:"option",
                presentation:{defaultLocale:"en",originalName:"State Applied Probe",locales:{en:{name:"State Applied Probe"}}},
                mechanics:[
                  {kind:"common-play",config:{schemaVersion:"0.2-draft",id:listenerId,entryPoints:[{id:"activate",invocation:"manual",operations:[{kind:"effect.apply",template:"listener",target:"actor"}]}],artifactTemplates:[{id:"listener",artifactKind:"effect",duration:{kind:"elapsed",amount:{value:1},unit:"hours"},rules:[{id:"on-state-applied",event:"state.applied",frequency:"once-per-resolution",operations:[{kind:"damage.apply",amount:{value:2},damageType:"force",target:"event.target"}]}],lifetime:{kind:"until-duration",onEnd:"destroy"}}]}},
                  {kind:"common-play",config:{schemaVersion:"0.2-draft",id:markerId,entryPoints:[{id:"apply",invocation:"manual",operations:[{kind:"effect.apply",template:"marker",target:"actor"}]}],artifactTemplates:[{id:"marker",artifactKind:"effect",duration:{kind:"elapsed",amount:{value:1},unit:"hours"},rules:[{id:"noop",event:"damage.taken",frequency:"once",operations:[{kind:"damage.apply",amount:{value:0},damageType:"force",target:"event.actor"}]}],lifetime:{kind:"until-duration",onEnd:"destroy"}}]}}
                ]
              }]
            })};
          }

          async function run(suffix:string) {
            const adapter=new MockAdapter();
            setInstalledContentStoreForTests(adapter,new MemoryInstalledContentStore());
            const pack=moduleJson(suffix);
            const preview=await adapter.previewContentImport(pack.json);
            assert.ok(!preview.contentImport?.validation.some((entry)=>entry.severity==="blocking"),JSON.stringify(preview.contentImport?.validation));
            await adapter.activateContentImport();
            await adapter.startInitiative();
            await adapter.setCurrentActor("char.aelar");
            const catalogId=catalogQualifiedId(pack.contentId,pack.moduleId,"1");
            const action=(mechanicId:string,entryPointId:string)=>installedCommonPlayActionId({catalogId,mechanicId,entryPointId});
            const before=await adapter.getSnapshot();
            const hpBefore=before.scene.entities.find((entity)=>entity.id==="char.aelar")!.hp;
            await adapter.resolveAction(action(pack.listenerId,"activate"),["char.aelar"]);
            let snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="char.aelar")!.hp,hpBefore);
            await adapter.resolveAction(action(pack.markerId,"apply"),["char.aelar"]);
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.resolution?.stage,"complete",JSON.stringify(snapshot.resolution));
            assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="char.aelar")!.hp,hpBefore-2,JSON.stringify(snapshot.resolution));
            assert.ok(snapshot.resolution?.detail.some((line)=>line.includes("state.applied")),JSON.stringify(snapshot.resolution));
            await adapter.undoLastResolution();
            snapshot=await adapter.getSnapshot();
            assert.equal(snapshot.scene.entities.find((entity)=>entity.id==="char.aelar")!.hp,hpBefore);
            return hpBefore;
          }

          test("unknown installed state.applied rule dispatches atomically and remains rename invariant",async()=>{
            assert.equal(await run("first"),await run("renamed"));
          });
          EOF
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate content catalogs
        run: npm run generate:content
      - name: Verify Family P state-applied production
        run: npx tsx --test tests/domain/commonPlaySemanticEventRuntime.test.ts tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts
      - name: Verify coverage and legacy boundaries
        run: node scripts/check-v1-mechanism-coverage.mjs && node scripts/check-legacy-execution-boundary.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Publish verified slice and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c9-family-p-state-applied-dispatch-71304.yml
          git add src/app/installedCommonPlayRuntimeAdapter.ts tests/ui/c9FamilyPStateAppliedTriggerProduction.test.ts
          git commit -m "feat(c9): dispatch state-applied effect activations"
          git pull --rebase origin agent/c9-gate-n-coverage-reconciliation
          git push origin HEAD:agent/c9-gate-n-coverage-reconciliation
