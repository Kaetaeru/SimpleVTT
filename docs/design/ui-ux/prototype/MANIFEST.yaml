  rebuild_contract:
    path: docs/design/ui-ux/prototype/PROTOTYPE-REBUILD-CONTRACT.md
    role: accepted_prototype_execution_history_and_build_contract
  design_defaults:
    path: docs/design/ui-ux/prototype/DESIGN-DEFAULTS.md
