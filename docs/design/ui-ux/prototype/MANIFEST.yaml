    authority: prototype_detail_only
  surfaces:
    path: docs/design/ui-ux/prototype/SURFACE-CATALOG.md
    role: prototype_surface_inventory
  components:
    path: docs/design/ui-ux/prototype/COMPONENT-CATALOG.md
    role: reusable_component_inventory
  layers:
    path: docs/design/ui-ux/prototype/LAYER-MODEL.md
    role: prototype_layer_and_coexistence_model
  states:
    path: docs/design/ui-ux/prototype/STATE-MODEL.md
    role: prototype_visible_state_model
  scenarios:
    path: docs/design/ui-ux/prototype/SCENARIO-CATALOG.md
    role: prototype_scenario_inventory
  mock_data:
    path: docs/design/ui-ux/prototype/MOCK-DATA-CONTRACT.md
    role: synthetic_non_authoritative_data_contract
  preflight:
    path: docs/design/ui-ux/prototype/PROTOTYPE-PREFLIGHT.md
    role: prototype_build_readiness_gate
  verification:
    path: docs/design/ui-ux/prototype/INTEGRATED-REFERENCE-VERIFICATION.md
    role: accepted_integrated_reference_static_verification
    candidate_code_reference: 4c12084bef603866b9b69f1bfd8f363146920184
  acceptance:
