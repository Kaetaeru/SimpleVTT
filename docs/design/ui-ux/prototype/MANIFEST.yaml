invalidated_candidates:
  - entry: docs/design/ui-ux/prototype/app/index.html
    status: rejected_superseded
    reason: owner_rejected_first_candidate
  - entry: docs/design/ui-ux/prototype/app/final-spec.html
    status: invalidated_by_repository_wide_audit
    reason: mapless_core_violation_and_fragmented_planning_drift
    material_evidence:
      - synthetic_scene_actor_xy_coordinates
      - battlemap_like_central_scene_interpretation
      - first_run_and_prior_planning_not_used_as_true_starting_baseline

prototype_rules:
  standalone_from_production_src: true
  may_import_src_runtime_code: false
  may_call_real_backend: false
  may_use_real_network: false
  may_mutate_real_data: false
  may_calculate_domain_rules: false
  unresolved_domain_architecture_may_be_mocked_for_presentation_only: true
  mock_semantics_are_product_authority: false
  current_code_is_evidence_only: true
  historical_agent_docs_are_evidence_only: true
  prototype_controls_are_product_ui: false
  first_run_must_begin_with_tutorial_panel: true
  initial_sheet_layout_choice_must_be_in_tutorial: true
  core_play_is_mapless: true
  core_actor_xy_coordinates_forbidden: true
  core_map_tokens_forbidden: true
  core_grid_path_los_fog_forbidden: true
  handout_is_not_battlemap: true
  standalone_roll_must_keep_current_sheet_visible_and_stable: true
  standalone_roll_detached_window_route_panel_forbidden: true
  connected_play_must_preserve_reviewed_actor_boards_and_command_center: true
  initiative_must_preserve_actor_boards: true
  freeform_fake_turn_economy_forbidden: true
  dm_player_must_share_core_play_skeleton: true
  historical_intent_first_funnel_is_not_primary_capability_access: true
  dm_library_is_private_local_preparation_source: true
  dm_library_must_not_be_sent_as_catalog_to_players: true
  dm_library_actor_add_creates_independent_session_instance: true
  dm_library_session_runtime_must_not_auto_write_back_to_source: true
  dm_library_image_preview_is_not_reveal: true
  dm_library_pc_actor_preset_is_not_player_owned_character: true

review_viewports:
  note: prototype_test_presets_not_canonical_product_breakpoints
  wide: 1600x1000
  normal: 1366x768
  narrow: 960x700

phase_gate:
  P0_specification:
    status: passed_for_existing_mapless_reference_dm_library_extension_spec_added
  P1_html_build:
    status: passed_for_existing_reference_dm_library_candidate_built_pending_review
    accepted_candidate: docs/design/ui-ux/prototype/app/integrated-reference.html
    accepted_candidate_code_reference: 4c12084bef603866b9b69f1bfd8f363146920184
    dm_library_candidate: docs/design/ui-ux/prototype/app/dm-library-reference.html
    verification: docs/design/ui-ux/prototype/INTEGRATED-REFERENCE-VERIFICATION.md
  P2_review_iteration:
    status: completed_for_existing_reference_reopened_for_dm_library_extension
  P3_owner_acceptance:
    status: passed_for_existing_reference_dm_library_extension_pending
    accepted_date: 2026-08-21
    acceptance_record: docs/design/ui-ux/prototype/PROTOTYPE-ACCEPTANCE.md
    dm_library_next_gate: owner_visual_and_flow_review
  P4_runtime_preparation:
    status: in_progress_not_ready_for_dm_library
    completed:
      - existing_prototype_owner_acceptance
      - existing_surface_contract_materialized
      - existing_component_contract_materialized
      - existing_interaction_state_layer_motion_contract_materialized
      - existing_implementation_traceability_materialized
      - dm_library_product_plan_materialized
      - dm_library_architecture_boundary_drafted
      - dm_library_prototype_candidate_built
    blocked_or_pending:
      - dm_library_owner_prototype_acceptance
      - GAP-DM-LIBRARY-METADATA-PERSISTENCE
      - GAP-DM-LIBRARY-ASSET-STORAGE
      - GAP-DM-LIBRARY-ACTOR-INSTANTIATION
      - GAP-DM-LIBRARY-PRIVATE-PROJECTION
      - GAP-HANDOUT-NETWORK-CONTRACT_for_connected_image_reveal
      - applicable_frozen_product_dependencies
      - scoped_runtime_authorization_after_review
  P5_runtime_ui_implementation:
    status: not_authorized_for_dm_library

blocking_rule:
  invalidated_candidate_must_not_be_reviewed_or_accepted: true
  accepted_candidate_must_remain_derived_from_integrated_plan: true
  accepted_prototype_does_not_freeze_product_decisions: true
  accepted_prototype_does_not_authorize_runtime_implementation: true
  existing_accepted_scenes_remain_valid_while_extension_is_pending: true
  dm_library_extension_must_pass_owner_review_before_acceptance: true
  dm_library_runtime_requires_architecture_gaps_and_scoped_authorization: true
  runtime_work_requires_scoped_gap_resolution_and_freeze_readiness: true
  broad_runtime_ui_must_not_start_before_P4_ready: true
