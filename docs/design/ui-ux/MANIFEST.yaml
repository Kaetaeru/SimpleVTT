schema_version: 2
system: simplevtt-ui-ux-planning
status: active
governance_maturity: stable_v1

validation:
  bounded_final_validation: passed
  scenario_count: 10
  preventive_meta_revalidation: only_on_material_governance_drift_or_explicit_request

primary_goals:
  - owner_control_easy
  - ai_interpretation_unambiguous
  - exhaustive_internal_coverage_without_owner_question_overload

entrypoints:
  owner: docs/design/ui-ux/README.md
  owner_review: docs/design/ui-ux/owner-review/README.md
  owner_control_policy: docs/design/ui-ux/OWNER-CONTROL-POLICY.md
  ai: docs/design/ui-ux/AI-READING-GUIDE.md
  preflight: docs/design/ui-ux/PREFLIGHT.md
  framework: docs/design/ui-ux-planning-framework.md

canonical_precedence_reference: docs/design/ui-ux-planning-framework.md

status_enums:
  decision: [Draft, Selected, Reviewed, Frozen, Superseded]
  planning_maturity: [Draft, Selected, Reviewed, Frozen, Superseded]
  review_status: [Not Started, In Review, Reviewed]
  contract_readiness: [None, Partial, Ready, Blocked]
  gap_status: [Open, Deferred, Resolved]
  gap_type: [OWNER_DECISION, DOMAIN_CONTRACT, ARCHITECTURE_CONTRACT, IMPLEMENTATION_BLOCKER, DOCUMENT_RECONCILIATION, COVERAGE]
  gap_severity: [Critical, Major, Normal]

reference_rules:
  full_ids_required: true
  ranges_forbidden: true
  omitted_prefixes_forbidden: true
  prose_substitutes_for_existing_ids_forbidden: true
  multi_value_separator: comma
  matrix_family_ids: [M1, M2, M3, M4, M5, M6]
  allowed_reference_kinds:
    - decision_id
    - review_question_id
    - planning_gap_id
    - registry_id
    - matrix_id
    - governance_sheet_id
    - contract_id
    - repository_path
  examples_valid:
    - UX-01-04
    - ORIGIN-UX-01-26
    - GAP-DM-ONLY-DELIVERY-PROTOCOL
    - R3-TARGET-SINGLE
    - M1
    - M2-PLY-004
    - A11Y-01
    - docs/design/session-runtime.md
  examples_invalid:
    - UX-01-04..06
    - ORIGIN-UX-01-26, 28
    - destination DM-01
    - STATE/A11Y review
  rule: references_must_be_exactly_resolvable_without_contextual_prefix_inference

owner_control:
  policy: docs/design/ui-ux/OWNER-CONTROL-POLICY.md
  mode: lightweight_material_checkpoints
  detailed_review_plan_is_owner_homework: false
  escalation_required_before_new_owner_question: true
  owner_checkpoint_categories:
    - major_user_workflow_or_mental_model
    - material_capability_scope
    - authority_privacy_or_disclosure
    - destructive_or_data_loss_behavior
    - material_platform_scope
    - materially_different_product_feel
  ai_design_default_categories:
    - typography_and_spacing
    - routine_component_states
    - iconography
    - ordinary_loading_empty_error_ui
    - ordinary_focus_and_keyboard_behavior
    - routine_responsive_reflow
    - low_risk_copy_and_confirmation_wording
    - component_internal_structure
    - non_authoritative_motion_polish
  never_owner_preference_categories:
    - rules_legality_or_calculation
    - canonical_main_hand_relation
    - authoritative_command_conflict_semantics
    - network_privacy_delivery
    - reconnect_projection
    - persistence_schema_security
  bundle_acceptance:
    field: 전체 추천안 사용
    accepted_value: YES
    per_question_override_field: OWNER SELECT
    custom_instruction_field: OWNER NOTE

sources:
  framework:
    path: docs/design/ui-ux-planning-framework.md
    role: governance_rules
    authority: canonical
    derived: false
  owner_control_policy:
    path: docs/design/ui-ux/OWNER-CONTROL-POLICY.md
    role: owner_question_escalation_and_ai_default_policy
    authority: canonical_process
    derived: false
    must_read_before_new_owner_question: true
  ai_reading_guide:
    path: docs/design/ui-ux/AI-READING-GUIDE.md
    role: task_router_and_reading_order
    authority: canonical_process
    derived: false
    must_read_for_ai_entry: true
  preflight:
    path: docs/design/ui-ux/PREFLIGHT.md
    role: start_work_consistency_gate
    authority: canonical_process
    derived: false
    must_pass_before_substantive_work: true
  owner_review:
    path: docs/design/ui-ux/owner-review/README.md
    role: owner_selection_workspace
    authority: explicit_owner_input_not_canonical_until_reconciled
    derived: false
    owner_editable: true
    current_checkpoint_file: docs/design/ui-ux/owner-review/02-key-decisions.md
    completed_large_worksheet: docs/design/ui-ux/owner-review/01-foundation-navigation-layout.md
    historical_detail_reference_files:
      - docs/design/ui-ux/owner-review/02-states-layering-confirmation.md
      - docs/design/ui-ux/owner-review/03-visual-components-content.md
      - docs/design/ui-ux/owner-review/04-accessibility-platform.md
      - docs/design/ui-ux/owner-review/05-dnd-experience.md
      - docs/design/ui-ux/owner-review/06-session-authority-dm-content.md
    historical_detail_files_are_required_owner_homework: false
    canonicalizes_into: docs/design/ui-ux/decisions.md
    candidate_options_are_product_truth: false
  dashboard:
    path: docs/design/ui-ux/README.md
    role: current_planning_status_and_next_action
    authority: derived_summary
    derived: true
  review_plan:
    path: docs/design/ui-ux/review-plan.md
    role: detailed_coverage_maps_and_dependency_catalog
    authority: canonical_for_detailed_question_coverage
    derived: false
    detailed_rows_are_owner_homework: false
    row_resolution_may_come_from:
      - canonical_decision
      - lightweight_owner_checkpoint
      - ai_design_default_contract
      - domain_or_architecture_contract
      - conditional_not_applicable
    review_order_change_requires_owner_approval_when_owner_checkpoints_are_affected: true
  decisions:
    path: docs/design/ui-ux/decisions.md
    role: canonical_decision_ledger
    authority: canonical_for_made_product_decisions
    derived: false
    status_values_must_match_enum_exactly: true
    structured_reference_fields: [Depends On, Destination, Planning Gap, Affects when ID-based, Supersedes, Superseded By]
  master_flow:
    path: docs/design/ui-ux/master-flow.md
    role: owner_friendly_product_flow_and_surface_topology_view
    authority: derived_view
    derived: true
    may_contain_normative_decision_bodies: false
  planning_gaps:
    path: docs/design/ui-ux/planning-gaps.md
    role: unresolved_material_no_invention_queue
    authority: canonical_for_known_gaps
    derived: false
    status_values_must_match_enum_exactly: true
    structured_reference_fields: [Owner Sheet, Depends On, Affected Decision, Affected Decisions, Resolved By]
  registry:
    path: docs/design/ui-ux/registry.md
    role: r1_r9_ui_inventory
    authority: derived_inventory
    derived: true
    structured_reference_fields: [Refs]
    human_readable_fields_not_parsed_as_reference_lists: [Owner, Note]
    status_axes:
      planning: {field: Planning, enum: planning_maturity}
      contract: {field: Contract, enum: contract_readiness}
  matrices:
    path: docs/design/ui-ux/matrices.md
    role: m1_m6_cross_cutting_coverage
    authority: derived_coverage
    derived: true
    structured_reference_fields: [M1.Source, M1.Gap, M2.Refs / Gap, M3.Refs / Gap, M4.Refs / Gap, M5.Refs / Gap, M6.Surface, M6 exact contract/test ID cells]
    human_readable_fields_not_parsed_as_reference_lists: [M6.Notes]
  templates:
    path: docs/design/ui-ux/templates.md
    role: copy_safe_artifact_templates
    authority: canonical_process_template
    derived: false

optional_families:
  surfaces: {path: docs/design/ui-ux/surfaces/, role: detailed_surface_contracts, materialize_when: spec_tier_requires}
  components: {path: docs/design/ui-ux/components/, role: reusable_component_contracts, materialize_when: spec_tier_requires}
  motion: {path: docs/design/ui-ux/motion/, role: material_motion_temporal_contracts, materialize_when: spec_tier_requires}
  work_orders: {path: docs/design/ui-ux/work-orders/, role: scoped_ai_implementation_handoffs, materialize_when: implementation_is_authorized_and_ready}

planning_gate:
  name: global_planning_gate
  status: passed
  blocks_owner_checkpoint_review: false
  completed_scope: current_active_runtime_and_planning_snapshot
  owner_review_mode: lightweight_material_checkpoints
  completed_owner_scope:
    - UX-01
    - UX-02
    - UX-03
    - NAV-01
    - UI-01
    - INT-01
  current_owner_checkpoint_file: docs/design/ui-ux/owner-review/02-key-decisions.md
  remaining_owner_checkpoint_count: 10
  remaining_owner_checkpoint_ids:
    - PLATFORM-01-01
    - SES-01-04
    - SES-01-02
    - DM-01-01
    - DM-02-01
    - DM-01-03
    - DM-02-05
    - CONTENT-02-04
    - CONTENT-02-09
    - CONTENT-02-11
  detailed_map_rows_not_in_this_list: ai_or_contract_resolution_unless_escalation_rule_triggers
  requirements:
    r1_r9_complete_inventory_cross_check: passed
    m1_m6_material_coverage: passed
    all_27_governance_decision_maps_complete: passed
    missing_duplication_coverage_audit: passed
    owner_whole_product_checkpoint: passed

maintenance_rules:
  - one_normative_fact_one_canonical_home
  - keep_owner_questions_few_material_and_reversible
  - detailed_review_plan_is_coverage_not_owner_homework
  - ai_must_name_owner_control_escalation_reason_before_asking_new_question
  - ai_design_defaults_must_stay_within_reviewed_decisions_and_authority_boundaries
  - domain_architecture_truth_is_never_recast_as_owner_preference
  - selected_reviewed_frozen_decisions_are_planning_truth_but_only_frozen_is_stable_for_implementation
  - current_code_is_evidence_not_automatic_product_truth
  - owner_never_manually_repairs_cross_references
  - master_flow_is_derived_owner_view_not_second_decision_store
  - registry_and_matrices_reference_canonical_sources_instead_of_copying_them
  - full_stable_references_only_in_structured_reference_fields

implementation_gate:
  planning_status_alone_authorizes_implementation: false
  owner_checkpoint_selection_alone_authorizes_implementation: false
  requires_scoped_work_order: true
  requires_applicable_frozen_dependencies: true
  requires_no_material_blocking_gap: true
  owner_acceptance_required: true
