schema_version: 2
system: simplevtt-ui-ux-planning
status: active

primary_goals:
  - owner_control_easy
  - ai_interpretation_unambiguous

entrypoints:
  owner: docs/design/ui-ux/README.md
  ai: docs/design/ui-ux/AI-READING-GUIDE.md
  preflight: docs/design/ui-ux/PREFLIGHT.md
  framework: docs/design/ui-ux-planning-framework.md

canonical_precedence_reference: docs/design/ui-ux-planning-framework.md

status_enums:
  decision:
    - Draft
    - Selected
    - Reviewed
    - Frozen
    - Superseded
  contract_readiness:
    - None
    - Partial
    - Ready
    - Blocked
  gap_status:
    - Open
    - Deferred
    - Resolved
  gap_type:
    - OWNER_DECISION
    - DOMAIN_CONTRACT
    - ARCHITECTURE_CONTRACT
    - IMPLEMENTATION_BLOCKER
    - DOCUMENT_RECONCILIATION
    - COVERAGE
  gap_severity:
    - Critical
    - Major
    - Normal

reference_rules:
  full_ids_required: true
  ranges_forbidden: true
  omitted_prefixes_forbidden: true
  prose_substitutes_for_existing_ids_forbidden: true
  multi_value_separator: comma
  allowed_reference_kinds:
    - decision_id
    - review_question_id
    - planning_gap_id
    - registry_id
    - matrix_id
    - governance_sheet_id
    - contract_id
    - repository_path
  examples_valid:
    - UX-01-04
    - ORIGIN-UX-01-26
    - GAP-DM-ONLY-DELIVERY-PROTOCOL
    - R3-TARGET-SINGLE
    - M2-PLY-004
    - A11Y-01
    - docs/design/session-runtime.md
  examples_invalid:
    - UX-01-04..06
    - ORIGIN-UX-01-26, 28
    - destination DM-01
    - STATE/A11Y review
  rule: references_must_be_exactly_resolvable_without_contextual_prefix_inference

sources:
  framework:
    path: docs/design/ui-ux-planning-framework.md
    role: governance_rules
    authority: canonical
    derived: false
    owner_edit_frequency: rare
    delegates_reading_order_to: docs/design/ui-ux/AI-READING-GUIDE.md
    delegates_preflight_to: docs/design/ui-ux/PREFLIGHT.md

  ai_reading_guide:
    path: docs/design/ui-ux/AI-READING-GUIDE.md
    role: task_router_and_reading_order
    authority: canonical_process
    derived: false
    must_read_for_ai_entry: true
    sole_owner_of_reading_order: true

  preflight:
    path: docs/design/ui-ux/PREFLIGHT.md
    role: start_work_consistency_gate
    authority: canonical_process
    derived: false
    must_pass_before_substantive_work: true
    sole_owner_of_start_work_checks: true

  dashboard:
    path: docs/design/ui-ux/README.md
    role: current_planning_status_and_next_action
    authority: derived_summary
    derived: true
    derived_from:
      - docs/design/ui-ux/AI-READING-GUIDE.md
      - docs/design/ui-ux/MANIFEST.yaml
      - docs/design/ui-ux/PREFLIGHT.md
      - docs/design/ui-ux/review-plan.md
      - docs/design/ui-ux/decisions.md
      - docs/design/ui-ux/master-flow.md
      - docs/design/ui-ux/planning-gaps.md
      - docs/design/ui-ux/registry.md
      - docs/design/ui-ux/matrices.md
      - docs/design/ui-ux/templates.md
    owner_default_entrypoint: true

  review_plan:
    path: docs/design/ui-ux/review-plan.md
    role: review_order_and_undecided_decision_maps
    authority: canonical_for_question_order
    derived: false
    contains_normative_decision_bodies: false
    review_order_change_requires_owner_approval: true
    global_planning_gate_owner: true
    structured_reference_fields:
      - Decision Map.Depends On
      - Decision Map.Destination

  decisions:
    path: docs/design/ui-ux/decisions.md
    role: canonical_decision_ledger
    authority: canonical_for_made_product_decisions
    derived: false
    contains_undecided_question_maps: false
    status_values_must_match_enum_exactly: true
    structured_reference_fields:
      - Depends On
      - Destination
      - Planning Gap
      - Affects when ID-based
      - Supersedes
      - Superseded By

  master_flow:
    path: docs/design/ui-ux/master-flow.md
    role: owner_friendly_product_flow_and_surface_topology_view
    authority: derived_view
    derived: true
    derived_from:
      - docs/design/ui-ux/decisions.md
      - docs/design/ui-ux/review-plan.md
      - docs/design/ui-ux/planning-gaps.md
      - docs/design/README.md
      - docs/design/character-lifecycle.md
      - docs/design/session-runtime.md
    may_contain_normative_decision_bodies: false
    owner_may_request_changes_through_view: true
    ai_must_translate_material_changes_to_canonical_sources_first: true
    current_view_status: Draft

  planning_gaps:
    path: docs/design/ui-ux/planning-gaps.md
    role: unresolved_material_no_invention_queue
    authority: canonical_for_known_gaps
    derived: false
    status_values_must_match_enum_exactly: true
    structured_reference_fields:
      - Owner Sheet
      - Depends On
      - Affected Decision
      - Affected Decisions
      - Resolved By

  registry:
    path: docs/design/ui-ux/registry.md
    role: r1_r9_ui_inventory
    authority: derived_inventory
    derived: true
    canonical_product_behavior_source: docs/design/ui-ux/decisions.md
    may_reference_review_questions: true
    may_reference_planning_gaps: true
    may_reference_domain_contracts: true
    references_must_follow_reference_rules: true
    structured_reference_fields:
      - Refs
    human_readable_fields_not_parsed_as_reference_lists:
      - Owner
      - Note
    status_axes:
      - planning_maturity
      - contract_readiness

  matrices:
    path: docs/design/ui-ux/matrices.md
    role: m1_m6_cross_cutting_coverage
    authority: derived_coverage
    derived: true
    canonical_product_behavior_source: docs/design/ui-ux/decisions.md
    may_reference_review_questions: true
    may_reference_planning_gaps: true
    may_reference_registry_ids: true
    may_reference_domain_contracts: true
    references_must_follow_reference_rules: true
    structured_reference_fields:
      - M1.Source
      - M1.Gap
      - M2.Refs / Gap
      - M3.Refs / Gap
      - M4.Refs / Gap
      - M5.Refs / Gap
      - M6.Surface
      - M6 exact contract/test ID cells

  templates:
    path: docs/design/ui-ux/templates.md
    role: copy_safe_artifact_templates
    authority: canonical_process_template
    derived: false
    preflight_source: docs/design/ui-ux/PREFLIGHT.md

optional_families:
  surfaces:
    path: docs/design/ui-ux/surfaces/
    role: detailed_surface_contracts
    materialize_when: spec_tier_requires
  components:
    path: docs/design/ui-ux/components/
    role: reusable_component_contracts
    materialize_when: spec_tier_requires
  motion:
    path: docs/design/ui-ux/motion/
    role: material_motion_temporal_contracts
    materialize_when: spec_tier_requires
  work_orders:
    path: docs/design/ui-ux/work-orders/
    role: scoped_ai_implementation_handoffs
    materialize_when: implementation_is_authorized_and_ready

planning_gate:
  name: global_planning_gate
  blocks_individual_review: true
  first_allowed_individual_decision_after_pass: UX-02-01
  requirements:
    - r1_r9_complete_inventory_cross_check
    - m1_m6_material_coverage
    - all_27_governance_decision_maps_complete
    - missing_duplication_coverage_audit_pass
    - owner_whole_product_checkpoint

maintenance_rules:
  - one_normative_fact_one_canonical_home
  - undecided_questions_live_in_review_plan_not_decision_ledger
  - decision_bodies_live_in_decision_ledger
  - master_flow_is_derived_owner_view_not_second_decision_store
  - registry_and_matrices_reference_canonical_sources_instead_of_copying_them
  - dashboard_is_summary_and_must_not_override_canonical_sources
  - exact_enum_values_only_in_structured_status_fields
  - full_stable_references_only_in_structured_reference_fields
  - derived_document_drift_must_be_fixed_before_substantive_work
  - current_code_is_evidence_not_automatic_product_truth
  - missing_material_policy_returns_planning_gap
  - owner_never_manually_repairs_cross_references
  - ai_may_propose_review_reorder_but_owner_must_approve

implementation_gate:
  planning_status_alone_authorizes_implementation: false
  requires_scoped_work_order: true
  requires_applicable_frozen_dependencies: true
  requires_no_material_blocking_gap: true
  owner_acceptance_required: true
