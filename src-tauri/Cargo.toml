[package]
name = "simplevtt"
version = "0.1.0"
description = "Local-first D&D virtual tabletop companion"
authors = ["Kaetaeru"]
edition = "2021"

[lib]
name = "simplevtt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
tauri-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
